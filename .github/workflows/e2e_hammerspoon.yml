name: E2E Hammerspoon

# NOTE: This workflow runs the virtual-keyboard E2E harness under plain Lua
# (same as the existing test_hammerspoon.yml). It exercises the full expansion
# pipeline — Registry + Expander — using the stub layer; real hs.eventtap
# injection is not possible in GitHub Actions because the macOS runners do not
# expose a Quartz WindowServer session to background jobs.
#
# See static/drivers/hammerspoon/tests/e2e/PLAN_E2E_REAL_HS.md for the full
# architecture of a real-device E2E run and the unblocking path.

on:
    push:
        branches: [main, dev]
        paths:
            - "static/drivers/hammerspoon/**"
            - "static/drivers/_shared/tests/corpus/hotstrings/**"
            - ".github/workflows/e2e_hammerspoon.yml"
    pull_request:
        branches: [main, dev]
        paths:
            - "static/drivers/hammerspoon/**"
            - "static/drivers/_shared/tests/corpus/hotstrings/**"
            - ".github/workflows/e2e_hammerspoon.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: e2e-hs-${{ github.ref }}
    cancel-in-progress: true

jobs:
    e2e:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Lua 5.4 + luarocks
              run: |
                  sudo apt-get update
                  sudo apt-get install -y lua5.4 liblua5.4-dev luarocks

            - name: Install luafilesystem
              # lfs is required by the shared helpers for directory recursion.
              run: sudo luarocks --lua-version 5.4 install luafilesystem

            - name: Run E2E virtual-keyboard harness
              # Runs run_e2e.lua which:
              #   1. Executes 5 hardcoded scenarios (self-validating the harness).
              #   2. Runs all corpus vectors from _shared/tests/corpus/hotstrings/vectors.json.
              # Exit code 0 = all pass, 1 = at least one failure.
              working-directory: static/drivers/hammerspoon
              run: lua5.4 tests/e2e/run_e2e.lua
              timeout-minutes: 5
