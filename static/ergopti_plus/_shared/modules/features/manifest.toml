id = "keyboard_slots"
# The configurable keyboard-shortcut groups. A "list" rather than a "group"
# because there are several of them and their contents are the user's own
# assignments, which no static entry can enumerate; the driver supplies the rows
# as data and the renderer draws them, so no menu row is built outside it.
#
# Both drivers render it from here. The Windows driver used to splice the same
# groups in with a Menu.Insert sequence that had already duplicated them once
# per updater refresh; a list entry cannot, because the renderer builds the menu
# fresh every time.
#
# Restricted on 2026-08-05 because Linux had no slot-binding surface at all:
# modules/shortcuts/manager.lua was toggles, selection transforms and wrap
# pairs, with no chord capture, no assignment store, and nothing for a list to
# enumerate. The note beside it said widening this again was a feature job
# rather than a projection job.
#
# Widened on 2026-08-06 because that feature job was done. The hook now reports
# which key a modified keystroke was rather than the bare string "shortcut",
# modules/shortcuts/keyboard_shortcuts.lua owns the slot space and the
# assignments, and the menu answers this row from them. Matching happens in the
# daemon rather than the kernel — there is no userland API on Linux to reserve a
# chord — which is why nothing is bound by default there.
platforms = ["ahk", "hs", "linux"]

[[menu.shortcuts_menu]]
type = "group"
id = "modifier_combos"
i18n = "menu.shortcuts.group_modifiers"
platforms = ["ahk"]

