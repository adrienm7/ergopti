# _shared/tap_hold/defaults.toml
# Canonical default values for the tap-hold configuration.
#
# READ AT RUNTIME, ON EVERY BOOT, BY ALL THREE DRIVERS. This header used to say
# the opposite — "generation source only … there is no runtime merge with this
# file" — and so did SCHEMA.md, in three places. Editing this file changes the
# behaviour of already-installed drivers on their next reload. Do not treat it
# as a template that only affects fresh installs.
#
# The three loaders do not agree with each other, and each one's own comments
# claim that it matches the others:
#   - Windows  lib/tap_hold/tap_hold_loader.ahk parses [tap_hold.*] here FIRST,
#              then merges the user file on top PER KEY. A key the user has not
#              overridden inherits the value below.
#   - Linux    platform/remap/manager.lua reads [tap_hold.*], but a user
#              tap_hold.toml, when present, REPLACES these defaults wholesale —
#              no per-key merge, so an edit here reaches only users without one.
#   - macOS    platform/remap/defaults.lua reads [hs_timeouts], [hs_tap_hold]
#              and [hs_combos] in its module body at require time. There is no
#              user file for those sections, so an edit here always applies.
#
# The two namespaces below describe the SAME seven physical keys under different
# ids (left_ctrl/left_control, left_alt/left_option), with different thresholds
# (0.2–0.35 s per key vs a flat 1000 ms global) and in places different actions
# — caps_lock holds ctrl under [tap_hold.*] and cmd under [hs_tap_hold].
# Unifying them is tracked as Lot 8(7); until then, a change to one namespace is
# NOT a change to the other.
#
# Consumers of the generated per-driver file:
#   - AHK : ``platform/remap.ahk`` arms the corresponding hotkeys.
#   - HS  : ``platform/remap/generator.lua`` produces the Karabiner JSON.





# =====================================
# =====================================
# ======= 1. Modifier-key holds =======
# =====================================
# =====================================

# Each key may declare:
#   - ``time_activation_seconds`` : tap (short) vs hold (long) threshold.
#   - ``tap_action``   : action emitted on tap (string or null = native key).
#   - ``hold_layer``   : layer activated on hold (ref to [tap_hold.layers.<name>]).
#   - ``hold_modifier``: modifier emitted on hold (mutex with hold_layer).
#
# tap_action and hold_* are independent — a key may declare only one of them.



# =========================
# ===== 1.1 caps_lock =====
# =========================

[tap_hold.keys.caps_lock]
time_activation_seconds = 0.35
tap_action = "enter"
hold_modifier = "ctrl"



# ==========================
# ===== 1.2 left_shift =====
# ==========================

[tap_hold.keys.left_shift]
time_activation_seconds = 0.35
tap_action = "copy"
hold_modifier = "shift"



# =========================
# ===== 1.3 left_ctrl =====
# =========================

[tap_hold.keys.left_ctrl]
time_activation_seconds = 0.20
tap_action = "paste"
hold_modifier = "ctrl"



# ========================
# ===== 1.4 left_alt =====
# ========================

[tap_hold.keys.left_alt]
time_activation_seconds = 0.20
tap_action = "backspace"
hold_layer = "nav"




# ==========================
# ===== 1.6 right_ctrl =====
# ==========================

[tap_hold.keys.right_ctrl]
time_activation_seconds = 0.20
tap_action = "one_shot_shift"
hold_modifier = "shift"



# ======================
# ===== 1.7 alt_gr =====
# ======================

[tap_hold.keys.alt_gr]
time_activation_seconds = 0.20
tap_action = "tab"
hold_modifier = "alt_gr"



# ===================
# ===== 1.8 tab =====
# ===================

[tap_hold.keys.tab]
time_activation_seconds = 0.20
tap_action = "alt_tab_monitor"
hold_modifier = "alt"





# =================================
# =================================
# ======= 2. Layer mappings =======
# =================================
# =================================

# A layer is a local key remapping that is active as long as its triggering key
# is held. Each mapping is source-key → action OR source-key → destination-key.



# =============================
# ===== 2.1 Layer ``nav`` =====
# =============================

# Primary navigation layer: arrows on HJKL plus quick editing actions.

[tap_hold.layers.nav]
description_key = "tap_hold.layer.nav"

[tap_hold.layers.nav.mappings]
h = "arrow_left"
j = "arrow_down"
k = "arrow_up"
l = "arrow_right"
backspace = "ctrl_backspace"
delete = "ctrl_delete"
u = "page_up"
d = "page_down"
g = "home"
shift_g = "end"



# =======================================
# ===== 2.2 Layer ``nav_secondary`` =====
# =======================================

# Secondary layer: word navigation and window management.

[tap_hold.layers.nav_secondary]
description_key = "tap_hold.layer.nav_secondary"

[tap_hold.layers.nav_secondary.mappings]
h = "word_prev"
l = "word_next"
j = "line_down"
k = "line_up"
backspace = "delete_word_back"
delete = "delete_word_forward"





# =================================================
# =================================================
# ======= 3. macOS Karabiner defaults (hs_*) =======
# =================================================
# =================================================

# Read by macos/platform/remap/defaults.lua via lib.toml_reader. These keep
# the macOS-specific paradigm (Karabiner key codes, the N*N modifier-combo
# matrix, a single global tap/hold timeout) that has no AutoHotkey analog, so
# they live in their own [hs_*] sections rather than the AHK [tap_hold.*] ones
# above. The AHK loader's narrow parser ignores every [hs_*] header; the macOS
# reader ignores the dotted [tap_hold.*] headers — each driver reads only its
# own sections from this single shared file.
#
# Values mirror the former platform/remap/defaults.lua exactly (generated and
# byte-verified against it). "Reset to defaults" on macOS restores these.

# Slot encodings:
#   [hs_tap_hold]  key = { tap = <action_id>, hold = <action_id> }
#   [hs_combos]    id  = { combo = <action_id>, tap = <action_id>, hold = <action_id> }
# Action ids reference macos/platform/remap/data/actions.json.

[hs_timeouts]
# Global tap-vs-hold threshold (KE basic.to_if_alone_timeout_milliseconds).
#
# 250 ms, not 1000. The old value was Karabiner-Elements' own default for
# to_if_alone_timeout_milliseconds rather than a decision, and it made macOS
# 3-5x slower than the other two drivers on the SAME setting: the
# [tap_hold.keys.*] block above — which Windows and Linux read and macOS does
# not — declares 0.20 s for five of its seven keys and 0.35 s for the other two.
# A full second means every hold takes a second to register, and any deliberate
# tap that overruns it silently becomes a hold.
#
# 250 ms sits inside the range the other two already use, so no key is more than
# 100 ms away from its Windows/Linux twin, against 650-800 ms before.
#
# The remaining gap is that this is ONE global where the others are per-key. The
# generator already supports a per-manipulator override
# (basic.to_if_alone_timeout_milliseconds, generator.lua), so wiring the
# [tap_hold.keys.*] values into it is the follow-up; it needs the two id
# vocabularies reconciled first (left_ctrl/left_control, left_alt/left_option).
tap_hold_timeout_ms = 250
# One-shot modifier auto-cancel delay.
sticky_timeout_ms = 3000
# Max delay between the two keys of a shortcut for the combo slot to fire.
simultaneous_threshold_ms = 100
# When true, A+B and B+A trigger the same chord (combo slot only).
combo_symmetric = false

[hs_tap_hold]
#                              tap               hold
escape = { tap = "none", hold = "none" }
tab = { tap = "alt_tab_windows", hold = "fn" }
caps_lock = { tap = "return", hold = "cmd" }
left_shift = { tap = "copy", hold = "shift" }
fn = { tap = "paste", hold = "cmd" }
left_control = { tap = "cut", hold = "ctrl" }
left_option = { tap = "delete_fwd", hold = "cmd_shift" }
left_command = { tap = "backspace", hold = "layer" }
spacebar = { tap = "none", hold = "none" }
right_command = { tap = "tab", hold = "altgr" }
right_option = { tap = "sticky_shift", hold = "shift" }
right_shift = { tap = "none", hold = "none" }
return_or_enter = { tap = "none", hold = "none" }
delete_or_backspace = { tap = "none", hold = "none" }

