          fi
        timeout-minutes: 8

      # The other direction: the metrics page posts its own {action: 'ready'}
      # object and must get the daemon's data back. Both halves went through
      # dkjson, which is not installed, so every tray window with a request of
      # its own stayed empty while the push test above stayed green.
      - name: A page's own request is answered in real WebKit
        if: ${{ !cancelled() && matrix.shard == 'desktop-webview' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          export LUA_PATH='./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;'
          export LUA_PATH="$LUA_PATH;/usr/share/lua/5.1/?.lua;/usr/share/lua/5.1/?/init.lua"
          export LUA_CPATH="/usr/lib/x86_64-linux-gnu/lua/5.1/?.so;;"
          xvfb-run -a luajit tests/hardware/run_webview_roundtrip.lua
          else
              exit 1
          fi
        timeout-minutes: 5

      - name: Typing NONE clears actual WebKit rows and retains ALL controls
        if: ${{ !cancelled() && matrix.shard == 'desktop-webview' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          export LUA_PATH='./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;'
          export LUA_PATH="$LUA_PATH;/usr/share/lua/5.1/?.lua;/usr/share/lua/5.1/?/init.lua"
          export LUA_CPATH="/usr/lib/x86_64-linux-gnu/lua/5.1/?.so;;"
          timeout 180s dbus-run-session -- xvfb-run -a luajit tests/hardware/run_typing_none_webkit.lua
          else
              exit 1
          fi
        timeout-minutes: 5

      - name: Install prerequisites for The release list window lists GitHub's releases in real WebKit
        if: ${{ !cancelled() && matrix.shard == 'desktop-webview' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends lua-luv
          else
              exit 1
          fi
        timeout-minutes: 20

      # The release list a user opens from the tray, opened: real WebKit, the
      # Linux bridge fetching GitHub's releases through its curl adapter. It
      # opened on the stable channel, which hides prereleases, and every
      # release is one: the window listed nothing.
      - name: The release list window lists GitHub's releases in real WebKit
        if: ${{ !cancelled() && matrix.shard == 'desktop-webview' }}
        working-directory: static/ergopti_plus/linux
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          export LUA_PATH='./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;'
          export LUA_PATH="$LUA_PATH;/usr/share/lua/5.1/?.lua;/usr/share/lua/5.1/?/init.lua"
          export LUA_CPATH="/usr/lib/x86_64-linux-gnu/lua/5.1/?.so;;"
          xvfb-run -a luajit tests/hardware/run_changelog_live.lua
          else
              exit 1
          fi
        timeout-minutes: 5

      - name: Install prerequisites for The WPM widget and tray readout draw on a real display
        if: ${{ !cancelled() && matrix.shard == 'desktop-webview' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends xdotool python3-gi gir1.2-glib-2.0 dbus xvfb
          else
              exit 1
          fi
        timeout-minutes: 20

      # The typing-speed readouts, drawn: the floating pill through its real GTK
      # surface (placed, painted in the source's colour, switched to the graph,
      # dragged by a real pointer) and the tray readout registered with a
      # StatusNotifier host. The widget called a renderer function that never
      # existed and read stats with no speed in them: it drew nothing anywhere.
      - name: The WPM widget and tray readout draw on a real display
        if: ${{ !cancelled() && matrix.shard == 'desktop-webview' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          export LUA_PATH='./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;'
          export LUA_PATH="$LUA_PATH;/usr/share/lua/5.1/?.lua;/usr/share/lua/5.1/?/init.lua"
          export LUA_CPATH="/usr/lib/x86_64-linux-gnu/lua/5.1/?.so;;"
          home="$(mktemp -d)"
          export HOME="$home" XDG_CONFIG_HOME="$home/.config" XDG_DATA_HOME="$home/.local/share"
          dbus-run-session -- bash -c '
            ready="$(mktemp -u)"
            python3 tests/hardware/sni_host.py --ready-file "$ready" --timeout 40 --settle 1 \
              --expect-icon-file > "$RUNNER_TEMP/sni-wpm.json" &
            host=$!
            for _ in $(seq 1 40); do [ -f "$ready" ] && break; sleep 0.25; done
            [ -f "$ready" ] || { echo "::error::the StatusNotifier host never started"; exit 1; }
            xvfb-run -a luajit tests/hardware/run_wpm_readouts_live.lua 6
            probe=$?
            wait "$host"; status=$?
            cat "$RUNNER_TEMP/sni-wpm.json"
            [ "$probe" = "0" ] || exit "$probe"
            grep -q "ergopti-plus-wpm" "$RUNNER_TEMP/sni-wpm.json" || { echo "::error::the readout item never registered"; exit 1; }
            exit "$status"'
          else
              exit 1
          fi
        timeout-minutes: 5

      # window.setData is undefined in the settings window, so the host's
      # `if(window.setData)` guard discards every push. Seven explanations are
      # ruled out, and the informative one is the last: an explicit
      # `window.setData = setData` at the END of the file changed nothing. If the
      # script ran to completion that line alone would be enough — so it throws.
      #
      # A throw during load is invisible to every probe run afterwards, because
      # by then the page merely looks incomplete. window.onerror only catches
      # what is raised after it is installed, and installing it with
      # run_javascript is too late by the whole page load — so this harness
      # builds the HTML itself and splices the trap in right after <head>.
      - name: What each page raises while loading
        if: ${{ !cancelled() && matrix.shard == 'desktop-webview' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          export LUA_PATH='./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;'
          export LUA_PATH="$LUA_PATH;/usr/share/lua/5.1/?.lua;/usr/share/lua/5.1/?/init.lua"
          export LUA_CPATH="/usr/lib/x86_64-linux-gnu/lua/5.1/?.so;;"
          set +e
          xvfb-run -a luajit tests/hardware/run_page_errors.lua
          STATUS=$?
          set -e
          if [ "$STATUS" = "2" ]; then
            echo "::error::WebKit/lgi unavailable — mandatory page-error coverage did not run."
            exit 1
          fi
          exit $STATUS
          else
              exit 1
          fi
        timeout-minutes: 5

      # Standard signed-APT Nix tool, one local store, existing physical phase owner.
      - name: Qualify genuine Nix installed runtime
        if: ${{ !cancelled() && matrix.shard == 'updater' }}
        env:
          ERGOPTI_NIX_EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          set -euo pipefail
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends nix-bin
          # This dedicated ephemeral runner may not adopt an occupied foreign store.
          if [ -L /nix ] || [ -L /nix/store ] || [ -L /nix/var ] || [ -L /nix/var/nix ] || [ -L /nix/var/log ] || [ -L /nix/var/log/nix ]; then
            echo "::error::Literal standard Nix store required."
            exit 1
          fi
          if [ -d /nix/store ] && [ -n "$(find /nix/store -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "::error::Occupied Nix store cannot be adopted."
            exit 1
          fi
          if [ -e /nix/var/nix/db/db.sqlite ]; then
            echo "::error::Existing Nix database cannot be adopted."
            exit 1
          fi
          if [ -d /nix/var/log/nix ] && [ -n "$(find /nix/var/log/nix -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "::error::Occupied Nix build logs cannot be adopted."
            exit 1
          fi
          runner_uid=$(id -u)
          runner_gid=$(id -g)
          # Builds also write the separate standard log tree; metadata does not.
          sudo install -d -m 0755 -o "$runner_uid" -g "$runner_gid" /nix/store /nix/var/nix /nix/var/log/nix
          umask 077
          npm run --silent test:linux:nix-native | tee "$RUNNER_TEMP/linux-nix-native.log"
          else
              exit 1
          fi
        timeout-minutes: 35

      - name: Record mandatory E2E evidence
        env:
          ERGOPTI_DEV_RELEASE_RELEASE: ${{ inputs.release }}
          ERGOPTI_DEV_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          ERGOPTI_DEV_RELEASE_CHANNEL: ${{ inputs.channel }}
          ERGOPTI_DEV_RELEASE_TAG: ${{ inputs.tag }}
          ERGOPTI_DEV_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
              node tools/test/linux-ci-evidence.cjs record-deferred-suite --job e2e-linux --shard "$LINUX_E2E_SHARD" --output "$RUNNER_TEMP/linux-ci-evidence/e2e-linux-$LINUX_E2E_SHARD.json" --sha "$GITHUB_SHA" --architecture "$RUNNER_ARCH" --receipt "$receipt"
              node tools/ci/dev-release-qualification.cjs --scope linux-simultaneous-native --receipt "$RUNNER_TEMP/stable-linux-simultaneous-native.json"
          elif [ "$mode" = full ]; then
          set -euo pipefail
          # Each shard counts only the logs its own steps wrote; linux-ok requires
          # one document per shard and every manifest subject exactly once.
          record=(node tools/test/linux-ci-evidence.cjs record
              --job e2e-linux
              --shard "$LINUX_E2E_SHARD"
              --output "$RUNNER_TEMP/linux-ci-evidence/e2e-linux-$LINUX_E2E_SHARD.json"
              --sha "$GITHUB_SHA"
              --architecture "$RUNNER_ARCH"
              --distro ubuntu
              --session x11-wayland-headless
              --interpreter "$(luajit -v 2>&1 | head -1)")
          case "$LINUX_E2E_SHARD" in
          input-display)
          e2e_assertions=$(sed -n 's/^1\.\.\([0-9][0-9]*\)$/\1/p' "$RUNNER_TEMP/linux-e2e.log" | tail -1)
          xkb_source_assertions=$(sed -n 's/^=== \([0-9][0-9]*\) check(s), 0 failure(s) ===$/\1/p' "$RUNNER_TEMP/linux-xkb-source.log" | tail -1)
          native_family_assertions=$(sed -n 's/^Native fixture family receipts: \([0-9][0-9]*\) passed, 0 failed, 0 skipped$/\1/p' "$RUNNER_TEMP/linux-window-switch.log" | tail -1)
          window_switch_assertions=$(sed -n 's/^Native window receipts: \([0-9][0-9]*\) passed, 0 failed, 0 skipped$/\1/p' "$RUNNER_TEMP/linux-window-switch.log" | tail -1)
          if [ -f "$RUNNER_TEMP/linux-window-qualification.json" ]; then
              window_switch_assertions=deferred
          fi
          "${record[@]}" \
              --subject uinput-roundtrip=1 \
              --subject grab-race=1 \
              --subject system-keymaps=1 \
              --subject "xkb-source-qualification=$xkb_source_assertions" \
              --subject "window-switch-receipts=$window_switch_assertions" \
              --subject "native-fixture-family=$native_family_assertions" \
              --subject x11-display=1 \
              --subject wayland-display=1 \
              --subject touchpad-capability=1 \
              --subject gesture-roundtrip=1 \
              --subject "hotstring-e2e=$e2e_assertions" \
              --subject ollama-live=1
          ;;
          desktop-webview)
          "${record[@]}" \
              --subject tray-symbols=1 \
              --subject tray-sni-registration=1 \
              --subject atspi-focus-probe=1 \
              --subject daemon-live=1 \
              --subject webview-settings=1 \
              --subject webview-editor=1 \
              --subject webview-roundtrip=1 \
              --subject page-load-errors=1
          ;;
          updater)
          nix_runtime_assertions=$(node tools/test/run-linux-nix-native.cjs --evidence "$RUNNER_TEMP/linux-nix-native.log" "$GITHUB_SHA")
          updater_native_namespace_assertions=$(node tools/test/run-linux-updater-temp-native.cjs --evidence namespace "$RUNNER_TEMP/linux-updater-temp-ownership.log" "$GITHUB_SHA")
          updater_temp_ownership_assertions=$(node tools/test/run-linux-updater-temp-native.cjs --evidence ownership "$RUNNER_TEMP/linux-updater-temp-ownership.log" "$GITHUB_SHA")
          updater_temp_allocation_assertions=$(node tools/test/run-linux-updater-temp-native.cjs --evidence allocation "$RUNNER_TEMP/linux-updater-temp-allocation.log" "$GITHUB_SHA")
          "${record[@]}" \
              --subject "nix-installed-runtime=$nix_runtime_assertions" \
              --subject "updater-native-namespace-cleanup=$updater_native_namespace_assertions" \
              --subject "updater-temp-ownership=$updater_temp_ownership_assertions" \
              --subject "updater-temp-allocation=$updater_temp_allocation_assertions"
          ;;
          network-ai)
          http_stream_assertions=$(sed -n 's/^PASS native HTTP streaming receipts: \([0-9][0-9]*\) checks$/\1/p' "$RUNNER_TEMP/linux-http-stream.log" | tail -1)
          network_runtime_assertions=$(node tools/test/linux-network-runtime-evidence.cjs "$RUNNER_TEMP/linux-network-runtime.log")
          fd_sha256_assertions=$(node tools/test/run-linux-fd-sha256-native.cjs --evidence "$RUNNER_TEMP/linux-fd-sha256-native.log")
          managed_http_output_assertions=$(node tools/test/linux-managed-http-evidence.cjs --count output "$RUNNER_TEMP/linux-managed-http-native.log" "$GITHUB_SHA")
          managed_http_public_assertions=$(node tools/test/linux-managed-http-evidence.cjs --count public "$RUNNER_TEMP/linux-managed-http-native.log" "$GITHUB_SHA")
          updater_archive_assertions=$(node tools/test/linux-updater-archive-evidence.cjs archive "$RUNNER_TEMP/linux-updater-archive-native.log")
          archive_crypto_assertions=$(node tools/test/linux-updater-archive-evidence.cjs crypto "$RUNNER_TEMP/linux-archive-source-controls.log")
          archive_bin_parent_assertions=$(node tools/test/linux-updater-archive-evidence.cjs parents "$RUNNER_TEMP/linux-archive-source-controls.log")
          archive_snapshot_assertions=$(node tools/test/linux-updater-archive-evidence.cjs snapshot "$RUNNER_TEMP/linux-archive-source-controls.log")
          connect_protocol_assertions=$(node tools/test/linux-updater-archive-evidence.cjs connect "$RUNNER_TEMP/linux-archive-source-controls.log")
          "${record[@]}" \
              --subject "http-stream-receipts=$http_stream_assertions" \
              --subject "managed-network-runtime=$network_runtime_assertions" \
              --subject "retained-fd-sha256=$fd_sha256_assertions" \
              --subject "managed-http-output=$managed_http_output_assertions" \
              --subject "managed-http-public=$managed_http_public_assertions" \
              --subject "updater-archive-pipeline=$updater_archive_assertions" \
              --subject "archive-source-crypto=$archive_crypto_assertions" \
              --subject "archive-source-bin-parent=$archive_bin_parent_assertions" \
              --subject "archive-private-snapshot=$archive_snapshot_assertions" \
              --subject "connect-terminal-protocol-model=$connect_protocol_assertions"
          ;;
          platform-metrics)
          "${record[@]}" \
              --subject native-platform-metrics=1
          ;;
          *)
              echo "::error::unknown Linux E2E shard: $LINUX_E2E_SHARD" >&2
              exit 1
          ;;
          esac
          else
              exit 1
          fi
      - name: Upload mandatory E2E evidence
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-ci-evidence-e2e-linux-${{ matrix.shard }}
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/e2e-linux-${{ matrix.shard }}.json
          if-no-files-found: error

      # ─────────────────────────────────────────────────
      # 3) Assemble the driver once, build every package, smoke two of them
      # ─────────────────────────────────────────────────
      # One assembly and one packaging pass per run, CI and release alike: the files
      # uploaded below as assets-linux are the ones the three package smoke rows install
      # and, on a release run, the ones ci.yml's release job publishes. The assembly
      # keeps its own smoke (no --skip-smoke), so the require checks that used to
      # run only on a release now run on every push and pull request.
      #
      # The driver's own version comes from inputs.version, the version ci.yml's plan
      # job computed ('' outside a release): ERGOPTI_BUILD_VERSION is stamped into
      # build/linux/_shared/build_stamp.txt by build-linux-driver.sh, and every
      # later verify in this job requires that same value, so the tray, the
      # healthcheck and the updater report the published release. The package
      # METADATA still takes its version from package.json, so the .deb "Version:"
      # and the .rpm "Version:" can lag the release tag: on dev the version is
      # 0.0.0-dev.N, and rpm rejects a hyphen in Version:, so the same value that a
      # .deb accepts would abort rpmbuild. Every published package is therefore
      # renamed below to a name that carries no version at all, so no asset can be
      # misnamed and the website's exact-name lookup keeps working.
      #
      # After e2e-linux: automatic runs require successful unit and E2E receiving.
      # Manual diagnostics can still receive packages after an E2E failure, with
      # successful unit admission retained through the E2E dependency. linux-ok
      # continues to reject every failed mandatory job and missing native subject.
      #
      # The tarball smoke runs here, on the build host, because it needs no
      # pristine machine: the tarball installs under $HOME. The Flatpak is built
      # and smoked by package-flatpak, a sibling job that starts from this job's
      # assets-linux bundle and runs beside install-linux, because its sandbox
      # luajit build alone took about four minutes of this job. The .deb, .rpm
      # and AppImage smokes each prove a dependency the host must NOT already
      # have, so they keep their own runners below.
      - name: Retain the source-bound linux-e2e-suite qualification
        if: ${{ always() && matrix.shard == 'desktop-webview' }}
        uses: actions/upload-artifact@v4
        with:
          name: assets-qualification-linux-e2e-suite
          path: ${{ runner.temp }}/stable-linux-e2e-suite.json
          if-no-files-found: warn
      - name: Retain the contained simultaneous qualification
        if: ${{ always() && matrix.shard == 'desktop-webview' }}
        uses: actions/upload-artifact@v4
        with:
          name: assets-qualification-simultaneous-contained
          path: ${{ runner.temp }}/stable-linux-simultaneous-native.json
          if-no-files-found: warn

  package-linux:
    name: 'Build (.deb, .rpm, AppImage and archive)'
    runs-on: ubuntu-latest
    needs: [e2e-linux]
    if: ${{ !cancelled() && needs.e2e-linux.outputs.ci_integration_result == 'success' && (needs.e2e-linux.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.e2e-linux.result == 'failure')) }}
    env:
      ERGOPTI_BUILD_VERSION: ${{ inputs.version }}
      LINUX_BUNDLE_ASSET: ${{ inputs.linux_bundle }}

    outputs:
      install_matrix: ${{ steps.install-plan.outputs.matrix }}
      install_metadata: ${{ steps.install-plan.outputs.metadata }}
      ci_predecessors: ${{ toJSON(needs) }}
      ci_source_sha: ${{ github.sha }}
      ci_run_id: ${{ github.run_id }}
      ci_attempt: ${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Admit genuine preceding scheduler results
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node tools/ci/ci-stage-status.cjs admit-build linux

      - name: Install LuaJIT
        # The assembly smoke below boots the driver with it and the tarball
        # smoke runs the installed tree with it. The AppImage bundles the
        # luajit of its own build container instead, see the next step.
        run: |
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y luajit lua-luv curl binutils pkg-config \
            libglib2.0-dev glib-networking dconf-gsettings-backend \
            gsettings-desktop-schemas

      - name: Assemble the driver bundle
        shell: bash
        env:
          ERGOPTI_BUILD_COMMIT: ${{ github.sha }}
        run: bash tools/build/build-linux-driver.sh

      - name: Build the native files and the AppImage on the oldest supported LTS
        # In an ubuntu:22.04 container, the release the AppImage catalogue tests
        # on: built here, the bundled luajit needed GLIBC_2.38 and the image
        # died there before showing its tray. The container also rebuilds the
        # driver's archive backend in the bundle, before every package below
        # is made from it. check-elf-glibc-ceiling.cjs refuses a newer need.
        shell: bash
        run: bash tools/build/appimage-oldest-lts.sh build

      - name: Package latest XKB files
        shell: bash
        run: |
          set -euo pipefail
          latest_dir=$(ls -d static/ergopti/linux/v*_* | sort -V | tail -1)
          dir_name=$(basename "$latest_dir")
          mkdir -p build/linux/xkb
          (cd static/ergopti/linux && zip -r "../../../build/linux/xkb/Ergopti_xkb.zip" "$dir_name")
          echo "Packaged XKB: $dir_name → Ergopti_xkb.zip"

      # A tarball, because the release used to publish install.sh, one wrapper
      # and ONE Lua file — so a user who downloaded it had an installer, no
      # driver and no shared tree, and could not install anything. The daemon
      # resolves _shared as a SIBLING of the driver, so the archive preserves
      # that layout rather than flattening it.
      - name: Package the installable bundle
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build/write_build_stamp.sh verify build/linux/_shared
          tar -czf "build/linux/$LINUX_BUNDLE_ASSET" -C build/linux linux _shared bin install.sh
          (cd build/linux && sha256sum "$LINUX_BUNDLE_ASSET" > "$LINUX_BUNDLE_ASSET.sha256")
          (cd build/linux && sha256sum --check "$LINUX_BUNDLE_ASSET.sha256")
          echo "Bundle contents:"
          tar -tzf "build/linux/$LINUX_BUNDLE_ASSET" | sed -n '1,20p'
          bundle_entries=$(tar -tzf "build/linux/$LINUX_BUNDLE_ASSET" | wc -l)
          echo "... $bundle_entries entries"

      - name: Install the packaging toolchains
        # rpmbuild is not on the runner image. appimagetool runs in the AppImage
        # build container above.
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y rpm
          rpmbuild --version

      - name: Build the .deb and the .rpm
        # No --skip-* flag anywhere: those return before dpkg-deb and rpmbuild
        # respectively, which is how the packagers stayed unexercised while CI
        # reported them green. The Flatpak is built by its own parallel job,
        # package-flatpak, from the bundle this job uploads.
        shell: bash
        # The two packagers stage under their own build/linux/ subdirectory
        # and only read the bundle, so they run at once. Each log is printed
        # whole, then any failure fails.
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/linux-packagers"
          mkdir -p "$logs"
          bash tools/build/build-linux-deb.sh > "$logs/deb.log" 2>&1 & deb=$!
          bash tools/build/build-linux-rpm.sh > "$logs/rpm.log" 2>&1 & rpm=$!
          failed=0
          for name in deb rpm; do
            status=0
            wait "${!name}" || status=$?
            echo "::group::$name packager (exit $status)"
            cat "$logs/$name.log"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::The $name packager failed (exit $status)."
              failed=1
            fi
          done
          exit "$failed"

      - name: Rename the packages to their stable asset names
        # Each packager names its output after the version in package.json, which
        # is not the release tag. A published asset must keep ONE name across
        # releases: the notes are static text and the website resolves its
        # download buttons by exact asset name (getGitHubRelease.js).
        #
        # It also closes a silent-skip hole. build-linux-appimage.sh exits 0 with
        # only the AppDir staged when appimagetool is absent, and the .rpm script
        # does the same without rpmbuild — so demanding the file here is what
        # turns "no package was produced" into a failure instead of a green run
        # with one asset missing.
        shell: bash
        run: |
          set -euo pipefail
          rename_one() {
              local found="$1" target="$2" kind="$3"
              if [ -z "$found" ]; then
                  echo "::error::the $kind packager produced no package — nothing to attach."
                  exit 1
              fi
              mv "$found" "$target"
              echo "  $kind -> $target ($(du -h "$target" | cut -f1))"
          }
          rename_one "$(find build/linux -maxdepth 1 -name '*.deb' -type f 2>/dev/null | head -1)" \
              build/linux/ErgoptiPlus-linux-amd64.deb ".deb"
          rename_one "$(find build/linux/rpm/RPMS -name '*.rpm' -type f 2>/dev/null | head -1)" \
              build/linux/ErgoptiPlus-linux-x86_64.rpm ".rpm"
          # The AppImage is built under its release name together with its .zsync
          # (tools/build/build-linux-appimage.sh checks both before it returns).
          for produced in build/linux/ErgoptiPlus-x86_64.AppImage build/linux/ErgoptiPlus-x86_64.AppImage.zsync; do
              if [ ! -s "$produced" ]; then
                  echo "::error::the AppImage packager produced no $produced — nothing to attach."
                  exit 1
              fi
          done

      - name: Log the package metadata
        # dpkg-deb --info, rpm -qip and rpm -qlp put the metadata and the file
        # list in the log, where a wrong control field or %files stanza is
        # visible without a Debian or Fedora box. sed rather than head: head
        # exits after its lines, and under pipefail the SIGPIPE it leaves rpm
        # with would fail a listing that succeeded.
        shell: bash
        run: |
          set -euo pipefail
          dpkg-deb --info build/linux/ErgoptiPlus-linux-amd64.deb
          rpm -qip build/linux/ErgoptiPlus-linux-x86_64.rpm
          rpm -qlp build/linux/ErgoptiPlus-linux-x86_64.rpm | sed -n '1,20p'

      # The no-root path the release notes point every other distribution at. It
      # is the only format whose installer is our own script rather than a
      # package manager, so it is the only one where a broken install.sh is
      # invisible everywhere else. --no-deps because the runner has what it needs
      # and the dependency install is the distro matrix's job, not this one's.
      # The archive installed is the very file uploaded below, not a twin.
      - name: Unpack and install the tarball the way a user would
        # --no-deps because package installs are the distro matrix's job, and
        # --no-service because a runner has no user session bus for a
        # systemd --user unit to register with. The permission setup DOES run:
        # it is the half every packaged format leaves to install.sh, so skipping
        # it would leave the one script nobody else exercises unexercised.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "build/linux/$LINUX_BUNDLE_ASSET" -C "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP/unpacked"
          test -f install.sh
          bash install.sh --no-deps --no-service || {
              echo "::error::install.sh failed on a clean unpack of the release tarball."
              exit 1
          }

      - name: Launch what the tarball installed
        run: |
          set -euo pipefail
          launcher="$HOME/.local/bin/ergopti-hotstrings"
          if [ ! -x "$launcher" ]; then
              echo "::error::install.sh left no executable launcher at $launcher"
              ls -la "$HOME/.local/bin" || true
              exit 1
          fi
          "$launcher" --help

      - name: The installed shared data tree resolves and opens
        run: |
          set -euo pipefail
          root="$HOME/.local/lib/ergopti"
          if [ ! -d "$root/linux" ]; then
              echo "::error::no driver tree at $root/linux — install.sh moved its install root."
              ls -la "$root" || true
              exit 1
          fi
          export LUA_PATH="$root/linux/?.lua;$root/linux/?/init.lua;$root/_shared/lua/?.lua;$root/_shared/lua/?/init.lua;;"
          luajit static/ergopti_plus/linux/tests/hardware/installed_layout_check.lua \
              "$root/_shared"

      - name: Upload packages
        # The one Linux artifact of the run: the smoke jobs below install from
        # it, and on a release run ci.yml's release job attaches every file in
        # it. Kept 7 days on a release run so that a next-day "Re-run failed
        # jobs" still finds it, 1 day otherwise.
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: assets-linux
          retention-days: ${{ inputs.release && 7 || 1 }}
          if-no-files-found: error
          path: |
            build/linux/xkb/Ergopti_xkb.zip
            build/linux/${{ env.LINUX_BUNDLE_ASSET }}
            build/linux/${{ env.LINUX_BUNDLE_ASSET }}.sha256
            build/linux/ErgoptiPlus-linux-amd64.deb
            build/linux/ErgoptiPlus-linux-x86_64.rpm
            build/linux/ErgoptiPlus-x86_64.AppImage
            build/linux/ErgoptiPlus-x86_64.AppImage.zsync

      - name: Record mandatory package evidence
        # One record for the four subjects this job proves. It is written only
        # when every step above passed, so no subject can be claimed by a
        # packaging run that stopped halfway.
        run: |
          set -euo pipefail
          node tools/test/linux-ci-evidence.cjs record \
              --job package-linux --output "$RUNNER_TEMP/linux-ci-evidence/package-linux.json" \
              --sha "$GITHUB_SHA" --architecture "$RUNNER_ARCH" --distro ubuntu \
              --session packaging --interpreter "$(luajit -v 2>&1 | head -1)" \
              --subject build-deb=1 \
              --subject build-rpm=1 \
              --subject build-appimage=1 \
              --subject smoke-tarball-install=1

      - name: Upload mandatory package evidence
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-ci-evidence-package-linux
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/package-linux.json
          if-no-files-found: error

      - name: Plan every authored installation lot
        id: install-plan
        run: node tools/ci/linux-install-matrix.cjs

  # ─────────────────────────────────────────────────
  # 3a) Build and smoke the Flatpak, beside the install cells
  # ─────────────────────────────────────────────────
  # Built from the exact tarball package-linux uploaded in assets-linux (the
  # driver bundle every other package was made from), unpacked into build/linux
  # where build-linux-flatpak.sh expects it. It runs in parallel with
  # install-linux; linux-ok needs both, and its published file travels in its
  # own assets-linux-flatpak artifact, which the release collects through its
  # assets-* pattern. A skipped package-linux skips this job, and linux-ok then
  # fails on the missing result.
  package-flatpak:
    name: 'Flatpak (Build, install and launch)'
    runs-on: ubuntu-latest
    needs: [package-linux]
    env:
      LINUX_BUNDLE_ASSET: ${{ inputs.linux_bundle }}
    outputs:
      ci_predecessors: ${{ toJSON(needs) }}
      ci_source_sha: ${{ github.sha }}
      ci_run_id: ${{ github.run_id }}
      ci_attempt: ${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Download the driver bundle built above
        uses: actions/download-artifact@v4
        with:
          name: assets-linux
          path: ${{ runner.temp }}/assets-linux

      - name: Unpack the exact bundle the other packages were made from
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/assets-linux"
          (cd "$src" && sha256sum --check "$LINUX_BUNDLE_ASSET.sha256")
          mkdir -p build/linux
          tar -xzf "$src/$LINUX_BUNDLE_ASSET" -C build/linux
          test -f build/linux/linux/ergopti_hotstrings.lua
          bash tools/build/write_build_stamp.sh verify build/linux/_shared

      # The runtime version is read from the packager that pins it, so the cache key and
      # the install can never name a runtime the manifest does not use.
      - name: Read the Flatpak runtime version
        id: flatpak-runtime
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n "s/^runtime-version: '\([0-9][0-9.]*\)'$/\1/p" tools/build/build-linux-flatpak.sh)"
          test -n "$version"
          test "$(printf '%s\n' "$version" | wc -l)" = 1
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Downloading the two runtimes from Flathub took 34 to 45 minutes in three of the five
      # CI runs measured on 2026-10-23 and under two minutes in the others, which made this
      # job the end of the Linux lane. They are cached before anything of Ergopti is
      # installed; the save below runs right after the download so the cache never holds
      # the application, whose fresh installation the later steps must prove.
      - name: Restore the Flatpak runtimes
        id: flatpak-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-${{ steps.flatpak-runtime.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install the Flatpak toolchain
        shell: bash
        # A stalled Flathub download must fail the job, not hold the lane for 45 minutes.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y flatpak flatpak-builder
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 ||
              echo "::notice::no apparmor_restrict_unprivileged_userns knob here — continuing"
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          version='${{ steps.flatpak-runtime.outputs.version }}'
          flatpak install --user -y flathub "org.freedesktop.Platform//$version" "org.freedesktop.Sdk//$version"

      - name: Save the Flatpak runtimes
        if: steps.flatpak-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.local/share/flatpak
          key: ${{ steps.flatpak-cache.outputs.cache-primary-key }}

      - name: Build the Flatpak
        # No --skip-flatpak: that flag returns before flatpak-builder. The
        # Flatpak compiles its own luajit inside the sandbox.
        shell: bash
        run: bash tools/build/build-linux-flatpak.sh

      - name: The staged payload carries the driver and the shared data tree
        # The packager checks its own manifest; this checks the payload, which is
        # the part a copy that silently did nothing would leave empty.
        run: |
          set -euo pipefail
          fail=0
          for f in build/linux/flatpak/org.ergopti.Ergopti.yml \
                   build/linux/flatpak/payload/bin/ergopti \
                   build/linux/flatpak/payload/lib/ergopti/ergopti_hotstrings.lua \
                   build/linux/flatpak/payload/lib/ergopti/infra/paths.lua \
                   build/linux/flatpak/payload/lib/ergopti/_shared/lua/logger/shim.lua \
                   build/linux/flatpak/payload/lib/ergopti/_shared/data/locales/en.json; do
              if [ ! -f "$f" ]; then
                  echo "::error::the Flatpak payload is missing $f"
                  fail=1
              fi
          done
          exit $fail

      - name: Rename the Flatpak to its stable asset name
        # A published asset keeps ONE name across releases, see package-linux.
        shell: bash
        run: |
          set -euo pipefail
          found="$(find build/linux -maxdepth 1 -name '*.flatpak' -type f 2>/dev/null | head -1)"
          if [ -z "$found" ]; then
              echo "::error::the Flatpak packager produced no package — nothing to attach."
              exit 1
          fi
          mv "$found" build/linux/ErgoptiPlus-linux-x86_64.flatpak
          echo "  Flatpak -> build/linux/ErgoptiPlus-linux-x86_64.flatpak ($(du -h build/linux/ErgoptiPlus-linux-x86_64.flatpak | cut -f1))"

      # The sandboxed path. `flatpak run` is what a user's launcher invokes, and
      # it is the only one of the five formats that executes inside the
      # confinement the manifest declares — so a permission the driver needs and
      # the manifest forgot shows up here rather than on a user's machine. Flathub
      # and the runtime are already installed by the toolchain step above.
      - name: Install the Flatpak the way a user would
        run: |
          set -euo pipefail
          bundle=build/linux/ErgoptiPlus-linux-x86_64.flatpak
          if [ ! -f "$bundle" ]; then
              echo "::error::no Flatpak bundle at $bundle — nothing to install."
              exit 1
          fi
          flatpak install --user -y --bundle "$bundle"
          flatpak list --user --app

      - name: Launch the Flatpak
        run: flatpak run --user org.ergopti.Ergopti --help

      - name: The sandboxed shared data tree resolves and opens
        # Run INSIDE the sandbox with --command, so this reads /app exactly as
        # the daemon does. The check script is bound in read-only from the
        # checkout because the package deliberately ships no tests.
        run: |
          set -euo pipefail
          check_dir="$(pwd)/static/ergopti_plus/linux/tests/hardware"
          flatpak run --user \
              --filesystem="$check_dir:ro" \
              --env=LUA_PATH="/app/lib/ergopti/?.lua;/app/lib/ergopti/?/init.lua;/app/lib/ergopti/_shared/lua/?.lua;/app/lib/ergopti/_shared/lua/?/init.lua;;" \
              --command=luajit org.ergopti.Ergopti \
              "$check_dir/installed_layout_check.lua" /app/lib/ergopti/_shared

      - name: Upload the Flatpak
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: assets-linux-flatpak
          retention-days: ${{ inputs.release && 7 || 1 }}
          if-no-files-found: error
          path: build/linux/ErgoptiPlus-linux-x86_64.flatpak

      - name: Record mandatory Flatpak evidence
        # Written only when every step above passed.
        run: |
          set -euo pipefail
          node tools/test/linux-ci-evidence.cjs record \
              --job package-flatpak --output "$RUNNER_TEMP/linux-ci-evidence/package-flatpak.json" \
              --sha "$GITHUB_SHA" --architecture "$RUNNER_ARCH" --distro ubuntu \
              --session packaging --interpreter "$(flatpak --version)" \
              --subject build-flatpak=1 \
              --subject smoke-flatpak-run=1

      - name: Upload mandatory Flatpak evidence
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-ci-evidence-package-flatpak
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/package-flatpak.json
          if-no-files-found: error

  # ─────────────────────────────────────────────────
  # 3) Install and run every Linux distribution and package
  # ─────────────────────────────────────────────────
  # One matrix gives the Linux lane one install block in GitHub's run graph.
  # Archive installs use each distribution's container and LuaJIT. First-run
  # checks use Docker from the host, with all installer dependencies enabled.
  # Fedora's first-run rows declare its LuaJIT/lgi WebKit limitation explicitly.
  # deb and AppImage run on the host; rpm uses Fedora without preinstalled
  # LuaJIT, so dependency resolution and the bundled interpreter remain tested.
  # An empty scalar container means a host job in the GitHub runner.
  install-linux:
    name: 'Install and launch'
    runs-on: ubuntu-latest
    needs: [package-linux]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package-linux.outputs.install_matrix) }}
    container: ${{ fromJSON(needs.package-linux.outputs.install_metadata)[matrix.lot].container }}
    env:
      INSTALL_ID: ${{ fromJSON(needs.package-linux.outputs.install_metadata)[matrix.lot].id }}
      INSTALL_KIND: ${{ fromJSON(needs.package-linux.outputs.install_metadata)[matrix.lot].kind }}
      INSTALL_DISTRO: ${{ fromJSON(needs.package-linux.outputs.install_metadata)[matrix.lot].distro }}
      INSTALL_IMAGE: ${{ fromJSON(needs.package-linux.outputs.install_metadata)[matrix.lot].image }}
      INSTALL_PREP: ${{ fromJSON(needs.package-linux.outputs.install_metadata)[matrix.lot].prep }}
      INSTALL_KNOWN: ${{ fromJSON(needs.package-linux.outputs.install_metadata)[matrix.lot].known }}
    outputs:
      ci_predecessors: ${{ toJSON(needs) }}
      ci_source_sha: ${{ github.sha }}
      ci_run_id: ${{ github.run_id }}
      ci_attempt: ${{ github.run_attempt }}

    steps:
      - name: Require a declared installation lot
        shell: sh
        run: |
          set -eu
          test -n "$INSTALL_ID"
          case "$INSTALL_KIND" in
            install|first|deb|rpm|appimage) ;;
            *) exit 1 ;;
          esac

      - name: Prepare the container
        if: env.INSTALL_KIND == 'install'
        shell: sh
        run: ${{ env.INSTALL_PREP }}

      - name: Tools the job itself needs (rpm)
        if: env.INSTALL_KIND == 'rpm'
        # Deliberately NOT luajit: the .rpm declares `Requires: luajit >= 2.1`,
        # so letting dnf resolve it from the package is what proves that
        # declaration is right. Pre-installing it would hide a wrong Requires.
        # git is for actions/checkout, findutils for the `find` below.
        shell: bash
        run: dnf install -y git findutils

      - uses: actions/checkout@v4

      - name: Verify source compiler and checkout
        if: env.INSTALL_KIND == 'install'
        shell: bash
        run: |
          set -euo pipefail
          # Checkout's temporary HOME does not carry ownership admission into this step.
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          source static/ergopti_plus/linux/install/native_source_build.sh
          native_source_compile_probe "$GITHUB_WORKSPACE/static/ergopti_plus/linux/native/archive_output"

      - name: Create the installation user
        if: env.INSTALL_KIND == 'install'
        shell: bash
        run: |
          set -euo pipefail
          if command -v useradd >/dev/null 2>&1; then
            useradd -m -d /tmp/ergopti-home -s /bin/bash ergopti-ci
          else
            adduser -D -h /tmp/ergopti-home -s /bin/bash ergopti-ci
          fi
          test "$(id -u ergopti-ci)" -ge 1000
          install -d -m 0750 /etc/sudoers.d
          printf '%s\n' 'ergopti-ci ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/ergopti-ci
          chmod 0440 /etc/sudoers.d/ergopti-ci

      - name: Install as an ordinary user without runtime dependencies
        if: env.INSTALL_KIND == 'install'
        working-directory: static/ergopti_plus/linux
        # The installer owns user files; only its real permission helper gets
        # sudo. There is no user session bus, so startup must use XDG autostart.
        # Running as root with a different HOME is not an ordinary user install.
        shell: bash
        run: |
          set -euo pipefail
          # Model a login, not a nested sudo invocation whose SUDO_UID is root.
          sudo -H -u ergopti-ci env -u SUDO_UID -u SUDO_GID -u SUDO_USER bash install.sh --no-deps

      - name: The installed tree is the one the daemon expects
        if: env.INSTALL_KIND == 'install'
        shell: bash
        run: |
          export HOME=/tmp/ergopti-home
          FAIL=0
          # The wrapper is what a user types. Without it nothing else matters.
          if [ ! -x "$HOME/.local/bin/ergopti-hotstrings" ]; then
            echo "::error::no executable at ~/.local/bin/ergopti-hotstrings"
            FAIL=1
          fi
          # The driver root and the shared tree must be SIBLINGS: infra/paths.lua
          # resolves _shared as ../_shared from the driver root and probes it, so a
          # layout that nests them differently boots to "shared tree not found".
          for path in "$HOME/.local/lib/ergopti/linux/ergopti_hotstrings.lua" \
                      "$HOME/.local/lib/ergopti/_shared/data/locales/en.json"; do
            if [ ! -f "$path" ]; then
              echo "::error::missing $path"
              FAIL=1
            fi
          done
          # A hotstring pack, because an install with no hotstrings is an install
          # that runs and does nothing.
          if ! ls "$HOME/.local/lib/ergopti/_shared/modules/hotstrings/"*.toml >/dev/null 2>&1; then
            echo "::error::no hotstring packs were installed"
            FAIL=1
          fi
          exit $FAIL
        timeout-minutes: 5

      # The whole unit suite, on THIS distribution's own LuaJIT.
      #
      # Everything else in this workflow runs on Ubuntu's build, so a difference
      # that belongs to the interpreter or the C library is invisible to it —
      # and those are the differences that actually bite here. Alpine is musl
      # rather than glibc; Arch ships whatever LuaJIT released last; several
      # distributions patch it. The suite also measures actual native filesystem,
      # timers and supervised Python/curl children. Build pinned luv/lfs against
      # the native interpreter and retain the ordinary UID and writable source.
      # The earlier no-dependencies installation contract remains unchanged.
      #
      # LuaJIT is the production interpreter. A distribution lane without it is
      # not evidence about the driver and therefore cannot satisfy this gate.
      - name: The unit suite on this distribution's LuaJIT
        if: env.INSTALL_KIND == 'install'
        working-directory: static/ergopti_plus/linux
        shell: bash
        run: |
          set -euo pipefail
          # Retain the suite's real supervised-curl prerequisite. The incoming
          # pinned native helper owns Python and ABI-compatible luv/lfs builds.
          case "${{ env.INSTALL_DISTRO }}" in
            debian)   apt-get install -y --no-install-recommends curl ;;
            fedora)   dnf install -y curl ;;
            arch)     pacman -Sy --noconfirm curl ;;
            alpine)   apk add --no-cache curl ;;
            opensuse) zypper --non-interactive install curl ;;
            *) echo "::error::unknown archive unit distribution"; exit 1 ;;
          esac
          command -v curl

          # Root bypasses the suite's real unreadable-file permission premise.
          # Keep the checkout untouched and give the installation user a private
          # writable source tree, including every original test and shared file.
          test "$(id -u ergopti-ci)" -ge 1000
          unit_root="$(mktemp -d)"
          readonly unit_root
          trap 'rm -rf -- "$unit_root"' EXIT
          cp -a "$GITHUB_WORKSPACE/." "$unit_root/"
          chown -R ergopti-ci:ergopti-ci "$unit_root"
          unit_log_dir="$RUNNER_TEMP/linux-distro-unit-logs"
          mkdir -p "$unit_log_dir"
          unit_log="$unit_log_dir/${{ env.INSTALL_DISTRO }}.log"
          set +e
          (cd "$unit_root/static/ergopti_plus/linux" &&
            bash "$GITHUB_WORKSPACE/tools/test/prepare-linux-distro-unit.sh" "${{ env.INSTALL_DISTRO }}") \
            2>&1 | tee "$unit_log"
          unit_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          native_status="${unit_pipeline_status[0]}"
          set +e
          python3 - "$unit_log" "$unit_root/static/ergopti_plus/linux/tests/run.lua" \
            '${{ env.INSTALL_DISTRO }}' "$native_status" <<'PYTHON'
          import pathlib
          import re
          import sys

          log_path, runner_path, distro, native_status = sys.argv[1:]
          text = pathlib.Path(log_path).read_text(encoding="utf-8", errors="replace")
          runner = pathlib.Path(runner_path).read_text(encoding="utf-8")
          groups_path = pathlib.Path(runner_path).parent / "support" / "module_groups.lua"
          groups = re.findall(r'\{ name = "([a-z_]+)"', groups_path.read_text(encoding="utf-8"))
          separator = "=" * 40
          template = r"\n" + separator + r"\nOVERALL RESULTS:\nTotal modules: %d\nPassed tests:  %d\nFailed tests:  %d\n" + separator

          def annotation(kind, message):
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::" + kind + " title=Linux distro unit suite::" + message)

          if native_status != "0":
              for line in text.splitlines():
                  if line.startswith("tests/run.lua: ") or line.startswith("luajit: "):
                      annotation("error", distro + ": " + line)

          # Couple only to the existing runner's exact format string, not a second tally.
          if runner.count('"' + template + '"') != 1:
              annotation("error", distro + ": native runner summary format is unavailable; inspect the raw artifact")
              raise SystemExit(2)
          # The helper runs every module group at once and prints each log whole
          # under its header, in the order tests/support/module_groups.lua declares.
          parts = re.split(r"(?m)^distro-unit-group ([a-z_]+)\n", text)
          names = parts[1::2]
          if not groups or names != groups:
              annotation("error", distro + ": native exit " + native_status + "; expected the groups " + ", ".join(groups) + ", received " + ", ".join(names) + "; inspect the raw artifact")
              raise SystemExit(2)
          pattern = re.compile(r"(?m)^" + separator + r"\nOVERALL RESULTS:\nTotal modules: ([0-9]+)\nPassed tests:  ([0-9]+)\nFailed tests:  ([0-9]+)\n" + separator + r"(?:\n|$)")
          totals = [0, 0, 0]
          for name, body in zip(names, parts[2::2]):
              frames = list(pattern.finditer(body))
              if len(frames) != 1 or len(re.findall(r"(?m)^OVERALL RESULTS:$", body)) != 1:
                  annotation("error", distro + " " + name + ": native exit " + native_status + "; expected one complete summary, received " + str(len(frames)) + "; inspect the raw artifact")
                  raise SystemExit(2)
              frame = frames[0]
              modules, passed, failed = map(int, frame.groups())
              if modules <= 0 or passed + failed <= 0 or (native_status == "0" and failed != 0):
                  annotation("error", distro + " " + name + ": native exit/summary contradiction; inspect the raw artifact")
                  raise SystemExit(2)
              totals = [totals[0] + modules, totals[1] + passed, totals[2] + failed]
              # Emit the actual runner's failure and module-load first lines without deriving
              # expected results. Full traceback/replay bytes remain in the uploaded raw log.
              if native_status != "0":
                  for line in body[:frame.start()].splitlines():
                      if line.startswith("  ! load error in "):
                          annotation("error", distro + " " + name + ": " + line.strip())
                  for line in body[frame.end():].splitlines():
                      if line.startswith("  - ") or line.startswith("    replay: "):
                          annotation("error", distro + " " + name + ": " + line.strip())
          summary = distro + ": native exit " + native_status + "; groups=" + str(len(names)) + ", modules=" + str(totals[0]) + ", passed=" + str(totals[1]) + ", failed=" + str(totals[2])
          annotation("notice" if native_status == "0" else "error", summary)
          PYTHON
          diagnostic_status=$?
          set -e
          # Diagnostics and tee must never turn a refused native run green.
          if [[ "$native_status" -ne 0 ]]; then exit "$native_status"; fi
          if [[ "${unit_pipeline_status[1]}" -ne 0 ]]; then exit "${unit_pipeline_status[1]}"; fi
          exit "$diagnostic_status"
        timeout-minutes: 10

      - name: Upload the native distro unit log
        if: ${{ !cancelled() && env.INSTALL_KIND == 'install' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-distro-unit-log-${{ env.INSTALL_DISTRO }}
          retention-days: 7
          path: ${{ runner.temp }}/linux-distro-unit-logs/${{ env.INSTALL_DISTRO }}.log
          if-no-files-found: warn

      - name: Record mandatory distro evidence
        if: env.INSTALL_KIND == 'install'
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/linux-ci-evidence"
          mkdir -p "$evidence_dir"
          printf '%s\n' \
            '{' \
            '  "schema_version": 1,' \
            '  "job": "install-linux",' \
            "  \"sha\": \"$GITHUB_SHA\"," \
            "  \"architecture\": \"$RUNNER_ARCH\"," \
            '  "distro": "${{ env.INSTALL_DISTRO }}",' \
            '  "session": "container",' \
            '  "interpreter": "LuaJIT",' \
            '  "subjects": { "distro-${{ env.INSTALL_DISTRO }}": 1 }' \
            '}' > "$evidence_dir/${{ env.INSTALL_DISTRO }}.json"

      - name: Upload mandatory distro evidence
        if: env.INSTALL_KIND == 'install'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-ci-evidence-distro-${{ env.INSTALL_DISTRO }}
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/${{ env.INSTALL_DISTRO }}.json
          if-no-files-found: error

      - name: Install on ${{ env.INSTALL_IMAGE }} and verify the first run
        if: env.INSTALL_KIND == 'first'
        timeout-minutes: 25
        shell: bash
        env:
          ERGOPTI_E2E_PREP: ${{ env.INSTALL_PREP || '' }}
        run: |
          set -euo pipefail
          export ERGOPTI_E2E_DOCKER_ARGS="-e ERGOPTI_E2E_PREP -e ERGOPTI_E2E_KNOWN_LIMITATIONS=${{ env.INSTALL_KNOWN || '' }}"
          bash static/ergopti_plus/linux/tests/distro/run_in_docker.sh '${{ env.INSTALL_IMAGE }}' \
            | tee "$RUNNER_TEMP/first-install.log"

      - name: Record mandatory first-install evidence
        if: env.INSTALL_KIND == 'first'
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/linux-ci-evidence"
          mkdir -p "$evidence_dir"
          printf '%s\n' \
            '{' \
            '  "schema_version": 1,' \
            '  "job": "install-linux",' \
            "  \"sha\": \"$GITHUB_SHA\"," \
            "  \"architecture\": \"$RUNNER_ARCH\"," \
            '  "distro": "${{ env.INSTALL_DISTRO }}",' \
            '  "session": "container-first-install",' \
            '  "interpreter": "LuaJIT",' \
            '  "subjects": { "first-install-${{ env.INSTALL_DISTRO }}": 1 }' \
            '}' > "$evidence_dir/first-install-${{ env.INSTALL_DISTRO }}.json"

      - name: Upload mandatory first-install evidence
        if: env.INSTALL_KIND == 'first'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-ci-evidence-first-install-${{ env.INSTALL_DISTRO }}
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/first-install-${{ env.INSTALL_DISTRO }}.json
          if-no-files-found: error

      - name: Download the .deb built above (deb)
        if: env.INSTALL_KIND == 'deb'
        # assets-linux holds every Linux file of this run under its release
        # name; the find below picks its one .deb.
        uses: actions/download-artifact@v4
        with:
          name: assets-linux
          path: pkg

      - name: Install it the way a user would (deb)
        if: env.INSTALL_KIND == 'deb'
        # --no-install-recommends deliberately: the Recommends list names
        # libayatana-appindicator3-1 among others, which are optional at
        # runtime and not all in the Ubuntu archive. What is under test is that
        # the Depends resolve and that DEBIAN/postinst — never once executed
        # before this job existed — runs to completion, since apt fails the
        # install when it exits non-zero.
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find pkg -name '*.deb' -type f | head -1)
          if [ -z "$deb" ]; then
              echo "::error::the assets-linux artifact contains no .deb."
              exit 1
          fi
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends "./$deb"
          dpkg -s ergopti

      - name: The package installed the files the daemon reads (deb)
        if: env.INSTALL_KIND == 'deb'
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for f in /usr/bin/ergopti \
                   /usr/lib/ergopti/ergopti_hotstrings.lua \
                   /usr/lib/ergopti/infra/paths.lua \
                   /usr/lib/ergopti/_shared/lua/logger/shim.lua \
                   /usr/lib/ergopti/_shared/data/locales/en.json \
                   /usr/lib/systemd/user/ergopti-hotstrings.service; do
              if [ ! -e "$f" ]; then
                  echo "::error::the package did not install $f"
                  fail=1
              fi
          done
          exit $fail

      - name: Launch the installed binary (deb)
        if: env.INSTALL_KIND == 'deb'
        # --help returns early, but only AFTER every file-scope require in the
        # daemon has run — so this is a real check of the require graph against
        # the INSTALLED layout, which the unit suite (run from the checkout)
        # cannot see. A missing module or a wrapper with the wrong LUA_PATH
        # fails here instead of on the user's machine.
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/ergopti --help

      - name: The installed shared data tree resolves and opens (deb)
        if: env.INSTALL_KIND == 'deb'
        # --help returns before doing any work, so it proves the require graph
        # and nothing about the DATA tree — which is where the defect that
        # motivated this whole job actually lived. The check is a tracked file
        # rather than a heredoc because five formats run it.
        #
        # LUA_PATH is replayed from the INSTALLED wrapper rather than re-typed,
        # so this cannot pass against a path the wrapper does not set.
        shell: bash
        run: |
          set -euo pipefail
          eval "$(grep -E '^(DRIVER_ROOT|SHARED_LUA)=|^export LUA_PATH=' /usr/bin/ergopti)"
          if [ -z "${LUA_PATH:-}" ]; then
              echo "::error::/usr/bin/ergopti no longer exports LUA_PATH — this check read nothing."
              exit 1
          fi
          echo "LUA_PATH from the installed wrapper: $LUA_PATH"
          luajit static/ergopti_plus/linux/tests/hardware/installed_layout_check.lua \
              /usr/lib/ergopti/_shared

      - name: Record mandatory .deb smoke evidence (deb)
        if: env.INSTALL_KIND == 'deb'
        shell: bash
        run: |
          node tools/test/linux-ci-evidence.cjs record \
              --job install-linux --output "$RUNNER_TEMP/linux-ci-evidence/smoke-deb-install.json" \
              --sha "$GITHUB_SHA" --architecture "$RUNNER_ARCH" --distro ubuntu \
              --session installed-package --interpreter "$(luajit -v 2>&1 | head -1)" \
              --subject smoke-deb-install=1

      - name: Upload mandatory .deb smoke evidence (deb)
        if: env.INSTALL_KIND == 'deb'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-ci-evidence-smoke-deb-install
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/smoke-deb-install.json
          if-no-files-found: error

      - name: Download the .rpm built above (rpm)
        if: env.INSTALL_KIND == 'rpm'
        # assets-linux holds every Linux file of this run under its release
        # name; the find below picks its one .rpm.
        uses: actions/download-artifact@v4
        with:
          name: assets-linux
          path: pkg

      - name: Install it the way a user would (rpm)
        if: env.INSTALL_KIND == 'rpm'
        shell: bash
        run: |
          set -euo pipefail
          rpm=$(find pkg -name '*.rpm' -type f | head -1)
          if [ -z "$rpm" ]; then
              echo "::error::the assets-linux artifact contains no .rpm."
              exit 1
          fi
          dnf install -y "./$rpm"
          rpm -q ergopti

      - name: Launch the installed binary (rpm)
        if: env.INSTALL_KIND == 'rpm'
        shell: bash
        run: |
          set -euo pipefail
          account="$(id -un)"
          if [ -z "$account" ]; then
              echo '::error::Native account identity was unavailable for installed RPM launch.' >&2
              exit 1
          fi
          USER="$account" LOGNAME="$account" /usr/bin/ergopti --help

      - name: The installed shared data tree resolves and opens (rpm)
        if: env.INSTALL_KIND == 'rpm'
        shell: bash
        run: |
          set -euo pipefail
          eval "$(grep -E '^(DRIVER_ROOT|SHARED_LUA)=|^export LUA_PATH=' /usr/bin/ergopti)"
          if [ -z "${LUA_PATH:-}" ]; then
              echo "::error::/usr/bin/ergopti no longer exports LUA_PATH — this check read nothing."
              exit 1
          fi
          luajit static/ergopti_plus/linux/tests/hardware/installed_layout_check.lua \
              /usr/lib/ergopti/_shared

      - name: Record mandatory .rpm smoke evidence (rpm)
        if: env.INSTALL_KIND == 'rpm'
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/linux-ci-evidence"
          mkdir -p "$evidence_dir"
          printf '%s\n' \
            '{' \
            '  "schema_version": 1,' \
            '  "job": "install-linux",' \
            "  \"sha\": \"$GITHUB_SHA\"," \
            "  \"architecture\": \"$RUNNER_ARCH\"," \
            '  "distro": "fedora",' \
            '  "session": "installed-package",' \
            '  "interpreter": "LuaJIT",' \
            '  "subjects": { "smoke-rpm-install": 1 }' \
            '}' > "$evidence_dir/smoke-rpm-install.json"

      - name: Upload mandatory .rpm smoke evidence (rpm)
        if: env.INSTALL_KIND == 'rpm'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-ci-evidence-smoke-rpm-install
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/smoke-rpm-install.json
          if-no-files-found: error

      - name: Download the AppImage built above
        if: env.INSTALL_KIND == 'appimage'
        # assets-linux holds every Linux file of this run under its release
        # name; the find below picks its one .AppImage.
        uses: actions/download-artifact@v4
        with:
          name: assets-linux
          path: pkg

      - name: Unpack it (no FUSE on this runner)
        if: env.INSTALL_KIND == 'appimage'
        shell: bash
        run: |
          set -euo pipefail
          img=$(find pkg -name '*.AppImage' -type f | head -1)
          if [ -z "$img" ]; then
              echo "::error::the assets-linux artifact contains no .AppImage."
              exit 1
          fi
          chmod +x "$img"
          "./$img" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun

      - name: Launch it
        if: env.INSTALL_KIND == 'appimage'
        # Explicitly --help: AppRun appends --tray when given no arguments, and
        # there is no display here for a tray to appear in.
        shell: bash
        run: ./squashfs-root/AppRun --help

      - name: Every bundled ELF file loads on the oldest supported LTS
        if: env.INSTALL_KIND == 'appimage'
        # The AppImage catalogue runs it on Ubuntu 22.04; one file needing a
        # newer GLIBC_ version kills the launch before any icon appears.
        shell: bash
        run: node tools/build/check-elf-glibc-ceiling.cjs squashfs-root pkg

      - name: It shows its tray icon on Ubuntu 22.04, offline
        if: env.INSTALL_KIND == 'appimage'
        # What the AppImage catalogue does with firejail: no network, a desktop
        # launch by a user outside the input group, and a pass only when a
        # window or a tray icon appears.
        shell: bash
        run: bash tools/build/appimage-oldest-lts.sh smoke "$(find pkg -name '*.AppImage' -type f | head -1)"

      - name: The bundled shared data tree resolves and opens
        if: env.INSTALL_KIND == 'appimage'
        # The AppImage is relocatable, so its root is wherever it was unpacked —
        # which is the point of checking it here rather than assuming a prefix.
        #
        # Run through the image's OWN luajit, not the runner's. There is no
        # luajit on this runner at all, which is the situation an AppImage
        # exists for: if the bundled interpreter is missing or unusable, that is
        # a defect in the package and this step is where it should surface.
        shell: bash
        run: |
          set -euo pipefail
          root="$(pwd)/squashfs-root/usr/lib/ergopti"
          luajit_bin="$(pwd)/squashfs-root/usr/bin/luajit"
          if [ ! -x "$luajit_bin" ]; then
              echo "::error::the AppImage bundles no runnable luajit at usr/bin/luajit — it would depend on the target having one."
              exit 1
          fi
          export LUA_PATH="$root/?.lua;$root/?/init.lua;$root/_shared/lua/?.lua;$root/_shared/lua/?/init.lua;;"
          "$luajit_bin" static/ergopti_plus/linux/tests/hardware/installed_layout_check.lua \
              "$root/_shared"

      - name: Record mandatory AppImage smoke evidence
        if: env.INSTALL_KIND == 'appimage'
        shell: bash
        run: |
          node tools/test/linux-ci-evidence.cjs record \
              --job install-linux --output "$RUNNER_TEMP/linux-ci-evidence/smoke-appimage-run.json" \
              --sha "$GITHUB_SHA" --architecture "$RUNNER_ARCH" --distro ubuntu \
              --session unpacked-appimage --interpreter "$(./squashfs-root/usr/bin/luajit -v 2>&1 | head -1)" \
              --subject smoke-appimage-run=1

      - name: Upload mandatory AppImage smoke evidence
        if: env.INSTALL_KIND == 'appimage'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-ci-evidence-smoke-appimage-run
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/smoke-appimage-run.json
          if-no-files-found: error

  # ─────────────────────────────────────────────────
  # 5) Verdict: every mandatory Linux subject ran and passed
  # ─────────────────────────────────────────────────
  # The needs: list below and .github/linux-ci-coverage.json name the same jobs
  # twice on purpose — needs: decides what this job waits for, the manifest
  # decides what it fails on — and a job added to one but not the other runs
  # and gates nothing. That is exactly what build-deb and build-rpm once were:
  # no job listed them, so a broken package still shipped a release.
  # linux-ci-evidence.cjs verify rejects both halves of that drift at run time
  # (a manifest job missing from needs, a needs entry the manifest does not
  # classify). Anything added to this file goes in BOTH.
  #
  # It stays inside this workflow on purpose: toJSON(needs) only sees the jobs
  # of its own workflow, so from ci.yml it would hold nothing but "linux".
  # if: always() so that a failed or skipped job is reported by name, from the
  # evidence, instead of this job being skipped in silence. The lane's exit
  # job: no job of this file needs it.
  linux-ok:
    name: 'Verdict (Mandatory subjects)'
    runs-on: ubuntu-latest
    needs: [install-linux, package-flatpak]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Download assertion evidence
        uses: actions/download-artifact@v4
        with:
          pattern: linux-ci-evidence-*
          path: ${{ runner.temp }}/linux-ci-evidence
          merge-multiple: true

      - name: Assert all mandatory subjects ran and passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          ERGOPTI_DEV_RELEASE_RELEASE: ${{ inputs.release }}
          ERGOPTI_DEV_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          ERGOPTI_DEV_RELEASE_CHANNEL: ${{ inputs.channel }}
          ERGOPTI_DEV_RELEASE_TAG: ${{ inputs.tag }}
          ERGOPTI_DEV_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          NEEDS="$(node tools/ci/ci-stage-status.cjs complete linux)"
          node tools/test/linux-ci-evidence.cjs verify \
              --manifest .github/linux-ci-coverage.json \
              --needs "$NEEDS" \
              --evidence-dir "$RUNNER_TEMP/linux-ci-evidence" \
              --sha "$GITHUB_SHA"
          echo "Linux mandatory evidence verified; deferred qualifications, if any, remain unqualified."
