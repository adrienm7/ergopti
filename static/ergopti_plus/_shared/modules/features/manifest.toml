# The Karabiner virtual keyboard type macOS deploys
# (karabiner.json virtual_hid_keyboard.keyboard_type_v2). It decides which
# keycode the ISO-only key pair (the key left of 1 and the extra key left of Z)
# reaches: the ANSI product passes an Apple ISO keyboard's pair through
# unswapped, the ISO product swaps it once more (issue #99). "auto" resolves to
# ANSI (modules/keymap/layout.lua AUTOMATIC_VIRTUAL_KEYBOARD_PRODUCT); an
# explicit "iso" or "ansi" is deployed as chosen and never replaced by what the
# active layout would suggest. Only macOS has a virtual keyboard: Windows
# (SC029/SC056) and Linux (evdev 41/86) name these keys by position. Not
# input-altering on its own: it only decides how the generated rules name keys.
[[features.layout]]
id = "virtual_keyboard"
platforms = ["hs"]
reason_key = "platform_reason.virtual_keyboard_is_karabiner"
default = "auto"
recommended = "auto"
input_altering = false
type = "enum"
enum_values = ["auto", "iso", "ansi"]
description_key = "menu.layout.virtual_keyboard"

# Whether « digits first » and « symbols first » also swap the two levels of the
# three edge keys of the number row (left of 1, the two right of 0). Off: the
# ordering moves the ten digit keys only and the edge keys type what the
# effective layout types there. On: each edge key types its Shift level
# unshifted and its base level with Shift, read from the effective layout,
# while an ordering applies and each edge key can be swapped. Like the ordering
# itself, only Windows applies it; macOS and Linux keep the native row.
[[features.layout]]
id = "number_row_reorder_edges"
platforms = ["ahk", "hs", "linux"]
default = false
recommended = false
input_altering = true
type = "boolean"
description_key = "menu.layout.number_row_edges"

[[features.layout]]
id = "ergopti_alt_gr"
platforms = ["ahk"]
reason_key = "platform_reason.layout_emulation_is_windows_only"
default = false
recommended = true
input_altering = true
type = "boolean"
description_key = "menu.layout.ergopti_alt_gr"
superseded_reason_key = "menu.layout.superseded_ergopti_only"

[[features.layout]]
id = "ergopti_variant"
platforms = ["ahk"]
reason_key = "platform_reason.legacy_helpers_use_windows_scan_code_hotkeys"
default = "none"
recommended = "ergopti_plus"
input_altering = true
type = "enum"
enum_values = ["none", "ergopti", "ergopti_plus"]
description_key = "menu.layout.ergopti_plus"
superseded_reason_key = "menu.layout.superseded_ergopti_only"

# The physical rows the layout emulation (a registry layout or the built-in
# Ergopti one) types, each behind its own switch, all on: a row switched off
# types what the OS layout types there, on every level the emulation covers,
# and the number-row ordering then reads the OS layout's row. Which keys each
# row holds is read from the shared physical-key registry by the shared policy
# (layout_rows_policy.ahk and .lua, tests/corpus/layouts/layout_rows.json).
# Windows alone emulates a layout: macOS installs it as a system input source
# and Linux remaps through kanata, so their menus grey these rows with why.
# The switches only narrow an emulation that an empty configuration leaves off
# (emulated_layout "", ergopti_variant "none", ergopti_base false): on their
# own they alter no input, so they are parameters, not activations.
[[features.layout]]
id = "emulate_number_row"
platforms = ["ahk"]
reason_key = "platform_reason.layout_emulation_is_windows_only"
default = true
recommended = true
input_altering = false
type = "boolean"
