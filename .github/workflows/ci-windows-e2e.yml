# .github/workflows/ci-windows-e2e.yml
#
# Windows E2E stage: runs the complete native E2E corpus through pure engine
# injection and validates that every scenario executed.
# Called by ci-windows.yml as its e2e-ahk stage.

name: 'Windows E2E tests'

on:
  workflow_call:
    inputs:
      release:
        description: True when ci.yml's plan resolved a free release tag
        required: true
        type: boolean
      version:
        description: Release version without the leading v; empty unless release
        required: true
        type: string
      tag:
        description: Release tag; empty unless release
        required: true
        type: string
      prerelease:
        description: "'true' for a dev prerelease; empty unless release"
        required: true
        type: string
      channel:
        description: Update channel stamped into the exe, main or dev
        required: true
        type: string
      predecessors:
        description: The lane's needs context for this stage (test-ahk), as JSON
        required: true
        type: string
    outputs:
      ci_predecessors:
        description: e2e-ahk's ci_predecessors output, read by the lane's later stages
        value: ${{ jobs.e2e-ahk.outputs.ci_predecessors }}
      ci_source_sha:
        description: e2e-ahk's ci_source_sha output, read by the lane's later stages
        value: ${{ jobs.e2e-ahk.outputs.ci_source_sha }}
      ci_run_id:
        description: e2e-ahk's ci_run_id output, read by the lane's later stages
        value: ${{ jobs.e2e-ahk.outputs.ci_run_id }}
      ci_attempt:
        description: e2e-ahk's ci_attempt output, read by the lane's later stages
        value: ${{ jobs.e2e-ahk.outputs.ci_attempt }}

permissions:
  contents: read

env:
  ERGOPTI_DEV_RELEASE_RELEASE: ${{ inputs.release }}
  ERGOPTI_DEV_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
  ERGOPTI_DEV_RELEASE_CHANNEL: ${{ inputs.channel }}
  ERGOPTI_DEV_RELEASE_TAG: ${{ inputs.tag }}
  ERGOPTI_DEV_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  e2e-ahk:
    name: 'Engine E2E corpus'
    runs-on: windows-latest
    outputs:
      ci_predecessors: ${{ inputs.predecessors }}
      ci_source_sha: ${{ github.sha }}
      ci_run_id: ${{ github.run_id }}
      ci_attempt: ${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Read E2E runtime contract
        id: ahk-contract
        shell: pwsh
        run: |
          $contractPath = "${{ github.workspace }}\static\ergopti_plus\_shared\modules\updater\windows_release_toolchain.json"
          $contract = Get-Content -LiteralPath $contractPath -Raw | ConvertFrom-Json
          "version=$($contract.runtime.version)" >> $env:GITHUB_OUTPUT
          "url=$($contract.runtime.url)" >> $env:GITHUB_OUTPUT
          "sha256=$($contract.runtime.sha256)" >> $env:GITHUB_OUTPUT

      - name: Cache E2E runtime
        id: cache-ahk
        uses: actions/cache@v4
        with:
          path: C:\AutoHotkey
          key: ahk-${{ steps.ahk-contract.outputs.version }}-${{ steps.ahk-contract.outputs.sha256 }}-windows

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - run: npm ci
        shell: pwsh

      - name: Build E2E features manifest
        run: npm run build:manifest
        shell: pwsh

      - name: Download E2E runtime
        if: steps.cache-ahk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest `
              -Uri "${{ steps.ahk-contract.outputs.url }}" `
              -OutFile "$env:TEMP\AHK.zip" -UseBasicParsing
          $actual = (Get-FileHash -LiteralPath "$env:TEMP\AHK.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne "${{ steps.ahk-contract.outputs.sha256 }}") {
              throw "AutoHotkey v${{ steps.ahk-contract.outputs.version }} archive digest mismatch: $actual"
          }
          Expand-Archive -Path "$env:TEMP\AHK.zip" -DestinationPath "C:\AutoHotkey" -Force

      - name: Run E2E suite (Strategy A — pure engine injection)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ahk = Get-ChildItem "C:\AutoHotkey" -Filter "AutoHotkey64.exe" |
              Select-Object -First 1 -ExpandProperty FullName
          if (-not $ahk) { Write-Error "AutoHotkey64.exe not found."; exit 2 }
          $runner = "${{ github.workspace }}\static\ergopti_plus\windows\tests\e2e\run_e2e.ahk"
          $resultsFile = "${{ github.workspace }}\static\ergopti_plus\windows\tests\e2e\test_results.txt"
          Remove-Item $resultsFile -Force -ErrorAction SilentlyContinue
          Write-Host "AHK runtime : $ahk"
          Write-Host "E2E runner  : $runner"
          Write-Host "------------------------------------------------------------"
          # Same approach as the unit test suite: AHK writes TAP output to
          # test_results.txt (FileAppend to "*" blocks without a console handle).
          # Shared TAP reads expose live progress without changing the native receipt.
          # /ErrorStdOut: see unit-test step — fail fast on load errors instead of
          # hanging on an undismissable modal dialog in the headless runner.
          $stdoutFile = Join-Path $env:RUNNER_TEMP 'windows-ahk-e2e.stdout.log'
          $stderrFile = Join-Path $env:RUNNER_TEMP 'windows-ahk-e2e.stderr.log'
          . "${{ github.workspace }}\tools\ci\ahk-tap-follower.ps1"
          $tapFollower = New-AhkTapFollower -Path $resultsFile
          $tapFailure = $null
          $proc = Start-Process -FilePath $ahk -ArgumentList "/ErrorStdOut `"$runner`"" -NoNewWindow -PassThru -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile
          # Retain the native handle while the asynchronous child is alive.
          $null = $proc.Handle
          while (-not $proc.HasExited) {
              if ($null -eq $tapFailure) {
                  try { $tapFollower.Poll() | ForEach-Object { Write-Host $_ } }
                  catch { $tapFailure = $_.Exception.GetType().Name }
              }
              Start-Sleep -Milliseconds 100
          }
          $proc.WaitForExit()
          $exit = $proc.ExitCode
          if (Test-Path -LiteralPath $stderrFile) {
              Get-Content -LiteralPath $stderrFile -Encoding utf8 | ForEach-Object { Write-Host $_ }
          }
          if ($null -eq $exit) {
              Write-Host "::error::AHK native process exit receipt is unavailable."
              exit 2
          }
          Write-Host "------------------------------------------------------------"
          Write-Host "Exit code: $exit"
          if (-not (Test-Path $resultsFile)) {
              Write-Error "test_results.txt not created — AHK may have crashed at startup."; exit 2
          }
          if ($null -eq $tapFailure) {
              try { $tapFollower.Finish() | ForEach-Object { Write-Host $_ } }
              catch { $tapFailure = $_.Exception.GetType().Name }
          }
          if ($exit -ne 0) {
              Write-Host "::error::AHK E2E native process failed (exit $exit)."
              Write-Error "E2E suite failed (exit $exit)."; exit $exit
          }
          if ($null -ne $tapFailure) {
              Write-Host "::error::AHK TAP progress read failed ($tapFailure); raw native receipts remain authoritative."
              exit 2
          }

      - name: Validate complete native E2E corpus execution
        shell: pwsh
        run: |
          node tools/test/validate-ahk-e2e-manifest.cjs --input "$env:GITHUB_WORKSPACE/static/ergopti_plus/windows/tests/e2e/test_results.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain E2E native streams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ahk-e2e-native-streams
          path: |
            ${{ runner.temp }}/windows-ahk-e2e.stdout.log
            ${{ runner.temp }}/windows-ahk-e2e.stderr.log
          if-no-files-found: warn
