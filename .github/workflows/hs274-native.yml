# .github/workflows/hs274-native.yml
name: HS-274 native capability observation
on:
  push:
    branches: ['fix/hammerspoon-audit-2026-09-07']
    paths: ['tools/diagnostics/hs274-*', 'tools/diagnostics/hs274_accounts.py', '.github/workflows/hs274-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hs274-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev'
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile native Quartz observation
        id: compile
        run: swiftc -swift-version 5 tools/diagnostics/hs274-native.swift -o "$RUNNER_TEMP/hs274-native"
      - name: Observe event provenance and access capabilities
        run: '"$RUNNER_TEMP/hs274-native" "$RUNNER_TEMP/hs274-native.json"'
      - name: Observe capabilities as root on the disposable runner
        if: always() && steps.compile.outcome == 'success'
        run: sudo -n "$RUNNER_TEMP/hs274-native" "$RUNNER_TEMP/hs274-native-root.json"
      - name: Compile HID acquisition observation
        if: always()
        id: compile-hid
        run: clang -std=c11 -Wall -Wextra -Werror tools/diagnostics/hs274-hid-device.c -framework CoreFoundation -framework IOKit -o "$RUNNER_TEMP/hs274-hid-device"
      - name: Observe virtual HID acquisition without input reports
        if: always() && steps.compile-hid.outcome == 'success'
        run: |
          "$RUNNER_TEMP/hs274-hid-device" "$RUNNER_TEMP/hs274-hid-device.json"
          sudo -n "$RUNNER_TEMP/hs274-hid-device" "$RUNNER_TEMP/hs274-hid-device-root.json"
          sudo -n log show --last 1m --style compact --predicate 'eventMessage CONTAINS "hs274-hid"' > "$RUNNER_TEMP/hs274-hid-access.log"
      - name: Verify and install the official signed HID provider
        if: always()
        id: install-provider
        timeout-minutes: 2
        run: |
          curl --fail --location --max-time 30 --output "$RUNNER_TEMP/hs274-provider.pkg" https://github.com/pqrs-org/Karabiner-DriverKit-VirtualHIDDevice/releases/download/v8.5.0/Karabiner-DriverKit-VirtualHIDDevice-8.5.0.pkg
          printf '%s  %s\n' d73d6d9428f0f80b87b8a8ba8a1031f2cbc3bc1fa6b74842d1f1b764b2916fc9 "$RUNNER_TEMP/hs274-provider.pkg" | shasum -a 256 --check
          pkgutil --check-signature "$RUNNER_TEMP/hs274-provider.pkg" > "$RUNNER_TEMP/hs274-provider-signature.log"
          sudo -n installer -pkg "$RUNNER_TEMP/hs274-provider.pkg" -target / > "$RUNNER_TEMP/hs274-provider-install.log" 2>&1
      - name: Compile the verified-control Quartz click probe
        if: always() && steps.install-provider.outcome == 'success'
        id: compile-provider-click
        run: clang -std=c11 -Wall -Wextra -Werror tools/diagnostics/hs274-provider-click.c -framework CoreGraphics -framework CoreFoundation -o "$RUNNER_TEMP/hs274-provider-click"
      - name: Observe signed provider activation without input reports
        id: activate-provider
        if: always() && steps.install-provider.outcome == 'success' && steps.compile-provider-click.outcome == 'success'
        timeout-minutes: 4
        run: python3 tools/diagnostics/hs274-provider.py
      - name: Acquire the pinned official provider client headers
        if: always() && steps.activate-provider.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: pqrs-org/Karabiner-DriverKit-VirtualHIDDevice
          ref: bdfcb459b2eaca8ccda680a73b0dc898f330f4bb
          path: .hs274-provider-sdk
          persist-credentials: false
      - name: Compile the native HID stream observation
        if: always() && steps.activate-provider.outcome == 'success'
        id: compile-hid-stream
        run: clang++ -std=c++23 -Wall -Wextra -Werror -isystem .hs274-provider-sdk/include -isystem .hs274-provider-sdk/vendor/vendor/include tools/diagnostics/hs274-hid-stream.cpp -framework ApplicationServices -framework IOKit -o "$RUNNER_TEMP/hs274-hid-stream"
      - name: Observe a released Space pair through the signed HID provider
        if: always() && steps.compile-hid-stream.outcome == 'success'
        timeout-minutes: 1
        run: |
          sudo -n '/Library/Application Support/org.pqrs/Karabiner-DriverKit-VirtualHIDDevice/Applications/Karabiner-VirtualHIDDevice-Daemon.app/Contents/MacOS/Karabiner-VirtualHIDDevice-Daemon' > "$RUNNER_TEMP/hs274-provider-daemon.log" 2>&1 &
          daemon_pid=$!
          trap 'sudo -n kill "$daemon_pid" 2>/dev/null || true; wait "$daemon_pid" || true' EXIT
          sudo -n env GITHUB_ACTIONS=true "$RUNNER_TEMP/hs274-hid-stream" "$RUNNER_TEMP/hs274-hid-stream.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hs274-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hs274-*.json
            ${{ runner.temp }}/hs274-hid-access.log
            ${{ runner.temp }}/hs274-provider-*.log
            ${{ runner.temp }}/hs274-provider-settings.png
          if-no-files-found: error
