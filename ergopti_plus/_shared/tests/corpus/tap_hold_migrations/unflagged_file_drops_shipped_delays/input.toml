[tap_hold]
enabled = true
inherit_defaults = true

[tap_hold.keys.caps_lock]
tap_action = "enter"
hold_modifier = "ctrl"
time_activation_seconds = 0.35

[tap_hold.keys.left_shift]
time_activation_seconds = 0.35

[tap_hold.keys.tab]
time_activation_seconds = 0.2

[tap_hold.keys.left_ctrl]
time_activation_seconds = 0.45
