# _shared/core/fs/data/paths/app_dirs.toml
#
# ==============================================================================
# SCHEMA: Application Folders and Log File Names
# DESCRIPTION:
# The one declaration of where every driver keeps its files on each OS: the
# application folder name, the per-OS root and its purpose sub-folders
# (configuration, logs, cache, runtime), what the dated log files are called,
# and the old folder names the one-time boot migration moves away from. Each
# driver used to spell these on its own: the log folder formula was re-derived
# in four places on macOS and four on Windows, the file-name prefixes appeared
# as literals in roughly twenty files, and the folder itself had four different
# names across the three drivers.
#
# tools/codegen/codegen-app-dirs.cjs emits this file for the shared Lua tree
# (macOS and Linux), for AutoHotkey and for the native macOS launcher; the
# generated files are committed, so no driver parses this TOML at runtime.
# tools/test/test-log-file-names-single-source.cjs fails when a driver spells
# a log-name prefix itself; tools/test/test-legacy-folder-names.cjs fails when
# anything but the migration spells an old folder name.
#
# ONE FOLDER NAME (maintainer decision, 2026-11-03):
# `Ergopti` on macOS and Windows, `ergopti` under every XDG base on Linux, no
# "Plus" in any folder name. Each OS keeps its own convention for the purpose
# folders:
#   - macOS    ~/Library/Application Support/Ergopti/ (root: paths.toml,
#              config/, control/, managed runtimes, locks),
#              ~/Library/Logs/Ergopti/ (Console.app reads logs there) and
#              ~/Library/Caches/Ergopti/ (the OS may purge caches).
#   - Windows  %LOCALAPPDATA%\Ergopti\ (paths.toml, config\, logs\, cache\,
#              control\, bundle\, updater\, ollama\). The managed Ollama
#              runtime folder keeps its own protected ACL, see [runtime.windows].
#   - Linux    $XDG_CONFIG_HOME/ergopti, $XDG_STATE_HOME/ergopti (logs and
#              state), $XDG_CACHE_HOME/ergopti, $XDG_DATA_HOME/ergopti and
#              $XDG_RUNTIME_DIR/ergopti.
#
# WHAT LIVES IN THE LOGS FOLDER:
#   - the daily unified log     <files.unified_prefix>YYYY-MM-DD<files.extension>
#   - the daily errors mirror   <files.errors_prefix>YYYY-MM-DD<files.extension>
#                               (WARNING and ERROR lines only)
#   - the topical sub-files     <files.topical_prefix><name><files.extension>,
#                               names from _shared/core/logger/data/sub_files.toml
#   - crash reports             <logs>/<logs.crash_reports_dir>/
#   - on macOS, the launcher's own launcher.log and fatal report
# Metrics and keystroke data are user data, not logs: they stay in the
# configuration folder.
#
# OVERRIDE:
# The logs folder can be moved with LogsDirPath (paths.toml on macOS and
# Windows, the bootstrap storage key below on Linux). Empty means the OS
# default. A folder whose last component is not the OS folder name gets that
# subfolder appended, so retention and the owner-only permission change only
# ever apply to a folder the application created for itself.
# ==============================================================================

# ===============================
# ===============================
# ======= 1/ Application ========
# ===============================
# ===============================

[app]
# The folder named after the application on macOS and Windows.
folder_name = "Ergopti"
# The same folder under every XDG base directory, lower case as XDG names are.
linux_folder_name = "ergopti"

# ================================
# ================================
# ======= 2/ Logs folder =========
# ================================
# ================================

[logs]
# paths.toml key holding the optional logs-folder override (macOS, Windows).
override_key = "LogsDirPath"
# Linux bootstrap storage key holding the same override.
linux_storage_key = "paths.logs_dir"
# Subfolder of the logs folder that receives crash reports.
crash_reports_dir = "crash_reports"

[logs.files]
unified_prefix = "ErgoptiPlus_"
errors_prefix = "ErgoptiPlus_errors_"
topical_prefix = "ErgoptiPlus_"
extension = ".log"
# What happens before the configuration is read and the logger can start: a
# yielding second instance, a refused configuration transition (Windows), a
# refused session lock or privacy admission (Linux). It is always written to the
# DEFAULT logs folder, whatever LogsDirPath says, and only ever carries a closed
# vocabulary (no path, no exception text) because the privacy policy is not
# loaded yet. macOS has the equivalent in the native launcher: launcher_log and
# fatal_report below.
bootstrap_log = "bootstrap.log"

# ===================================
# ===================================
# ======= 3/ Per-OS defaults ========
# ===================================
# ===================================

# Every folder below is an environment variable (`base`) followed by
# `segments`; "{app}" stands for the OS folder name of [app].

[logs.macos]
# ~/Library/Logs is where Console.app looks for per-application logs.
base = "HOME"
segments = ["Library", "Logs", "{app}"]
# Written by the native launcher before any configuration is read, so they
# always stay in this default folder, whatever LogsDirPath says.
launcher_log = "launcher.log"
fatal_report = "hammerspoon-fatal.txt"
# The controlled reload's synchronous stage trail (adapters/reload_breadcrumb.lua),
# beside launcher.log for the same reason: a reload that loses the app leaves
# it for the next boot and the field report collector before any configuration
# is read.
reload_breadcrumb = "reload_breadcrumb.txt"

[logs.windows]
# Local, not Roaming: logs are machine state and must not follow the profile.
base = "LOCALAPPDATA"
segments = ["{app}", "logs"]

[logs.linux]
# XDG Base Directory: logs are state, not data.
base = "XDG_STATE_HOME"
# Used under HOME when XDG_STATE_HOME is unset or empty.
base_fallback = [".local", "state"]
segments = ["{app}", "logs"]

# The root of each OS: everything that is neither a log nor a cache.
[support.macos]
base = "HOME"
segments = ["Library", "Application Support", "{app}"]

[support.windows]
base = "LOCALAPPDATA"
segments = ["{app}"]

# Caches the OS or the user may delete at any time.
[cache.macos]
base = "HOME"
segments = ["Library", "Caches", "{app}"]

[cache.windows]
base = "LOCALAPPDATA"
segments = ["{app}", "cache"]

# The XDG base directories of the Linux driver, each holding one "{app}"
# folder: the variable, then the fallback under HOME when it is unset or empty.
# XDG_RUNTIME_DIR has no fallback: without it there is no private runtime
# folder and the callers refuse.
[xdg.linux]
config_base = "XDG_CONFIG_HOME"
config_fallback = [".config"]
data_base = "XDG_DATA_HOME"
data_fallback = [".local", "share"]
cache_base = "XDG_CACHE_HOME"
cache_fallback = [".cache"]
runtime_base = "XDG_RUNTIME_DIR"

# =====================================
# =====================================
# ======= 4/ Configuration ============
# =====================================
# =====================================

# The default configuration folder of each driver (a ConfigDirPath set in
# paths.toml replaces it), inside it where the personal hotstrings live, and
# where paths.toml itself is kept. Linux keeps its configuration in the XDG
# configuration folder above.
[config]
override_key = "ConfigDirPath"
hotstrings_dir = "hotstrings"
personal_hotstrings_file = "personal_hotstrings.toml"

[config.macos]
base = "HOME"
segments = ["Library", "Application Support", "{app}", "config"]
paths_file = ["Library", "Application Support", "{app}", "paths.toml"]

[config.windows]
base = "LOCALAPPDATA"
segments = ["{app}", "config"]
paths_file = ["{app}", "paths.toml"]

# =====================================
# =====================================
# ======= 5/ Managed runtime ==========
# =====================================
# =====================================

[runtime.windows]
# The managed Ollama runtime folder inside the Ergopti root. ollama_managed_files.ps1
# creates it with a protected DACL (the user and SYSTEM only) and admits it only
# below a direct LocalApplicationData child that grants no write, delete or
# re-permission right to another principal, held open without DELETE sharing.
managed_ollama_folder_name = "ollama"

[owned_runtime.macos]
# The owned Karabiner runtime (ADR 011) is compiled with this folder name: the
# root-owned /Library/Application Support/<name>/ tree and the per-user
# configuration home its core service reads (<support>/<name>/karabiner) are
# spelled in the patched C++ sources and in the published runtime artifact.
# Renaming it needs a new runtime build and artifact pin, so it is kept until
# that rebuild (docs/tooling/one-folder-name-handoff.md).
folder_name = "ErgoptiPlus"

# =====================================
# =====================================
# ======= 6/ One-time migration =======
# =====================================
# =====================================

# The folders of the builds before the single name, moved once at boot into the
# new root by each driver's legacy folder migration. A move is a rename and
# never overwrites: an empty destination folder is replaced, and an old entry
# whose destination holds something is renamed into the backup folder of the
# new root (<root>/<backup_folder>/<old path below its base>), so every old
# folder empties, is removed, and the migration never runs twice. paths.toml is
# rewritten only where it named an old default folder, and its previous text
# is kept beside it with the backup suffix. Nothing else may spell these names
# (tools/test/test-legacy-folder-names.cjs).
[migration]
backup_suffix = ".before-folder-migration"
backup_folder = "before-folder-migration"

[migration.macos]
# ~/Library/Application Support/<legacy_support_folder>/<entry> moves to the
# same entry of the support root. Only these entries are moved: the others are
# runtime state of a build that may still run until the next login (locks, the
# lease guardian, the PTY sources), or the owned runtime kept above.
legacy_support_folder = "ErgoptiPlus"
moved_support_entries = ["paths.toml", "RemapRuntime"]
# The old default configuration folder, relative to HOME.
legacy_config = [".config", "ergopti_plus"]
# The old default logs folder, relative to HOME: every entry merges into the
# logs folder, and a paths.toml LogsDirPath that names it is rewritten.
legacy_logs = ["Library", "Logs", "ergopti_plus"]
# The old cache folder and the old local reload control folder, relative to
# HOME: every entry merges into the cache folder and the support root.
legacy_cache = ["Library", "Caches", "ergopti_plus"]
legacy_control = ["Library", "Application Support", "ergopti_plus"]

[migration.windows]
# The old paths.toml in Roaming AppData.
legacy_paths_file_base = "APPDATA"
legacy_paths_file = ["Ergopti", "paths.toml"]
# The old default configuration folder, relative to the user profile.
legacy_config_base = "USERPROFILE"
legacy_config = [".config", "ergopti_plus"]
# The old LocalAppData folder: each of its entries (logs, cache, updater, ...)
# moves to the same entry of the root.
legacy_local_folder = "ergopti_plus"
# The old managed Ollama runtime folders, direct LocalApplicationData children,
# moved in this order into [runtime.windows]: the first build's folder, then the
# protected sibling of the single-name builds before it moved inside the root.
legacy_ollama_folders = ["ergopti_plus_ollama", "Ergopti-ollama"]

[migration.linux]
# $XDG_CONFIG_HOME/<legacy_folder>, $XDG_STATE_HOME/<legacy_folder> and
# $XDG_DATA_HOME/<legacy_folder>: each entry moves to the same entry of the
# ergopti folder of that base. The runtime folder is recreated at login.
legacy_folder = "ergopti_plus"
