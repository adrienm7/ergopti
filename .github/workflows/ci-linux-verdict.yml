# .github/workflows/ci-linux-verdict.yml
#
# Linux verdict stage: asserts that every mandatory subject of the lane ran
# and passed.
# Called by ci-linux.yml as its linux-ok stage.

name: 'Linux verdict'

on:
  workflow_call:
    inputs:
      release:
        description: True when this run publishes a release; only sets artifact retention
        required: true
        type: boolean
      version:
        description: Release version stamped into the Linux tree, empty outside a release
        required: true
        type: string
      tag:
        description: Exact release tag from the validated release plan
        required: true
        type: string
      prerelease:
        description: Exact prerelease string from the validated release plan
        required: true
        type: string
      channel:
        description: Exact update channel from the validated release plan
        required: true
        type: string
      predecessors:
        description: The lane's needs context for this stage (install-linux, package-flatpak), as JSON
        required: true
        type: string

permissions:
  contents: read

env:
  ERGOPTI_DEV_RELEASE_RELEASE: ${{ inputs.release }}
  ERGOPTI_DEV_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
  ERGOPTI_DEV_RELEASE_CHANNEL: ${{ inputs.channel }}
  ERGOPTI_DEV_RELEASE_TAG: ${{ inputs.tag }}
  ERGOPTI_DEV_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  linux-ok:
    name: 'Mandatory subjects'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Download assertion evidence
        uses: actions/download-artifact@v4
        with:
          pattern: linux-ci-evidence-*
          path: ${{ runner.temp }}/linux-ci-evidence
          merge-multiple: true

      - name: Assert all mandatory subjects ran and passed
        env:
          NEEDS: ${{ inputs.predecessors }}
          ERGOPTI_DEV_RELEASE_RELEASE: ${{ inputs.release }}
          ERGOPTI_DEV_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          ERGOPTI_DEV_RELEASE_CHANNEL: ${{ inputs.channel }}
          ERGOPTI_DEV_RELEASE_TAG: ${{ inputs.tag }}
          ERGOPTI_DEV_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          NEEDS="$(node tools/ci/ci-stage-status.cjs complete linux)"
          node tools/test/linux-ci-evidence.cjs verify \
              --manifest .github/linux-ci-coverage.json \
              --needs "$NEEDS" \
              --evidence-dir "$RUNNER_TEMP/linux-ci-evidence" \
              --sha "$GITHUB_SHA"
          echo "Linux mandatory evidence verified; deferred qualifications, if any, remain unqualified."
