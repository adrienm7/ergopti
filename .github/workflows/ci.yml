# .github/workflows/ci.yml
#
# Unified CI pipeline — one workflow per push to main or dev.
#
# Architecture (one branch per driver, all independent, then converge):
#
#   ┌─────────────────────────────────┐
#   │  validate (fast gates, ubuntu)  │
#   │  locales · hotstrings · domain  │
#   └──────────────┬──────────────────┘
#                  │ (always runs — no path filter)
#        ┌─────────┼──────────┐
#        ▼         ▼          ▼
#   ┌─────────┐ ┌──────────┐ ┌──────────┐
#   │ macOS   │ │ Windows  │ │  Linux   │
#   │  branch │ │  branch  │ │  branch  │
#   │         │ │          │ │          │
#   │ test-hs │ │ test-ahk │ │test-linux│
#   │  e2e-hs │ │  e2e-ahk │ └──────────┘
#   └────┬────┘ └────┬─────┘
#        │           │           │
#        └─────────┬─┘───────────┘
#                  ▼
#          ┌───────────────┐
#          │ release       │  (main branch only, all drivers green)
#          │ auto-tag +    │
#          │ trigger       │
#          │ release.yml   │
#          └───────────────┘
#
# Workflows kept separate:
#   release.yml  — heavy build jobs (macOS app, Windows exe, Linux packages)
#                  triggered by the v* tag this pipeline pushes on main
#   bench.yml    — perf benchmark (main only, independent cadence)

name: CI

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true


# ========================================================
# ========================================================
# ======= 1/ Validation — fast gates, always run =======
# ========================================================
# ========================================================

jobs:

    # ─────────────────────────────────────────────────
    # 1.1) Locale key-set parity
    # ─────────────────────────────────────────────────
    validate-locales:
        name: "Validate · locales"
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Check every locale mirrors en.json's key set
              run: python tools/check_locales.py


    # ─────────────────────────────────────────────────
    # 1.2) Hotstring TOML format
    # ─────────────────────────────────────────────────
    validate-hotstrings:
        name: "Validate · hotstrings TOML"
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Check hotstring TOML files are sorted and formatted
              run: python tools/dev/format_toml.py --hotstrings --all --check


    # ─────────────────────────────────────────────────
    # 1.3) Domain build pipeline + drift detection
    # ─────────────────────────────────────────────────
    validate-domain:
        name: "Validate · domain pipeline"
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - run: npm ci

            - name: Run domain build pipeline
              run: npm run build:domain


# ==========================================
# ==========================================
# ======= 2/ macOS driver branch =======
# ==========================================
# ==========================================

    # ─────────────────────────────────────────────────
    # 2.1) Hammerspoon unit tests
    # ─────────────────────────────────────────────────
    test-hs:
        name: "macOS · unit tests"
        runs-on: ubuntu-latest
        needs: [validate-locales, validate-hotstrings, validate-domain]

        steps:
            - uses: actions/checkout@v4

            - name: Install Lua 5.4 + luarocks
              run: |
                  sudo apt-get update
                  sudo apt-get install -y lua5.4 liblua5.4-dev luarocks

            - name: Install luacheck + luafilesystem
              # lfs is required by tests/run.lua for recursive test discovery;
              # --lua-version 5.4 ensures luarocks links the correct runtime.
              run: |
                  sudo luarocks --lua-version 5.4 install luacheck
                  sudo luarocks --lua-version 5.4 install luafilesystem

            - name: Run luacheck (non-blocking)
              # Surface warnings without failing — pre-existing style issues
              # must not block the test step.
              run: |
                  luacheck static/ergopti_plus/macos/tests static/ergopti_plus/macos/lib \
                    static/ergopti_plus/macos/modules || true

            - name: Run unit + meta tests
              working-directory: static/ergopti_plus/macos
              run: lua5.4 tests/run.lua


    # ─────────────────────────────────────────────────
    # 2.2) Hammerspoon E2E (virtual-keyboard harness)
    # ─────────────────────────────────────────────────
    e2e-hs:
        name: "macOS · E2E"
        runs-on: ubuntu-latest
        needs: [test-hs]

        steps:
            - uses: actions/checkout@v4

            - name: Install Lua 5.4 + luafilesystem
              run: |
                  sudo apt-get update
                  sudo apt-get install -y lua5.4 liblua5.4-dev luarocks
                  sudo luarocks --lua-version 5.4 install luafilesystem

            - name: Run E2E virtual-keyboard harness
              # Exercises Registry + Expander via the stub layer against
              # hardcoded scenarios and all corpus vectors.
              # Exit 0 = all pass, 1 = at least one failure.
              working-directory: static/ergopti_plus/macos
              run: lua5.4 tests/e2e/run_e2e.lua
              timeout-minutes: 5


    # ─────────────────────────────────────────────────
    # 2.3) Gate: macOS driver fully green
    # ─────────────────────────────────────────────────
    macos-ok:
        name: "macOS · ✅ all green"
        runs-on: ubuntu-latest
        needs: [test-hs, e2e-hs]
        if: always()

        steps:
            - name: Assert all macOS jobs passed
              run: |
                  if [[ "${{ needs.test-hs.result }}" != "success" || \
                        "${{ needs.e2e-hs.result }}"  != "success" ]]; then
                      echo "macOS driver: one or more jobs failed."
                      echo "  test-hs : ${{ needs.test-hs.result }}"
                      echo "  e2e-hs  : ${{ needs.e2e-hs.result }}"
                      exit 1
                  fi
                  echo "macOS driver: all jobs passed."


# =============================================
# =============================================
# ======= 3/ Windows driver branch =======
# =============================================
# =============================================

    # ─────────────────────────────────────────────────
    # 3.1) AHK unit tests
    # ─────────────────────────────────────────────────
    test-ahk:
        name: "Windows · unit tests"
        runs-on: windows-latest
        needs: [validate-locales, validate-hotstrings, validate-domain]

        steps:
            - uses: actions/checkout@v4

            - name: Cache AutoHotkey runtime
              id: cache-ahk
              uses: actions/cache@v4
              with:
                  path: C:\AutoHotkey
                  key: ahk-v2.0.19-windows

            - uses: actions/setup-node@v4
              with:
                  node-version: "lts/*"
                  cache: "npm"

            - run: npm ci
              shell: pwsh

            - name: Build features manifest
              run: npm run build:manifest
              shell: pwsh

            - name: Manifest parity (AHK ↔ HS codegen equivalence)
              run: npm run test:manifest-parity
              shell: pwsh

            - name: Download AutoHotkey v2 runtime
              if: steps.cache-ahk.outputs.cache-hit != 'true'
              shell: pwsh
              run: |
                  Invoke-WebRequest `
                      -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip" `
                      -OutFile "$env:TEMP\AHK.zip" -UseBasicParsing
                  Expand-Archive -Path "$env:TEMP\AHK.zip" -DestinationPath "C:\AutoHotkey" -Force

            - name: Verify AHK source encoding (UTF-8 BOM + CRLF)
              # AHK v2 silently aborts mid-file on encoding drift — catch it
              # before it causes silent test failures with no error message.
              shell: pwsh
              run: |
                  $ahkFiles = Get-ChildItem `
                      -Path "${{ github.workspace }}\static\ergopti_plus\windows" `
                      -Recurse -Filter "*.ahk" |
                      Where-Object { -not $_.FullName.Contains("vendor") }
                  $failures = @()
                  foreach ($file in $ahkFiles) {
                      $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
                      if ($bytes.Length -lt 3 -or
                          $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
                          $failures += "MISSING BOM : $($file.FullName)"; continue
                      }
                      $content = [System.IO.File]::ReadAllText(
                          $file.FullName, [System.Text.Encoding]::UTF8)
                      if (($content -replace "`r`n", "") -match "`n") {
                          $failures += "BARE LF : $($file.FullName)"
                      }
                  }
                  if ($failures.Count -gt 0) {
                      $failures | ForEach-Object { Write-Host "  $_" }
                      Write-Error "AHK encoding violations detected."
                      exit 1
                  }
                  Write-Host "Encoding OK — $($ahkFiles.Count) file(s) verified."

            - name: Run AHK test suite
              shell: pwsh
              timeout-minutes: 8
              run: |
                  $ahk = Get-ChildItem "C:\AutoHotkey" -Filter "AutoHotkey64.exe" |
                      Select-Object -First 1 -ExpandProperty FullName
                  if (-not $ahk) { Write-Error "AutoHotkey64.exe not found."; exit 2 }
                  $runner = "${{ github.workspace }}\static\ergopti_plus\windows\tests\run_all.ahk"
                  if (-not (Test-Path $runner)) {
                      Write-Error "Test runner not found at $runner"; exit 2
                  }
                  Write-Host "AHK runtime : $ahk"
                  Write-Host "Test runner : $runner"
                  Write-Host "------------------------------------------------------------"
                  # AHK does not write to the parent shell's stdout natively; wrap
                  # via cmd.exe so FileAppend("*") output reaches the Actions log.
                  $output = & cmd /c "`"$ahk`" `"$runner`" 2>&1"
                  $exit = $LASTEXITCODE
                  $output | ForEach-Object { Write-Host $_ }
                  Write-Host "------------------------------------------------------------"
                  Write-Host "AHK exit code: $exit"
                  if ($exit -ne 0) {
                      Write-Error "Test suite failed (exit $exit)."; exit $exit
                  }

            - name: Check for AHK compiler warnings
              shell: pwsh
              timeout-minutes: 8
              run: |
                  $ahk = Get-ChildItem "C:\AutoHotkey" -Filter "AutoHotkey64.exe" |
                      Select-Object -First 1 -ExpandProperty FullName
                  $runner = "${{ github.workspace }}\static\ergopti_plus\windows\tests\run_all.ahk"
                  $output = & cmd /c "`"$ahk`" `"$runner`" 2>&1"
                  $warnings = $output | Where-Object { $_ -match "^Warning:" }
                  if ($warnings) {
                      $warnings | ForEach-Object { Write-Host "  $_" }
                      Write-Error "$($warnings.Count) AHK compiler warning(s) — fix before merging."
                      exit 1
                  }
                  Write-Host "No AHK compiler warnings."


    # ─────────────────────────────────────────────────
    # 3.2) AHK E2E (pure engine injection, headless)
    # ─────────────────────────────────────────────────
    e2e-ahk:
        name: "Windows · E2E"
        runs-on: windows-latest
        needs: [test-ahk]

        steps:
            - uses: actions/checkout@v4

            - name: Cache AutoHotkey runtime
              id: cache-ahk
              uses: actions/cache@v4
              with:
                  path: C:\AutoHotkey
                  key: ahk-v2.0.19-windows

            - name: Download AutoHotkey v2 runtime
              if: steps.cache-ahk.outputs.cache-hit != 'true'
              shell: pwsh
              run: |
                  Invoke-WebRequest `
                      -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip" `
                      -OutFile "$env:TEMP\AHK.zip" -UseBasicParsing
                  Expand-Archive -Path "$env:TEMP\AHK.zip" -DestinationPath "C:\AutoHotkey" -Force

            - name: Verify E2E runner encoding
              shell: pwsh
              run: |
                  $file = "${{ github.workspace }}\static\ergopti_plus\windows\tests\e2e\run_e2e.ahk"
                  $bytes = [System.IO.File]::ReadAllBytes($file)
                  if ($bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
                      Write-Error "run_e2e.ahk is missing UTF-8 BOM."; exit 1
                  }
                  $content = [System.IO.File]::ReadAllText($file, [System.Text.Encoding]::UTF8)
                  if (($content -replace "`r`n", "") -match "`n") {
                      Write-Error "run_e2e.ahk contains bare LF line endings."; exit 1
                  }
                  Write-Host "Encoding OK: UTF-8 BOM + CRLF."

            - name: Build features manifest
              shell: pwsh
              run: npm ci; npm run build:manifest

            - name: Run E2E suite (Strategy A — pure engine injection)
              shell: pwsh
              timeout-minutes: 5
              run: |
                  $ahk = Get-ChildItem "C:\AutoHotkey" -Filter "AutoHotkey64.exe" |
                      Select-Object -First 1 -ExpandProperty FullName
                  if (-not $ahk) { Write-Error "AutoHotkey64.exe not found."; exit 2 }
                  $runner = "${{ github.workspace }}\static\ergopti_plus\windows\tests\e2e\run_e2e.ahk"
                  Write-Host "AHK runtime : $ahk"
                  Write-Host "E2E runner  : $runner"
                  Write-Host "------------------------------------------------------------"
                  $output = & cmd /c "`"$ahk`" `"$runner`" 2>&1"
                  $exit = $LASTEXITCODE
                  $output | ForEach-Object { Write-Host $_ }
                  Write-Host "------------------------------------------------------------"
                  Write-Host "Exit code: $exit"
                  if ($exit -ne 0) {
                      Write-Error "E2E suite failed (exit $exit)."; exit $exit
                  }


    # ─────────────────────────────────────────────────
    # 3.3) Gate: Windows driver fully green
    # ─────────────────────────────────────────────────
    windows-ok:
        name: "Windows · ✅ all green"
        runs-on: ubuntu-latest
        needs: [test-ahk, e2e-ahk]
        if: always()

        steps:
            - name: Assert all Windows jobs passed
              run: |
                  if [[ "${{ needs.test-ahk.result }}" != "success" || \
                        "${{ needs.e2e-ahk.result }}"  != "success" ]]; then
                      echo "Windows driver: one or more jobs failed."
                      echo "  test-ahk : ${{ needs.test-ahk.result }}"
                      echo "  e2e-ahk  : ${{ needs.e2e-ahk.result }}"
                      exit 1
                  fi
                  echo "Windows driver: all jobs passed."


# ============================================
# ============================================
# ======= 4/ Linux driver branch =======
# ============================================
# ============================================

    # ─────────────────────────────────────────────────
    # 4.1) Linux Lua driver tests
    # ─────────────────────────────────────────────────
    test-linux:
        name: "Linux · unit tests"
        runs-on: ubuntu-22.04
        needs: [validate-locales, validate-hotstrings, validate-domain]

        steps:
            - uses: actions/checkout@v4

            - name: Install LuaJIT
              run: sudo apt-get update -qq && sudo apt-get install -y luajit

            - name: Run Linux driver test suite
              working-directory: static/ergopti_plus/linux
              run: luajit tests/run.lua


    # ─────────────────────────────────────────────────
    # 4.2) Gate: Linux driver fully green
    # ─────────────────────────────────────────────────
    linux-ok:
        name: "Linux · ✅ all green"
        runs-on: ubuntu-latest
        needs: [test-linux]
        if: always()

        steps:
            - name: Assert all Linux jobs passed
              run: |
                  if [[ "${{ needs.test-linux.result }}" != "success" ]]; then
                      echo "Linux driver: test-linux failed."
                      exit 1
                  fi
                  echo "Linux driver: all jobs passed."


# =========================================
# =========================================
# ======= 5/ Release (main only) =======
# =========================================
# =========================================

    release:
        name: "Release · auto-tag → release.yml"
        runs-on: ubuntu-latest
        needs: [macos-ok, windows-ok, linux-ok]
        # Only on push to main (not PRs, not dev) and only when all drivers passed
        if: >
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main' &&
            needs.macos-ok.result   == 'success' &&
            needs.windows-ok.result == 'success' &&
            needs.linux-ok.result   == 'success'
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Calculate next version and push tag
              # Computes the next SemVer from conventional commits since the last
              # stable tag, then pushes the tag — which triggers release.yml.
              # This step only runs after all three driver branches are green.
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN_NUM:  ${{ github.run_number }}
              run: |
                  set -euo pipefail

                  last_stable=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
                      | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
                  if [ -z "$last_stable" ]; then
                      last_stable="v0.0.0"
                      range="HEAD"
                  else
                      range="${last_stable}..HEAD"
                  fi
                  echo "Last stable tag: $last_stable"
                  IFS='.' read -r maj min pat <<< "${last_stable#v}"

                  bump="patch"
                  while IFS= read -r subject; do
                      [ -z "$subject" ] && continue
                      if echo "$subject" | grep -qE '(BREAKING|!):'; then
                          bump="major"; break
                      elif echo "$subject" | grep -qE '^feat(\([^)]+\))?!?:'; then
                          [ "$bump" != "major" ] && bump="minor"
                      fi
                  done < <(git log "$range" --no-merges --pretty=format:"%s")
                  echo "Bump type: $bump"

                  case "$bump" in
                      major) maj=$((maj+1)); min=0; pat=0 ;;
                      minor) min=$((min+1)); pat=0 ;;
                      patch) pat=$((pat+1)) ;;
                  esac
                  tag="v${maj}.${min}.${pat}"
                  echo "New tag: $tag"

                  if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
                      echo "Tag '$tag' already exists — skipping push."
                  else
                      git tag "$tag"
                      git push origin "$tag"
                      echo "Tag '$tag' pushed — release.yml will fire now."
                  fi
