# seven rows of a shared menu.
#
# A `list` rather than seven `command` rows because the set is one block with one
# provider behind it, and because a `list` is what carries the rows themselves
# out of the driver.
#
# Restricted to linux, with the reason attached, because the same operations are
# reached differently elsewhere: macOS binds them to ctrl chords and lists them
# under `ctrl_shortcuts`, and Windows exposes its own combinations under
# `modifier_combos`. Declaring one shared row would put a second copy of these
# operations in two menus that already have them.
