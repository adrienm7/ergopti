# static/shared/actions.toml
#
# Source de vérité unique pour les actions de gestes.
# Lue par Hammerspoon (modules/gestures/actions.lua) et AutoHotkey
# (modules/gestures.ahk) au démarrage pour construire la liste ordonnée
# du picker et valider les noms d'actions.
#
# platform : "all" | "hs" | "ahk"
#   "all" — disponible sur les deux plateformes
#   "hs"  — macOS / Hammerspoon uniquement
#   "ahk" — Windows / AutoHotkey uniquement
#
# type : "sg" (action ponctuelle) | "ax" (axe continu)
#
# Les séparateurs "--" et les titres "#Titre" dans [sg_order] / [ax_order]
# sont des directives de mise en forme pour le picker — pas des actions.


# ==============================================================================
# Axe actions (swipes continus / scalables)
# ==============================================================================

[ax_actions]

[ax_actions.tabs]
platform = "all"
scalable = true

[ax_actions.char]
platform = "all"
scalable = true

[ax_actions.char_sel]
platform = "all"
scalable = true

[ax_actions.line_arrow]
platform = "all"
scalable = true

[ax_actions.line_sel]
platform = "all"
scalable = true

[ax_actions.words]
platform = "all"
scalable = true

[ax_actions.words_sel]
platform = "all"
scalable = true

[ax_actions.windows]
platform = "all"
scalable = false

[ax_actions.spaces]
platform = "hs"
scalable = false

[ax_actions.desktops]
platform = "ahk"
scalable = false

[ax_actions.volume]
platform = "all"
scalable = true

[ax_actions.brightness]
platform = "all"
scalable = true

[ax_actions.tracks]
platform = "all"
scalable = false

[ax_actions.lines]
platform = "all"
scalable = true

[ax_actions.line_bounds]
platform = "all"
scalable = false

[ax_actions.paragraphs]
platform = "all"
scalable = true

[ax_actions.document]
platform = "all"
scalable = false


# ==============================================================================
# Ordre du picker pour les axes
# ==============================================================================

[ax_order]
items = [
    "tabs",
    "char",
    "char_sel",
    "line_arrow",
    "line_sel",
    "words",
    "words_sel",
    "windows",
    "spaces",
    "desktops",
    "volume",
    "brightness",
    "tracks",
    "lines",
    "line_bounds",
    "paragraphs",
    "document",
]


