# macOS's Karabiner defaults derive from. Yet `tap_holds_menu` said ["ahk"] and
# `karabiner_menu` said ["hs"], so the one driver whose remap daemon exists
# precisely to do tap-holds had no row about them anywhere in its tray. A user
# could not see which key taps to what, or how long a hold takes, without
# opening a generated .kbd.
