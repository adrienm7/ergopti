# Unrestricted since 2026-08-05. The ["ahk"] restriction was already false when
# it was written: macOS ships the engine (modules/keymap/expander.lua
# try_repeat_feature) AND the toggle, and has for as long as that file has
# existed. It recorded who implemented the feature first, not what the platforms
# can do — the same mistake already corrected for hotstring_extensions and
# magic_key_config. Nothing here touches an OS API: it is "if the character just
# typed is the magic key and nothing matched, replace it with the one before it",
# which is as portable as the buffer it reads.
# Linux gained it in modules/hotstrings/repeat_key.lua.
[[features.hotstrings]]
id = "repeat_key_enabled"
default = false
recommended = true
input_altering = true
type = "boolean"
description_key = "menu.hotstrings.repeat_key_enabled"

[[features.hotstrings]]
