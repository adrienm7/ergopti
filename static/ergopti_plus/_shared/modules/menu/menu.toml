# The LLM submenu.
#
# It did not exist. `llm` has been a top-level row on all three drivers since
# the feature shipped, and each driver built the submenu beneath it by hand —
# so `[sections.llm]` and its six subsections described capabilities with no
# manifest rows behind them, and there was nowhere to declare a control without
# also writing it three times.
#
# The two `list` rows are Linux's. Their contents are the models the machine
# actually has and the values the user has chosen, which no static entry can
# enumerate, and a `list` is what puts them in the shared renderer instead of in
# each driver. They say `platforms = ["linux"]` since 2026-08-07: the paragraph
# below has claimed since the day it was written that they were "restricted to
# linux", and they never carried the restriction — so the manifest promised
# macOS and Windows two rows neither has ever drawn, which is precisely the
# failure this file exists to prevent.
#
# The eight settings rows are what macOS and Windows draw. They lived in a
# SECOND shared file (_shared/modules/llm/menu_layout.json) with its own reader
# on each of those two drivers, so one menu had two shared descriptions and
# neither mentioned the other. That file is retired; its row order, its
# disabled-when-off policy and its health-dot flag are these rows' fields. The
# model, profile and Linux generation rows are `list` rows since 2026-10-31: their
# contents read Win32 and hs state, so each driver supplies that row DATA, and the
# shared renderer draws it at the declared place — see the investigation below,
# which this change does not overturn.
#
# WHY macOS AND WINDOWS ARE NOT SIMPLY MOVED ONTO IT (investigated 2026-08-06):
# The macOS LLM menu is 7 578 lines across 21 files, and almost all of it is
# MLX model management — HuggingFace downloads, a local inference server,
# per-model state — for an engine that exists only on Apple Silicon and already
# carries its own restriction below. There is no manifest description of that;
# it is an application, not a menu.
#
# The small overlapping part does not port either, and the reason is a platform
# constraint rather than an omission. macOS sets the temperature through a
# free-text numeric dialog (`generic_numeric_prompt`, bounds 0.0–1.0); the Linux
# tray has no text input at all, which is why it offers presets. Declaring one
# shared row would force one of those shapes onto the other, and on macOS that
# means REMOVING the free-text entry — a downgrade dressed as convergence.
#
# What IS shared is the SETTING, and it already is: `llm.generation.temperature`
# and `llm.generation.context_length` are declared for all three drivers, with
# one default. The control differs because the platforms differ, and that is
# what per-platform rows are for. Moving macOS onto this tree is worth doing the
# day its menu is decomposed; it is not a projection job.

# `disabled_when_off` is the greying policy the retired spec owned: false means
# the row stays usable while the feature is OFF, so the user can configure a
# backend and a model before enabling anything. Everything else greys out.
# The IA master gate, and like every `toggle` the first row of its submenu: a
# checkbox labelled by ONE key and ticked from checked_when. The two alternating
# « activée (cliquer pour désactiver) » labels it replaced were a status line
# dressed as a control, and a pair of keys per row to keep in step.
[[menu.llm_menu]]
type = "toggle"
id = "llm_toggle"
i18n = "menu.llm.enable"
checked_when = ["llm_enabled"]
# Greyed, never absent, while the switch cannot run its activation transaction:
# during a pause, a protected configuration, or before activation is ready.
# The row used to vanish in those states, leaving the IA submenu without a switch.
disabled_when = ["llm_toggle_ready"]
disabled_reason_key = "menu.llm.save_unavailable"
# A configuration saved by a newer version is read-only for the session: the
# row names that cause, since resuming or Diagnostics cannot lift it.
disabled_reasons = [{ when = "config_newer_schema", reason_key = "menu.read_only.newer_schema" }]
category = "LLM"

# The restore alone: the maintainer retired the AI menu's « Tout effacer » on
# 2026-09-30, because clearing the AI section leaves nothing the system would
# do in its place. The AI scope still takes part in the global composition.
[[menu.llm_menu]]
type = "command"
id = "scope_restore"
i18n = "common.restore_recommended"
# The restore writes the AI section: greyed, like the switch, whenever the
# configuration cannot be saved, and with the same newer-configuration cause.
disabled_when = ["llm_scope_ready"]
disabled_reason_key = "menu.llm.save_unavailable"
disabled_reasons = [{ when = "config_newer_schema", reason_key = "menu.read_only.newer_schema" }]

[[menu.llm_menu]]
type = "---"

