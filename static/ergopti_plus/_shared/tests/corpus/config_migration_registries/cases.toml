# _shared/tests/corpus/config_migration_registries/cases.toml
# Registry defects every interpreter must reject: the Windows loader
# (windows/infra/config_migrate.ahk), the Lua engine
# (_shared/lua/config_migrate.lua) and tools/test/test-config-migrations.cjs.
# A registry one driver accepts and another refuses would migrate a file on one
# driver and leave the session read-only on the other.
#
# Every case is <name>.toml, the control registry with exactly one defect.
# Every interpreter must accept the control, so a rejection proves the defect
# and not a typo that breaks the whole file. The JS gate fails when these
# names and the files differ.

[corpus]
control = "control"
rejected = [
	"chain_gap",
	"misnamed_step",
	"step_skips_a_version",
	"unstamped_above_current",
	"non_integer_version",
	"unknown_registry_key",
	"unknown_table",
	"unknown_step_field",
	"unknown_driver",
	"no_driver",
	"no_reason",
	"blank_reason",
	"ops_not_an_array",
	"unknown_op",
	"unknown_op_field",
	"missing_op_field",
	"rename_without_target",
	"section_not_bare",
	"key_with_dot",
	"map_entry_extra_field",
	"map_entry_not_scalar",
	"set_if_absent_inline_table",
]
