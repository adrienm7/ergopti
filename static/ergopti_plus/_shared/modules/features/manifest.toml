# « Raccourcis de gestion du script », the maintainer's first group of every
# submenu (2026-09-30): the switch of the chords, the restore of their preset,
# the clear to the system's behaviour, then the four slots. Off keeps every
# slot's action and leaves every chord to the system; the clear sets every slot
# to "none" explicitly, since an absent slot starts with its preset.
# `category` names the switch, as a toggle row must; it is the
# shortcuts.script_control.chords_enabled feature, not a [category_enabled] gate.
# The restore and the clear apply at once, without a question (the
# maintainer's decision of 2026-09-30), through the Shortcuts scope owner.
[[menu.script_control_group]]
type = "toggle"
id = "script_control_toggle"
i18n = "menu.shortcuts.script_shortcuts_enable"
checked_when = ["script_control_enabled"]
category = "ScriptControl"

[[menu.script_control_group]]
type = "command"
id = "scope_restore"
i18n = "common.restore_recommended"

[[menu.script_control_group]]
type = "command"
id = "scope_clear"
i18n = "common.clear_to_system"

[[menu.script_control_group]]
type = "---"

# One row per slot, labelled « AltGr + Entrée : <action> » (« Opt droit +
# Entrée » on macOS), each opening the shared action picker.
[[menu.script_control_group]]
type = "list"
id = "script_control_shortcuts"

# Unrestricted: every driver draws this row from the declaration and registers
# only what the click does. Windows used to insert its own master row by hand in
# BuildMetricsMenu, which is why this row once excluded "ahk" — a second
# description of one switch, with its own two labels. Its command there is
# ToggleMetricsEnabled, which keeps the security-warning dialog.
[[menu.metrics_menu]]
type = "toggle"
id = "metrics_toggle"
i18n = "menu.metrics.enable"
checked_when = ["keylogger_enabled"]
category = "Metrics"

# The restore alone: the maintainer retired the Metrics clear on 2026-09-30,
# because clearing these settings to the system's behaviour means nothing (there
# is no system behaviour for typing metrics). The Configuration clear still
# composes the metrics scope owner, so its settings join a global clear.
[[menu.metrics_menu]]
type = "command"
id = "scope_restore"
i18n = "common.restore_recommended"

[[menu.metrics_menu]]
type = "---"

# `command` since 2026-08-07. These two are buttons: a label, a greying rule and
# a click. `action` hands the id back, so all three drivers built the same row
# three times from a declaration that already carried both.
[[menu.metrics_menu]]
type = "command"
id = "show_typing"
i18n = "menu.metrics.show_typing"
disabled_when = ["keylogger_enabled"]

# The two rows that open a window form one group. Each was followed, until
# 2026-10-01, by a row that set a dedicated shortcut for it (`shortcut_typing`,
# `shortcut_apps`), with a separator between the pairs. The maintainer retired
# them: a shortcut that opens one of these windows is assigned in the Gestures
# or the Shortcuts menu, to the `open_metrics_typing` or `open_metrics_apps`
# action, like any other, and the two ways are not mixed.
[[menu.metrics_menu]]
type = "command"
id = "show_apps"
i18n = "menu.metrics.show_apps"
disabled_when = ["keylogger_enabled"]

[[menu.metrics_menu]]
type = "---"

# `check` since 2026-08-07: a checkbox whose label, tick and greying are all in
# the declaration, so this driver supplies only the toggle and the state behind
