id = "keyboard_slots"
# The configurable keyboard-shortcut groups. A "list" rather than a "group"
# because there are several of them and their contents are the user's own
# assignments, which no static entry can enumerate; the driver supplies the rows
# as data and the renderer draws them, so no menu row is built outside it.
#
# Both drivers render it from here. The Windows driver used to splice the same
# groups in with a Menu.Insert sequence that had already duplicated them once
# per updater refresh; a list entry cannot, because the renderer builds the menu
# fresh every time.
#
# Restricted on 2026-08-05 because Linux had no slot-binding surface at all:
# modules/shortcuts/manager.lua was toggles, selection transforms and wrap
# pairs, with no chord capture, no assignment store, and nothing for a list to
# enumerate. The note beside it said widening this again was a feature job
# rather than a projection job.
#
# Widened on 2026-08-06 because that feature job was done. The hook now reports
# which key a modified keystroke was rather than the bare string "shortcut",
# modules/shortcuts/keyboard_shortcuts.lua owns the slot space and the
# assignments, and the menu answers this row from them. Matching happens in the
# daemon rather than the kernel — there is no userland API on Linux to reserve a
# chord — which is why only the canonical Ctrl+G product shortcut is bound by
# default there and every general catalogue assignment remains opt-in.
platforms = ["ahk", "hs", "linux"]

# « Combinaisons de touches »: every combination of two tap-hold keys, in one
# group with a first-row switch of its own. Its rows are
# key_combinations_group. Linux owns ordered tap/hold slots; simultaneous
# first-press chord buffering remains unavailable there.
# A separator sets it apart from the submenus above, which each create
# shortcuts under one modifier.
[[menu.shortcuts_menu]]
type = "---"

[[menu.shortcuts_menu]]
type = "group"
id = "key_combinations"
i18n = "menu.shortcuts.key_combinations"
checked_when = ["key_combinations_enabled"]
platforms = ["ahk", "hs", "linux"]
reason_key = "platform_reason.remap_engine_is_per_driver"
# « Raccourcis de gestion du script »: the script chords, a group whose title
# is ticked while its first-row switch is on. Its rows are
# script_control_group, the same on the three drivers.
[[menu.shortcuts_menu]]
type = "group"
id = "script_control"
i18n = "menu.shortcuts.script_shortcuts"
checked_when = ["script_control_enabled"]

[[menu.shortcuts_menu]]
type = "dynamic"
id = "personal_shortcuts"
# AHK-only (mirrors wrap_symbols_menu above): the Windows driver maintains a
# structured personal_shortcuts.ahk registry it can walk to list each
# individually-registered shortcut. macOS's personal_shortcuts.lua is an
# arbitrary dofile()-loaded script (hs.hotkey.bind calls are not
# introspectable), so there is no equivalent registry to render here — the
# macOS "edit_shortcuts" action below already covers "open the file to edit".
platforms = ["ahk"]
reason_key = "platform_reason.chord_families_are_each_platforms"
# `command` since 2026-08-08, not `action`: the handler's whole body was one row
# with a static label and a click, which is exactly what a declaration carries.
[[menu.shortcuts_menu]]
type = "command"
id = "edit_shortcuts"
# "Open the personal shortcuts file." macOS has one — infra/personal_shortcuts.lua,
# resolved through config_paths PersonalShortcutsLuaPath — and Windows has
# personal_shortcuts.ahk. Linux has no personal shortcuts file at all: its
# shortcuts module is toggles and selection transforms, with nothing on disk
# for the user to edit.
platforms = ["ahk", "hs"]
reason_key = "platform_reason.no_personal_shortcuts_file_on_linux"
i18n = "menu.global.edit_shortcuts"

# `list` since 2026-08-07: one row per installed extension that ships a shortcuts
# menu, behind its own separator and header. All three drivers walked the same
# extensions directory and built the same three shapes by hand, because `dynamic`
# hands the id straight back. The submenu under each extension is still the
# driver's — it is whatever that extension's own menu file declares.
[[menu.shortcuts_menu]]
type = "list"
id = "extensions_shortcuts"
# One submenu per installed extension that ships shortcuts/menu.lua (menu.ahk on
# Windows). All three drivers walk the extensions tree, load each file in a
# sandbox and render what the extension collects.
#
# This carried platforms = ["ahk"] with the reason "neither Lua driver has that
# concept", which was false for both: macOS has done it since
# ui/menu/menu_shortcuts.lua:543 was written, and Linux since 2026-08-05
# (ui/menu/menu_builder.lua, _extension_shortcut_rows). The restriction survived
# a correction attempt because Linux's shortcuts menu was hand-rolled and could
# not render any row BY ID, so widening it would have made the manifest promise
# something the handler-bijection ratchet would flag. That menu now dispatches
# through the shared renderer, which is what let the restriction go.

# The « Combinaisons de touches » group under Shortcuts. Its first row is its
# own switch, the only one the combinations follow on every OS: macOS
# persists it as [mod_combos] enabled in config_karabiner.toml, Windows as
