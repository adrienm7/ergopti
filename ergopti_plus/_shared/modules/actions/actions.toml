emit_ahk_mods = ["super"]
emit_linux = "super+v"

# --- System actions (D5) ---
# Each runs one native command, asynchronously, never on the keyboard hook:
# macOS modules/gestures/system_actions.lua, Linux
# modules/gestures/system_actions.lua, Windows
# modules/gestures/system_actions.ahk. Every suite pins the exact command.

[sg_actions.show_desktop]
# Windows Win+D, macOS Command + the Mission Control key; Linux toggles the
# EWMH "showing the desktop" mode through wmctrl, which only X11 honours.
platform = "all"
requires_linux = ["session:x11", "tool:wmctrl"]
emit_ahk_key = "d"
emit_ahk_mods = ["super"]

[sg_actions.sleep_displays]
# macOS pmset displaysleepnow, Windows SC_MONITORPOWER, Linux DPMS off (X11).
platform = "all"
requires_linux = ["session:x11", "tool:xset"]

[sg_actions.toggle_dark_mode]
# macOS System Events appearance, Windows the Personalize registry values plus
# the ImmersiveColorSet broadcast, Linux the GNOME color-scheme setting.
platform = "all"
requires_linux = ["tool:gsettings"]

[sg_actions.mic_mute_toggle]
# macOS input level 0 and back, Windows the default capture endpoint's mute,
# Linux the default PulseAudio/PipeWire source's mute.
platform = "all"
requires_linux = ["tool:pactl"]

[sg_actions.clear_clipboard]
# Linux clears through the session's clipboard tool (wl-copy, xclip or xsel);
# with none installed the action logs an error.
platform = "all"

[sg_actions.center_mouse]
# The centre of the screen under the pointer. Linux, as for teleport_mouse, has
# no compositor-independent way to warp the pointer.
platform = "ahk,hs"

[sg_actions.run_program]
# Versioned absolute executable plus a literal argument vector, owned by the action lifecycle.
platform = "all"
parameter = "program"

[sg_actions.open_app]
# Opens the application stored for the binding: macOS `open -a` (a name or
# path) or `open -b` (a bundle identifier), Windows the shell's Run (a program,
# a Start-menu shortcut, a packaged app), Linux gtk-launch (a desktop-file id).
# Each binding editor picks the value in a native chooser (/Applications, the
# Start menu, /usr/share/applications). The Windows chooser returns only .exe
# and .lnk files: a packaged app without a Start-menu shortcut
# (shell:AppsFolder\<AUMID>) is still written in config.toml by hand.
platform = "all"
requires_linux = ["tool:gtk-launch"]
parameter = "app"

[sg_actions.quit_frontmost_app]
# Asks the active application to quit (macOS its Quit command, Windows WM_CLOSE
# to each of its windows, Linux SIGTERM to the active window's process, X11).
# The driver itself is refused: script_quit owns its teardown. The desktop
# shell is refused too, as quitting it removes the desktop or the taskbar:
# Finder, the Dock and loginwindow on macOS; the desktop, the taskbar and the
# rest of the shell's explorer.exe on Windows (only the active folder window is
# closed); the EWMH desktop and dock windows on Linux (read with xprop).
platform = "all"
requires_linux = ["session:x11", "tool:xdotool", "tool:xprop"]

[sg_actions.force_quit_frontmost]
# Kills the active application at once (SIGKILL, TerminateProcess), with the
# same refusals as quit_frontmost_app. Unsaved work is lost, so it asks first
# (decision of 2026-09-29); the application it kills is the one active when it
# was asked, not the question's own window.
platform = "all"
requires_linux = ["session:x11", "tool:xdotool", "tool:xprop"]
confirm = true

[sg_actions.empty_trash]
platform = "all"
requires_linux = ["tool:gio"]
confirm = true

[sg_actions.eject_all_disks]
# Linux is not implemented, not impossible: udisksctl can unmount and power off
# each removable drive, but telling them apart needs a parsed lsblk listing.
platform = "hs,ahk"

[sg_actions.clear_notifications]
# Best effort: the notification daemons that expose a command (dunst, mako,
# SwayNC). GNOME Shell and KDE Plasma expose none, and neither do macOS nor
# Windows, where the notification centre (notification_center) is the way.
platform = "linux"

# The file-manager selection helpers. The selection is Finder's (osascript -ss,
# parsed by _shared/lua/file_selection), Explorer's SelectedItems (COM), or the
# text/uri-list a Linux file manager publishes on copy.

[sg_actions.remove_quarantine_selection]
platform = "hs"
confirm = true

[sg_actions.unblock_file_selection]
# The Windows counterpart of the quarantine: the Zone.Identifier stream (Mark
# of the Web) of each selected file, recursively for a folder.
platform = "ahk"
confirm = true

[sg_actions.make_executable_selection]
platform = "hs,linux"

[sg_actions.open_terminal_here]
# The folder of the active Finder or Explorer window. Linux is not
# implemented, not impossible: its file managers expose no current folder.
platform = "hs,ahk"

[sg_actions.new_text_file_here]
platform = "hs,ahk"

