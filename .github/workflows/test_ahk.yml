name: Test AHK

on:
    push:
        branches: [main, dev]
        paths:
            - "static/ergopti_plus/windows/**"
            - "static/ergopti_plus/_shared/features/manifest.toml"
            - "scripts/build-features-manifest.js"
            - ".github/workflows/test_ahk.yml"
    pull_request:
        branches: [main, dev]
        paths:
            - "static/ergopti_plus/windows/**"
            - "static/ergopti_plus/_shared/features/manifest.toml"
            - "scripts/build-features-manifest.js"
            - ".github/workflows/test_ahk.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: test-ahk-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: windows-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Cache AutoHotkey runtime
              id: cache-ahk
              uses: actions/cache@v4
              with:
                  path: C:\AutoHotkey
                  key: ahk-v2.0.19-windows

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "lts/*"
                  cache: "npm"

            - name: Install Node dependencies
              run: npm ci
              shell: pwsh

            - name: Build features manifest
              run: node ./scripts/build-features-manifest.js
              shell: pwsh

            - name: Manifest parity (AHK ↔ HS codegen equivalence)
              # Validates that the AHK and HS generated manifests expose identical
              # version, section_order, cross-platform sections, and feature entries.
              # Catches any divergence introduced by build-features-manifest.js.
              run: node ./scripts/test-manifest-parity.cjs
              shell: pwsh

            - name: Download AutoHotkey v2 runtime
              if: steps.cache-ahk.outputs.cache-hit != 'true'
              run: |
                  Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip" -OutFile "$env:TEMP\AHK.zip" -UseBasicParsing
                  Expand-Archive -Path "$env:TEMP\AHK.zip" -DestinationPath "C:\AutoHotkey" -Force
              shell: pwsh

            - name: Verify AHK source encoding (UTF-8 BOM + CRLF)
              # AHK v2 silently aborts mid-file when a source file is not UTF-8 BOM
              # or uses LF-only line endings. This step catches encoding drift before
              # it produces silent test failures with no error message.
              run: |
                  $ahkFiles = Get-ChildItem -Path "${{ github.workspace }}\static\ergopti_plus\windows" `
                      -Recurse -Filter "*.ahk" | Where-Object { -not $_.FullName.Contains("vendor") }
                  $failures = @()
                  foreach ($file in $ahkFiles) {
                      $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
                      # Check UTF-8 BOM: first 3 bytes must be 0xEF 0xBB 0xBF
                      if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
                          $failures += "MISSING BOM : $($file.FullName)"
                          continue
                      }
                      # Check CRLF: the file must not contain bare LF (0x0A not preceded by CR 0x0D)
                      $content = [System.IO.File]::ReadAllText($file.FullName, [System.Text.Encoding]::UTF8)
                      # Normalise CRLF then check for leftover LF
                      $lfOnly = $content -replace "`r`n", "" -match "`n"
                      if ($lfOnly) {
                          $failures += "BARE LF (not CRLF) : $($file.FullName)"
                      }
                  }
                  if ($failures.Count -gt 0) {
                      Write-Host "AHK encoding violations detected ($($failures.Count) file(s)):"
                      $failures | ForEach-Object { Write-Host "  $_" }
                      Write-Error "All .ahk files must be UTF-8 with BOM and CRLF line endings."
                      exit 1
                  }
                  Write-Host "Encoding check passed — $($ahkFiles.Count) .ahk file(s) verified (UTF-8 BOM + CRLF)."
              shell: pwsh

            - name: Run AHK test suite
              id: tests
              run: |
                  $ahk = Get-ChildItem "C:\AutoHotkey" -Filter "AutoHotkey64.exe" | Select-Object -First 1 -ExpandProperty FullName
                  if (-not $ahk) {
                      Write-Error "AutoHotkey64.exe not found in C:\AutoHotkey"
                      exit 2
                  }
                  $runner = "${{ github.workspace }}\static\ergopti_plus\windows\tests\run_all.ahk"
                  if (-not (Test-Path $runner)) {
                      Write-Error "Test runner not found at $runner"
                      exit 2
                  }
                  Write-Host "AHK runtime : $ahk"
                  Write-Host "Test runner : $runner"
                  Write-Host "------------------------------------------------------------"
                  # AHK does not write to the parent shell's stdout natively; we redirect
                  # the runner's FileAppend("*") output via the standard streams of a
                  # cmd.exe wrapper so the TAP report appears in the GitHub Actions log.
                  # With #Warn All, StdOut in run_all.ahk, compiler warnings also arrive
                  # on stderr (which 2>&1 merges into the same stream we capture here).
                  $output = & cmd /c "`"$ahk`" `"$runner`" 2>&1"
                  $exit = $LASTEXITCODE
                  $output | ForEach-Object { Write-Host $_ }
                  Write-Host "------------------------------------------------------------"
                  Write-Host "AHK exit code: $exit"
                  if ($exit -ne 0) {
                      Write-Error "Test suite reported failures (exit code $exit)."
                      exit $exit
                  }
              shell: pwsh
              timeout-minutes: 8

            - name: Check for AHK compiler warnings
              # #Warn All, StdOut causes AHK to emit warning lines to stdout.
              # This step greps the saved output for the word "Warning:" and
              # fails the build if any are found, catching shadow-variable and
              # other static-analysis issues before they reach production.
              run: |
                  $ahk = Get-ChildItem "C:\AutoHotkey" -Filter "AutoHotkey64.exe" | Select-Object -First 1 -ExpandProperty FullName
                  $runner = "${{ github.workspace }}\static\ergopti_plus\windows\tests\run_all.ahk"
                  $output = & cmd /c "`"$ahk`" `"$runner`" 2>&1"
                  $warnings = $output | Where-Object { $_ -match "^Warning:" }
                  if ($warnings) {
                      Write-Host "AHK compiler warnings detected:"
                      $warnings | ForEach-Object { Write-Host "  $_" }
                      Write-Error "$($warnings.Count) AHK compiler warning(s) found — fix them before merging."
                      exit 1
                  }
                  Write-Host "No AHK compiler warnings detected."
              shell: pwsh
              timeout-minutes: 8
