# .github/workflows/ci.yml
#
# The root only plans and calls. It resolves the release plan, then fans out to
# the reusable Common lane and the three OS lanes, and finally calls Release
# (ci-release.yml), which verifies every lane result against the persisted plan
# and publishes. Common exposes JS contracts/parity, properties, and (on main)
# mutation tests independently, each on a fresh shallow checkout.
#
# Every OS follows the same visible sequence:
#   unit tests -> E2E -> build/package -> install and launch -> verdict
# Installation variants stay inside one matrix. Each verdict rejects missing
# mandatory work.
#
# Each package is built once; launch checks consume those same bytes and the
# release publishes them. Only Release receives write permission. Signing
# secrets reach the OS workflows only on release runs, never through inherit.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      os_lanes:
        description: Native OS lanes to validate (shared checks always run)
        type: choice
        required: true
        default: all
        options:
          - all
          - windows
          - macos
          - linux
          - windows+macos
          - windows+linux
          - macos+linux

permissions:
  contents: read

concurrency:
  # Manual validations retain their own group when one CI branch advances.
  # Dev pushes finish their release; newer work waits instead of starving it.
  # Pull requests and other automatic branches still supersede older runs.
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' || github.event_name != 'push' }}

# ========================================================
# ========================================================
# ======= 1/ Validation and release plan — t=0 ==========
# ========================================================
# ========================================================

jobs:
  prepare-common:
    name: 'Check formatting and plan shared tests'
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Check formatting
        run: |
          python3 -m pip install --disable-pip-version-check "ruff==$(node tools/lint/format.cjs --ruff-version)"
          node tools/lint/format.cjs --check

      - name: Plan every canonical feature and additional suite
        id: plan
        run: |
          set -euo pipefail
          node tools/ci/js-feature-matrix.cjs plan

  # ─────────────────────────────────────────────────
  # 1.1) Validate the release inputs and resolve the plan
  # ─────────────────────────────────────────────────
  # Resolve the plan once, retaining bounded fetch retries and strict tag checks.
  # The shared JS suites use their own depth-1 checkout in core, so deepening
  # this checkout never changes the history those tests inspect.
  validate:
    name: 'Release plan'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.meta.outputs.release }}
      native_qualification_profile: ${{ steps.qualification.outputs.native_qualification_profile }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      title: ${{ steps.meta.outputs.title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      channel: ${{ steps.meta.outputs.channel }}
      linux_bundle: ${{ steps.contract.outputs.linux_bundle }}
      lane_windows: ${{ steps.lanes.outputs.lane_windows }}
      lane_macos: ${{ steps.lanes.outputs.lane_macos }}
      lane_linux: ${{ steps.lanes.outputs.lane_linux }}

    steps:
      # A depth-1 clone without tags, which the checks below expect.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare plan validation
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Select native OS lanes
        id: lanes
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_OS_SELECTION: ${{ inputs.os_lanes }}
        run: node tools/ci/manual-ci-lanes.cjs select >> "$GITHUB_OUTPUT"

      # The release plan starts here: tag, version, title and channel. It
      # numbers the next tag from every tag of its series and the commit
      # subjects since the last stable tag, so it needs what a fetch-depth: 0
      # checkout gives: every branch and tag with full history. --unshallow
      # deepens every shallow commit of the clone, HEAD included even when no
      # branch reaches it any more, and --tags adds every tag to the branches
      # of the default refspec. The fetch used to come from actions/checkout,
      # which tries it three times, 10 to 20 s apart; this step keeps that
      # retry, since one network error here stops every lane. An attempt can
      # fail after it has completed the clone, and --unshallow refuses a
      # complete clone, so it is passed only while the clone is still shallow.
      # A third failure, or a clone still shallow afterwards, fails the step
      # rather than planning from a partial history, which would number a tag
      # that is already taken and publish nothing, silently.
      - name: Deepen history for the release plan
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
              unshallow=()
              if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
                  unshallow=(--unshallow)
              fi
              if git fetch --prune "${unshallow[@]}" --tags origin; then
                  break
              fi
              if [ "$attempt" = 3 ]; then
                  echo "::error::git fetch failed 3 times: the release plan needs the full history and every tag."
                  exit 1
              fi
              echo "::warning::git fetch failed (attempt $attempt of 3), retrying in 15 s."
              sleep 15
          done
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
              echo "::error::the clone is still shallow after the fetch: the release plan would number a tag from a partial history."
              exit 1
          fi

      # The Linux lane names its tarball with it and release writes it into the
      # notes, so it is resolved and validated once, on every run. A malformed
      # name fails validate and therefore stops every lane, macOS and Windows
      # included, on purpose: it can only come from a checked-in bug in
      # defaults.json, and failing fast in the root names it before any runner
      # time is spent on a run that could never publish.
      - name: Load the Linux release artifact contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          asset_name=$(node -p "require('./static/ergopti_plus/_shared/modules/updater/defaults.json').release_assets.linux_bundle")
          if [[ ! "$asset_name" =~ ^[A-Za-z0-9._+-]+\.tar\.gz$ ]]; then
              echo "::error::unsafe Linux bundle asset name: $asset_name"
              exit 1
          fi
          echo "linux_bundle=$asset_name" >> "$GITHUB_OUTPUT"

      - name: Compute tag and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          # Only a push to main or dev publishes. A pull request or a manual
          # dispatch takes the CI profile: every lane still runs its tests and
          # builds its package, and release is skipped. dev is the channel the
          # CI packages have always been stamped with.
          if [ "$GITHUB_EVENT_NAME" != "push" ] ||
             { [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$GITHUB_REF" != "refs/heads/dev" ]; }; then
              echo "Not a push to main or dev: CI profile, no release."
              emit release false
              emit channel dev
              exit 0
          fi

          branch="${GITHUB_REF_NAME}"

          if [ "$branch" = "main" ]; then
              series_glob='v[0-9]*.[0-9]*.[0-9]*'
              series_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
              last_stable=$(git tag --list "$series_glob" --sort=-v:refname \
                  | grep -E "$series_re" | head -1 || true)
              if [ -z "$last_stable" ]; then
                  last_stable="v0.0.0"
                  range="HEAD"
              else
                  range="${last_stable}..HEAD"
              fi
              request_range="$range"
              IFS='.' read -r maj min pat <<< "${last_stable#v}"
              bump="patch"
              # --format=%s ends every subject with a newline. --pretty=format:
              # left the last one, the oldest commit of the range, unterminated,
              # so read dropped it: a range whose only feat was its oldest commit
              # was bumped as a patch.
              while IFS= read -r subject; do
                  [ -z "$subject" ] && continue
                  if echo "$subject" | grep -qE '(BREAKING|!):'; then
                      bump="major"; break
                  elif echo "$subject" | grep -qE '^feat(\([^)]+\))?!?:'; then
                      [ "$bump" != "major" ] && bump="minor"
                  fi
              done < <(git log "$range" --no-merges --format=%s)
              case "$bump" in
                  major) maj=$((maj+1)); min=0; pat=0 ;;
                  minor) min=$((min+1)); pat=0 ;;
                  patch) pat=$((pat+1)) ;;
              esac
              tag="v${maj}.${min}.${pat}"
              prerelease="false"
              title="Ergopti ${tag}"
          else
              # dev branch — v0.0.0-dev.N series
              series_glob='v0.0.0-dev.*'
              series_re='^v0\.0\.0-dev\.[0-9]+$'
              # Filtered like the stable series: a tag such as v0.0.0-dev.4-hotfix
              # matches the glob, and its number is not an integer.
              last_dev=$(git tag --list "$series_glob" --sort=-v:refname \
                  | grep -E "$series_re" | head -1 || true)
              if [ -z "$last_dev" ]; then
                  next_n=1
                  request_range="HEAD"
              else
                  last_n="${last_dev##*.}"
                  next_n=$((last_n + 1))
                  request_range="${last_dev}..HEAD"
              fi
              tag="v0.0.0-dev.${next_n}"
              prerelease="true"

              # The sidebar of the repository home truncates long titles, and the
              # version is what a reader needs from it.
              title="Ergopti ${tag}"
          fi

          # A commit that a tag of its series already contains was published
          # by an earlier run, as that tag or inside it. The number above only
          # counts tags, so "Re-run all jobs" on an older run would otherwise
          # publish that older code under the next number, and the updaters,
          # which order tags by version, would offer it as the newest release.
          # Every tag of the series is tested, not only the newest: after a
          # force push the newest tag no longer descends from the old commits.
          # The listing is captured first, so a failing git fails the step
          # rather than reading as "never released".
          listed=$(git tag --list "$series_glob" --contains HEAD --sort=v:refname)
          covered=()
          while IFS= read -r listed_tag; do
              if [[ "$listed_tag" =~ $series_re ]]; then covered+=("$listed_tag"); fi
          done <<< "$listed"
          if [ "${#covered[@]}" -gt 0 ]; then
              later=""
              [ "${#covered[@]}" -gt 1 ] && later=" and $(( ${#covered[@]} - 1 )) later tag(s)"
              echo "::notice::This commit is already part of ${covered[0]}${later}, which an earlier run published: CI profile, no release. A half-published release of it is finished with 'Re-run failed jobs' on the run that created that tag, before any 'Re-run all jobs' there, or by hand: delete an orphan tag, or write a published release's notes with gh release edit. The next push supersedes it either way."
              emit release false
              emit channel dev
              exit 0
          fi

          # A maintainer forces the next stable version with a line of its own
          # in a commit message since the last stable tag:
          #
          #     Release-As: 1.0.4
          #
          # (git commit --trailer 'Release-As: 1.0.4' writes it). The newest
          # commit carrying one wins, and it replaces the version computed from
          # the subjects, breaking or not. It must be MAJOR.MINOR.PATCH without
          # a v prefix or leading zeros, strictly greater than the last stable
          # tag, and not a tag already: anything else fails the plan rather
          # than publishing the computed number the maintainer overrode. Once
          # the tag exists the range starts after it, so a request never
          # carries into a later release, and this runs after the ancestry
          # guard so rerunning a published request stays inert. dev ignores it:
          # its numbering is a counter, not a version.
          messages=$(git log "$request_range" --format='@@release-as-commit %H%n%B')
          request=""
          request_commit=""
          current=""
          while IFS= read -r line; do
              line="${line%$'\r'}"
              if [[ "$line" == "@@release-as-commit "* ]]; then
                  current="${line#@@release-as-commit }"
                  [ -n "$request_commit" ] && [ "$current" != "$request_commit" ] && break
                  continue
              fi
              if [[ "$line" =~ ^[Rr][Ee][Ll][Ee][Aa][Ss][Ee]-[Aa][Ss]:[[:space:]]*(.*)$ ]]; then
                  value="${BASH_REMATCH[1]}"
                  value="${value%"${value##*[![:space:]]}"}"
                  if [ -z "$request_commit" ]; then
                      request_commit="$current"
                      request="$value"
                  elif [ "$value" != "$request" ]; then
                      echo "::error::Commit ${request_commit:0:12} holds two different Release-As lines ('$request' and '$value'); keep one."
                      exit 1
                  fi
              fi
          done <<< "$messages"
          if [ -n "$request_commit" ] && [ "$branch" != "main" ]; then
              echo "::notice::Release-As '$request' in commit ${request_commit:0:12} applies to main only: dev keeps $tag."
          elif [ -n "$request_commit" ]; then
              number='(0|[1-9][0-9]{0,8})'
              if [[ ! "$request" =~ ^${number}\.${number}\.${number}$ ]]; then
                  echo "::error::Release-As '$request' in commit ${request_commit:0:12} is not MAJOR.MINOR.PATCH (digits only, no v prefix, no leading zeros)."
                  exit 1
              fi
              r_maj="${BASH_REMATCH[1]}"; r_min="${BASH_REMATCH[2]}"; r_pat="${BASH_REMATCH[3]}"
              IFS='.' read -r s_maj s_min s_pat <<< "${last_stable#v}"
              if ! (( r_maj > s_maj || (r_maj == s_maj && (r_min > s_min || (r_min == s_min && r_pat > s_pat))) )); then
                  echo "::error::Release-As $request in commit ${request_commit:0:12} is not greater than the last stable tag $last_stable."
                  exit 1
              fi
              requested_tag="v${request}"
              # Captured, never piped: under pipefail a failing ls-remote must
              # fail the step, not read as "tag free".
              local_tag=$(git tag --list "$requested_tag")
              remote_tag=$(git ls-remote --tags origin "refs/tags/$requested_tag")
              if [ -n "$local_tag" ] || [ -n "$remote_tag" ]; then
                  echo "::error::Release-As $request in commit ${request_commit:0:12} names $requested_tag, which already exists as a tag."
                  exit 1
              fi
              echo "::notice::Release-As $request in commit ${request_commit:0:12} replaces the computed $tag ($bump bump)."
              tag="$requested_tag"
              title="Ergopti ${tag}"
          fi

          # Skip if the tag already exists (duplicate push guard). The listing is
          # captured before it is tested: piped into grep under pipefail, a
          # failing ls-remote read as "tag free" and planned a release.
          taken=$(git ls-remote --tags origin "refs/tags/$tag")
          if [ -n "$taken" ]; then
              echo "::notice::Tag '$tag' already exists: CI profile, no release."
              emit release false
              emit channel dev
              exit 0
          fi

          version="${tag#v}"
          channel="$(node tools/build/release-channel.cjs "$tag")"
          emit release true
          emit tag "$tag"
          emit version "$version"
          emit title "$title"
          emit prerelease "$prerelease"
          emit channel "$channel"
          echo "Resolved: tag=$tag version=$version prerelease=$prerelease channel=$channel"
          echo "Title: $title"

      - name: Select the proposed one-candidate native qualification
        id: qualification
        env:
          ERGOPTI_DEV_RELEASE_RELEASE: ${{ steps.meta.outputs.release }}
          ERGOPTI_DEV_RELEASE_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          ERGOPTI_DEV_RELEASE_CHANNEL: ${{ steps.meta.outputs.channel }}
          ERGOPTI_DEV_RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          ERGOPTI_DEV_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: node tools/ci/dev-release-qualification.cjs --publication-select >> "$GITHUB_OUTPUT"

      - name: Persist the exact validated publication plan
        env:
          CI_OS_SELECTION: ${{ inputs.os_lanes || 'all' }}
          CI_PLAN_RELEASE: ${{ steps.meta.outputs.release }}
          CI_PLAN_VERSION: ${{ steps.meta.outputs.version }}
          CI_PLAN_TAG: ${{ steps.meta.outputs.tag }}
          CI_PLAN_TITLE: ${{ steps.meta.outputs.title }}
          CI_PLAN_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          CI_PLAN_CHANNEL: ${{ steps.meta.outputs.channel }}
          CI_PLAN_LINUX_BUNDLE: ${{ steps.contract.outputs.linux_bundle }}
          CI_PLAN_NATIVE_QUALIFICATION_PROFILE: ${{ steps.qualification.outputs.native_qualification_profile }}
          CI_PLAN_LANE_WINDOWS: ${{ steps.lanes.outputs.lane_windows }}
          CI_PLAN_LANE_MACOS: ${{ steps.lanes.outputs.lane_macos }}
          CI_PLAN_LANE_LINUX: ${{ steps.lanes.outputs.lane_linux }}
        run: node tools/ci/publication-plan.cjs create ci-publication-plan.json

      - name: Retain the plan for failed-job reruns
        uses: actions/upload-artifact@v4
        with:
          name: ci-publication-plan-${{ github.sha }}-${{ github.run_id }}
          path: ci-publication-plan.json
          if-no-files-found: error
          overwrite: true

  # ========================================================
  # ========================================================
  # ======= 2/ One lane per OS: tests, package, gate =======
  # ========================================================
  # ========================================================

  # A called workflow gets no caller env and no secrets beyond those listed
  # here. version is empty outside a release, which keeps the CI build stamps.
  # The private signing secrets are passed only on a release run, so no pull
  # request or dispatch run, even from a branch of this repository, can read
  # them; SPARKLE_PUBLIC_KEY is public and keeps every CI package launchable.
  # Each caller needs the root alone, so Common and the three OS lanes start together.

  # ─────────────────────────────────────────────────
  # 2.1) macOS — Hammerspoon, Swift launcher, ErgoptiPlus.app + launch gate
  # ─────────────────────────────────────────────────
  macos:
    name: 'macOS'
    needs: [validate, prepare-common]
    if: needs.validate.outputs.lane_macos == 'true'
    uses: ./.github/workflows/ci-macos.yml
    # Its E2E stage awaits the parallel managed Ollama build artifact.
    permissions:
      contents: read
      actions: read
    with:
      release: ${{ needs.validate.outputs.release == 'true' }}
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
      prerelease: ${{ needs.validate.outputs.prerelease }}
      channel: ${{ needs.validate.outputs.channel }}
    secrets:
      SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
      SPARKLE_ED_PRIVATE_KEY: ${{ needs.validate.outputs.release == 'true' && secrets.SPARKLE_ED_PRIVATE_KEY || '' }}
      MACOS_SIGNING_CERTIFICATE_BASE64: ${{ needs.validate.outputs.release == 'true' && secrets.MACOS_SIGNING_CERTIFICATE_BASE64 || '' }}
      MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ needs.validate.outputs.release == 'true' && secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD || '' }}

  # ─────────────────────────────────────────────────
  # 2.2) Windows — AHK unit + E2E, release exe
  # ─────────────────────────────────────────────────
  windows:
    name: 'Windows'
    needs: [validate, prepare-common]
    if: needs.validate.outputs.lane_windows == 'true'
    uses: ./.github/workflows/ci-windows.yml
    with:
      release: ${{ needs.validate.outputs.release == 'true' }}
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
      prerelease: ${{ needs.validate.outputs.prerelease }}
      channel: ${{ needs.validate.outputs.channel }}
    secrets:
      WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ needs.validate.outputs.release == 'true' && secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 || '' }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ needs.validate.outputs.release == 'true' && secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD || '' }}
      WINDOWS_SIGNER_SUBJECT: ${{ needs.validate.outputs.release == 'true' && secrets.WINDOWS_SIGNER_SUBJECT || '' }}
      SIGNPATH_API_TOKEN: ${{ needs.validate.outputs.release == 'true' && secrets.SIGNPATH_API_TOKEN || '' }}

  # ─────────────────────────────────────────────────
  # 2.3) Linux — unit tests, E2E, package, installations and verdict
  # ─────────────────────────────────────────────────
  linux:
    name: 'Linux'
    needs: [validate, prepare-common]
    if: needs.validate.outputs.lane_linux == 'true'
    uses: ./.github/workflows/ci-linux.yml
    with:
      release: ${{ needs.validate.outputs.release == 'true' }}
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
      prerelease: ${{ needs.validate.outputs.prerelease }}
      channel: ${{ needs.validate.outputs.channel }}
      linux_bundle: ${{ needs.validate.outputs.linux_bundle }}

  # ─────────────────────────────────────────────────
  # 2.4) Common — shared JavaScript, property, mutation and site suites
  # ─────────────────────────────────────────────────
  core:
    name: 'YAML, shared code & web'
    needs: [validate, prepare-common]
    uses: ./.github/workflows/ci-common.yml
    permissions:
      contents: read
      actions: read
    with:
      common_plan: ${{ needs.prepare-common.outputs.plan }}
      release: ${{ needs.validate.outputs.release == 'true' }}
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
      prerelease: ${{ needs.validate.outputs.prerelease }}
      channel: ${{ needs.validate.outputs.channel }}

  # ========================================================
  # ========================================================
  # ======= 3/ Release — verify every lane, publish ========
  # ========================================================
  # ========================================================

  # Runs after every lane, whatever their results, so a red lane fails the
  # preflight by name instead of skipping publication silently. The needs
  # context is the exact lane result map the preflight admits; a missing
  # retained artifact or output fails it too. Publication secrets reach it
  # only on a push, the one event that can publish.
  publication:
    name: 'Release'
    needs:
      - macos
      - windows
      - linux
      - core
    if: always() && !cancelled()
    uses: ./.github/workflows/ci-release.yml
    permissions:
      contents: write
    with:
      os_lanes: ${{ inputs.os_lanes || 'all' }}
      lane_results: ${{ toJSON(needs) }}
    secrets:
      PAT_ERGOPTI: ${{ github.event_name == 'push' && secrets.PAT_ERGOPTI || '' }}
      HOMEBREW_TAP_TOKEN: ${{ github.event_name == 'push' && secrets.HOMEBREW_TAP_TOKEN || '' }}
      WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ github.event_name == 'push' && secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 || '' }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD || '' }}
      WINDOWS_SIGNER_SUBJECT: ${{ github.event_name == 'push' && secrets.WINDOWS_SIGNER_SUBJECT || '' }}
      SIGNPATH_API_TOKEN: ${{ github.event_name == 'push' && secrets.SIGNPATH_API_TOKEN || '' }}
