<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title data-i18n="menu.debug.healthcheck"></title>
		<script src="../a11y_prefs.js"></script>
		<link rel="stylesheet" href="../theme.css" />
		<link rel="stylesheet" href="style.css" />
		<script src="../dom_utils.js"></script>
		<script src="../host_bridge.js"></script>
		<script src="../i18n.js"></script>
		<script src="../redact.js"></script>
		<script src="model.js"></script>
		<script src="checks.js"></script>
	</head>
	<body>
		<h1 class="theme-sr-only" data-i18n="menu.debug.healthcheck"></h1>
		<header class="toolbar">
			<menu class="buttons">
				<li class="toolbar-left">
					<button
						type="button"
						id="btn-open-logs"
						disabled
						data-i18n="healthcheck.toolbar.open_logs"
					></button>
				</li>
				<li id="collection-controls">
					<button
						type="button"
						id="btn-collect-windows"
						data-i18n="healthcheck.collection.start"
						disabled
					></button>
					<button
						type="button"
						id="btn-collection-cancel"
						data-i18n="common.cancel"
						hidden
					></button>
					<button
						type="button"
						id="btn-collection-guided"
						data-i18n="healthcheck.collection.guided"
						hidden
					></button>
					<button
						type="button"
						id="btn-collection-skip"
						data-i18n="healthcheck.collection.skip"
						hidden
					></button>
					<button
						type="button"
						id="btn-collection-open"
						data-i18n="healthcheck.collection.open"
						hidden
					></button>
					<p id="collection-progress" role="status" aria-live="polite"></p>
				</li>
				<li class="toolbar-center">
					<button
						type="button"
						id="btn-copy"
						disabled
						data-i18n="healthcheck.toolbar.copy"
					></button>
					<button
						type="button"
						id="btn-save"
						disabled
						data-i18n="healthcheck.toolbar.save"
					></button>
					<button
						type="button"
						id="btn-report"
						class="primary"
						disabled
						data-i18n="healthcheck.toolbar.report"
					></button>
				</li>
				<li class="toolbar-right">
					<button type="button" id="btn-cancel" disabled data-i18n="common.cancel"></button>
					<button
						type="button"
						id="btn-refresh"
						disabled
						data-i18n="healthcheck.toolbar.refresh"
					></button>
				</li>
			</menu>
			<p class="details">
				<input type="checkbox" id="chk-details" disabled />
				<label for="chk-details" data-i18n="healthcheck.details_checkbox"></label>
			</p>
			<p class="details">
				<input type="checkbox" id="chk-extensive" disabled />
				<label
					for="chk-extensive"
					id="deep-tests-label"
					data-i18n="healthcheck.deep_tests_checkbox"
				></label>
			</p>
			<section id="day-log" class="day-log">
				<p class="details">
					<input type="checkbox" id="chk-day-log" disabled />
					<label for="chk-day-log" data-i18n="healthcheck.day_log.checkbox"></label>
				</p>
				<p class="hint" data-i18n="healthcheck.day_log.hint"></p>
				<p class="hint" data-i18n="healthcheck.day_log.upload_notice"></p>
				<p id="day-log-status" role="status" aria-live="polite"></p>
				<details id="day-log-preview" hidden>
					<summary
						id="day-log-preview-title"
						data-i18n="healthcheck.day_log.preview_title"
					></summary>
					<!-- Scroll boxes are keyboard stops, so the keyboard scrolls them (WCAG 2.1.1). -->
					<pre id="day-log-preview-text" tabindex="0" aria-labelledby="day-log-preview-title"></pre>
				</details>
			</section>
			<p id="deep-progress" role="status" aria-live="polite"></p>
			<pre id="deep-results" tabindex="0" aria-labelledby="deep-tests-label"></pre>
			<p id="status" class="status info" role="status" aria-live="polite"></p>
		</header>
		<main id="content"></main>
		<details id="preview">
			<summary data-i18n="healthcheck.preview.title"></summary>
			<p class="hint" data-i18n="healthcheck.preview.hint"></p>
			<pre id="preview-text"></pre>
		</details>
		<script src="script.js"></script>
	</body>
</html>
