            ${{ runner.temp }}/managed-ollama-producer-build.log

      # ─────────────────────────────────────────────────
      # 1) Hammerspoon unit and contract tests
      # ─────────────────────────────────────────────────
      # The lane's entry job. Its name says "stubbed" because it is the check a
