# config_schema/examples/ahk_config.example.toml
# Example AHK v2 configuration — target schema after the Scope C refactor.
# Generated at first boot by the AHK driver from _shared/features/manifest.toml.
# The user edits this file freely; any unknown key triggers a warn at boot
# (strict in dev mode via the ERGOPTI_DEV=1 environment variable).
#
# Conventions:
#   - All keys are snake_case.
#   - Universal sections (read by AHK AND HS): [script], [hotstrings],
#     [llm], [metrics], [shortcuts].
#   - AHK-only sections are prefixed [ahk.*] (never read by HS).
#   - Every feature with an activation delay = explicit sub-section with
#     ``enabled`` (bool, required) + ``time_activation_seconds`` (number, omit
#     for instant activation).
#   - Tap-hold lives in its own file: ahk/tap_hold.toml.





# =========================
# =========================
# ======= 1. Script =======
# =========================
# =========================

[script]
locale = "fr"
log_level = "INFO"               # DEBUG | TRACE | DONE | INFO | START | SUCCESS | WARNING | ERROR
alt_gr_is_kana_remap = "auto"    # "auto" | true | false





# =============================
# =============================
# ======= 2. Hotstrings =======
# =============================
# =============================

[hotstrings]
trigger_char = "★"



# ====================================
# ===== 2.1 Autocorrection group =====
# ====================================

[hotstrings.autocorrection.accents]
enabled = true
time_activation_seconds = 0.5

[hotstrings.autocorrection.caps]
enabled = true
time_activation_seconds = 0.5

[hotstrings.autocorrection.errors]
enabled = true
time_activation_seconds = 0.5

[hotstrings.autocorrection.minus]
enabled = true
time_activation_seconds = 0.5

[hotstrings.autocorrection.minus_apostrophe]
enabled = true
time_activation_seconds = 0.5

[hotstrings.autocorrection.multiple_punctuation_marks]
enabled = true
time_activation_seconds = 0.5

[hotstrings.autocorrection.names]
enabled = true
time_activation_seconds = 0.5

[hotstrings.autocorrection.ou]
enabled = true
time_activation_seconds = 0.5

[hotstrings.autocorrection.suffixes_a_chaining]
enabled = true
time_activation_seconds = 0.5

[hotstrings.autocorrection.typographic_apostrophe]
enabled = true
time_activation_seconds = 0.5



# =========================================
# ===== 2.2 Distances reduction group =====
# =========================================

[hotstrings.distances_reduction.qu]
enabled = true
time_activation_seconds = 0.5

[hotstrings.distances_reduction.suffixes_a]
enabled = true
time_activation_seconds = 0.5

[hotstrings.distances_reduction.comma_j]
enabled = true
# omitting time_activation_seconds = instant activation

[hotstrings.distances_reduction.comma_far_letters]
enabled = true

[hotstrings.distances_reduction.dead_key_e_circumflex]
enabled = true

[hotstrings.distances_reduction.e_circumflex_e]
enabled = true
time_activation_seconds = 0.5

[hotstrings.distances_reduction.space_around_symbols]
enabled = true



# ====================================
# ===== 2.3 SFBs reduction group =====
# ====================================

[hotstrings.sfbs_reduction.comma]
enabled = true
time_activation_seconds = 0.5

[hotstrings.sfbs_reduction.e_circ]
enabled = true
time_activation_seconds = 0.5

[hotstrings.sfbs_reduction.e_grave]
enabled = true
time_activation_seconds = 0.5

[hotstrings.sfbs_reduction.bu]
enabled = true

[hotstrings.sfbs_reduction.i_e_acute]
enabled = true



# ===========================
# ===== 2.4 Rolls group =====
# ===========================

[hotstrings.rolls.hc]
enabled = true
time_activation_seconds = 0.5

[hotstrings.rolls.sx]
enabled = true
time_activation_seconds = 0.5

[hotstrings.rolls.cx]
enabled = true
time_activation_seconds = 0.5

[hotstrings.rolls.ct]
enabled = true
time_activation_seconds = 0.5

[hotstrings.rolls.ez]
enabled = true
time_activation_seconds = 0.5

[hotstrings.rolls.assign]
enabled = true

[hotstrings.rolls.assign_arrow_equal_left]
enabled = true

[hotstrings.rolls.assign_arrow_equal_right]
enabled = true

[hotstrings.rolls.assign_arrow_minus_left]
enabled = true

[hotstrings.rolls.assign_arrow_minus_right]
enabled = true

[hotstrings.rolls.bracket_quote]
enabled = true

[hotstrings.rolls.chevron_equal]
enabled = true

[hotstrings.rolls.chevron_greater]
enabled = true

[hotstrings.rolls.chevron_less]
enabled = true

[hotstrings.rolls.close_chevron_tag]
enabled = true
time_activation_seconds = 0.5

[hotstrings.rolls.comment_close]
enabled = true
time_activation_seconds = 0.5

[hotstrings.rolls.comment_open]
enabled = true
time_activation_seconds = 0.5

[hotstrings.rolls.english_negation]
enabled = true

[hotstrings.rolls.equal_string]
enabled = true

[hotstrings.rolls.hashtag_close_bracket]
enabled = true
time_activation_seconds = 0.5

[hotstrings.rolls.hashtag_open_bracket]
enabled = true
time_activation_seconds = 0.5

[hotstrings.rolls.hashtag_parenthesis]
enabled = true
time_activation_seconds = 0.5

[hotstrings.rolls.hashtag_quote]
enabled = true

[hotstrings.rolls.left_arrow]
enabled = true

[hotstrings.rolls.not_equal]
enabled = true

[hotstrings.rolls.paren_quote]
enabled = true



# ===============================
# ===== 2.5 Magic key group =====
# ===============================

[hotstrings.magic_key.replace]
enabled = true

[hotstrings.magic_key.repeat_corrections]
enabled = true
time_activation_seconds = 2.0

[hotstrings.magic_key.text_expansion]
enabled = true
time_activation_seconds = 2.0

[hotstrings.magic_key.text_expansion_auto]
enabled = true
time_activation_seconds = 2.0

[hotstrings.magic_key.text_expansion_emojis]
enabled = true
time_activation_seconds = 2.0

[hotstrings.magic_key.text_expansion_symbols]
enabled = true
time_activation_seconds = 2.0

[hotstrings.magic_key.text_expansion_symbols_typst]
enabled = true
time_activation_seconds = 2.0



# ==================================
# ===== 2.6 Dynamic hotstrings =====
# ==================================

[hotstrings.dynamic.date]
enabled = true

[hotstrings.dynamic.date_fr]
enabled = true

[hotstrings.dynamic.date_long_fr]
enabled = true

[hotstrings.dynamic.iban_prefixes]
enabled = true

[hotstrings.dynamic.phone_prefixes]
enabled = true

[hotstrings.dynamic.ssn_prefixes]
enabled = true

[hotstrings.dynamic.text_expansion_personal_information]
enabled = true
pattern_max_length = 1



# ==============================
# ===== 2.7 Personal group =====
# ==============================

[hotstrings.personal.autocorrection]
enabled = true
time_activation_seconds = 0.75

[hotstrings.personal.code]
enabled = true
time_activation_seconds = 0.75

[hotstrings.personal.email_shortcuts]
enabled = true
time_activation_seconds = 0.75

[hotstrings.personal.professional_vocabulary]
enabled = true
time_activation_seconds = 0.75

[hotstrings.personal.test]
enabled = true
time_activation_seconds = 0.75





# ======================
# ======================
# ======= 3. LLM =======
# ======================
# ======================

[llm]
enabled = true



# =======================
# ===== 3.1 Display =====
# =======================

[llm.display]
pred_indent = 0
show_info_bar = true
streaming = true
streaming_multi = true



# ==========================
# ===== 3.2 Generation =====
# ==========================

[llm.generation]
context_length = 500
min_words = 3
max_words = 15
temperature = 0.10
auto_raise_temp = true
reset_on_nav = true
sequential_mode = false



# ======================
# ===== 3.3 Models =====
# ======================

[llm.models]
selected = "ollama"
ollama = "qwen2.5:3b"



# ========================
# ===== 3.4 Profiles =====
# ========================

[llm.profiles]
active = "basic"
num_predictions = 3
auto_profile_for_model = true



# =======================
# ===== 3.5 Trigger =====
# =======================

[llm.trigger]
debounce_ms = 500
instant_on_word_end = true
after_hotstring = true
inline_autotype = false
secure_filter_enabled = true
url_bar_filter_enabled = true



# ==========================
# ===== 3.6 Navigation =====
# ==========================

[llm.navigation]
val_modifiers = ["alt"]





# ============================
# ============================
# ======= 4. Metrics ========
# ============================
# ============================

[metrics]
enabled = true
private_filter_enabled = true
secure_filter_enabled = true
system_auth_filter_enabled = true
show_wpm_menubar = false
wpm_menubar_colors = false



# ===================================
# ===== 4.1 Disabled / shortcut =====
# ===================================

[metrics.shortcuts]
apps = ""
typing = ""

[metrics.disabled_apps]
list = []





# ===============================
# ===============================
# ======= 5. Shortcuts ========
# ===============================
# ===============================

[shortcuts]
# Universal section; platform-specific variants live under [ahk.shortcuts.*].
get_hex_value = true
gpt = { enabled = true, link = "https://chatgpt.com/" }
search = { enabled = true, search_engine = "https://www.google.com", search_engine_url_query = "https://www.google.com/search?q=" }
microsoft_bold = true
take_note = { enabled = true, dated_notes = false, destination_folder = "D:\\Bureau" }
title_case = true
uppercase = true
paste_without_formatting = false
save = false
select_line = true
spotlight_mouse = true
surround_with_parentheses = true
teleport_mouse = true
wrap_text_if_selected = true



# ==================================
# ===== 5.1 Accented shortcuts =====
# ==================================

[shortcuts.a_grave]
enabled = true
letter = "v"

[shortcuts.e_acute]
enabled = true
letter = "c"

[shortcuts.e_circ]
enabled = true
letter = "x"

[shortcuts.e_grave]
enabled = true
letter = "z"





# ====================================
# ====================================
# ======= 6. AHK-only sections =======
# ====================================
# ====================================

# Sections read only by the AHK driver. HS ignores them (warn if present).



# ==========================
# ===== 6.1 ahk.layout =====
# ==========================

[ahk.layout]
ergopti_base = true
direct_access_digits = true
ergopti_alt_gr = true
ergopti_plus = true



# ============================================
# ===== 6.2 ahk.shortcuts (Windows-only) =====
# ============================================

[ahk.shortcuts]
ctrl_j = false
open_downloads = true
move = true
screen = true
screen_instant = true
win_caps_lock = true



# ==============================================
# ===== 6.3 ahk.shortcuts.alt_gr_caps_lock =====
# ==============================================

[ahk.shortcuts.alt_gr_caps_lock]
backspace = false
caps_lock = false
caps_word = false
ctrl_backspace = false
ctrl_delete = true
delete = false
enter = false
escape = false
one_shot_shift = false
tab = false



# =========================================
# ===== 6.4 ahk.shortcuts.alt_gr_lalt =====
# =========================================

[ahk.shortcuts.alt_gr_lalt]
backspace = false
caps_lock = false
caps_word = false
ctrl_backspace = true
ctrl_delete = false
delete = false
enter = false
escape = false
one_shot_shift = false
tab = false



# ============================================
# ===== 6.5 ahk.shortcuts.lalt_caps_lock =====
# ============================================

[ahk.shortcuts.lalt_caps_lock]
backspace = false
caps_lock = false
caps_word = true
ctrl_backspace = false
ctrl_delete = false
delete = false
enter = false
escape = false
one_shot_shift = false
tab = false



# ======================================
# ===== 6.6 ahk.shortcuts.personal =====
# ======================================

[ahk.shortcuts.personal]
laptop_broken_key = true
mouse_drag_window = true
mouse_tab_switching = true
professional_environment = false
programmable_keyboard = true



# ============================================
# ===== 6.7 ahk.shortcuts.script_control =====
# ============================================

[ahk.shortcuts.script_control]
script_altgr_backspace = "script_save_reload"
script_altgr_delete = "open_personal_shortcuts"
script_altgr_enter = "script_pause_toggle"
script_altgr_escape = "script_quit"



# ============================
# ===== 6.8 ahk.gestures =====
# ============================

# AHK vocabulary is limited to Windows Precision Touchpad gestures (3/4 fingers).
# The richer HS vocabulary (2/3/4/5 fingers + diagonals) lives under [hs.gestures.*].

[ahk.gestures]
enabled = true
swipe_3_down = "tab_close"
swipe_3_left = "tab_prev"
swipe_3_right = "tab_next"
swipe_3_up = "tab_new"
swipe_4_down = "win_app_prev"
swipe_4_left = "desktop_prev"
swipe_4_right = "desktop_next"
swipe_4_up = "win_app_next"
tap_3 = "left_click_toggle"
tap_4 = "screenshot_window_clipboard"



# =======================================
# ===== 6.9 ahk.metrics (overrides) =====
# =======================================

[ahk.metrics]
filter_private_browsing = true   # Win-specific : InPrivate Edge / Incognito Chrome detection
