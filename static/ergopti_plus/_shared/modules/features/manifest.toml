[[menu.layout_menu]]
type = "command"
id = "scope_restore"
i18n = "common.restore_recommended"
platforms = ["ahk", "hs"]
unavailable = "hide"

[[menu.layout_menu]]
type = "command"
id = "scope_clear"
i18n = "common.clear_to_system"
platforms = ["ahk", "hs"]
