<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title data-i18n="menu.layout.emulated_layout"></title>
		<script src="../a11y_prefs.js"></script>
		<script src="../page_locale.js"></script>
		<link rel="stylesheet" href="../theme.css" />
		<link rel="stylesheet" href="../error_dialog/style.css" />
		<link rel="stylesheet" href="style.css" />
		<script src="../host_bridge.js"></script>
		<script src="../i18n.js"></script>
	</head>
	<body>
		<header>
			<h1 id="title" data-i18n="menu.layout.emulated_layout"></h1>
			<label for="search" data-i18n="emulation_picker.search_label"></label>
			<!-- A combobox over the list below: the arrows move the active choice
			     while the focus stays in the field (WAI-ARIA combobox pattern). -->
			<input
				type="search"
				id="search"
				role="combobox"
				aria-autocomplete="list"
				aria-expanded="true"
				aria-controls="choices"
				autocomplete="off"
				spellcheck="false"
				data-i18n-placeholder="emulation_picker.search_placeholder"
			/>
		</header>
		<main>
			<ul id="choices" role="listbox" tabindex="0" aria-labelledby="title"></ul>
			<p id="status" role="status" aria-live="polite"></p>
		</main>
		<footer class="buttons">
			<button type="button" id="btn-cancel" data-i18n="button.cancel"></button>
			<button
				type="button"
				id="btn-choose"
				class="primary"
				disabled
				data-i18n="emulation_picker.choose"
			></button>
		</footer>
		<script src="script.js"></script>
	</body>
</html>
