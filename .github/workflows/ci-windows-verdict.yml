# .github/workflows/ci-windows-verdict.yml
#
# Windows verdict stage: requires all four stages and a successful launch of
# this commit.
# Called by ci-windows.yml as its windows-ok stage.

name: 'Windows verdict'

on:
  workflow_call:
    inputs:
      release:
        description: True when ci.yml's plan resolved a free release tag
        required: true
        type: boolean
      version:
        description: Release version without the leading v; empty unless release
        required: true
        type: string
      tag:
        description: Release tag; empty unless release
        required: true
        type: string
      prerelease:
        description: "'true' for a dev prerelease; empty unless release"
        required: true
        type: string
      channel:
        description: Update channel stamped into the exe, main or dev
        required: true
        type: string
      predecessors:
        description: The lane's needs context for this stage (launch-windows), as JSON
        required: true
        type: string

permissions:
  contents: read

env:
  ERGOPTI_DEV_RELEASE_RELEASE: ${{ inputs.release }}
  ERGOPTI_DEV_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
  ERGOPTI_DEV_RELEASE_CHANNEL: ${{ inputs.channel }}
  ERGOPTI_DEV_RELEASE_TAG: ${{ inputs.tag }}
  ERGOPTI_DEV_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  windows-ok:
    name: 'Mandatory jobs and launch evidence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Download launch evidence
        uses: actions/download-artifact@v4
        with:
          pattern: windows-launch-evidence
          path: ${{ runner.temp }}/launch-evidence

      - name: Install locked evidence validation dependencies
        run: npm ci --ignore-scripts

      - name: Verify mandatory jobs and launch scenarios
        env:
          NEEDS: ${{ inputs.predecessors }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          NEEDS="$(node tools/ci/ci-stage-status.cjs complete windows)"
          export NEEDS
          node tools/test/desktop-ci-evidence.cjs verify windows "$RUNNER_TEMP/launch-evidence"
