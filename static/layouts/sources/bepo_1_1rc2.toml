# Bépo 1.1rc2, the layout source of the official bépo macOS layout (docs/design/layout-source-format.md).
# Imported from static/layouts/registry/bepo/bepo.keylayout (bépo 1.1rc2, see that folder's NOTICE): it keeps
# its 94 dead keys and their 115 chained transitions, up to three deep. Licence: CC BY-SA
# (static/layouts/registry/bepo/LICENSE); this derived file is shared under the same licence.
# tools/test/test-layout-sources.cjs proves it compiles back to that layout and that its Windows
# DLL tables carry every chain Windows can hold (exports.windows decided by the coordinator on 2026-11-11).
