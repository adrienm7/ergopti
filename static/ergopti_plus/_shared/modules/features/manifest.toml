platforms = ["ahk", "hs", "linux"]

[sections.llm.generation]
# Linux joined on 2026-08-06, when the generation settings gained controls. It
# read them from the shared canonical defaults and had no way to change them,
# so they were constants wearing the shape of settings — and declaring a
# capability with no control is what ADR-008 removed a notifier for.
