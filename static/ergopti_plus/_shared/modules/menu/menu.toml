# looks like.
[[menu.metrics_menu]]
type = "list"
id = "exclude_apps"
disabled_when = ["keystats_enabled"]
[[menu.metrics_menu]]
type = "---"

# `check` since 2026-08-07, and the conversion settled a divergence nobody could
# see: this row read "Encrypt logs on disk (Security)" on Windows and macOS and
# "Encrypt data at rest" on Linux. Two labels for one switch, because each driver
# picked its own key from a declaration that named neither.
#
# `menu.metrics.encrypt_toggle` wins because it says WHAT is encrypted — the logs
# on disk — where the other names a category. `checked_when` closes the second
# half of the same gap: the row had no predicate, so all three computed the tick
# themselves, which the Linux builder had a comment apologising for.
[[menu.metrics_menu]]
type = "check"
id = "encryption"
i18n = "menu.metrics.encrypt_toggle"
checked_when = ["metrics_encrypt_enabled"]
disabled_when = ["keystats_enabled"]

# The readouts this driver answers in its log rather than in a window. They are
# Linux's own — macOS and Windows open a metrics WINDOW for the same figures —
# and until 2026-08-06 they were built in ui/menu/builder.lua with nothing
# describing them. A driver-specific row is fine; a driver-specific row nobody
# declared is a row no gate can compare, reason about or find.

[[menu.metrics_menu]]
type = "---"

# Three rows stood here until 2026-08-07 — "Session statistics", "Current WPM"
# and "Per-application statistics" — and each one's entire effect was a line in
# the driver's log. Their labels promised figures the user never saw. The same
# menu already opens the windows that hold them: `show_typing` and `show_apps`
# are declared above for all three drivers, and the WPM
# widget toggle shows the live rate. They were removed rather than pointed at
# those windows, which would have given this menu two rows opening one window.

# The user's pause and session reset, on all three drivers since 2026-10-24 with
# one meaning (docs/design/metrics-suspend-and-reset-session.md): the pause is a
# state of its own, apart from the driver pause and the secure-field filter, and
# the reset ends the typing session without deleting anything stored. Ticked from
# the keystats's own pause state: it used to glue a " ✓" onto the label, which
# puts one platform's convention inside a string twenty other languages also
# read — and bypasses the tray's native check item.
[[menu.metrics_menu]]
type = "check"
id = "metrics_suspend"
i18n = "menu.metrics.suspend_collection"
checked_when = ["metrics_suspended"]

[[menu.metrics_menu]]
type = "command"
id = "metrics_reset_session"
i18n = "menu.metrics.reset_session"


# The at-rest migration readout. Converting a year of stored rows takes minutes,
# and without this row the user ticks « chiffrer au repos » and sees nothing
# happen at all — so it reports progress and offers to stop. Linux's alone: it is
# the driver that migrates in the background rather than on the next launch.
#
# A `list` because its label IS the progress — "n / total" — which no static
# declaration can spell.
[[menu.metrics_menu]]
type = "list"
id = "metrics_migration"
platforms = ["linux"]
reason_key = "platform_reason.only_linux_migrates_in_the_background"
[[menu.layout_menu]]
type = "toggle"
id = "layout_toggle"
i18n = "menu.layout.enable"
checked_when = ["layout_enabled"]
category = "Layout"
# Only Windows emulates the Ergopti layout itself, so only Windows has an
# emulation to switch off. macOS installs the layout as a system input source and
# Linux remaps through kanata; declared for them, this row had no command and was
# skipped in silence, which is the failure the renderer now reports.
platforms = ["ahk"]
reason_key = "platform_reason.layout_emulation_is_windows_only"

# The keyboard-layout scope's restore and clear, right after the switch Windows
# shows (the first group). Windows and macOS register both on their scope
# owners. Not applicable on Linux, which has none of these settings (it types
# through the XKB layout the system selects), so the rows are hidden there.
[[menu.layout_menu]]
type = "command"
id = "scope_restore"
i18n = "common.restore_recommended"
platforms = ["ahk", "hs"]
unavailable = "hide"

[[menu.layout_menu]]
type = "command"
id = "scope_clear"
i18n = "common.clear_to_system"
platforms = ["ahk", "hs"]
unavailable = "hide"

# Two sections, so a user reads at a glance which rows are about the custom
# layout (the registry layouts the layout manager installs, the one typing
# uses, and each driver's own Ergopti rows) and which ones work whatever layout
# they type on.
[[menu.layout_menu]]
type = "---"

[[menu.layout_menu]]
type = "section_header"
i18n = "menu.layout.header_custom"

# macOS and Linux list installed native input sources and select one through
# the OS. Windows reports its enabled emulation as a disabled status row;
# selection belongs to the shared layout manager immediately below it.
[[menu.layout_menu]]
type = "list"
id = "custom_layouts"
status_rows.none_installed = [{ type = "label", i18n = "menu.layout.none_installed" }]

# Opens the shared layout manager window (_shared/ui/layout_manager): the
# catalogue of the layout registry, to install, update or uninstall a layout.
[[menu.layout_menu]]
type = "command"
id = "layout_manager"
i18n = "menu.layout.manage"

# The two blocks macOS alone has. It installs a .bundle keyboard layout through
# TIS — the OS's own input-source mechanism, with a user scope and a system scope
# — and it draws a menubar icon whose variant the user picks. Neither concept
# exists on the other two drivers: Windows installs a .klc through its own
# installer and Linux installs an XKB layout, and neither has a menubar.
#
# Both were built by hand in ui/menu/menu_keyboard_layout.lua and described
# nowhere until 2026-08-07, so ten rows of a shared menu had no platforms field
# and nothing to compare them against.
[[menu.layout_menu]]
type = "list"
id = "layout_bundle"
status_rows.no_bundle = [{ type = "label", i18n = "menu.layout.no_bundle" }]
platforms = ["hs"]
