# .github/workflows/ci-linux.yml
#
# The Linux lane of the CI pipeline. ci.yml calls it once per run, after its
# validate job, as the job named "Linux". Every stage is a job of this
# workflow, so it renders in two levels, "Linux / <Stage> (<subject>)": a matrix
# job keeps a static stage name and GitHub appends its row, and a single job
# names its subject in parentheses. One lane with one entry job and one exit
# job:
#
#   unit tests -> integration tests -> E2E tests (5) -> package -> install and launch (17) -> verdict
#                 driver and native     domain rows                 5 archive installs     (evidence gate)
#                                                                   9 first installs
#                                                                   3 package runs
#                                                        \-> Flatpak (parallel to install and launch)
#
# The E2E column is one matrix job (e2e-linux) whose rows split its harnesses by
# domain; tools/test/fixtures/linux-e2e-shards.json assigns each step to one
# row. package-linux needs the whole matrix, and
# linux-ok requires one evidence document per row.
#
# The driver is assembled and packaged ONCE per run, by package-linux, into the
# artifact assets-linux. The .deb, .rpm and AppImage smokes install those exact
# files on their own pristine hosts, and on a release run ci-release.yml's
# release job publishes those same files. linux-ok checks every job's evidence
# against .github/linux-ci-coverage.json. The lane has no outputs: its own
# result is what the release waits for, and the release collects assets-linux
# through its assets-* download pattern.
#
# Inputs, all computed by the plan steps of ci.yml's validate job:
#   release       true on a run that publishes; it only sets artifact retention.
#   version       the release version, '' otherwise ('' writes a commit-only
#                 build stamp, the CI behaviour).
#   linux_bundle  the tarball asset name, resolved once from the updater
#                 release contract (defaults.json) and validated there.
#
# No concurrency block: the caller's group already covers the whole run, and
# reusing it here would cancel this workflow from inside its own run.

name: Linux

on:
  workflow_call:
    inputs:
      release:
        description: True when this run publishes a release; only sets artifact retention
        required: true
        type: boolean
      version:
        description: Release version stamped into the Linux tree, empty outside a release
        required: true
        type: string
      tag:
        description: Exact release tag from the validated release plan
        required: true
        type: string
      prerelease:
        description: Exact prerelease string from the validated release plan
        required: true
        type: string
      channel:
        description: Exact update channel from the validated release plan
        required: true
        type: string
      linux_bundle:
        description: Linux tarball asset name from the updater release contract
        required: true
        type: string

permissions:
  contents: read

env:
  ERGOPTI_DEV_RELEASE_RELEASE: ${{ inputs.release }}
  ERGOPTI_DEV_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
  ERGOPTI_DEV_RELEASE_CHANNEL: ${{ inputs.channel }}
  ERGOPTI_DEV_RELEASE_TAG: ${{ inputs.tag }}
  ERGOPTI_DEV_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  # ─────────────────────────────────────────────────
  # 1) Linux Lua driver unit and native contract tests
  # ─────────────────────────────────────────────────
  # The lane's entry job: the only one of this file that needs nothing.
  # One row per domain group of static/ergopti_plus/linux/tests/support/
  # module_groups.lua (run.lua --module=<group>); the groups partition the
  # suite, so the rows together run every test module exactly once. The list
  # below must equal those groups, in order, except the integration group,
  # which the Integration stage runs (test-linux-ci-evidence.cjs).
  test-linux:
    name: 'Unit tests'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [meta, core, infra, input, modules, ui]
    env:
      LINUX_UNIT_GROUP: ${{ matrix.group }}

    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT and native event dependencies
        # The test runner (tests/run.lua) uses LuaJIT. Test discovery falls
        # back to io.popen("find") when lfs is unavailable — no luarocks needed.
        run: |
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y luajit lua-luv lua-filesystem sqlite3
          luajit -e 'assert(require("luv"), "native luv integration is mandatory")'

      - name: Run the driver unit test suite
        working-directory: static/ergopti_plus/linux
        # Wrapped in the unified reporter: streams output unchanged, exits with the
        # runner's code (CI gating preserved), and emits GitHub annotations + a JSON
        # summary on failure. report.cjs lives at the repo root tools/.
        id: linux_unit
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-unit-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-unit-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-unit-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-unit-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          set -euo pipefail
          set +e
          node ../../../tools/test/report.cjs --name linux-lua --json "${{ runner.temp }}/linux-lua.json" -- luajit tests/run.lua --module="$LINUX_UNIT_GROUP" 2>&1 | tee "$RUNNER_TEMP/linux-unit.log"
          unit_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          if [ "${unit_pipeline_status[0]}" -ne 0 ]; then exit "${unit_pipeline_status[0]}"; fi
          exit "${unit_pipeline_status[1]}"
          else
              exit 1
          fi
      # Keep the parsed timing errors beside the public log of the same failed run.
      - name: Upload failed unit log
        if: ${{ failure() && !cancelled() && steps.linux_unit.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-unit-failure-log-${{ matrix.group }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/linux-unit.log
            ${{ runner.temp }}/linux-lua.json
          if-no-files-found: error

      # The original red unit run owns this public assertion; no rerun is substituted.
      - name: Emit Configuration assertion from failed unit log
        if: ${{ failure() && !cancelled() && steps.linux_unit.outcome == 'failure' }}
        shell: bash
        run: node tools/test/linux-unit-failure-excerpt.cjs "$RUNNER_TEMP/linux-unit.log"

      # Timing JSON is best-effort diagnostics; deferred or interrupted runs may have no file.
      - name: Retain Linux Lua timing diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lua-timings-linux-unit-${{ matrix.group }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-lua.json
          if-no-files-found: warn
          retention-days: 7

      - name: Record mandatory unit evidence
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-unit-suite.json"
          node tools/ci/dev-release-qualification.cjs --scope linux-unit-suite --receipt "$receipt"
          mode="$(node tools/ci/dev-release-qualification.cjs --scope linux-unit-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-unit-suite: qualified=false; no suite assertion count is claimed."
              node tools/test/linux-ci-evidence.cjs record-deferred-suite --job test-linux --shard "$LINUX_UNIT_GROUP" --output "$RUNNER_TEMP/linux-ci-evidence/test-linux-$LINUX_UNIT_GROUP.json" --sha "$GITHUB_SHA" --architecture "$RUNNER_ARCH" --receipt "$receipt"
          elif [ "$mode" = full ]; then
          set -euo pipefail
          unit_assertions=$(jq -r '.passed' "$RUNNER_TEMP/linux-lua.json")
          node tools/test/linux-ci-evidence.cjs record \
              --job test-linux \
              --shard "$LINUX_UNIT_GROUP" \
              --output "$RUNNER_TEMP/linux-ci-evidence/test-linux-$LINUX_UNIT_GROUP.json" \
              --sha "$GITHUB_SHA" \
              --architecture "$RUNNER_ARCH" \
              --distro ubuntu \
              --session x11-wayland-headless \
              --interpreter "$(luajit -v 2>&1 | head -1)" \
              --subject "unit-$LINUX_UNIT_GROUP=$unit_assertions"
          else
              exit 1
          fi
      - name: Upload mandatory unit evidence
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-ci-evidence-test-linux-${{ matrix.group }}
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/test-linux-${{ matrix.group }}.json
          if-no-files-found: error

      - name: Retain the source-bound linux-unit-suite qualification
        if: ${{ always() && matrix.group == 'meta' }}
        uses: actions/upload-artifact@v4
        with:
          name: assets-qualification-linux-unit-suite
          path: ${{ runner.temp }}/stable-linux-unit-suite.json
          if-no-files-found: warn

  # ─────────────────────────────────────────────────
  # 2) Integration tests: real module wiring and native equivalence
  # ─────────────────────────────────────────────────
  # driver runs the integration group of module_groups.lua (run.lua
  # --module=integration), which no unit row runs: the daemon entry point as a
  # child process, the real tap-hold stack on the shipped defaults, the real
  # sqlite3, real files, real signals and timers. native runs the equivalence
  # of the native metrics aggregation and histograms, the actual LuaJIT XI2 ABI
  # against a real libXi under Xvfb and, on a manual dispatch, the official
  # runtime and model acceptance. Each row records its evidence; linux-ok
  # requires both rows.
  integration-linux:
    name: 'Integration tests'
    needs: [test-linux]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [driver, native]
    env:
      LINUX_INTEGRATION_GROUP: ${{ matrix.group }}
    outputs:
      ci_predecessors: ${{ toJSON(needs) }}
      ci_source_sha: ${{ github.sha }}
      ci_run_id: ${{ github.run_id }}
      ci_attempt: ${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT and native event dependencies
        run: |
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y luajit lua-luv lua-filesystem sqlite3
          luajit -e 'assert(require("luv"), "native luv integration is mandatory")'

      - name: Verify native metrics aggregation equivalence
        if: matrix.group == 'native'
        run: python3 tools/test/test-linux-metrics-aggregation-native.py

      - name: Verify native cross-driver histogram multiplicity
        if: matrix.group == 'native'
        run: python3 tools/test/test-metrics-histogram-native.py

      - name: Run the driver integration tests
        if: matrix.group == 'driver'
        working-directory: static/ergopti_plus/linux
        id: linux_integration
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node ../../../tools/test/report.cjs --name linux-lua --json "${{ runner.temp }}/linux-lua.json" -- luajit tests/run.lua --module=integration 2>&1 | tee "$RUNNER_TEMP/linux-integration.log"
          integration_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          if [ "${integration_pipeline_status[0]}" -ne 0 ]; then exit "${integration_pipeline_status[0]}"; fi
          exit "${integration_pipeline_status[1]}"

      - name: Upload failed integration log
        if: ${{ failure() && !cancelled() && steps.linux_integration.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-integration-failure-log-${{ matrix.group }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/linux-integration.log
            ${{ runner.temp }}/linux-lua.json
          if-no-files-found: error

      # Timing JSON is best-effort diagnostics; interrupted runs may have no file.
      - name: Retain integration Lua timing diagnostics
        if: ${{ !cancelled() && matrix.group == 'driver' }}
        uses: actions/upload-artifact@v4
        with:
          name: lua-timings-linux-integration-${{ matrix.group }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-lua.json
          if-no-files-found: warn
          retention-days: 7

      # Real LuaJIT cdata is qualified separately from the unchanged C3 baseline.
      # The child-local libXi projection grants no installed runtime or input epoch.
      - name: Qualify actual LuaJIT XI2 ABI and property cookies
        id: native_xi2_luajit
        if: ${{ !cancelled() && matrix.group == 'native' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B static/ergopti_plus/linux/tests/hardware/test_xi2_luajit_diagnostic_portable.py
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends gcc luajit libx11-dev libxi-dev libx11-xcb1 libxkbcommon-dev libxkbcommon-x11-dev xkb-data xvfb
          python3 static/ergopti_plus/linux/tests/hardware/run_xi2_luajit_diagnostic.py "$RUNNER_TEMP/linux-xi2-luajit" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/static/ergopti_plus/linux/adapters/xkb_source_probe.lua"
        timeout-minutes: 7

      - name: Retain actual LuaJIT XI2 diagnostic evidence
        if: ${{ always() && matrix.group == 'native' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-xi2-luajit-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/linux-xi2-luajit/receiving.json
            ${{ runner.temp }}/linux-xi2-luajit/original-c3/receiving.json
            ${{ runner.temp }}/linux-xi2-luajit/lua-native/display.json
            ${{ runner.temp }}/linux-xi2-luajit/abi-compile.family.json
            ${{ runner.temp }}/linux-xi2-luajit/lua-native.family.json
            ${{ runner.temp }}/linux-xi2-luajit/lua-native/luajit.stdout
            ${{ runner.temp }}/linux-xi2-luajit/lua-native/luajit.stderr
          if-no-files-found: error

      # This external acceptance is deliberate manual validation, separate from
      # the frozen prerequisite gate and every package/installed-driver subject.
      - name: Run manual official runtime and model acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.release && !cancelled() && matrix.group == 'native' }}
        run: |
          set -euo pipefail
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends curl zstd
          python3 static/ergopti_plus/linux/tests/hardware/run_ollama_runtime_acceptance.py \
            --repository "$GITHUB_WORKSPACE" \
            --evidence "$RUNNER_TEMP/ollama-runtime-acceptance" \
            --lua luajit
        timeout-minutes: 18

      - name: Upload manual runtime acceptance evidence
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.release && !cancelled() && matrix.group == 'native' }}
        uses: actions/upload-artifact@v4
        with:
          name: ollama-runtime-acceptance-linux
          retention-days: 7
          path: ${{ runner.temp }}/ollama-runtime-acceptance/ollama-runtime-acceptance.json
          if-no-files-found: error

      - name: Record mandatory integration evidence
        run: |
          set -euo pipefail
          if [ "$LINUX_INTEGRATION_GROUP" = driver ]; then
              integration_assertions=$(jq -r '.passed' "$RUNNER_TEMP/linux-lua.json")
              subjects=(--subject "integration-driver=$integration_assertions")
          else
              subjects=(--subject native-metrics-equivalence=1 --subject native-histogram-multiplicity=1 --subject native-xi2-abi=1)
          fi
          node tools/test/linux-ci-evidence.cjs record \
              --job integration-linux \
              --shard "$LINUX_INTEGRATION_GROUP" \
              --output "$RUNNER_TEMP/linux-ci-evidence/integration-linux-$LINUX_INTEGRATION_GROUP.json" \
              --sha "$GITHUB_SHA" \
              --architecture "$RUNNER_ARCH" \
              --distro ubuntu \
              --session x11-wayland-headless \
              --interpreter "$(luajit -v 2>&1 | head -1)" \
              "${subjects[@]}"

      - name: Upload mandatory integration evidence
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-ci-evidence-integration-linux-${{ matrix.group }}
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/integration-linux-${{ matrix.group }}.json
          if-no-files-found: error

  e2e-linux:
    name: 'E2E tests'
    needs: [integration-linux]
    runs-on: ubuntu-latest
    # One row per domain, listed in tools/test/fixtures/linux-e2e-shards.json.
    # Every harness step runs in exactly one row (its if: names the row); the
    # shared setup steps and the evidence record run in every row. needs:
    # e2e-linux waits for every row and reports failure if any row fails.
    strategy:
      fail-fast: false
      matrix:
        shard:
          - input-display
          - desktop-webview
          - updater
          - network-ai
          - platform-metrics
    env:
      # Python-owned native children also resolve the production shared modules.
      LUA_PATH: './?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;'
      # The shard this matrix row runs; the evidence record reads it.
      LINUX_E2E_SHARD: ${{ matrix.shard }}
    outputs:
      ci_predecessors: ${{ toJSON(needs) }}
      ci_source_sha: ${{ github.sha }}
      ci_run_id: ${{ github.run_id }}
      ci_attempt: ${{ github.run_attempt }}
      ci_integration_result: ${{ needs.integration-linux.result }}

    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        # Bound extension sections require actual no-follow source identity.
        # Test discovery alone does not prove their filesystem admission.
        # Canonical XKB controls below require xkbcli before their first use.
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y luajit lua-luv lua-filesystem sqlite3 libxkbcommon-tools xkb-data
          luajit -e 'assert(require("luv"), "native E2E luv integration is mandatory")'
          else
              exit 1
          fi
        timeout-minutes: 10

      # The virtual-keyboard harness, stubbed: this step runs on ubuntu-latest
      # against the pure-Lua hotstring engine — no real evdev device, no ydotool
      # injection. It is a corpus-driven replay of the engine's on_char() logic
      # layer, not an OS-level end-to-end test.
      #
      # Unit tests run independently. Within this E2E job, this step and
      # every harness after it run with `if: ${{ !cancelled() }}`: a red E2E still
      # lets the kernel, display and tray harnesses report what they measured,
      # while a run cancelled by a newer push stops at once instead of spending
      # minutes on results nobody reads, which `always()` did.
      - name: Run virtual-keyboard E2E harness (stubbed)
        if: ${{ !cancelled() && matrix.shard == 'input-display' }}
        # Exercises the hotstring engine against 8 hand-coded scenarios
        # and all shared corpus vectors (vectors.json).
        # Exit 0 = all pass, 1 = at least one failure.
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          set -euo pipefail
          luajit tests/e2e/run_e2e.lua | tee "$RUNNER_TEMP/linux-e2e.log"
          else
              exit 1
          fi
        timeout-minutes: 5

      # Separate preparation attempts cannot suppress another role's acquisition.
      # The original signed in-case checks and one-minute receiving clocks remain.
      - name: Prepare native GTK dependencies
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends libgtk-3-bin dbus-x11 xvfb x11-utils
          else
              exit 1
          fi
        timeout-minutes: 10

      - name: Prepare native process and compiler dependencies
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends build-essential curl libffi-dev liblua5.4-dev lua-luv lua5.4 meson ninja-build openssl pkg-config python3 strace
          else
              exit 1
          fi
        timeout-minutes: 10

      - name: Install prerequisites for Launch option-looking application ids through actual GTK desktop entries
        if: ${{ !cancelled() && matrix.shard == 'desktop-webview' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends libgtk-3-bin dbus-x11 xvfb x11-utils
          else
              exit 1
          fi
        timeout-minutes: 20

      - name: Launch option-looking application ids through actual GTK desktop entries
        if: ${{ !cancelled() && matrix.shard == 'desktop-webview' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          python3 tests/hardware/test_application_operand_diagnostics.py
          python3 tests/hardware/run_application_operand_receipts.py --evidence-dir "$RUNNER_TEMP/linux-application-operands"
          else
              exit 1
          fi
        timeout-minutes: 1

      - name: Install prerequisites for Terminate real descendants after their process leader exits
        if: ${{ !cancelled() && matrix.shard == 'platform-metrics' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends lua-luv lua5.4 curl openssl python3 strace build-essential meson ninja-build liblua5.4-dev libffi-dev pkg-config
          else
              exit 1
          fi
        timeout-minutes: 20

      - name: Terminate real descendants after their process leader exits
        if: ${{ !cancelled() && matrix.shard == 'platform-metrics' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
