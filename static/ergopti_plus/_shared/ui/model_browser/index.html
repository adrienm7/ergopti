<!-- _shared/ui/model_browser/index.html -->
<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<title data-i18n="model_browser.window_title"></title>
		<script src="../a11y_prefs.js"></script>
		<link rel="stylesheet" href="../theme.css" />
		<link rel="stylesheet" href="style.css" />
		<script src="../i18n.js"></script>
		<script src="../host_bridge.js"></script>
	</head>
	<body>
		<h1 class="theme-sr-only" data-i18n="model_browser.window_title"></h1>
		<!-- The search and the backend filter narrow the table; the count says by how much. -->
		<search id="toolbar">
			<input
				id="search"
				type="search"
				autocomplete="off"
				spellcheck="false"
				data-i18n-placeholder="model_browser.search_placeholder"
				data-i18n-title="model_browser.search_placeholder"
			/>
			<label
				id="backend-filter-label"
				for="backend-filter"
				data-i18n="model_browser.filter_backend"
			></label>
			<select id="backend-filter"></select>
			<output id="count" aria-live="polite"></output>
		</search>

		<p id="current" aria-live="polite"></p>

		<main id="table-wrap">
			<table id="models" aria-describedby="hint">
				<thead>
					<tr id="head-row"></tr>
				</thead>
			</table>
			<p id="empty" style="display: none" data-i18n="model_browser.no_models"></p>
		</main>

		<footer id="footer">
			<p id="hint" data-i18n="model_browser.select_hint"></p>
			<menu id="footer-actions">
				<li>
					<button id="btn-disable" type="button" data-i18n="model_browser.disable_button"></button>
				</li>
				<li>
					<button id="btn-use" type="button" disabled data-i18n="model_browser.use_button"></button>
				</li>
			</menu>
		</footer>

		<script src="script.js"></script>
	</body>
</html>
