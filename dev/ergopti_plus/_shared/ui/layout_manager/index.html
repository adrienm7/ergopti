<!-- _shared/ui/layout_manager/index.html -->
<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<title data-i18n="layout_manager.window_title"></title>
		<link rel="stylesheet" href="../theme.css" />
		<script src="../a11y_prefs.js"></script>
		<script src="../page_locale.js"></script>
		<link rel="stylesheet" href="style.css" />
		<script src="../host_bridge.js"></script>
	</head>
	<body>
		<main id="layout-view">
			<h1 data-i18n="layout_manager.window_title"></h1>
			<p class="subtitle" data-i18n="layout_manager.subtitle"></p>

			<header class="toolbar">
				<p id="catalogue-status" class="catalogue-status" role="status"></p>
				<button
					type="button"
					id="btn-editor"
					class="secondary"
					hidden
					data-i18n="layout_editor.open_from_manager"
				></button>
				<button
					type="button"
					id="btn-refresh"
					class="secondary"
					data-i18n="layout_manager.btn_refresh"
				></button>
			</header>

			<p id="result" class="result" role="alert" tabindex="-1" hidden></p>

			<ul id="layout-list" class="layout-list"></ul>
			<p id="empty" class="empty" data-i18n="layout_manager.empty" hidden></p>

			<footer class="btns">
				<button
					type="button"
					id="btn-close"
					class="secondary"
					data-i18n="layout_manager.btn_close"
				></button>
			</footer>
		</main>

		<script src="script.js"></script>
	</body>
</html>
