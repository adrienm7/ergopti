# .github/workflows/ci.yml
#
# Unified CI pipeline — one workflow per push to main or dev.
#
# Architecture:
#
#   ┌──────────────────────────────────────────────────────────┐
#   │ validate-hotstrings · validate-domain · validate-js      │
#   │            (validate-translations)                       │
#   └──────────────┬───────────────┬───────────────┬───────────┘
#                  │ (always runs — no path filter)
#        ┌─────────┼──────────┐
#        ▼         ▼          ▼
#   ┌─────────┐ ┌──────────┐ ┌──────────┐
#   │ macOS   │ │ Windows  │ │  Linux   │
#   │  branch │ │  branch  │ │  branch  │
#   │         │ │          │ │          │
#   │ test-hs │ │ test-ahk │ │test-linux│
#   │  e2e-hs │ │  e2e-ahk │ │ e2e-linux│
#   └────┬────┘ └────┬─────┘
#        │           │           │
#        └─────────┬─┘───────────┘
#                  ▼
#          ┌───────────────────────┐
#          │  resolve-release-meta │  (main + dev, all drivers green)
#          │  compute tag/version  │
#          └───────────┬───────────┘
#             ┌────────┼────────┐
#             ▼        ▼        ▼
#        ┌────────┐ ┌──────┐ ┌───────┐
#        │ build  │ │build │ │ build │
#        │ macos  │ │ win  │ │ linux │
#        └────────┘ └──────┘ └───────┘
#             └────────┬────────┘
#                      ▼
#             ┌─────────────────┐
#             │ finalize-release│
#             │ create release  │
#             │ + upload assets │
#             └─────────────────┘
#
# bench.yml — perf benchmark (main only, independent cadence)

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ========================================================
# ========================================================
# ======= 1/ Validation — fast gates, always run ========
# ========================================================
# ========================================================

jobs:
  # ─────────────────────────────────────────────────
  # 1.1) Hotstring TOML format
  # ─────────────────────────────────────────────────
  validate-hotstrings:
    name: 'Validate · hotstrings TOML'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check hotstring TOML files are sorted and formatted
        run: python tools/format_toml.py --hotstrings --all --check

  # ─────────────────────────────────────────────────
  # 1.2) Domain build pipeline + drift detection
  # ─────────────────────────────────────────────────
  validate-domain:
    name: 'Validate · domain pipeline'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - run: npm ci

      - name: Run domain build pipeline
        run: npm run build:domain

  # ─────────────────────────────────────────────────
  # 1.3) JS shared layer — port compliance + PBT
  # ─────────────────────────────────────────────────
  validate-js:
    name: 'Validate · JS ports + properties'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - run: npm ci

      - name: Install native validation tools
        # test-shared-root-resolvers.cjs EXECUTES each driver's lib/paths.lua
        # rather than reading it — a resolver that returns nil is invisible to
        # static inspection, which is how the language menu came to offer 2
        # locales of 21. The gate fails rather than skips when no interpreter is
        # present, so this job needs one. The Sparkle appcast fixture is parsed
        # with xmllint so malformed release metadata cannot pass by string shape.
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 libxml2-utils

      - name: Port compliance (all 20 ports covered by adapters)
        run: npm run test:port-compliance

      - name: Hotstring priority parity (shared JSON ↔ AHK + Lua constants)
        run: npm run test:priority-parity

      - name: Property-based tests (fast-check, 27 × 1000 runs)
        run: npm run test:properties

      - name: Mutation tests — domain layer (Stryker, break=25)
        # Guards the shared domain spec files (Registry, HotstringMatcher).
        # Stryker only mutates the JS domain specs, yet it's the most expensive
        # step and validate-js is a `needs` of every driver job — so it gated the
        # whole graph on every push. Run it on main only (TT-4); PRs/branches still
        # get every other validate-js check, including the full test:js umbrella.
        if: github.ref == 'refs/heads/main'
        run: npm run test:mutation

      - name: Convention lint (strict — banners, spacing, section headers)
        run: npm run lint:conventions:strict

      - name: JS validation suite (umbrella — every run-js-suite check)
        # Gates the full run-js-suite (drift, parity, single-source ratchets,
        # bridge wiring, diagnostic-UI / focus / no-fallback §5.9 regressions, …).
        # Previously these ran only via the local `test:js` and never in CI (TT-3).
        run: npm run test:js

  # ─────────────────────────────────────────────────
  # 1.4) Translation consistency audit
  # ─────────────────────────────────────────────────
  validate-translations:
    name: 'Validate · translations audit'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Run translation key consistency audit
        run: node tools/lint/audit-translations.cjs

  # ─────────────────────────────────────────────────
  # 2.1) Hammerspoon unit tests
  # ─────────────────────────────────────────────────
  test-hs:
    name: 'macOS · unit tests'
    runs-on: ubuntu-latest
    needs: [validate-hotstrings, validate-domain, validate-js, validate-translations]

    steps:
      # Enough history for test_no_coauthor_in_commits.lua, which scans
      # HEAD~20..HEAD. The default checkout is a depth-1 clone, so that range does
      # not exist and the test fails — correctly, and saying so: it refuses to
      # report a clean history it could not read. Giving it the commits is the fix;
      # letting it pass on an empty range would make the whole check ornamental.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 25

      - name: Install Lua 5.4 + luarocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev luarocks

      - name: Install luacheck + luafilesystem
        # lfs is required by tests/run.lua for recursive test discovery;
        # --lua-version 5.4 ensures luarocks links the correct runtime.
        run: |
          sudo luarocks --lua-version 5.4 install luacheck
          sudo luarocks --lua-version 5.4 install luafilesystem

      - name: Run luacheck (non-blocking)
        # Surface warnings without failing — pre-existing style issues
        # must not block the test step.
        run: |
          luacheck static/ergopti_plus/macos/tests static/ergopti_plus/macos/infra \
            static/ergopti_plus/macos/modules || true

      - name: Run unit + meta tests
        working-directory: static/ergopti_plus/macos
        # The focused-runner regression tests spawn child interpreters; pin
        # the same binary as this job so runner-image defaults (which may
        # resolve bare `lua` to an interpreter without package.searchpath)
        # cannot change semantics under us.
        env:
          LUA: lua5.4
        run: node ../../../tools/test/report.cjs --name macos-lua --json "${{ runner.temp }}/macos-lua.json" -- lua5.4 tests/run.lua

  # ─────────────────────────────────────────────────
  # 2.2) Hammerspoon virtual-keyboard harness (stubbed, NOT real macOS/HS)
  # ─────────────────────────────────────────────────
  # This job runs on ubuntu-latest against the same in-memory tests/stubs/hs.lua
  # fake that tests/unit uses — no real Hammerspoon process, no WindowServer, no
  # CGEventPost round-trip is ever exercised here. It is a corpus-driven
  # virtual-keyboard replay of the Registry + Expander logic layer, not an
  # OS-level end-to-end test. See tests/e2e/PLAN_E2E_REAL_HS.md for what a real
  # macOS/Hammerspoon E2E run would require (a self-hosted GUI runner) and why
  # it is not wired in today. Named/commented explicitly so a green check here
  # never implies OS-level coverage it does not have (F-HIGH-30).
  e2e-hs:
    name: 'macOS · virtual-keyboard harness (stubbed, not real HS)'
    runs-on: ubuntu-latest
    needs: [test-hs]

    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4 + luafilesystem
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev luarocks
          sudo luarocks --lua-version 5.4 install luafilesystem

      - name: Run virtual-keyboard harness (stubbed hs.* — no real Hammerspoon)
        # Exercises Registry + Expander via the stub layer against
        # hardcoded scenarios and all corpus vectors.
        # Exit 0 = all pass, 1 = at least one failure.
        working-directory: static/ergopti_plus/macos
        run: lua5.4 tests/e2e/run_e2e.lua
        timeout-minutes: 5

  # ─────────────────────────────────────────────────
  # 2.3) Native launcher build + process-level XCTest on macOS
  # ─────────────────────────────────────────────────
  test-swift-launcher:
    name: 'macOS · Swift launcher build + tests'
    runs-on: macos-latest
    needs: [validate-hotstrings, validate-domain, validate-js, validate-translations]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            static/ergopti_plus/macos/launcher/.build/artifacts
            static/ergopti_plus/macos/launcher/.build/checkouts
            static/ergopti_plus/macos/launcher/.build/repositories
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('static/ergopti_plus/macos/launcher/Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Report Swift toolchain
        run: swift --version

      - name: Lint remap guardian LaunchAgent
        run: plutil -lint static/ergopti_plus/macos/launcher/com.ergoptiplus.remap-guardian.plist

      - name: Build release launcher
        run: swift build -c release --product ErgoptiPlus --package-path static/ergopti_plus/macos/launcher
        timeout-minutes: 10

      # Keep XCTest serial: the lease tests install process-wide signal handlers
      # and fork/reap real children, so parallel workers would race each other.
      - name: Run Swift launcher tests
        env:
          SWIFT_BACKTRACE: enable=yes
        run: |
          set -euo pipefail
          xctest_log="$(mktemp)"
          trap 'rm -f "$xctest_log"' EXIT
          script -q /dev/null swift test --package-path static/ergopti_plus/macos/launcher 2>&1 | tee "$xctest_log"
          if ! grep -Fq "Test Suite 'All tests' passed" "$xctest_log"; then
              echo "::error::the XCTest process ended without its successful suite summary"
              exit 1
          fi
        timeout-minutes: 10

  # ─────────────────────────────────────────────────
  # 2.4) Gate: macOS driver fully green
  # ─────────────────────────────────────────────────
  macos-ok:
    name: 'macOS · ✅ all green'
    runs-on: ubuntu-latest
    needs: [test-hs, e2e-hs, test-swift-launcher]
    if: always()

    steps:
      - name: Assert all macOS jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          total=$(echo "$NEEDS" | jq -r 'length')
          if [ "$total" -lt 3 ]; then
              echo "::error::macos-ok read $total dependency result(s) — this gate is asserting too little."
              exit 1
          fi

          failed=0
          while read -r job result; do
              printf '  %-24s: %s\n' "$job" "$result"
              case "$result" in
                  success) ;;
                  *) failed=1 ;;
              esac
          done < <(echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"')

          if [ "$failed" -eq 1 ]; then
              echo "macOS driver: one or more of the $total jobs did not succeed."
              exit 1
          fi
          echo "macOS driver: all $total job(s) passed."

  # =============================================
  # =============================================
  # ======= 3/ Windows driver branch ============
  # =============================================
  # =============================================

  # ─────────────────────────────────────────────────
  # 3.1) AHK unit tests
  # ─────────────────────────────────────────────────
  test-ahk:
    name: 'Windows · unit tests'
    runs-on: windows-latest
    needs: [validate-hotstrings, validate-domain, validate-js, validate-translations]

    steps:
      - uses: actions/checkout@v4

      - name: Build and test native navigation event owner
        shell: pwsh
        run: ./tools/build/build_windows_nav_owner.ps1

      - name: Cache AutoHotkey runtime
        id: cache-ahk
        uses: actions/cache@v4
        with:
          path: C:\AutoHotkey
          key: ahk-v2.0.19-windows

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - run: npm ci
        shell: pwsh

      - name: Build features manifest
        run: npm run build:manifest
        shell: pwsh

      - name: Manifest parity (AHK ↔ HS codegen equivalence)
        run: npm run test:manifest-parity
        shell: pwsh

      - name: Download AutoHotkey v2 runtime
        if: steps.cache-ahk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest `
              -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip" `
              -OutFile "$env:TEMP\AHK.zip" -UseBasicParsing
          Expand-Archive -Path "$env:TEMP\AHK.zip" -DestinationPath "C:\AutoHotkey" -Force

      - name: Verify AHK source encoding (UTF-8 BOM + LF)
        # AHK v2 silently aborts mid-file on encoding drift — catch it
        # before it causes silent test failures with no error message.
        shell: pwsh
        run: |
          $ahkFiles = Get-ChildItem `
              -Path "${{ github.workspace }}\static\ergopti_plus\windows" `
              -Recurse -Filter "*.ahk" |
              Where-Object { -not $_.FullName.Contains("vendor") }
          $failures = @()
          foreach ($file in $ahkFiles) {
              $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
              if ($bytes.Length -lt 3 -or
                  $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
                  $failures += "MISSING BOM : $($file.FullName)"; continue
              }
              $content = [System.IO.File]::ReadAllText(
                  $file.FullName, [System.Text.Encoding]::UTF8)
              if ($content -match "`r") {
                  $failures += "CR BYTE : $($file.FullName)"
              }
          }
          if ($failures.Count -gt 0) {
              $failures | ForEach-Object { Write-Host "  $_" }
              Write-Error "AHK encoding violations detected."
              exit 1
          }
          Write-Host "Encoding OK — $($ahkFiles.Count) file(s) verified."

      - name: Disable Windows Defender real-time scanning for AHK tests
        shell: pwsh
        run: |
          # Defender holds intermittent exclusive scan locks on any file the AHK
          # test suite writes — including temp files in A_Temp — causing FileRead /
          # FileAppend calls to block for the full 240 s watchdog window.
          # -DisableRealtimeMonitoring requires admin; add path exclusions as a
          # belt-and-suspenders fallback that works even without that flag.
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:TEMP"           -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "AutoHotkey64.exe" -ErrorAction SilentlyContinue
          Write-Host "Defender exclusions applied."

      - name: Run AHK test suite
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ahk = Get-ChildItem "C:\AutoHotkey" -Filter "AutoHotkey64.exe" |
              Select-Object -First 1 -ExpandProperty FullName
          if (-not $ahk) { Write-Error "AutoHotkey64.exe not found."; exit 2 }
          $runner = "${{ github.workspace }}\static\ergopti_plus\windows\tests\run_all.ahk"
          if (-not (Test-Path $runner)) {
              Write-Error "Test runner not found at $runner"; exit 2
          }
          $resultsFile = "$env:TEMP\ergopti_test_results.txt"
          $env:ERGOPTI_AHK_RESULTS_FILE = $resultsFile
          Remove-Item $resultsFile -Force -ErrorAction SilentlyContinue
          Write-Host "AHK runtime : $ahk"
          Write-Host "Test runner : $runner"
          Write-Host "------------------------------------------------------------"
          # AHK writes TAP output to test_results.txt (FileAppend to "*"/stdout
          # blocks when AHK runs without an inherited console handle, so the
          # file is the only reliable output channel in CI).
          # Tail-read the results file while AHK runs for real-time CI log output.
          # /ErrorStdOut routes load-time (parse / nonexistent-function / missing
          # #Include) errors to stderr and exits non-zero instead of popping a modal
          # dialog that no one can dismiss headlessly — which otherwise hangs the
          # runner until the 15 min step timeout. Must precede the script path.
          $proc = Start-Process -FilePath $ahk -ArgumentList "/ErrorStdOut `"$runner`"" -NoNewWindow -PassThru
          $fstream = $null
          $reader  = $null
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          while (-not $proc.HasExited) {
              if ($null -eq $fstream -and (Test-Path $resultsFile)) {
                  try {
                      $fstream = [System.IO.FileStream]::new($resultsFile,
                          [System.IO.FileMode]::Open,
                          [System.IO.FileAccess]::Read,
                          [System.IO.FileShare]::ReadWrite)
                      $reader = [System.IO.StreamReader]::new($fstream)
                  } catch {
                      # AHK may still hold an exclusive write lock; retry next tick
                      Start-Sleep -Milliseconds 100
                  }
              }
              if ($null -ne $reader) {
                  $line = $reader.ReadLine()
                  if ($null -ne $line) { Write-Host $line } else { Start-Sleep -Milliseconds 100 }
              } else {
                  Start-Sleep -Milliseconds 100
              }
          }
          if ($null -ne $reader) {
              while ($null -ne ($line = $reader.ReadLine())) { Write-Host $line }
              $reader.Close(); $fstream.Close()
          }
          $exit = $proc.ExitCode
          Write-Host "------------------------------------------------------------"
          Write-Host "AHK exit code: $exit"
          if (-not (Test-Path $resultsFile)) {
              Write-Error "test_results.txt not created — AHK may have crashed at startup."; exit 2
          }
          $summary = Get-Content $resultsFile | Select-String "^#" | Select-Object -Last 1
          Write-Host $summary
          $manifestFile = "$env:RUNNER_TEMP\windows-ahk-execution-manifest.json"
          node "${{ github.workspace }}\tools\test\validate-ahk-suite-manifest.cjs" `
              --input $resultsFile --json $manifestFile
          $manifestExit = $LASTEXITCODE
          if ($manifestExit -ne 0) {
              Write-Error "AHK planned/executed manifest is incomplete."; exit $manifestExit
          }
          if ($exit -ne 0) {
              Write-Error "Test suite failed (exit $exit)."; exit $exit
          }

      # The two isolated LLM suites. They cannot join run_all.ahk: each installs
      # its own global stubs (a WebView2 stand-in, a fake model index) that would
      # collide with the shared harness, which is why they were written as
      # separate runners in the first place. They were then referenced by
      # nothing, so their ten tests had never run and one of them had rotted out
      # of the code it stubs. tools/test/test-ahk-runners-are-invoked.cjs now
      # fails if a runner under tests/ is referenced by nothing at all.
      - name: Run isolated AHK LLM suites
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ahk = Get-ChildItem "C:\AutoHotkey" -Filter "AutoHotkey64.exe" |
              Select-Object -First 1 -ExpandProperty FullName
          if (-not $ahk) { Write-Error "AutoHotkey64.exe not found."; exit 2 }
          $tests = "${{ github.workspace }}\static\ergopti_plus\windows\tests"
          $failed = 0
          foreach ($name in @("run_llm_model_browser.ahk", "run_llm_model_menu_disabled.ahk")) {
              $runner = Join-Path $tests $name
              if (-not (Test-Path $runner)) { Write-Error "Runner not found: $runner"; exit 2 }
              $out = "$env:TEMP\$name.out"
              $err = "$env:TEMP\$name.err"
              # Start-Process, not the call operator: AutoHotkey is a GUI-subsystem
              # binary, so a direct invocation returns neither the exit code nor
              # stderr (PROJECT_MEMORY, feedback_ahk_ui_syntax_validation).
              $proc = Start-Process -FilePath $ahk -ArgumentList @("/ErrorStdOut", $runner) `
                  -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
              Write-Host "--- $name (exit $($proc.ExitCode)) ---"
              if (Test-Path $out) { Get-Content $out | Write-Host }
              if (Test-Path $err) { Get-Content $err | Write-Host }
              if ($proc.ExitCode -ne 0) { $failed += 1 }
          }
          if ($failed -gt 0) { Write-Error "$failed isolated LLM suite(s) failed."; exit 1 }

      # Emit GitHub annotations + a JSON summary from the captured TAP. Purely
      # additive (continue-on-error): the step above remains the gate, so a
      # reporter hiccup can never flip a red run green or vice-versa.
      - name: Annotate AHK results
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $resultsFile = "$env:TEMP\ergopti_test_results.txt"
          if (Test-Path $resultsFile) {
              node "${{ github.workspace }}\tools\test\report.cjs" --name windows-ahk --json "$env:RUNNER_TEMP\windows-ahk.json" -- PARSE_FILE $resultsFile
          } else {
              Write-Host "No AHK results file to annotate."
          }

      - name: Publish AHK execution manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ahk-execution-manifest
          path: ${{ runner.temp }}/windows-ahk-execution-manifest.json
          if-no-files-found: warn

      - name: Check for AHK compiler warnings
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ahk = Get-ChildItem "C:\AutoHotkey" -Filter "AutoHotkey64.exe" |
              Select-Object -First 1 -ExpandProperty FullName
          $runner = "${{ github.workspace }}\static\ergopti_plus\windows\tests\run_all.ahk"
          # Pass --dry-run so AHK parses all files and emits warnings, then
          # exits immediately without running any Test() callbacks. This keeps
          # the warning check fast (~seconds) regardless of corpus size.
          # /ErrorStdOut keeps a parse/load error from popping a modal dialog that
          # would hang this step headlessly; the error text is captured via 2>&1.
          $output = & cmd /c "`"$ahk`" /ErrorStdOut `"$runner`" --dry-run 2>&1"
          $warnings = $output | Where-Object { $_ -match "^Warning:" }
          $errors   = $output | Where-Object { $_ -match "^Error:" }
          if ($errors) {
              $errors | ForEach-Object { Write-Host "  $_" }
              Write-Error "$($errors.Count) AHK load-time error(s) — fix before merging."
              exit 1
          }
          if ($warnings) {
              $warnings | ForEach-Object { Write-Host "  $_" }
              Write-Error "$($warnings.Count) AHK compiler warning(s) — fix before merging."
              exit 1
          }
          Write-Host "No AHK compiler warnings."

  # ─────────────────────────────────────────────────
  # 3.2) AHK E2E (pure engine injection, headless)
  # ─────────────────────────────────────────────────
  e2e-ahk:
    name: 'Windows · E2E'
    runs-on: windows-latest
    needs: [test-ahk]

    steps:
      - uses: actions/checkout@v4

      - name: Cache AutoHotkey runtime
        id: cache-ahk
        uses: actions/cache@v4
        with:
          path: C:\AutoHotkey
          key: ahk-v2.0.19-windows

      - name: Download AutoHotkey v2 runtime
        if: steps.cache-ahk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest `
              -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip" `
              -OutFile "$env:TEMP\AHK.zip" -UseBasicParsing
          Expand-Archive -Path "$env:TEMP\AHK.zip" -DestinationPath "C:\AutoHotkey" -Force

      - name: Verify E2E runner encoding
        shell: pwsh
        run: |
          $file = "${{ github.workspace }}\static\ergopti_plus\windows\tests\e2e\run_e2e.ahk"
          $bytes = [System.IO.File]::ReadAllBytes($file)
          if ($bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              Write-Error "run_e2e.ahk is missing UTF-8 BOM."; exit 1
          }
          $content = [System.IO.File]::ReadAllText($file, [System.Text.Encoding]::UTF8)
          if ($content -match "`r") {
              Write-Error "run_e2e.ahk contains CR line endings."; exit 1
          }
          Write-Host "Encoding OK: UTF-8 BOM + LF."

      - name: Build features manifest
        shell: pwsh
        run: npm ci; npm run build:manifest

      - name: Run E2E suite (Strategy A — pure engine injection)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ahk = Get-ChildItem "C:\AutoHotkey" -Filter "AutoHotkey64.exe" |
              Select-Object -First 1 -ExpandProperty FullName
          if (-not $ahk) { Write-Error "AutoHotkey64.exe not found."; exit 2 }
          $runner = "${{ github.workspace }}\static\ergopti_plus\windows\tests\e2e\run_e2e.ahk"
          $resultsFile = "${{ github.workspace }}\static\ergopti_plus\windows\tests\e2e\test_results.txt"
          Remove-Item $resultsFile -Force -ErrorAction SilentlyContinue
          Write-Host "AHK runtime : $ahk"
          Write-Host "E2E runner  : $runner"
          Write-Host "------------------------------------------------------------"
          # Same approach as the unit test suite: AHK writes TAP output to
          # test_results.txt (FileAppend to "*" blocks without a console handle).
          # Tail-read the file for real-time CI log output.
          # /ErrorStdOut: see unit-test step — fail fast on load errors instead of
          # hanging on an undismissable modal dialog in the headless runner.
          $proc = Start-Process -FilePath $ahk -ArgumentList "/ErrorStdOut `"$runner`"" -NoNewWindow -PassThru
          $fstream = $null; $reader = $null
          while (-not $proc.HasExited) {
              if ($null -eq $fstream -and (Test-Path $resultsFile)) {
                  try {
                      $fstream = [System.IO.FileStream]::new($resultsFile,
                          [System.IO.FileMode]::Open,
                          [System.IO.FileAccess]::Read,
                          [System.IO.FileShare]::ReadWrite)
                      $reader = [System.IO.StreamReader]::new($fstream)
                  } catch {
                      # AHK may still hold an exclusive write lock; retry next tick
                      Start-Sleep -Milliseconds 100
                  }
              }
              if ($null -ne $reader) {
                  $line = $reader.ReadLine()
                  if ($null -ne $line) { Write-Host $line } else { Start-Sleep -Milliseconds 100 }
              } else { Start-Sleep -Milliseconds 100 }
          }
          if ($null -ne $reader) {
              while ($null -ne ($line = $reader.ReadLine())) { Write-Host $line }
              $reader.Close(); $fstream.Close()
          }
          $exit = $proc.ExitCode
          Write-Host "------------------------------------------------------------"
          Write-Host "Exit code: $exit"
          if (-not (Test-Path $resultsFile)) {
              Write-Error "test_results.txt not created — AHK may have crashed at startup."; exit 2
          }
          if ($exit -ne 0) {
              Write-Error "E2E suite failed (exit $exit)."; exit $exit
          }

  # ─────────────────────────────────────────────────
  # 3.3) Gate: Windows driver fully green
  # ─────────────────────────────────────────────────
  windows-ok:
    name: 'Windows · ✅ all green'
    runs-on: ubuntu-latest
    needs: [test-ahk, e2e-ahk]
    if: always()

    steps:
      - name: Assert all Windows jobs passed
        run: |
          failed=0
          for job_result in "${{ needs.test-ahk.result }}" "${{ needs.e2e-ahk.result }}"; do
              if [[ "$job_result" == "failure" || "$job_result" == "cancelled" ]]; then
                  failed=1
              fi
          done
          if [[ $failed -eq 1 ]]; then
              echo "Windows driver: one or more jobs failed."
              echo "  test-ahk : ${{ needs.test-ahk.result }}"
              echo "  e2e-ahk  : ${{ needs.e2e-ahk.result }}"
              exit 1
          fi
          echo "Windows driver: all jobs passed (or skipped)."
          echo "  test-ahk : ${{ needs.test-ahk.result }}"
          echo "  e2e-ahk  : ${{ needs.e2e-ahk.result }}"

  # ============================================
  # ============================================
  # ======= 4/ Linux driver branch =============
  # ============================================
  # ============================================

  # ─────────────────────────────────────────────────
  # 4.1) Linux Lua driver unit tests
  # ─────────────────────────────────────────────────
  test-linux:
    name: 'Linux · unit tests'
    runs-on: ubuntu-latest
    needs: [validate-hotstrings, validate-domain, validate-js, validate-translations]

    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        # The test runner (tests/run.lua) uses LuaJIT. Test discovery falls
        # back to io.popen("find") when lfs is unavailable — no luarocks needed.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit

      - name: Run Linux driver unit test suite
        working-directory: static/ergopti_plus/linux
        # Wrapped in the unified reporter: streams output unchanged, exits with the
        # runner's code (CI gating preserved), and emits GitHub annotations + a JSON
        # summary on failure. report.cjs lives at the repo root tools/.
        run: node ../../../tools/test/report.cjs --name linux-lua --json "${{ runner.temp }}/linux-lua.json" -- luajit tests/run.lua

      # The only step in this workflow that touches a real kernel input path.
      # Every other test of the two FFI adapters runs against a recorded syscall
      # backend, which is the right shape for asserting order and sequence and
      # structurally incapable of asserting the one thing left: that the kernel
      # accepts what we send it. Four values decide that and none is observable
      # from a mock — the ioctl request numbers, the struct size, the field
      # offsets, and the capability bits registered before UI_DEV_CREATE. Get any
      # of them wrong and every test above still passes while a real machine gets
      # nothing at all.
      #
      # A STEP and not a job, deliberately: as a job it would cost a whole runner
      # (checkout + apt) for five seconds of work.
      - name: Load the uinput module
        run: |
          sudo modprobe uinput
          if [ ! -e /dev/uinput ]; then
              echo "::error::/dev/uinput is absent after modprobe — the runner image cannot host this test."
              echo "This is an ENVIRONMENT failure, not a driver failure. Check whether the"
              echo "ubuntu-latest image still ships the uinput module before touching the driver."
              exit 1
          fi

      - name: Round-trip real events through the kernel
        working-directory: static/ergopti_plus/linux
        # Root because /dev/uinput is root-owned until the udev rule that
        # install.sh --setup-perms writes is in place. `sudo env` rather than
        # `sudo -E` so the path is set explicitly and does not depend on which
        # variables the runner sudoers happens to preserve.
        run: |
          sudo env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_uinput_roundtrip.lua
        timeout-minutes: 2

      # The property the whole Linux milestone is named after: keystrokes arriving
      # DURING an expansion come out after it, in order. It was verified by reading
      # only — a recorded backend can assert the order our code intends and is
      # structurally incapable of asserting that the kernel agrees, and a grab in
      # particular is invisible to a mock (ioctl returning 0 to a recorder says
      # nothing about whether the desktop still sees the device).
      - name: Hold the grab under an interleaved burst
        working-directory: static/ergopti_plus/linux
        run: |
          sudo env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_grab_race.lua
        timeout-minutes: 2

      # No display server needed: `xkbcli compile-keymap --layout fr` produces the
      # same text a live session dumps. The session decides WHICH layout is active
      # and has nothing to do with what a layout contains — so "can the driver read
      # a real French keymap" is checkable here, and only "is é right on YOUR
      # keyboard" needs a person. Every layout test before this one parsed a keymap
      # this repository wrote, which tests the parser against its author's
      # assumptions.
      - name: Resolve real system keymaps
        working-directory: static/ergopti_plus/linux
        run: |
          sudo apt-get install -y --no-install-recommends libxkbcommon-tools xkb-data
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_layout_resolution.lua
        timeout-minutes: 3

      # "Needs a display server" sounded like "needs a desktop", and it does not.
      # Xvfb is a real X server and sway --backend headless is a real Wayland
      # compositor; both simply draw to nothing. Everything the driver does with a
      # display server EXCEPT putting pixels on a screen is therefore checkable
      # here — including the two things that actually broke: which server it thinks
      # it is on, and whether it can read the keymap from it.
      #
      # Both run in ONE step, same binary, no configuration in between, which is
      # the machine-checkable half of C2: log out of X11, log into Wayland, change
      # nothing.
      - name: Detect and read the keymap on a real X11 and a real Wayland
        working-directory: static/ergopti_plus/linux
        run: |
          sudo apt-get install -y --no-install-recommends xvfb sway libxkbcommon-tools xkb-data x11-utils
          export LUA_PATH='./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;'

          echo "--- X11 (Xvfb) ---"
          xvfb-run -a luajit tests/hardware/run_display_server.lua

          echo "--- Wayland (sway, headless) ---"
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/tmp/xdg-$(id -u)}"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          # A compositor with no config and no outputs. WLR_BACKENDS=headless is
          # what lets it start without a seat or a GPU on a CI runner.
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 sway --config /dev/null &
          SWAY_PID=$!
          # Poll for the socket rather than sleeping a fixed time: a loaded runner
          # takes longer, and a fixed sleep turns that into a flake.
          WAYLAND_SOCK=""
          for _ in $(seq 1 40); do
            WAYLAND_SOCK=$(ls "$XDG_RUNTIME_DIR" 2>/dev/null | grep -m1 '^wayland-[0-9]*$' || true)
            [ -n "$WAYLAND_SOCK" ] && break
            sleep 0.25
          done
          if [ -z "$WAYLAND_SOCK" ]; then
            echo "::error::no Wayland socket appeared — mandatory Wayland coverage did not run"
            kill "$SWAY_PID" 2>/dev/null || true
            exit 1
          fi
          # DISPLAY is deliberately left set: a real Wayland session runs XWayland
          # and sets it too, and that is exactly the case a detector reading DISPLAY
          # first gets wrong on every Wayland desktop.
          set +e
          WAYLAND_DISPLAY="$WAYLAND_SOCK" DISPLAY=:99 luajit tests/hardware/run_display_server.lua
          STATUS=$?
          set -e
          kill "$SWAY_PID" 2>/dev/null || true
          exit $STATUS
        timeout-minutes: 6

      # An FFI binding is a set of NAMES — three sonames and thirteen symbols —
      # and each is a claim about a library this project does not ship. A wrong
      # soname, or a symbol that moved between releases, has exactly one symptom:
      # no tray icon. Not an error, not a crash; the menu is simply absent while
      # the daemon expands hotstrings perfectly, so nothing points at the cause.
      #
      # No unit test can catch it: with no libayatana to load it must stub, and a
      # stub answers to whatever name the binding asks for.
      - name: The tray binding names libraries and symbols that exist
        working-directory: static/ergopti_plus/linux
        run: |
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-1 libgtk-3-0
          env LUA_PATH='./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;' luajit tests/hardware/run_tray_symbols.lua
        timeout-minutes: 4

      # touchpad_finder reads capability bits out of a printed bitmap, and that
      # rests on one thing the text cannot confirm: that the words are 64 bits
      # wide, most significant first, with leading zero words omitted. Its unit
      # tests use a fixture written by hand, so they prove the parser is
      # self-consistent and nothing about the format the kernel actually emits.
      #
      # Here the device is declared through uinput, the KERNEL formats the
      # bitmaps, and the parser has to agree with a text it did not see written.
      # The same step settles the finger-count claim the whole "grey what this
      # hardware cannot serve" design rests on: input_mt_init_slots() advertises
      # QUINTTAP only at five slots, so a five-slot device must read back as five.
      - name: A virtual touchpad, described by the kernel and read back
        working-directory: static/ergopti_plus/linux
        run: |
          sudo modprobe uinput || true
          sudo chmod 0666 /dev/uinput
          env LUA_PATH='./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;' luajit tests/hardware/run_touchpad_capability.lua
        timeout-minutes: 4

      # test_mt_decoder feeds the decoder a table written by hand from the
      # kernel's documentation. It proves the state machine agrees with MY
      # reading of the protocol and nothing about what a kernel delivers — the
      # plan records that as "the event trace is a reconstruction, not a
      # capture".
      #
      # Here the events make a round trip: written to /dev/uinput, published on
      # an input node, found by the driver's own finder, opened by its own
      # reader, decoded by its own decoder. The struct layout, the ioctl numbers,
      # the slot semantics and the non-blocking read are all the kernel's, and
      # those are exactly what a hand-written table cannot check.
      - name: A gesture written to uinput comes back as a gesture
        # Not skipped when an earlier harness fails. These are independent
        # diagnostics, and letting the first failure hide the others' answers is
        # how a run comes back saying less than it measured — the page-error trap
        # below was skipped on its first outing for exactly that reason, so its
        # question went unanswered for a whole cycle.
        if: always()
        working-directory: static/ergopti_plus/linux
        run: |
          # sudo, like the grab harness: the event node the kernel publishes for a
          # new uinput device belongs to root:input at 0660, and the runner's user
          # is in neither. Creating the device needs only /dev/uinput; READING it
          # back needs the node, which is the half this harness exists for.
          sudo env LUA_PATH='./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;' luajit tests/hardware/run_gesture_roundtrip.lua
        timeout-minutes: 4

      # Both hotstrings bridges were changed from RETURNING their payload to
      # PUSHING it, because makeHostBridge is fire-and-forget and only two of the
      # fourteen shared pages define window.__hostBridgeResponse — a returned
      # payload reached nobody, so the settings window drew an empty page and the
      # editor sat on "Chargement…" for ever.
      #
      # Every unit test of that fix asserts the SHAPE of the JavaScript string
      # handed to eval_js. None proves the string arrives, that the page defines
      # the function it calls, or that the function survives a payload built by
      # Lua. Three separate ways for the same fix to be wrong with the suite green.
      # Its own step, and a generous budget, because it is a DOWNLOAD: WebKit2GTK
      # pulls the whole GStreamer tree, and the first attempt at this spent eight
      # minutes fetching packages and timed out before running a single
      # assertion. A timeout that fires during dependency installation says
      # nothing whatever about the code, so the two are separated and the test
      # step below gets a budget sized for the test.
      - name: Install WebKit2GTK and lgi
        if: always()
        run: |
          sudo apt-get install -y --no-install-recommends \
            xvfb lua-lgi gir1.2-webkit2-4.1 gir1.2-gtk-3.0
        timeout-minutes: 20

      - name: The webview push reaches a real WebKit page
        if: always()
        working-directory: static/ergopti_plus/linux
        run: |
          export LUA_PATH='./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;'
          # lua-lgi installs for the distro's Lua, not for LuaJIT, so the module
          # path has to be widened rather than assumed. Reported, not guessed at:
          # the harness exits 2 when lgi is unreachable and the step says so.
          export LUA_PATH="$LUA_PATH;/usr/share/lua/5.1/?.lua;/usr/share/lua/5.1/?/init.lua"
          export LUA_CPATH="/usr/lib/x86_64-linux-gnu/lua/5.1/?.so;;"
          # One page per invocation. Both in one process made the verdict move
          # between them run to run — two webviews share a GTK loop, so pumping
          # for one processes the other's events and a probe can land while the
          # other page is still settling.
          set +e
          STATUS=0
          for APP in hotstrings_config_window hotstring_editor; do
            xvfb-run -a luajit tests/hardware/run_webview_push.lua "$APP"
            CASE=$?
            [ "$CASE" = "0" ] || STATUS=$CASE
          done
          set -e
          # Status 2 means the runner could not host a mandatory subject. That is
          # an environment failure, but linux-ok must remain red until the
          # subject actually executes.
          if [ "$STATUS" = "2" ]; then
            echo "::error::WebKit/lgi unavailable — mandatory webview coverage did not run."
            exit 1
          fi
          exit $STATUS
        timeout-minutes: 8

      # window.setData is undefined in the settings window, so the host's
      # `if(window.setData)` guard discards every push. Seven explanations are
      # ruled out, and the informative one is the last: an explicit
      # `window.setData = setData` at the END of the file changed nothing. If the
      # script ran to completion that line alone would be enough — so it throws.
      #
      # A throw during load is invisible to every probe run afterwards, because
      # by then the page merely looks incomplete. window.onerror only catches
      # what is raised after it is installed, and installing it with
      # run_javascript is too late by the whole page load — so this harness
      # builds the HTML itself and splices the trap in right after <head>.
      - name: What each page raises while loading
        if: always()
        working-directory: static/ergopti_plus/linux
        run: |
          export LUA_PATH='./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;'
          export LUA_PATH="$LUA_PATH;/usr/share/lua/5.1/?.lua;/usr/share/lua/5.1/?/init.lua"
          export LUA_CPATH="/usr/lib/x86_64-linux-gnu/lua/5.1/?.so;;"
          set +e
          xvfb-run -a luajit tests/hardware/run_page_errors.lua
          STATUS=$?
          set -e
          if [ "$STATUS" = "2" ]; then
            echo "::error::WebKit/lgi unavailable — mandatory page-error coverage did not run."
            exit 1
          fi
          exit $STATUS
        timeout-minutes: 5

      - name: Record mandatory Linux test evidence
        run: |
          set -euo pipefail
          unit_assertions=$(jq -r '.passed' "$RUNNER_TEMP/linux-lua.json")
          node tools/test/linux-ci-evidence.cjs record \
              --job test-linux \
              --output "$RUNNER_TEMP/linux-ci-evidence/test-linux.json" \
              --sha "$GITHUB_SHA" \
              --architecture "$RUNNER_ARCH" \
              --distro ubuntu \
              --session x11-wayland-headless \
              --interpreter "$(luajit -v 2>&1 | head -1)" \
              --subject "unit=$unit_assertions" \
              --subject uinput-roundtrip=1 \
              --subject grab-race=1 \
              --subject system-keymaps=1 \
              --subject x11-display=1 \
              --subject wayland-display=1 \
              --subject tray-symbols=1 \
              --subject touchpad-capability=1 \
              --subject gesture-roundtrip=1 \
              --subject webview-settings=1 \
              --subject webview-editor=1 \
              --subject page-load-errors=1

      - name: Upload mandatory Linux test evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-ci-evidence-test-linux
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/test-linux.json
          if-no-files-found: error


  # ─────────────────────────────────────────────────
  # 4.1b) Linux install, per distribution family
  # ─────────────────────────────────────────────────
  # install.sh has to work on package managers this project's author does not
  # run. Until 2026-08-05 that was a checklist line asking a person to find five
  # machines, which is the kind of check that gets done once. Containers make it
  # deterministic and repeatable: each image is the real package manager, the real
  # shell and the real filesystem layout.
  #
  # --no-deps is used deliberately. Installing every runtime dependency in five
  # containers would test the distributions' package archives, which are not ours
  # and go down; what is ours is whether the script RUNS to completion, detects
  # the package manager, and lays the driver out where the daemon expects it. A
  # dependency archive outage must not read as a broken installer.
  install-linux-distros:
    name: 'Linux · install (${{ matrix.distro }})'
    runs-on: ubuntu-latest
    needs: [test-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:stable-slim
            prep: apt-get update && apt-get install -y --no-install-recommends bash coreutils findutils grep sed
          - distro: fedora
            image: fedora:latest
            prep: dnf install -y bash coreutils findutils grep sed
          - distro: arch
            image: archlinux:latest
            prep: pacman -Sy --noconfirm bash coreutils findutils grep sed
          - distro: alpine
            image: alpine:latest
            prep: apk add --no-cache bash coreutils findutils grep sed
          - distro: opensuse
            image: opensuse/tumbleweed:latest
            prep: sed -i 's|http://download.opensuse.org|https://downloadcontent.opensuse.org|g' /etc/zypp/repos.d/*.repo && zypper --non-interactive install bash coreutils findutils grep sed
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Prepare the container
        run: ${{ matrix.prep }}

      - uses: actions/checkout@v4

      - name: Install with no root and no network dependencies
        working-directory: static/ergopti_plus/linux
        # No sudo and no systemd inside a container, which is also the immutable
        # -distribution case: everything must land under $HOME and the script must
        # not abort when it cannot write /usr or reach systemctl.
        run: |
          export HOME=/tmp/ergopti-home
          mkdir -p "$HOME"
          bash install.sh --no-deps

      - name: The installed tree is the one the daemon expects
        run: |
          export HOME=/tmp/ergopti-home
          FAIL=0
          # The wrapper is what a user types. Without it nothing else matters.
          if [ ! -x "$HOME/.local/bin/ergopti-hotstrings" ]; then
            echo "::error::no executable at ~/.local/bin/ergopti-hotstrings"
            FAIL=1
          fi
          # The driver root and the shared tree must be SIBLINGS: infra/paths.lua
          # resolves _shared as ../_shared from the driver root and probes it, so a
          # layout that nests them differently boots to "shared tree not found".
          for path in "$HOME/.local/lib/ergopti/linux/ergopti_hotstrings.lua" \
                      "$HOME/.local/lib/ergopti/_shared/data/locales/en.json"; do
            if [ ! -f "$path" ]; then
              echo "::error::missing $path"
              FAIL=1
            fi
          done
          # A hotstring pack, because an install with no hotstrings is an install
          # that runs and does nothing.
          if ! ls "$HOME/.local/lib/ergopti/_shared/modules/hotstrings/"*.toml >/dev/null 2>&1; then
            echo "::error::no hotstring packs were installed"
            FAIL=1
          fi
          exit $FAIL
        timeout-minutes: 5

      # The whole unit suite, on THIS distribution's own LuaJIT.
      #
      # Everything else in this workflow runs on Ubuntu's build, so a difference
      # that belongs to the interpreter or the C library is invisible to it —
      # and those are the differences that actually bite here. Alpine is musl
      # rather than glibc; Arch ships whatever LuaJIT released last; several
      # distributions patch it. The driver is 1600 assertions of pure Lua plus a
      # thin FFI layer, so running them where the interpreter differs is cheap
      # certification of exactly the part that varies.
      #
      # LuaJIT is the production interpreter. A distribution lane without it is
      # not evidence about the driver and therefore cannot satisfy this gate.
      - name: The unit suite on this distribution's LuaJIT
        working-directory: static/ergopti_plus/linux
        run: |
          set +e
          case "${{ matrix.distro }}" in
            debian)   apt-get install -y --no-install-recommends luajit ;;
            fedora)   dnf install -y luajit ;;
            arch)     pacman -Sy --noconfirm luajit ;;
            alpine)   apk add --no-cache luajit ;;
            opensuse) zypper --non-interactive install luajit ;;
          esac
          if ! command -v luajit >/dev/null 2>&1; then
            echo "::error::${{ matrix.distro }} has no LuaJIT package — mandatory distro coverage did not run."
            exit 1
          fi
          luajit -v
          luajit tests/run.lua
          STATUS=$?
          set -e
          exit $STATUS
        timeout-minutes: 10

      - name: Record mandatory distro evidence
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/linux-ci-evidence"
          mkdir -p "$evidence_dir"
          printf '%s\n' \
            '{' \
            '  "schema_version": 1,' \
            '  "job": "install-linux-distros",' \
            "  \"sha\": \"$GITHUB_SHA\"," \
            "  \"architecture\": \"$RUNNER_ARCH\"," \
            '  "distro": "${{ matrix.distro }}",' \
            '  "session": "container",' \
            '  "interpreter": "LuaJIT",' \
            '  "subjects": { "distro-${{ matrix.distro }}": 1 }' \
            '}' > "$evidence_dir/${{ matrix.distro }}.json"

      - name: Upload mandatory distro evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-ci-evidence-distro-${{ matrix.distro }}
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/${{ matrix.distro }}.json
          if-no-files-found: error

  # ─────────────────────────────────────────────────
  # 4.2) Linux E2E — virtual-keyboard harness (stubbed, no real evdev/ytotool)
  # ─────────────────────────────────────────────────
  # This job runs on ubuntu-latest against the pure-Lua hotstring engine — no
  # real evdev device, no ydotool injection. It is a corpus-driven replay of
  # the engine's on_char() logic layer, not an OS-level end-to-end test.
  e2e-linux:
    name: 'Linux · E2E (virtual-keyboard, stubbed)'
    runs-on: ubuntu-latest
    needs: [test-linux]

    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit

      - name: Run virtual-keyboard E2E harness
        # Exercises the hotstring engine against 8 hand-coded scenarios
        # and all shared corpus vectors (vectors.json).
        # Exit 0 = all pass, 1 = at least one failure.
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          luajit tests/e2e/run_e2e.lua | tee "$RUNNER_TEMP/linux-e2e.log"
        timeout-minutes: 5

      - name: Record mandatory Linux E2E evidence
        run: |
          set -euo pipefail
          assertions=$(sed -n 's/^1\.\.\([0-9][0-9]*\)$/\1/p' "$RUNNER_TEMP/linux-e2e.log" | tail -1)
          node tools/test/linux-ci-evidence.cjs record \
              --job e2e-linux \
              --output "$RUNNER_TEMP/linux-ci-evidence/e2e-linux.json" \
              --sha "$GITHUB_SHA" \
              --architecture "$RUNNER_ARCH" \
              --distro ubuntu \
              --session virtual-keyboard \
              --interpreter "$(luajit -v 2>&1 | head -1)" \
              --subject "hotstring-e2e=$assertions"

      - name: Upload mandatory Linux E2E evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-ci-evidence-e2e-linux
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/e2e-linux.json
          if-no-files-found: error

  # ─────────────────────────────────────────────────
  # 4.3) Build the .deb package, for real
  # ─────────────────────────────────────────────────
  # This job used to run build-linux-deb.sh --skip-deb, which returns BEFORE
  # dpkg-deb. No .deb was ever produced, so DEBIAN/control, postinst and prerm
  # shipped in release after release without dpkg once parsing them. The flag is
  # gone: the package is really built, and it is handed to the install-and-launch
  # job below so something finally opens it.
  build-deb:
    name: 'Linux · .deb package'
    runs-on: ubuntu-latest
    needs: [e2e-linux]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Assemble Linux driver bundle
        run: bash tools/build/build-linux-driver.sh --skip-smoke

      - name: Build the .deb
        run: bash tools/build/build-linux-deb.sh

      - name: Hand the package to the install-and-launch job
        # Renamed, and NOT to the release asset name. tools/test/
        # test-release-notes-assets-are-uploaded.cjs joins the release-note links
        # against every upload-artifact path: list by basename; an artifact here
        # sharing the published name would stand in for the release upload and
        # let that guard pass while build-linux quietly stopped attaching the
        # .deb. Same bytes either way — dpkg does not read the filename.
        run: |
          set -euo pipefail
          built=$(find build/linux -maxdepth 1 -name '*.deb' -type f | head -1)
          if [ -z "$built" ]; then
              echo "::error::build-linux-deb.sh produced no .deb — dpkg-deb never ran."
              exit 1
          fi
          mv "$built" build/linux/ergopti-smoke.deb
          dpkg-deb --info build/linux/ergopti-smoke.deb

      - name: Upload the .deb for the install-and-launch job
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-deb
          retention-days: 1
          path: build/linux/ergopti-smoke.deb

      - name: Record and upload mandatory .deb build evidence
        run: |
          node tools/test/linux-ci-evidence.cjs record \
              --job build-deb --output "$RUNNER_TEMP/linux-ci-evidence/build-deb.json" \
              --sha "$GITHUB_SHA" --architecture "$RUNNER_ARCH" --distro ubuntu \
              --session packaging --interpreter "$(dpkg-deb --version | head -1)" \
              --subject build-deb=1

      - name: Upload mandatory .deb build evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-ci-evidence-build-deb
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/build-deb.json
          if-no-files-found: error

  # ─────────────────────────────────────────────────
  # 4.4) Build the .rpm package, for real
  # ─────────────────────────────────────────────────
  # Same story as the .deb: --skip-rpm returned before rpmbuild, so the generated
  # spec — its %files list, its %post and %preun — had never been through rpm.
  build-rpm:
    name: 'Linux · .rpm package'
    runs-on: ubuntu-latest
    needs: [e2e-linux]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install rpmbuild
        # Ubuntu's "rpm" package carries /usr/bin/rpmbuild. The version call is
        # not decoration: without rpmbuild the packager exits 0 with only the
        # spec staged, so a missing binary would read as a successful build.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y rpm
          rpmbuild --version

      - name: Assemble Linux driver bundle
        run: bash tools/build/build-linux-driver.sh --skip-smoke

      - name: Build the .rpm
        run: bash tools/build/build-linux-rpm.sh

      - name: An .rpm was actually produced
        # Demanding the file is what stops "rpmbuild was not there" from reading
        # as a successful build, and -qip/-qlp put the metadata and the file list
        # in the log where a wrong %files stanza is visible without a Fedora box.
        run: |
          set -euo pipefail
          built=$(find build/linux/rpm/RPMS -name '*.rpm' -type f | head -1)
          if [ -z "$built" ]; then
              echo "::error::build-linux-rpm.sh produced no .rpm — rpmbuild never ran."
              exit 1
          fi
          echo "RPM: $built ($(du -h "$built" | cut -f1))"
          rpm -qip "$built"
          rpm -qlp "$built" | head -20
          cp "$built" build/linux/ergopti-smoke.rpm

      - name: Upload the .rpm for the install-and-launch job
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-rpm
          retention-days: 1
          path: build/linux/ergopti-smoke.rpm

      - name: Record mandatory .rpm build evidence
        run: |
          node tools/test/linux-ci-evidence.cjs record \
              --job build-rpm --output "$RUNNER_TEMP/linux-ci-evidence/build-rpm.json" \
              --sha "$GITHUB_SHA" --architecture "$RUNNER_ARCH" --distro ubuntu \
              --session packaging --interpreter "$(rpmbuild --version)" \
              --subject build-rpm=1

      - name: Upload mandatory .rpm build evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-ci-evidence-build-rpm
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/build-rpm.json
          if-no-files-found: error

  # ─────────────────────────────────────────────────
  # 4.5) Build the AppImage, for real
  # ─────────────────────────────────────────────────
  # The distribution-agnostic package: no root, no package manager, one file. It
  # is the answer for every distribution the .deb and .rpm do not cover, so it is
  # built here rather than only at release time.
  build-appimage:
    name: 'Linux · AppImage package'
    runs-on: ubuntu-latest
    needs: [e2e-linux]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install LuaJIT
        # build-linux-appimage.sh copies the BUILD HOST's luajit into the image
        # when there is one. Without this the AppImage is still produced, but it
        # falls back to a luajit the target must already have.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit

      - name: Install appimagetool
        # appimagetool ships AS an AppImage, and an AppImage mounts itself with
        # FUSE, which this runner does not have. Unpacking it once and putting
        # its AppRun on PATH is the standard way around that.
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/appimagetool" \
              https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          (cd "$RUNNER_TEMP" && ./appimagetool --appimage-extract >/dev/null)
          sudo ln -sf "$RUNNER_TEMP/squashfs-root/AppRun" /usr/local/bin/appimagetool
          test -x /usr/local/bin/appimagetool

      - name: Assemble Linux driver bundle
        run: bash tools/build/build-linux-driver.sh --skip-smoke

      - name: Build the AppImage
        run: bash tools/build/build-linux-appimage.sh

      - name: An AppImage was actually produced
        # The packager exits 0 with only the AppDir staged when appimagetool is
        # missing. Demanding the file is what stops that from reading as a build.
        run: |
          set -euo pipefail
          built=$(find build/linux -maxdepth 1 -name '*.AppImage' -type f | head -1)
          if [ -z "$built" ]; then
              echo "::error::build-linux-appimage.sh staged an AppDir but produced no AppImage."
              exit 1
          fi
          echo "AppImage: $built ($(du -h "$built" | cut -f1))"
          mv "$built" build/linux/ergopti-smoke.AppImage

      - name: Upload the AppImage for the install-and-launch job
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-appimage
          retention-days: 1
          path: build/linux/ergopti-smoke.AppImage

      - name: Record mandatory AppImage build evidence
        run: |
          node tools/test/linux-ci-evidence.cjs record \
              --job build-appimage --output "$RUNNER_TEMP/linux-ci-evidence/build-appimage.json" \
              --sha "$GITHUB_SHA" --architecture "$RUNNER_ARCH" --distro ubuntu \
              --session packaging --interpreter "$(luajit -v 2>&1 | head -1)" \
              --subject build-appimage=1

      - name: Upload mandatory AppImage build evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-ci-evidence-build-appimage
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/build-appimage.json
          if-no-files-found: error

  # ─────────────────────────────────────────────────
  # 4.6) Build the Flatpak bundle, for real
  # ─────────────────────────────────────────────────
  # This job used to run --skip-flatpak and validate the manifest without ever
  # building it, on the reasoning that a stock runner could not: flatpak-builder
  # needs unprivileged user namespaces, which Ubuntu 24.04 restricts through
  # AppArmor on the runner image, and the build pulls the freedesktop runtime and
  # SDK from Flathub before compiling LuaJIT from git inside the sandbox.
  #
  # The namespace restriction is one sysctl. The Flathub pull is slow, not
  # impossible. So the bundle is built here, because "we validated the manifest"
  # is exactly the claim the .deb and .rpm jobs were making right up until the
  # first real install found a package that could not start.
  build-flatpak:
    name: 'Linux · Flatpak package'
    runs-on: ubuntu-latest
    needs: [e2e-linux]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install flatpak and lift the namespace restriction
        # flatpak-builder sandboxes each build step with bubblewrap, which needs
        # an unprivileged user namespace. Ubuntu 24.04 denies that by default
        # through AppArmor, and the failure surfaces as an opaque bwrap error
        # rather than as a permission decision — hence setting it explicitly, and
        # tolerating a kernel that has no such knob.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 ||
              echo "::notice::no apparmor_restrict_unprivileged_userns knob here — continuing"
          flatpak --version
          flatpak-builder --version

      - name: Add Flathub and pull the runtime
        # The one genuinely slow step: the runtime and SDK are a large download.
        # A failure here is a real failure — better a red job naming a Flathub
        # outage than a green one that quietly built nothing.
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          flatpak list --user

      - name: Assemble Linux driver bundle
        run: bash tools/build/build-linux-driver.sh --skip-smoke

      - name: Build the Flatpak
        run: bash tools/build/build-linux-flatpak.sh

      - name: The staged payload carries the driver and the shared data tree
        # The packager checks its own manifest; this checks the payload, which is
        # the part a copy that silently did nothing would leave empty.
        run: |
          set -euo pipefail
          fail=0
          for f in build/linux/flatpak/org.ergopti.Ergopti.yml \
                   build/linux/flatpak/payload/bin/ergopti \
                   build/linux/flatpak/payload/lib/ergopti/ergopti_hotstrings.lua \
                   build/linux/flatpak/payload/lib/ergopti/infra/paths.lua \
                   build/linux/flatpak/payload/lib/ergopti/_shared/lua/logger/shim.lua \
                   build/linux/flatpak/payload/lib/ergopti/_shared/data/locales/en.json; do
              if [ ! -f "$f" ]; then
                  echo "::error::the Flatpak payload is missing $f"
                  fail=1
              fi
          done
          exit $fail

      - name: A .flatpak bundle was actually produced
        # The packager exits 0 with only the manifest staged when flatpak-builder
        # is absent. Demanding the file is what stops that reading as a build.
        run: |
          set -euo pipefail
          built=$(find build/linux -maxdepth 1 -name '*.flatpak' -type f | head -1)
          if [ -z "$built" ]; then
              echo "::error::build-linux-flatpak.sh staged a manifest but produced no bundle."
              exit 1
          fi
          echo "Flatpak: $built ($(du -h "$built" | cut -f1))"
          mv "$built" build/linux/ergopti-smoke.flatpak

      - name: Upload the bundle for the install-and-launch job
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-flatpak
          retention-days: 1
          path: build/linux/ergopti-smoke.flatpak

      - name: Record mandatory Flatpak build evidence
        run: |
          node tools/test/linux-ci-evidence.cjs record \
              --job build-flatpak --output "$RUNNER_TEMP/linux-ci-evidence/build-flatpak.json" \
              --sha "$GITHUB_SHA" --architecture "$RUNNER_ARCH" --distro ubuntu \
              --session packaging --interpreter "$(flatpak-builder --version)" \
              --subject build-flatpak=1

      - name: Upload mandatory Flatpak build evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-ci-evidence-build-flatpak
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/build-flatpak.json
          if-no-files-found: error

  # ─────────────────────────────────────────────────
  # 4.7) Install the .deb and launch what it installed
  # ─────────────────────────────────────────────────
  # The step the whole packaging chain existed to make possible: take the package
  # a user would download, install it the way a user would, and run the binary it
  # put on their PATH. Everything before this validates sources; this validates
  # the INSTALLED layout, which is a different tree with different paths and is
  # where the last shared-tree defect lived.
  #
  # There is no display on this runner, so the tray and the WebKit windows are
  # deliberately not started — they cannot be, and pretending otherwise would
  # make this job green for the wrong reason.
  smoke-deb-install:
    name: 'Linux · install the .deb and launch it'
    runs-on: ubuntu-latest
    needs: [build-deb]

    steps:
      - uses: actions/checkout@v4

      - name: Download the .deb built above
        uses: actions/download-artifact@v4
        with:
          name: ci-linux-deb
          path: pkg

      - name: Install it the way a user would
        # --no-install-recommends deliberately: the Recommends list names kanata
        # and libayatana-appindicator3-1 among others, which are optional at
        # runtime and not all in the Ubuntu archive. What is under test is that
        # the Depends resolve and that DEBIAN/postinst — never once executed
        # before this job existed — runs to completion, since apt fails the
        # install when it exits non-zero.
        run: |
          set -euo pipefail
          deb=$(find pkg -name '*.deb' -type f | head -1)
          if [ -z "$deb" ]; then
              echo "::error::the ci-linux-deb artifact contains no .deb."
              exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "./$deb"
          dpkg -s ergopti

      - name: The package installed the files the daemon reads
        run: |
          set -euo pipefail
          fail=0
          for f in /usr/bin/ergopti \
                   /usr/lib/ergopti/ergopti_hotstrings.lua \
                   /usr/lib/ergopti/infra/paths.lua \
                   /usr/lib/ergopti/_shared/lua/logger/shim.lua \
                   /usr/lib/ergopti/_shared/data/locales/en.json \
                   /usr/lib/systemd/user/ergopti-hotstrings.service; do
              if [ ! -e "$f" ]; then
                  echo "::error::the package did not install $f"
                  fail=1
              fi
          done
          exit $fail

      - name: Launch the installed binary
        # --help returns early, but only AFTER every file-scope require in the
        # daemon has run — so this is a real check of the require graph against
        # the INSTALLED layout, which the unit suite (run from the checkout)
        # cannot see. A missing module or a wrapper with the wrong LUA_PATH
        # fails here instead of on the user's machine.
        timeout-minutes: 2
        run: |
          set -euo pipefail
          /usr/bin/ergopti --help

      - name: The installed shared data tree resolves and opens
        # --help returns before doing any work, so it proves the require graph
        # and nothing about the DATA tree — which is where the defect that
        # motivated this whole job actually lived. The check is a tracked file
        # rather than a heredoc because five formats run it.
        #
        # LUA_PATH is replayed from the INSTALLED wrapper rather than re-typed,
        # so this cannot pass against a path the wrapper does not set.
        run: |
          set -euo pipefail
          eval "$(grep -E '^(DRIVER_ROOT|SHARED_LUA)=|^export LUA_PATH=' /usr/bin/ergopti)"
          if [ -z "${LUA_PATH:-}" ]; then
              echo "::error::/usr/bin/ergopti no longer exports LUA_PATH — this check read nothing."
              exit 1
          fi
          echo "LUA_PATH from the installed wrapper: $LUA_PATH"
          luajit static/ergopti_plus/linux/tests/hardware/installed_layout_check.lua \
              /usr/lib/ergopti/_shared

      - name: Record mandatory .deb smoke evidence
        run: |
          node tools/test/linux-ci-evidence.cjs record \
              --job smoke-deb-install --output "$RUNNER_TEMP/linux-ci-evidence/smoke-deb-install.json" \
              --sha "$GITHUB_SHA" --architecture "$RUNNER_ARCH" --distro ubuntu \
              --session installed-package --interpreter "$(luajit -v 2>&1 | head -1)" \
              --subject smoke-deb-install=1

      - name: Upload mandatory .deb smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-ci-evidence-smoke-deb-install
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/smoke-deb-install.json
          if-no-files-found: error

  # ─────────────────────────────────────────────────
  # 4.8) Gate: Linux driver fully green
  # ─────────────────────────────────────────────────
  # The needs: list and the loop below name the same jobs twice on purpose —
  # needs: decides what this job waits for, the loop decides what it fails on —
  # and a job added to one but not the other runs and gates nothing. That is
  # exactly what build-deb and build-rpm were: no job listed them, so a broken
  # package still shipped a release. Anything added to section 4 goes in BOTH.
  # ─────────────────────────────────────────────────
  # 4.8) Install the .rpm and launch what it installed
  # ─────────────────────────────────────────────────
  # In a Fedora container, because ubuntu-latest cannot install an .rpm and a
  # conversion through alien would be testing alien. dnf resolves the same
  # dependencies a Fedora user's would.
  smoke-rpm-install:
    name: 'Linux · install the .rpm and launch it'
    runs-on: ubuntu-latest
    needs: [build-rpm]
    container:
      image: fedora:latest

    steps:
      - name: Tools the job itself needs
        # Deliberately NOT luajit: the .rpm declares `Requires: luajit >= 2.1`,
        # so letting dnf resolve it from the package is what proves that
        # declaration is right. Pre-installing it would hide a wrong Requires.
        # git is for actions/checkout, findutils for the `find` below.
        run: dnf install -y git findutils

      - uses: actions/checkout@v4

      - name: Download the .rpm built above
        uses: actions/download-artifact@v4
        with:
          name: ci-linux-rpm
          path: pkg

      - name: Install it the way a user would
        run: |
          set -euo pipefail
          rpm=$(find pkg -name '*.rpm' -type f | head -1)
          if [ -z "$rpm" ]; then
              echo "::error::the ci-linux-rpm artifact contains no .rpm."
              exit 1
          fi
          dnf install -y "./$rpm"
          rpm -q ergopti

      - name: Launch the installed binary
        run: /usr/bin/ergopti --help

      - name: The installed shared data tree resolves and opens
        run: |
          set -euo pipefail
          eval "$(grep -E '^(DRIVER_ROOT|SHARED_LUA)=|^export LUA_PATH=' /usr/bin/ergopti)"
          if [ -z "${LUA_PATH:-}" ]; then
              echo "::error::/usr/bin/ergopti no longer exports LUA_PATH — this check read nothing."
              exit 1
          fi
          luajit static/ergopti_plus/linux/tests/hardware/installed_layout_check.lua \
              /usr/lib/ergopti/_shared

      - name: Record mandatory .rpm smoke evidence
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/linux-ci-evidence"
          mkdir -p "$evidence_dir"
          printf '%s\n' \
            '{' \
            '  "schema_version": 1,' \
            '  "job": "smoke-rpm-install",' \
            "  \"sha\": \"$GITHUB_SHA\"," \
            "  \"architecture\": \"$RUNNER_ARCH\"," \
            '  "distro": "fedora",' \
            '  "session": "installed-package",' \
            '  "interpreter": "LuaJIT",' \
            '  "subjects": { "smoke-rpm-install": 1 }' \
            '}' > "$evidence_dir/smoke-rpm-install.json"

      - name: Upload mandatory .rpm smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-ci-evidence-smoke-rpm-install
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/smoke-rpm-install.json
          if-no-files-found: error

  # ─────────────────────────────────────────────────
  # 4.9) Run the AppImage
  # ─────────────────────────────────────────────────
  # An AppImage is not installed; running it IS the install. It mounts itself
  # with FUSE, which this runner does not have, so it is unpacked with the
  # --appimage-extract escape hatch the format provides for exactly this.
  # AppRun is then the same entry point a user's double-click reaches.
  smoke-appimage-run:
    name: 'Linux · run the AppImage'
    runs-on: ubuntu-latest
    needs: [build-appimage]

    steps:
      - uses: actions/checkout@v4

      - name: Download the AppImage built above
        uses: actions/download-artifact@v4
        with:
          name: ci-linux-appimage
          path: pkg

      - name: Unpack it (no FUSE on this runner)
        run: |
          set -euo pipefail
          img=$(find pkg -name '*.AppImage' -type f | head -1)
          if [ -z "$img" ]; then
              echo "::error::the ci-linux-appimage artifact contains no .AppImage."
              exit 1
          fi
          chmod +x "$img"
          "./$img" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun

      - name: Launch it
        # Explicitly --help: AppRun appends --tray when given no arguments, and
        # there is no display here for a tray to appear in.
        run: ./squashfs-root/AppRun --help

      - name: The bundled shared data tree resolves and opens
        # The AppImage is relocatable, so its root is wherever it was unpacked —
        # which is the point of checking it here rather than assuming a prefix.
        #
        # Run through the image's OWN luajit, not the runner's. There is no
        # luajit on this runner at all, which is the situation an AppImage
        # exists for: if the bundled interpreter is missing or unusable, that is
        # a defect in the package and this step is where it should surface.
        run: |
          set -euo pipefail
          root="$(pwd)/squashfs-root/usr/lib/ergopti"
          luajit_bin="$(pwd)/squashfs-root/usr/bin/luajit"
          if [ ! -x "$luajit_bin" ]; then
              echo "::error::the AppImage bundles no runnable luajit at usr/bin/luajit — it would depend on the target having one."
              exit 1
          fi
          export LUA_PATH="$root/?.lua;$root/?/init.lua;$root/_shared/lua/?.lua;$root/_shared/lua/?/init.lua;;"
          "$luajit_bin" static/ergopti_plus/linux/tests/hardware/installed_layout_check.lua \
              "$root/_shared"

      - name: Record mandatory AppImage smoke evidence
        run: |
          node tools/test/linux-ci-evidence.cjs record \
              --job smoke-appimage-run --output "$RUNNER_TEMP/linux-ci-evidence/smoke-appimage-run.json" \
              --sha "$GITHUB_SHA" --architecture "$RUNNER_ARCH" --distro ubuntu \
              --session unpacked-appimage --interpreter "$(./squashfs-root/usr/bin/luajit -v 2>&1 | head -1)" \
              --subject smoke-appimage-run=1

      - name: Upload mandatory AppImage smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-ci-evidence-smoke-appimage-run
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/smoke-appimage-run.json
          if-no-files-found: error

  # ─────────────────────────────────────────────────
  # 4.10) Install the Flatpak and launch it
  # ─────────────────────────────────────────────────
  # The sandboxed path. `flatpak run` is what a user's launcher invokes, and it
  # is the only one of the five that executes inside the confinement the
  # manifest declares — so a permission the driver needs and the manifest forgot
  # shows up here rather than on a user's machine.
  smoke-flatpak-run:
    name: 'Linux · install the Flatpak and launch it'
    runs-on: ubuntu-latest
    needs: [build-flatpak]

    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak and lift the namespace restriction
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y flatpak
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 ||
              echo "::notice::no apparmor_restrict_unprivileged_userns knob here — continuing"

      - name: Download the bundle built above
        uses: actions/download-artifact@v4
        with:
          name: ci-linux-flatpak
          path: pkg

      - name: Install it the way a user would
        run: |
          set -euo pipefail
          bundle=$(find pkg -name '*.flatpak' -type f | head -1)
          if [ -z "$bundle" ]; then
              echo "::error::the ci-linux-flatpak artifact contains no bundle."
              exit 1
          fi
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08
          flatpak install --user -y --bundle "$bundle"
          flatpak list --user --app

      - name: Launch it
        run: flatpak run --user org.ergopti.Ergopti --help

      - name: The sandboxed shared data tree resolves and opens
        # Run INSIDE the sandbox with --command, so this reads /app exactly as
        # the daemon does. The check script is bound in read-only from the
        # checkout because the package deliberately ships no tests.
        run: |
          set -euo pipefail
          check_dir="$(pwd)/static/ergopti_plus/linux/tests/hardware"
          flatpak run --user \
              --filesystem="$check_dir:ro" \
              --env=LUA_PATH="/app/lib/ergopti/?.lua;/app/lib/ergopti/?/init.lua;/app/lib/ergopti/_shared/lua/?.lua;/app/lib/ergopti/_shared/lua/?/init.lua;;" \
              --command=luajit org.ergopti.Ergopti \
              "$check_dir/installed_layout_check.lua" /app/lib/ergopti/_shared

      - name: Record mandatory Flatpak smoke evidence
        run: |
          node tools/test/linux-ci-evidence.cjs record \
              --job smoke-flatpak-run --output "$RUNNER_TEMP/linux-ci-evidence/smoke-flatpak-run.json" \
              --sha "$GITHUB_SHA" --architecture "$RUNNER_ARCH" --distro ubuntu \
              --session flatpak-sandbox --interpreter "$(flatpak --version)" \
              --subject smoke-flatpak-run=1

      - name: Upload mandatory Flatpak smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-ci-evidence-smoke-flatpak-run
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/smoke-flatpak-run.json
          if-no-files-found: error

  # ─────────────────────────────────────────────────
  # 4.11) Install the tarball with install.sh and launch it
  # ─────────────────────────────────────────────────
  # The no-root path the release notes point every other distribution at. It is
  # the only format whose installer is our own script rather than a package
  # manager, so it is the only one where a broken install.sh is invisible
  # everywhere else. --no-deps because the runner has what it needs and the
  # dependency install is the distro matrix's job, not this one's.
  smoke-tarball-install:
    name: 'Linux · install the tarball and launch it'
    runs-on: ubuntu-latest
    needs: [e2e-linux]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit

      - name: Assemble and pack the bundle exactly as the release does
        run: |
          set -euo pipefail
          bash tools/build/build-linux-driver.sh --skip-smoke
          bundle_asset=$(node -p "require('./static/ergopti_plus/_shared/modules/updater/defaults.json').release_assets.linux_bundle")
          if [[ ! "$bundle_asset" =~ ^[A-Za-z0-9._+-]+\.tar\.gz$ ]]; then
              echo "::error::unsafe Linux bundle asset name: $bundle_asset"
              exit 1
          fi
          echo "LINUX_BUNDLE_ASSET=$bundle_asset" >> "$GITHUB_ENV"
          bundle_path="$RUNNER_TEMP/$bundle_asset"
          tar -czf "$bundle_path" \
              -C build/linux linux _shared bin install.sh kanata.kbd
          (cd "$RUNNER_TEMP" && sha256sum "$bundle_asset" > "$bundle_asset.sha256")
          (cd "$RUNNER_TEMP" && sha256sum --check "$bundle_asset.sha256")
          tar -tzf "$bundle_path" | wc -l

      - name: Unpack and install it the way a user would
        # --no-deps because package installs are the distro matrix's job, and
        # --no-service because a runner has no user session bus for a
        # systemd --user unit to register with. The permission setup DOES run:
        # it is the half every packaged format leaves to install.sh, so skipping
        # it would leave the one script nobody else exercises unexercised.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP/$LINUX_BUNDLE_ASSET" -C "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP/unpacked"
          test -f install.sh
          bash install.sh --no-deps --no-service || {
              echo "::error::install.sh failed on a clean unpack of the release tarball."
              exit 1
          }

      - name: Launch what it installed
        run: |
          set -euo pipefail
          launcher="$HOME/.local/bin/ergopti-hotstrings"
          if [ ! -x "$launcher" ]; then
              echo "::error::install.sh left no executable launcher at $launcher"
              ls -la "$HOME/.local/bin" || true
              exit 1
          fi
          "$launcher" --help

      - name: The installed shared data tree resolves and opens
        run: |
          set -euo pipefail
          root="$HOME/.local/lib/ergopti"
          if [ ! -d "$root/linux" ]; then
              echo "::error::no driver tree at $root/linux — install.sh moved its install root."
              ls -la "$root" || true
              exit 1
          fi
          export LUA_PATH="$root/linux/?.lua;$root/linux/?/init.lua;$root/_shared/lua/?.lua;$root/_shared/lua/?/init.lua;;"
          luajit static/ergopti_plus/linux/tests/hardware/installed_layout_check.lua \
              "$root/_shared"

      - name: Record mandatory tarball smoke evidence
        run: |
          node tools/test/linux-ci-evidence.cjs record \
              --job smoke-tarball-install --output "$RUNNER_TEMP/linux-ci-evidence/smoke-tarball-install.json" \
              --sha "$GITHUB_SHA" --architecture "$RUNNER_ARCH" --distro ubuntu \
              --session user-install --interpreter "$(luajit -v 2>&1 | head -1)" \
              --subject smoke-tarball-install=1

      - name: Upload mandatory tarball smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-ci-evidence-smoke-tarball-install
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/smoke-tarball-install.json
          if-no-files-found: error

  linux-ok:
    name: 'Linux · ✅ all green'
    runs-on: ubuntu-latest
    needs:
      - test-linux
      - install-linux-distros
      - e2e-linux
      - build-deb
      - build-rpm
      - build-appimage
      - build-flatpak
      - smoke-deb-install
      - smoke-rpm-install
      - smoke-appimage-run
      - smoke-flatpak-run
      - smoke-tarball-install
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Download Linux assertion evidence
        uses: actions/download-artifact@v4
        with:
          pattern: linux-ci-evidence-*
          path: ${{ runner.temp }}/linux-ci-evidence
          merge-multiple: true

      - name: Assert all mandatory Linux subjects ran and passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          node tools/test/linux-ci-evidence.cjs verify \
              --manifest .github/linux-ci-coverage.json \
              --needs "$NEEDS" \
              --evidence-dir "$RUNNER_TEMP/linux-ci-evidence" \
              --sha "$GITHUB_SHA"
          echo "Linux driver: every mandatory job and evidence subject passed."

  # =============================================================
  # =============================================================
  # ======= 5/ Resolve release metadata (main + dev) ============
  # =============================================================
  # =============================================================

  resolve-release-meta:
    name: 'Release · resolve tag + version'
    runs-on: ubuntu-latest
    needs: [macos-ok, windows-ok, linux-ok]
    # Runs on push to main or dev — not on PRs
    if: >
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      needs.macos-ok.result   == 'success' &&
      needs.windows-ok.result == 'success' &&
      needs.linux-ok.result   == 'success'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      title: ${{ steps.meta.outputs.title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      skip: ${{ steps.meta.outputs.skip }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute tag and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"

          if [ "$branch" = "main" ]; then
              last_stable=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
              if [ -z "$last_stable" ]; then
                  last_stable="v0.0.0"
                  range="HEAD"
              else
                  range="${last_stable}..HEAD"
              fi
              IFS='.' read -r maj min pat <<< "${last_stable#v}"
              bump="patch"
              while IFS= read -r subject; do
                  [ -z "$subject" ] && continue
                  if echo "$subject" | grep -qE '(BREAKING|!):'; then
                      bump="major"; break
                  elif echo "$subject" | grep -qE '^feat(\([^)]+\))?!?:'; then
                      [ "$bump" != "major" ] && bump="minor"
                  fi
              done < <(git log "$range" --no-merges --pretty=format:"%s")
              case "$bump" in
                  major) maj=$((maj+1)); min=0; pat=0 ;;
                  minor) min=$((min+1)); pat=0 ;;
                  patch) pat=$((pat+1)) ;;
              esac
              tag="v${maj}.${min}.${pat}"
              prerelease="false"
              title="Ergopti ${tag}"
          else
              # dev branch — v0.0.0-dev.N series
              last_dev=$(git tag --list 'v0.0.0-dev.*' --sort=-v:refname | head -1 || true)
              if [ -z "$last_dev" ]; then
                  next_n=1
              else
                  last_n="${last_dev##*.}"
                  next_n=$((last_n + 1))
              fi
              tag="v0.0.0-dev.${next_n}"
              prerelease="true"

              # Human-readable delta since the last stable tag
              last_stable=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
              if [ -n "$last_stable" ]; then
                  range="${last_stable}..HEAD"
                  n_feat=0; n_fix=0; n_other=0; n_breaking=0
                  while IFS= read -r subject; do
                      [ -z "$subject" ] && continue
                      if echo "$subject" | grep -qE '(BREAKING|!):'; then
                          n_breaking=$((n_breaking+1))
                      elif echo "$subject" | grep -qE '^feat(\([^)]+\))?!?:'; then
                          n_feat=$((n_feat+1))
                      elif echo "$subject" | grep -qE '^fix(\([^)]+\))?:'; then
                          n_fix=$((n_fix+1))
                      else
                          n_other=$((n_other+1))
                      fi
                  done < <(git log "$range" --no-merges --pretty=format:"%s")
                  delta=""
                  [ "$n_breaking" -gt 0 ] && delta="${delta}!! ${n_breaking} breaking, "
                  [ "$n_feat"     -gt 0 ] && delta="${delta}✨ ${n_feat} feat, "
                  [ "$n_fix"      -gt 0 ] && delta="${delta}🔧 ${n_fix} fix, "
                  [ "$n_other"    -gt 0 ] && delta="${delta}📦 ${n_other} other, "
                  delta="${delta%, }"
                  if [ -n "$delta" ]; then
                      title="Ergopti ${tag} — ${delta} (since ${last_stable})"
                  else
                      title="Ergopti ${tag} (since ${last_stable})"
                  fi
              else
                  title="Ergopti ${tag}"
              fi
          fi

          # Skip if the tag already exists (duplicate push guard)
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
              echo "Tag '$tag' already exists — skipping release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "tag=$tag"               >> "$GITHUB_OUTPUT"
              echo "version=${tag#v}"       >> "$GITHUB_OUTPUT"
              echo "title=$title"           >> "$GITHUB_OUTPUT"
              echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          version="${tag#v}"
          echo "tag=$tag"               >> "$GITHUB_OUTPUT"
          echo "version=$version"       >> "$GITHUB_OUTPUT"
          echo "title=$title"           >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "skip=false"             >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$tag version=$version prerelease=$prerelease"
          echo "Title: $title"

  # =========================================================
  # =========================================================
  # ======= 6/ Build release assets (all three platforms) ===
  # =========================================================
  # =========================================================

  # ─────────────────────────────────────────────────
  # 6.1) macOS — ErgoptiPlus.app + Sparkle appcast
  # ─────────────────────────────────────────────────
  build-macos:
    name: 'Release · macOS build'
    needs: resolve-release-meta
    if: needs.resolve-release-meta.outputs.skip == 'false'
    runs-on: macos-latest
    env:
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ErgoptiPlus.app
        shell: bash
        env:
          ERGOPTI_VERSION: ${{ needs.resolve-release-meta.outputs.version }}
          ERGOPTI_BUILD: ${{ github.run_number }}
          ERGOPTI_CHANNEL: ${{ needs.resolve-release-meta.outputs.prerelease == 'true' && 'dev' || 'main' }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: bash tools/build/build_macos_app.sh

      - name: Smoke test built ErgoptiPlus.app (crash-on-launch guard)
        # Mirrors the Windows ErgoptiPlus.exe smoke test in build-windows: the
        # unit suite (test-hs) runs Lua against a stubbed hs.lua fake, so real
        # hs.fs / shell-exec bugs in the driver's early bootstrap are invisible
        # to CI. That bootstrap runs unconditionally on every launch, before
        # the first-launch onboarding guard: main.swift's
        # applicationDidFinishLaunching locates the embedded Hammerspoon
        # binary and validates init.lua exists, then init.lua itself resolves
        # ~/.config/ergopti_plus/ (menu_paths.init) and initialises the logger
        # (Logger.init_log_path, which shells out to mkdir -p) against the
        # real APIs. This step launches the actual built .app (unsigned-for-
        # Gatekeeper-purposes but ad-hoc codesigned by the build script, and
        # never downloaded so no quarantine flag is set) and proves it survives
        # that bootstrap instead of dying or hanging silently.
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          APP="${{ github.workspace }}/build/macos/ErgoptiPlus.app"
          LAUNCHER_LOG="$HOME/Library/Logs/ErgoptiPlus/launcher.log"
          LUA_LOG_DIR="$HOME/.config/ergopti_plus/hammerspoon/logs"
          LUA_BOOT_LOG="/tmp/ErgoptiPlus_boot.log"
          LUA_BOOT_ERRORS_LOG="/tmp/ErgoptiPlus_errors_boot.log"
          rm -f "$LAUNCHER_LOG"
          rm -f "$LUA_BOOT_LOG" "$LUA_BOOT_ERRORS_LOG"
          rm -rf "$LUA_LOG_DIR"

          # Exercise the bundle through Launch Services, matching Finder and
          # normal CLI launches. Executing the inner Mach-O directly leaves
          # AppKit without the bundle launch context and the embedded GUI child
          # receives a clean termination request during bootstrap.
          open -n -g "$APP"
          PID=""
          launch_deadline=$((SECONDS + 10))
          while [ "$SECONDS" -lt "$launch_deadline" ]; do
              PID="$(pgrep -f -x "$APP/Contents/MacOS/ErgoptiPlus" | sed -n '1p' || true)"
              [ -n "$PID" ] && break
              sleep 0.1
          done
          if [ -z "$PID" ]; then
              echo "::error::Launch Services did not start ErgoptiPlus.app within 10s."
              cat "$LAUNCHER_LOG" 2>/dev/null || true
              exit 1
          fi

          deadline=$((SECONDS + 20))
          lua_boot_seen=false
          launcher_fatal=false
          while [ "$SECONDS" -lt "$deadline" ]; do
              if ! kill -0 "$PID" 2>/dev/null; then
                  break
              fi
              if [ -f "$LAUNCHER_LOG" ] && grep -q "FATAL:" "$LAUNCHER_LOG" 2>/dev/null; then
                  launcher_fatal=true
                  break
              fi
              if [ -d "$LUA_LOG_DIR" ] && ls "$LUA_LOG_DIR"/ErgoptiPlus_*.log >/dev/null 2>&1; then
                  lua_boot_seen=true
                  break
              fi
              sleep 0.25
          done

          crashed_early=false
          if ! kill -0 "$PID" 2>/dev/null; then
              crashed_early=true
          fi

          # Always clean up — never leave the embedded Hammerspoon process
          # (or its watcher/menu-bar state) resident on the runner.
          kill "$PID" 2>/dev/null || true
          pkill -f "Frameworks/Hammerspoon.app" 2>/dev/null || true

          if [ "$crashed_early" = true ] || [ "$launcher_fatal" = true ] || [ "$lua_boot_seen" = false ]; then
              echo "---- launcher.log ----"
              cat "$LAUNCHER_LOG" 2>/dev/null || echo "(missing)"
              echo "---- Hammerspoon early boot log ----"
              cat "$LUA_BOOT_LOG" 2>/dev/null || echo "(missing)"
              echo "---- Hammerspoon early boot errors ----"
              cat "$LUA_BOOT_ERRORS_LOG" 2>/dev/null || echo "(missing)"
              if [ "$launcher_fatal" = true ]; then
                  echo "::error::ErgoptiPlus.app logged a FATAL launcher error — see launcher.log above."
              elif [ "$crashed_early" = true ]; then
                  echo "::error::ErgoptiPlus.app exited during startup — see launcher.log above."
              else
                  echo "::error::ErgoptiPlus.app did not initialise its Hammerspoon log within 20s (early-boot bootstrap likely failing silently)."
              fi
              exit 1
          fi
          echo "OK: ErgoptiPlus.app survived startup — Hammerspoon Lua log created under $LUA_LOG_DIR"

      - name: Install Sparkle signing tool
        if: ${{ env.SPARKLE_ED_PRIVATE_KEY != '' }}
        shell: bash
        env:
          SPARKLE_VERSION: '2.9.2'
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/Sparkle.tar.xz \
              "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p /tmp/sparkle-dist
          tar -xJf /tmp/Sparkle.tar.xz -C /tmp/sparkle-dist
          echo "SIGN_UPDATE=/tmp/sparkle-dist/bin/sign_update" >> "$GITHUB_ENV"

      - name: Sign zip with Sparkle EdDSA key
        if: ${{ env.SPARKLE_ED_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > /tmp/sparkle_priv.key
          "$SIGN_UPDATE" -f /tmp/sparkle_priv.key build/macos/ErgoptiPlus.app.zip \
              > build/macos/_ErgoptiPlus.app.zip.sig
          rm -f /tmp/sparkle_priv.key
          echo "Sparkle EdDSA signature written to _ErgoptiPlus.app.zip.sig"

      - name: Generate Sparkle appcast
        if: ${{ env.SPARKLE_ED_PRIVATE_KEY != '' }}
        shell: bash
        env:
          ERGOPTI_VERSION: ${{ needs.resolve-release-meta.outputs.version }}
          ERGOPTI_BUILD: ${{ github.run_number }}
          ERGOPTI_CHANNEL: ${{ needs.resolve-release-meta.outputs.prerelease == 'true' && 'dev' || 'main' }}
          SPARKLE_SIG_FILE: build/macos/_ErgoptiPlus.app.zip.sig
          ZIP_PATH: build/macos/ErgoptiPlus.app.zip
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          OUTPUT_PATH: build/macos/appcast-${{ needs.resolve-release-meta.outputs.prerelease == 'true' && 'dev' || 'main' }}.xml
        run: bash tools/build/generate_appcast.sh

      - name: Package latest keylayout bundle
        shell: bash
        # Released as Ergopti_macOS.zip — keyboard layout only, no app.
        run: |
          set -euo pipefail
          latest=$(ls -d static/ergopti/macos/bundles/*.bundle | sort -V | tail -1)
          bundle_name=$(basename "$latest")
          (cd static/ergopti/macos/bundles && zip -r "../../../../build/macos/Ergopti_macOS.zip" "$bundle_name")
          echo "Packaged keylayout: $bundle_name → Ergopti_macOS.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-macos
          retention-days: 1
          path: |
            build/macos/ErgoptiPlus.app.zip
            build/macos/Ergopti_macOS.zip
            build/macos/_ErgoptiPlus.app.zip.sig
            build/macos/appcast-*.xml

  # ─────────────────────────────────────────────────
  # 6.2) Windows — ErgoptiPlus.exe + keyboard layout
  # ─────────────────────────────────────────────────
  build-windows:
    name: 'Release · Windows build'
    needs: resolve-release-meta
    if: needs.resolve-release-meta.outputs.skip == 'false'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and test native navigation event owner
        shell: pwsh
        run: ./tools/build/build_windows_nav_owner.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci
        shell: bash

      - name: Generate features manifest
        run: npm run build:manifest
        shell: bash

      - name: Build static asset bundle
        run: python tools/build/build_static_bundle.py
        shell: bash

      - name: Stamp BUNDLE_VERSION, BUNDLE_RELEASE_URL, BUNDLE_CHANNEL
        shell: pwsh
        run: |
          $version = "${{ needs.resolve-release-meta.outputs.version }}"
          $tag     = "${{ needs.resolve-release-meta.outputs.tag }}"
          if (-not $tag) { $tag = $version }
          $prerelease = "${{ needs.resolve-release-meta.outputs.prerelease }}"
          $channel = if ($prerelease -eq 'true') { 'dev' } else { 'main' }
          $owner   = "${{ github.repository_owner }}"
          $repo    = "${{ github.event.repository.name }}"
          $releaseUrl = "https://github.com/$owner/$repo/releases/tag/$tag"
          $bundlePath = "${{ github.workspace }}\static\ergopti_plus\windows\infra\bundle.ahk"
          $text = Get-Content -Raw -Path $bundlePath
          $text = $text.Replace("__BUNDLE_VERSION__",     $version)
          $text = $text.Replace("__BUNDLE_RELEASE_URL__", $releaseUrl)
          $text = $text.Replace("__BUNDLE_CHANNEL__",     $channel)
          Set-Content -Path $bundlePath -Value $text -Encoding UTF8 -NoNewline
          Write-Host "BUNDLE_VERSION     stamped: $version"
          Write-Host "BUNDLE_RELEASE_URL stamped: $releaseUrl"
          Write-Host "BUNDLE_CHANNEL     stamped: $channel"

      - name: Download authenticated Windows compiler toolchain
        shell: pwsh
        run: |
          $contractPath = "${{ github.workspace }}\static\ergopti_plus\_shared\modules\updater\windows_release_toolchain.json"
          $contract = Get-Content -LiteralPath $contractPath -Raw | ConvertFrom-Json
          $runtimeUrl = $contract.runtime.url
          $runtimeSha256 = $contract.runtime.sha256
          $compilerTag = $contract.compiler.tag
          $compilerAsset = $contract.compiler.asset
          $compilerUrl = $contract.compiler.url
          $compilerSha256 = $contract.compiler.sha256
          $runtimeArchive = "$env:TEMP\$($contract.runtime.asset)"
          $compilerArchive = "$env:TEMP\$compilerAsset"

          Invoke-WebRequest -Uri $runtimeUrl -OutFile $runtimeArchive -UseBasicParsing
          Invoke-WebRequest -Uri $compilerUrl -OutFile $compilerArchive -UseBasicParsing
          $runtimeActual = (Get-FileHash -LiteralPath $runtimeArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          $compilerActual = (Get-FileHash -LiteralPath $compilerArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($runtimeActual -cne $runtimeSha256) {
              throw "AutoHotkey v$($contract.runtime.version) archive digest mismatch: $runtimeActual"
          }
          if ($compilerActual -cne $compilerSha256) {
              throw "Ahk2Exe $compilerTag archive digest mismatch: $compilerActual"
          }

          Expand-Archive -LiteralPath $runtimeArchive -DestinationPath "$env:TEMP\AutoHotkey" -Force
          Expand-Archive -LiteralPath $compilerArchive -DestinationPath "$env:TEMP\Ahk2Exe" -Force
          if (-not (Test-Path -LiteralPath "$env:TEMP\AutoHotkey\AutoHotkey64.exe" -PathType Leaf)) {
              throw "The authenticated AutoHotkey archive has no expected runtime."
          }
          if (-not (Test-Path -LiteralPath "$env:TEMP\Ahk2Exe\Ahk2Exe.exe" -PathType Leaf)) {
              throw "The authenticated Ahk2Exe archive has no expected compiler."
          }
          Write-Host "Authenticated compiler toolchain: AutoHotkey v$($contract.runtime.version) + $compilerTag"

      - name: Compile ErgoptiPlus.ahk
        shell: pwsh
        run: |
          $ahk2exe = "$env:TEMP\Ahk2Exe\Ahk2Exe.exe"
          $runtime = "$env:TEMP\AutoHotkey\AutoHotkey64.exe"
          $in   = "${{ github.workspace }}\static\ergopti_plus\windows\ErgoptiPlus.ahk"
          $out  = "${{ github.workspace }}\static\ergopti_plus\windows\ErgoptiPlus.exe"
          $icon = "${{ github.workspace }}\static\favicon.ico"
          # /silent suppresses any Ahk2Exe GUI dialogs that would block
          # indefinitely on a headless runner and cause a silent non-zero exit.
          & $ahk2exe /in $in /out $out /base $runtime /icon $icon /silent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Verify the EXE was actually produced — Ahk2Exe can exit 0 on a
          # compilation warning without writing the output file.
          if (-not (Test-Path $out)) {
              Write-Error "Ahk2Exe reported success but $out was not created."
              exit 1
          }
          Write-Host "Compiled: $out ($('{0:N0}' -f (Get-Item $out).Length) bytes)"

      - name: Sign and verify ErgoptiPlus.exe
        shell: pwsh
        env:
          ERGOPTI_RELEASE_PRERELEASE: ${{ needs.resolve-release-meta.outputs.prerelease }}
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNER_SUBJECT: ${{ secrets.WINDOWS_SIGNER_SUBJECT }}
        run: |
          $required = @(
              "WINDOWS_SIGNING_CERTIFICATE_BASE64",
              "WINDOWS_SIGNING_CERTIFICATE_PASSWORD",
              "WINDOWS_SIGNER_SUBJECT")
          $missing = @($required | Where-Object {
              [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })

          if ($missing.Count -eq $required.Count) {
              if ($env:ERGOPTI_RELEASE_PRERELEASE -ceq "true") {
                  Write-Warning "Publishing an unsigned Windows artifact for the dev prerelease channel."
                  exit 0
              }
              throw "Stable Windows releases require every signing secret."
          }
          if ($missing.Count -gt 0) {
              throw "Partial Windows signing configuration; missing: $($missing -join ', ')."
          }

          $exe = "${{ github.workspace }}\static\ergopti_plus\windows\ErgoptiPlus.exe"
          $pfx = "$env:RUNNER_TEMP\ergopti-windows-signing.pfx"
          $signTools = @(Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Recurse -Filter "signtool.exe" -File |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending)
          if ($signTools.Count -eq 0) {
              throw "No x64 signtool.exe was found on the Windows runner."
          }
          $signTool = $signTools[0].FullName

          try {
              [IO.File]::WriteAllBytes(
                  $pfx,
                  [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
              & $signTool sign /fd SHA256 /td SHA256 `
                  /tr "https://timestamp.digicert.com" `
                  /f $pfx /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD $exe
              if ($LASTEXITCODE -ne 0) {
                  throw "signtool failed with exit code $LASTEXITCODE."
              }
          } finally {
              Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          if ($signature.Status -ne 'Valid') {
              throw "ErgoptiPlus.exe Authenticode status is '$($signature.Status)', expected 'Valid'."
          }
          if ($null -eq $signature.SignerCertificate -or
              $signature.SignerCertificate.Subject -cne $env:WINDOWS_SIGNER_SUBJECT) {
              throw "Unexpected Authenticode publisher '$($signature.SignerCertificate.Subject)'."
          }
          Write-Host "Verified Authenticode publisher: $($signature.SignerCertificate.Subject)"

      - name: Smoke test compiled ErgoptiPlus.exe (crash-on-launch guard)
        # The unit test suite (test-ahk job) runs against source .ahk files with
        # A_IsCompiled == false, so it never exercises compiled-mode-only code
        # paths like Bundle_Init(). That gap let a 100%-reproducible startup
        # crash (unassigned A_LocalAppData — not a real AHK v2 built-in) ship
        # through fully-green CI. This step launches the actual compiled exe
        # and proves it gets past first-launch bundle extraction instead of
        # dying on the very first line of the auto-execute section.
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exe = "${{ github.workspace }}\static\ergopti_plus\windows\ErgoptiPlus.exe"
          $markerFile = "$env:LOCALAPPDATA\Ergopti\bundle\.bundle-version"
          Remove-Item "$env:LOCALAPPDATA\Ergopti\bundle" -Recurse -Force -ErrorAction SilentlyContinue
          $stdout = "$env:TEMP\ergopti_smoke_stdout.txt"
          $stderr = "$env:TEMP\ergopti_smoke_stderr.txt"

          # /ErrorStdOut only routes LOAD-time errors (parse / missing include)
          # to stderr; a RUNTIME error like the one this step guards against
          # still pops a blocking MsgBox, so the real signal below is
          # behavioural (marker file written / early exit), not the exit code.
          $proc = Start-Process -FilePath $exe -ArgumentList "/ErrorStdOut" -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          $deadline = (Get-Date).AddSeconds(20)
          $markerSeen = $false
          while ((Get-Date) -lt $deadline) {
              if ($proc.HasExited) { break }
              if (Test-Path $markerFile) { $markerSeen = $true; break }
              Start-Sleep -Milliseconds 250
          }
          $crashedEarly = $proc.HasExited
          $exitCode = $null
          if ($crashedEarly) { $exitCode = $proc.ExitCode }

          # Always clean up — this is a resident tray app with a keyboard hook;
          # never leave it running on the runner regardless of outcome.
          if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

          if ($crashedEarly -or -not $markerSeen) {
              Write-Host "---- stdout ----"; Get-Content $stdout -ErrorAction SilentlyContinue
              Write-Host "---- stderr ----"; Get-Content $stderr -ErrorAction SilentlyContinue
              if ($crashedEarly) {
                  Write-Error "ErgoptiPlus.exe exited during startup (code $exitCode) — see output above."
              } else {
                  Write-Error "ErgoptiPlus.exe did not extract its runtime bundle within 20s — a blocking startup dialog is likely (crash-on-launch)."
              }
              exit 1
          }
          Write-Host "OK: ErgoptiPlus.exe survived startup and extracted its bundle to $markerFile"

      - name: Rename Windows keyboard layout for upload
        shell: bash
        run: |
          set -euo pipefail
          latest_kbd=$(ls static/ergopti/windows/Ergopti_v*.exe | sort -V | tail -1)
          cp "$latest_kbd" static/ergopti/windows/Ergopti_windows.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-windows
          retention-days: 1
          path: |
            static/ergopti_plus/windows/ErgoptiPlus.exe
            static/ergopti/windows/Ergopti_windows.exe

  # ─────────────────────────────────────────────────
  # 6.3) Linux — assemble driver, packages and XKB layouts
  # ─────────────────────────────────────────────────
  # This job does not read resolve-release-meta.outputs.version, unlike
  # build-windows and build-macos. The packagers take their version from
  # package.json, so the .deb "Version:" and the .rpm "Version:" can lag the
  # release tag. Threading the resolved version in is NOT a one-liner and is
  # deliberately not attempted here: on dev the version is 0.0.0-dev.N, and rpm
  # rejects a hyphen in Version:, so the same value that a .deb accepts would
  # abort rpmbuild. What IS handled is the visible half — every published package
  # is renamed below to a name that carries no version at all, so no asset can be
  # misnamed and the website's exact-name lookup keeps working across releases.
  build-linux:
    name: 'Release · Linux build'
    needs: resolve-release-meta
    if: needs.resolve-release-meta.outputs.skip == 'false'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load the Linux release artifact contract
        shell: bash
        run: |
          set -euo pipefail
          asset_name=$(node -p "require('./static/ergopti_plus/_shared/modules/updater/defaults.json').release_assets.linux_bundle")
          if [[ ! "$asset_name" =~ ^[A-Za-z0-9._+-]+\.tar\.gz$ ]]; then
              echo "::error::unsafe Linux bundle asset name: $asset_name"
              exit 1
          fi
          echo "LINUX_BUNDLE_ASSET=$asset_name" >> "$GITHUB_ENV"

      - name: Install LuaJIT (for smoke test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit

      - name: Assemble Linux driver bundle
        shell: bash
        run: bash tools/build/build-linux-driver.sh

      - name: Package latest XKB files
        shell: bash
        run: |
          set -euo pipefail
          latest_dir=$(ls -d static/ergopti/linux/v*_* | sort -V | tail -1)
          dir_name=$(basename "$latest_dir")
          mkdir -p build/linux/xkb
          (cd static/ergopti/linux && zip -r "../../../build/linux/xkb/Ergopti_xkb.zip" "$dir_name")
          echo "Packaged XKB: $dir_name → Ergopti_xkb.zip"

      # A tarball, because the release used to publish install.sh, one wrapper
      # and ONE Lua file — so a user who downloaded it had an installer, no
      # driver and no shared tree, and could not install anything. The daemon
      # resolves _shared as a SIBLING of the driver, so the archive preserves
      # that layout rather than flattening it.
      - name: Package the installable bundle
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "build/linux/$LINUX_BUNDLE_ASSET" -C build/linux linux _shared bin install.sh kanata.kbd
          (cd build/linux && sha256sum "$LINUX_BUNDLE_ASSET" > "$LINUX_BUNDLE_ASSET.sha256")
          (cd build/linux && sha256sum --check "$LINUX_BUNDLE_ASSET.sha256")
          echo "Bundle contents:"
          tar -tzf "build/linux/$LINUX_BUNDLE_ASSET" | sed -n '1,20p'
          bundle_entries=$(tar -tzf "build/linux/$LINUX_BUNDLE_ASSET" | wc -l)
          echo "... $bundle_entries entries"

      - name: Install the packaging toolchains
        # rpmbuild is not on the runner image. appimagetool ships AS an AppImage,
        # and an AppImage mounts itself through FUSE, which the runner does not
        # have — so it is unpacked once and its AppRun is put on PATH instead.
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y rpm
          rpmbuild --version
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/appimagetool" \
              https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          (cd "$RUNNER_TEMP" && ./appimagetool --appimage-extract >/dev/null)
          sudo ln -sf "$RUNNER_TEMP/squashfs-root/AppRun" /usr/local/bin/appimagetool
          test -x /usr/local/bin/appimagetool
          sudo apt-get install -y flatpak flatpak-builder
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 ||
              echo "::notice::no apparmor_restrict_unprivileged_userns knob here — continuing"
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Build the .deb, the .rpm, the AppImage and the Flatpak
        # No --skip-* flag anywhere: those return before dpkg-deb, rpmbuild,
        # appimagetool and flatpak-builder respectively, which is how four
        # packagers stayed unexercised while CI reported them green. The AppImage
        # picks up the luajit installed above and bundles it; the Flatpak
        # compiles its own inside the sandbox.
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build/build-linux-deb.sh
          bash tools/build/build-linux-rpm.sh
          bash tools/build/build-linux-appimage.sh
          bash tools/build/build-linux-flatpak.sh

      - name: Rename the packages to their stable asset names
        # Each packager names its output after the version in package.json, which
        # is not the release tag. A published asset must keep ONE name across
        # releases: the notes are static text and the website resolves its
        # download buttons by exact asset name (getGitHubRelease.js).
        #
        # It also closes a silent-skip hole. build-linux-appimage.sh exits 0 with
        # only the AppDir staged when appimagetool is absent, and the .rpm script
        # does the same without rpmbuild — so demanding the file here is what
        # turns "no package was produced" into a failure instead of a green run
        # with one asset missing.
        shell: bash
        run: |
          set -euo pipefail
          rename_one() {
              local found="$1" target="$2" kind="$3"
              if [ -z "$found" ]; then
                  echo "::error::the $kind packager produced no package — nothing to attach."
                  exit 1
              fi
              mv "$found" "$target"
              echo "  $kind -> $target ($(du -h "$target" | cut -f1))"
          }
          rename_one "$(find build/linux -maxdepth 1 -name '*.flatpak' -type f 2>/dev/null | head -1)" \
              build/linux/ErgoptiPlus-linux-x86_64.flatpak "Flatpak"
          rename_one "$(find build/linux -maxdepth 1 -name '*.deb' -type f 2>/dev/null | head -1)" \
              build/linux/ErgoptiPlus-linux-amd64.deb ".deb"
          rename_one "$(find build/linux/rpm/RPMS -name '*.rpm' -type f 2>/dev/null | head -1)" \
              build/linux/ErgoptiPlus-linux-noarch.rpm ".rpm"
          rename_one "$(find build/linux -maxdepth 1 -name '*.AppImage' -type f 2>/dev/null | head -1)" \
              build/linux/ErgoptiPlus-linux-x86_64.AppImage "AppImage"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-linux
          retention-days: 1
          # kanata.kbd is attached because the release notes have always linked
          # it and nothing ever uploaded it: every published release carried a
          # 404, and the site's Linux button — which looks the asset up by exact
          # name — rendered as href="#".
          path: |
            build/linux/xkb/Ergopti_xkb.zip
            build/linux/${{ env.LINUX_BUNDLE_ASSET }}
            build/linux/${{ env.LINUX_BUNDLE_ASSET }}.sha256
            build/linux/kanata.kbd
            build/linux/ErgoptiPlus-linux-amd64.deb
            build/linux/ErgoptiPlus-linux-noarch.rpm
            build/linux/ErgoptiPlus-linux-x86_64.AppImage
            build/linux/ErgoptiPlus-linux-x86_64.flatpak

  # ============================================================
  # ============================================================
  # ======= 7/ Finalize release — create + upload assets =======
  # ============================================================
  # ============================================================

  finalize-release:
    name: 'Release · finalize'
    needs: [resolve-release-meta, build-macos, build-windows, build-linux]
    if: needs.resolve-release-meta.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT required: GITHUB_TOKEN is blocked by the repo tag
          # creation rule; only a PAT with admin bypass can push tags.
          token: ${{ secrets.PAT_ERGOPTI }}

      - name: Load the Linux release artifact contract
        shell: bash
        run: |
          set -euo pipefail
          asset_name=$(node -p "require('./static/ergopti_plus/_shared/modules/updater/defaults.json').release_assets.linux_bundle")
          if [[ ! "$asset_name" =~ ^[A-Za-z0-9._+-]+\.tar\.gz$ ]]; then
              echo "::error::unsafe Linux bundle asset name: $asset_name"
              exit 1
          fi
          echo "LINUX_BUNDLE_ASSET=$asset_name" >> "$GITHUB_ENV"

      - name: Download all build artifacts
        # Restricted to assets-*: build-deb in section 4 also uploads its .deb,
        # so smoke-deb-install can install and launch it. Without the filter that
        # copy would land here too and be attached to the release as a stray
        # asset nothing in the notes describes.
        uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          path: release-assets
          merge-multiple: true

      - name: Create git tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT_ERGOPTI }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-release-meta.outputs.tag }}"
          sha="${{ github.sha }}"
          gh api repos/${{ github.repository }}/git/refs \
              --method POST \
              --field ref="refs/tags/${tag}" \
              --field sha="${sha}"
          echo "Tag '$tag' created via API."

      - name: Create release and upload all assets atomically
        # The release is created here — after all three build jobs have
        # succeeded — so it is never in a half-baked state.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-release-meta.outputs.tag }}"
          prerelease="${{ needs.resolve-release-meta.outputs.prerelease }}"
          title="${{ needs.resolve-release-meta.outputs.title }}"

          mapfile -t assets < <(find release-assets -type f)
          echo "Assets to attach (${#assets[@]}):"
          printf '  %s\n' "${assets[@]}"

          flags=()
          [ "$prerelease" = "true" ] && flags+=("--prerelease")

          gh release create "$tag" \
              --target "${{ github.sha }}" \
              --title "$title" \
              "${flags[@]}" \
              "${assets[@]}"

      - name: Publish channel feed for Sparkle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT_ERGOPTI }}
          ERGOPTI_CHANNEL: ${{ needs.resolve-release-meta.outputs.prerelease == 'true' && 'dev' || 'main' }}
        run: |
          set -euo pipefail
          feed="release-assets/appcast-${ERGOPTI_CHANNEL}.xml"
          test -s "$feed"
          if ! gh release view sparkle-feed >/dev/null 2>&1; then
              gh release create sparkle-feed \
                  --target "${{ github.sha }}" \
                  --title "Sparkle update feeds" \
                  --notes "Machine-managed channel feeds for the ErgoptiPlus macOS updater." \
                  --prerelease
          fi
          gh release upload sparkle-feed "$feed" --clobber
          published="https://github.com/${{ github.repository }}/releases/download/sparkle-feed/appcast-${ERGOPTI_CHANNEL}.xml"
          curl --fail --silent --show-error --location "$published" > "$RUNNER_TEMP/published-appcast.xml"
          cmp --silent "$feed" "$RUNNER_TEMP/published-appcast.xml"
          echo "Published and verified $published"

      - name: Build changelog section
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ needs.resolve-release-meta.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          # Fetch tags so git-describe can resolve the previous release tag.
          # The tag for the current release was just created via the API and
          # is not yet present in the shallow clone.
          git fetch --tags --quiet
          python3 tools/build/build_changelog.py > "$RUNNER_TEMP/changelog.md"
          echo "Changelog written ($(wc -l < "$RUNNER_TEMP/changelog.md") lines)."

      - name: Write release body with platform sections
        # Body order is deliberate: a jump link to the downloads, then the
        # changelog as high as possible (it is what returning users read),
        # and only then the per-platform download tables and install guides.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-release-meta.outputs.tag }}
          VERSION: ${{ needs.resolve-release-meta.outputs.version }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          cat >> "$body_file" << EOF
          ## Ergopti $VERSION

          **[⬇️ Skip to downloads & installation](#downloads)**
          > Timestamps are in **Paris time** (Europe/Paris, CET/CEST).
          EOF

          if [ -s "$RUNNER_TEMP/changelog.md" ]; then
              {
                echo ""
                if grep -q "^## Changelog" "$RUNNER_TEMP/changelog.md"; then
                  cat "$RUNNER_TEMP/changelog.md"
                else
                  echo "## Changelog"
                  echo ""
                  cat "$RUNNER_TEMP/changelog.md"
                fi
              } >> "$body_file"
          fi

          cat >> "$body_file" << EOF

          ## Downloads

          Select your platform and download the corresponding file.

          ### 🪟 Windows

          | Asset | Description |
          |---|---|
          | [ErgoptiPlus.exe](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ErgoptiPlus.exe) | Compiled AutoHotkey executable (AHK v2 runtime bundled) |
          | [Ergopti_windows.exe](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Ergopti_windows.exe) | Windows keyboard layout installer — no app required |

          **Installation — app:**
          1. Download \`ErgoptiPlus.exe\`.
          2. Double-click to run. On first launch, resources are extracted to \`%LOCALAPPDATA%\Ergopti\`.
          3. Your personal configuration is stored in \`%USERPROFILE%\.config\ergopti_plus\`. If this folder does not exist yet (first launch), the setup wizard will open automatically.

          **Installation — keyboard layout only:**
          1. Download \`Ergopti_windows.exe\` and run it as Administrator.
          2. Log out and back in, then select the layout in Settings → Time & Language → Language & region.

          ---

          ### macOS

          | Asset | Description |
          |---|---|
          | [ErgoptiPlus.app.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ErgoptiPlus.app.zip) | macOS application (Hammerspoon + Karabiner-Elements bundled) |
          | [Ergopti_macOS.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Ergopti_macOS.zip) | Keyboard layout bundle only — no app required |

          **Installation — app:**
          1. Unzip \`ErgoptiPlus.app.zip\` and move \`ErgoptiPlus.app\` to \`/Applications\`.
          2. Remove the quarantine flag (the app is not yet Apple-notarised):
          \`\`\`bash
          xattr -d com.apple.quarantine /Applications/ErgoptiPlus.app
          \`\`\`
          3. Launch the app. On first run, Karabiner-Elements will request a System Extension approval — required for key remapping.
          4. Your personal configuration is stored in \`~/.config/ergopti_plus/\`. If this folder does not exist yet (first launch), the setup wizard will open automatically.

          **Installation — keyboard layout only:**
          1. Unzip \`Ergopti_macOS.zip\`.
          2. Copy the \`.bundle\` folder to \`/Library/Keyboard Layouts/\`.
          3. Log out and back in, then add the layout in System Settings → Keyboard → Input Sources.

