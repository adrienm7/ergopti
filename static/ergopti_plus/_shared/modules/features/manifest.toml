# ============================
# ===== 3.3.3 llm.models =====
# ============================

[[features.llm.models]]
id = "selected"
# Linux has one backend and it is Ollama — see the MLX restriction below, which
# is the same fact stated from the other side. Declaring the default here rather
# than letting the driver pick one is what keeps the menu tick and the request
# payload agreeing about which backend is in use.
default_per_platform = { ahk = "ollama", hs = "mlx", linux = "ollama" }
type = "string"
description_key = "menu.llm.models.selected"

[[features.llm.models]]
id = "ollama"
default_per_platform = { ahk = "Qwen3.5-0.8B", hs = "gemma-4-E2B-it", linux = "Qwen3.5-0.8B" }
type = "string"
description_key = "menu.llm.models.ollama"

[[features.llm.models]]
id = "mlx"
default = "Qwen3.5-2B"
type = "string"
description_key = "menu.llm.models.mlx"
platforms = ["hs"]
# Deuxième raison écrite (2026-08-04), même forme que la première : elle dit ce
# que la plateforme ne peut pas faire. MLX est le moteur d'inférence local
# d'Apple, bâti sur Metal et la mémoire unifiée d'Apple Silicon ; il n'en existe
# pas de version Windows ni Linux, donc la restriction ne dépend d'aucun travail
# à faire ici. C'est le critère : une raison ne s'écrit que quand elle reste
# vraie même si tout le reste était codé.
reason_key = "platform_reason.llm_mlx_is_apple_silicon"



