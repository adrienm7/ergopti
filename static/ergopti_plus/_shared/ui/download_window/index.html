<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<title data-i18n="download_window.window_title"></title>
		<script src="../a11y_prefs.js"></script>
		<script src="../page_locale.js"></script>
		<link rel="stylesheet" href="../theme.css" />
		<script src="../theme_tokens.js"></script>
		<link rel="stylesheet" href="style.css" />
		<script src="../i18n.js"></script>
		<script src="../host_bridge.js"></script>
	</head>
	<body>
		<main id="ui-controls">
			<header class="header-group">
				<h1 id="title" data-i18n="download_window.title"></h1>
				<p id="model">—</p>
				<p id="subtitle"></p>
			</header>

			<div class="progress-group">
				<p id="status-line">
					<output id="pct">0 %</output>
					<strong id="done-msg" role="status"></strong>
					<output id="file-count" style="display: none"></output>
				</p>

				<progress id="bar-fill" max="100" value="0" aria-labelledby="title"></progress>

				<ul id="stats">
					<li id="stats-details" style="display: none"></li>
					<li id="eta-container" style="display: none">
						<span data-i18n="download_window.eta_label"></span> <b id="eta"></b>
					</li>
					<li id="stats-fallback" data-i18n="download_window.starting"></li>
				</ul>
			</div>

			<div id="bootstrap-group">
				<p id="step-line" data-i18n="download_window.preparing" aria-live="polite"></p>
				<p id="detail-line"></p>
				<progress
					id="bootstrap-bar-fill"
					max="100"
					value="0"
					aria-labelledby="step-line"
				></progress>
			</div>

			<footer class="btn-row">
				<button
					id="btn-cancel"
					onclick="doCancel()"
					data-i18n="download_window.btn_cancel"
				></button>
				<button id="btn-term" onclick="doTerm()" data-i18n="download_window.btn_terminal"></button>
				<button
					id="btn-retry"
					onclick="doRetry()"
					style="display: none"
					data-i18n="download_window.btn_retry"
				></button>
			</footer>
		</main>

		<!-- Scroll box: a keyboard stop, so the keyboard scrolls it (WCAG 2.1.1). -->
		<pre id="log-area" tabindex="0" aria-labelledby="btn-term"></pre>

		<script src="script.js"></script>
		<script src="network_failure.js"></script>
	</body>
</html>
