name: Lint hotstring TOML files

on:
    push:
        branches: [dev, main]
        paths:
            - "static/hotstrings/*.toml"
            - "tools/format_toml.py"
            - ".github/workflows/lint_hotstrings.yml"
    pull_request:
        branches: [dev, main]
        paths:
            - "static/hotstrings/*.toml"
            - "tools/format_toml.py"
            - ".github/workflows/lint_hotstrings.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: lint-hotstrings-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Check hotstring TOML files are sorted and formatted
              # Exits 1 if any file differs from its sorted/formatted form.
              # Fix locally with: python tools/format_toml.py --hotstrings --all
              run: python tools/format_toml.py --hotstrings --all --check
