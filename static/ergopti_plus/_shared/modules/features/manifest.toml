# ======================
# ===== 3.1 script =====
# ======================

[[features.script]]
id = "locale"
default = "fr"
recommended = "fr"
input_altering = false
type = "string"
description_key = "menu.script.locale"

[[features.script]]
id = "log_level"
default = "INFO"
recommended = "INFO"
input_altering = false
type = "enum"
enum_values = ["DEBUG", "TRACE", "DONE", "INFO", "START", "SUCCESS", "WARNING", "ERROR"]
description_key = "menu.script.log_level"

# Whether a logged ERROR may open the error window (_shared/ui/error_dialog/),
# ticked from the Debug menu. On by default: an error nobody sees is an error
# nobody reports. _shared/modules/diagnostics/error_policy.json still decides
# which errors do, and how often.
[[features.script]]
id = "show_error_dialog"
default = true
recommended = true
input_altering = false
type = "boolean"
description_key = "menu.debug.show_error_dialog"

[[features.script]]
id = "alt_gr_is_kana_remap"
default = false
recommended = "auto"
input_altering = true
type = "enum"
enum_values = ["auto", true, false]
description_key = "menu.script.alt_gr_is_kana_remap"
platforms = ["ahk"]
# Première raison écrite (2026-08-03), et elle sert de modèle : elle dit ce que
# la plateforme ne peut pas faire, pas ce qui n'a pas été codé. Le réglage
# compense les dispositions Windows personnalisées (KbdEdit/MSKLC) qui
# réassignent AltGr à une autre touche virtuelle — une notion de pilote clavier
# Windows (HKL, MapVirtualKeyExW, VK_RMENU) sans équivalent ailleurs.
reason_key = "platform_reason.alt_gr_is_kana_remap"



