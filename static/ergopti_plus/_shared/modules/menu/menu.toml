# macOS switches the feature, not its remap engine: off stops generating the
# per-key rules while keeping every assignment, like a pause. The engine has
# its own switch, « Ergopti uses Karabiner » (on by default); while it is off
# the key and chord rows are greyed under the karabiner_off_hint row.
# Linux takes the engine out of its keyboard hook, keeping every assignment.

# The Tap-Holds scope's restore and clear, right after its switch (the first
# group). Each driver registers both on its scope owner, which backs up the
# tap-hold file with config.toml and publishes them in one transaction. They
# sat after a separator as `reset_defaults` and `disable_all` until 2026-09-30.
# `command` since 2026-08-07, not `action`: both were handlers whose whole body
# was "add a button, and log that the action just happened" at MENU BUILD time.
[[menu.tap_holds_menu]]
