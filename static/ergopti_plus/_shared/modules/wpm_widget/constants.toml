# _shared/modules/wpm_widget/constants.toml

# ==============================================================================
# SCHEMA: WPM Widget Visual Constants — Cross-Driver Canon
# DESCRIPTION:
# Single source of truth for how the Ergopti+ typing-speed readouts look on
# every driver: the floating pill, its real-time graph mode, and the menu bar
# (macOS) or tray (Linux) readout. Windows has no menu bar readout.
#
# EVERY DRIVER READS THIS FILE AT RUNTIME. No driver restates a value from it:
#   Hammerspoon — ui/wpm/*.lua through the shared _shared/lua/wpm_widget model.
#   Linux       — ui/wpm/*.lua through the same shared model.
#   AutoHotkey  — ui/wpm/wpm_config.ahk, which refuses to draw when a key is
#                 missing rather than falling back to a copied literal.
# Tests on each driver fail when a key is read nowhere or restated in code.
#
# Timings (refresh rates, idle hide, colour hold) live in
# _shared/modules/timings/constants.toml [ui] and [keylogger].
#
# COLOR FORMAT:
#   Colors are "#RRGGBB" hex strings. Alphas are 0.0-1.0 unless the key name
#   says otherwise (the [transparency] alphas are 0-255, as Windows applies them).
# ==============================================================================


# ======================================
# ======================================
# ======= 1/ Compact mode layout =======
# ======================================
# ======================================

[compact]

# Pill width in logical pixels.
width = 80

# Total pill height in logical pixels: height_number + height_gap + height_unit.
height = 68

# Height of the upper zone that holds the WPM number.
height_number = 44

# Vertical gap between the number zone and the unit strip.
height_gap = 4

# Height of the lower strip that holds the unit label (MPM / WPM …).
height_unit = 20

# Font size of the WPM number, in points.
number_font_size = 20

# Font size of the unit label, in points.
unit_font_size = 8

# How much of each RGB channel the unit strip keeps relative to the pill
# background (strip = background × factor, rounded half up; 0.40 = 60 % darker).
unit_strip_darken_factor = 0.40

# Corner radius of the pill, in logical pixels.
corner_radius = 10

# Opacity of the number and of the unit label.
number_text_alpha = 1.0
unit_text_alpha = 0.9

# Distance from the screen's bottom-right corner to the pill's default place.
edge_margin = 5


# ======================================
# ======================================
# ======= 2/ Graph mode layout =========
# ======================================
# ======================================

[graph]

# Graph panel size, in logical pixels. Its bottom-right corner stays on the
# pill's, so switching mode never moves the readout away from where the user
# put it.
width = 216
height = 72

# Corner radius and inner padding of the panel.
corner_radius = 10
padding = 5

# Samples kept for the curve: one per widget refresh (timings
# [ui] wpm_widget_update_ms), so 60 × 200 ms = the last 12 s.
history_samples = 60

# The WPM at the top of the curve. Fixed so the curve's height means the same
# speed from one moment to the next.
scale_max = 120

# Panel background and border.
background = "#000000"
background_alpha = 0.8
border = "#ffffff"
border_alpha = 0.4
border_width = 1

# The curve: a line in the source colour over a translucent fill.
line_width = 2
line_alpha = 0.8
fill_alpha = 0.2

# "123 MPM" above the curve.
text_color = "#ffffff"
text_size = 14


# ======================================
# ======================================
# ======= 3/ Menu bar / tray readout ===
# ======================================
# ======================================

[menubar]

# Font size of the "123 MPM" readout, in points.
font_size = 13

# Opacity of the source-coloured background behind the readout.
background_alpha = 0.5

# Text colour of the readout.
text_color = "#ffffff"

# Background of the readout when no source colours it (Linux tray icon only:
# a tray icon has no menu bar to sit on, so it always needs a fill).
neutral_background = "#333344"


# =========================
# =========================
# ======= 4/ Colors =======
# =========================
# =========================

[colors]

# Background for manual keystrokes, and for every source that must not colour
# the widget (see [neutral_sources]).
bg_manual = "#0055cc"

# Background for AI-generated text.
bg_ai = "#7a30b0"

# Near-black used when the widget is idle.
bg_idle = "#1a1a2e"

# Active text color (white).
text_active = "#ffffff"

# Idle / dimmed text color.
text_idle = "#555577"

# A hotstring group with no usable colour of its own.
fallback_accent = "#007aff"


# ==================================
# ==================================
# ======= 5/ Neutral sources =======
# ==================================
# ==================================

# Sources that never colour the widget: they are not hotstring groups with a
# colour of their own, or are ergonomic substitutions that should read as the
# user's own typing. Every other source name is a hotstring group whose TOML
# _meta.color (plus any user override) colours the widget; "llm" uses bg_ai.
[neutral_sources]
none = true
manual = true
hotstring = true
repeat_key = true
rolls = true


# ===============================
# ===============================
# ======= 6/ Transparency =======
# ===============================
# ===============================

[transparency]

# Opacity of the pill when the widget is active (0-255).
alpha_active = 220

# Opacity of the pill when it is idle (0-255).
alpha_idle = 140
