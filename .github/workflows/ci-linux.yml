      - name: Launch the bounded accessibility helper with Lua interpreter options
        if: ${{ !cancelled() && matrix.shard == 'desktop-webview' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          python3 tests/hardware/run_atspi_interpreter_receipts.py
          else
              exit 1
          fi
        timeout-minutes: 1

      # The program a user starts, started: the real daemon with --tray on a
      # keyboard created through uinput, under an X server, a session bus, the
      # accessibility bus, a window manager and a focused GTK field (nothing
      # expands without the privacy gate's answer). A trigger typed on that
      # keyboard must reach the desktop expanded, through the grab and the
      # daemon's own virtual keyboard, while sni_host.py checks the tray it shows:
      # the logo, and a translated menu with no raw i18n key.
      - name: The whole daemon, live — a trigger typed, a tray shown
        if: ${{ !cancelled() && matrix.shard == 'desktop-webview' }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          sudo modprobe uinput
          # lua-luv as install.sh installs it: the daemon's timers and every
          # HTTP request (the AI phase) run on it.
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends at-spi2-core openbox python3-gi gir1.2-gtk-3.0 \
            dbus-x11 xvfb x11-xkb-utils libayatana-appindicator3-1 lua-luv xclip
          sudo env \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_REF="$GITHUB_REF" \
            GITHUB_SHA="$GITHUB_SHA" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            ERGOPTI_DEV_RELEASE_RELEASE="$ERGOPTI_DEV_RELEASE_RELEASE" \
            ERGOPTI_DEV_RELEASE_PRERELEASE="$ERGOPTI_DEV_RELEASE_PRERELEASE" \
            ERGOPTI_DEV_RELEASE_CHANNEL="$ERGOPTI_DEV_RELEASE_CHANNEL" \
            ERGOPTI_DEV_RELEASE_TAG="$ERGOPTI_DEV_RELEASE_TAG" \
            ERGOPTI_DEV_RELEASE_VERSION="$ERGOPTI_DEV_RELEASE_VERSION" \
            bash static/ergopti_plus/linux/tests/hardware/run_daemon_live.sh
          else
              exit 1
          fi
        timeout-minutes: 6

      - name: Install prerequisites for Update to the newest release and restart
        if: ${{ !cancelled() && matrix.shard == 'updater' }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends lua-luv
          else
              exit 1
          fi
        timeout-minutes: 20

      # The updater a user runs, run: this tree built as an old release and
      # installed with its own install.sh, then its updater finds the newest
      # published release on GitHub, verifies and installs it, and restarts the
      # daemon on it. An installed prerelease once asked the "stable" channel
      # and never found an update; an installed update once waited for the
      # next login.
      - name: Update to the newest release and restart
        if: ${{ !cancelled() && matrix.shard == 'updater' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ERGOPTI_UPDATER_LIVE_EVIDENCE_DIR: ${{ runner.temp }}/linux-updater-live
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          bash static/ergopti_plus/linux/tests/hardware/run_updater_live.sh
          else
              exit 1
          fi
        timeout-minutes: 10

      # A refused release check is diagnostic evidence, never a passed E2E
      # receipt. Keep its actual response and owner verdict after a failure.
      - name: Upload live updater diagnostic evidence
        if: ${{ !cancelled() && matrix.shard == 'updater' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-updater-live-diagnostics
          overwrite: true
          retention-days: 7
          path: |
            ${{ runner.temp }}/linux-updater-live
            ${{ runner.temp }}/stable-linux-e2e-suite.json
          if-no-files-found: error

      - name: Install prerequisites for Qualify native HTTP streaming receipts
        if: ${{ !cancelled() && matrix.shard == 'network-ai' }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends curl lua-luv
          else
              exit 1
          fi
        timeout-minutes: 20

      # This loopback fixture uses the actual libuv/curl adapter, including a
      # model removed between tags and chat, bounded complete receipts and
      # cancellation settlement. No external model download is needed.
      - name: Qualify native HTTP streaming receipts
        if: ${{ !cancelled() && matrix.shard == 'network-ai' }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          set -euo pipefail
          npm run test:linux:http-stream | tee "$RUNNER_TEMP/linux-http-stream.log"
          else
              exit 1
          fi
        timeout-minutes: 3

      - name: Install prerequisites for Qualify native managed network runtime
        if: ${{ !cancelled() && matrix.shard == 'network-ai' }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
