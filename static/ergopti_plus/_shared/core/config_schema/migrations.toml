[steps.v15_to_v16]
from = 15
to = 16
drivers = ["ahk", "hs", "linux"]
reason = "A dynamic-hotstring family switch stored as a bare boolean (`date = true`, which macOS wrote until this version) becomes the feature row the manifest declares (`[hotstrings.dynamic.date] enabled = true`), so every driver and the read-only view read it."
# Every dynamic-hotstring entry the manifest keeps as a feature row. A row
# already stored as a table is left as it is, so a replay changes nothing.
ops = [
	{ op = "wrap_value", section = "hotstrings.dynamic", key = "date", to_key = "enabled" },
	{ op = "wrap_value", section = "hotstrings.dynamic", key = "date_fr", to_key = "enabled" },
	{ op = "wrap_value", section = "hotstrings.dynamic", key = "date_long_fr", to_key = "enabled" },
	{ op = "wrap_value", section = "hotstrings.dynamic", key = "iban_prefixes", to_key = "enabled" },
	{ op = "wrap_value", section = "hotstrings.dynamic", key = "phone_prefixes", to_key = "enabled" },
	{ op = "wrap_value", section = "hotstrings.dynamic", key = "ssn_prefixes", to_key = "enabled" },
	{ op = "wrap_value", section = "hotstrings.dynamic", key = "user_code", to_key = "enabled" },
	{ op = "wrap_value", section = "hotstrings.dynamic", key = "text_expansion_personal_information", to_key = "enabled" },
]

[steps.v16_to_v17]
from = 16
to = 17
drivers = ["hs"]
reason = "The prompt profiles macOS kept as an array at [llm.profiles] user_profiles move to llm.user_profiles, the encoded envelope every OS reads. Only macOS ever wrote that array. A file that already holds the envelope keeps it, and the array stays for the cleanup to offer."
ops = [
	{ op = "encode_value", section = "llm.profiles", key = "user_profiles", to_section = "llm", to_key = "user_profiles", encoding = "user_profile_registry" },
]

[steps.v17_to_v18]
from = 17
to = 18
drivers = ["ahk"]
reason = "Windows keyboard slots are named by modifier role (primary_b, primary_shift_v, meta_a, meta_space) like macOS and Linux since v15: every saved binding keeps its action."
# One rename per ordinary slot, so a target already there keeps its value (a
# file copied from Linux can hold meta_space next to win_space). The physical
# Win slots (win_SC03A, any letter case) are the one open-ended family, so a
# prefix carries them. Each parameter key follows its slot: keyboard__ctrl_
# also carries keyboard__ctrl_shift_ to keyboard__primary_shift_. A hand-written
# key no slot owns (ctrl_f1) stays for the configuration cleanup.
ops = [
	{ op = "rename_prefix", section = "action_parameters", prefix = "keyboard__ctrl_", to_prefix = "keyboard__primary_" },
	{ op = "rename_prefix", section = "action_parameters", prefix = "keyboard__win_", to_prefix = "keyboard__meta_" },
