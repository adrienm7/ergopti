<!-- _shared/ui/changelog/index.html -->
<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com; img-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
		/>
		<title data-i18n="changelog_window.window_title"></title>
		<script src="../a11y_prefs.js"></script>
		<link rel="stylesheet" href="../theme.css" />
		<script src="../theme_tokens.js"></script>
		<link rel="stylesheet" href="style.css" />
		<script src="../i18n.js"></script>
		<script src="../host_bridge.js"></script>
		<script src="../markdown.js"></script>
		<script src="../_generated/identifiers.js"></script>
		<script src="../repository_links.js"></script>
		<script src="atom_feed.js"></script>
		<script src="release_body.js"></script>
		<script src="../_generated/update_channel_registry.js"></script>
		<script src="../update_channels.js"></script>
		<script src="../version_order.js"></script>
	</head>
	<body>
		<h1 class="theme-sr-only" id="changelog-title" data-i18n="changelog_window.window_title"></h1>
		<nav id="sidebar" aria-labelledby="changelog-title">
			<header id="sidebar-header">
				<p id="channel-toggle"></p>
			</header>
			<ul id="release-list"></ul>
		</nav>

		<main id="content">
			<section id="restore-banner" style="display: none">
				<p id="restore-text"></p>
				<button id="btn-restore" type="button"></button>
			</section>
			<section id="subscribe-banner" style="display: none">
				<p id="subscribe-text"></p>
				<button id="btn-subscribe"></button>
				<section id="subscribe-confirm" style="display: none">
					<p id="subscribe-confirm-text"></p>
					<button id="btn-subscribe-confirm"></button>
					<button id="btn-subscribe-cancel"></button>
				</section>
			</section>
			<header id="content-header">
				<h2 id="release-tag"></h2>
				<p id="release-meta"></p>
				<button id="btn-install" type="button"></button>
				<button id="btn-github"></button>
			</header>
			<p id="install-note" style="display: none"></p>
			<section id="install-panel" style="display: none">
				<p id="install-text" aria-live="polite"></p>
				<button id="btn-install-retry" type="button"></button>
				<button id="btn-install-restart" type="button" style="display: none"></button>
				<p id="install-failure-actions" style="display: none"></p>
			</section>
			<article id="release-body"></article>
		</main>

		<section id="loading-overlay">
			<progress id="loading-spinner" aria-labelledby="loading-text"></progress>
			<p id="loading-text" role="status" data-i18n="changelog_window.loading"></p>
		</section>

		<section id="error-overlay" style="display: none">
			<p id="error-icon" aria-hidden="true">⚠️</p>
			<p id="error-text" role="alert"></p>
			<p id="error-actions">
				<button id="btn-retry"></button>
				<button id="btn-releases-page"></button>
			</p>
		</section>

		<script src="script.js"></script>
	</body>
</html>
