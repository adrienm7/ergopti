name: Build Ergopti.app (macOS)

# Triggers on every push that may affect the macOS bundle. Phase 3 will swap
# this for a release-please-driven workflow that publishes the artefact to a
# GitHub Release; for now the build runs on every push and uploads the .zip
# as a workflow artefact so we can download and smoke-test on a real Mac.
on:
    push:
        branches: ["main", "dev"]
        paths:
            - "static/drivers/hammerspoon/**"
            - "static/drivers/_shared/**"
            - "static/hotstrings/**"
            - "static/locales/**"
            - "static/menu_manifest.json"
            - "tools/build_macos_app.sh"
            - ".github/workflows/compile_hs.yml"
    workflow_dispatch:

concurrency:
    group: build-macos-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        if: ${{ github.actor != 'github-actions[bot]' }}
        runs-on: macos-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Resolve version + channel
              id: meta
              shell: bash
              run: |
                  set -euo pipefail
                  # Channel = branch name (main or dev). Tag pushes will pick
                  # up "main" too, which matches the release-please workflow
                  # planned for Phase 3.
                  channel="${GITHUB_REF_NAME:-dev}"
                  short_sha="$(git rev-parse --short HEAD)"
                  # Local build version: 0.0.0-<channel>.<short_sha>. Replaced
                  # by release-please semver in Phase 3.
                  version="0.0.0-${channel}.${short_sha}"
                  build_num="${GITHUB_RUN_NUMBER:-1}"
                  echo "channel=$channel"   >> "$GITHUB_OUTPUT"
                  echo "version=$version"   >> "$GITHUB_OUTPUT"
                  echo "build=$build_num"   >> "$GITHUB_OUTPUT"
                  echo "Channel : $channel"
                  echo "Version : $version"
                  echo "Build   : $build_num"

            - name: Build Ergopti.app
              shell: bash
              env:
                  ERGOPTI_VERSION: ${{ steps.meta.outputs.version }}
                  ERGOPTI_BUILD:   ${{ steps.meta.outputs.build }}
                  ERGOPTI_CHANNEL: ${{ steps.meta.outputs.channel }}
                  # Sparkle public key. Empty for early Phase 2 builds; CI
                  # injects the real value via the SPARKLE_PUBLIC_KEY secret
                  # once Phase 3 wires release-please + signing.
                  SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
                  GH_OWNER: ${{ github.repository_owner }}
                  GH_REPO:  ${{ github.event.repository.name }}
              run: bash tools/build_macos_app.sh

            - name: Sign zip with Sparkle (if private key configured)
              # The signed .ed25519 payload goes into the appcast.xml
              # <enclosure>. When the SPARKLE_ED_PRIVATE_KEY secret is not
              # configured we just upload the unsigned zip so smoke tests on
              # a Mac still work.
              if: ${{ env.SPARKLE_ED_PRIVATE_KEY != '' }}
              shell: bash
              env:
                  SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
              run: |
                  set -euo pipefail
                  brew install sparkle
                  SIGN_TOOL="$(brew --prefix sparkle)/bin/sign_update"
                  [ -x "$SIGN_TOOL" ] || SIGN_TOOL="$(command -v sign_update)"
                  printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > /tmp/sparkle_priv.key
                  "$SIGN_TOOL" -f /tmp/sparkle_priv.key build/macos/Ergopti.app.zip \
                      > build/macos/Ergopti.app.zip.sig
                  rm -f /tmp/sparkle_priv.key
                  echo "Sparkle signature written to Ergopti.app.zip.sig"

            - name: Upload artefacts
              uses: actions/upload-artifact@v4
              with:
                  name: Ergopti-macos-${{ steps.meta.outputs.channel }}-${{ steps.meta.outputs.version }}
                  path: |
                      build/macos/Ergopti.app.zip
                      build/macos/Ergopti.app.zip.sig
                  retention-days: 14
                  if-no-files-found: error
