# .github/ISSUE_TEMPLATE/feature_request.yml
#
# The form ErgoptiPlus opens from Debug > Suggest a feature, with the fields of
# static/ergopti_plus/_shared/modules/diagnostics/issue_templates.json
# prefilled by their `id` (pinned by tools/test/test-issue-templates.cjs).

name: Feature request
description: Suggest an idea or an improvement. / Proposer une idée ou une amélioration.
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it make easier?
      description: The situation or the problem behind the idea. / La situation ou le problème à l'origine de l'idée.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your proposal
      description: How you would like ErgoptiPlus to behave. / Comment vous aimeriez qu'ErgoptiPlus se comporte.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ErgoptiPlus version
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: false
  - type: input
    id: driver
    attributes:
      label: Driver
      description: macos, windows or linux.
    validations:
      required: false
