# ==========================================
# ===== 3.5.7 shortcuts.script_control =====
# ==========================================

# The script-management chords start with their preset in an empty
# configuration: the maintainer's decision of 2026-09-30, because they pause,
# reload, quit and edit the driver and are no typing feature. The same four
# slots on the three drivers (the maintainer's decision of 2026-09-30, « On met
# tout en commun sur les 3 OS »): AltGr on Windows and Linux, the right Option
# key on macOS, with Enter, Backspace, Delete (fn+Delete on a Mac keyboard
# without the key) or Escape. _shared/modules/actions/script_chords.json names
# each slot's key on every driver and the actions a paused driver still runs. They are the declared exception to "every input-altering
# feature is off by default" (active_by_default); a config.toml that names
# "none" for a slot keeps it off, which is what every clear writes (cleared).
#
# chords_enabled is the switch at the head of their submenu: off leaves every
# chord to the system while the slots keep their actions. Like the
# key-combinations switch it only narrows what the slots enable, so it is a
# parameter and starts on. It replaced the macOS-only `enabled` in config
# schema v7 (migrations.toml), as the four slots replaced its return_key,
# backspace and escape.
[[features.shortcuts.script_control]]
id = "chords_enabled"
platforms = ["ahk", "hs", "linux"]
default = true
recommended = true
input_altering = false
type = "boolean"
description_key = "menu.shortcuts.script_shortcuts_enable"

