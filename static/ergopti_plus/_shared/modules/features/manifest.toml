# ========================
# ===== 3.6 gestures =====
# ========================

# The action defaults below are Ergopti's recommended gesture bindings, per
# platform. A fresh config starts from them, and macOS (DEFAULT_GESTURES) and
# Windows (GESTURE_FACTORY_DEFAULTS) build what « Restaurer les valeurs
# conseillées » writes from them rather than from a copy of their own;
# test-gesture-defaults-single-source.cjs holds both drivers to this list.
# Recommendation rule (maintainer decision, 2026-10-24): recommend nothing the
# system already does with that gesture, unless the driver takes the system's
# own assignment over itself. Every slot stays reassignable on every OS, and the
# Gestures menu says to remove the system assignment first to avoid a double
# action (menu.gestures.recommended_note).
# - Linux: the touchpad is read without being grabbed, so GNOME, KWin, Hyprland
#   and cosmic-comp also act on a three- or four-finger swipe; those eight slots
#   are recommended "none" (menu.gestures.recommended_reason_linux). The taps
#   have no desktop default and keep their binding.
# - macOS: the three-finger tap is the system's « Look up & data detectors »
#   (on by default), yet tap_3 stays recommended "left_click_toggle", as on
#   Windows and Linux, by the maintainer's choice (2026-10-28); the menu's info
#   dialog says to turn Look up off first (menu.gestures.recommended_reason_macos).
#   The three-finger swipes are off in a default macOS install, and the
#   four-finger swipes already recommend "none".
# - Windows: every slot is a system gesture, but the driver writes the touchpad
#   registry itself (modules/gestures/touchpad_registry.ahk, backed up first),
#   so Windows runs only Ergopti's action: no double action, the recommendation
#   stays.
