# _shared/tests/fixtures/test_config.toml
# Fixture config used by test:manifest-equivalence to verify that the AHK and
# HS drivers resolve identical feature values from the same TOML input.
#
# Intentional deviations from manifest defaults are used to exercise the
# override logic — these are not valid user settings, only test inputs.

