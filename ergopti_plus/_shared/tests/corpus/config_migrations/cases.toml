# _shared/tests/corpus/config_migrations/cases.toml
# Index of the config.toml migration corpus, replayed by the Windows, macOS and
# Linux interpreters and by tools/test/test-config-migrations.cjs.
#
# Every case is a directory holding:
#   case.toml        [case] description, drivers (the interpreters that replay
#                    it), outcome ("migrated" | "current" | "newer" |
#                    "invalid" | "unsupported"), and for "migrated" the
#                    from_version and to_version the migration crosses;
#   input.toml       the config.toml a driver finds at boot;
#   expected.toml    the migrated file, for outcome "migrated" only;
#   migrations.toml  optional: a registry replacing the shipped one, so every
#                    op of the closed set is exercised on its own.
# The JS gate fails when this list and the case directories differ.

[corpus]
cases = [
	"joint_variant_neutral_current",
	"joint_variant_neutral_conflict",
	"joint_variant_neutral_occupied",
	"joint_variant_absent",
