[steps.v5_to_v6]
from = 5
to = 6
drivers = ["hs"]
reason = "macOS keeps one app or window switching action per target and scope: its duplicates map to the action that does the same thing."
# One map_value per key that holds an action id: every single gesture slot of
# _shared/modules/actions/actions.toml [slots], the three number-row tap keys
# and the three script-control keys. app_switcher and alt_tab_apps were a
# posted Cmd+Tab and the Alt+F17 hotkey for app_previous; app_window_previous,
# win_next and the F17 cycle_windows_in_app all went to the next window of the
# active application, win_prev to the previous one. Keyboard slots
# ([shortcuts.keyboard], 200 possible keys) are not listed: each op is parsed
# on every boot of every driver, and those keys would multiply the registry
# by six. A slot still naming a removed action is reported as outdated.
# tools/test/test-app-switch-labels.cjs pins this list to the slot space.
ops = [
	{ op = "map_value", section = "gestures", key = "tap_2", map = [{ from = "app_switcher", to = "app_previous" }, { from = "alt_tab_apps", to = "app_previous" }, { from = "app_window_previous", to = "win_app_next" }, { from = "cycle_windows_in_app", to = "win_app_next" }, { from = "win_prev", to = "win_app_prev" }, { from = "win_next", to = "win_app_next" }] },
	{ op = "map_value", section = "gestures", key = "tap_3", map = [{ from = "app_switcher", to = "app_previous" }, { from = "alt_tab_apps", to = "app_previous" }, { from = "app_window_previous", to = "win_app_next" }, { from = "cycle_windows_in_app", to = "win_app_next" }, { from = "win_prev", to = "win_app_prev" }, { from = "win_next", to = "win_app_next" }] },
	{ op = "map_value", section = "gestures", key = "tap_4", map = [{ from = "app_switcher", to = "app_previous" }, { from = "alt_tab_apps", to = "app_previous" }, { from = "app_window_previous", to = "win_app_next" }, { from = "cycle_windows_in_app", to = "win_app_next" }, { from = "win_prev", to = "win_app_prev" }, { from = "win_next", to = "win_app_next" }] },
	{ op = "map_value", section = "gestures", key = "tap_5", map = [{ from = "app_switcher", to = "app_previous" }, { from = "alt_tab_apps", to = "app_previous" }, { from = "app_window_previous", to = "win_app_next" }, { from = "cycle_windows_in_app", to = "win_app_next" }, { from = "win_prev", to = "win_app_prev" }, { from = "win_next", to = "win_app_next" }] },
	{ op = "map_value", section = "gestures", key = "swipe_2_left", map = [{ from = "app_switcher", to = "app_previous" }, { from = "alt_tab_apps", to = "app_previous" }, { from = "app_window_previous", to = "win_app_next" }, { from = "cycle_windows_in_app", to = "win_app_next" }, { from = "win_prev", to = "win_app_prev" }, { from = "win_next", to = "win_app_next" }] },
