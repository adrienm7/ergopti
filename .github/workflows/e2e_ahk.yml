name: E2E AHK

on:
    push:
        branches: [main, dev]
        paths:
            - "static/drivers/autohotkey/**"
            - "static/drivers/_shared/tests/corpus/hotstrings/**"
            - ".github/workflows/e2e_ahk.yml"
    pull_request:
        branches: [main, dev]
        paths:
            - "static/drivers/autohotkey/**"
            - "static/drivers/_shared/tests/corpus/hotstrings/**"
            - ".github/workflows/e2e_ahk.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: e2e-ahk-${{ github.ref }}
    cancel-in-progress: true

jobs:
    e2e:
        runs-on: windows-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Cache AutoHotkey runtime
              id: cache-ahk
              uses: actions/cache@v4
              with:
                  path: C:\AutoHotkey
                  key: ahk-v2.0.19-windows

            - name: Download AutoHotkey v2 runtime
              if: steps.cache-ahk.outputs.cache-hit != 'true'
              run: |
                  Invoke-WebRequest `
                      -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip" `
                      -OutFile "$env:TEMP\AHK.zip" `
                      -UseBasicParsing
                  Expand-Archive -Path "$env:TEMP\AHK.zip" -DestinationPath "C:\AutoHotkey" -Force
              shell: pwsh

            - name: Verify AHK source encoding (UTF-8 BOM + CRLF)
              # AHK v2 silently aborts mid-file when encoding is wrong; check
              # the new E2E file before running it to catch encoding regressions.
              run: |
                  $file = "${{ github.workspace }}\static\drivers\autohotkey\tests\e2e\run_e2e.ahk"
                  $bytes = [System.IO.File]::ReadAllBytes($file)
                  if ($bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
                      Write-Error "run_e2e.ahk is missing UTF-8 BOM."
                      exit 1
                  }
                  $content = [System.IO.File]::ReadAllText($file, [System.Text.Encoding]::UTF8)
                  if (($content -replace "`r`n", "") -match "`n") {
                      Write-Error "run_e2e.ahk contains bare LF line endings (must be CRLF)."
                      exit 1
                  }
                  Write-Host "Encoding OK: UTF-8 BOM + CRLF."
              shell: pwsh

            - name: Build features manifest
              # run_e2e.ahk includes the production lib chain which references
              # _generated/features_manifest.ahk; build it first.
              run: |
                  npm ci
                  node ./scripts/build-features-manifest.js
              shell: pwsh

            - name: Run E2E suite (Strategy A — pure engine injection)
              # Strategy A: headless, no real window needed. The suite feeds
              # characters into HSE_FeedChar and asserts via _Stub_RecordedSends.
              # Exit code 0 = all pass, 1 = at least one failure.
              run: |
                  $ahk = Get-ChildItem "C:\AutoHotkey" -Filter "AutoHotkey64.exe" |
                      Select-Object -First 1 -ExpandProperty FullName
                  if (-not $ahk) {
                      Write-Error "AutoHotkey64.exe not found in C:\AutoHotkey"
                      exit 2
                  }
                  $runner = "${{ github.workspace }}\static\drivers\autohotkey\tests\e2e\run_e2e.ahk"
                  Write-Host "AHK runtime : $ahk"
                  Write-Host "E2E runner  : $runner"
                  Write-Host "------------------------------------------------------------"
                  $output = & cmd /c "`"$ahk`" `"$runner`" 2>&1"
                  $exit = $LASTEXITCODE
                  $output | ForEach-Object { Write-Host $_ }
                  Write-Host "------------------------------------------------------------"
                  Write-Host "Exit code: $exit"
                  if ($exit -ne 0) {
                      Write-Error "E2E suite reported failures (exit code $exit)."
                      exit $exit
                  }
              shell: pwsh
              timeout-minutes: 5
