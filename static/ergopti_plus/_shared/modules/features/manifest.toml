# `clear_exclude` lists the paths a clear leaves as they are, as
# `restore_exclude` does for a restore. The Tap-Holds clear empties every key's
# tap and hold and keeps the switch: the user sets the next key from there, and
# a switch turned off with the keys made that key do nothing.
[scopes.tap_holds]
action_parameters = { domains = ["tap_hold"], restore = "remove" }
prefixes = ["tap_holds", "category_enabled.tap_holds"]
preset = "tap_hold"
restore_exclude = []
clear_exclude = ["tap_holds.enabled", "category_enabled.tap_holds"]

[scopes.shortcuts]
includes = ["key_combinations"]
action_parameters = { domains = ["keyboard", "script", "tap_key"], restore = "remove" }
prefixes = ["shortcuts", "mod_combos", "category_enabled.shortcuts", "category_enabled.key_combinations"]
restore_exclude = []
dynamic_defaults = [{ prefix = "shortcuts.personal", depth = 1, default = false, recommended = false }, { prefix = "shortcuts.keyboard", depth = 1, default = "none", recommended = "none" }]

# Combination assignments have their own menu owner. Clearing keeps its
# switch; restoring imports the recommendation without changing other shortcuts.
[scopes.key_combinations]
action_parameters = { domains = ["combination"], restore = "remove" }
prefixes = ["shortcuts.key_combination_taps", "shortcuts.key_combination_holds", "mod_combos", "category_enabled.key_combinations"]
restore_exclude = []
clear_exclude = ["mod_combos.enabled", "category_enabled.key_combinations"]
dynamic_defaults = [{ prefix = "shortcuts.key_combination_taps", depth = 1, default = "none", recommended = "none" }, { prefix = "shortcuts.key_combination_holds", depth = 1, default = "none", recommended = "none" }, { prefix = "mod_combos.config", depth = 2, suffix = "combo", default = "none", recommended = "none" }]

# The Gestures clear removes the assignments and keeps the switch, like the
# Tap-Holds one: the user assigns the next gesture from there.
[scopes.gestures]
action_parameters = { domains = ["gesture"], restore = "remove" }
prefixes = ["gestures"]
restore_exclude = []
clear_exclude = ["gestures.enabled"]

# Config only on Linux for now: the rows are not applied yet and number-row
# emulation is planned (docs/design/linux-number-row-runtime.md). The Linux
# owner (infra/keyboard_layout_scope.lua) restores or clears these rows in
# config.toml. macOS applies the same rows to its menu state.
[scopes.keyboard_layout]
prefixes = ["layout", "category_enabled.layout", "script.alt_gr_is_kana_remap"]
restore_exclude = []

# A restore leaves the user's own hotstrings as they are: the personal sections
# (hotstrings.personal on Windows, the "personal" group and the macOS editor's
# "custom" group elsewhere) are not the shipped catalogue it recommends.
[scopes.hotstrings]
prefixes = ["hotstrings", "category_enabled.hotstrings", "category_enabled.autocorrection", "category_enabled.distances_reduction", "category_enabled.sfbs_reduction", "category_enabled.rolls", "category_enabled.magic_key"]
restore_exclude = ["hotstrings.preview_ai_enabled", "hotstrings.personal", "hotstrings.groups.personal", "hotstrings.modules.personal", "hotstrings.groups.custom", "hotstrings.modules.custom"]
dynamic_defaults = [{ prefix = "category_enabled", depth = 1, default = false, recommended = true }, { prefix = "hotstrings.groups", depth = 1, default = false, recommended = true }, { prefix = "hotstrings.modules", depth = 2, default = false, recommended = true }, { prefix = "hotstrings.personal", depth = 2, suffix = "enabled", default = false, recommended = false }, { prefix = "hotstrings.personal", depth = 2, suffix = "time_activation_seconds", default = 0, recommended = 0 }]

[scopes.llm]
prefixes = ["llm"]
restore_exclude = ["llm.enabled"]
dynamic_defaults = [{ prefix = "llm.profiles.shortcuts", depth = 2, suffix = "mods", default = [], recommended = [] }, { prefix = "llm.profiles.shortcuts", depth = 2, suffix = "key", default = "", recommended = "" }]

[scopes.metrics]
prefixes = ["metrics"]
restore_exclude = ["metrics.enabled"]

[scopes.global]
includes = ["tap_holds", "shortcuts", "gestures", "keyboard_layout", "hotstrings", "llm", "metrics"]
prefixes = ["script"]
restore_exclude = []



# =================================================
# =================================================
# ======= 5. First-run configuration wizard =======
# =================================================
# =================================================

# The shared wizard (_shared/ui/onboarding) asks, after the language and
# configuration-folder steps, one question per page in the approved menu order.
# tools/codegen/codegen-onboarding-catalogue.cjs projects these declarations
# into _shared/ui/_generated/onboarding_catalogue.{js,json}: the page renders
# them and every host validates the finished answers against the same data.
#
# `order` lists the pages; each [onboarding.pages.<scope>] declares:
#   master       Per-platform manifest path of the category switch the question
#                sets. A platform without one keeps the question as the import
#                decision only; nothing is persisted for the answer itself.
#   checklist    "recommended": every input-altering feature of the page's scope
#                whose recommendation differs from its neutral default.
#                "hotstrings": every bundled section, language -> file ->
#                section from _shared/modules/hotstrings/_index.toml.
#                "tap_holds": every key of the platform's column of the shared
#                tap-hold catalogue its engine ships a recommendation for.
#                "none": the question alone (AI and metrics consent).
#   exclude      Scope prefixes left out of a "recommended" checklist.
#   labels       Label keys for recommended items whose manifest description
#                key resolves to no locale entry.
#   hint_key     Per-platform warning shown under the question.
#   note_key     Per-platform explanation for a page without a question.
#   consent      The answer is a privacy consent: never pre-selected.
#   magic_key    The hotstrings page's trigger choice, asked on `platforms` only.
#   sub_switch   Per-platform switch of part of the checklist that the category
#                switch does not reach: `path` names it and `sections` the
#                feature sections it governs.
#                The answer writes it only where it changes what is in force:
#                off when it turns the category switch from Yes to No, on when
#                it imports one of those items that was off. `independent`
#                marks a switch that is its own master: every No turns it off,
#                even on a first run or with the category switch already off.
#   state        Per-platform switch a page without a category switch starts
#                its question from: its host reads it from its own file and
#                reports it with the values in force; the page never writes it.
# The wizard persists only manifest paths, except the tap-hold keys: no driver
# keeps those in config.toml, so each host imports a checked key's shipped
# recommendation through its own tap-hold writer. A checklist's pre-selection is
# the manifest `recommended` value, and every question starts at No.
[onboarding]
order = ["tap_holds", "shortcuts", "gestures", "keyboard_layout", "hotstrings", "llm", "metrics"]

[onboarding.pages.tap_holds]
title_key = "menu.tapholds.title"
question_key = "menu.tapholds.enable"
description_key = "onboarding.page.tap_holds.description"
# macOS keeps the switch in config_karabiner.toml and Linux in tap_hold.toml,
# where a config.toml answer would never be read: there, importing a checked
# key switches the Tap-Holds on in that file, and a No or an empty list writes
# nothing. The question starts from that switch, which the host reports.
master = { ahk = "category_enabled.tap_holds" }
state = { hs = "tap_holds.enabled", linux = "tap_holds.enabled" }
checklist = "tap_holds"

[onboarding.pages.shortcuts]
title_key = "menu.shortcuts.title"
question_key = "menu.shortcuts.enable"
description_key = "onboarding.page.shortcuts.description"
master = { ahk = "category_enabled.shortcuts", hs = "shortcuts.enabled", linux = "shortcuts.enabled" }
checklist = "recommended"
# The user's own shortcut toggles: their labels come from the personal file.
exclude = ["shortcuts.personal"]
# The key combinations follow only their own switch (decision of 2026-09-29),
# which the Shortcuts master no longer reaches, while this page still lists the
# Windows pairs that ship a recommendation: a re-run answered No must leave
# them off as the master once did. macOS lists no combination here and Linux
# owns ordered combinations independently of the Shortcuts master.
sub_switch = { ahk = { path = "category_enabled.key_combinations", sections = ["shortcuts.key_combination_taps"] }, linux = { path = "category_enabled.key_combinations", sections = ["shortcuts.key_combination_taps"], independent = true } }

# What triggers a macOS built-in shortcut whose id spells no key combination,
# as the Shortcuts menu names it; every other one of them shows the chord its id
# spells, before the action it runs.
[onboarding.pages.shortcuts.triggers]
"shortcuts.keys.wrap_text_if_selected" = "menu.shortcuts.selection_symbol"

[onboarding.pages.gestures]
title_key = "menu.gestures.title"
question_key = "menu.gestures.enable"
description_key = "onboarding.gestures.desc"
master = { ahk = "gestures.enabled", hs = "gestures.enabled", linux = "gestures.enabled" }
checklist = "recommended"
hint_key = { hs = "dialog.gestures.warning_msg", linux = "gestures.system.warning" }

[onboarding.pages.keyboard_layout]
title_key = "menu.layout.title"
question_key = "menu.layout.enable"
description_key = "onboarding.page.keyboard_layout.description"
master = { ahk = "category_enabled.layout" }
checklist = "recommended"
# The AltGr virtual-key compensation answers a custom layout detected at
# runtime; it is not one of Ergopti's preferences to import. The emulated
# layout and the number-row ordering are the page's own controls (below), which
# a Yes never prefills.
exclude = ["script.alt_gr_is_kana_remap", "layout.ergopti_base", "layout.ergopti_variant", "layout.ergopti_alt_gr", "layout.direct_access_digits"]
# macOS installs the layout as a system input source and Linux through its
# desktop: both are chosen in the keyboard-layout menu, not switched here.
note_key = { hs = "onboarding.page.keyboard_layout.system_note", linux = "onboarding.page.keyboard_layout.system_note" }

# The layout step's persistent controls (the maintainer's request of October
# 13): the emulated layout and its AltGr layer, the number-row emulation (its
# base and Shift levels) and the number-row ordering, drawn on the page rather
# than in its checklist. Each starts at the value in force and changes only
# when the user changes it, so a new installation emulates no layout and
# reorders nothing; a change redraws the controls alone. Layout emulation and the ordering are
# Windows-only today: macOS and Linux draw the controls greyed with why.
[[onboarding.pages.keyboard_layout.controls]]
id = "emulated_layout"
label_key = "onboarding.layout.emulated_layout"
platforms = ["ahk"]
reason_key = "platform_reason.layout_emulation_is_windows_only"
choices = [{ value = "none", label_key = "onboarding.layout.emulated_none", writes = { "layout.ergopti_base" = false, "layout.ergopti_variant" = "none", "layout.emulated_layout" = "" } }, { value = "ergopti", label_key = "onboarding.layout.emulated_ergopti", writes = { "layout.ergopti_base" = true, "layout.ergopti_variant" = "ergopti", "layout.emulated_layout" = "" } }, { value = "ergopti_plus", label_key = "onboarding.layout.emulated_ergopti_plus", writes = { "layout.ergopti_base" = true, "layout.ergopti_variant" = "ergopti_plus", "layout.emulated_layout" = "" } }]

[[onboarding.pages.keyboard_layout.controls]]
id = "alt_gr_emulation"
label_key = "layout.ergoptialtgr"
path = "layout.ergopti_alt_gr"
platforms = ["ahk"]
reason_key = "platform_reason.layout_emulation_is_windows_only"

[[onboarding.pages.keyboard_layout.controls]]
id = "number_row_emulation"
label_key = "onboarding.layout.number_row_emulation"
path = "layout.emulate_number_row"
platforms = ["ahk"]
reason_key = "platform_reason.layout_emulation_is_windows_only"

[[onboarding.pages.keyboard_layout.controls]]
id = "number_row_order"
label_key = "menu.layout.number_row"
path = "layout.direct_access_digits"
choice_label_prefix = "menu.layout.number_row_"
platforms = ["ahk"]
reason_key = "platform_reason.number_row_override_unsupported"

[onboarding.pages.hotstrings]
title_key = "menu.hotstrings.title"
question_key = "menu.hotstrings.enable"
description_key = "onboarding.page.hotstrings.description"
master = { ahk = "category_enabled.hotstrings", hs = "hotstrings.enabled" }
checklist = "hotstrings"
# {group} is the manifest section id (distances_reduction, french_autocorrection);
# {stem} is the loaded group id (distancesreduction, french_autocorrection).
file_path = { ahk = "category_enabled.{group}", hs = "hotstrings.groups.{stem}", linux = "hotstrings.groups.{stem}" }
section_path = { ahk = "hotstrings.{group}.{section}.enabled", hs = "hotstrings.modules.{stem}.{section}", linux = "hotstrings.modules.{stem}.{section}" }
neutral_label_key = "onboarding.hotstrings.all_languages"
# The preview bubbles ship on (default and recommended, since 2026-10-24), so the
# wizard has no preview setting to offer: a setting that recommends its neutral
# default is refused by the onboarding generator.

[onboarding.pages.hotstrings.magic_key]
path = "hotstrings.trigger_char"
# Linux keeps its existing rare-symbol policy; common-character presets are
# offered only where the runtime accepts them. Custom Linux answers go through
# the same shared validator as the tray before the wizard changes preferences.
platforms = ["ahk", "hs", "linux"]
validation = { linux = "safe_magic_key" }
label_key = "onboarding.magic_key.desc"
hint_key = "onboarding.magic_key.choose_freely"
custom_label_key = "onboarding.magic_key.option_custom"
# One code point, as config.schema.json and every runtime validate it: a longer
# custom trigger would be saved, then stop the Windows driver at every start.
max_characters = 1
options = [{ value = "★", label_key = "onboarding.magic_key.option_blackstar" }, { value = "ù", label_key = "onboarding.magic_key.option_ugrave", platforms = ["ahk", "hs"] }, { value = ";", label_key = "onboarding.magic_key.option_semicolon", platforms = ["ahk", "hs"] }]

[onboarding.pages.llm]
title_key = "menu.llm.title"
question_key = "menu.llm.enable"
description_key = "onboarding.page.llm.description"
master = { ahk = "llm.enabled", hs = "llm.enabled", linux = "llm.enabled" }
checklist = "none"

[onboarding.pages.metrics]
title_key = "menu.metrics.title"
question_key = "menu.metrics.enable"
description_key = "onboarding.metrics.desc"
master = { ahk = "metrics.enabled", hs = "metrics.enabled", linux = "metrics.enabled" }
checklist = "none"
consent = true
