# ──────────────────────────────────────────────────────────────────────
# Privacy focus detection
# ──────────────────────────────────────────────────────────────────────

[privacy]

# Minimum settle time after a raw Tab/click before probing the newly focused
# accessible control. Linux receives evdev before the desktop consumes it.
focus_settle_ms = 250

# Hard deadline for one libatspi tree query. The verdict is already unknown and
# fail-closed while this helper runs, so expiry affects availability, not privacy.
atspi_probe_timeout_ms = 1000
# Retry failed context observations after retirement, independently of execution deadlines.
context_retry_ms = 1000

# Maximum wait for one already-running accessibility worker to answer an input
# admission barrier. A busy application withholds automation and metrics; input
# callbacks wait no longer than this budget before physical pass-through resumes.
focus_barrier_timeout_ms = 20

# Linux: how long the accessibility worker's pump sleeps between two polls of its
# transport while it waits for the desktop to answer (one libuv tick, so the wait
# neither spins a core nor adds a visible delay).
# Linux: adapters/atspi_focus_watch.lua.
focus_pump_sleep_ms = 1


# ──────────────────────────────────────────────────────────────────────
# Tap-hold / key repeat (AHK)
# ──────────────────────────────────────────────────────────────────────

[tap_hold]

# Minimum physical tap duration to register as intentional.
# AHK: tap_holds/constants.ahk TAP_MIN_DURATION_MS.
tap_min_duration_ms = 50

# Initial delay before key-repeat begins.
# AHK: tap_holds/constants.ahk KEY_REPEAT_INITIAL_DELAY_MS.
key_repeat_initial_delay_ms = 300

# Interval between subsequent key-repeat events.
# AHK: tap_holds/constants.ahk KEY_REPEAT_INTERVAL_MS.
key_repeat_interval_ms = 100

# The GLOBAL tap-vs-hold delay: what every tap-hold key waits before its hold
# fires, until the user changes the global delay or gives a key its own. No key
# ships a delay of its own (_shared/tap_hold/defaults.toml declares none).
# The ONE declaration of it: Linux and macOS read it here and Windows loads it at
# boot into TAPHOLD_DEFAULT_ACTIVATION_SECONDS (TapHoldsLoadTimings). 200 ms was
# already the fallback and the delay of five of the seven keys that shipped one;
# Caps Lock and Left Shift used to ship 350 ms.
default_activation_ms = 200

# One-shot shift: auto-cancel timeout if no subsequent key is pressed.
# AHK: tap_holds/constants.ahk ONE_SHOT_SHIFT_TIMEOUT_SEC (seconds).
one_shot_shift_timeout_ms = 2000

# How long a tap-hold copy (Cmd+C / Ctrl+C) waits before reading the
# clipboard's change counter, for the copy and again for its one retry. A busy
# application publishes its selection within the 200 ms the clipboard settle
# delay already allows; this leaves it a little more before the copy is sent
# again, and the wait is a timer, never a sleep on the input thread.
# AHK: platform/remap/constants.ahk TAP_COPY_VERIFY_MS. HS: modules/keymap/init.lua
# build_tap_copy. LX: platform/remap/tap_hold_manager.lua.
copy_verify_ms = 300


# ──────────────────────────────────────────────────────────────────────
# Hotstring expansion delay: complex keystrokes (PAR-7)
# ──────────────────────────────────────────────────────────────────────

[hotstrings]
# Windows: how long a hotstring's synthetic output stays marked as its own.
synthetic_clear_ms = 60

# A Shift, Alt or AltGr/Option keystroke takes longer finger-path time than a
# bare letter, and the Ergopti layout is Shift/AltGr-heavy. The expansion delay
# gate (the gap from the last letter of the input to the expander, see
# docs/memory/text-input-and-config.md project-hotstring-expansion-delay-definition)
# therefore widens its allowed delay by this factor on every driver when the
# EXPANDER keystroke is complex, or when the REFERENCE keystroke (the last
# letter) was complex and the gap is at most complex_key_carry_ms. The factor
# applies to the allowed delay, never to the measured gap. Autocorrections are
# never widened. A plain number, not a duration.
# Rule: hotstring_engine.complex_delay_multiplier (_shared/lua/hotstring_engine).
complex_key_delay_multiplier = 2

# How long after a complex keystroke the widening still carries to the next one:
# the lag between releasing Shift and pressing the next key. Beyond it the
# bonus is dropped so it cannot stretch an expansion on an unrelated key.
complex_key_carry_ms = 300

# Windows: the emoji and symbol sections register after ready, at their boot
# rank, in slices of this length; the keyboard waits at most one slice. A gap
# between two slices lets the input queued meanwhile run.
# AHK: infra/hotstrings/hotstring_engine_main.ahk HSE_DeferredRegistrationSlice.
deferred_registration_slice_ms = 25
deferred_registration_gap_ms = 15


# ──────────────────────────────────────────────────────────────────────
# Ergonomics warnings
# ──────────────────────────────────────────────────────────────────────

[ergonomics]

# Minimum continuous typing block before a micro-break is suggested.
# AHK: keystats_ergonomics.ahk BLOCK_BREAK_MS.
block_break_ms = 10000

# Continuous typing block that triggers a full break warning.
# AHK: keystats_ergonomics.ahk BLOCK_WARN_MS (20 minutes).
block_warn_ms = 1200000

# Flow-state detection window (sustained high-WPM period).
# AHK: keystats_ergonomics.ahk FLOW_WINDOW_MS (5 minutes).
flow_window_ms = 300000

# Pause duration above which a keystroke gap is classed as hesitation.
# AHK: keystats_ergonomics.ahk HESITATION_MS.
hesitation_ms = 2000

# Cooldown after a hesitation event before a new one can be registered.
# AHK: keystats_ergonomics.ahk HESITATION_COOLDOWN_MS.
hesitation_cooldown_ms = 10000


