# .github/workflows/macos-release-launch.yml
name: macOS published application startup
on:
  push:
    branches: [fix/hammerspoon-audit-2026-09-07]
    paths:
      - .github/workflows/macos-release-launch.yml
      - tools/diagnostics/macos-release-launch.py
      - tools/build/bundle-macos-luasocket.sh
      - tools/build/build_macos_app.sh
  workflow_dispatch:
    inputs:
      scenario:
        description: Reproduce an existing release or validate a fresh package
        required: true
        default: current_build
        type: choice
        options: [current_build, published, published_with_dependency, native_helper, helper_environment]
      tag:
        description: Existing release tag to reproduce
        required: true
        default: v0.0.0-dev.126
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: macos-release-launch
  cancel-in-progress: false
jobs:
  observe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select the retained helper for native environment acceptance
        if: inputs.scenario == 'helper_environment'
        id: helper
        run: |
          python3 tools/diagnostics/hs274_helper_environment_test.py
          python3 tools/diagnostics/hs274_helper_environment.py selection >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: inputs.scenario == 'helper_environment'
        with:
          name: ${{ steps.helper.outputs.artifact_name }}
          run-id: ${{ steps.helper.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/helper-download
      - name: Exercise actual Hammerspoon tasks with the retained native helper
        if: inputs.scenario == 'helper_environment'
        run: |
          version=$(sed -nE 's/^HAMMERSPOON_VERSION="\$\{HAMMERSPOON_VERSION:-([^}]+)\}"$/\1/p' tools/build/build_macos_app.sh)
          test "$version" = 1.1.1
          curl --fail --location --max-time 120 -o "$RUNNER_TEMP/helper-hammerspoon.zip" "https://github.com/Hammerspoon/hammerspoon/releases/download/$version/Hammerspoon-$version.zip"
          printf '%s  %s\n' 11bb1c90faf5427f37c7bd4fe7eab9774ae43e1d5cb020c5b3088dac32849efa "$RUNNER_TEMP/helper-hammerspoon.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/helper-hammerspoon.zip" "$RUNNER_TEMP/helper-hammerspoon"
          python3 tools/diagnostics/hs274_helper_environment.py "$RUNNER_TEMP/helper-download" "$RUNNER_TEMP/helper-hammerspoon/Hammerspoon.app" "$RUNNER_TEMP/helper-environment"
      - name: Download and verify the published application
        if: inputs.scenario == 'published' || inputs.scenario == 'published_with_dependency'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || 'v0.0.0-dev.126' }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          release = json.loads(subprocess.check_output(["gh", "release", "view", tag, "--repo", repository, "--json", "assets,tagName"]))
          asset, = [entry for entry in release["assets"] if entry["name"] == "ErgoptiPlus.app.zip"]
          target = pathlib.Path(os.environ["RUNNER_TEMP"], "release-download")
          target.mkdir()
          subprocess.run(["gh", "release", "download", tag, "--repo", repository, "--pattern", asset["name"], "--dir", str(target)], check=True)
          archive = target / asset["name"]
          digest = "sha256:" + hashlib.sha256(archive.read_bytes()).hexdigest()
          if asset.get("digest") != digest:
              raise RuntimeError("Published application digest is absent or mismatched")
          pathlib.Path(os.environ["RUNNER_TEMP"], "release-provenance.json").write_text(json.dumps({"tag": tag, "asset": asset, "verified_digest": digest}, indent=2))
          if pathlib.Path("/Applications/ErgoptiPlus.app").exists():
              raise RuntimeError("Refusing to replace an existing application")
          subprocess.run(["ditto", "-x", "-k", str(archive), "/Applications"], check=True)
          PY
      - name: Add the missing production dependency to the verified release
        if: inputs.scenario == 'published_with_dependency'
        run: |
          bash tools/build/bundle-macos-luasocket.sh /Applications/ErgoptiPlus.app "$RUNNER_TEMP/luasocket-build"
          codesign --force --sign - --preserve-metadata=identifier,entitlements,flags /Applications/ErgoptiPlus.app
          codesign --verify --strict /Applications/ErgoptiPlus.app
      - name: Build and exercise the shared native helper first
        if: inputs.scenario == 'native_helper'
        run: |
          bash tools/build/build_macos_app.sh --native-helper-only
          python3 tools/diagnostics/macos_native_helper.py build/macos-native-helper/ErgoptiPlus.app "$RUNNER_TEMP/native-helper.json"
      - name: Build the complete current application
        if: inputs.scenario == 'current_build' || inputs.scenario == 'native_helper' || github.event_name == 'push'
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          ERGOPTI_CHANNEL: dev
        run: |
          bash tools/build/build_macos_app.sh
          test ! -e /Applications/ErgoptiPlus.app
          ditto -x -k build/macos/ErgoptiPlus.app.zip /Applications
          shasum -a 256 build/macos/ErgoptiPlus.app.zip > "$RUNNER_TEMP/release-package.sha256"
      - name: Observe the installed release without a waiting open helper
        if: inputs.scenario != 'helper_environment'
        run: |
          python3 tools/diagnostics/macos_release_launch_test.py
          python3 tools/diagnostics/macos-release-launch.py /Applications/ErgoptiPlus.app "$RUNNER_TEMP/release-launch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-release-launch-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-launch
            ${{ runner.temp }}/release-provenance.json
            ${{ runner.temp }}/release-package.sha256
            ${{ runner.temp }}/native-helper.json
            ${{ runner.temp }}/helper-environment/*.json
            ${{ runner.temp }}/helper-environment/launch.log
      - uses: actions/upload-artifact@v4
        if: success() && (inputs.scenario == 'current_build' || github.event_name == 'push')
        with:
          name: ErgoptiPlus-macOS-verified-${{ github.sha }}
          path: build/macos/ErgoptiPlus.app.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success() && inputs.scenario == 'native_helper'
        with:
          name: ErgoptiPlus-native-helper-${{ github.sha }}
          path: |
            build/macos-native-helper/ErgoptiPlus.app.zip
            ${{ runner.temp }}/native-helper.json
          if-no-files-found: error
