# Neo 2 from the layout library (layout_library.json, neo2_new), as the layout
# editor writes it (F.toSource then IO.serialize): Mod3 and Mod4 held custom
# modifiers on Caps Lock and the ISO key left of Enter, the key right of left
# Shift and AltGr, one layer per level and its dead keys. The emulation tables
# (neo2_emulation.json) and the typing vectors (neo2_vectors.json) replayed by
# the web, Lua and AutoHotkey engines read it; test-layout-editor-levels.cjs
# checks it still is what the editor writes.
format = "ergopti-layout"
version = 1

[layout]
id = "neo2"
name = "Neo 2"

[physical]
base = "iso"

[[modifiers]]
id = "mod3"
mode = "held"
keys = [ "CapsLock", "Backslash" ]

[[modifiers]]
id = "mod4"
mode = "held"
keys = [ "IntlBackslash", "AltRight" ]

[[layers]]
id = "base"
