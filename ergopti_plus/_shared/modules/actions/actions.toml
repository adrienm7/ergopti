[sg_actions.llm_prompt_prediction]
# Asks the AI for predictions now with the prompt profile stored for the
# binding (built-in or custom) and, optionally, a prediction count of its own
# instead of the AI menu's. A rewrite profile (llm/rewrite.lua) rewrites the
# current sentence instead of continuing it. It refuses like
# llm_generate_prediction, and also when the stored profile no longer exists.
