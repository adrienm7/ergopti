<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<title data-i18n="numeric_prompt.window_title"></title>
		<script src="../a11y_prefs.js"></script>
		<link rel="stylesheet" href="../theme.css" />
		<link rel="stylesheet" href="style.css" />
		<script src="../i18n.js"></script>
		<script src="../host_bridge.js"></script>
	</head>
	<body>
		<main id="container">
			<h1 id="prompt-title"></h1>

			<p id="prompt-hint"></p>

			<p id="input-wrapper">
				<!-- The field has no label of its own: the question above names it and
				     the hint, the range and a refusal describe it (WCAG 1.3.1, 3.3.2). -->
				<input
					type="text"
					id="value-input"
					inputmode="decimal"
					autocomplete="off"
					spellcheck="false"
					aria-labelledby="prompt-title"
					aria-describedby="prompt-hint range-hint error"
				/>
				<small id="range-hint"></small>
			</p>

			<p id="error" role="alert" hidden></p>

			<footer id="buttons">
				<button
					type="button"
					id="cancel-button"
					data-i18n="numeric_prompt.cancel"
					onclick="doCancel()"
				></button>
				<button
					type="button"
					id="save-button"
					data-i18n="numeric_prompt.save"
					onclick="doSave()"
				></button>
			</footer>
		</main>

		<script src="script.js"></script>
	</body>
</html>
