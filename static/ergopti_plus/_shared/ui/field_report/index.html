<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title data-i18n="field_report.title"></title>
		<script src="../a11y_prefs.js"></script>
		<script src="../page_locale.js"></script>
		<link rel="stylesheet" href="../theme.css" />
		<link rel="stylesheet" href="style.css" />
		<script src="../host_bridge.js"></script>
		<script src="../i18n.js"></script>
	</head>
	<body>
		<main>
			<h1 id="heading"></h1>
			<p class="intro" data-i18n="field_report.intro"></p>
			<section aria-labelledby="steps-heading">
				<h2 id="steps-heading" data-i18n="field_report.steps"></h2>
				<ol id="steps" class="steps"></ol>
			</section>
			<section id="summary" aria-labelledby="summary-heading" hidden>
				<h2 id="summary-heading" data-i18n="field_report.summary"></h2>
				<p id="verdict" class="verdict"></p>
				<ul id="counts" class="counts"></ul>
				<p id="folder" class="folder"></p>
			</section>
			<p id="status" class="status info" role="status" aria-live="polite"></p>
		</main>
		<footer class="buttons">
			<button type="button" id="btn-close" data-i18n="common.close"></button>
			<button type="button" id="btn-cancel" data-i18n="field_report.cancel"></button>
			<button type="button" id="btn-open" disabled></button>
			<button type="button" id="btn-copy" disabled data-i18n="field_check.copy"></button>
			<button
				type="button"
				id="btn-issue"
				class="primary"
				disabled
				data-i18n="field_report.issue"
			></button>
		</footer>
		<script src="script.js"></script>
	</body>
</html>
