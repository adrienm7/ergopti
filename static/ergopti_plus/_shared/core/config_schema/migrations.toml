[steps.v6_to_v7]
from = 6
to = 7
drivers = ["hs"]
reason = "Layer + Scroll is retired on macOS: the navigation layer's wheel bindings (layers.toml WheelUp and WheelDown, edited from Tap-Holds > Edit the layer) replace it."
# The switch had no effect left: it armed on an F19 key that only the retired
# legacy Karabiner rules sent. An existing layers.toml gains no wheel binding
# (a loader never falls back to the preset), so the wheel keeps scrolling while
# the layer is held until the user binds it in the layer editor or restores the
# recommended layer, whose wheel is volume up and down.
# The retired switch remains on disk for the explicit outdated-key cleanup.
ops = []

[steps.v7_to_v8]
from = 7
to = 8
drivers = ["hs"]
reason = "The script-management chords are one set of four slots on every driver: the macOS switch and its three right-Option slots take the names Windows and Linux use."
# The macOS `enabled` switch turned every chord off, as chords_enabled off
# does; return_key, backspace and escape held the
# actions of right Option + Return, Backspace and Escape. The Delete slot is
# new on macOS and has nothing to carry over.
ops = [
	{ op = "rename", section = "shortcuts.script_control", key = "enabled", to_key = "chords_enabled" },
	{ op = "rename", section = "shortcuts.script_control", key = "return_key", to_key = "script_altgr_enter" },
	{ op = "rename", section = "shortcuts.script_control", key = "backspace", to_key = "script_altgr_backspace" },
	{ op = "rename", section = "shortcuts.script_control", key = "escape", to_key = "script_altgr_escape" },
]

[steps.v8_to_v9]
from = 8
to = 9
drivers = ["hs"]
reason = "Representable legacy hotstring editor shortcuts become ordinary actions; explicit custom or disabled choices disable the contextual recommendation."
ops = [
	{ op = "move_chord_action", section = "hotstrings.editor", key = "shortcut", to_section = "shortcuts.keyboard", action = "open_hotstrings_editor", conditional_key = "magic_editor", disabled_action = "none", platform = "macos" },
]

[steps.v9_to_v10]
from = 9
to = 10
drivers = ["ahk"]
reason = "The Windows number-row switch becomes an explicit native, digits or symbols policy; only genuine legacy booleans are mapped."
ops = [
	{ op = "map_value", section = "layout", key = "direct_access_digits", map = [{ from = false, to = "native" }, { from = true, to = "digits" }] },
]

[steps.v10_to_v11]
from = 10
to = 11
drivers = ["ahk", "hs", "linux"]
reason = "Common autocorrections become independently selectable names, abbreviations and technical terms; existing destinations and unrelated legacy fields retain their values."
ops = [
	{ op = "copy_if_absent", section = "hotstrings.autocorrection.caps", key = "enabled", to_section = "hotstrings.autocorrection.names" },
	{ op = "copy_if_absent", section = "hotstrings.autocorrection.caps", key = "time_activation_seconds", to_section = "hotstrings.autocorrection.names" },
	{ op = "copy_if_absent", section = "hotstrings.modules.autocorrection", key = "caps", to_key = "names" },
	{ op = "copy_if_absent", section = "hotstrings.autocorrection.caps", key = "enabled", to_section = "hotstrings.autocorrection.abbreviations" },
	{ op = "copy_if_absent", section = "hotstrings.autocorrection.caps", key = "time_activation_seconds", to_section = "hotstrings.autocorrection.abbreviations" },
	{ op = "copy_if_absent", section = "hotstrings.modules.autocorrection", key = "caps", to_key = "abbreviations" },
	{ op = "copy_if_absent", section = "hotstrings.autocorrection.caps", key = "enabled", to_section = "hotstrings.autocorrection.technical_terms" },
	{ op = "copy_if_absent", section = "hotstrings.autocorrection.caps", key = "time_activation_seconds", to_section = "hotstrings.autocorrection.technical_terms" },
	{ op = "copy_if_absent", section = "hotstrings.modules.autocorrection", key = "caps", to_key = "technical_terms" },
]

# Preserve helper-backed Windows variants and independent source/layer ownership.
[steps.v11_to_v12]
from = 11
to = 12
drivers = ["ahk"]
reason = "Represent the helper-backed built-in variant without changing registry or layer intent."
ops = [
	{ op = "move_ergopti_variant", section = "layout", key = "ergopti_plus", to_key = "ergopti_variant", base_key = "ergopti_base", alt_gr_key = "ergopti_alt_gr", source_key = "emulated_layout", false_variant = "ergopti", true_variant = "ergopti_plus", neutral_variant = "none" },
]

# Windows reads the dynamic-hotstring master where macOS and Linux always have.
[steps.v12_to_v13]
from = 12
to = 13
drivers = ["ahk"]
reason = "The Windows dynamic-hotstring master becomes hotstrings.dynamic.enabled, as on macOS and Linux; a stored category switch keeps its value and a configuration without one keeps its families live."
# `category_enabled.dynamichotstrings` is the only spelling an older Windows
# configuration can hold for this switch. An existing hotstrings.dynamic.enabled
# keeps its value (rename never overwrites a target). Without either key the
# families that were live under the Hotstrings master stay live: the new master
# is written on, because its neutral default is off.
ops = [
	{ op = "rename", section = "category_enabled", key = "dynamichotstrings", to_section = "hotstrings.dynamic", to_key = "enabled" },
	{ op = "set_if_absent", section = "hotstrings.dynamic", key = "enabled", value = true },
]

# The cascade counts arrows, not further links.
[steps.v13_to_v14]
from = 13
to = 14
drivers = ["ahk", "hs", "linux"]
reason = "hotstrings.cascade_depth (0 = off, n = n more hotstrings) becomes hotstrings.cascade_max_arrows (1 = a single expansion, n = n arrows): the user's effective choice is kept."
# The old value n chained n more hotstrings after the first, that is n + 1
# arrows, and 0 meant the first expansion only, that is 1 arrow. The old and the
# new values overlap (an old 1 is a new 2, an old 2 a new 3), which the closed
# map_value op refuses in one pass because a replay would map twice; the value
# therefore goes through a text spelling the new numbers cannot collide with:
# integer to text, then text to the new integer, then the rename. A key that is
# absent or already moved makes the whole step a no-op, so a replay changes
# nothing. An old value of 10 (hand-edited; the menu offered 0 to 3) keeps its
# number, which is the new maximum; 11 or more maps to no pair, keeps its number
# under the new name and is reported there as outdated configuration, read as
# the default.
ops = [
	{ op = "map_value", section = "hotstrings", key = "cascade_depth", map = [{ from = 0, to = "1" }, { from = 1, to = "2" }, { from = 2, to = "3" }, { from = 3, to = "4" }, { from = 4, to = "5" }, { from = 5, to = "6" }, { from = 6, to = "7" }, { from = 7, to = "8" }, { from = 8, to = "9" }, { from = 9, to = "10" }] },
	{ op = "map_value", section = "hotstrings", key = "cascade_depth", map = [{ from = "1", to = 1 }, { from = "2", to = 2 }, { from = "3", to = 3 }, { from = "4", to = 4 }, { from = "5", to = 5 }, { from = "6", to = 6 }, { from = "7", to = 7 }, { from = "8", to = 8 }, { from = "9", to = 9 }, { from = "10", to = 10 }] },
	{ op = "rename", section = "hotstrings", key = "cascade_depth", to_key = "cascade_max_arrows" },
]

# The OS-named keyboard slot ids become role-named ones (docs/design/one-shortcut-model.md).
[steps.v14_to_v15]
from = 14
to = 15
drivers = ["hs", "linux"]
reason = "Keyboard slots are named by modifier role (primary_g, secondary_a, meta_space) instead of by operating system, and the macOS Ctrl-letter switches become the slots of the same chords: every saved binding keeps its action."
# macOS and Linux slot ids are disjoint (cmd_/hs_ vs ctrl_/super_), so one list
# serves both drivers: an op names a key the other driver's file never holds.
# A saved slot is renamed first, so an action the user chose for a slot always
# beats the action implied by the retired switch of the same chord ("an existing
# target keeps its value"). A switch left on becomes its catalogue action, a switch
# the user turned off becomes "none", and the switch itself is deleted. The
# ChatGPT switch (ctrl_g, with the shortcuts.chatgpt_url setting) and the
# Cmd+* and wrap-selection switches stay: they are not catalogue actions yet.
# The per-slot action parameters of the retired ids (gestures.action_parameters
# keys "keyboard__<slot>__<action>") are not renamed: each would need one op per
# slot and parameterized action, thousands of rows every driver parses at boot.
