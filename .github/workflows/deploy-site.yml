# .github/workflows/deploy-site.yml
#
# Deploys the SvelteKit site to GitHub Pages.
#
# Triggers only when site source actually changed — no deploy on driver-only commits.
# Watched paths:
#   src/          — Svelte routes, components, lib
#   static/       — public assets (images, locales, downloadable files…)
#   svelte.config.js / vite.config.js / package*.json
#
# Branch → URL mapping:
#   main  → https://ergopti.fr/        (BASE_PATH="")
#   dev   → https://ergopti.fr/dev/    (BASE_PATH="/dev")
#
# The gh-pages branch is used as the deployment target.
# main deploys to the root; dev deploys to the /dev/ subdirectory,
# leaving all other directories in gh-pages untouched.

name: Deploy site

on:
  push:
    branches: [main, dev]
    paths:
      # Svelte app source
      - 'src/**'
      # Site-only assets in static/ — driver folders are excluded:
      #   static/ergopti_plus/  → macOS / Windows / Linux drivers
      #   static/drivers/       → downloadable driver bundles
      # Everything else in static/ is a site asset.
      - 'static/benchmarks/**'
      - 'static/corpus/**'
      - 'static/documents/**'
      - 'static/ergopti/**'
      - 'static/img/**'
      - 'static/layouts/**'
      - 'static/favicon.ico'
      - 'static/version.json'
      # Build config
      - 'svelte.config.js'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Only one deploy per branch at a time — cancel any in-progress deploy
  # for the same branch when a new push arrives.
  group: deploy-site-${{ github.ref_name }}
  cancel-in-progress: true

# ===================================
# ===================================
# ======= 1/ Build + Deploy =======
# ===================================
# ===================================

jobs:
  deploy:
    name: "Build + deploy → ${{ github.ref_name == 'main' && 'ergopti.fr/' || 'ergopti.fr/dev/' }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so git operations in later steps work correctly
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve deploy target
        id: target
        # main  → base path ""     → deploys to gh-pages root
        # dev   → base path "/dev" → deploys to gh-pages /dev/ subdirectory
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
              echo "base_path="          >> "$GITHUB_OUTPUT"
              echo "deploy_dir=."        >> "$GITHUB_OUTPUT"
              echo "label=ergopti.fr/"   >> "$GITHUB_OUTPUT"
          else
              echo "base_path=/dev"        >> "$GITHUB_OUTPUT"
              echo "deploy_dir=dev"         >> "$GITHUB_OUTPUT"
              echo "label=ergopti.fr/dev/"  >> "$GITHUB_OUTPUT"
          fi

      - name: Build SvelteKit site
        env:
          BASE_PATH: ${{ steps.target.outputs.base_path }}
        run: npm run build

      - name: Deploy to GitHub Pages
        # Updates ONLY the target subdirectory on gh-pages (root for main,
        # /dev/ for dev), leaving the other branch's files untouched.
        #
        # The git operations run in an ISOLATED worktree, never in the build
        # checkout. Doing `git checkout gh-pages` in the build directory (the
        # previous approach) left node_modules/, build/ and .svelte-kit/ as
        # untracked files that `git add -A` then swept into the published
        # branch — that is what corrupted gh-pages. A worktree only ever
        # contains gh-pages' own tracked files, so the build tree can never
        # leak in.
        run: |
          set -euo pipefail

          DEPLOY_DIR="${{ steps.target.outputs.deploy_dir }}"
          LABEL="${{ steps.target.outputs.label }}"

          # Configure git identity for the deploy commit
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Attach gh-pages in an isolated worktree beside the build checkout,
          # creating the branch (orphan) if it does not exist yet.
          GHP="$RUNNER_TEMP/gh-pages"
          rm -rf "$GHP"
          if git ls-remote --exit-code origin gh-pages > /dev/null 2>&1; then
              git fetch --depth=1 origin gh-pages
              git worktree add "$GHP" gh-pages
          else
              git worktree add --orphan -b gh-pages "$GHP"
          fi

          # Replace only the target directory — the other branch is untouched
          if [[ "$DEPLOY_DIR" == "." ]]; then
              # Main deploy: wipe root but preserve any subdirectories that
              # belong to other branches (e.g. /dev/).
              find "$GHP" -mindepth 1 -maxdepth 1 \
                     ! -name '.git' \
                     ! -name 'dev' \
                     -exec rm -rf {} +
              cp -r build/. "$GHP"/
          else
              rm -rf "${GHP:?}/$DEPLOY_DIR"
              mkdir -p "$GHP/$DEPLOY_DIR"
              cp -r build/. "$GHP/$DEPLOY_DIR/"
          fi

          # GitHub Pages needs a .nojekyll file at the root to serve
          # files whose names start with an underscore (SvelteKit chunks).
          touch "$GHP/.nojekyll"

          git -C "$GHP" add -A
          # Only commit if something actually changed
          if git -C "$GHP" diff --cached --quiet; then
              echo "No changes to deploy — gh-pages already up to date."
              exit 0
          fi

          COMMIT_SHA="${{ github.sha }}"
          git -C "$GHP" commit -m "deploy: ${LABEL} ← ${COMMIT_SHA::8} (${GITHUB_REF_NAME})"
          git -C "$GHP" push origin gh-pages
          echo "Deployed to ${LABEL}"
