# ====================
# ====================
# ======= Meta =======
# ====================
# ====================

[_meta]
delay = 0.5
show_tooltip = false
description = { fr = "Roulements", en = "Rolls", de = "Läufe", es = "Rodamientos", zh = "连击", ar = "تداول", cs = "Rolování", da = "Rolls", he = "גלגולים", hi = "रोल्स", it = "Rollate", ja = "ロール", ko = "롤", nl = "Rolls", no = "Rolls", pl = "Rolady", pt = "Rolagens", ru = "Перекаты", sv = "Rolls", tr = "Yuvarlamalar", uk = "Перекати" }
sections_order = ["hc", "sx", "cx", "englishnegation", "ez", "ct", "-", "closechevrontag", "chevronless", "chevrongreater", "commentopen", "commentclose", "-", "assign", "notequal", "-", "parenquote", "bracketquote", "hashtagparenthesis", "hashtagopenbracket", "hashtagclosebracket", "equalstring", "-", "leftarrow", "assignarrowequalright", "assignarrowequalleft", "assignarrowminusright", "assignarrowminusleft"]



# =========================
# ===== Meta.Sections =====
# =========================

[_meta.sections]
assign = "#! ➜ :="
assignarrowequalleft = "=$ ➜ <="
assignarrowequalright = "$= ➜ =>"
assignarrowminusleft = "?+ ➜ <-"
assignarrowminusright = "+? ➜ ->"
bracketquote = "[# ➜ [\""
chevrongreater = ">% ➜ >="
chevronless = "<% ➜ <="
closechevrontag = "<@ ➜ </"
commentclose = "\"\\ ➜ */"
commentopen = "\\\" ➜ /*"
ct = "P’ ➜ CT"
cx = "CX ➜ CK"
englishnegation = "NT’ ➜ N’T"
equalstring = "[) ➜ = \"\""
ez = "EÉ ➜ EZ"
hashtagclosebracket = "#] ➜ \"]"
hashtagopenbracket = "#[ ➜ \"]"
hashtagparenthesis = "#( ➜ \")"
parenquote = "(# ➜ (\""
hc = "HC ➜ WH"
leftarrow = "=+ = ➜"
notequal = "!# ➜ !="
sx = "SX ➜ SK"





# ======================
# ======================
# ======= Assign =======
# ======================
# ======================

[[assign]]
" #!" = { output = " := ", is_word = false, auto_expand = true, is_case_sensitive = true, final_result = true }
