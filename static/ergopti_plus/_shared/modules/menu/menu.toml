# The AI agent submenu (_shared/modules/llm/agent.json): its mode, the backend
# and model of System 1 (fast triage) and System 2 (the actions), and the
# applications the automatic mode ignores. The fixed modes belong to the enum
# feature and its shared choice renderer. The backend lists and application
# rows are `list` rows: each driver supplies their DATA (stored API entries,
# native apps) and the shared renderer draws them. Windows keeps its excluded
# applications as one `command` row opening its native picker dialog, where the
# Lua drivers list the applications in a submenu.
# The common Info Bar check keeps the native display providers on either side:
# macOS retains its leading indent selector; the other drivers supply no leading row.
# The two automatic prediction triggers share row identity, labels and admission.
# Numeric debounce and application exclusions retain native row owners.
