# `list` since 2026-08-07, not `action`/`dynamic`: the row's label is built
# from runtime state — the number of excluded apps — so no static i18n key can
# express it. A provider that returns ONE row is still the renderer drawing it:
# the driver answers what the row says and the renderer decides what a row
# looks like.
[[menu.metrics_menu]]
type = "list"
id = "exclude_apps"
disabled_when = ["keylogger_enabled"]
platforms = ["ahk", "hs"]
reason_key = "platform_reason.metrics_extras_are_not_on_linux"
[[menu.metrics_menu]]
type = "---"

# `check` since 2026-08-07, and the conversion settled a divergence nobody could
# see: this row read "Encrypt logs on disk (Security)" on Windows and macOS and
# "Encrypt data at rest" on Linux. Two labels for one switch, because each driver
# picked its own key from a declaration that named neither.
#
# `menu.metrics.encrypt_toggle` wins because it says WHAT is encrypted — the logs
# on disk — where the other names a category. `checked_when` closes the second
# half of the same gap: the row had no predicate, so all three computed the tick
# themselves, which the Linux builder had a comment apologising for.
[[menu.metrics_menu]]
type = "check"
id = "encryption"
i18n = "menu.metrics.encrypt_toggle"
checked_when = ["metrics_encrypt_enabled"]
disabled_when = ["keylogger_enabled"]

# The readouts this driver answers in its log rather than in a window. They are
# Linux's own — macOS and Windows open a metrics WINDOW for the same figures —
# and until 2026-08-06 they were built in menu_builder.lua with nothing
# describing them. A driver-specific row is fine; a driver-specific row nobody
# declared is a row no gate can compare, reason about or find.

[[menu.metrics_menu]]
type = "---"
platforms = ["linux"]

# Three rows stood here until 2026-08-07 — "Session statistics", "Current WPM"
# and "Per-application statistics" — and each one's entire effect was a line in
# the driver's log. Their labels promised figures the user never saw. The same
# menu already opens the windows that hold them: `show_typing` and `show_apps`
# are declared above for all three drivers, and the WPM
# widget toggle shows the live rate. They were removed rather than pointed at
# those windows, which would have given this menu two rows opening one window.

# Ticked from the keylogger's own suppression state. It used to glue a " ✓" onto
# the label, which puts one platform's convention inside a string twenty other
# languages also read — and bypasses the tray's native check item.
[[menu.metrics_menu]]
type = "check"
id = "metrics_suspend"
i18n = "menu.global.suspend"
checked_when = ["metrics_suppressed"]
platforms = ["linux"]
reason_key = "platform_reason.metrics_collection_is_in_process_on_linux"

[[menu.metrics_menu]]
type = "command"
id = "metrics_reset_session"
i18n = "menu.metrics.reset_session"
platforms = ["linux"]
reason_key = "platform_reason.metrics_collection_is_in_process_on_linux"


# The at-rest migration readout. Converting a year of stored rows takes minutes,
# and without this row the user ticks « chiffrer au repos » and sees nothing
# happen at all — so it reports progress and offers to stop. Linux's alone: it is
# the driver that migrates in the background rather than on the next launch.
#
# A `list` because its label IS the progress — "n / total" — which no static
# declaration can spell.
[[menu.metrics_menu]]
type = "list"
id = "metrics_migration"
platforms = ["linux"]
reason_key = "platform_reason.only_linux_migrates_in_the_background"
[[menu.layout_menu]]
type = "toggle"
id = "layout_toggle"
i18n = "menu.layout.enable"
checked_when = ["layout_enabled"]
category = "Layout"
# Only Windows emulates the Ergopti layout itself, so only Windows has an
# emulation to switch off. macOS installs the layout as a system input source and
# Linux remaps through kanata; declared for them, this row had no command and was
# skipped in silence, which is the failure the renderer now reports.
platforms = ["ahk"]
reason_key = "platform_reason.layout_emulation_is_windows_only"

# The keyboard-layout scope's restore and clear, right after the switch Windows
