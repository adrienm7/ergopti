          ### Linux

          | Asset | Description |
          |---|---|
          | [ErgoptiPlus-linux-amd64.deb](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ErgoptiPlus-linux-amd64.deb) | Driver package for Debian, Ubuntu and Mint |
          | [ErgoptiPlus-linux-noarch.rpm](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ErgoptiPlus-linux-noarch.rpm) | Driver package for Fedora, RHEL and openSUSE |
          | [ErgoptiPlus-linux-x86_64.AppImage](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ErgoptiPlus-linux-x86_64.AppImage) | Portable driver — any distribution, no root required |
          | [ErgoptiPlus-linux-x86_64.flatpak](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ErgoptiPlus-linux-x86_64.flatpak) | Sandboxed driver, for a distribution-agnostic install |
          | [$LINUX_BUNDLE_ASSET](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$LINUX_BUNDLE_ASSET) | Driver bundle with \`install.sh\`, installs under your home directory |
          | [Ergopti_xkb.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Ergopti_xkb.zip) | XKB layout files (standard, ANSI, plus, plus-ANSI variants) |
          | [kanata.kbd](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/kanata.kbd) | Kanata configuration, for a Kanata-based remap |

          **Which file for your distribution:**
          - Debian, Ubuntu, Mint, Pop!_OS, elementary → \`ErgoptiPlus-linux-amd64.deb\`
          - Fedora, RHEL, CentOS, openSUSE, Mageia → \`ErgoptiPlus-linux-noarch.rpm\`
          - Arch, Manjaro, EndeavourOS → build it from \`tools/build/PKGBUILD\` in the repository; no Arch package is attached to this release
          - Flatpak → \`ErgoptiPlus-linux-x86_64.flatpak\`, installed with \`flatpak install --bundle\`. It requests \`--device=all\`, which is the only permission that reaches \`/dev/input\` and \`/dev/uinput\`; the sandbox still cannot grant access your user does not have on the host, so the udev rule in step 2 is required either way
          - Any other distribution, an immutable one, or no root access → \`ErgoptiPlus-linux-x86_64.AppImage\` or \`$LINUX_BUNDLE_ASSET\`

          > **Alpha.** The Linux driver has never been validated on real hardware. Every asset above is installed and launched in CI, and the installed layout is checked from inside it — but a runner has no keyboard to grab, no /dev/uinput to write and no display, so capture, injection, the tray and the settings windows are all unproven.

          **Installation — app:**
          1. Install the package for your distribution:
          \`\`\`bash
          sudo apt install ./ErgoptiPlus-linux-amd64.deb       # Debian, Ubuntu, Mint
          sudo dnf install ./ErgoptiPlus-linux-noarch.rpm      # Fedora, RHEL, openSUSE
          flatpak install --bundle ./ErgoptiPlus-linux-x86_64.flatpak   # sandboxed
          chmod +x ErgoptiPlus-linux-x86_64.AppImage           # anywhere else, then run it
          \`\`\`
          2. Give the daemon access to the keyboard. It reads \`/dev/input/event*\` and writes \`/dev/uinput\`, and a normal user is refused both until a udev rule and the \`input\` and \`uinput\` group memberships exist. Unpack \`$LINUX_BUNDLE_ASSET\` and run:
          \`\`\`bash
          bash install.sh --setup-perms
          \`\`\`
          3. Log out and back in so the new group memberships take effect. Skip this and the daemon starts, logs one line and captures nothing — the most common first experience.
          4. Start it with \`systemctl --user start ergopti-hotstrings.service\` (\`.deb\` and \`.rpm\`), or by running the AppImage directly.

          **Installation — keyboard layout only:**
          1. Unzip \`Ergopti_xkb.zip\`.
          2. Follow the [XKB installation guide](https://github.com/${GITHUB_REPOSITORY}/tree/main/static/ergopti/linux/xkb_installation) in the repository.
          3. On a system remapped with Kanata rather than XKB, use \`kanata.kbd\` as the Kanata configuration instead.

