[sg_actions.llm_screen_region]
# Lets the user draw a screen region, has the vision backend stored for the
# binding transcribe it (llm/vision.lua, _shared/modules/llm/vision.json), then
# has the AI menu's text backend draft a reply, a translation and an
# explanation, offered in the prediction tooltip and typed at the caret on
# acceptance. A cancelled selection does nothing. It refuses like
# llm_generate_prediction, and when the backend has no vision model.
platform = "all"
parameter = "llm_vision"

[sg_actions.llm_live_prompt_toggle]
# Turns live mode on with the prompt stored for the binding (llm_prompt
# parameter, as llm_prompt_prediction), or off when it is on. While on, every
# keystroke asks for predictions with that prompt and count, using the
# debounce and minimum word count of _shared/modules/llm/live.json instead of
# the menu's, so a rewrite prompt such as translate_en shows the current sentence translated as it is typed; Tab
# replaces the sentence. The menu's profile and settings are left unchanged.
platform = "all"
parameter = "llm_prompt"

[sg_actions.llm_screen_full]
# llm_screen_region on the whole screen the pointer is on, with no selection.
platform = "all"
parameter = "llm_vision"

[sg_actions.llm_screen_error]
# "Why this error?": the user draws a region around an error (a terminal, a
# log, a dialog, code), the vision model reads it, and the tooltip offers the
# error_answers of vision.json in order: the explanation in the interface
# language, then the fix the user can type (a command or the corrected line).
# Same parameter, refusals and capture as llm_screen_region.
platform = "all"
parameter = "llm_vision"

[sg_actions.llm_translate_context]
# Translates the current sentence through the existing rewrite prediction owner.
# The target is stored per binding; selecting this action changes no active profile.
platform = "all"
parameter = "llm_language"

[sg_actions.llm_translate_selection]
# Translates the SELECTION with the AI menu's current text backend
# (_shared/modules/llm/translate.json) and shows the translation in the
# prediction tooltip; accepting it replaces the selection, Escape leaves the
# text untouched. The parameter is "ui" (the interface language, the default)
# or a free language name. Nothing selected: a notice. It refuses like
# llm_generate_prediction (paused, AI off, backend not ready).
platform = "all"
parameter = "llm_language"

[sg_actions.llm_agent_selection]
# "What can I do with this?": System 2 (llm.agent_system2) reads the
# SELECTION and proposes at most three actions of the closed schema of
# _shared/modules/llm/agent.json (calendar event, reminder, mail draft, one of
# the user's shortcuts) as tooltip candidates; accepting one hands it to the
# driver's connector. Nothing runs without that acceptance. Nothing selected:
# a notice. It refuses like llm_generate_prediction, and with a notice when
# no System 2 is chosen.
platform = "all"

[sg_actions.llm_agent_command]
