# .github/workflows/ci-linux-e2e.yml
#
# Linux E2E stage: one runner per domain shard of the live harnesses (real
# kernel input, display, webview, updater, network and AI servers), each
# recording its mandatory evidence.
# Called by ci-linux.yml as its e2e-linux stage.

name: 'Linux E2E tests'

on:
  workflow_call:
    inputs:
      release:
        description: True when this run publishes a release; only sets artifact retention
        required: true
        type: boolean
      version:
        description: Release version stamped into the Linux tree, empty outside a release
        required: true
        type: string
      tag:
        description: Exact release tag from the validated release plan
        required: true
        type: string
      prerelease:
        description: Exact prerelease string from the validated release plan
        required: true
        type: string
      channel:
        description: Exact update channel from the validated release plan
        required: true
        type: string
      predecessors:
        description: The lane's needs context for this stage (test-linux), as JSON
        required: true
        type: string
      predecessor_result:
        description: Result of test-linux, the stage this one follows
        required: true
        type: string
    outputs:
      ci_predecessors:
        description: e2e-linux's ci_predecessors output, read by the lane's later stages
        value: ${{ jobs.e2e-linux.outputs.ci_predecessors }}
      ci_source_sha:
        description: e2e-linux's ci_source_sha output, read by the lane's later stages
        value: ${{ jobs.e2e-linux.outputs.ci_source_sha }}
      ci_run_id:
        description: e2e-linux's ci_run_id output, read by the lane's later stages
        value: ${{ jobs.e2e-linux.outputs.ci_run_id }}
      ci_attempt:
        description: e2e-linux's ci_attempt output, read by the lane's later stages
        value: ${{ jobs.e2e-linux.outputs.ci_attempt }}
      ci_unit_result:
        description: e2e-linux's ci_unit_result output, read by the lane's later stages
        value: ${{ jobs.e2e-linux.outputs.ci_unit_result }}

permissions:
  contents: read

env:
  ERGOPTI_DEV_RELEASE_RELEASE: ${{ inputs.release }}
  ERGOPTI_DEV_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
  ERGOPTI_DEV_RELEASE_CHANNEL: ${{ inputs.channel }}
  ERGOPTI_DEV_RELEASE_TAG: ${{ inputs.tag }}
  ERGOPTI_DEV_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  e2e-linux:
    name: '${{ matrix.shard }}'
    runs-on: ubuntu-latest
    # One row per domain, listed in tools/test/fixtures/linux-e2e-shards.json.
    # Every harness step runs in exactly one row (its if: names the row); the
    # shared setup steps and the evidence record run in every row. needs:
    # e2e-linux waits for every row and reports failure if any row fails.
    strategy:
      fail-fast: false
      matrix:
        shard:
          - input-display
          - desktop-webview
          - updater
          - network-ai
          - platform-metrics
    env:
      # Python-owned native children also resolve the production shared modules.
      LUA_PATH: './?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;'
      # The shard this matrix row runs; the evidence record reads it.
      LINUX_E2E_SHARD: ${{ matrix.shard }}
    outputs:
      ci_predecessors: ${{ inputs.predecessors }}
      ci_source_sha: ${{ github.sha }}
      ci_run_id: ${{ github.run_id }}
      ci_attempt: ${{ github.run_attempt }}
      ci_unit_result: ${{ inputs.predecessor_result }}

    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        # Bound extension sections require actual no-follow source identity.
        # Test discovery alone does not prove their filesystem admission.
        # Canonical XKB controls below require xkbcli before their first use.
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y luajit lua-luv lua-filesystem sqlite3 libxkbcommon-tools xkb-data
          luajit -e 'assert(require("luv"), "native E2E luv integration is mandatory")'
          else
              exit 1
          fi
        timeout-minutes: 10

      # The virtual-keyboard harness, stubbed: this step runs on ubuntu-latest
      # against the pure-Lua hotstring engine — no real evdev device, no ydotool
      # injection. It is a corpus-driven replay of the engine's on_char() logic
      # layer, not an OS-level end-to-end test.
      #
      # Unit tests run independently. Within this E2E job, this step and
      # every harness after it run with `if: ${{ !cancelled() }}`: a red E2E still
      # lets the kernel, display and tray harnesses report what they measured,
      # while a run cancelled by a newer push stops at once instead of spending
      # minutes on results nobody reads, which `always()` did.
      - name: Run virtual-keyboard E2E harness (stubbed)
        if: ${{ !cancelled() && matrix.shard == 'input-display' }}
        # Exercises the hotstring engine against 8 hand-coded scenarios
        # and all shared corpus vectors (vectors.json).
        # Exit 0 = all pass, 1 = at least one failure.
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          set -euo pipefail
          luajit tests/e2e/run_e2e.lua | tee "$RUNNER_TEMP/linux-e2e.log"
          else
              exit 1
          fi
        timeout-minutes: 5

      # Separate preparation attempts cannot suppress another role's acquisition.
      # The original signed in-case checks and one-minute receiving clocks remain.
      - name: Prepare native GTK dependencies
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends libgtk-3-bin dbus-x11 xvfb x11-utils
          else
              exit 1
          fi
        timeout-minutes: 10

      - name: Prepare native process and compiler dependencies
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends build-essential curl libffi-dev liblua5.4-dev lua-luv lua5.4 meson ninja-build openssl pkg-config python3 strace
          else
              exit 1
          fi
        timeout-minutes: 10

      - name: Launch option-looking application ids through actual GTK desktop entries
        if: ${{ !cancelled() && matrix.shard == 'desktop-webview' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends libgtk-3-bin dbus-x11 xvfb x11-utils
          python3 tests/hardware/test_application_operand_diagnostics.py
          python3 tests/hardware/run_application_operand_receipts.py --evidence-dir "$RUNNER_TEMP/linux-application-operands"
          else
              exit 1
          fi
        timeout-minutes: 1

      - name: Terminate real descendants after their process leader exits
        if: ${{ !cancelled() && matrix.shard == 'platform-metrics' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends lua-luv lua5.4 curl openssl python3 strace build-essential meson ninja-build liblua5.4-dev libffi-dev pkg-config
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_process_groups.lua
          else
              exit 1
          fi
        timeout-minutes: 1

      - name: Reject real ENOSPC write and buffered-close failures
        if: ${{ !cancelled() && matrix.shard == 'platform-metrics' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_file_write_failures.lua
          else
              exit 1
          fi
        timeout-minutes: 1

      - name: Derive encryption keys from the actual D-Bus machine ID
        if: ${{ !cancelled() && matrix.shard == 'platform-metrics' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends dbus-x11 util-linux
          task_uid=$(id -u)
          task_gid=$(id -g)
          sudo unshare --mount --propagation private bash tests/hardware/run_machine_id_fallback_receipts.sh "$task_uid" "$task_gid"
          else
              exit 1
          fi
        timeout-minutes: 2

      - name: Reject unsuccessful at-rest cryptography receipts
        if: ${{ !cancelled() && matrix.shard == 'platform-metrics' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_openssl_exit_receipts.lua
          else
              exit 1
          fi
        timeout-minutes: 2

      - name: Reject unsuccessful native process supervision receipts
        if: ${{ !cancelled() && matrix.shard == 'platform-metrics' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_process_supervision_receipts.lua
          else
              exit 1
          fi
        timeout-minutes: 1

      - name: Refuse incomplete native diagnostics exports
        if: ${{ !cancelled() && matrix.shard == 'platform-metrics' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" python3 tests/hardware/run_diagnostics_save_receipts.py
          else
              exit 1
          fi
        timeout-minutes: 1

      - name: Preserve current SQLite device schema and its native readers
        if: ${{ !cancelled() && matrix.shard == 'platform-metrics' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_device_schema_receipts.lua
          else
              exit 1
          fi
        timeout-minutes: 1

      - name: Preserve native SQLite device registration and refused transactions
        if: ${{ !cancelled() && matrix.shard == 'platform-metrics' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_device_registration_receipts.lua
          else
              exit 1
          fi
        timeout-minutes: 1

      - name: Preserve SQLite event IDs across native collectors and invalid cursors
        if: ${{ !cancelled() && matrix.shard == 'platform-metrics' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_event_id_receipts.lua
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_event_id_cursor_receipts.lua
          else
              exit 1
          fi
        timeout-minutes: 2

      - name: Preserve literal SQLite filesystem paths through native CLI arguments
        if: ${{ !cancelled() && matrix.shard == 'platform-metrics' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_filesystem_paths.lua
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" lua5.4 tests/hardware/run_sqlite_filesystem_paths.lua
          else
              exit 1
          fi
        timeout-minutes: 1

      - name: Reject silent SQLite failures without staging typed SQL
        if: ${{ !cancelled() && matrix.shard == 'platform-metrics' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_write_receipts.lua
          else
              exit 1
          fi
        timeout-minutes: 1

      - name: Reject failed native SQLite migration and dashboard rows
        if: ${{ !cancelled() && matrix.shard == 'platform-metrics' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_read_receipts.lua
          else
              exit 1
          fi
        timeout-minutes: 1

      - name: Preserve actual SQLite metric literals and application filters
        if: ${{ !cancelled() && matrix.shard == 'platform-metrics' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_literal_receipts.lua
          else
              exit 1
          fi
        timeout-minutes: 1

      - name: Preserve native decrypted migration values and foreign ownership
        if: ${{ !cancelled() && matrix.shard == 'platform-metrics' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_text_migration_literal_receipts.lua
          else
              exit 1
          fi
        timeout-minutes: 1

      - name: Isolate SQLite from an actual disposable user's personal init
        if: ${{ !cancelled() && matrix.shard == 'platform-metrics' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          set -euo pipefail
          profile_user="ergopti_sqlite_${RANDOM}"
          # A new account cannot traverse the runner's private temporary parent.
          profile_home=$(mktemp -d /tmp/ergopti-sqlite-profile-XXXXXX)
          sudo useradd --user-group --no-create-home --home-dir "$profile_home" --shell /bin/sh "$profile_user"
          cleanup() {
            sudo userdel "$profile_user"
            sudo rm -rf -- "$profile_home"
          }
          trap cleanup EXIT
          # The fixture owns its source copy; private checkout permissions and
          # the caller's login home must not be changed for another account.
          sudo mkdir -p "$profile_home/source"
          sudo cp -a . "$profile_home/source/linux"
          sudo cp -a ../_shared "$profile_home/source/_shared"
          sudo install -m 600 tests/hardware/fixtures/sqlite_profile.conf "$profile_home/.sqliterc"
          sudo chown -R "$profile_user:$profile_user" "$profile_home"
          sudo chmod -R u+rwX,go-rwx "$profile_home"
          sudo runuser -u "$profile_user" -- sh -ec 'cd "$1"; exec env TMPDIR="$2" LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_init_receipts.lua' sh "$profile_home/source/linux" "$profile_home"
          else
              exit 1
          fi
        timeout-minutes: 1

      - name: Keep native shell capture failures free of caller text
        if: ${{ !cancelled() && matrix.shard == 'platform-metrics' }}
        working-directory: static/ergopti_plus/linux
        run: |
