	<body>
		<!-- Ergopti Studio's tabs: the editor, the comparison of layouts, and the optimizer. -->
		<nav class="studio-tabs" role="tablist">
			<button
				type="button"
				id="studio-tab-edit"
				role="tab"
				aria-selected="true"
				data-i18n="layout_editor.studio.tab.edit"
			></button>
			<button
				type="button"
				id="studio-tab-compare"
				role="tab"
				aria-selected="false"
				data-i18n="layout_editor.studio.tab.compare"
			></button>
			<button
				type="button"
				id="studio-tab-optimize"
				role="tab"
				aria-selected="false"
				data-i18n="layout_editor.studio.tab.optimize"
			></button>
		</nav>
		<main id="layout-editor" class="layout-editor"></main>
		<!-- The Comparer (_shared/ui/layout_analysis) mounts here when its tab first opens. -->
		<section id="studio-comparer" class="studio-comparer" hidden></section>
		<!-- The optimizer (_shared/ui/layout_optimizer) mounts here when its tab first opens. -->
		<section id="studio-optimizer" class="studio-optimizer" hidden></section>
