# exceeds the 7 s lease STOPPED timeout so the exact fence gets its full chance.
# HS: infra/termination_coordinator.lua request_user_exit deadline. Swift: the
# grace main.swift gives a leftover embedded runtime (LauncherTimings).
user_quit_deadline_ms = 12000

# How long a desktop notification stays up: long enough to read a sentence,
# short enough not to stack up during a burst of them. HS:
# infra/notifications.lua withdrawAfter and its owner retention. Linux:
