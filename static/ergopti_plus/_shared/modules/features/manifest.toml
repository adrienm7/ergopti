# ======= 4. Tap-hold reference =======
# =====================================
# =====================================

# Tap-hold defaults are NOT declared in this manifest. They live in their own
# template file (one source, generates per-driver config files at first boot):
#
#   _shared/tap_hold/defaults.toml
#
# Reason: tap_hold has its own schema (tap_hold.schema.json) with mutually
# exclusive ``hold_layer`` and ``hold_modifier`` constraints that don't fit the
# generic feature shape. The first-boot generator must call both sources:
#   1. This manifest → renders config.toml
#   2. tap_hold/defaults.toml → renders tap_hold.toml



# ================================================
# ================================================
# ======= 5. Tray menu structure (codegen) =======
# ================================================
# ================================================

# Source of truth for the cross-driver tray-menu tree. Hand-edited here; the
# codegen tools/build/build-menu-manifest.js emits _shared/modules/menu/
# menu_manifest.json from these [menu.*] tables, and a drift gate keeps the two
# in sync. Both drivers read the generated JSON at runtime (unchanged). Item
# types: toggle / feature / action / dynamic / group / section_header /
# letter_picker / "---" separator. platforms = ["ahk"|"hs"] gates per driver.

[menu]
# dynamic_hotstrings_order lived here and was read by nobody. The order that
# actually renders is _DYNAMIC_HOTSTRINGS_ORDER in windows/ui/tray_menu.ahk,
# which spells its separator "-" where this spelled it "---" — two sources for
# one order, disagreeing, one of them dead. Removed rather than reconciled: the
# live one is the one the menu uses, and a second copy that nothing reads is a
# trap for whoever edits it next expecting the menu to change.

[menu.gesture_slots]
2 = ["tap_2", "swipe_2_left", "swipe_2_right", "swipe_2_up", "swipe_2_down", "swipe_2_left_up", "swipe_2_right_up", "swipe_2_left_down", "swipe_2_right_down"]
3 = ["tap_3", "swipe_3_left", "swipe_3_right", "swipe_3_up", "swipe_3_down", "swipe_3_left_up", "swipe_3_right_up", "swipe_3_left_down", "swipe_3_right_down"]
4 = ["tap_4", "swipe_4_left", "swipe_4_right", "swipe_4_up", "swipe_4_down", "swipe_4_left_up", "swipe_4_right_up", "swipe_4_left_down", "swipe_4_right_down"]
5 = ["tap_5", "swipe_5_left", "swipe_5_right", "swipe_5_up", "swipe_5_down", "swipe_5_left_up", "swipe_5_right_up", "swipe_5_left_down", "swipe_5_right_down"]

