<!-- _shared/ui/personal_info_editor/index.html -->
<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<title data-i18n="editor.personal_info.window_title"></title>
		<script src="../a11y_prefs.js"></script>
		<script src="../page_locale.js"></script>
		<link rel="stylesheet" href="../theme.css" />
		<link rel="stylesheet" href="style.css" />
		<script src="../host_bridge.js"></script>
	</head>
	<body>
		<main>
			<h1 id="info-title" data-i18n="editor.personal_info.window_title"></h1>

			<!-- The rows, not a form: Save and Cancel act on a click, never on Enter. -->
			<div id="info-form">
				<div id="rows" role="group" aria-labelledby="info-title"></div>

				<footer class="btns">
					<button type="button" class="save" id="btn-save" data-i18n="common.save"></button>
					<button type="button" class="cancel" id="btn-cancel" data-i18n="common.cancel"></button>
				</footer>
			</div>
		</main>

		<script src="script.js"></script>
	</body>
</html>
