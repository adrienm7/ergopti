# ================================================
# ===== 3.5.5 shortcuts.key_combination_taps =====
# ================================================

# « Combinaisons de touches » on Windows: what a tap-hold key does on a tap while
# another one is held. A slot is keyed by its ordered pair of keys of
# [tap_hold.catalog], « first_then_second », and holds a catalogue action; its
# sibling section [shortcuts.key_combination_holds] holds what the second key
# holds instead (a value of [tap_hold.hold_picker]). Every ordered pair has both
# slots (windows/infra/key_combinations.ahk); only the pairs that ship a
# recommendation are declared here, the three chords the driver always had:
# AltGr then LAlt, AltGr then CapsLock, and LAlt then CapsLock. They were three
# sections of ten mutually exclusive booleans each, one per action, for those
# three pairs only and in that order only (2026-10-01).
[[features.shortcuts.key_combination_taps]]
