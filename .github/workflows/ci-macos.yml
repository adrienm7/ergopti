# .github/workflows/ci-macos.yml
#
# macOS lane: Unit -> (E2E and Build side by side) -> Test build -> Verdict.
# Build packages after Unit; the test build admits both E2E and Build, so the
# verdict still proves all four stages. Native roles stay parallel inside their
# authored stage matrices.
# Lua unit and stubbed engine E2E tests run on Ubuntu. Every macOS cell names
# its macOS version (tools/ci/macos-stage-roles.cjs HOSTS owns the runner
# labels and versions, and each cell's admission refuses a runner of another
# version): the E2E, launch and cold cells run on macOS 15 (Apple silicon
# macos-15, Intel macos-15-intel), Build on macOS 26 (macos-latest). The Swift
# launcher XCTest classes the E2E cells run on macOS 15 run again in Build on
# macOS 26: that repetition is deliberate cross-version coverage, not
# duplicated work; do not deduplicate it. The launch matrix installs the exact uploaded
# archive over the canonical user-state profile on Apple silicon and, for a
# release, Intel. The verdict checks every expected runner/scenario and commit.
# Parent ci.yml owns concurrency; this workflow must not cancel its caller.

name: macOS

on:
  workflow_call:
    inputs:
      release:
        description: True when ci.yml's plan resolved a free release tag
        required: true
        type: boolean
      version:
        description: Release version without the leading v; empty unless release, so the build stamps 0.0.0-dev
        required: true
        type: string
      tag:
        description: Exact release tag from the canonical plan; empty unless release
        required: true
        type: string
      prerelease:
        description: Exact prerelease string from the canonical plan; empty unless release
        required: true
        type: string
      channel:
        description: Sparkle update channel stamped into the app and the appcast, main or dev
        required: true
        type: string
    secrets:
      SPARKLE_PUBLIC_KEY:
        description: Sparkle EdDSA public key embedded as SUPublicEDKey; absent for fork pull requests
        required: false
      SPARKLE_ED_PRIVATE_KEY:
        description: Sparkle EdDSA private key that signs the declared release archives; passed on release runs only
        required: false
      MACOS_SIGNING_CERTIFICATE_BASE64:
        description: Self-signed code-signing .p12, base64; passed on release runs only
        required: false
      MACOS_SIGNING_CERTIFICATE_PASSWORD:
        description: Password of the code-signing .p12; passed on release runs only
        required: false

permissions:
  contents: read

jobs:
  # One row per domain group of static/ergopti_plus/macos/tests/support/
  # module_groups.lua (run.lua --module=<group>); the groups partition the
  # suite, so the rows together run every test module exactly once. The list
  # below must equal those groups, in order (test-macos-stage-roles.cjs).
  test-hs:
    name: Unit tests
    uses: ./.github/workflows/ci-macos-unit.yml
    with:
      release: ${{ inputs.release }}
      version: ${{ inputs.version }}
      tag: ${{ inputs.tag }}
      prerelease: ${{ inputs.prerelease }}
      channel: ${{ inputs.channel }}

  e2e-hs:
    name: E2E tests
    needs:
      - test-hs
    uses: ./.github/workflows/ci-macos-e2e.yml
    permissions:
      contents: read
      actions: read
    with:
      release: ${{ inputs.release }}
      version: ${{ inputs.version }}
      tag: ${{ inputs.tag }}
      prerelease: ${{ inputs.prerelease }}
      channel: ${{ inputs.channel }}
      e2e_metadata: ${{ needs.test-hs.outputs.e2e_metadata }}
      e2e_matrix: ${{ needs.test-hs.outputs.e2e_matrix }}
      predecessors: ${{ toJSON(needs) }}

  package-macos:
    name: Build
    needs:
      - test-hs
    uses: ./.github/workflows/ci-macos-build.yml
    permissions:
      contents: read
      actions: read
    with:
      release: ${{ inputs.release }}
      version: ${{ inputs.version }}
      tag: ${{ inputs.tag }}
      prerelease: ${{ inputs.prerelease }}
      channel: ${{ inputs.channel }}
      predecessors: ${{ toJSON(needs) }}
    secrets:
      SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
      MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
      MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}

  launch:
    name: Install and launch
    needs:
      - e2e-hs
      - package-macos
    uses: ./.github/workflows/ci-macos-install.yml
    with:
      release: ${{ inputs.release }}
      version: ${{ inputs.version }}
      tag: ${{ inputs.tag }}
      prerelease: ${{ inputs.prerelease }}
      channel: ${{ inputs.channel }}
      testbuild_metadata: ${{ needs.package-macos.outputs.testbuild_metadata }}
      testbuild_matrix: ${{ needs.package-macos.outputs.testbuild_matrix }}
      predecessors: ${{ toJSON(needs) }}

  macos-ok:
    name: Verdict
    needs:
      - launch
    if: always()
    uses: ./.github/workflows/ci-macos-verdict.yml
    with:
      release: ${{ inputs.release }}
      version: ${{ inputs.version }}
      tag: ${{ inputs.tag }}
      prerelease: ${{ inputs.prerelease }}
      channel: ${{ inputs.channel }}
      predecessors: ${{ toJSON(needs) }}
