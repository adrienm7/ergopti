# .github/workflows/ci-common.yml
#
# Common lane: the shared JavaScript, property, mutation and formatting suites,
# then browser E2E, then both production sites built, installed and judged.
# Each stage runs in a reusable workflow of its own (ci-common-<stage>.yml);
# its caller here keeps the stage job's id and hands it what it reads from
# the lane: the plan inputs, its predecessor's outputs and result. Parent
# ci.yml owns concurrency and awaits this entire lane before publication.

name: 'YAML, shared code & web'

on:
  workflow_call:
    inputs:
      common_plan:
        description: Complete source/ref-bound plan from the shallow formatter checkout
        required: true
        type: string
      release:
        description: True when the canonical plan resolved a release
        required: true
        type: boolean
      version:
        description: Exact release version, empty outside release
        required: true
        type: string
      tag:
        description: Exact release tag, empty outside release
        required: true
        type: string
      prerelease:
        description: Exact prerelease string from the canonical plan
        required: true
        type: string
      channel:
        description: Exact update channel from the canonical plan
        required: true
        type: string

permissions:
  contents: read

jobs:
  shared-validation:
    name: 'Unit tests'
    uses: ./.github/workflows/ci-common-unit.yml
    with:
      common_plan: ${{ inputs.common_plan }}
      release: ${{ inputs.release }}
      version: ${{ inputs.version }}
      tag: ${{ inputs.tag }}
      prerelease: ${{ inputs.prerelease }}
      channel: ${{ inputs.channel }}

  common-e2e:
    name: 'E2E tests'
    needs: [shared-validation]
    uses: ./.github/workflows/ci-common-e2e.yml
    permissions:
      contents: read
      actions: read
    with:
      common_plan: ${{ inputs.common_plan }}
      release: ${{ inputs.release }}
      version: ${{ inputs.version }}
      tag: ${{ inputs.tag }}
      prerelease: ${{ inputs.prerelease }}
      channel: ${{ inputs.channel }}
      predecessor_result: ${{ needs.shared-validation.result }}

  common-build:
    name: 'Build'
    needs: [common-e2e]
    uses: ./.github/workflows/ci-common-build.yml
    with:
      site_matrix: ${{ needs.common-e2e.outputs.site_matrix }}
      site_metadata: ${{ needs.common-e2e.outputs.site_metadata }}

  common-testbuild:
    name: 'Install and launch'
    needs: [common-build]
    uses: ./.github/workflows/ci-common-install.yml
    with:
      site_matrix: ${{ needs.common-build.outputs.site_matrix }}
      site_metadata: ${{ needs.common-build.outputs.site_metadata }}

  common-unit-verdict:
    name: 'Verdict'
    needs: [common-testbuild]
    if: always()
    uses: ./.github/workflows/ci-common-verdict.yml
    permissions:
      contents: read
      actions: read
    with:
      predecessor_result: ${{ needs.common-testbuild.result }}
