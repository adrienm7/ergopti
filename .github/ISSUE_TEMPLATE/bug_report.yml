# .github/ISSUE_TEMPLATE/bug_report.yml
#
# The form ErgoptiPlus opens from Debug > Report a bug. The app prefills the
# fields listed in static/ergopti_plus/_shared/modules/diagnostics/issue_templates.json
# by their `id`; tools/test/test-issue-templates.cjs keeps both in step.
# Labels live here because the URL's `labels=` parameter only applies to users
# with triage permission. GitHub drops a label the repository does not have, so
# each one must exist there (tools/test/test-issue-templates.cjs).

name: Bug report
description: Something in ErgoptiPlus does not work as expected.
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem in your own words. Debug > Report a bug fills in the version, the system, the driver and a compact diagnostic report (technical facts only); the app copies the complete report to the clipboard and saves it as a file too. The diagnostics window can also save a redacted copy of today's complete log beside it, only if you tick that box. The app never uploads either file: once you paste or attach one here it is on GitHub, and the app cannot remove it.
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: ErgoptiPlus version
      description: Shown in the About submenu.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1, Windows 11 24H2, Fedora Linux 41 (GNOME, Wayland)
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: Driver
      description: macos, windows or linux.
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Filled in by the app with technical facts only. When it is cut, a last line says the complete report is on your clipboard and in the saved file. Add relevant observations.
    validations:
      required: false
  - type: textarea
    id: day_log
    attributes:
      label: Day log (optional)
      description: Today's complete log file, optional. In the diagnostics window, tick the day log box before Report a bug and the app saves a redacted copy beside the report. Drop that file here, or paste its content. Leave this empty if you prefer not to share it.
    validations:
      required: false
