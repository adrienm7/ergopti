# static/ergopti_plus/_shared/modules/updater/constants.toml
#
# Cross-driver updater constants. AHK reads via lib/updater.ahk globals;
# Hammerspoon reads via lib/updater.lua at require-time.

[github]
owner = "adrienm7"
repo  = "ergopti"

[assets]
# Platform-specific release asset filenames.
windows = "ErgoptiPlus.exe"
macos   = "ErgoptiPlus.app.zip"

[timing]
# Default background check interval (seconds). 0 = disabled.
default_check_interval_sec = 86400
# First check after boot — cap so short presets still get a timely probe.
boot_check_delay_sec = 30

# User-facing frequency presets (display order). Code keys map to i18n
# menu.about.frequency.<code> on both drivers.
[[interval_presets]]
code    = "1m"
seconds = 60

[[interval_presets]]
code    = "5m"
seconds = 300

[[interval_presets]]
code    = "10m"
seconds = 600

[[interval_presets]]
code    = "1h"
seconds = 3600

[[interval_presets]]
code    = "2h"
seconds = 7200

[[interval_presets]]
code    = "3h"
seconds = 10800

[[interval_presets]]
code    = "6h"
seconds = 21600

[[interval_presets]]
code    = "12h"
seconds = 43200

[[interval_presets]]
code    = "24h"
seconds = 86400

[[interval_presets]]
code    = "2d"
seconds = 172800

[[interval_presets]]
code    = "7d"
seconds = 604800

[[interval_presets]]
code    = "never"
seconds = 0