# static/shared/actions.toml
#
# Source de vérité unique pour les actions de gestes.
# Lue par Hammerspoon (modules/gestures/actions.lua) et AutoHotkey
# (modules/gestures.ahk) au démarrage pour construire la liste ordonnée
# du picker et valider les noms d'actions.
#
# platform : "all" | "hs" | "ahk"
#   "all" — disponible sur les deux plateformes
#   "hs"  — macOS / Hammerspoon uniquement
#   "ahk" — Windows / AutoHotkey uniquement
#
# type : "sg" (action ponctuelle) | "ax" (axe continu)
#
# Les séparateurs "--" et les titres "#Titre" dans [sg_order] / [ax_order]
# sont des directives de mise en forme pour le picker — pas des actions.


