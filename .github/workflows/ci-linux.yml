          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends luajit lua-luv glib-networking gsettings-desktop-schemas
          else
              exit 1
          fi
        timeout-minutes: 20

      # This lane qualifies native runtime admission and installed helper paths.
      # Its four actual groups are distinct from factory models and HTTP receipts.
      - name: Qualify native managed network runtime
        if: ${{ !cancelled() && matrix.shard == 'network-ai' }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          set -euo pipefail
          npm run test:linux:network-runtime | tee "$RUNNER_TEMP/linux-network-runtime.log"
          else
              exit 1
          fi
        timeout-minutes: 3
      # Independent NIST vectors use retained, already unlinked descriptors.
      - name: Qualify native retained FD SHA-256
        if: ${{ !cancelled() && matrix.shard == 'network-ai' }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] linux-e2e-suite: qualified=false; no suite assertion count is claimed."
          elif [ "$mode" = full ]; then
          set -euo pipefail
          npm run --silent test:linux:fd-sha256-native | tee "$RUNNER_TEMP/linux-fd-sha256-native.log"
          else
              exit 1
          fi
        timeout-minutes: 3

      # Tool admissions are private and scoped; product curl remains unchanged.
      - name: Prepare authenticated managed HTTP validation tools
        if: ${{ !cancelled() && matrix.shard == 'network-ai' }}
