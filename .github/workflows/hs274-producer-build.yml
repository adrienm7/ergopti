# .github/workflows/hs274-producer-build.yml
name: HS-274 producer development build
on:
  workflow_dispatch:
    inputs:
      raw_capture:
        description: Instrument a bounded pre-normalization capture of the owned fixture
        type: boolean
        default: false
      stream_capture:
        description: Add the experimental peer-owned stream and CLI (requires raw_capture)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hs274-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PQRS_ORG_CODE_SIGN_IDENTITY: dummy
      PQRS_ORG_INSTALLER_CODE_SIGN_IDENTITY: dummy
    steps:
      - name: Reject incomplete stream mode selection
        if: inputs.stream_capture && !inputs.raw_capture
        run: exit 1
      - name: Acquire the inspected remapper sources
        uses: actions/checkout@v4
        with:
          repository: pqrs-org/Karabiner-Elements
          ref: 9312593e1a3bf72b94c63c524ebabe2637442e8a
          submodules: recursive
          persist-credentials: false
      - name: Select the upstream CI compiler
        run: sudo xcode-select -s /Applications/Xcode_26.0.app
      - name: Acquire the owned capture instrumentation
        if: inputs.raw_capture
        uses: actions/checkout@v4
        with:
          path: .hs274-probe
          persist-credentials: false
      - name: Verify and apply the bounded capture instrumentation
        if: inputs.raw_capture
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread .hs274-probe/tools/diagnostics/hs274-raw-capture-test.cpp -o "$RUNNER_TEMP/hs274-raw-capture-test"
          "$RUNNER_TEMP/hs274-raw-capture-test"
          python3 .hs274-probe/tools/diagnostics/hs274_origin_test.py
          c++ -std=c++17 -Wall -Wextra -Werror .hs274-probe/tools/diagnostics/hs274-stream-session-test.cpp -o "$RUNNER_TEMP/hs274-stream-session-test"
          "$RUNNER_TEMP/hs274-stream-session-test"
          capture_flags=()
          if [[ "${{ inputs.stream_capture }}" == "true" ]]; then
            c++ -std=c++17 -Wall -Wextra -Werror -I vendor/vendor/include .hs274-probe/tools/diagnostics/hs274-stream-inventory-test.cpp -o "$RUNNER_TEMP/hs274-stream-inventory-test"
            "$RUNNER_TEMP/hs274-stream-inventory-test" .hs274-probe/tools/diagnostics/fixtures/hs274-native-inventories.json
            c++ -std=c++17 -Wall -Wextra -Werror -I vendor/vendor/include .hs274-probe/tools/diagnostics/hs274-key-state-test.cpp -o "$RUNNER_TEMP/hs274-key-state-test"
            "$RUNNER_TEMP/hs274-key-state-test" .hs274-probe/tools/diagnostics/fixtures/hs274-native-cookie-capture.json .hs274-probe/tools/diagnostics/fixtures/hs274-native-cookie-held.json
            c++ -std=c++17 -Wall -Wextra -Werror -I vendor/vendor/include .hs274-probe/tools/diagnostics/hs274-stream-clock-test.cpp -o "$RUNNER_TEMP/hs274-stream-clock-test"
            "$RUNNER_TEMP/hs274-stream-clock-test"
            c++ -std=c++17 -Wall -Wextra -Werror -I vendor/vendor/include .hs274-probe/tools/diagnostics/hs274-stream-protocol-test.cpp -o "$RUNNER_TEMP/hs274-stream-protocol-test"
            "$RUNNER_TEMP/hs274-stream-protocol-test" .hs274-probe/tools/diagnostics/fixtures/hs274-native-capture.json
            c++ -std=c++17 -Wall -Wextra -Werror -I vendor/vendor/include .hs274-probe/tools/diagnostics/hs274-stream-source-test.cpp -o "$RUNNER_TEMP/hs274-stream-source-test"
            "$RUNNER_TEMP/hs274-stream-source-test"
            capture_flags+=(--stream)
          fi
          python3 .hs274-probe/tools/diagnostics/hs274_raw_patch.py "$PWD" "${capture_flags[@]}"
          git diff --check
          git diff -- src/share src/apps/CoreService/include/core_service src/bin/cli/src/main.cpp vendor/vendor/include/pqrs/unix_domain_stream/server.hpp vendor/vendor/include/asio/detail/impl/socket_ops.ipp > "$RUNNER_TEMP/hs274-producer-patch.diff"
          cp src/share/hs274-raw-capture.hpp "$RUNNER_TEMP/hs274-producer-capture.hpp"
          if [[ "${{ inputs.stream_capture }}" == "true" ]]; then
            cp src/share/hs274-key-element.hpp "$RUNNER_TEMP/hs274-producer-hs274-key-element.hpp"
            cp src/share/hs274-key-state.hpp "$RUNNER_TEMP/hs274-producer-hs274-key-state.hpp"
            for header in src/share/hs274-stream-*.hpp; do
              cp "$header" "$RUNNER_TEMP/hs274-producer-$(basename "$header")"
            done
          fi
      - name: Install the project generator
        run: brew install xcodegen
      - name: Prepare shared build inputs once
        run: |
          bash scripts/check-env.sh
          python3 scripts/update_version.py
          make -C vendor build
      - name: Build the core and both IPC clients sequentially
        run: |
          for component in apps/CoreService apps/ConsoleUserServer bin/cli; do
            (
              cd "src/$component"
              xcodegen generate
              xcodebuild -configuration Release -alltargets -jobs 2 SYMROOT="$PWD/build"
            )
          done
      - name: Verify the actual CLI clock capability
        if: inputs.stream_capture
        run: |
          src/bin/cli/build/Release/karabiner_cli --hs274-clock > "$RUNNER_TEMP/hs274-producer-clock.json"
          PYTHONPATH=.hs274-probe/tools/diagnostics python3 -c 'import json, os; from hs274_hammerspoon import read_clock; read_clock(json.load(open(os.environ["RUNNER_TEMP"] + "/hs274-producer-clock.json")))'
      - name: Verify and retain the development artifacts
        run: |
          products=(
            src/apps/CoreService/build/Release/Karabiner-Core-Service.app
            src/apps/ConsoleUserServer/build/Release/Karabiner-Console-User-Server.app
            src/bin/cli/build/Release/karabiner_cli
          )
          for product in "${products[@]}"; do
            test -e "$product"
            codesign --verify --strict "$product"
            codesign --display --verbose=4 "$product" 2>> "$RUNNER_TEMP/hs274-producer-signatures.log"
          done
          tar -czf "$RUNNER_TEMP/hs274-producer-build.tar.gz" "${products[@]}"
          shasum -a 256 "$RUNNER_TEMP/hs274-producer-build.tar.gz" > "$RUNNER_TEMP/hs274-producer-build.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/hs274-producer-source.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hs274-producer-build-${{ github.sha }}
          path: ${{ runner.temp }}/hs274-producer-*
          if-no-files-found: warn
          retention-days: 7
