# .github/workflows/probe-macos-tsm.yml
#
# Temporary diagnostic probe (removed before the checkpoint): reproduces the
# native keyboard-source refusal by stopping the text-input UI server, and
# checks whether App Translocation can be produced on a hosted runner.

name: probe-macos-tsm

permissions:
  contents: read

on:
  push:
    branches: [claude/ergopti-todo-ci-acceptance-3]
    paths: ['.github/workflows/probe-macos-tsm.yml', 'tools/diagnostics/probe_*']

jobs:
  tsm:
    name: TSM probe (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Discover the owner of com.apple.tsm.uiserver
        run: |
          set -x
          uid="$(id -u)"
          sw_vers; uname -m
          spctl --status || true
          grep -l -r "tsm" /System/Library/LaunchAgents /System/Library/LaunchDaemons 2>/dev/null || true
          grep -l -r "com.apple.tsm.uiserver" /System/Library/LaunchAgents 2>/dev/null || true
          for plist in $(grep -l -r "tsm.uiserver" /System/Library/LaunchAgents 2>/dev/null); do plutil -p "$plist"; done
          launchctl print "gui/$uid" | grep -n -i -E "tsm|TextInput|SystemUIServer" || true
          for label in com.apple.TextInputMenuAgent com.apple.TextInputSwitcher com.apple.SystemUIServer.agent; do
            launchctl print "gui/$uid/$label" | head -70 || true
          done
          pgrep -lf "TextInput|SystemUIServer|imklaunch|TISwitcher|universalaccess" || true
          python3 tools/diagnostics/probe_tsm_port.py
      - name: Build the launcher tests
        run: swift build --build-tests --package-path static/ergopti_plus/macos/launcher --scratch-path "$RUNNER_TEMP/swift" 2>&1 | tail -n 5
      - name: Cohort baseline, stopped server, resumed server, killed server
        env:
          CI: 'true'
        run: |
          set -u
          uid="$(id -u)"
          cohort() {
            local name="$1"
            echo "::group::cohort $name"
            python3 tools/diagnostics/probe_tsm_port.py
            export ERGOPTI_TIS_EVIDENCE_DIR="$(mktemp -d "$RUNNER_TEMP/tis-$name.XXXXXX")"
            export ERGOPTI_TIS_EVIDENCE_SESSION="$(openssl rand -hex 32)"
            script -q /dev/null swift test --skip-build --package-path static/ergopti_plus/macos/launcher \
              --scratch-path "$RUNNER_TEMP/swift" --filter '(^|[.])NumberRowSourceProbeTests([/.]|$)' 2>&1 \
              | tee "$RUNNER_TEMP/cohort-$name.log" | grep -E "TSM|CFMessagePort|error:|Executed|failed \(|passed \(" || true
            echo "::endgroup::"
            echo "SUMMARY $name: $(grep -c 'CFMessagePortSendRequest FAILED' "$RUNNER_TEMP/cohort-$name.log") tsm lines; $(grep -E 'Executed [0-9]+ tests' "$RUNNER_TEMP/cohort-$name.log" | tail -n 1)"
          }
          owner_pid() {
            launchctl print "gui/$uid/$1" 2>/dev/null | sed -n 's/^[[:space:]]*pid = \([0-9]*\)$/\1/p' | head -n 1
          }
          cohort baseline
          for label in com.apple.TextInputMenuAgent com.apple.SystemUIServer.agent com.apple.TextInputSwitcher; do
            pid="$(owner_pid "$label")"
            echo "label=$label pid=${pid:-none}"
            test -n "$pid" || continue
            kill -STOP "$pid"
            ps -o pid,stat,comm -p "$pid"
            cohort "stopped-$label"
            kill -CONT "$pid"
            cohort "resumed-$label"
          done
          pid="$(owner_pid com.apple.TextInputMenuAgent)"
          if [ -n "$pid" ]; then
            kill -KILL "$pid"
            cohort killed-TextInputMenuAgent
            sleep 5
            echo "after kill: $(owner_pid com.apple.TextInputMenuAgent)"
            cohort killed-respawn-TextInputMenuAgent
          fi
          bash tools/diagnostics/macos_text_input_agents.sh "$RUNNER_TEMP/agents.txt" after || true
          cat "$RUNNER_TEMP/agents.txt" | head -n 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-tsm-${{ matrix.runner }}
          path: ${{ runner.temp }}/cohort-*.log

  translocation:
    name: Translocation probe (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v4
      - name: Translocate a quarantined ad hoc application
        run: python3 tools/diagnostics/probe_translocation.py
