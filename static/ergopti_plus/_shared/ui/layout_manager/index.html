<!-- _shared/ui/layout_manager/index.html -->
<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<title data-i18n="layout_manager.window_title"></title>
		<link rel="stylesheet" href="../theme.css" />
		<link rel="stylesheet" href="style.css" />
		<link rel="stylesheet" href="../layout_composer/composer.css" />
		<link rel="stylesheet" href="../layout_editor/style.css" />
		<script src="../host_bridge.js"></script>
		<script src="../layout_composer/_generated/composer_data.js"></script>
		<script src="../layout_composer/reference_layouts.js"></script>
		<script src="../layout_composer/composer_model.js"></script>
		<script src="../layer_editor/_generated/layer_data.js"></script>
		<script src="../layer_editor/layer_model.js"></script>
		<script src="../layout_composer/source_model.js"></script>
		<script src="../layout_composer/source_compiler.js"></script>
		<script src="../layout_editor/_generated/key_tables.js"></script>
		<script src="../layout_editor/zip_writer.js"></script>
		<script src="../layout_editor/toml_prelude.js"></script>
		<script src="../vendor/smol-toml.js"></script>
		<script src="../layout_editor/source_io.js"></script>
		<script src="../layout_editor/editor_model.js"></script>
		<script src="../layout_editor/editor_page.js"></script>
	</head>
	<body>
		<div id="layout-view">
			<h1 data-i18n="layout_manager.window_title"></h1>
			<p class="subtitle" data-i18n="layout_manager.subtitle"></p>

			<div class="toolbar">
				<p id="catalogue-status" class="catalogue-status" role="status"></p>
				<button
					type="button"
					id="btn-compose"
					class="secondary"
					data-i18n="layout_composer.btn_open"
				></button>
				<button
					type="button"
					id="btn-editor"
					class="secondary"
					hidden
					data-i18n="layout_editor.open_from_manager"
				></button>
				<button
					type="button"
					id="btn-refresh"
					class="secondary"
					data-i18n="layout_manager.btn_refresh"
				></button>
			</div>

			<p id="result" class="result" role="alert" hidden></p>

			<ul id="layout-list" class="layout-list"></ul>
			<p id="empty" class="empty" data-i18n="layout_manager.empty" hidden></p>

			<div class="btns">
				<button
					type="button"
					id="btn-close"
					class="secondary"
					data-i18n="layout_manager.btn_close"
				></button>
			</div>
		</div>

		<section id="composer" class="composer" hidden>
			<div class="composer-body">
				<h1 data-i18n="layout_composer.title"></h1>
				<p class="subtitle" data-i18n="layout_composer.subtitle"></p>

				<div class="composer-row">
					<label
						class="composer-label"
						for="composer-name"
						data-i18n="layout_composer.name"
					></label>
					<input type="text" id="composer-name" maxlength="64" />
					<select id="composer-form">
						<option value="iso" data-i18n="layout_composer.keyboard_iso"></option>
						<option value="ansi" data-i18n="layout_composer.keyboard_ansi"></option>
					</select>
					<span
						id="composer-active"
						class="badge badge-active"
						hidden
						data-i18n="layout_composer.active"
					></span>
				</div>

				<h2 data-i18n="layout_composer.section_layers"></h2>
				<div id="composer-layers"></div>

				<h2 data-i18n="layout_composer.section_shortcuts"></h2>
				<p
					id="composer-shortcuts-note"
					class="note"
					hidden
					data-i18n="layout_composer.shortcuts_unsupported"
				></p>
				<div id="composer-shortcuts"></div>

				<h2 data-i18n="layout_composer.section_keys"></h2>
				<div id="composer-tabs" class="composer-tabs"></div>
				<div id="composer-board" class="composer-board"></div>
				<div id="composer-key-editor" class="composer-key-editor" hidden></div>
			</div>

			<div class="composer-footer">
				<ul id="composer-problems" class="composer-problems" hidden></ul>
				<p id="composer-result" class="result" role="alert" hidden></p>

				<div class="btns">
					<button
						type="button"
						id="composer-back"
						class="secondary"
						data-i18n="layout_composer.btn_back"
					></button>
					<button
						type="button"
						id="composer-remove"
						class="danger"
						data-i18n="layout_composer.btn_remove"
					></button>
					<button
						type="button"
						id="composer-save"
						class="secondary"
						data-i18n="layout_composer.btn_save"
					></button>
					<button
						type="button"
						id="composer-save-use"
						data-i18n="layout_composer.btn_save_use"
					></button>
				</div>
			</div>
		</section>

		<main id="layout-editor" class="layout-editor" hidden></main>

		<script src="script.js"></script>
		<script src="../layout_composer/composer_page.js"></script>
	</body>
</html>
