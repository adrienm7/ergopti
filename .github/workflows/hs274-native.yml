# .github/workflows/hs274-native.yml
name: HS-274 native capability observation
on:
  workflow_dispatch:
    inputs:
      development_build:
        description: Run the verified development core and both matching IPC clients
        type: boolean
        default: false
      ignored_fixture:
        description: Observe ignored input while Escape and Space retain their physical output
        type: boolean
        default: false
      baseline_fixture:
        description: Probe held Space before core startup (requires development build)
        type: boolean
        default: false
      baseline_source:
        description: Explicit acquisition source for the held fixture only
        type: choice
        options:
          - forced
          - kernel
        default: forced
permissions:
  contents: read
  actions: read
concurrency:
  group: hs274-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev'
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify process isolation verdicts before native setup
        run: |
          python3 tools/diagnostics/hs274_services_test.py
          python3 tools/diagnostics/hs274_capture_test.py
          python3 tools/diagnostics/hs274_stream_test.py
      - name: Select development mode before acquiring its artifacts
        if: inputs.development_build
        run: echo "HS274_DEVELOPMENT_ROOT=$RUNNER_TEMP/hs274-development-runtime" >> "$GITHUB_ENV"
      - name: Download the previously verified development build
        if: inputs.development_build
        uses: actions/download-artifact@v4
        with:
          name: hs274-producer-build-7d9f12f08c7e7a398aa484abd0e0714d91f07eec
          run-id: 34707161542
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/hs274-development-download
      - name: Verify and select the complete development runtime
        if: inputs.development_build
        run: |
          archive="$RUNNER_TEMP/hs274-development-download/hs274-producer-build.tar.gz"
          printf '%s  %s\n' 70b5a115451fbd1be62d9b9d3c331aa1fde1a97eaa8352ceb006ccf72cbd2b72 "$archive" | shasum -a 256 --check
          root="$RUNNER_TEMP/hs274-development-runtime"
          mkdir "$root"
          tar -xzf "$archive" -C "$root"
          products=(
            "$root/src/apps/CoreService/build/Release/Karabiner-Core-Service.app"
            "$root/src/apps/ConsoleUserServer/build/Release/Karabiner-Console-User-Server.app"
            "$root/src/bin/cli/build/Release/karabiner_cli"
          )
          for product in "${products[@]}"; do
            codesign --verify --strict "$product"
            codesign --display --verbose=4 "$product" 2>> "$RUNNER_TEMP/hs274-development-signatures.log"
          done
      - name: Compile native Quartz observation
        id: compile
        run: swiftc -swift-version 5 tools/diagnostics/hs274-native.swift -o "$RUNNER_TEMP/hs274-native"
      - name: Observe event provenance and access capabilities
        run: '"$RUNNER_TEMP/hs274-native" "$RUNNER_TEMP/hs274-native.json"'
      - name: Observe capabilities as root on the disposable runner
        if: always() && steps.compile.outcome == 'success'
        run: sudo -n "$RUNNER_TEMP/hs274-native" "$RUNNER_TEMP/hs274-native-root.json"
      - name: Compile HID acquisition observation
        if: always()
        id: compile-hid
        run: clang -std=c11 -Wall -Wextra -Werror tools/diagnostics/hs274-hid-device.c -framework CoreFoundation -framework IOKit -o "$RUNNER_TEMP/hs274-hid-device"
      - name: Observe virtual HID acquisition without input reports
        if: always() && steps.compile-hid.outcome == 'success'
        run: |
          "$RUNNER_TEMP/hs274-hid-device" "$RUNNER_TEMP/hs274-hid-device.json"
          sudo -n "$RUNNER_TEMP/hs274-hid-device" "$RUNNER_TEMP/hs274-hid-device-root.json"
          sudo -n log show --last 1m --style compact --predicate 'eventMessage CONTAINS "hs274-hid"' > "$RUNNER_TEMP/hs274-hid-access.log"
      - name: Verify and install the official remapper and signed HID provider
        if: always()
        id: install-provider
        timeout-minutes: 3
        run: |
          curl --fail --location --max-time 90 --output "$RUNNER_TEMP/hs274-karabiner.dmg" https://github.com/pqrs-org/Karabiner-Elements/releases/download/v16.3.0/Karabiner-Elements-16.3.0.dmg
          printf '%s  %s\n' 19cce7bed3d48a722242ca683bd1bae406b6a87fed520728d1c91dee175b75e4 "$RUNNER_TEMP/hs274-karabiner.dmg" | shasum -a 256 --check
          mkdir "$RUNNER_TEMP/hs274-karabiner-volume"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/hs274-karabiner-volume" "$RUNNER_TEMP/hs274-karabiner.dmg" > "$RUNNER_TEMP/hs274-provider-mount.log"
          trap 'hdiutil detach -quiet "$RUNNER_TEMP/hs274-karabiner-volume"' EXIT
          pkgutil --check-signature "$RUNNER_TEMP/hs274-karabiner-volume/Karabiner-Elements.pkg" > "$RUNNER_TEMP/hs274-provider-signature.log"
          sudo -n installer -pkg "$RUNNER_TEMP/hs274-karabiner-volume/Karabiner-Elements.pkg" -target / > "$RUNNER_TEMP/hs274-provider-install.log" 2>&1
      - name: Compile the verified-control Quartz click probe
        if: always() && steps.install-provider.outcome == 'success'
        id: compile-provider-click
        run: clang -std=c11 -Wall -Wextra -Werror tools/diagnostics/hs274-provider-click.c -framework CoreGraphics -framework CoreFoundation -o "$RUNNER_TEMP/hs274-provider-click"
      - name: Observe signed provider activation without input reports
        id: activate-provider
        if: always() && steps.install-provider.outcome == 'success' && steps.compile-provider-click.outcome == 'success'
        timeout-minutes: 4
        run: python3 tools/diagnostics/hs274-provider.py
      - name: Acquire the pinned official provider client headers
        if: always() && steps.activate-provider.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: pqrs-org/Karabiner-DriverKit-VirtualHIDDevice
          ref: bdfcb459b2eaca8ccda680a73b0dc898f330f4bb
          path: .hs274-provider-sdk
          persist-credentials: false
      - name: Compile the native HID stream observation
        if: always() && steps.activate-provider.outcome == 'success'
        id: compile-hid-stream
        run: clang++ -std=c++23 -Wall -Wextra -Werror -isystem .hs274-provider-sdk/include -isystem .hs274-provider-sdk/vendor/vendor/include tools/diagnostics/hs274-hid-stream.cpp -framework ApplicationServices -framework IOKit -o "$RUNNER_TEMP/hs274-hid-stream"
      - name: Observe a released Space pair through the signed HID provider
        if: always() && steps.compile-hid-stream.outcome == 'success'
        timeout-minutes: 1
        run: |
          sudo -n '/Library/Application Support/org.pqrs/Karabiner-DriverKit-VirtualHIDDevice/Applications/Karabiner-VirtualHIDDevice-Daemon.app/Contents/MacOS/Karabiner-VirtualHIDDevice-Daemon' > "$RUNNER_TEMP/hs274-provider-daemon.log" 2>&1 &
          daemon_pid=$!
          trap 'sudo -n kill "$daemon_pid" 2>/dev/null || true; wait "$daemon_pid" || true' EXIT
          sudo -n env GITHUB_ACTIONS=true "$RUNNER_TEMP/hs274-hid-stream" "$RUNNER_TEMP/hs274-hid-stream.json"
      - name: Observe the signed remapper's native permission checks
        if: always() && steps.install-provider.outcome == 'success'
        timeout-minutes: 1
        run: python3 tools/diagnostics/hs274-core.py
      - name: Observe actual Escape and Space remapping from the owned input
        if: always() && steps.install-provider.outcome == 'success' && steps.compile-hid-stream.outcome == 'success'
        timeout-minutes: 3
        env:
          HS274_IGNORED_FIXTURE: ${{ inputs.ignored_fixture }}
          HS274_BASELINE_FIXTURE: ${{ inputs.baseline_fixture }}
          HS274_BASELINE_SOURCE: ${{ inputs.baseline_source }}
        run: python3 tools/diagnostics/hs274-remap.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hs274-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hs274-*.json
            ${{ runner.temp }}/hs274-hid-access.log
            ${{ runner.temp }}/hs274-provider-*.log
            ${{ runner.temp }}/hs274-development-signatures.log
            ${{ runner.temp }}/hs274-remap-*.log
            ${{ runner.temp }}/hs274-provider-settings.png
          if-no-files-found: error
