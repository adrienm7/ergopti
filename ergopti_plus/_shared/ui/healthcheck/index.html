<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title data-i18n="menu.debug.healthcheck"></title>
		<link rel="stylesheet" href="../theme.css" />
		<link rel="stylesheet" href="style.css" />
		<script src="../dom_utils.js"></script>
		<script src="../host_bridge.js"></script>
		<script src="../i18n.js"></script>
		<script src="../redact.js"></script>
		<script src="model.js"></script>
		<script src="checks.js"></script>
	</head>
	<body>
		<header class="toolbar">
			<div class="buttons">
				<div class="toolbar-left">
					<button
						type="button"
						id="btn-open-logs"
						disabled
						data-i18n="healthcheck.toolbar.open_logs"
					></button>
				</div>
				<div id="collection-controls">
					<button
						type="button"
						id="btn-collect-windows"
						data-i18n="healthcheck.collection.start"
						disabled
					></button>
					<button
						type="button"
						id="btn-collection-cancel"
						data-i18n="common.cancel"
						hidden
					></button>
					<button
						type="button"
						id="btn-collection-guided"
						data-i18n="healthcheck.collection.guided"
						hidden
					></button>
					<button
						type="button"
						id="btn-collection-skip"
						data-i18n="healthcheck.collection.skip"
						hidden
					></button>
					<button
						type="button"
						id="btn-collection-open"
						data-i18n="healthcheck.collection.open"
						hidden
					></button>
					<p id="collection-progress" role="status" aria-live="polite"></p>
				</div>
				<div class="toolbar-center">
					<button
						type="button"
						id="btn-copy"
						disabled
						data-i18n="healthcheck.toolbar.copy"
					></button>
					<button
						type="button"
						id="btn-save"
						disabled
						data-i18n="healthcheck.toolbar.save"
					></button>
					<button
						type="button"
						id="btn-report"
						class="primary"
						disabled
						data-i18n="healthcheck.toolbar.report"
					></button>
				</div>
				<div class="toolbar-right">
					<button type="button" id="btn-cancel" disabled data-i18n="common.cancel"></button>
					<button
						type="button"
						id="btn-refresh"
						disabled
						data-i18n="healthcheck.toolbar.refresh"
					></button>
				</div>
			</div>
			<label class="details">
				<input type="checkbox" id="chk-details" disabled />
				<span data-i18n="healthcheck.details_checkbox"></span>
			</label>
			<label class="details">
				<input type="checkbox" id="chk-extensive" disabled />
				<span data-i18n="healthcheck.deep_tests_checkbox"></span>
			</label>
			<section id="day-log" class="day-log">
				<label class="details">
					<input type="checkbox" id="chk-day-log" disabled />
					<span data-i18n="healthcheck.day_log.checkbox"></span>
				</label>
				<p class="hint" data-i18n="healthcheck.day_log.hint"></p>
				<p class="hint" data-i18n="healthcheck.day_log.upload_notice"></p>
				<p id="day-log-status" role="status" aria-live="polite"></p>
				<details id="day-log-preview" hidden>
					<summary data-i18n="healthcheck.day_log.preview_title"></summary>
					<pre id="day-log-preview-text"></pre>
				</details>
			</section>
			<p id="deep-progress" role="status" aria-live="polite"></p>
			<pre id="deep-results"></pre>
			<p id="status" class="status info" role="status" aria-live="polite"></p>
		</header>
		<main id="content"></main>
		<details id="preview">
			<summary data-i18n="healthcheck.preview.title"></summary>
			<p class="hint" data-i18n="healthcheck.preview.hint"></p>
			<pre id="preview-text"></pre>
		</details>
		<script src="script.js"></script>
	</body>
</html>
