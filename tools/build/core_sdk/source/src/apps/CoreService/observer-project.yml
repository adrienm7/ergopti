      - path: ../../../vendor/vendor/src/pqrs/osx/cg_event
      - path: ../../../vendor/vendor/src/pqrs/osx/process_info
      - path: ../../../vendor/vendor/src/pqrs/osx/workspace
    dependencies:
      - sdk: Carbon.framework
      - sdk: AppKit.framework
