# the row IN THE DRIVER, so the manifest would describe the slot while the driver
# still built the menu. A `list` provider returns row DATA and the shared
# renderer materialises it, which is the only shape that actually moves a row out
# of the driver — see the header of tools/test/test-menu-rows-outside-renderer.cjs,
# which records that a `list` migration is the only kind that has ever lowered
# that count.
#
# Its four rows were hand-built in linux/ui/menu/menu_builder.lua until
