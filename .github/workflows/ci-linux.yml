      # capture".
      #
      # Here the events make a round trip: written to /dev/uinput, published on
      # an input node, found by the driver's own finder, opened by its own
      # reader, decoded by its own decoder. The struct layout, the ioctl numbers,
      # the slot semantics and the non-blocking read are all the kernel's, and
      # those are exactly what a hand-written table cannot check.
      - name: A gesture written to uinput comes back as a gesture
        # Not skipped when an earlier harness fails. These are independent
        # diagnostics, and letting the first failure hide the others' answers is
        # how a run comes back saying less than it measured — the page-error trap
        # below was skipped on its first outing for exactly that reason, so its
        # question went unanswered for a whole cycle.
        if: ${{ !cancelled() && matrix.shard == 'input-display' }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-linux-e2e-suite.json"
          node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope linux-e2e-suite --validate-scope-receipt "$receipt")"
