# _shared/tests/corpus/config_migration_registries/import_companion_file_path.toml
#
# A companion is named bare: a path would let the registry reach a file
# outside the driver's configuration folder.

[registry]
current_version = 2
unstamped_version = 1

[steps.v1_to_v2]
from = 1
to = 2
drivers = ["ahk", "hs", "linux"]
reason = "Defect: an import names its companion by a path."
ops = [{ op = "import_companion", file = "../tap_hold.toml", section = "tap_hold", to_section = "tap_holds" }]
