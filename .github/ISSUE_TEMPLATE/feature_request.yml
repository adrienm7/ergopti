# .github/ISSUE_TEMPLATE/feature_request.yml
#
# The form ErgoptiPlus opens from Debug > Suggest a feature, with the fields of
# static/ergopti_plus/_shared/diagnostics/data/issue_templates.json
# prefilled by their `id` (pinned by tools/test/test-issue-templates.cjs).
# Only the title and the proposal are required: the version, driver and system
# stay, prefilled and optional, so an idea from an old version that already has
# the feature can be answered at once.

name: Feature request
description: Suggest an idea or an improvement.
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: proposal
    attributes:
      label: Your proposal
      description: What you would like ErgoptiPlus to do, and what it would make easier.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ErgoptiPlus version
    validations:
      required: false
  - type: dropdown
    id: driver
    attributes:
      label: Driver
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: false
