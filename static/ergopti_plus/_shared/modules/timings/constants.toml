# ──────────────────────────────────────────────────────────────────────
# Logger
# ──────────────────────────────────────────────────────────────────────
#
# Four scalars that every driver's logger declares for itself. Each was
# written out independently, and the dedup window was worse than duplicated:
# it existed only as a bare literal, in SECONDS on macOS (`< 5`) and in
# MILLISECONDS on Windows (`< 5000`), with a comment on each side asserting it
# matched the other and nothing checking that it did.
# test-logger-scalars-single-source.cjs pins every copy to the values here.

[logger]

# Days of rolled log files kept before purging.
# AHK: read at boot by logger.ahk LoggerLoadTimings into LOGGER_RETENTION_DAYS.
# Linux: read by logger_sink.lua. HS: logger.lua max_age_days default
# (declared twice — purge_old_logs and the rolled-dir purge).
retention_days = 14

# Entries held in the in-memory ring buffer the crash reporter dumps.
# AHK: logger.ahk LOGGER_RING_BUFFER_SIZE. HS: logger.lua RING_BUFFER_SIZE.
# Shared core: _shared/lua/logger/init.lua RING_CAPACITY.
ring_buffer_size = 200

# Window during which a repeated identical line is suppressed rather than
# re-emitted. A streak outliving the window re-surfaces, so a recurring line is
# de-bounced and never permanently silenced.
# AHK: logger.ahk LOGGER_DEDUP_WINDOW_MS. HS: logger.lua DEDUP_WINDOW_SEC (the
# same duration expressed in seconds — the gate converts and compares).
dedup_window_ms = 5000

# How long a repeat streak stays open once a driver arms repeat collapsing
# (logger SPEC § 4.2): later occurrences of a line are counted, not written,
# and one summary is written when this window has elapsed.
# AHK: logger.ahk LOGGER_REPEAT_WINDOW_MS. Shared core (macOS, Linux):
# _shared/lua/logger/init.lua REPEAT_WINDOW_SEC, in seconds.
repeat_window_ms = 600000

# Repeat streaks tracked at once; the least recently used one is summarised and
# evicted to make room for a new one.
# AHK: logger.ahk LOGGER_REPEAT_CAPACITY. Shared core: REPEAT_CAPACITY.
repeat_streak_capacity = 64

# Interval at which the queued-write drain appends pending lines in one call.
# AHK: logger.ahk LOGGER_FLUSH_INTERVAL_MS.
flush_interval_ms = 500

# macOS native transport only: the Windows and Linux sinks write synchronously,
# so nothing there waits for an acknowledgement.
# Wait before the first resend of an unacknowledged batch; each later resend
# doubles the wait, up to ack_retry_cap_ms.
# HS: adapters/log_transport.lua ACK_RETRY_SEC (seconds).
ack_retry_ms = 500

# Longest wait between two resends of the same batch, and the most a parked
# run loop (a modal dialog, a busy main thread) counts against stall_fatal_ms.
# HS: adapters/log_transport.lua ACK_RETRY_CAP_SEC (seconds).
ack_retry_cap_ms = 4000

# How long the native worker may leave one batch unacknowledged, in running
# pump time, before the transport is declared failed and the driver exits. A
# slow disk, a sync tool or App Nap can stall it for seconds; that is not a
# failure, and neither is a dialog the user reads while the run loop is parked.
# HS: adapters/log_transport.lua STALL_FATAL_SEC (seconds).
stall_fatal_ms = 30000

# A native worker datagram or retention pass slower than this is reported to
# launcher.log with the time spent opening files, waiting for locks and writing.
# Swift: LoggerDatagramWorker.swift kLoggerSlowBatchThresholdMilliseconds.
native_slow_batch_ms = 500

# A hot-path segment (one keystroke's processing, a hotstring expansion, ...)
# slower than this is logged at WARNING as "Slow <segment>". One value for the
# three drivers: 5 ms is below the threshold of perceptible single-keystroke lag
# yet far above the sub-millisecond cost of a healthy keystroke.
# HS: infra/hotpath_profiler.lua. Linux: infra/perf_counters.lua (both through
# _shared/lua/hotpath_segments.lua threshold_ms).
# AHK: infra/hotpath_profiler.ahk HotPath_LoadTimings.
hotpath_slow_ms = 5


# ──────────────────────────────────────────────────────────────────────
# Performance budgets
# ──────────────────────────────────────────────────────────────────────
#
# How long one measured operation may take before the driver that measures it
# logs "Over budget: <what> took N ms (budget B ms)." at WARNING, and before the
# field log analyser (tools/dev/field-log-analyse.py) judges it over. Values
# are taken from the macOS field logs of 2026-10-30 (report
# mac-2026-10-30_191337: 38 boots, 27 reloads, 54 menu rebuilds), so a healthy
# day passes and a regression does not. The wording of the warning is
# _shared/lua/perf_budget.lua (macOS, Linux) and infra/perf_budget.ahk.

[budgets]

# Boot, process or VM start to "Boot complete". Measured p50 1667 ms, the
# slowest healthy boot 2834 ms; the two 25 s and 32 s boots waited for the
# Accessibility grant. 2500 ms is 1.5 times the median.
# HS: infra/boot_profiler.lua. LX: infra/boot_profiler.lua. AHK: ErgoptiPlus.ahk.
boot_total_ms = 2500

# One driver reload, from its request to the next boot's completion. Measured
# p50 2433 ms (teardown, VM re-exec and boot); 4000 ms leaves the boot budget
# plus the teardown's 1.5 s.
# HS: init.lua (through infra/reload_guard.lua).
driver_reload_ms = 4000

# One rebuild of the menu tree. It runs on the main thread, and from 250 ms key
# events reach the taps late ([logger]'s main-thread hold count threshold,
# infra/logger.lua SLOW_TIMER_CALLBACK_COUNT_MS); measured p50 283 ms, so the
# budget names a defect the log already shows.
# HS: ui/menu/init.lua.
menu_rebuild_ms = 250

# One request to a local AI server (Ollama, MLX, a local OpenAI-compatible
# server), request to answer. Measured local time to first token p50 1573 ms.
# HS: modules/llm/api_ollama.lua. AHK: modules/llm/llm_request_latency.ahk.
llm_local_request_ms = 2000

# One request to a cloud AI provider, request to answer. Measured 706 to 1479 ms;
# 3000 ms leaves room for a provider's own queue.
# HS: modules/llm/api_remote.lua. LX: modules/llm/api_remote.lua.
# AHK: modules/llm/llm_request_latency.ahk.
llm_remote_request_ms = 3000

# A streamed prediction: chain start to the tooltip's first display (TTFT).
# Measured p50 1573 ms, max 1582 ms.
# HS: ui/tooltip/tooltip_llm.lua.
prediction_display_ms = 2000


# ──────────────────────────────────────────────────────────────────────
# Adapters shared by the Linux and macOS drivers
# ──────────────────────────────────────────────────────────────────────

[adapters]
# Windows: the poll of a managed HTTP request an owner waits for.
http_managed_wait_poll_ms = 10
# Windows: the delay before a closed WebView profile folder is removed.
webview_profile_cleanup_ms = 1000
# Longest download of a desktop PAC the Linux lookup child evaluates itself
# (GIO drops its DIRECT entries); a caller's own bound below it wins.
# LX: adapters/system_proxy.lua, infra/managed_http.lua.
proxy_pac_download_max_ms = 60000
# Windows: the input probe's gap between sends, and its settle before reading.
input_probe_step_ms = 10
input_probe_settle_ms = 40
# Windows: an updater completion run off the current thread.
updater_callback_defer_ms = 50
# Windows: the poll of the keyboard-layout registry watch's change events
# (RegNotifyChangeKeyValue): a change of the installed layouts is captured
# within this delay rather than at the next one-second layout poll.
# AHK: modules/keymap/layout_registry_watch.ahk.
layout_registry_watch_poll_ms = 100

# Windows: minimum age of an abandoned atomic-write stage before it is reaped.
# AHK: infra/toml/toml_helpers.ahk StaleTempAgeMs (pinned copy).
stale_temp_age_ms = 60000

# Deadline of one HTTP request, file digest or child process when its caller
# names none. HS: http_client.lua. LX: curl_http_client.lua, file_digest.lua,
# process_runner.lua.
default_timeout_ms = 30000

# macOS: how long an application whose focused window did not answer
# Accessibility within the messaging timeout is not asked again, unless another
# application comes to the front. Each unanswered read holds the main thread
# for the whole timeout (field log 2026-10-30: 13 holds of 500 ms on one app).
# HS: adapters/accessibility_permission.lua unanswered_cooldown_sec (the
# ignored-window probe, the tooltip anchor and the context capture).
unresponsive_ax_backoff_ms = 30000

# Linux: deadline of the one download of Ergopti's own Python (about 30 MB,
# _shared/data/linux_native_runtime.json managed_python) and of its unpacking.
# LX: modules/keymap/layout_registry.lua (managed_python.lua).
managed_python_download_timeout_ms = 600000

# Linux: how long the window switch worker sleeps between two polls of its queue.
# LX: platform/window_switch_worker.lua.
window_switch_worker_sleep_ms = 10

# Local authenticating proxy relay (docs/design/proxy-auth-relay.md). The caller
# passes each value on the relay's command line. dial: one TCP connect to the
# selected proxy; handshake: a CONNECT with its NTLM/Negotiate legs, and a
# client's request head; idle: an open tunnel with no byte in either direction;
# probe: the whole probe child, from start to its JSON line.
# LX: infra/proxy_auth_relay.lua. HS: adapters/field_check_ports.lua,
# modules/llm/ollama_server_command.lua (network-retry.sh run_with_proxy_sign_in_relay).
proxy_relay_dial_timeout_ms = 10000
proxy_relay_handshake_timeout_ms = 15000
proxy_relay_idle_timeout_ms = 300000
proxy_relay_probe_timeout_ms = 30000


# ──────────────────────────────────────────────────────────────────────
# Byte limits
# ──────────────────────────────────────────────────────────────────────
#
# Caps on what a driver accepts from a child process, a file or a feed before it
# refuses. Values are bytes, every key ends in _bytes, and
# tools/test/test-timings-registry-liveness.cjs fails on a *_BYTES constant that
# retypes one of these numbers instead of reading it.

[limits]

# What a child process may print before it is stopped: a version line, a df row,
# a probe reply, never a stream. Lua canon: _shared/lua/llm/process_limits.lua
# (every Linux process owner takes it from there; pinned to this key).
# AHK: adapters/crash_report_worker.ahk and adapters/http_client.ahk, pinned copies.
process_output_bytes = 65536

# Bytes of one /proc/<pid>/cmdline the Linux local-server scan reads: ports and
# server names sit well inside it. LX: modules/llm/local_server_ports.lua.
proc_cmdline_bytes = 65536

# Largest managed-Ollama environment declaration file the Linux driver reads.
# LX: modules/llm/managed_ollama_environment.lua.
declaration_file_bytes = 65536

# Largest changelog feed the Linux changelog window downloads (ten releases'
# rendered notes, about 0.5 MB today).
# LX: ui/changelog/bridge.lua.
changelog_source_bytes = 4194304

# Refused metrics-journal bytes the macOS driver re-verifies in one deferred
# retry turn, so a large backlog never blocks the event loop.
# HS: modules/keystats/rotation.lua.
journal_recovery_turn_bytes = 65536

# Largest layers.toml the navigation layer editor accepts: every registry key
# bound in all four sections is about 25 KB, anything larger is not a layer file.
# Lua: _shared/lua/keymap/layer_editor.lua (macOS and Linux hosts).
layer_file_bytes = 65536

# Longest text one native number-row level may carry (a character, a dead key's
# output); a larger value is refused before it is turned into text.
# Lua: _shared/lua/layout/number_row_native.lua.
number_row_level_text_bytes = 1024

# Largest release-list response the update check reads, and so the largest
# stored copy it reuses. LX: modules/updater/manager.lua (transport cap).
# Lua: _shared/lua/updater/list_cache.lua (stored copy bound).
# A page of 20 releases weighed 2.4 MB on 2026-11-04 (about 120 KB each: notes
# and some 40 assets), over the former 2 MiB, and the Linux update check failed;
# 8 MiB leaves room for about 65 such releases.
release_list_body_bytes = 8388608

# What the digest tool may print for one file, beyond the file's own path: the
# hexadecimal digest and its separators. LX: adapters/file_digest.lua.
file_digest_output_bytes = 1024

# Head of one crash report the macOS field run reads for its closed tokens (the
# header and the exception record). HS: adapters/field_probe_ports.lua.
crash_report_head_bytes = 65536

# Longest keyboard input-source identifier the macOS driver selects or probes.
# HS: adapters/input_source_selector.lua, adapters/keyboard_source_probe.lua.
input_source_id_bytes = 1024

# Largest answer the Linux network field check reads: one byte over the shared
# PAC cap (_shared/lua/network/pac_check.lua MAX_BYTES), so an oversized PAC is
# seen as oversized rather than truncated. LX: adapters/network_check_ports.lua.
network_check_body_bytes = 1048577

# Largest program provider catalogue (the owned launcher's JSON list of the
# programs a script action may run) either driver reads.
# Lua: _shared/lua/program_providers.lua.
program_catalogue_bytes = 65536

# Largest diagnostic file of one curl transfer (its JSON write-out and redirect
# receipt) the Linux HTTP client reads back. LX: adapters/curl_http_client.lua.
http_diagnostic_bytes = 65536

# Largest request or answer packet of the Linux system proxy helper.
# LX: adapters/system_proxy.lua.
proxy_packet_bytes = 65536

# Largest native reply of the Apple Shortcuts role (the list of shortcuts or
# one run's result), also the limit the request passes to the launcher.
# HS: adapters/apple_shortcuts.lua.
shortcuts_reply_bytes = 65536

# Largest text output a run_command or run_apple_shortcut binding captures
# (stdout plus stderr, or the shortcut's output file) before the child is
# stopped and the run refused as too large, so a runaway command can neither
# exhaust memory nor type for minutes.
# HS: gestures/user_actions.lua, gestures/apple_shortcut_action.lua.
# LX: modules/gestures/user_actions.lua.
user_action_output_bytes = 65536

# Encoded log lines the macOS log transport prepares in one tick, also the
# longest single line it enqueues. Read before infra.timings exists, through the
# generated macos/_generated/registry_limits.lua. HS: adapters/log_transport.lua.
log_prepare_tick_bytes = 65536

# Output a synchronous macOS shell capture keeps before it stops the child and
# reports the output limit. Read through macos/_generated/registry_limits.lua.
# HS: adapters/shell_runner.lua.
shell_captured_output_bytes = 4194304

# Read granularity of the macOS TOML cache when it collects a source's exact
# bytes. Read through macos/_generated/registry_limits.lua.
# HS: adapters/toml_cache.lua.
toml_source_chunk_bytes = 65536

[launcher]

# Every sleep and poll interval of the Swift launcher (macos/launcher), its
# fixtures and its tests. The launcher cannot parse this file, so
# tools/codegen/codegen-registry-constants.cjs projects the section onto
# LauncherTimings.generated.swift; tools/test/test-launcher-sleep-registry.cjs
# refuses a literal sleep duration and a key no Swift file reads. macOS only:
# Windows and Linux have no native launcher.

# Retry of a contended launcher.log or logger datagram file lock, inside its
# 250 ms lock budget. Swift: main.swift LauncherLog, LoggerDatagramWorker.swift.
file_lock_retry_ms = 1

# Pause between tries of the sole-launcher lock while an update relaunch hands
# it over (50 tries). Swift: main.swift, LauncherInstanceOwnership.swift.
instance_lock_retry_ms = 100

# Poll of a leftover embedded runtime asked to terminate. Its grace before it
# is force-terminated is [ui] user_quit_deadline_ms, the bound of its own
# controlled exit, so a runtime still inside its quit fence is never killed
# (MLC-004). Swift: main.swift waitForStaleRuntimes.
stale_runtime_poll_ms = 100

# Poll of the remap lease guardian while it arms, and of its singleton lock.
# Swift: RemapLeaseGuardian.swift.
guardian_arm_poll_ms = 10
guardian_singleton_retry_ms = 10

# Poll of a lease worker child, and the grace a terminated child gets before
# it is killed. Swift: RemapLeaseWorker.swift; their sum is held under the
# private command budget by macos/tests/meta/architecture/test_native_lease_budget_parity.lua.
lease_child_poll_ms = 50
process_termination_grace_ms = 50

# Back-off between Karabiner fence transport retries, the last one repeated.
# Swift: RemapLeaseWorker.swift kFenceRetryDelays.
fence_retry_first_ms = 50
fence_retry_second_ms = 100
fence_retry_third_ms = 250
fence_retry_last_ms = 1000

# Poll of the stopped automation query guardian, and of the automation
# permission while Shortcuts Events launches. Swift: OwnedAutomationQueryWorker.swift.
automation_guardian_poll_ms = 20
automation_permission_poll_ms = 50

# Poll of the uninstall lease record until the fenced worker retires it.
# Swift: UninstallWorker.swift.
uninstall_lease_poll_ms = 10

# The owned remap runtime's installer and owners: the poll of a signalled
# launchctl child until it is reaped, of the core service's launchd
# registration after provisioning (inside its 10 s deadline), and of the user
# console program's native receipt. Swift: OwnedRuntimeCoreLaunchctl.swift,
# OwnedRuntimeCoreProvisionOwner.swift, OwnedRuntimeUserConsoleOwner.swift.
owned_runtime_child_reap_poll_ms = 10
owned_runtime_core_service_poll_ms = 10
owned_runtime_console_poll_ms = 25

# The VirtualHIDDevice daemon report: the poll of its signed query program,
# of the Main CLI request's owner, and of the request channel by the worker
# and its withdrawal watcher. Swift: OwnedVirtualHIDDaemonReportMainOperation.swift,
# OwnedVirtualHIDDaemonReportWorker.swift.
vhid_report_query_poll_ms = 10
vhid_report_main_poll_ms = 20
vhid_report_request_poll_ms = 20

# Test fixtures compiled into the launcher: the automation query fixture's
# hold, the owned program fixture's poll, and the managed Ollama listener's
# reap poll and its progress and stall chunk pauses.
# Swift: OwnedAutomationQueryWorker.swift, OwnedProgramNativeFixture.swift,
# ManagedOllamaListenerFixture.swift.
automation_fixture_wait_ms = 30000
program_fixture_poll_ms = 1
ollama_fixture_reap_poll_ms = 10
ollama_fixture_progress_part_ms = 400
ollama_fixture_stall_part_ms = 1500

# The launcher tests' polls (a fast one for local pipes and files, the usual
# one for child processes, a lease record poll and a native census poll) and
# their settle waits: the guardian kept alive after it owns its singleton, the
# retired guardian's record, the lease writer's line interval, a late native
# relaunch and a slow proxy settings read. Swift: Tests/ErgoptiPlusTests.
test_fast_poll_ms = 1
test_poll_ms = 10
test_record_poll_ms = 5
test_census_poll_ms = 100
test_guardian_settle_ms = 350
test_guardian_retire_settle_ms = 100
test_lease_line_interval_ms = 50
test_late_relaunch_settle_ms = 250
test_slow_settings_read_ms = 20
