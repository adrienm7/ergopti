<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<title data-i18n="numeric_prompt.window_title"></title>
		<link rel="stylesheet" href="../theme.css" />
		<link rel="stylesheet" href="style.css" />
		<script src="../i18n.js"></script>
		<script src="../host_bridge.js"></script>
	</head>
	<body>
		<div id="container">
			<h2 id="prompt-title"></h2>

			<div id="prompt-hint"></div>

			<div id="input-wrapper">
				<!-- The field has no label of its own: the question above names it and
				     the hint, the range and a refusal describe it (WCAG 1.3.1, 3.3.2). -->
				<input
					type="number"
					id="value-input"
					step="any"
					aria-labelledby="prompt-title"
					aria-describedby="prompt-hint range-hint error"
				/>
				<div id="range-hint"></div>
			</div>

			<div id="error" role="alert" hidden></div>

			<div id="buttons">
				<button
					type="button"
					id="cancel-button"
					data-i18n="numeric_prompt.cancel"
					onclick="doCancel()"
				></button>
				<button
					type="button"
					id="save-button"
					data-i18n="numeric_prompt.save"
					onclick="doSave()"
				></button>
			</div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
