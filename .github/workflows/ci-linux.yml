# .github/workflows/ci-linux.yml
#
# The Linux lane of the CI pipeline. ci.yml calls it once per run, after its
# validate job, as the job named "Linux", so every job below renders as
# "Linux / <name>" in the run graph, one lane with one entry job and one exit
# job:
#
#   unit tests -> E2E tests -> package -> install and launch (17) -> verdict
#                                  5 archive installs     (evidence gate)
#                                  9 first installs
#                                  3 package runs
#
# The driver is assembled and packaged ONCE per run, by package-linux, into the
# artifact assets-linux. The .deb, .rpm and AppImage smokes install those exact
# files on their own pristine hosts, and on a release run ci.yml's release job
# publishes those same files. linux-ok checks every job's evidence against
# .github/linux-ci-coverage.json. The lane has no outputs: its own result is
# what the release waits for, and the release collects assets-linux through its
# assets-* download pattern.
#
# Inputs, all computed by the plan steps of ci.yml's validate job:
#   release       true on a run that publishes; it only sets artifact retention.
#   version       the release version, '' otherwise ('' writes a commit-only
#                 build stamp, the CI behaviour).
#   linux_bundle  the tarball asset name, resolved once from the updater
#                 release contract (defaults.json) and validated there.
#
# No concurrency block: the caller's group already covers the whole run, and
# reusing it here would cancel this workflow from inside its own run.

name: Linux

on:
  workflow_call:
    inputs:
      release:
        description: True when this run publishes a release; only sets artifact retention
        required: true
        type: boolean
      version:
        description: Release version stamped into the Linux tree, empty outside a release
        required: true
        type: string
      linux_bundle:
        description: Linux tarball asset name from the updater release contract
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────
  # 1) Linux Lua driver unit and native contract tests
  # ─────────────────────────────────────────────────
  # The lane's entry job: the only one of this file that needs nothing.
  test-linux:
    name: 'Unit tests'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT and native event dependencies
        # The test runner (tests/run.lua) uses LuaJIT. Test discovery falls
        # back to io.popen("find") when lfs is unavailable — no luarocks needed.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit lua-luv sqlite3
          luajit -e 'assert(require("luv"), "native luv integration is mandatory")'

      - name: Verify native metrics aggregation equivalence
        run: python3 tools/test/test-linux-metrics-aggregation-native.py

      - name: Verify native cross-driver histogram multiplicity
        run: python3 tools/test/test-metrics-histogram-native.py

      - name: Run the driver unit test suite
        working-directory: static/ergopti_plus/linux
        # Wrapped in the unified reporter: streams output unchanged, exits with the
        # runner's code (CI gating preserved), and emits GitHub annotations + a JSON
        # summary on failure. report.cjs lives at the repo root tools/.
        run: node ../../../tools/test/report.cjs --name linux-lua --json "${{ runner.temp }}/linux-lua.json" -- luajit tests/run.lua

      - name: Record mandatory unit evidence
        run: |
          set -euo pipefail
          unit_assertions=$(jq -r '.passed' "$RUNNER_TEMP/linux-lua.json")
          node tools/test/linux-ci-evidence.cjs record \
              --job test-linux \
              --output "$RUNNER_TEMP/linux-ci-evidence/test-linux.json" \
              --sha "$GITHUB_SHA" \
              --architecture "$RUNNER_ARCH" \
              --distro ubuntu \
              --session x11-wayland-headless \
              --interpreter "$(luajit -v 2>&1 | head -1)" \
              --subject "unit=$unit_assertions"

      - name: Upload mandatory unit evidence
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-ci-evidence-test-linux
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/test-linux.json
          if-no-files-found: error

  e2e-linux:
    name: 'E2E tests'
    needs: [test-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        # The test runner (tests/run.lua) uses LuaJIT. Test discovery falls
        # back to io.popen("find") when lfs is unavailable — no luarocks needed.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit sqlite3

      # The virtual-keyboard harness, stubbed: this step runs on ubuntu-latest
      # against the pure-Lua hotstring engine — no real evdev device, no ydotool
      # injection. It is a corpus-driven replay of the engine's on_char() logic
      # layer, not an OS-level end-to-end test.
      #
      # Unit tests have already passed. Within this E2E job, this step and
      # every harness after it run with `if: ${{ !cancelled() }}`: a red E2E still
      # lets the kernel, display and tray harnesses report what they measured,
      # while a run cancelled by a newer push stops at once instead of spending
      # minutes on results nobody reads, which `always()` did.
      - name: Run virtual-keyboard E2E harness (stubbed)
        if: ${{ !cancelled() }}
        # Exercises the hotstring engine against 8 hand-coded scenarios
        # and all shared corpus vectors (vectors.json).
        # Exit 0 = all pass, 1 = at least one failure.
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          luajit tests/e2e/run_e2e.lua | tee "$RUNNER_TEMP/linux-e2e.log"
        timeout-minutes: 5

      - name: Launch option-looking application ids through actual GTK desktop entries
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          sudo apt-get install -y --no-install-recommends libgtk-3-bin dbus-x11 xvfb
          python3 tests/hardware/run_application_operand_receipts.py
        timeout-minutes: 1

      - name: Terminate real descendants after their process leader exits
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          sudo apt-get install -y --no-install-recommends lua-luv lua5.4 curl openssl python3 strace
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_process_groups.lua
        timeout-minutes: 1

      - name: Reject real ENOSPC write and buffered-close failures
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_file_write_failures.lua
        timeout-minutes: 1

      - name: Derive encryption keys from the actual D-Bus machine ID
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          sudo apt-get install -y --no-install-recommends dbus-x11 util-linux
          task_uid=$(id -u)
          task_gid=$(id -g)
          sudo unshare --mount --propagation private bash tests/hardware/run_machine_id_fallback_receipts.sh "$task_uid" "$task_gid"
        timeout-minutes: 2

      - name: Reject unsuccessful at-rest cryptography receipts
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_openssl_exit_receipts.lua
        timeout-minutes: 2

      - name: Reject unsuccessful native process supervision receipts
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_process_supervision_receipts.lua
        timeout-minutes: 1

      - name: Refuse incomplete native diagnostics exports
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" python3 tests/hardware/run_diagnostics_save_receipts.py
        timeout-minutes: 1

      - name: Preserve current SQLite device schema and its native readers
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_device_schema_receipts.lua
        timeout-minutes: 1

      - name: Preserve native SQLite device registration and refused transactions
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_device_registration_receipts.lua
        timeout-minutes: 1

      - name: Preserve SQLite event IDs across native collectors and invalid cursors
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_event_id_receipts.lua
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_event_id_cursor_receipts.lua
        timeout-minutes: 2

      - name: Preserve literal SQLite filesystem paths through native CLI arguments
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_filesystem_paths.lua
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" lua5.4 tests/hardware/run_sqlite_filesystem_paths.lua
        timeout-minutes: 1

      - name: Reject silent SQLite failures without staging typed SQL
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_write_receipts.lua
        timeout-minutes: 1

      - name: Reject failed native SQLite migration and dashboard rows
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_read_receipts.lua
        timeout-minutes: 1

      - name: Preserve actual SQLite metric literals and application filters
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_literal_receipts.lua
        timeout-minutes: 1

      - name: Preserve native decrypted migration values and foreign ownership
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_text_migration_literal_receipts.lua
        timeout-minutes: 1

      - name: Isolate SQLite from an actual disposable user's personal init
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          set -euo pipefail
          profile_user="ergopti_sqlite_${RANDOM}"
          # A new account cannot traverse the runner's private temporary parent.
          profile_home=$(mktemp -d /tmp/ergopti-sqlite-profile-XXXXXX)
          sudo useradd --user-group --no-create-home --home-dir "$profile_home" --shell /bin/sh "$profile_user"
          cleanup() {
            sudo userdel "$profile_user"
            sudo rm -rf -- "$profile_home"
          }
          trap cleanup EXIT
          # The fixture owns its source copy; private checkout permissions and
          # the caller's login home must not be changed for another account.
          sudo mkdir -p "$profile_home/source"
          sudo cp -a . "$profile_home/source/linux"
          sudo cp -a ../_shared "$profile_home/source/_shared"
          sudo install -m 600 tests/hardware/fixtures/sqlite_profile.conf "$profile_home/.sqliterc"
          sudo chown -R "$profile_user:$profile_user" "$profile_home"
          sudo chmod -R u+rwX,go-rwx "$profile_home"
          sudo runuser -u "$profile_user" -- sh -ec 'cd "$1"; exec env TMPDIR="$2" LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_init_receipts.lua' sh "$profile_home/source/linux" "$profile_home"
        timeout-minutes: 1

      - name: Keep native shell capture failures free of caller text
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_shell_capture_error_receipts.lua
        timeout-minutes: 1

      - name: Refuse truncated native process names and arguments
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_spawn_nul_receipts.lua
        timeout-minutes: 1

      - name: Check native path existence without opening readable streams
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_file_exists_receipts.lua
        timeout-minutes: 1

      - name: Delete files using native permission and symlink receipts
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_file_delete_receipts.lua
        timeout-minutes: 1

      - name: Refuse truncated native paths and retain literal filenames
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_file_path_receipts.lua
        timeout-minutes: 1

      - name: Retain native timer ownership across garbage collection
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_timer_gc_receipts.lua
        timeout-minutes: 1

      - name: Preserve process baselines after native snapshot refusal
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_process_snapshot_receipts.lua
        timeout-minutes: 1

      - name: Retire native logger channels after failed writes or flushes
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_logger_write_receipts.lua
        timeout-minutes: 1

      - name: Stop the native event loop without retiring foreign resources
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_event_loop_stop_receipts.lua
        timeout-minutes: 1

      - name: Retain native event-loop ownership during callback reentry
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit "$PWD/tests/fixtures/native_event_loop_reentry.lua"
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" lua5.4 "$PWD/tests/fixtures/native_event_loop_reentry.lua"
        timeout-minutes: 1

      - name: Refuse non-finite native timer and deferred durations
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit "$PWD/tests/fixtures/native_timer_finite_admission.lua"
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" lua5.4 "$PWD/tests/fixtures/native_timer_finite_admission.lua"
        timeout-minutes: 1

      - name: Refuse non-finite native event-loop periods before allocation
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit "$PWD/tests/fixtures/native_event_loop_periodic_admission.lua"
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" lua5.4 "$PWD/tests/fixtures/native_event_loop_periodic_admission.lua"
        timeout-minutes: 1

      - name: Isolate actual callback error objects without invoking their formatters
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          for callback_source in after every idle periodic "registered idle" deferred; do
            for callback_failure in object string; do
              env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit "$PWD/tests/fixtures/native_callback_error_description.lua" "$callback_source" "$callback_failure"
              env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" lua5.4 "$PWD/tests/fixtures/native_callback_error_description.lua" "$callback_source" "$callback_failure"
            done
          done
        timeout-minutes: 1

      - name: Project native modifier-hold statistics into actual dashboard consumers
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" node tests/hardware/run_sqlite_kc_hold_consumers.cjs
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" ERGOPTI_READER_TEST_LUA=lua5.4 node tests/hardware/run_sqlite_kc_hold_consumers.cjs
        timeout-minutes: 1

      - name: Refuse malformed release pages through existing strict JSON admission
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          python3 tests/hardware/run_updater_release_json_admission.py
          ERGOPTI_HTTP_TEST_LUA=lua5.4 python3 tests/hardware/run_updater_release_json_admission.py
        timeout-minutes: 1

      - name: Preserve supplied histogram key bytes in real SQLite
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_burst_histogram_keys.lua
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" lua5.4 tests/hardware/run_sqlite_burst_histogram_keys.lua
        timeout-minutes: 1

      - name: Roll back native category and score edits after SQLite refusal
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_category_edit_receipts.lua
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" lua5.4 tests/hardware/run_sqlite_category_edit_receipts.lua
        timeout-minutes: 1

      - name: Read actual canonical XKB symbol lists outside quoted metadata
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_xkb_quoted_symbol_lists.lua
        timeout-minutes: 1

      - name: Parse actual canonical XKB keys without quoted declaration collisions
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_xkb_quoted_key_definitions.lua
        timeout-minutes: 1

      - name: Parse actual canonical XKB blocks without quoted metadata collisions
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_xkb_quoted_blocks.lua
        timeout-minutes: 1

      - name: Preserve UTF-8 boundaries in native provider error diagnostics
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          python3 tests/hardware/run_llm_server_message_utf8.py
          ERGOPTI_HTTP_TEST_LUA=lua5.4 python3 tests/hardware/run_llm_server_message_utf8.py
        timeout-minutes: 1

      - name: Refuse malformed structured provider completions through strict JSON
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          python3 tests/hardware/run_llm_response_syntax.py
          ERGOPTI_HTTP_TEST_LUA=lua5.4 python3 tests/hardware/run_llm_response_syntax.py
        timeout-minutes: 1

      - name: Refuse provider error envelopes before publishing completion text
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          python3 tests/hardware/run_llm_response_errors.py
          ERGOPTI_HTTP_TEST_LUA=lua5.4 python3 tests/hardware/run_llm_response_errors.py
        timeout-minutes: 1

      - name: Preserve complete native SQLite metadata scalar values
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_sqlite_meta_values.lua
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" lua5.4 tests/hardware/run_sqlite_meta_values.lua
        timeout-minutes: 1

      - name: Dispatch provider requests through verified IPv4 and IPv6 TLS
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          python3 tests/hardware/run_llm_ipv6_endpoints.py
          ERGOPTI_HTTP_TEST_LUA=lua5.4 python3 tests/hardware/run_llm_ipv6_endpoints.py
        timeout-minutes: 1

      - name: Admit file watches only after native activation succeeds
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_file_watch_receipts.lua
        timeout-minutes: 1

      - name: Hash real files across path boundaries and permission failures
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_file_digest_receipts.lua
        timeout-minutes: 1

      - name: Hash independent byte vectors through real OpenSSL
        if: ${{ !cancelled() }}
        working-directory: static/ergopti_plus/linux
        run: |
          env LUA_PATH="./?.lua;./?/init.lua;../_shared/lua/?.lua;../_shared/lua/?/init.lua;;" luajit tests/hardware/run_crypto_receipts.lua
        timeout-minutes: 1

      - name: Refuse failed native SHA-256 fallback output
        if: ${{ !cancelled() }}
