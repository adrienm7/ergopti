          # lua-lgi installs for the distro's Lua, not for LuaJIT, so the module
          # path has to be widened rather than assumed. Reported, not guessed at:
          # the harness exits 2 when lgi is unreachable and the step says so.
          export LUA_PATH="$LUA_PATH;/usr/share/lua/5.1/?.lua;/usr/share/lua/5.1/?/init.lua"
          export LUA_CPATH="/usr/lib/x86_64-linux-gnu/lua/5.1/?.so;;"
