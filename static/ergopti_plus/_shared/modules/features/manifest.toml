# ========================================
# ===== 3.6.2 gestures.sensitivities =====
# ========================================

# Distance per action of an incremental swipe, in touch-device units (the `sd`
# the gesture log prints; a deliberate three-finger swipe on the built-in
# trackpad travels about 15 to 45). The first action fires after
# Geometry.INCREMENTAL_FIRST_STEP (4) or one step if that is shorter, and each
# further action after one more step; an x1 slot ignores it.

# Directions default to 3.5, one action per short stretch (words, spaces),
# except the three-finger vertical swipe (previous/next tab): with 5 a normal
# swipe switched two or three tabs (19.84 gave 3 on 2026-10-28), so its step is
