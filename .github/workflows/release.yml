# .github/workflows/release.yml
#
# Builds Ergopti.app (macOS), ErgoptiPlus.exe (Windows), and packages keyboard
# layout files for all three platforms, then attaches everything to a GitHub
# Release. Three trigger paths:
#   1. push to dev          — auto-creates a pre-release "dev-{date}-{sha7}".
#   2. release: published   — fired by release-please after main is updated.
#   3. workflow_dispatch    — manual, takes an explicit tag.
#
# The "prepare-release" job is the single source of truth for the tag and
# release: every build job depends on it and reads its outputs.
name: Release Build

on:
    push:
        branches: [dev]
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to build (e.g. v0.1.0)"
                required: true
                default: "v0.1.0"

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false




# ============================================================
# ============================================================
# ======= 1/ Prepare release =================================
# ============================================================
# ============================================================

jobs:
    prepare-release:
        runs-on: ubuntu-latest
        outputs:
            tag:        ${{ steps.meta.outputs.tag }}
            title:      ${{ steps.meta.outputs.title }}
            version:    ${{ steps.meta.outputs.version }}
            prerelease: ${{ steps.meta.outputs.prerelease }}
            ref:        ${{ steps.meta.outputs.ref }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Resolve tag / version / channel
              id: meta
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  event="${{ github.event_name }}"
                  prerelease="false"
                  case "$event" in
                      push)
                          # Auto-tag for dev pushes. Format is intentionally
                          # human-readable (dashes between date parts, an "h"
                          # between hour and minute) so the GitHub releases
                          # page shows "Ergopti dev 2026-05-19 19h02 — fab7976"
                          # instead of the previous unintelligible
                          # "dev-20260519-190225-fab7976". Git tags cannot
                          # contain spaces, so dashes and underscores are the
                          # readable substitutes we have.
                          # Timestamps are in Europe/Paris time (CET/CEST).
                          y="$(TZ='Europe/Paris' date +%Y)"
                          m="$(TZ='Europe/Paris' date +%m)"
                          d="$(TZ='Europe/Paris' date +%d)"
                          h="$(TZ='Europe/Paris' date +%H)"
                          n="$(TZ='Europe/Paris' date +%M)"
                          sha="${GITHUB_SHA:0:7}"
                          tag="dev-${y}-${m}-${d}-${h}h${n}-${sha}"
                          title="Ergopti dev ${y}-${m}-${d} ${h}h${n} — ${sha}"
                          prerelease="true"
                          ref="${GITHUB_SHA}"
                          ;;
                      release)
                          tag="${GITHUB_REF_NAME}"
                          ref="$tag"
                          title="Ergopti ${tag}"
                          ;;
                      workflow_dispatch)
                          tag="${{ github.event.inputs.tag }}"
                          ref="$tag"
                          title="Ergopti ${tag}"
                          # Anything that does not look like vX.Y.Z is treated as pre-release
                          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                              prerelease="true"
                          fi
                          ;;
                  esac
                  version="${tag#v}"
                  echo "tag=$tag"               >> "$GITHUB_OUTPUT"
                  echo "title=$title"           >> "$GITHUB_OUTPUT"
                  echo "version=$version"       >> "$GITHUB_OUTPUT"
                  echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
                  echo "ref=$ref"               >> "$GITHUB_OUTPUT"
                  echo "Resolved tag=$tag title='$title' version=$version prerelease=$prerelease ref=$ref"

            - name: Create git tag (push events only)
              # For push-to-dev runs we need to plant the tag in the repo so
              # ``gh release create --target $ref`` has something to point at.
              # release: events already have a tag; workflow_dispatch targets
              # an existing tag supplied by the caller.
              if: ${{ github.event_name == 'push' }}
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  tag="${{ steps.meta.outputs.tag }}"
                  ref="${{ steps.meta.outputs.ref }}"
                  if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
                      echo "Tag '$tag' already exists on remote — skipping."
                  else
                      git tag "$tag" "$ref"
                      git push origin "$tag"
                      echo "Tag '$tag' pushed."
                  fi




# ============================================================
# ============================================================
# ======= 2/ macOS — ErgoptiPlus.app + Sparkle appcast =======
# ============================================================
# ============================================================

    build-macos:
        needs: prepare-release
        runs-on: macos-latest
        env:
            SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}

        steps:
            - name: Checkout at build ref
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.prepare-release.outputs.ref }}
                  fetch-depth: 0

            - name: Build ErgoptiPlus.app
              shell: bash
              env:
                  ERGOPTI_VERSION:    ${{ needs.prepare-release.outputs.version }}
                  ERGOPTI_BUILD:      ${{ github.run_number }}
                  ERGOPTI_CHANNEL:    main
                  SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
                  GH_OWNER:           ${{ github.repository_owner }}
                  GH_REPO:            ${{ github.event.repository.name }}
              run: bash tools/build_macos_app.sh

            - name: Install Sparkle signing tool
              if: ${{ env.SPARKLE_ED_PRIVATE_KEY != '' }}
              shell: bash
              env:
                  SPARKLE_VERSION: "2.9.2"
              run: |
                  set -euo pipefail
                  curl -fsSLo /tmp/Sparkle.tar.xz \
                      "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
                  mkdir -p /tmp/sparkle-dist
                  tar -xJf /tmp/Sparkle.tar.xz -C /tmp/sparkle-dist
                  echo "SIGN_UPDATE=/tmp/sparkle-dist/bin/sign_update" >> "$GITHUB_ENV"

            - name: Sign zip with Sparkle EdDSA key
              if: ${{ env.SPARKLE_ED_PRIVATE_KEY != '' }}
              shell: bash
              run: |
                  set -euo pipefail
                  printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > /tmp/sparkle_priv.key
                  "$SIGN_UPDATE" -f /tmp/sparkle_priv.key build/macos/ErgoptiPlus.app.zip \
                      > build/macos/_ErgoptiPlus.app.zip.sig
                  rm -f /tmp/sparkle_priv.key
                  echo "Sparkle EdDSA signature written to _ErgoptiPlus.app.zip.sig"

            - name: Generate Sparkle appcast
              if: ${{ env.SPARKLE_ED_PRIVATE_KEY != '' }}
              shell: bash
              env:
                  ERGOPTI_VERSION:  ${{ needs.prepare-release.outputs.version }}
                  ERGOPTI_BUILD:    ${{ github.run_number }}
                  ERGOPTI_CHANNEL:  main
                  SPARKLE_SIG_FILE: build/macos/_ErgoptiPlus.app.zip.sig
                  ZIP_PATH:         build/macos/ErgoptiPlus.app.zip
                  GH_OWNER:         ${{ github.repository_owner }}
                  GH_REPO:          ${{ github.event.repository.name }}
                  OUTPUT_PATH:      build/macos/appcast-main.xml
              run: bash tools/generate_appcast.sh

            - name: Package latest keylayout bundle
              shell: bash
              # Released as ``Ergopti_macOS.zip`` — keyboard layout only, no app.
              run: |
                  set -euo pipefail
                  latest=$(ls -d static/drivers/macos/bundles/*.bundle | sort -V | tail -1)
                  bundle_name=$(basename "$latest")
                  (cd static/drivers/macos/bundles && zip -r "../../../../build/macos/Ergopti_macOS.zip" "$bundle_name")
                  echo "Packaged keylayout: $bundle_name → Ergopti_macOS.zip"

            - name: Rename appcast for upload
              shell: bash
              run: |
                  [ -f build/macos/appcast-main.xml ] && mv build/macos/appcast-main.xml build/macos/_appcast-main.xml || true

            - name: Upload macOS artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: assets-macos
                  retention-days: 1
                  path: |
                      build/macos/ErgoptiPlus.app.zip
                      build/macos/Ergopti_macOS.zip
                      build/macos/_ErgoptiPlus.app.zip.sig
                      build/macos/_appcast-main.xml




# ============================================================
# ============================================================
# ======= 3/ Windows — ErgoptiPlus.exe + keyboard layout =====
# ============================================================
# ============================================================

    build-windows:
        needs: prepare-release
        runs-on: windows-latest

        steps:
            - name: Checkout at build ref
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.prepare-release.outputs.ref }}
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Regenerate hotstrings_generated.ahk
              run: python tools/compile_hotstrings.py
              shell: bash

            - name: Build static asset bundle
              run: python tools/build_static_bundle.py
              shell: bash

            - name: Stamp BUNDLE_VERSION, BUNDLE_RELEASE_URL, BUNDLE_CHANNEL
              shell: pwsh
              run: |
                  $version = "${{ needs.prepare-release.outputs.version }}"
                  $tag     = "${{ needs.prepare-release.outputs.tag }}"
                  if (-not $tag) { $tag = $version }
                  $prerelease = "${{ needs.prepare-release.outputs.prerelease }}"
                  $channel = if ($prerelease -eq 'true') { 'dev' } else { 'main' }
                  $owner   = "${{ github.repository_owner }}"
                  $repo    = "${{ github.event.repository.name }}"
                  $releaseUrl = "https://github.com/$owner/$repo/releases/tag/$tag"
                  $bundlePath = "${{ github.workspace }}\static\drivers\autohotkey\lib\bundle.ahk"
                  $text = Get-Content -Raw -Path $bundlePath
                  $text = $text.Replace("__BUNDLE_VERSION__",     $version)
                  $text = $text.Replace("__BUNDLE_RELEASE_URL__", $releaseUrl)
                  $text = $text.Replace("__BUNDLE_CHANNEL__",     $channel)
                  Set-Content -Path $bundlePath -Value $text -Encoding UTF8 -NoNewline
                  Write-Host "BUNDLE_VERSION     stamped: $version"
                  Write-Host "BUNDLE_RELEASE_URL stamped: $releaseUrl"
                  Write-Host "BUNDLE_CHANNEL     stamped: $channel"

            - name: Download AutoHotkey v2 runtime and Ahk2Exe
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip" -OutFile "$env:TEMP\AHK.zip" -UseBasicParsing
                  Expand-Archive -Path "$env:TEMP\AHK.zip" -DestinationPath "$env:TEMP\AutoHotkey" -Force
                  gh release download --repo AutoHotkey/Ahk2Exe --pattern "*.zip" --dir "$env:TEMP\Ahk2ExeZip"
                  $z = Get-ChildItem "$env:TEMP\Ahk2ExeZip" -Filter "*.zip" | Select-Object -First 1
                  Expand-Archive -Path $z.FullName -DestinationPath "$env:TEMP\Ahk2Exe" -Force

            - name: Compile ErgoptiPlus.ahk
              shell: pwsh
              run: |
                  $ahk2exe = Get-ChildItem "$env:TEMP\Ahk2Exe" -Recurse -Filter "Ahk2Exe.exe" | Select-Object -First 1 -ExpandProperty FullName
                  $runtime = Get-ChildItem "$env:TEMP\AutoHotkey" -Filter "AutoHotkey64.exe" | Select-Object -First 1 -ExpandProperty FullName
                  $in   = "${{ github.workspace }}\static\drivers\autohotkey\ErgoptiPlus.ahk"
                  $out  = "${{ github.workspace }}\static\drivers\autohotkey\ErgoptiPlus.exe"
                  $icon = "${{ github.workspace }}\static\favicon.ico"
                  & $ahk2exe /in $in /out $out /base $runtime /icon $icon
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            - name: Rename Windows keyboard layout for upload
              shell: bash
              run: |
                  set -euo pipefail
                  latest_kbd=$(ls static/drivers/windows/Ergopti_v*.exe | sort -V | tail -1)
                  cp "$latest_kbd" static/drivers/windows/Ergopti_windows.exe

            - name: Upload Windows artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: assets-windows
                  retention-days: 1
                  path: |
                      static/drivers/autohotkey/ErgoptiPlus.exe
                      static/drivers/windows/Ergopti_windows.exe




# ============================================================
# ============================================================
# ======= 4/ Linux — XKB keyboard layouts ====================
# ============================================================
# ============================================================

    build-linux:
        needs: prepare-release
        runs-on: ubuntu-latest

        steps:
            - name: Checkout at build ref
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.prepare-release.outputs.ref }}
                  fetch-depth: 0

            - name: Package latest XKB files
              shell: bash
              run: |
                  set -euo pipefail
                  latest_dir=$(ls -d static/drivers/linux/v*_* | sort -V | tail -1)
                  dir_name=$(basename "$latest_dir")
                  mkdir -p build/linux
                  (cd static/drivers/linux && zip -r "../../../build/linux/Ergopti_xkb.zip" "$dir_name")
                  echo "Packaged XKB: $dir_name → Ergopti_xkb.zip"

            - name: Upload Linux artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: assets-linux
                  retention-days: 1
                  path: |
                      build/linux/Ergopti_xkb.zip
                      static/drivers/kanata/kanata.kbd




# ============================================================
# ============================================================
# ======= 5/ Finalize release notes ==========================
# ============================================================
# ============================================================

    finalize-release:
        needs: [prepare-release, build-macos, build-windows, build-linux]
        runs-on: ubuntu-latest

        steps:
            # Need the full history so ``git log previous_tag..HEAD`` works
            # for the main-channel changelog aggregation below.
            - name: Checkout (full history)
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Download all build artifacts
              uses: actions/download-artifact@v4
              with:
                  path: release-assets
                  merge-multiple: true

            - name: Create release and upload all assets atomically
              # The release is created here — after all three build jobs have
              # succeeded — so it is never in a half-baked state. GitHub's
              # immutable-release policy means an asset cannot be replaced once
              # uploaded; by creating the release only once and uploading
              # everything in a single call we avoid any conflict.
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  tag="${{ needs.prepare-release.outputs.tag }}"
                  prerelease="${{ needs.prepare-release.outputs.prerelease }}"
                  ref="${{ needs.prepare-release.outputs.ref }}"
                  title="${{ needs.prepare-release.outputs.title }}"

                  mapfile -t assets < <(find release-assets -type f)
                  echo "Assets to attach (${#assets[@]}):"
                  printf '  %s\n' "${assets[@]}"

                  flags=()
                  [ "$prerelease" = "true" ] && flags+=("--prerelease")

                  if [ "${{ github.event_name }}" = "release" ]; then
                      # release: event — GitHub already created the release via
                      # release-please; we only need to attach the assets.
                      echo "Event is 'release' — uploading assets to existing release '$tag'."
                      gh release upload "$tag" "${assets[@]}"
                  else
                      # push / workflow_dispatch — create fresh release with all
                      # assets in one atomic call (gh release create accepts files).
                      echo "Creating release '$tag' with ${#assets[@]} asset(s)…"
                      gh release create "$tag" \
                          --target "$ref" \
                          --title "$title" \
                          --notes "Changelog will appear below — updating now." \
                          "${flags[@]}" \
                          "${assets[@]}"
                  fi

            # Build the changelog section. Delegates to tools/build_changelog.py
            # which aggregates every commit between the previous release tag
            # and the current one, then groups them by Conventional Commits
            # type into h3 sections (Features → Fix → Performance → … → Other).
            # See that script's docstring for the full rationale.
            - name: Build changelog section
              shell: bash
              env:
                  EVENT:    ${{ github.event_name }}
                  TAG:      ${{ needs.prepare-release.outputs.tag }}
                  SHA:      ${{ github.sha }}
              run: |
                  python3 tools/build_changelog.py > "$RUNNER_TEMP/changelog.md"
                  echo "Changelog written ($(wc -l < "$RUNNER_TEMP/changelog.md") lines)."

            - name: Write release body with platform sections
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG:      ${{ needs.prepare-release.outputs.tag }}
                  VERSION:  ${{ needs.prepare-release.outputs.version }}
              run: |
                  set -euo pipefail
                  body_file="$(mktemp)"
                  # Prepend the per-channel changelog block built in the
                  # previous step. When the file is empty (no prior tag, or
                  # parse failure), this is a harmless no-op and the release
                  # notes look exactly like before.
                  if [ -s "$RUNNER_TEMP/changelog.md" ]; then
                      cat "$RUNNER_TEMP/changelog.md" >> "$body_file"
                  fi
                  cat >> "$body_file" << EOF
                  ## Ergopti $VERSION

                  Select the platform below and download the corresponding file.
                  > Timestamps are in **Paris time** (Europe/Paris, CET/CEST).

                  ---

                  ### 🍎 macOS

                  | Asset | Description |
                  |---|---|
                  | [ErgoptiPlus.app.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ErgoptiPlus.app.zip) | macOS application (Hammerspoon + Karabiner-Elements bundled) |
                  | [Ergopti_macOS.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Ergopti_macOS.zip) | Keyboard layout bundle only — no app required |

                  **Installation — app:**
                  1. Unzip \`ErgoptiPlus.app.zip\` and move \`ErgoptiPlus.app\` to \`/Applications\`.
                  2. Remove the quarantine flag (the app is not yet Apple-notarised):
                  \`\`\`bash
                  xattr -d com.apple.quarantine /Applications/ErgoptiPlus.app
                  \`\`\`
                  3. Launch the app. On first run, Karabiner-Elements will request a System Extension approval — required for key remapping.
                  4. Your personal configuration is stored in \`~/.config/ergopti_plus/\`. If this folder does not exist yet (first launch), the setup wizard will open automatically.

                  **Installation — keyboard layout only:**
                  1. Unzip \`Ergopti_macOS.zip\`.
                  2. Copy the \`.bundle\` folder to \`/Library/Keyboard Layouts/\`.
                  3. Log out and back in, then add the layout in System Settings → Keyboard → Input Sources.

                  ---

                  ### 🪟 Windows

                  | Asset | Description |
                  |---|---|
                  | [ErgoptiPlus.exe](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ErgoptiPlus.exe) | Compiled AutoHotkey executable (AHK v2 runtime bundled) |
                  | [Ergopti_windows.exe](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Ergopti_windows.exe) | Windows keyboard layout installer — no app required |

                  **Installation — app:**
                  1. Download \`ErgoptiPlus.exe\`.
                  2. Double-click to run. On first launch, resources are extracted to \`%LOCALAPPDATA%\Ergopti\`.
                  3. Your personal configuration is stored in \`%USERPROFILE%\.config\ergopti_plus\`. If this folder does not exist yet (first launch), the setup wizard will open automatically.

                  **Installation — keyboard layout only:**
                  1. Download \`Ergopti_windows.exe\` and run it as Administrator.
                  2. Log out and back in, then select the layout in Settings → Time & Language → Language & region.

                  ---

                  ### 🐧 Linux

                  | Asset | Description |
                  |---|---|
                  | [Ergopti_xkb.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Ergopti_xkb.zip) | XKB layout files (standard, ANSI, plus, plus-ANSI variants) |
                  | [kanata.kbd](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/kanata.kbd) | Kanata config file (for Kanata users) |

                  **Installation:**
                  1. Unzip \`Ergopti_xkb.zip\`.
                  2. Follow the [XKB installation guide](https://github.com/${GITHUB_REPOSITORY}/tree/main/static/drivers/linux/xkb_installation) in the repository.

                  ---

                  _Generated by [release.yml](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_
                  EOF
                  gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --notes-file "$body_file"
                  echo "Release notes updated for $TAG"




# ==================================================================
# ==================================================================
# ======= 6/ Cleanup on failure ====================================
# ==================================================================
# ==================================================================

# When finalize-release fails mid-way, the release it created may be
# incomplete: tag exists but body is wrong or assets are missing.
# Leaving it on GitHub causes two problems:
#
# 1. Users browsing releases see a broken entry.
# 2. The NEXT run's changelog uses this broken tag as the "previous"
#    tag, so the commit that introduced the failure (and any commits
#    pushed in the same batch) disappear from the next changelog —
#    they're filed under a release that nobody can read.
#
# This job deletes both the release AND the underlying git tag so the
# slate is clean for the next push. ``if: failure()`` runs only when at
# least one upstream job in ``needs`` failed; ``always()`` ensures we
# still fire even if earlier jobs were cancelled mid-build (cancellation
# leaves the tag dangling the same way).
    cleanup-on-failure:
        needs: [prepare-release, build-macos, build-windows, build-linux, finalize-release]
        if: ${{ always() && (failure() || cancelled()) && needs.prepare-release.outputs.tag != '' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Delete failed release + tag
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG:      ${{ needs.prepare-release.outputs.tag }}
              run: |
                  set -euo pipefail
                  echo "Build failed — deleting half-baked release '$TAG' so the next run's changelog can pick up from the previous good tag."
                  # ``--cleanup-tag`` removes the underlying git tag in the
                  # same call. ``|| true`` because the release may not have
                  # been created yet (prepare-release itself can fail) and
                  # ``gh release delete`` returns non-zero in that case.
                  gh release delete "$TAG" \
                      --repo "${{ github.repository }}" \
                      --yes \
                      --cleanup-tag || true
                  echo "Cleanup attempted for tag $TAG."
