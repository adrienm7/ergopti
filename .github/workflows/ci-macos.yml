          mode="$(node tools/ci/dev-release-qualification.cjs --scope macos-native-pac --validate-scope-receipt "$receipt")"
          profile="$(node tools/ci/dev-release-qualification.cjs --scope macos-native-pac --validate-scope-receipt-profile "$receipt")"
          native_pac_skip_args=()
          pac_evidence_args=()
          if [ "$mode" = deferred ]; then
