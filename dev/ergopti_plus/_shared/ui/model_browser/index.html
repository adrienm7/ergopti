<!-- _shared/ui/model_browser/index.html -->
<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<title data-i18n="model_browser.window_title"></title>
		<link rel="stylesheet" href="../theme.css" />
		<link rel="stylesheet" href="style.css" />
		<script src="../i18n.js"></script>
		<script src="../host_bridge.js"></script>
	</head>
	<body>
		<div id="toolbar" role="toolbar">
			<input
				id="search"
				type="search"
				autocomplete="off"
				spellcheck="false"
				data-i18n-placeholder="model_browser.search_placeholder"
				data-i18n-title="model_browser.search_placeholder"
			/>
			<label
				id="backend-filter-label"
				for="backend-filter"
				data-i18n="model_browser.filter_backend"
			></label>
			<select id="backend-filter"></select>
			<span id="count" aria-live="polite"></span>
		</div>

		<div id="current" aria-live="polite"></div>

		<div id="table-wrap">
			<table id="models" aria-describedby="hint">
				<thead>
					<tr id="head-row"></tr>
				</thead>
			</table>
			<div id="empty" style="display: none" data-i18n="model_browser.no_models"></div>
		</div>

		<div id="footer">
			<div id="hint" data-i18n="model_browser.select_hint"></div>
			<div id="footer-actions">
				<button id="btn-disable" type="button" data-i18n="model_browser.disable_button"></button>
				<button id="btn-use" type="button" disabled data-i18n="model_browser.use_button"></button>
			</div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
