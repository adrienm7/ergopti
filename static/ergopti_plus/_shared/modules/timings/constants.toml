# _shared/modules/timings/constants.toml
#
# Canonical registry of all timing constants used across Ergopti drivers.
#
# Every driver consumes this file:
#   - Hammerspoon (macOS): infra/timings.lua, at startup.
#   - Linux: infra/timings.lua, at startup.
#   - AutoHotkey (Windows): infra/timings/timings_config.ahk, at boot.
#
# All values are in milliseconds unless the key name says otherwise.
# Keys ending in _sec are in seconds (kept for readability where the
# underlying API works in seconds, e.g. hs.timer.doAfter).
#
# Editing this file is the single authoritative way to tune timings.
# Driver-local constants that duplicate a value here should be removed
# and replaced with a reference to this file.
#
# Every key has a reader. tools/test/test-timings-registry-liveness.cjs fails
# on a key that no driver reads at runtime and no gate pins to a driver copy:
# such a key documents a timing nothing uses, and tuning it changes nothing.
# Driver copies that cannot read the registry yet are pinned to it by
# tools/test/test-keystats-timings-single-source.cjs.


# ──────────────────────────────────────────────────────────────────────
# LLM prediction
# ──────────────────────────────────────────────────────────────────────

[llm]

# The keystroke debounce before an LLM prediction request is the user's
# llm.trigger.debounce_ms, shipped as llm_debounce_ms in
# _shared/modules/llm/defaults.json; every driver waits exactly that value.

# Chain-fallback timer: fire the chained LLM call if the F16 sync signal
# is missed (HS prediction_engine.lua CHAIN_FALLBACK_SEC).
chain_fallback_ms = 500

# How long an automatic request that found its backend busy waits before it
# asks again. The wait is at least the user's request interval; this keeps it
# positive when that interval is 0 (llm.trigger.min_request_interval_ms).
# LX: modules/llm/prediction_engine.lua send_when_free.
backend_busy_recheck_ms = 300

# How often a just-installed owned Ollama re-reads its runtime metadata
# before the daemon starts: the metadata is read off the UI thread, so the
# first read after the install is still pending; the wait stops at the
# metadata admission budget (_shared/modules/network/bootstrap_retry.json).
# HS: modules/llm/ollama_deps_checker.lua RUNTIME_METADATA_POLL_SEC.
ollama_runtime_metadata_poll_ms = 250

# HTTP request hard timeout for the remote LLM API.
# AHK: api_remote.ahk LLM_REMOTE_TIMEOUT_MS.
# HS:  api_remote.lua REQUEST_TIMEOUT_MS.
request_timeout_ms = 30000

# Period of the AI health watch that repaints the AI menu title's dot when
# the active backend turns ready or fails after the menu was built (any
# backend: local API, MLX, Ollama). It only reads in-memory state.
# HS: ui/menu/menu_llm/init.lua HEALTH_WATCH_SEC.
ai_health_watch_ms = 1000

# Deadline of one models probe of a local OpenAI-compatible server
# (_shared/modules/llm/local_servers.json). A running server on loopback
# answers in milliseconds; an absent one refuses the connection at once, so
# the deadline only bounds a server that accepted and hangs.
# HS: api_remote.lua detect_local_servers (each probe client).
local_server_probe_timeout_ms = 1500

# Deadline of each listening-socket or per-pid command of a local server sweep
# (lsof, ss, ps -p; on Windows the one shell query of the processes and
# sockets, whose cold start takes about two seconds): the sweep then goes on
# without that reading.
# AHK: local_server_port_scan.ahk. HS: local_server_ports.lua run_bounded.
# LX: local_server_ports.lua.
local_server_port_scan_timeout_ms = 6000

# Deadline of the process lookup of a local server sweep (pgrep of the
# catalogue's process names only). It prints a few rows and returned in 16 ms
# over 98 processes on Linux; two seconds leave room for the endpoint-security
# agents of a managed Mac authorizing its exec. A full ps listing (-ww, every
# argument of every process) is not used: past the pipe buffer (64 KiB) that
# hs.task reads only once the child exits, ps blocks on its write until its
# deadline (field report 2026-10-28), and the Linux runner refuses it.
# HS, LX: local_server_ports.lua list_processes.
local_server_process_lookup_timeout_ms = 2000

# Age after which the AI menu sweeps the local servers again when it is built.
# The menu's Search again row sweeps at any time.
# HS: local_servers.lua is_stale().
local_server_detection_max_age_ms = 30000

# Hard deadline for one macOS Keychain security(1) subprocess. This does not
# block input, but it bounds every credential CRUD callback and owned task.
# HS: api_token_crypto.lua OPERATION_TIMEOUT_SEC.
keychain_operation_timeout_ms = 10000

# Linux: the background move of a plaintext API key to the secret service
# (decided by the maintainer on 2026-11-11: it never blocks the daemon). Probe:
# deadline of the D-Bus read of the keyring's Locked property. Store: deadline
# of one secret-tool store or clear, killed when it passes (a prompt nobody
# answers). Retry: delay before the next attempt, doubled after each failure
# other than a locked keyring up to retry_max (a locked keyring is probed again
# after retry, since the probe never prompts).
# LX: modules/llm/api_key_migration.lua.
api_key_migration_probe_timeout_ms = 5000
api_key_migration_store_timeout_ms = 20000
api_key_migration_retry_ms = 60000
api_key_migration_retry_max_ms = 1800000

# Hard ceiling for dependency bootstrap installation and daemon polling.
# AHK: ollama_deps_checker.ahk LLM_DEPS_POLL_TIMEOUT_MS.
# HS: mlx_deps_checker.lua / ollama_deps_checker.lua BOOTSTRAP_TIMEOUT_SEC.
dependency_bootstrap_timeout_ms = 1800000

# Longest wait for the desktop's proxy answer (a company PAC is downloaded and
# evaluated) before the managed Ollama server is started with that proxy.
# LX: modules/llm/runtime_factory.lua managed proxy lookup.
managed_proxy_lookup_timeout_ms = 30000

# Longest TCP connect to a relay a PAC names before another entry ("PROXY a;
# DIRECT"): an unreachable relay sends the managed Ollama server to the next
# entry, as a browser does. LX: modules/llm/managed_ollama_proxy.lua.
# AHK: modules/llm/ollama_managed_bootstrap.ahk (ProxyListProbeMs).
managed_proxy_probe_timeout_ms = 1000

# HTTP polling interval when the remote driver polls a streaming response.
# AHK: api_remote.ahk LLM_REMOTE_POLL_MS / api_ollama.ahk LLM_OLLAMA_POLL_MS.
poll_interval_ms = 50

# How often a managed Ollama model pull's percentage is read for the model
# selector page. AHK: ollama_managed_bootstrap.ahk (the pull's capture tail).
pull_progress_poll_ms = 1000

# MLX stream: fail fast if the server never sends the first TCP byte.
stream_connect_timeout_ms = 5000

# MLX stream: kill the task if the server accepts but never sends a token
# (large models can take up to ~60 s to load weights).
stream_hard_timeout_ms = 90000

# MLX warmup: unblock _warmup_in_flight if the single-token POST never returns.
# LX: the ceiling of one Ollama load request (modules/llm/api_ollama.lua warmup).
warmup_post_timeout_ms = 30000

# MLX non-streaming inference: prevents a hung server from blocking on_fail indefinitely.
non_stream_timeout_ms = 8000

# Initial delay before the first warmup attempt after startup.
# HS: warmup_controller.lua. LX: modules/llm/warmup.lua (also its retry base and cap).
warmup_initial_delay_ms = 2000

# Base retry interval for the exponential-backoff warmup retry loop.
warmup_retry_base_ms = 5000

# Cap for the warmup retry backoff interval.
warmup_retry_cap_ms = 60000

# Minimum interval between zombie-kill passes in the MLX process manager.
zombie_kill_min_interval_ms = 3000

# Minimum interval between restart-hook invocations (prevents restart storms).

# Grace period after a fresh MLX launch before treating silence as a failure
# (8B-class models can take up to ~60 s to load weights).
fresh_launch_grace_ms = 90000

# Discovery: stop polling /v1/models after this much real time.
discovery_max_wait_ms = 180000

# Discovery: first inter-probe delay (doubles each miss, up to the cap).
discovery_poll_initial_ms = 1000

# Discovery: cap for the exponential backoff interval.
discovery_poll_max_ms = 10000

# Discovery: minimum gap between the END of one probe cycle and the START of the
# next. Distinct from the backoff above, which paces probes WITHIN a cycle and is
# reset every time a cycle begins — so without this a failed cycle restarted on
# the next run-loop tick with the backoff back at its initial value, and the
# pacing that exists never got to apply. The failure path is the one that
# retries, so the storm happens exactly when the server is not answering.
discovery_retry_cooldown_ms = 5000

# Streaming watchdog: kill the handler if no token arrives within this window.
# AHK streaming_handler equivalent; HS streaming_handler.lua STREAM_WATCHDOG_SEC.
stream_watchdog_ms = 12000

# Ollama installed-models cache TTL — avoids repeated "ollama list" calls.
# AHK: models.ahk LLM_INSTALLED_CACHE_TTL_MS.
installed_cache_ttl_ms = 2000

# Ceiling of one Ollama DELETE /api/delete round trip (the "Delete this model
# from cache" row); Ollama answers in well under a second once it holds no lock.
# AHK: api_ollama/init.ahk LLM_OLLAMA_DELETE_TIMEOUT_MS.
# LX: modules/llm/model_delete.lua.
ollama_delete_timeout_ms = 10000

# Validation chord (val_modifiers + digit N): the prediction is inserted only
# once every modifier is released, or a held Alt/Ctrl would alter the text.
# AHK: keymap/llm_bridge.ahk LLM_Tooltip_ScheduleSlotAcceptance.
# Re-check cadence of the one-shot release wait; runs only while a chord waits.
val_chord_release_poll_ms = 20
# Settle delay after the release, so the OS has processed the key-up.
val_chord_insert_delay_ms = 50
# Bound on the wait: a key-up the hook never saw cannot leave it armed.
val_chord_release_timeout_ms = 5000


# ──────────────────────────────────────────────────────────────────────
# Tooltip / UI overlays
# ──────────────────────────────────────────────────────────────────────

[tooltip]

# The hotstring and LLM tooltip durations, their decrement and their floor are
# declared once, in _shared/modules/tooltip/constants.toml [timing], which every
# driver reads. They are not repeated here: the copies this section used to hold
# had no reader, and the LLM one already disagreed (12 s against 20 s).
# test-tooltip-timing-single-source.cjs keeps them out.

# Stand-in for "never auto-dismiss" (24 h).
# HS: keymap/llm_bridge.lua INFINITE_TOOLTIP_SEC.
# AHK: keymap/llm_bridge.ahk _LLM_INFINITE_TOOLTIP_SEC (pinned copy, seconds).
infinite_ttl_ms = 86400000

# Minimum hotstring tooltip duration before the chained LLM call fires.
# AHK: keymap/llm_bridge.ahk _LLM_MIN_TOOLTIP_DURATION_SEC (pinned copy, seconds).
hotstring_min_ttl_ms = 50

# Auto-hide delay for success banners in the deps-checker UI.
# HS: modules/llm/ollama_deps_checker.lua and mlx_deps_checker.lua SUCCESS_AUTO_HIDE_SEC.
success_banner_autohide_ms = 1500

# Auto-dismiss delay for error dialogs in the download window.
# HS: ui/download_window/init.lua set_error.
error_dialog_autodismiss_ms = 8000

# Webview auto-close delay after a successful Ollama operation.
# AHK: modules/llm/ollama_webview.ahk OllamaWV_Done.
ollama_webview_autoclose_ms = 1800


# ──────────────────────────────────────────────────────────────────────
# Debounce / settle delays (keyboard, clipboard, UI)
# ──────────────────────────────────────────────────────────────────────

[debounce]

# Input-source (keyboard layout) change debounce.
# HS: karabiner/watchers.lua INPUT_SOURCE_DEBOUNCE_SEC.
input_source_ms = 250

# Delay after Cmd+C / Ctrl+C before reading the clipboard.
# HS: shortcuts/actions/text.lua COPY_SETTLE_SEC.
clipboard_copy_settle_ms = 200

# Delay before pasting transformed text (let the OS process the copy).
# HS: shortcuts/actions/text.lua PASTE_SETTLE_SEC.
clipboard_paste_settle_ms = 80

# Delay after paste before re-selecting the pasted text.
# HS: shortcuts/actions/text.lua RESELECT_DELAY_SEC.
clipboard_reselect_ms = 80

# Delay before restoring the previous clipboard contents.
# HS: shortcuts/actions/text.lua RESTORE_DELAY_SEC / keymap/utils.lua CLIPBOARD_RESTORE_SEC.
clipboard_restore_ms = 150

# macOS TIS settle: the keycode map is updated asynchronously by the Text Input
# Source subsystem AFTER the input-source-changed notification. Wait this long
# before rebuilding the Karabiner config so the NEW layout's keycode map is read
# (too short → wrong physical keys generated in karabiner.json).
# HS: karabiner/init.lua LAYOUT_TIS_SETTLE_SEC.
layout_tis_settle_ms = 500

# Inter-key pause for deletion prefixes sent to terminal/TUI prompt controls.
# Their render loop may otherwise evaluate every Backspace against one stale
# state snapshot before the replacement text arrives.
terminal_hotstring_key_delay_ms = 20


# ──────────────────────────────────────────────────────────────────────
# Gestures
# ──────────────────────────────────────────────────────────────────────

[gestures]
# Least Manhattan travel, in millimetres, before a swipe has a direction: three
# fingers or more, a pair (also the native scroll, so twice that), and a pair's
# diagonal; the others' diagonal is gestures.direction's factor of theirs. One
# value for every driver (maintainer decision GSD-3 of 2026-11-11); the swipe
# step itself is each slot's own [gestures.sensitivities] setting.
# HS: modules/gestures/geometry.lua. LX: modules/gestures/incremental_tracker.lua.
# AHK: modules/gestures/raw_touchpad.ahk, from the raw HID digitizer reports.
swipe_minimum_mm = 1.5
pair_swipe_minimum_mm = 3.0
pair_diagonal_minimum_mm = 5.0

# The Linux contact decoder's own distances, in millimetres through the
# touchpad's resolution (maintainer decision GSD-2 of 2026-11-11): the travel a
# finished swipe needs before it has a direction, and the travel after which a
# pair that landed is a scroll, so a finger joining it is a resting thumb. Both
# were 120 device units, which is this 10 mm on a pad of 12 units per mm and
# 4 mm on one of 30 (the value kept: decided by the coordinator on 2026-11-11,
# to review by the maintainer). A pad that reports neither its resolution nor
# its axes is read at the fallback resolution.
# LX: modules/gestures/mt_decoder.lua.
decoder_swipe_minimum_mm = 10.0
pair_scroll_travel_mm = 10.0
touchpad_fallback_units_per_mm = 12

# The incremental swipe step rule and the live direction lock, for a driver
# that cannot require the shared Lua modules: travel before the first action
# (FIRST_STEP), the most actions one frame may earn before a sensor jump is
# refused (MAX_ACTIONS_PER_FRAME), the smallest reversal (macOS LIVE_AXIS_MIN,
# Linux REVERSE_FLOOR_MM), the straight-axis sector (AXIS_MAX_DEGREES) and a
# diagonal's minimum as a factor of the swipe's (DIAGONAL_MINIMUM_FACTOR). The
# shared corpora (_shared/tests/corpus/gestures/incremental_steps.json and
# direction_vectors.json) pin these to the Lua constants on every driver.
# HS, LX: _shared/lua/gestures/incremental.lua, direction.lua.
# AHK: modules/gestures/incremental.ahk, direction.ahk.
incremental_first_step_mm = 4.0
incremental_max_actions_per_frame = 100
incremental_reverse_floor_mm = 1.0
swipe_axis_max_degrees = 25
swipe_diagonal_minimum_factor = 1.5

# Windows: how long after a raw touch ends the Precision Touchpad settings'
# shortcut for that swipe still belongs to it. A touch that stepped while
# moving swallows the shortcut within this window; a touch whose frames stop
# for this long without a lift frame is over, so a deferred shortcut fires.
# AHK: modules/gestures/raw_touchpad.ahk.
incremental_handoff_ms = 300

# Windows: how long a gesture's synthetic keys stay marked, the settle after an
# action's own window change, and the wait before the first auto-configuration.
synthetic_clear_ms = 300
action_settle_ms = 300
auto_configure_delay_ms = 250

# Windows: how often a worker-authored result file is checked after a touchpad
# restart or gesture registration.
# AHK: modules/gestures/config.ahk, ui/onboarding/gesture_registration.ahk.
worker_result_poll_ms = 100

# Touchdevice discovery: how often the startup phase checks for the first frame.
# HS: gestures/init.lua STARTUP_PROBE_INTERVAL_SEC.
probe_interval_ms = 500

# One-shot safety re-probe at startup if no frame has arrived yet.
# HS: gestures/init.lua STARTUP_SAFETY_PROBE_SEC.
startup_safety_probe_ms = 5000

# Timeout after which the aggressive startup phase is abandoned.
# HS: gestures/init.lua STARTUP_PHASE_TIMEOUT_SEC.
startup_phase_timeout_ms = 30000

# Hard deadline for one interactive gesture-owned open/AppleScript child.
# HS: gestures/actions_aux_owner.lua SHELL_DEADLINE_SEC.
aux_shell_timeout_ms = 10000

# Free names new_text_file_here tries in a folder ("New text file.txt", then
# "New text file 2.txt"…) before it gives up on a folder that holds them all.
# LX: modules/gestures/system_actions.lua. HS: modules/gestures/system_actions.lua
# and AHK: modules/gestures/system_actions.ahk keep a copy of the same count.
new_text_file_name_attempts = 100

# Longest a hidden run_command child may run before it is stopped and its
# failure notified (a terminal window is the user's own and is not bounded).
# HS: gestures/user_actions.lua. LX: modules/gestures/user_actions.lua.
run_command_timeout_ms = 30000

# Longest one `shortcuts run` of a run_apple_shortcut binding may take before it
# is stopped (each `shortcuts list` revalidation keeps the owner's own bound).
# HS: gestures/apple_shortcut_action.lua.
apple_shortcut_run_timeout_ms = 60000

# Delay between exact termination retries after an auxiliary child times out.
# HS: gestures/actions_aux_owner.lua SHELL_CLEANUP_RETRY_SEC.
aux_shell_cleanup_retry_ms = 500

# Native switcher observation deadline, separate from process and gesture timers.
# HS: gestures/native_app_switcher_action.lua; this does not bound retirement debt.
native_switcher_deadline_ms = 8000

# Native switcher input/sampling and broker polling cadence, never a blocking sleep.
# HS: gestures/native_app_switcher_action.lua.
native_switcher_poll_ms = 20

# How often the macOS Trackpad and Dock gesture preferences are read again, so a
# slot whose macOS gesture was turned on is greyed and held back, and comes back
# once it is off (one `defaults read` per domain, never on the touch path).
# HS: gestures/conflicts.lua start_watch.
system_prefs_recheck_ms = 20000

# Slow health-check cadence once touch frames are flowing normally.
# HS: gestures/init.lua HEALTH_CHECK_INTERVAL_SEC.
health_check_interval_ms = 30000

# Maximum capture window for a multi-finger tap gesture.
# HS: gestures/engine.lua TAP_MAX_SEC.
tap_max_ms = 700

# Minimum rearm delay between consecutive live-axis triggers.
# HS: gestures/engine.lua LIVE_REARM_SEC.
live_rearm_ms = 80

# Faster rearm when the user reverses direction strongly.
# HS: gestures/engine.lua LIVE_REARM_REVERSE_FAST_SEC.
live_rearm_reverse_ms = 30

# Delay before confirming a finger contact as intentional.
# HS: gestures/engine.lua FINGER_CONFIRM_MS.
finger_confirm_ms = 50

# Delay before confirming a finger lift.
# HS: gestures/engine.lua FINGER_DROP_CONFIRM_MS.
finger_drop_confirm_ms = 200

# Consecutive touch frames a higher finger count must hold before the Linux
# decoder recognises a gesture at it, so a palm grazing the pad for one frame
# is not a third finger. Two frames keep a deliberate staggered landing.
# LX: gestures/mt_decoder.lua stable_frames.
finger_join_frames = 2

# Window to wait for staggered multi-finger contact to stabilise.
# HS: gestures/engine.lua FINGER_COUNT_STABLE_MS.
finger_count_stable_ms = 60

# How long a third finger joining a pair must stay down before the gesture is
# recognised at three, while the pair has not scrolled yet (about two frames).
# HS: gestures/engine.lua PAIR_JOIN_CONFIRM_SEC.
pair_join_confirm_ms = 20

# Window after a two-finger touch-down in which more fingers may still land and
# make it a three-or-more-finger gesture, as long as the pair has not scrolled.
# HS: gestures/engine.lua MULTI_FINGER_LANDING_SEC.
# LX: gestures/mt_decoder.lua landing_sec.
multi_finger_landing_ms = 300

# After a real scroll ends (a native momentum phase, or a locked two-finger
# scroll lifting), no three-or-more-finger gesture may fire for this long. A
# mere two-finger touch arms nothing.
# HS: gestures/engine.lua SCROLL_MOMENTUM_GUARD_SEC.
# LX: gestures/mt_decoder.lua scroll_guard_sec.
scroll_momentum_guard_ms = 200

# Post-gesture click cooldown to prevent double-fires.
# HS: gestures/actions.lua CLICK_COOLDOWN_SEC.
click_cooldown_ms = 150

# Delay before the boot-time touchpad auto-configuration runs.
# AHK: gestures/init.ahk GESTURE_AUTO_CONFIGURE_BOOT_DELAY_MS (pinned copy).
gesture_auto_configure_delay_ms = 2000

# macOS: delay before the emergency recycle of the gesture watchers runs, so the
# frame that triggered it has been delivered.
# HS: modules/gestures/init.lua schedule_emergency_recycle.
emergency_recycle_delay_ms = 20


# ──────────────────────────────────────────────────────────────────────
# Keep-awake (activity simulation)
# ──────────────────────────────────────────────────────────────────────

[keep_awake]

# Minimum interval between mouse-jitter ticks.
# AHK: win.ahk AWAKE_TICK_MIN_MS. HS: system.lua AWAKE_TICK_MIN_SEC.
tick_min_ms = 1000

# Maximum interval between mouse-jitter ticks.
# AHK: win.ahk AWAKE_TICK_MAX_MS. HS: system.lua AWAKE_TICK_MAX_SEC.
tick_max_ms = 5000

# Delay to hold the cursor offset before returning it to origin.
# AHK: win.ahk AWAKE_RETURN_MS. HS: system.lua AWAKE_RETURN_DELAY_SEC.
return_delay_ms = 200


# ──────────────────────────────────────────────────────────────────────
# Keystats
# ──────────────────────────────────────────────────────────────────────

[keystats]
# Windows: the poll while keystats stops, and the wait before the page's first data.
stop_poll_ms = 50
first_push_delay_ms = 1500

# Background ingest tick — how often buffered events are flushed to disk.
# AHK: keystats.ahk INGEST_TICK_MS. HS: log_manager.lua INGEST_TICK_SEC.
ingest_tick_ms = 5000

# Hard deadline for one private SQLite child, including its stdin feed.
# Linux: reservation, transactional flush and commit-receipt resolution are
# separate owned phases; no new phase starts before physical cleanup ACK.
sqlite_operation_timeout_ms = 1000

# How long a dashboard READ waits for the single writer's lock (a COMMIT holds
# it for milliseconds) before the read is refused. The databases use a rollback
# journal, so a reader meets SQLite's busy state while the writer commits; with
# no wait that was an immediate refusal and an empty or partial dashboard. Must
# stay below sqlite_operation_timeout_ms. A hot rollback journal left by an
# interrupted write is NOT waited for: only the writer's next open recovers it.
# Linux: sqlite_reader.lua (.timeout). macOS: sqlite_reader.lua (busy_timeout).
sqlite_read_busy_timeout_ms = 500

# Keystroke delay above this value is treated as a "thinking pause".
# AHK: keystats.ahk / keystats_walker.ahk THINK_PAUSE_MS.
# HS: aggregator.lua THINK_PAUSE_THRESHOLD_MS.
think_pause_ms = 2000

# Cap for inter-keystroke delay used in WPM bucketing / n-gram analysis.
# AHK: keystats.ahk / keystats_walker.ahk WPM_MAX_DELAY_MS.
# HS: aggregator.lua MAX_KEYSTROKE_DELAY_MS / log_manager.lua WPM_MAX_EVENT_DELAY_MS.
max_keystroke_delay_ms = 5000

# Day-rollover midnight check cadence.
# AHK: keystats.ahk MIDNIGHT_CHECK_TICK_MS.
midnight_check_tick_ms = 60000

# A wake from sleep earlier than this, counted from local midnight, is a night
# wake (the dashboard's « reprises entre 0 h et 6 h »). Read by each driver's
# system-day aggregation. AHK: keystats_walker_core.ahk KLWConst.NIGHT_WAKE_END_MS.
night_wake_end_ms = 21600000

# Gap between keystrokes that marks a burst boundary.
# AHK: keystats_walker.ahk BURST_GAP_MS. HS: aggregator.lua BURST_GAP_MS.
burst_gap_ms = 1000

# Inactivity gap that starts a new typing session.
# AHK: keystats_walker.ahk SESSION_GAP_MS. HS: aggregator.lua SESSION_GAP_MS.
session_gap_ms = 300000

# Maximum delay that is still classified as auto-repeat (key held down).
# AHK: keystats_walker.ahk AUTO_REPEAT_MAX_DELAY_MS. HS: aggregator.lua.
auto_repeat_max_delay_ms = 50

# Minimum hold duration to classify a key event as a deliberate hold.
# AHK: keystats_walker.ahk HOLD_THRESHOLD_MS. HS: aggregator.lua.
hold_threshold_ms = 250

# Micro-idle timeout: user is considered briefly idle after this silence.
# AHK: keystats_watchers.ahk MICRO_IDLE_TIMEOUT_MS. HS: keystats/init.lua.
micro_idle_timeout_ms = 30000

# Full session timeout: user is considered absent after this silence.
# AHK: keystats_watchers.ahk SESSION_TIMEOUT_MS. HS: keystats/init.lua.
session_timeout_ms = 300000

# Idle-check poll interval (how often the watcher tests for inactivity).
# AHK: keystats_watchers.ahk IDLE_CHECK_INTERVAL_MS. HS: keystats/init.lua.
idle_check_interval_ms = 10000

# macOS: how often the keystats module checks that its event tap still runs. Slower
# than the script-control watchdog (ui.script_control_tap_watchdog_interval_ms)
# on purpose: keystats only loses statistics when its tap stalls, while a stalled
# script-control tap strands the un-pause shortcut.
# HS: keystats/init.lua TAP_WATCHDOG_INTERVAL_SEC.
tap_watchdog_interval_ms = 5000

# A single continuous typing session at least this long counts as a long session
# on the metrics dashboards (90 min, the clinical RSI risk threshold).
# JS: LONG_SESSION_THRESHOLD_MS in ui/metrics_typing/data.js and ui/metrics_apps/state.js
# (pages cannot read this file; test-keystats-timings-single-source.cjs pins them).
long_session_threshold_ms = 5400000

# Maintenance pass interval (log rotation, cache cleanup, etc.).
