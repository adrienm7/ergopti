parameter = "llm_prompt"

[sg_actions.llm_predict_raw]
# One ready-made action per built-in prompt profile of
# _shared/modules/llm/profiles.json (tools/test/test-llm-prompt-actions-single-source.cjs
# pins the set): llm_prompt_prediction with that profile and the AI menu's
# prediction count, so an official prompt needs no parameter to bind.
