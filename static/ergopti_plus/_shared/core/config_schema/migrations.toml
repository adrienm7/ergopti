# _shared/core/config_schema/migrations.toml
# Versioned config.toml: the ordered, data-only migration registry.
#
# READ AT RUNTIME, ON EVERY BOOT, BY ALL THREE DRIVERS, before anything applies
# or saves config.toml: Windows through windows/infra/config_migrate.ahk, macOS
# and Linux through _shared/lua/config_migrate.lua. The decision record is
# docs/adr/009-config-versioning.md.
#
# A config.toml carries its version in ``[_meta] schema_version``. A file with
# no stamp is ``unstamped_version``. At boot a driver:
#   - older file  -> byte-exact backup ``<name>.pre-v<N>-<stamp>.toml``, every
#                    step from the file's version to ``current_version`` in
#                    order, stamp last, one atomic publish;
#   - stamped below ``oldest_version``
#                 -> the file is never written and the session is read-only
#                    (ERROR logged, notice shown). v2 to v11 were written by
#                    pre-releases only and their steps were squashed away on
#                    2026-11-01: ``oldest_version`` is v12, what ErgoptiPlus
#                    1.0.0 wrote and what the notice's bridge, 1.0.8, still
#                    climbs from any older file. Raising it past a schema a
#                    public release wrote needs a maintainer's decision, and the
#                    bridge named in ``config.read_only.older_schema``;
#   - no stamp, once ``unstamped_version`` is below ``oldest_version``
#                 -> treated as current: no step runs, no backup, and the next
#                    save stamps it. Unknown keys go to the explicit cleanup;
#   - current     -> nothing is written;
#   - newer file  -> the file is never written and the session is read-only
#                    (ERROR logged), so a downgrade cannot destroy settings a
#                    newer build wrote.
#
# Steps are ``[steps.v<from>_to_v<to>]`` tables with to = from + 1. ``drivers``
# names the drivers whose files the ops apply to ("ahk", "hs", "linux"); any
# other driver only moves its stamp through that version. ``ops`` is an array
# drawn from a CLOSED set, addressed by explicit section/key (a section is a
# [header] path, a key is one bare segment inside it). The op lines below are
# parsed, as written, into the Windows field table by
# tools/codegen/codegen-config-migration-ops.cjs: ``field?`` is optional.
#   { op = "rename", section, key, to_section?, to_key? }
#       Moves one value. Absent source: no-op. Existing target: the target
#       keeps its value and the source is dropped.
#   { op = "copy_if_absent", section, key, to_section?, to_key? }
#       Copies a present value into an absent target, retaining the source.
#       Copies own nested arrays and maps; an existing target keeps its value.
#       At least one target field is required; copying to the same path is a no-op.
#       An explicit ancestor value or descendant table also occupies a target:
#       copying there is a no-op and leaves both namespaces untouched.
#   { op = "rename_prefix", section, prefix, to_prefix }
#       Renames every key of one section that starts with prefix to to_prefix
#       followed by the same remainder; other keys and sub-sections stay. A
#       target already held by a key or a table refuses the migration
#       ("invalid", the file is never written). Neither prefix may extend the
#       other, so a replay finds nothing left to rename.
#   { op = "move_chord_action", section, key, to_section, action,
#     conditional_key, disabled_action, platform = "macos" }
#       Handoffs only exact legacy mods/key values represented by the injected
#       modifier catalogue's ordinary shortcut groups, or an explicit false.
#       Missing destinations receive the action and contextual disabled action.
#       Existing recognized action choices win. Unknown values, metadata,
#       actions or occupied namespaces retain every source byte and its owner.
#       Historical [section.key] mods/key tables use the same exact contract.
#       All destinations must be represented before any source is removed.
#   { op = "move_ergopti_variant", section, key, to_key, base_key, alt_gr_key,
#     source_key, false_variant, true_variant, neutral_variant? }
#       Replaces the boolean key by to_key, holding true_variant or false_variant.
#       An absent key is a no-op. base_key, alt_gr_key and source_key are read as
#       witnesses and stay. A malformed participant, an occupied namespace or a
#       to_key disagreeing with the boolean refuses the migration ("invalid").
#   { op = "move_section", section, to_section }
#       Moves a section and every section below it. Same conflict rule.
#   { op = "merge_into", section, to_section }
#       Moves the keys of one section (not its sub-sections) into another.
#       Same conflict rule.
#   { op = "map_value", section, key, map = [{ from, to }, ...] }
#       Replaces a present value equal (same type) to a ``from``.
#   { op = "encode_value", section, key, to_section, to_key, encoding }
#       A non-empty array of tables becomes the encoded string of its new key
#       (the one encoding: "user_profile_registry", the llm.user_profiles
#       envelope); an occupied target, or anything else, stays where it is.
#   { op = "wrap_value", section, key, to_key }
#       Moves a present scalar into its own [section.key] table as to_key (a
#       bare `date = true` becomes [section.date] enabled = true). A table, an
#       array or an absent key is left as is, so a replay changes nothing.
#   { op = "delete", section, key? }
#       Deletes one key, or without ``key`` a section and every section
#       below it.
#   { op = "set_if_absent", section, key, value }
#       Writes a value only where the key is absent (freezes an old default
#       before the default changes).
# A section left without keys by an op disappears. Every op is idempotent, so
# replaying a step on its own output changes nothing.
#
# Policy: a key rename or move ships in the SAME commit as its step here;
# readers drop the old spelling at once (no runtime aliases). Retired keys
# reported by the explicit cleanup remain untouched until that cleanup runs. The
# registry, its corpus (_shared/tests/corpus/config_migrations/), the registry
# defects every loader rejects (_shared/tests/corpus/config_migration_registries/)
# and the three interpreters are pinned together by
# tools/test/test-config-migrations.cjs.

[registry]
current_version = 21
unstamped_version = 2
oldest_version = 12





# ===================================
# ===================================
# ======= 1. Steps (in order) =======
# ===================================
# ===================================

[steps.v12_to_v13]
from = 12
to = 13
drivers = ["ahk"]
reason = "The Windows dynamic-hotstring master becomes hotstrings.dynamic.enabled, as on macOS and Linux; a stored category switch keeps its value and a configuration without one keeps its families live."
# `category_enabled.dynamichotstrings` is the only spelling an older Windows
# configuration can hold for this switch. An existing hotstrings.dynamic.enabled
# keeps its value (rename never overwrites a target). Without either key the
# families that were live under the Hotstrings master stay live: the new master
# is written on, because its neutral default is off.
ops = [
	{ op = "rename", section = "category_enabled", key = "dynamichotstrings", to_section = "hotstrings.dynamic", to_key = "enabled" },
	{ op = "set_if_absent", section = "hotstrings.dynamic", key = "enabled", value = true },
]

# The cascade counts arrows, not further links.
[steps.v13_to_v14]
from = 13
to = 14
drivers = ["ahk", "hs", "linux"]
reason = "hotstrings.cascade_depth (0 = off, n = n more hotstrings) becomes hotstrings.cascade_max_arrows (1 = a single expansion, n = n arrows): the user's effective choice is kept."
# The old value n chained n more hotstrings after the first, that is n + 1
# arrows, and 0 meant the first expansion only, that is 1 arrow. The old and the
# new values overlap (an old 1 is a new 2, an old 2 a new 3), which the closed
# map_value op refuses in one pass because a replay would map twice; the value
# therefore goes through a text spelling the new numbers cannot collide with:
# integer to text, then text to the new integer, then the rename. A key that is
# absent or already moved makes the whole step a no-op, so a replay changes
# nothing. An old value of 10 (hand-edited; the menu offered 0 to 3) keeps its
# number, which is the new maximum; 11 or more maps to no pair, keeps its number
# under the new name and is reported there as outdated configuration, read as
# the default.
ops = [
	{ op = "map_value", section = "hotstrings", key = "cascade_depth", map = [{ from = 0, to = "1" }, { from = 1, to = "2" }, { from = 2, to = "3" }, { from = 3, to = "4" }, { from = 4, to = "5" }, { from = 5, to = "6" }, { from = 6, to = "7" }, { from = 7, to = "8" }, { from = 8, to = "9" }, { from = 9, to = "10" }] },
	{ op = "map_value", section = "hotstrings", key = "cascade_depth", map = [{ from = "1", to = 1 }, { from = "2", to = 2 }, { from = "3", to = 3 }, { from = "4", to = 4 }, { from = "5", to = 5 }, { from = "6", to = 6 }, { from = "7", to = 7 }, { from = "8", to = 8 }, { from = "9", to = 9 }, { from = "10", to = 10 }] },
	{ op = "rename", section = "hotstrings", key = "cascade_depth", to_key = "cascade_max_arrows" },
]

# The OS-named keyboard slot ids become role-named ones (docs/design/one-shortcut-model.md).
[steps.v14_to_v15]
from = 14
to = 15
drivers = ["hs", "linux"]
reason = "Keyboard slots are named by modifier role (primary_g, secondary_a, meta_space) instead of by operating system, and the macOS Ctrl-letter switches become the slots of the same chords: every saved binding keeps its action."
# macOS and Linux slot ids are disjoint (cmd_/hs_ vs ctrl_/super_), so one list
# serves both drivers: an op names a key the other driver's file never holds.
# A saved slot is renamed first, so an action the user chose for a slot always
# beats the action implied by the retired switch of the same chord ("an existing
# target keeps its value"). A switch left on becomes its catalogue action, a switch
# the user turned off becomes "none", and the switch itself is deleted. The
# ChatGPT switch (ctrl_g, with the shortcuts.chatgpt_url setting) and the
# Cmd+* and wrap-selection switches stay: they are not catalogue actions yet.
# The per-slot action parameters ("keyboard__<slot>__<action>" keys) follow
# their slot with one rename_prefix per retired slot family, in the section
# each driver keeps them in: macOS [gestures.action_parameters], Linux
# [gesture_parameters] and its pre-2026-08 [linux.action_parameters], which the
# Linux reader still reads. hs_ctrl_ and hs_option_ do not extend each other, so
# the order of the families is free.
ops = [
	{ op = "rename_prefix", section = "gestures.action_parameters", prefix = "keyboard__cmd_", to_prefix = "keyboard__primary_" },
	{ op = "rename_prefix", section = "gestures.action_parameters", prefix = "keyboard__hs_ctrl_", to_prefix = "keyboard__secondary_" },
	{ op = "rename_prefix", section = "gestures.action_parameters", prefix = "keyboard__hs_option_", to_prefix = "keyboard__alt_" },
	{ op = "rename_prefix", section = "gesture_parameters", prefix = "keyboard__ctrl_", to_prefix = "keyboard__primary_" },
	{ op = "rename_prefix", section = "gesture_parameters", prefix = "keyboard__super_", to_prefix = "keyboard__meta_" },
	{ op = "rename_prefix", section = "linux.action_parameters", prefix = "keyboard__ctrl_", to_prefix = "keyboard__primary_" },
	{ op = "rename_prefix", section = "linux.action_parameters", prefix = "keyboard__super_", to_prefix = "keyboard__meta_" },
	{ op = "rename", section = "shortcuts.keyboard", key = "cmd_a", to_key = "primary_a" },
	{ op = "rename", section = "shortcuts.keyboard", key = "cmd_b", to_key = "primary_b" },
	{ op = "rename", section = "shortcuts.keyboard", key = "cmd_c", to_key = "primary_c" },
