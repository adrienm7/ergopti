<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script src="../a11y_prefs.js"></script>
		<link rel="stylesheet" href="../theme.css" />
		<link rel="stylesheet" href="style.css" />
		<script src="../i18n.js"></script>
		<script src="../host_bridge.js"></script>
	</head>
	<body>
		<header id="hdr">
			<hgroup class="hdr-text">
				<h1 id="title"></h1>
				<p id="subtitle"></p>
			</hgroup>
			<button
				id="toc-btn"
				type="button"
				data-i18n-title="dialog.action_picker.contents"
				onclick="toggleToc()"
				aria-controls="toc"
				aria-expanded="false"
			></button>
		</header>

		<!-- The field filters the list and moves its highlight: a combobox whose
		     active option a screen reader announces as the arrows move it. The
		     script names the list boxes it controls and the active option. -->
		<search id="search-bar" role="search" aria-labelledby="title">
			<input
				id="search"
				type="text"
				role="combobox"
				aria-autocomplete="list"
				aria-expanded="true"
				autocomplete="off"
				autocorrect="off"
				spellcheck="false"
			/>
		</search>

		<!-- A keyboard stop of its own: the list scrolls, and the arrows and Enter
		     work from it as from the search field (WCAG 2.1.1). Each run of
		     actions under a heading is a list box of options. -->
		<main id="list" tabindex="0" aria-labelledby="title"></main>

		<!-- The editor of a send_text / send_key / send_shortcut value, or of the
		     prompt and count of an llm_prompt_prediction, the vision backend of a
		     screen action or the target language of a translation, shown in place of the
		     list once such an action is picked, so it is the main landmark then
		     (one main is shown at a time). -->
		<section id="param" role="main" aria-labelledby="param-title" hidden>
			<h2 id="param-title"></h2>
			<p id="param-prompt"></p>
			<p id="param-hint"></p>
			<input
				id="param-input"
				aria-labelledby="param-prompt"
				type="text"
				autocomplete="off"
				autocorrect="off"
				spellcheck="false"
			/>
			<p id="param-choice" hidden>
				<label id="param-profile-label" for="param-profile"></label>
				<select id="param-profile"></select>
				<label id="param-count-label" for="param-count"></label>
				<select id="param-count"></select>
			</p>
			<p id="param-vision" hidden>
				<label id="param-vision-provider-label" for="param-vision-provider"></label>
				<select id="param-vision-provider"></select>
				<label id="param-vision-model-label" for="param-vision-model"></label>
				<input
					id="param-vision-model"
					type="text"
					autocomplete="off"
					autocorrect="off"
					spellcheck="false"
				/>
			</p>
			<p id="param-language" hidden>
				<label id="param-language-label" for="param-language-select"></label>
				<select id="param-language-select"></select>
			</p>
			<fieldset id="param-program" hidden>
				<section
					id="param-program-automation"
					aria-labelledby="param-program-automation-title"
					hidden
				>
					<p id="param-program-automation-title"></p>
					<p id="param-program-automation-reason"></p>
					<ul id="param-program-automation-list"></ul>
				</section>
				<fieldset id="param-program-provider" hidden>
					<label id="param-program-provider-label" for="param-program-provider-select"></label>
					<select id="param-program-provider-select"></select>
					<p id="param-program-provider-hint"></p>
					<p id="param-program-provider-status" role="status"></p>
				</fieldset>
				<label id="param-program-executable-label" for="param-program-executable"></label>
				<input id="param-program-executable" type="text" autocomplete="off" spellcheck="false" />
				<p id="param-program-arguments-label"></p>
				<ol id="param-program-arguments"></ol>
				<button id="param-program-add" type="button"></button>
			</fieldset>
			<p id="param-error" role="alert" hidden></p>
			<footer class="param-buttons">
				<button id="param-back" type="button"></button>
				<button id="param-save" type="button"></button>
			</footer>
		</section>

		<p id="empty" role="status" hidden></p>

		<!-- Table-of-contents drawer: lists every heading (indented by level). -->
		<nav id="toc" aria-labelledby="toc-title" hidden>
			<h2 id="toc-title" class="theme-sr-only" data-i18n="dialog.action_picker.contents"></h2>
			<ul id="toc-inner"></ul>
		</nav>

		<footer id="ftr">
			<output id="count" for="search"></output>
			<button id="btn-edit-current" type="button" hidden></button>
			<button id="btn-cancel" type="button" onclick="doCancel()"></button>
		</footer>

		<script src="../program_parameter.js"></script>
		<script src="../value_check.js"></script>
		<script src="script.js"></script>
	</body>
</html>
