[steps.v6_to_v7]
from = 6
to = 7
drivers = ["hs"]
reason = "Layer + Scroll is retired on macOS: the navigation layer's wheel bindings (layers.toml WheelUp and WheelDown, edited from Tap-Holds > Edit the layer) replace it."
# The switch had no effect left: it armed on an F19 key that only the retired
# legacy Karabiner rules sent. An existing layers.toml gains no wheel binding
# (a loader never falls back to the preset), so the wheel keeps scrolling while
# the layer is held until the user binds it in the layer editor or restores the
# recommended layer, whose wheel is volume up and down.
# The retired switch remains on disk for the explicit outdated-key cleanup.
ops = []

[steps.v7_to_v8]
from = 7
to = 8
drivers = ["hs"]
reason = "The script-management chords are one set of four slots on every driver: the macOS switch and its three right-Option slots take the names Windows and Linux use."
# The macOS `enabled` switch turned every chord off, as chords_enabled off
# does; return_key, backspace and escape held the
# actions of right Option + Return, Backspace and Escape. The Delete slot is
# new on macOS and has nothing to carry over.
ops = [
	{ op = "rename", section = "shortcuts.script_control", key = "enabled", to_key = "chords_enabled" },
	{ op = "rename", section = "shortcuts.script_control", key = "return_key", to_key = "script_altgr_enter" },
	{ op = "rename", section = "shortcuts.script_control", key = "backspace", to_key = "script_altgr_backspace" },
	{ op = "rename", section = "shortcuts.script_control", key = "escape", to_key = "script_altgr_escape" },
]

[steps.v8_to_v9]
from = 8
to = 9
drivers = ["hs"]
reason = "Representable legacy hotstring editor shortcuts become ordinary actions; explicit custom or disabled choices disable the contextual recommendation."
ops = [
	{ op = "move_chord_action", section = "hotstrings.editor", key = "shortcut", to_section = "shortcuts.keyboard", action = "open_hotstrings_editor", conditional_key = "magic_editor", disabled_action = "none", platform = "macos" },
]

[steps.v9_to_v10]
from = 9
to = 10
drivers = ["ahk"]
reason = "The Windows number-row switch becomes an explicit native, digits or symbols policy; only genuine legacy booleans are mapped."
ops = [
	{ op = "map_value", section = "layout", key = "direct_access_digits", map = [{ from = false, to = "native" }, { from = true, to = "digits" }] },
]

[steps.v10_to_v11]
from = 10
to = 11
drivers = ["ahk", "hs", "linux"]
reason = "Common autocorrections become independently selectable names, abbreviations and technical terms; existing destinations and unrelated legacy fields retain their values."
ops = [
	{ op = "copy_if_absent", section = "hotstrings.autocorrection.caps", key = "enabled", to_section = "hotstrings.autocorrection.names" },
	{ op = "copy_if_absent", section = "hotstrings.autocorrection.caps", key = "time_activation_seconds", to_section = "hotstrings.autocorrection.names" },
	{ op = "copy_if_absent", section = "hotstrings.modules.autocorrection", key = "caps", to_key = "names" },
	{ op = "copy_if_absent", section = "hotstrings.autocorrection.caps", key = "enabled", to_section = "hotstrings.autocorrection.abbreviations" },
	{ op = "copy_if_absent", section = "hotstrings.autocorrection.caps", key = "time_activation_seconds", to_section = "hotstrings.autocorrection.abbreviations" },
	{ op = "copy_if_absent", section = "hotstrings.modules.autocorrection", key = "caps", to_key = "abbreviations" },
	{ op = "copy_if_absent", section = "hotstrings.autocorrection.caps", key = "enabled", to_section = "hotstrings.autocorrection.technical_terms" },
	{ op = "copy_if_absent", section = "hotstrings.autocorrection.caps", key = "time_activation_seconds", to_section = "hotstrings.autocorrection.technical_terms" },
	{ op = "copy_if_absent", section = "hotstrings.modules.autocorrection", key = "caps", to_key = "technical_terms" },
	{ op = "delete", section = "hotstrings.autocorrection.caps", key = "enabled" },
	{ op = "delete", section = "hotstrings.autocorrection.caps", key = "time_activation_seconds" },
	{ op = "delete", section = "hotstrings.modules.autocorrection", key = "caps" },
]
