<!-- _shared/ui/paths_editor/index.html -->
<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<title data-i18n="menu.paths.window_title"></title>
		<script src="../a11y_prefs.js"></script>
		<link rel="stylesheet" href="../theme.css" />
		<link rel="stylesheet" href="style.css" />
		<script src="../host_bridge.js"></script>
	</head>
	<body>
		<main>
			<h1 data-i18n="paths_editor.heading"></h1>
			<p class="subtitle" data-i18n="paths_editor.subtitle"></p>

			<form id="paths-form">
				<section class="row" aria-labelledby="label-config-dir">
					<header class="row-header" data-icon="📁">
						<label
							for="input-config-dir"
							id="label-config-dir"
							data-i18n="paths_editor.label_config_dir"
						></label>
						<output
							id="tag-config-dir"
							class="tag-default"
							for="input-config-dir"
							data-i18n="paths_editor.tag_default"
						></output>
					</header>
					<p class="path-input-wrap">
						<input type="text" id="input-config-dir" value="" />
						<button
							type="button"
							id="btn-browse"
							class="btn-browse"
							data-i18n="paths_editor.btn_browse"
						></button>
					</p>
					<dl class="row-default">
						<dt data-i18n="paths_editor.default_label"></dt>
						<dd><code id="default-config-dir"></code></dd>
					</dl>
				</section>
				<section class="row" aria-labelledby="label-logs-dir">
					<header class="row-header" data-icon="📄">
						<label
							for="input-logs-dir"
							id="label-logs-dir"
							data-i18n="paths_editor.label_logs_dir"
						></label>
						<output
							id="tag-logs-dir"
							class="tag-default"
							for="input-logs-dir"
							data-i18n="paths_editor.tag_default"
						></output>
					</header>
					<p class="path-input-wrap">
						<input type="text" id="input-logs-dir" value="" />
						<button
							type="button"
							id="btn-browse-logs"
							class="btn-browse"
							data-i18n="paths_editor.btn_browse"
						></button>
					</p>
					<dl class="row-default">
						<dt data-i18n="paths_editor.default_label"></dt>
						<dd><code id="default-logs-dir"></code></dd>
					</dl>
					<p class="row-hint" data-i18n="paths_editor.hint_logs_dir"></p>
				</section>
			</form>

			<footer class="btns">
				<button
					type="button"
					id="btn-reset"
					class="reset"
					data-i18n="paths_editor.btn_reset"
				></button>
				<button
					type="button"
					id="btn-cancel"
					class="cancel"
					data-i18n="paths_editor.btn_cancel"
				></button>
				<button type="button" id="btn-save" class="save" data-i18n="paths_editor.btn_save"></button>
			</footer>
		</main>

		<script src="script.js"></script>
	</body>
</html>
