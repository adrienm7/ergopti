<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<title data-i18n="token_prompt.window_title"></title>
		<script src="../a11y_prefs.js"></script>
		<link rel="stylesheet" href="../theme.css" />
		<link rel="stylesheet" href="style.css" />
		<script src="../i18n.js"></script>
		<script src="../host_bridge.js"></script>
	</head>
	<body>
		<main id="container">
			<h1 data-i18n="token_prompt.title"></h1>

			<p id="instruction" data-i18n="token_prompt.instruction"></p>

			<p id="link-section">
				<span data-i18n="token_prompt.no_token"></span>
				<a
					href="javascript:void(0)"
					onclick="doOpenLink()"
					data-i18n="token_prompt.create_link"
				></a>
			</p>

			<p id="token-input-wrapper">
				<label for="token-input" data-i18n="token_prompt.label"></label>
				<input
					type="password"
					id="token-input"
					autocomplete="off"
					spellcheck="false"
					data-i18n-placeholder="token_prompt.placeholder"
					autofocus
				/>
			</p>

			<footer id="button-group">
				<button id="btn-cancel" onclick="doCancel()" data-i18n="common.cancel"></button>
				<button id="btn-validate" onclick="doValidate()" data-i18n="token_prompt.validate"></button>
			</footer>
		</main>

		<script src="script.js"></script>
	</body>
</html>
