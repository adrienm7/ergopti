# --- Actions système avancées ---

[sg_actions.select_line]
# Windows emits the sequence below, macOS runs its shortcut-layer text owner
# under the dispatching parent, and Linux reaches modules/shortcuts/manager
# through the daemon-injected handlers (modules/shortcuts/action_handlers.lua).
platform = "all"
emit_ahk = "{Home}{Shift Down}{End}{Shift Up}"

[sg_actions.select_word]
# Move to the end of the word, then select back to its start. Windows moves to
# the start of the next word, so its selection keeps the trailing space.
platform = "all"
emit_ahk = "^{Right}^+{Left}"

[sg_actions.screen_capture]
# Opens the operating system's own capture tool through the shortcut the OS
# reserves for it: the Snipping Tool overlay (Win+Shift+S), the macOS
# Screenshot toolbar (Cmd+Shift+5), and whatever the Linux desktop binds to
# Print (GNOME's screenshot UI, KDE Spectacle, Xfce Screenshooter).
platform = "all"
emit_ahk = "#+s"
emit_hs_key = "5"
emit_hs_mods = ["cmd", "shift"]
emit_linux = "Print"

[sg_actions.screen_capture_instant]
# The frontmost window, saved to the screenshots folder: GestureScreenshotInstant
# on Windows, the shortcut layer's capture_frontmost_window on macOS (what the
# key left of 1 ran before it became a tap key). Linux is not implemented, not
# impossible: the focused window is readable on X11 and through each Wayland
# compositor's own tool.
platform = "ahk,hs"

[sg_actions.ocr_screenshot]
platform = "ahk"
emit_ahk = "#+t"

[sg_actions.open_chatgpt]
platform = "linux"
requires_linux = ["tool:xdg-open"]

[sg_actions.open_url]
platform = "all"
requires_linux = ["tool:xdg-open"]
# The parameter belongs to a binding (gesture, tap-hold or shortcut), never to
# the action globally: two bindings may legitimately open two different URLs.
parameter = "url"

[sg_actions.pick_color]
# macOS reads the pixel through screencapture (parent-scoped pixel owner).
# Linux: Wayland forbids reading the screen outside a portal that asks the user
# to pick, which is a different interaction; an X11-only reader (the pointer
# position, then a 1x1 capture) is possible but not implemented.
platform = "ahk,hs"

[sg_actions.open_emoji_picker]
# Windows opens its panel with Win+., macOS its Character Viewer (Ctrl+Cmd+Space,
# run by the shortcut layer's mouse owner). Linux is not implemented, not
# impossible: its desktops share no emoji chooser (GNOME's opens inside GTK text
# fields, KDE ships the plasma-emojier application), so it needs a per-desktop
# cascade.
platform = "hs,ahk"
emit_ahk = "#."

[sg_actions.take_note]
platform = "ahk"

[sg_actions.activity_simulation]
# One keep-awake session per machine, stopped by the first physical input on
# both drivers. Linux is not implemented, not impossible: the driver's own
# uinput device could nudge the pointer the same way (an idle inhibitor would
# be a different feature).
platform = "ahk,hs"

[sg_actions.display_mirror_toggle]
# macOS mirrors through the CoreGraphics display-configuration API. Windows and
# Linux are not implemented, not impossible: neither has one call that toggles
# mirroring, so the current topology has to be read first (QueryDisplayConfig
# on Windows; xrandr or kscreen-doctor, depending on the session, on Linux).
platform = "hs"

[sg_actions.surround_parens]
# Wraps the current LINE in parentheses (Home, "(", End, ")"), not the
# selection: wrap_selection does that. The label says so.
platform = "all"
emit_ahk = "{Home}({End}){Home}"

[sg_actions.open_downloads]
# macOS reuses a Finder window already showing it; Windows and Linux open the
# folder in the default file manager (Linux: the XDG DOWNLOAD directory).
platform = "all"
requires_linux = ["tool:xdg-open", "tool:xdg-user-dir"]

[sg_actions.open_file_manager]
platform = "all"
requires_linux = ["tool:xdg-open"]

[sg_actions.open_system_settings]
# Linux launches the first settings application installed (GNOME, KDE, Xfce,
# Cinnamon, MATE, LXQt) and logs an error when there is none.
platform = "all"

[sg_actions.copy_selected_path]
# In a file manager: copy the path of the selection. Elsewhere: open the
# selected link or path, or search the web for the selected text (macOS
# copy_or_open_path, Windows Search). Linux is not implemented yet, not
# impossible: a file manager publishes its selection as text/uri-list after
# Ctrl+C, which the clipboard adapter cannot read by MIME type, and the search
# engine it would fall back to is a Windows-only setting (shortcuts.search).
platform = "hs,ahk"

[sg_actions.search_web]
platform = "all"
# Linux reads the query from the X11 primary selection and opens the result.
requires_linux = ["tool:xclip", "tool:xdg-open"]
# URL template containing exactly one %s placeholder for the selected query.
parameter = "search_url"

