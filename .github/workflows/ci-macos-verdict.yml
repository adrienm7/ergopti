# .github/workflows/ci-macos-verdict.yml
#
# macOS verdict stage: verifies every mandatory stage receipt and launch
# scenario of this commit.
# Called by ci-macos.yml as its macos-ok stage.

name: 'macOS verdict'

on:
  workflow_call:
    inputs:
      release:
        description: True when ci.yml's plan resolved a free release tag
        required: true
        type: boolean
      version:
        description: Release version without the leading v; empty unless release, so the build stamps 0.0.0-dev
        required: true
        type: string
      tag:
        description: Exact release tag from the canonical plan; empty unless release
        required: true
        type: string
      prerelease:
        description: Exact prerelease string from the canonical plan; empty unless release
        required: true
        type: string
      channel:
        description: Sparkle update channel stamped into the app and the appcast, main or dev
        required: true
        type: string
      predecessors:
        description: The lane's needs context for this stage (launch), as JSON
        required: true
        type: string

permissions:
  contents: read

env:
  ERGOPTI_DEV_RELEASE_RELEASE: ${{ inputs.release }}
  ERGOPTI_DEV_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
  ERGOPTI_DEV_RELEASE_CHANNEL: ${{ inputs.channel }}
  ERGOPTI_DEV_RELEASE_TAG: ${{ inputs.tag }}
  ERGOPTI_DEV_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  macos-ok:
    name: 'Mandatory jobs and launch scenarios'
    runs-on: ubuntu-latest
    env:
      ERGOPTI_DEV_RELEASE_RELEASE: ${{ inputs.release }}
      ERGOPTI_DEV_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      ERGOPTI_DEV_RELEASE_CHANNEL: ${{ inputs.channel }}
      ERGOPTI_DEV_RELEASE_TAG: ${{ inputs.tag }}
      ERGOPTI_DEV_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Download exact test-build stage receipts
        uses: actions/download-artifact@v4
        with:
          pattern: macos-stage-testbuild-*-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-stage-inputs
      - name: Require the complete source-bound stage chain
        id: stage-verdict
        env:
          MACOS_STAGE_NEEDS: ${{ inputs.predecessors }}
        run: node tools/ci/macos-stage-roles.cjs verdict "$RUNNER_TEMP/macos-stage-inputs"
      - name: Download launch evidence
        uses: actions/download-artifact@v4
        with:
          pattern: launch-gate-${{ inputs.release && 'release' || 'ci' }}-*
          path: ${{ runner.temp }}/launch-evidence

      - name: Download native cold bootstrap evidence
        uses: actions/download-artifact@v4
        with:
          name: cold-bootstrap-native-${{ inputs.release && 'release' || 'ci' }}-macos-15
          path: ${{ runner.temp }}/launch-evidence/cold-bootstrap-native

      - name: Verify mandatory jobs and launch scenarios
        env:
          NEEDS: ${{ steps.stage-verdict.outputs.needs }}
          RELEASE: ${{ inputs.release }}
        run: node tools/test/desktop-ci-evidence.cjs verify macos "$RUNNER_TEMP/launch-evidence"
