# _shared/core/config_schema/migrations.toml
# Versioned config.toml: the ordered, data-only migration registry.
#
# READ AT RUNTIME, ON EVERY BOOT, BY ALL THREE DRIVERS, before anything applies
# or saves config.toml: Windows through windows/infra/config_migrate.ahk, macOS
# and Linux through _shared/lua/config_migrate.lua. The decision record is
# docs/adr/009-config-versioning.md.
#
# A config.toml carries its version in ``[_meta] schema_version``. A file with
# no stamp is ``unstamped_version``. At boot a driver:
#   - older file  -> byte-exact backup ``<name>.pre-v<N>-<stamp>.toml``, every
#                    step from the file's version to ``current_version`` in
#                    order, stamp last, one atomic publish;
#   - stamped below ``oldest_version``
#                 -> the file is never written and the session is read-only
#                    (ERROR logged, notice shown). The steps below v20 were
#                    squashed away by the maintainer's decision of 2026-11-11:
#                    ``oldest_version`` is v20, what ErgoptiPlus 1.0.9 wrote,
#                    and 1.0.9, the bridge ``config.read_only.older_schema``
#                    names, still climbs the v12 of 1.0.0 to 1.0.6 and the v16
#                    of 1.0.7 and 1.0.8. Raising it past the schema of the
#                    latest public release needs a maintainer's decision and a
#                    bridge release that climbs to it;
#   - no stamp, once ``unstamped_version`` is below ``oldest_version``
#                 -> treated as current: no step runs, no backup, and the next
#                    save stamps it. Unknown keys go to the explicit cleanup;
#   - current     -> nothing is written;
#   - newer file  -> the file is never written and the session is read-only
#                    (ERROR logged), so a downgrade cannot destroy settings a
#                    newer build wrote.
#
# Steps are ``[steps.v<from>_to_v<to>]`` tables with to = from + 1. ``drivers``
# names the drivers whose files the ops apply to ("ahk", "hs", "linux"); any
# other driver only moves its stamp through that version. ``ops`` is an array
# drawn from a CLOSED set, addressed by explicit section/key (a section is a
# [header] path, a key is one bare segment inside it). The op lines below are
# parsed, as written, into the Windows field table by
# tools/codegen/codegen-config-migration-ops.cjs: ``field?`` is optional.
#   { op = "rename", section, key, to_section?, to_key? }
#       Moves one value. Absent source: no-op. Existing target: the target
#       keeps its value and the source is dropped.
#   { op = "copy_if_absent", section, key, to_section?, to_key? }
#       Copies a present value into an absent target, retaining the source.
#       Copies own nested arrays and maps; an existing target keeps its value.
#       At least one target field is required; copying to the same path is a no-op.
#       An explicit ancestor value or descendant table also occupies a target:
#       copying there is a no-op and leaves both namespaces untouched.
#   { op = "rename_prefix", section, prefix, to_prefix }
#       Renames every key of one section that starts with prefix to to_prefix
#       followed by the same remainder; other keys and sub-sections stay. A
#       target already held by a key or a table refuses the migration
#       ("invalid", the file is never written). Neither prefix may extend the
#       other, so a replay finds nothing left to rename.
#   { op = "move_chord_action", section, key, to_section, action,
#     conditional_key, disabled_action, platform = "macos" }
#       Handoffs only exact legacy mods/key values represented by the injected
#       modifier catalogue's ordinary shortcut groups, or an explicit false.
#       Missing destinations receive the action and contextual disabled action.
#       Existing recognized action choices win. Unknown values, metadata,
#       actions or occupied namespaces retain every source byte and its owner.
#       Historical [section.key] mods/key tables use the same exact contract.
#       All destinations must be represented before any source is removed.
#   { op = "move_ergopti_variant", section, key, to_key, base_key, alt_gr_key,
#     source_key, false_variant, true_variant, neutral_variant? }
#       Replaces the boolean key by to_key, holding true_variant or false_variant.
#       An absent key is a no-op. base_key, alt_gr_key and source_key are read as
#       witnesses and stay. A malformed participant, an occupied namespace or a
#       to_key disagreeing with the boolean refuses the migration ("invalid").
#   { op = "move_section", section, to_section }
#       Moves a section and every section below it. Same conflict rule.
#   { op = "merge_into", section, to_section }
#       Moves the keys of one section (not its sub-sections) into another.
#       Same conflict rule.
#   { op = "map_value", section, key, map = [{ from, to }, ...] }
#       Replaces a present value equal (same type) to a ``from``.
#   { op = "encode_value", section, key, to_section, to_key, encoding }
#       A non-empty array of tables becomes the encoded string of its new key
#       (the one encoding: "user_profile_registry", the llm.user_profiles
#       envelope); an occupied target, or anything else, stays where it is.
#   { op = "wrap_value", section, key, to_key }
#       Moves a present scalar into its own [section.key] table as to_key (a
#       bare `date = true` becomes [section.date] enabled = true). A table, an
#       array or an absent key is left as is, so a replay changes nothing.
#   { op = "delete", section, key? }
#       Deletes one key, or without ``key`` a section and every section
#       below it.
#   { op = "set_if_absent", section, key, value }
#       Writes a value only where the key is absent (freezes an old default
#       before the default changes).
#   { op = "import_companion", file, section, to_section, key? }
#       Copies into config.toml what the driver kept in another file of its
#       configuration folder, named bare (``file``: tap_hold.toml): the value
#       of ``key``, or without ``key`` every key of ``section`` and of every
#       section below it, each to the same place under ``to_section``. A
#       target config.toml already holds keeps its value (the copy_if_absent
#       rule). The driver names the file's path at boot (an absent file holds
#       nothing, an unreadable one refuses the migration). Once the migrated
#       config.toml is published, every value the op addressed is deleted
#       from that file line by line, after a byte-exact backup
#       ``<name>.pre-v<N>-<stamp>.toml`` beside it; a failure there is logged
#       and leaves the values unread.
# A section left without keys by an op disappears. Every op is idempotent, so
# replaying a step on its own output changes nothing.
#
# Policy: a key rename or move ships in the SAME commit as its step here;
# readers drop the old spelling at once (no runtime aliases). Retired keys
# reported by the explicit cleanup remain untouched until that cleanup runs. The
# registry, its corpus (_shared/tests/corpus/config_migrations/), the registry
# defects every loader rejects (_shared/tests/corpus/config_migration_registries/)
# and the three interpreters are pinned together by
# tools/test/test-config-migrations.cjs.

[registry]
current_version = 22
unstamped_version = 2
oldest_version = 20





# ===================================
# ===================================
# ======= 1. Steps (in order) =======
# ===================================
# ===================================

[steps.v20_to_v21]
from = 20
to = 21
drivers = ["ahk"]
reason = "The Windows tray stored the section order of a language category under its file stem, the key of the neutral category of the same name; each language category now has its own key, its group id, as on macOS and Linux."
# Until v21 the French autocorrection and magic-key menus read and wrote
# hotstrings.order_overrides.autocorrection and .magickey, the lists of the
# neutral categories. That one list is what both menus showed, so it is copied
# to the group id: neither menu changes at the upgrade, and the two lists part
# from the next move on. A list already under the group id keeps its value.
ops = [
	{ op = "copy_if_absent", section = "hotstrings.order_overrides", key = "autocorrection", to_key = "french_autocorrection" },
	{ op = "copy_if_absent", section = "hotstrings.order_overrides", key = "magickey", to_key = "french_magickey" },
]

[steps.v21_to_v22]
from = 21
to = 22
drivers = ["hs"]
reason = "The tap-hold switch, the one-shot and lone-tap timings and the key combinations are rows of the feature manifest, kept in config.toml on every OS; macOS and Linux kept them in tap_hold.toml, which now holds the keys only (maintainer decision of 2026-11-11)."
# Windows always kept these rows in config.toml. macOS carries an old
# config_karabiner.toml over into tap_hold.toml before this step reads it, so
# a 1.0.9 configuration moves in one boot. A value config.toml already holds
# wins; the moved values leave tap_hold.toml once config.toml is published.
ops = [
	{ op = "import_companion", file = "tap_hold.toml", section = "tap_hold", key = "enabled", to_section = "tap_holds" },
	{ op = "import_companion", file = "tap_hold.toml", section = "tap_hold", key = "lone_modifier_tap_max_ms", to_section = "tap_holds" },
	{ op = "import_companion", file = "tap_hold.toml", section = "tap_hold", key = "sticky_timeout_ms", to_section = "tap_holds" },
	{ op = "import_companion", file = "tap_hold.toml", section = "mod_combos", to_section = "mod_combos" },
]
