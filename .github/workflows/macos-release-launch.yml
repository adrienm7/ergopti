# .github/workflows/macos-release-launch.yml
name: macOS published application startup
on:
  push:
    branches: [fix/hammerspoon-audit-2026-09-07]
    paths:
      - .github/workflows/macos-release-launch.yml
      - tools/diagnostics/macos-release-launch.py
      - tools/build/bundle-macos-luasocket.sh
      - tools/build/build_macos_app.sh
  workflow_dispatch:
    inputs:
      scenario:
        description: Reproduce an existing release or validate a fresh package
        required: true
        default: current_build
        type: choice
        options:
          [
            current_build,
            published,
            published_with_dependency,
            native_helper,
            helper_environment,
            helper_registration,
            ci_archive_appleevents
          ]
      tag:
        description: Existing release tag to reproduce
        required: true
        default: v0.0.0-dev.126
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: macos-release-launch
  cancel-in-progress: false
jobs:
  observe:
    if: inputs.scenario != 'ci_archive_appleevents'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select the retained helper for native environment acceptance
        if: inputs.scenario == 'helper_environment'
        id: helper
        run: |
          python3 tools/diagnostics/hs274_helper_environment_test.py
          python3 tools/diagnostics/hs274_helper_environment.py selection >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: inputs.scenario == 'helper_environment'
        with:
          name: ${{ steps.helper.outputs.artifact_name }}
          run-id: ${{ steps.helper.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/helper-download
      - name: Exercise actual Hammerspoon tasks with the retained native helper
        if: inputs.scenario == 'helper_environment'
        run: |
          version=$(sed -nE 's/^HAMMERSPOON_VERSION="\$\{HAMMERSPOON_VERSION:-([^}]+)\}"$/\1/p' tools/build/build_macos_app.sh)
          test "$version" = 1.1.1
          curl --fail --location --max-time 120 -o "$RUNNER_TEMP/helper-hammerspoon.zip" "https://github.com/Hammerspoon/hammerspoon/releases/download/$version/Hammerspoon-$version.zip"
          printf '%s  %s\n' 11bb1c90faf5427f37c7bd4fe7eab9774ae43e1d5cb020c5b3088dac32849efa "$RUNNER_TEMP/helper-hammerspoon.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/helper-hammerspoon.zip" "$RUNNER_TEMP/helper-hammerspoon"
          python3 tools/diagnostics/hs274_helper_environment.py "$RUNNER_TEMP/helper-download" "$RUNNER_TEMP/helper-hammerspoon/Hammerspoon.app" "$RUNNER_TEMP/helper-environment"
      - name: Download and verify the published application
        if: inputs.scenario == 'published' || inputs.scenario == 'published_with_dependency'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || 'v0.0.0-dev.126' }}
        run: |
          python3 tools/diagnostics/macos_release_launch_test.py
          python3 tools/diagnostics/macos-release-launch.py --install-published

      - name: Add the missing production dependency to the verified release
        if: inputs.scenario == 'published_with_dependency'
        run: |
          bash tools/build/bundle-macos-luasocket.sh /Applications/ErgoptiPlus.app "$RUNNER_TEMP/luasocket-build"
          codesign --force --sign - --preserve-metadata=identifier,entitlements,flags /Applications/ErgoptiPlus.app
          codesign --verify --strict /Applications/ErgoptiPlus.app
      - name: Run the serial native launcher regression suite
        if: inputs.scenario == 'helper_registration'
        run: |
          set -euo pipefail
          script -q /dev/null swift test --package-path static/ergopti_plus/macos/launcher 2>&1 | tee "$RUNNER_TEMP/helper-xctest.log"
          grep -Fq "Test Suite 'All tests' passed" "$RUNNER_TEMP/helper-xctest.log"
      - name: Build and exercise the shared native helper first
        if: inputs.scenario == 'native_helper' || inputs.scenario == 'helper_registration'
        run: |
          bash tools/build/build_macos_app.sh --native-helper-only
          python3 tools/diagnostics/macos_native_helper.py build/macos-native-helper/ErgoptiPlus.app "$RUNNER_TEMP/native-helper.json"
      - name: Register the helper without launching its application UI
        if: inputs.scenario == 'helper_registration'
        run: python3 tools/diagnostics/macos_helper_registration.py build/macos-native-helper/ErgoptiPlus.app "$RUNNER_TEMP/helper-registration.json"
      - name: Build the complete current application
        if: inputs.scenario == 'current_build' || inputs.scenario == 'native_helper' || github.event_name == 'push'
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          ERGOPTI_CHANNEL: dev
        run: |
          bash tools/build/build_macos_app.sh
          test ! -e /Applications/ErgoptiPlus.app
          ditto -x -k build/macos/ErgoptiPlus.app.zip /Applications
          shasum -a 256 build/macos/ErgoptiPlus.app.zip > "$RUNNER_TEMP/release-package.sha256"
      - name: Observe the installed release without a waiting open helper
        if: inputs.scenario != 'helper_environment' && inputs.scenario != 'helper_registration'
        run: |
          python3 tools/diagnostics/macos_release_launch_test.py
          python3 tools/diagnostics/macos-release-launch.py /Applications/ErgoptiPlus.app "$RUNNER_TEMP/release-launch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-release-launch-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-launch
            ${{ runner.temp }}/release-provenance.json
            ${{ runner.temp }}/release-package.sha256
            ${{ runner.temp }}/native-helper.json
            ${{ runner.temp }}/helper-xctest.log
            ${{ runner.temp }}/helper-registration.json
            ${{ runner.temp }}/helper-environment/*.json
            ${{ runner.temp }}/helper-environment/launch.log
      - uses: actions/upload-artifact@v4
        if: success() && (inputs.scenario == 'current_build' || github.event_name == 'push')
        with:
          name: ErgoptiPlus-macOS-verified-${{ github.sha }}
          path: build/macos/ErgoptiPlus.app.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success() && (inputs.scenario == 'native_helper' || inputs.scenario == 'helper_registration')
        with:
          name: ErgoptiPlus-native-helper-${{ github.sha }}
          path: |
            build/macos-native-helper/ErgoptiPlus.app.zip
            ${{ runner.temp }}/native-helper.json
          if-no-files-found: error

  appleevent-diagnostics:
    if: inputs.scenario == 'ci_archive_appleevents'
    name: AppleEvent diagnostics · ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - name: Verify the retained failing archive source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/adrienm7/ergopti/actions/runs/37868449649 > "$RUNNER_TEMP/archive-run.json"
          python3 - "$RUNNER_TEMP/archive-run.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              run = json.load(handle)
          if (run["id"] != 37868449649
                  or run["head_sha"] != "b06aefcb6386aa4b875c1c86c29e27c07ab8f951"
                  or run["repository"]["full_name"] != "adrienm7/ergopti"
                  or run["status"] != "completed"):
              raise RuntimeError("Retained diagnostic archive source differs")
          PY

      - uses: actions/download-artifact@v4
        with:
          name: assets-macos
          run-id: 37868449649
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/package

      - uses: actions/download-artifact@v4
        with:
          name: ci-macos-archive-source
          run-id: 37868449649
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/package

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install the unchanged archive for diagnostic observation
        run: |
          set -euo pipefail
          test ! -e /Applications/ErgoptiPlus.app
          stamp="0083;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)"
          node tools/build/macos-release-archives.cjs --ci-install "$RUNNER_TEMP/package" /Applications "$stamp" \
              > "$RUNNER_TEMP/package-install.json"
          xattr -r -w com.apple.quarantine "$stamp" /Applications/ErgoptiPlus.app
          xattr -dr com.apple.quarantine /Applications/ErgoptiPlus.app
          if xattr -r /Applications/ErgoptiPlus.app | grep -q com.apple.quarantine; then
              echo "::error::the documented quarantine removal left an attribute behind"
              exit 1
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/diagnostic-source.txt"

      - name: Check diagnostic collection regressions
        working-directory: tools/diagnostics
        run: >
          python3 -m unittest
          macos_launch_gate_test.VerdictTests.test_appleevent_diagnostics_retain_system_logs_and_collection_failures
          macos_launch_gate_test.VerdictTests.test_unified_log_archive_preserves_initial_authorization_after_preview_limit
          macos_launch_gate_test.VerdictTests.test_unified_log_capture_requires_completed_archive_and_preview_writes
          macos_launch_gate_test.VerdictTests.test_window_timeout_does_not_discard_other_native_evidence

      - name: Observe the original clean-launch failure with system logs
        run: >
          python3 tools/diagnostics/macos_launch_gate.py
          /Applications/ErgoptiPlus.app "$RUNNER_TEMP/launch-gate" clean

      - name: Retain diagnostics and exact archive provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appleevent-diagnostics-${{ matrix.runner }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/launch-gate
            ${{ runner.temp }}/archive-run.json
            ${{ runner.temp }}/package-install.json
            ${{ runner.temp }}/package/*.ci-receipt.json
            ${{ runner.temp }}/diagnostic-source.txt
