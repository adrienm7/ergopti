disabled_when_off = false
health_dot = true
platforms = ["ahk", "hs"]
reason_key = "platform_reason.llm_configuration_surface_is_not_on_linux"

[[menu.llm_menu]]
type = "list"
id = "llm_models"
platforms = ["linux"]
reason_key = "platform_reason.llm_lists_are_inline_on_linux"

