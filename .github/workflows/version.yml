# .github/workflows/version.yml
#
# Automatic semantic versioning on every push to main or dev.
# Replaces release-please with a lightweight hand-rolled approach.
#
# Bump rules (from conventional commits since last stable tag):
#   - BREAKING / ! in subject → major bump
#   - feat                    → minor bump
#   - fix / perf / ...        → patch bump
#
# Channel rules:
#   - branch is main → vX.Y.Z               (stable release)
#   - branch is dev  → vX.Y.Z-dev.{run}     (pre-release, anchored on last stable)
#
# For dev pre-releases, a human-readable delta summary is computed from all
# commits since the last stable tag and passed as an output so release.yml
# can embed it in the GitHub Release title:
#   "Ergopti v0.6.0-dev.103 — ⚠️ 1 breaking, ✨ 3 feat, 🔧 2 fix"
#
# Alpha/beta channels: if any commit message on dev contains "alpha" or "beta",
# the tag suffix changes accordingly (vX.Y.Z-alpha.{run} / vX.Y.Z-beta.{run}).
name: Auto Version

on:
    push:
        branches: [main, dev]

permissions:
    contents: write

jobs:
    version:
        runs-on: ubuntu-latest
        outputs:
            tag:        ${{ steps.calc.outputs.tag }}
            prerelease: ${{ steps.calc.outputs.prerelease }}
            title:      ${{ steps.calc.outputs.title }}

        steps:
            - name: Checkout (full history)
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Calculate next version and create tag
              id: calc
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  BRANCH:   ${{ github.ref_name }}
                  RUN_NUM:  ${{ github.run_number }}
              run: |
                  set -euo pipefail

                  # ── 1. Find last STABLE tag (vX.Y.Z, no suffix) ───────────
                  # Both main and dev anchor on the last stable tag so that:
                  #   - main: bump reflects all commits since last release
                  #   - dev:  delta summary reflects everything in dev vs main
                  # Pre-release tags (vX.Y.Z-dev.N) are intentionally ignored.
                  last_stable=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
                      | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
                  if [ -z "$last_stable" ]; then
                      last_stable="v0.0.0"
                      range="HEAD"
                  else
                      range="${last_stable}..HEAD"
                  fi
                  echo "Last stable tag: $last_stable"
                  IFS='.' read -r maj min pat <<< "${last_stable#v}"

                  # ── 2. Determine SemVer bump from commits ──────────────────
                  bump="patch"
                  while IFS= read -r subject; do
                      [ -z "$subject" ] && continue
                      if echo "$subject" | grep -qE '(BREAKING|!):'; then
                          bump="major"; break
                      elif echo "$subject" | grep -qE '^feat(\([^)]+\))?!?:'; then
                          [ "$bump" != "major" ] && bump="minor"
                      fi
                  done < <(git log "$range" --no-merges --pretty=format:"%s")
                  echo "Bump type: $bump"

                  # ── 3. Compute new base version ────────────────────────────
                  case "$bump" in
                      major) maj=$((maj+1)); min=0; pat=0 ;;
                      minor) min=$((min+1)); pat=0 ;;
                      patch) pat=$((pat+1)) ;;
                  esac
                  base="v${maj}.${min}.${pat}"

                  # ── 4. Build tag and title ─────────────────────────────────
                  if [ "$BRANCH" = "main" ]; then
                      # Stable release — clean tag, no suffix.
                      tag="$base"
                      prerelease="false"
                      title="Ergopti ${tag}"
                  else
                      # Dev pre-release — detect optional alpha/beta channel.
                      commit_messages=$(git log "$range" --no-merges --pretty=format:"%s %b")
                      channel="dev"
                      if echo "$commit_messages" | grep -qi "alpha"; then
                          channel="alpha"
                      elif echo "$commit_messages" | grep -qi "beta"; then
                          channel="beta"
                      fi
                      tag="${last_stable}-${channel}.${RUN_NUM}"
                      prerelease="true"

                      # ── 5. Build human-readable delta summary ──────────────
                      # Count commit types since the last stable tag so the
                      # release title says "+3 feat, +2 fix" instead of just
                      # a meaningless build number.
                      n_breaking=0; n_feat=0; n_fix=0; n_other=0
                      while IFS= read -r subject; do
                          [ -z "$subject" ] && continue
                          if echo "$subject" | grep -qE '(BREAKING|!):'; then
                              n_breaking=$((n_breaking+1))
                          elif echo "$subject" | grep -qE '^feat(\([^)]+\))?!?:'; then
                              n_feat=$((n_feat+1))
                          elif echo "$subject" | grep -qE '^fix(\([^)]+\))?:'; then
                              n_fix=$((n_fix+1))
                          else
                              n_other=$((n_other+1))
                          fi
                      done < <(git log "$range" --no-merges --pretty=format:"%s")

                      # Compose delta string — only include non-zero counts.
                      delta=""
                      [ "$n_breaking" -gt 0 ] && delta="${delta}⚠️ ${n_breaking} breaking, "
                      [ "$n_feat"     -gt 0 ] && delta="${delta}✨ ${n_feat} feat, "
                      [ "$n_fix"      -gt 0 ] && delta="${delta}🔧 ${n_fix} fix, "
                      [ "$n_other"    -gt 0 ] && delta="${delta}📦 ${n_other} other, "
                      # Strip trailing ", "
                      delta="${delta%, }"

                      if [ -n "$delta" ]; then
                          title="Ergopti ${tag} — ${delta} (since ${last_stable})"
                      else
                          title="Ergopti ${tag} (since ${last_stable})"
                      fi
                  fi

                  echo "New tag  : $tag"
                  echo "Title    : $title"
                  echo "Prerelease: $prerelease"

                  # ── 6. Push the tag ────────────────────────────────────────
                  if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
                      echo "Tag '$tag' already exists — skipping."
                  else
                      git tag "$tag"
                      git push origin "$tag"
                      echo "Tag '$tag' pushed."
                  fi

                  echo "tag=$tag"               >> "$GITHUB_OUTPUT"
                  echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
                  # Escape percent signs and newlines for GITHUB_OUTPUT
                  safe_title="${title//'%'/'%25'}"
                  echo "title=$safe_title"      >> "$GITHUB_OUTPUT"
