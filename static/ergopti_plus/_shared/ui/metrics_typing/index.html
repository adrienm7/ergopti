<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<title data-i18n="ui_typing.title"></title>
		<!-- Pinned local vendors keep privileged webviews deterministic and offline. -->
		<script defer src="../vendor/chart.umd.js"></script>
		<script defer src="../vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
		<script defer src="../vendor/hammer.min.js"></script>
		<script defer src="../vendor/chartjs-plugin-zoom.min.js"></script>
		<script src="../a11y_prefs.js"></script>
		<script src="../page_locale.js"></script>
		<link rel="stylesheet" href="../theme.css" />
		<script src="../theme_tokens.js"></script>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header class="top-fixed-bar">
			<h1 class="header" data-i18n="ui_typing.title"></h1>

			<div class="filters-bar">
				<div class="filter-group-dates">
					<p class="filter-field">
						<label for="date_start" data-i18n="ui_typing.label_from"></label
						><input
							type="date"
							id="date_start"
							onchange="app_state.hour_window = null; apply_date_app_filters()"
						/>
					</p>
					<p class="filter-field">
						<label for="date_end" data-i18n="ui_typing.label_to"></label
						><input
							type="date"
							id="date_end"
							onchange="app_state.hour_window = null; apply_date_app_filters()"
						/>
					</p>
					<select
						id="quick_range"
						class="filter-btn"
						onchange="apply_quick_date_range()"
						data-i18n-option-prefix="ui_typing.opt_quick_range"
						data-i18n-title="ui_typing.title_quick_range"
					>
						<option value=""></option>
						<option value="last_hour"></option>
						<option value="today"></option>
						<option value="week"></option>
						<option value="month"></option>
						<option value="3m"></option>
						<option value="6m"></option>
						<option value="year"></option>
						<option value="all"></option>
					</select>
				</div>

				<div class="filter-group-buttons">
					<button
						class="filter-btn active"
						id="app_filter_btn"
						onclick="open_app_modal()"
						data-i18n="ui_typing.btn_apps_all"
					></button>

					<!-- Source toggles : indépendants — HS et IA peuvent être actifs séparément -->
					<!-- Sans aucun toggle actif = texte final affiché à l'écran (output) -->
					<!-- Avec un toggle actif = frappe brute pour produire cet output (input) -->
					<button
						class="filter-btn source-toggle active"
						id="btn_toggle_llm"
						onclick="toggle_llm_source()"
						data-i18n-title="ui_typing.btn_toggle_llm_title"
						data-i18n="ui_typing.btn_toggle_llm"
					></button>
					<button
						class="filter-btn source-toggle active"
						id="btn_toggle_hs"
						onclick="toggle_hs_source()"
						data-i18n-title="ui_typing.btn_toggle_hs_title"
					>
						+ Hotstrings
					</button>

					<button
						class="filter-btn active"
						id="btn_case_sensitive"
						onclick="toggle_filter('btn_case_sensitive')"
						data-i18n="ui_typing.btn_case_sensitive"
					></button>
				</div>

				<button
					class="filter-btn filter-reset"
					onclick="reset_filters()"
					data-i18n="ui_typing.btn_reset"
				></button>
				<button
					class="filter-btn"
					id="btn_metrics_export"
					onclick="ask_metrics_maintenance('export')"
					data-i18n="ui_typing.maintenance_export"
					data-i18n-title="ui_typing.maintenance_export_title"
				></button>
				<button
					class="filter-btn filter-reset"
					id="btn_metrics_purge"
					onclick="ask_metrics_maintenance('purge')"
					data-i18n="ui_typing.maintenance_purge"
					data-i18n-title="ui_typing.maintenance_purge_title"
				></button>
				<p class="maintenance-bar" id="metrics_maintenance_bar" role="status" hidden>
					<span id="metrics_maintenance_text"></span>
					<button
						class="filter-btn filter-reset"
						id="btn_maintenance_confirm"
						onclick="confirm_metrics_maintenance()"
						data-i18n="ui_typing.maintenance_confirm"
					></button>
					<button
						class="filter-btn"
						id="btn_maintenance_cancel"
						onclick="cancel_metrics_maintenance()"
						data-i18n="ui_typing.maintenance_cancel"
					></button>
				</p>
			</div>
		</header>

		<main class="main-content">
			<p id="sparkline_caption" hidden data-i18n="ui_typing.sparkline_caption"></p>
			<p id="chart_alternative" hidden data-i18n="ui_typing.chart_alternative"></p>
			<div class="stats-grid" id="main_stats_grid">
				<section class="stat-card card-llm" id="llm_card">
					<h2>
						<span id="llm_title" data-i18n="ui_typing.h2_ai"></span>
						<span id="llm_trend"></span>
						<button type="button" class="tooltip stat-inline-tooltip" id="llm_info"></button>
					</h2>
					<p class="stat-value" id="llm_val">
						0 <span class="stat-unit" data-i18n="ui_typing.unit_activations"></span>
					</p>

					<p class="stat-details" id="llm_loading" data-i18n="ui_typing.loading"></p>
					<dl class="stat-details-split" id="llm_details" style="display: none">
						<div class="split-col" data-i18n-title="ui_typing.title_net_llm">
							<dt class="split-label" data-i18n="ui_typing.lbl_saved"></dt>
							<dd class="split-val">
								<strong id="llm_net_val">0</strong>
								<span data-i18n="ui_typing.unit_keystrokes"></span>
							</dd>
						</div>
						<div class="split-col">
							<dt class="split-label" data-i18n="ui_typing.lbl_accepted"></dt>
							<dd class="split-val">
								<strong id="llm_acc_pct">0%</strong>
								<small class="split-sub" id="llm_acc_raw">(0/0)</small>
							</dd>
						</div>
					</dl>

					<div class="sparkline-container">
						<canvas
							id="llm_sparkline"
							role="img"
							aria-labelledby="llm_title sparkline_caption"
						></canvas>
					</div>
				</section>

				<section class="stat-card card-hs" id="hs_card">
					<h2>
						<span id="hs_title" data-i18n="ui_typing.h2_hs"></span>
						<span id="hs_trend"></span>
						<button type="button" class="tooltip stat-inline-tooltip" id="hs_info"></button>
					</h2>
					<p class="stat-value" id="hs_val">
						0 <span class="stat-unit" data-i18n="ui_typing.unit_activations"></span>
					</p>

					<p class="stat-details" id="hs_loading" data-i18n="ui_typing.loading"></p>
					<dl class="stat-details-split" id="hs_details" style="display: none">
						<div class="split-col" data-i18n-title="ui_typing.title_net_hs">
							<dt class="split-label" data-i18n="ui_typing.lbl_saved"></dt>
							<dd class="split-val">
								<strong id="hs_net_val">0</strong>
								<span data-i18n="ui_typing.unit_keystrokes"></span>
							</dd>
						</div>
						<div class="split-col">
							<dt class="split-label" data-i18n="ui_typing.lbl_accepted"></dt>
							<dd class="split-val">
								<strong id="hs_acc_pct">0%</strong>
								<small class="split-sub" id="hs_acc_raw">(0/0)</small>
							</dd>
						</div>
					</dl>

					<div class="sparkline-container">
						<canvas
							id="hs_sparkline"
							role="img"
							aria-labelledby="hs_title sparkline_caption"
						></canvas>
					</div>
				</section>

				<section class="stat-card card-global" id="global_card">
					<h2><span data-i18n="ui_typing.h2_speed"></span> <span id="wpm_trend"></span></h2>
					<p class="stat-value stat-value-stack" id="wpm_val" style="margin: 5px 0">0</p>
					<ul class="stat-details" id="global_details">
						<li>
							<strong>0</strong>
							<span
								class="stat-unit"
								style="font-size: 0.9em"
								data-i18n="ui_typing.unit_keyspressed"
							></span>
						</li>
					</ul>
					<p id="wpm_words_sub" class="stat-sub"></p>
					<p class="filter-field" style="margin-top: 8px">
						<select
							id="pause_threshold"
							class="filter-btn"
							onchange="apply_local_filters()"
							data-i18n-title="ui_typing.title_pause_threshold"
							style="font-size: 11px; padding: 3px 6px; height: auto"
							data-i18n-option-prefix="ui_typing.opt_pause"
						>
							<option value="1000"></option>
							<option value="2000"></option>
							<option value="3000"></option>
							<option value="5000" selected></option>
							<option value="10000"></option>
							<option value="20000"></option>
							<option value="30000"></option>
							<option value="60000"></option>
							<option value="99999999"></option>
						</select>
					</p>
				</section>
			</div>

			<!-- align-items:flex-start prevents cross-axis stretching of side-by-side
			     chart containers so each sizes to its own content height only -->
			<div
				style="
					display: flex;
					flex-wrap: wrap;
					gap: 16px;
					margin-bottom: 16px;
					align-items: flex-start;
				"
			>
				<section class="chart-row-block is-precision">
					<header class="chart-row-block-header">
						<div style="display: flex; align-items: baseline; gap: 10px">
							<h3
								id="precision_chart_title"
								style="margin: 0; font-size: 14px; color: var(--kpi-precision-color)"
								data-i18n="ui_typing.h3_precision"
							></h3>
							<button
								type="button"
								id="precision_info"
								class="tooltip stat-inline-tooltip"
								style="color: var(--kpi-precision-color)"
							></button>
							<p class="chart-help" style="margin: 0" data-i18n="ui_typing.pinch_hint"></p>
						</div>
						<button
							class="tab-btn"
							style="padding: 2px 8px; font-size: 11px; border-color: var(--precision-border)"
							onclick="reset_chart_zoom('precision')"
							data-i18n="ui_typing.btn_restore_zoom"
						></button>
					</header>
					<div class="chart-row-block-canvas">
						<canvas
							id="precision_chart"
							role="img"
							aria-labelledby="precision_chart_title chart_alternative"
							style="position: absolute; inset: 0; width: 100%; height: 100%"
						></canvas>
					</div>
				</section>

				<section class="chart-row-block is-speed">
					<header class="chart-row-block-header">
						<div style="display: flex; align-items: baseline; gap: 10px">
							<h3
								id="wpm_chart_title"
								style="margin: 0; font-size: 14px; color: var(--chart-wpm-ink)"
								data-i18n="ui_typing.h3_speed"
							></h3>
							<p class="chart-help" style="margin: 0" data-i18n="ui_typing.pinch_hint"></p>
						</div>
						<button
							class="tab-btn"
							style="padding: 2px 8px; font-size: 11px; border-color: var(--global-border)"
							onclick="reset_chart_zoom('wpm')"
							data-i18n="ui_typing.btn_restore_zoom"
						></button>
					</header>
					<div class="chart-row-block-canvas">
						<canvas
							id="wpm_chart"
							role="img"
							aria-labelledby="wpm_chart_title chart_alternative"
							style="position: absolute; inset: 0; width: 100%; height: 100%"
						></canvas>
					</div>
				</section>
			</div>

			<section
				class="chart-container"
				style="
					height: 240px;
					margin-bottom: 16px;
					background: var(--delegation-bg);
					border-color: var(--delegation-border);
				"
			>
				<header
					style="
						display: flex;
						justify-content: space-between;
						align-items: center;
						margin-bottom: 5px;
					"
				>
					<div style="display: flex; align-items: baseline; gap: 10px">
						<h3
							id="delegation_chart_title"
							style="margin: 0; font-size: 14px; color: var(--text-color)"
							data-i18n="ui_typing.h3_keystroke_origin"
						></h3>
						<p class="chart-help" style="margin: 0" data-i18n="ui_typing.pinch_hint"></p>
					</div>
					<button
						class="tab-btn"
						style="padding: 2px 8px; font-size: 11px; border-color: var(--delegation-border)"
						onclick="reset_chart_zoom('delegation')"
						data-i18n="ui_typing.btn_restore_zoom"
					></button>
				</header>
				<div style="flex: 1; min-height: 0; position: relative">
					<canvas
						id="delegation_chart"
						role="img"
						aria-labelledby="delegation_chart_title chart_alternative"
					></canvas>
				</div>
			</section>

			<!-- Keyboard heatmaps — always visible above the tab buttons -->
			<div class="heatmaps-row">
				<div id="kc_heatmap_container" style="text-align: center"></div>
				<div style="text-align: center; display: flex; flex-direction: column; align-items: center">
					<p class="filter-field" style="margin-bottom: 6px">
						<button
							id="sfb_heatmap_same_key_btn"
							class="filter-btn sfb-toggle-btn active"
							onclick="toggle_sfb_heatmap_same_key()"
							data-i18n-title="ui_typing.title_sfb_heatmap_doublings"
							data-i18n="ui_typing.btn_doublings_included"
						></button>
					</p>
					<div id="sfb_heatmap_container" style="width: 100%"></div>
				</div>
			</div>

			<section id="media_keys_container" hidden style="margin-bottom: 16px"></section>

			<!-- Calendrier d’activité : 12 mois glissants. Intensité = caractères tapés ce jour-là. -->
			<div id="activity_calendar_container" style="margin-bottom: 16px"></div>

			<!-- Heatmap heure × jour de semaine : volume / cadence par créneau, agrégé sur tout l'historique. -->
			<div id="hour_weekday_heatmap_container" style="margin-bottom: 16px"></div>

			<!-- Expanded KPI row: Distance des doigts + Redoublements, placés sous le graphique
			     Origine des frappes pour rester dans le contexte des données analysées. -->
			<div class="expanded-kpi-row">
				<section class="expanded-kpi-block card-dist" id="dist_card">
					<header class="ekpi-header">
						<h2 data-i18n="ui_typing.h2_finger_dist"></h2>
						<p class="stat-value stat-value-tip" id="dist_val">
							0 <span class="stat-unit" data-i18n="ui_typing.unit_km"></span>
						</p>
						<p class="stat-details" id="dist_loading" data-i18n="ui_typing.loading"></p>
						<dl class="stat-details-split" id="dist_details" style="display: none">
							<div class="split-col" data-i18n-title="ui_typing.title_top_finger">
								<dt class="split-label" data-i18n="ui_typing.lbl_most_active_finger"></dt>
								<dd class="split-val"><strong id="dist_top_finger">—</strong></dd>
							</div>
							<div class="split-col" data-i18n-title="ui_typing.title_hand_balance">
								<dt class="split-label" data-i18n="ui_typing.lbl_hand_balance"></dt>
								<dd class="split-val"><strong id="dist_hand_balance">—</strong></dd>
							</div>
						</dl>
					</header>
					<div class="ekpi-table-wrap" id="dist_fingers_container">
						<!-- Table injected by render_dist_table() -->
					</div>
				</section>

				<section class="expanded-kpi-block card-rep" id="rep_card">
					<header class="ekpi-header">
						<h2 data-i18n="ui_typing.h2_doublings"></h2>
						<p class="stat-value stat-value-tip" id="rep_val">0<span class="stat-unit">%</span></p>
						<p class="stat-details" id="rep_loading" data-i18n="ui_typing.loading"></p>
						<dl class="stat-details-split" id="rep_details" style="display: none">
							<div class="split-col" data-i18n-title="ui_typing.title_rep_total">
								<dt class="split-label" data-i18n="ui_typing.lbl_total"></dt>
								<dd class="split-val">
									<strong id="rep_pct">0 <span data-i18n="ui_typing.lbl_doublings"></span></strong>
								</dd>
							</div>
							<div class="split-col" data-i18n-title="ui_typing.title_rep_via_star">
								<dt class="split-label" data-i18n="ui_typing.lbl_via_magic_key"></dt>
								<dd class="split-val">
									<strong id="rep_hs_pct">0%</strong>
									<small class="split-sub" id="rep_hs_raw"></small>
								</dd>
							</div>
						</dl>
					</header>
					<div class="ekpi-table-wrap" id="rep_doublings_container">
						<!-- Table injected by render_rep_table() -->
					</div>
				</section>

				<section class="expanded-kpi-block card-sfb" id="sfb_card">
					<header class="ekpi-header">
						<h2>
							SFBs
							<button
								id="sfb_same_key_btn"
								class="filter-btn sfb-toggle-btn active"
								onclick="toggle_sfb_same_key()"
								data-i18n-title="ui_typing.title_sfb_doublings"
								data-i18n="ui_typing.btn_doublings_included"
							></button>
						</h2>
						<p class="stat-value stat-value-tip" id="sfb_val">0<span class="stat-unit">%</span></p>
						<p class="stat-details" id="sfb_loading" data-i18n="ui_typing.loading"></p>
						<dl class="stat-details-split" id="sfb_details" style="display: none">
							<div class="split-col" data-i18n-title="ui_typing.title_sfbs_raw">
								<dt class="split-label" data-i18n="ui_typing.lbl_sfbs_raw"></dt>
								<dd class="split-val"><strong id="sfb_pct">0 SFBs</strong></dd>
							</div>
							<div class="split-col" data-i18n-title="ui_typing.title_sfbs_avoided">
								<dt
									class="split-label"
									style="font-size: 11px"
									data-i18n="ui_typing.lbl_via_hotstrings"
								></dt>
								<dd class="split-val">
									<strong id="sfb_avoided" style="font-size: 11px; color: var(--kpi-hs-color)"
										>0</strong
									>
								</dd>
							</div>
						</dl>
					</header>
					<div class="ekpi-table-wrap" id="sfb_pairs_container">
						<!-- Table injected by render_sfb_table() -->
					</div>
				</section>
			</div>

			<!-- Ergonomie bigrammes : SHB / SHU, LSB, ciseaux, roulements. -->
			<div class="expanded-kpi-row">
				<section class="expanded-kpi-block card-ergo-bigram" id="ergo_bigram_card">
					<header class="ekpi-header">
						<h2 data-i18n="ui_typing.h2_bigram_ergo">
							<button
								type="button"
								class="tooltip stat-inline-tooltip"
								id="ergo_bigram_info"
							></button>
						</h2>
						<p class="stat-value" id="ergo_shu_val">0<span class="stat-unit">% SHU</span></p>
						<p
							class="stat-details"
							id="ergo_bigram_loading"
							data-i18n="ui_typing.loading_ellipsis"
						></p>
						<dl class="stat-details-split" id="ergo_bigram_details" style="display: none">
							<div class="split-col" data-i18n-title="ui_typing.title_inward_roll">
								<dt class="split-label" data-i18n="ui_typing.lbl_roll_in"></dt>
								<dd class="split-val"><strong id="ergo_roll_in_pct">0%</strong></dd>
							</div>
							<div class="split-col" data-i18n-title="ui_typing.title_outward_roll">
								<dt class="split-label" data-i18n="ui_typing.lbl_roll_out"></dt>
								<dd class="split-val"><strong id="ergo_roll_out_pct">0%</strong></dd>
							</div>
							<div class="split-col" data-i18n-title="ui_typing.title_lsb">
								<dt class="split-label">LSB</dt>
								<dd class="split-val"><strong id="ergo_lsb_pct">0%</strong></dd>
							</div>
							<div class="split-col" data-i18n-title="ui_typing.title_scissors">
								<dt class="split-label" data-i18n="ui_typing.lbl_scissors"></dt>
								<dd class="split-val"><strong id="ergo_scissor_pct">0%</strong></dd>
							</div>
						</dl>
					</header>
					<div class="ekpi-table-wrap" id="ergo_bigram_table_container"></div>
				</section>
			</div>

			<!-- Ergonomie trigrammes : SFS, SKS, redirections, mauvaises redirections. -->
			<div class="expanded-kpi-row">
				<section class="expanded-kpi-block card-ergo-trigram" id="ergo_trigram_card">
					<header class="ekpi-header">
						<h2 data-i18n="ui_typing.h2_trigram_ergo">
							<button
								type="button"
								class="tooltip stat-inline-tooltip"
								id="ergo_trigram_info"
							></button>
						</h2>
						<p class="stat-value" id="ergo_trigram_val">0<span class="stat-unit">%</span></p>
						<p
							class="stat-details"
							id="ergo_trigram_loading"
							data-i18n="ui_typing.loading_ellipsis"
						></p>
						<dl class="stat-details-split" id="ergo_trigram_details" style="display: none">
							<div class="split-col" data-i18n-title="ui_typing.title_sfs">
								<dt class="split-label">SFS</dt>
								<dd class="split-val"><strong id="ergo_sfs_pct">0%</strong></dd>
							</div>
							<div class="split-col" data-i18n-title="ui_typing.title_sks">
								<dt class="split-label">SKS</dt>
								<dd class="split-val"><strong id="ergo_sks_pct">0%</strong></dd>
							</div>
							<div class="split-col" data-i18n-title="ui_typing.title_redirect">
								<dt class="split-label" data-i18n="ui_typing.lbl_redir"></dt>

		<!--
			Edge --app= bootstrap (B niveau 1 contract — AHK driver only).
			Hammerspoon injects metrics_manifest / app_icons / _prefetch_data /
			keycode_layout via evaluateJavaScript before calling process_manifest.
			Edge has no equivalent bridge, so the AHK launcher writes a
			prefetch.json sidecar next to this file and we read it here on load.
			A pre-set window.metrics_manifest means HS got there first — leave
			it alone so the two drivers can share these assets unchanged.
		-->
		<script>
			(function () {
				// Persistent historical cache. process_manifest() nulls
				// window._prefetch_data on the first paint, so we can't rely on
				// it for the live merge — we keep our own copy here instead.
				let cached_historical = null;
				// Whether that history came from an incomplete host read.
				let cached_historical_incomplete = false;
				let manifest_seeded = false;
				// Apply a prefetch blob (initial fetch or live push) onto the
				// global state and re-render.
				function apply_prefetch(blob) {
					if (!blob) return;
					const has_prefetch = blob._prefetch_data !== undefined;
					// Reject stale native replies before metadata, mailbox or history
					// changes; a later live delta must not resurrect rejected history.
					if (
						(has_prefetch || blob.range_request_id !== undefined) &&
						!window.can_receive_range_data(blob.range_request_id ?? null)
					)
						return;
					// A partial rebuild snapshot is labelled until a complete one lands.
					if (window.metrics_rebuild) window.metrics_rebuild.mark_snapshot(blob);
					window.metrics_manifest = blob.metrics_manifest || {};
					// The host shows what it read but never caches an incomplete read.
					if (window.metrics_freshness) {
						window.metrics_freshness.mark_incomplete(
							'manifest',
							blob.metrics_manifest_incomplete === true
						);
					}
					window.app_icons = blob.app_icons || {};
					window.driver_meta = blob.driver_meta ||
						window.driver_meta || { os: 'mac', heatmap_id: 'kc' };
					// PC-scancode drivers render against macOS-style
					// HS keycodes — translate the labels (and the n-gram
					// data, below) so the heatmap geometry stays unchanged.
					window.keycode_layout_source = window.build_keycode_layout_for_driver(
						window.driver_meta,
						blob.keycode_layout
					);
					window.keycode_layout = window.name_keycode_layout(
						window.keycode_layout_source,
						window.driver_meta
					);
					let merged = null;
					let next_historical = cached_historical;
					let next_historical_incomplete = cached_historical_incomplete;
					if (has_prefetch) {
						const incoming = blob._prefetch_data || {};
						let incoming_hist = incoming.historical || {};
						let incoming_today = incoming.today || {};
						// PC-scancode drivers: translate sc_kb → kc per app so
						// the renderer keeps reading the same field. heatmap_win.js
						// owns both the translation and which drivers need it.
						if (
							typeof window.translate_win_today === 'function' &&
							is_pc_scancode_driver(window.driver_meta)
						) {
							incoming_today = window.translate_win_today(incoming_today);
							incoming_hist = window.translate_win_today(incoming_hist);
						}
						// An explicit partial delivery reuses the current selected history,
						// which may have changed through a native range response.
						if (
							!Object.hasOwn(incoming, 'historical') &&
							Object.hasOwn(incoming, 'today_partial_types')
						) {
							next_historical = app_state.historical_cache;
							next_historical_incomplete = app_state.historical_cache_incomplete;
						}
						// Omission is a live delta; an explicit empty object clears history.
						if (Object.prototype.hasOwnProperty.call(incoming, 'historical')) {
							next_historical = incoming_hist;
							next_historical_incomplete = incoming.incomplete === true;
						}
						merged = {
							historical: next_historical || incoming_hist || {},
							today: incoming_today,
							...(Object.hasOwn(incoming, 'today_partial_types')
								? { today_partial_types: incoming.today_partial_types }
								: {}),
							...(Object.hasOwn(incoming, 'today_date') ? { today_date: incoming.today_date } : {}),
							incomplete: next_historical_incomplete || incoming.incomplete === true
						};
						window._prefetch_data = merged;
					}
					// First apply seeds the dashboard (process_manifest initializes
					// dates/apps and triggers request_range_data
					// — which synchronously paints the loader spinner). Subsequent
					// live pushes go directly to receive_range_data so the spinner
					// doesn't clobber the rendered tables every 200 ms.
					if (!manifest_seeded) {
						if (typeof window.process_manifest === 'function') {
							manifest_seeded = true;
							window.process_manifest();
						} else {
							console.error(
								'[apply_prefetch] window.process_manifest not defined — JS scripts may have failed to load'
							);
						}
					} else {
						// Keep the admitted manifest's charts and inventories current
						// while the existing native range owner keeps its mailbox.
						window.refresh_manifest_projection();
					}
					if (merged && typeof window.receive_range_data === 'function') {
						try {
							// process_manifest can discover a new scope. Recheck before
							// touching its mailbox and never relabel this response's id.
							const request_id = blob.range_request_id ?? null;
							if (window.can_receive_range_data(request_id)) {
								window._lua_request = null;
								if (window.receive_range_data(merged, request_id) === true) {
									cached_historical = next_historical;
									cached_historical_incomplete = next_historical_incomplete;
								}
							}
						} catch (e) {
							console.error('receive_range_data failed:', e);
						}
					} else if (
						!has_prefetch &&
						manifest_seeded &&
						typeof window.apply_local_filters === 'function'
					) {
						// Manifest-only push (no _prefetch_data): the n-gram tables stay
						// unchanged but KPI cards (MPM/CPM, chars) must re-render against
						// the freshly updated window.metrics_manifest.
						try {
							window.apply_local_filters();
						} catch (e) {
							console.error('apply_local_filters (manifest push) failed:', e);
						}
					}
				}

				// WebKitGTK cannot receive the macOS evaluateJavaScript injection and
				// has no file-sidecar fallback. Request the shared prefetch envelope
				// through its native bridge, then keep the dashboard live with polling.
				if (hostHasCapability('document_bridge')) {
					const request_linux_refresh = () => {
						try {
							window.webkit.messageHandlers.metrics_typing_bridge.postMessage({
								action: 'refresh'
							});
						} catch (_) {}
					};
					window.__hostBridgeResponse = (bridge, isBase64, payload) => {
						if (bridge !== 'metrics_typing_bridge') return;
						const response = decodeHostBridgeResponse(isBase64, payload);
						if (!response) return;
						// A Reset's answer settles it first: its rebuilt payload is
						// refused while the Reset still owns the range (MET-19).
						if (Object.hasOwn(response, 'reset_id'))
							window.complete_cache_reset(response.reset_id, response.cleared === true);
						apply_prefetch(response);
					};
					try {
						window.webkit.messageHandlers.metrics_typing_bridge.postMessage({ action: 'ready' });
					} catch (_) {
						request_linux_refresh();
					}
					createVisibilityPoller(request_linux_refresh, 2000, false);
					return;
				}

				// WebView2 path (B niveau 2): the AHK host listens for
				// chrome.webview.postMessage and pushes prefetch blobs back
				// via PostWebMessageAsString. We greet the host with
				// {"action":"ready"} so it sends us the initial data straight
				// away — no round-trip to the file system.
				if (window.chrome && window.chrome.webview) {
					console.log('WebView2 bridge active — using live push channel');
					// Coalesce pushes: AHK fires every ~500 ms but each
					// apply_prefetch + re-render takes longer than that
					// when n-grams are included, so naive handling lets a
					// queue build up and updates lag by seconds. We keep
					// only the LATEST blob and run apply_prefetch via
					// requestAnimationFrame so the renderer stays in
					// sync with the freshest data instead of catching up
					// from stale snapshots.
					let pending_blob = null;
					let frame_scheduled = false;
					let push_count = 0;
					let processed_count = 0;
					let first_paint_done = false;
					function flush_pending() {
						frame_scheduled = false;
						if (!pending_blob) return;
						const blob = pending_blob;
						pending_blob = null;
						processed_count++;
						console.log('apply push#' + processed_count + ' (received#' + push_count + ')');
						apply_prefetch(blob);
					}
					window.chrome.webview.addEventListener('message', (e) => {
						let payload = e.data;
						if (typeof payload === 'string') {
							try {
								payload = JSON.parse(payload);
							} catch (err) {
								console.error('prefetch JSON.parse failed:', err.message, 'len=', e.data.length);
								return;
							}
						}
						if (!payload) return;
						// A retained Windows controller can deliver an older document's queue.
						const hostEpoch = new URLSearchParams(window.location.search).get('epoch');
						if (hostEpoch !== null && String(payload.host_epoch) !== hostEpoch) return;
						if (payload.type === 'range_data') {
							if (typeof window.receive_range_data === 'function') {
								window.receive_range_data(payload.payload, payload.request_id);
							}
							return;
						}
						if (payload.type === 'range_terminal') {
							if (typeof window.complete_range_request === 'function') {
								window.complete_range_request(payload.request_id, payload.status);
							}
							return;
						}
						if (payload.type === 'cache_reset') {
							window.complete_cache_reset(payload.reset_id, payload.ok);
							return;
						}
						if (payload.type === 'metrics_maintenance') {
							if (typeof window.complete_metrics_maintenance === 'function') {
								window.complete_metrics_maintenance(
									payload.maintenance_id,
									payload.ok,
									payload.path
								);
							}
							return;
						}
						if (payload.type === 'rebuild_progress') {
							if (window.metrics_rebuild) window.metrics_rebuild.show_progress(payload.progress);
							return;
						}
						if (payload.type !== 'prefetch') return;
						push_count++;
						processed_count++;
						console.log(
							'apply push#' + processed_count + ' keys=' + Object.keys(payload.blob || {}).join(',')
						);
						apply_prefetch(payload.blob);
					});
					try {
						window.chrome.webview.postMessage(JSON.stringify({ action: 'ready' }));
					} catch (e) {
						console.error('postMessage(ready) failed:', e);
					}
					return;
				}

				// Edge --app= fallback (B niveau 1): static fetch on load.
				// state.js initialises metrics_manifest to {} so a plain
				// truthy check would always bail; require non-empty.
				if (window.metrics_manifest && Object.keys(window.metrics_manifest).length) return;
				// The prefetch file lives in %TEMP% (not the repo dir) to avoid
				// polluting version control. The AHK launcher embeds its file://
				// URL in the hash fragment as "#prefetch=file:///...".
				const _hash_params = new URLSearchParams(location.hash.slice(1));
				const _prefetch_url = _hash_params.get('prefetch') || './prefetch.json';
				fetch(_prefetch_url)
					.then((r) => (r.ok ? r.json() : null))
					.then((blob) => {
						if (!blob) {
							console.error('prefetch.json missing or unreadable');
							return;
						}
						console.log('prefetch loaded:', Object.keys(blob));
						apply_prefetch(blob);
					})
					.catch((e) => console.error('prefetch fetch failed:', e));
			})();
		</script>
	</body>
</html>
