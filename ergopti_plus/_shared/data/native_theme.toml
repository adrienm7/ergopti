# _shared/data/native_theme.toml
#
# The colours the native (Lua) drivers type themselves: the ordered palette of
# the hotstrings settings window and the accent of each download-window kind.
# The web pages take their colours from _shared/ui/theme.css instead; this file
# exists because a Lua driver has no stylesheet to read.
#
# Generated into _shared/lua/native_theme_data.lua by
# tools/codegen/codegen-native-theme.cjs. Edit this file, then run
# `npm run gen`; never edit the generated Lua by hand.
#
# The Windows driver still types the same palette in hcw_helpers.ahk;
# tools/test/test-color-presets-parity.cjs holds that copy to this one, colour
# for colour and in order, until Windows reads a generated palette too.

# The ordered palette: the 14 colours the three drivers offer, along the hue wheel
# (warm, cool, neutral). `i18n` is the locale key of the colour's name; the
# "ai" colour is the AI tooltip's own purple: its hex is not typed here, `hex_from` names the
# key of [accent_colors] in _shared/modules/tooltip/constants.toml, its one source.
[[hotstring_palette]]
name = "red"
i18n = "hs_config.color_red"
hex = "#e53935"

[[hotstring_palette]]
name = "pink"
i18n = "hs_config.color_pink"
hex = "#e91e63"

[[hotstring_palette]]
name = "purple"
i18n = "hs_config.color_purple"
hex = "#8e44ad"

[[hotstring_palette]]
name = "ai"
i18n = "menu.hotstrings.tooltip_ai"
hex_from = "ai_loading_hex"

[[hotstring_palette]]
name = "indigo"
i18n = "hs_config.color_indigo"
