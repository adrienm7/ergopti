# .github/workflows/ci-linux.yml
#
# The Linux lane of the CI pipeline. ci.yml calls it once per run, after its
# validate job, as the job named "Linux". Each stage runs in a reusable
# workflow of its own (ci-linux-<stage>.yml), called here by a job that keeps
# the stage job's id and hands it the plan inputs, its predecessors' outputs
# and this lane's needs context, so a stage job renders as
# "Linux / <stage> / <job>" in the run graph, one lane with one entry stage and
# one exit stage:
#
#   unit tests -> E2E tests (5) -> package -> install and launch (17) -> verdict
#                 domain rows                 5 archive installs     (evidence gate)
#                                             9 first installs
#                                             3 package runs
#                                  \-> Flatpak (parallel to install and launch)
#
# The E2E column is one matrix job (e2e-linux, in ci-linux-e2e.yml) whose rows
# split its harnesses by domain; tools/test/fixtures/linux-e2e-shards.json
# assigns each step to one row. package-linux needs the whole matrix, and
# linux-ok requires one evidence document per row.
#
# The driver is assembled and packaged ONCE per run, by package-linux, into the
# artifact assets-linux. The .deb, .rpm and AppImage smokes install those exact
# files on their own pristine hosts, and on a release run ci-release.yml's
# release job publishes those same files. linux-ok checks every job's evidence
# against .github/linux-ci-coverage.json. The lane has no outputs: its own
# result is what the release waits for, and the release collects assets-linux
# through its assets-* download pattern.
#
# Inputs, all computed by the plan steps of ci.yml's validate job:
#   release       true on a run that publishes; it only sets artifact retention.
#   version       the release version, '' otherwise ('' writes a commit-only
#                 build stamp, the CI behaviour).
#   linux_bundle  the tarball asset name, resolved once from the updater
#                 release contract (defaults.json) and validated there.
#
# No concurrency block: the caller's group already covers the whole run, and
# reusing it here would cancel this workflow from inside its own run.

name: Linux

on:
  workflow_call:
    inputs:
      release:
        description: True when this run publishes a release; only sets artifact retention
        required: true
        type: boolean
      version:
        description: Release version stamped into the Linux tree, empty outside a release
        required: true
        type: string
      tag:
        description: Exact release tag from the validated release plan
        required: true
        type: string
      prerelease:
        description: Exact prerelease string from the validated release plan
        required: true
        type: string
      channel:
        description: Exact update channel from the validated release plan
        required: true
        type: string
      linux_bundle:
        description: Linux tarball asset name from the updater release contract
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────
  # 1) Linux Lua driver unit and native contract tests
  # ─────────────────────────────────────────────────
  # The lane's entry job: the only one of this file that needs nothing.
  # One row per domain group of static/ergopti_plus/linux/tests/support/
  # module_groups.lua (run.lua --module=<group>); the groups partition the
  # suite, so the rows together run every test module exactly once. The list
  # below must equal those groups, in order (test-linux-ci-evidence.cjs). The
  # native qualifications that are not part of the Lua suite run once, in the
  # meta row.
  test-linux:
    name: 'Unit tests'
    uses: ./.github/workflows/ci-linux-unit.yml
    with:
      release: ${{ inputs.release }}
      version: ${{ inputs.version }}
      tag: ${{ inputs.tag }}
      prerelease: ${{ inputs.prerelease }}
      channel: ${{ inputs.channel }}

  e2e-linux:
    name: 'E2E tests'
    needs: [test-linux]
    uses: ./.github/workflows/ci-linux-e2e.yml
    with:
      release: ${{ inputs.release }}
      version: ${{ inputs.version }}
      tag: ${{ inputs.tag }}
      prerelease: ${{ inputs.prerelease }}
      channel: ${{ inputs.channel }}
      predecessors: ${{ toJSON(needs) }}
      predecessor_result: ${{ needs.test-linux.result }}

  package-linux:
    name: 'Build'
    needs: [e2e-linux]
    if: ${{ !cancelled() && needs.e2e-linux.outputs.ci_unit_result == 'success' && (needs.e2e-linux.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.e2e-linux.result == 'failure')) }}
    uses: ./.github/workflows/ci-linux-build.yml
    with:
      release: ${{ inputs.release }}
      version: ${{ inputs.version }}
      tag: ${{ inputs.tag }}
      prerelease: ${{ inputs.prerelease }}
      channel: ${{ inputs.channel }}
      linux_bundle: ${{ inputs.linux_bundle }}
      predecessors: ${{ toJSON(needs) }}

  # ─────────────────────────────────────────────────
  # 3a) Build and smoke the Flatpak, beside the install cells
  # ─────────────────────────────────────────────────
  # Built from the exact tarball package-linux uploaded in assets-linux (the
  # driver bundle every other package was made from), unpacked into build/linux
  # where build-linux-flatpak.sh expects it. It runs in parallel with
  # install-linux; linux-ok needs both, and its published file travels in its
  # own assets-linux-flatpak artifact, which the release collects through its
  # assets-* pattern. A skipped package-linux skips this job, and linux-ok then
  # fails on the missing result.
  package-flatpak:
    name: 'Flatpak'
    needs: [package-linux]
    uses: ./.github/workflows/ci-linux-flatpak.yml
    with:
      release: ${{ inputs.release }}
      version: ${{ inputs.version }}
      tag: ${{ inputs.tag }}
      prerelease: ${{ inputs.prerelease }}
      channel: ${{ inputs.channel }}
      linux_bundle: ${{ inputs.linux_bundle }}
      predecessors: ${{ toJSON(needs) }}

  # ─────────────────────────────────────────────────
  # 3) Install and run every Linux distribution and package
  # ─────────────────────────────────────────────────
  # One matrix gives the Linux lane one install block in GitHub's run graph.
  # Archive installs use each distribution's container and LuaJIT. First-run
  # checks use Docker from the host, with all installer dependencies enabled.
  # Fedora's first-run rows declare its LuaJIT/lgi WebKit limitation explicitly.
  # deb and AppImage run on the host; rpm uses Fedora without preinstalled
  # LuaJIT, so dependency resolution and the bundled interpreter remain tested.
  # An empty scalar container means a host job in the GitHub runner.
  install-linux:
    name: 'Install and launch'
    needs: [package-linux]
    uses: ./.github/workflows/ci-linux-install.yml
    with:
      release: ${{ inputs.release }}
      version: ${{ inputs.version }}
      tag: ${{ inputs.tag }}
      prerelease: ${{ inputs.prerelease }}
      channel: ${{ inputs.channel }}
      install_matrix: ${{ needs.package-linux.outputs.install_matrix }}
      install_metadata: ${{ needs.package-linux.outputs.install_metadata }}
      predecessors: ${{ toJSON(needs) }}

  # ─────────────────────────────────────────────────
  # 5) Verdict: every mandatory Linux subject ran and passed
  # ─────────────────────────────────────────────────
  # The needs: list below and .github/linux-ci-coverage.json name the same jobs
  # twice on purpose — needs: decides what this job waits for, the manifest
  # decides what it fails on — and a job added to one but not the other runs
  # and gates nothing. That is exactly what build-deb and build-rpm once were:
  # no job listed them, so a broken package still shipped a release.
  # linux-ci-evidence.cjs verify rejects both halves of that drift at run time
  # (a manifest job missing from needs, a needs entry the manifest does not
  # classify). Anything added to this file goes in BOTH.
  #
  # Its caller stays inside this workflow on purpose: toJSON(needs) only sees
  # the jobs of its own workflow, so from ci.yml it would hold nothing but
  # "linux", and from ci-linux-verdict.yml nothing at all; the caller hands it
  # to the stage as `predecessors`.
  # if: always() so that a failed or skipped job is reported by name, from the
  # evidence, instead of this job being skipped in silence. The lane's exit
  # job: no job of this file needs it.
  linux-ok:
    name: 'Verdict'
    needs: [install-linux, package-flatpak]
    if: always()
    uses: ./.github/workflows/ci-linux-verdict.yml
    with:
      release: ${{ inputs.release }}
      version: ${{ inputs.version }}
      tag: ${{ inputs.tag }}
      prerelease: ${{ inputs.prerelease }}
      channel: ${{ inputs.channel }}
      predecessors: ${{ toJSON(needs) }}
