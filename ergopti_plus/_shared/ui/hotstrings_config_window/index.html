<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<title data-i18n="hs_config.window_title"></title>
		<script src="../a11y_prefs.js"></script>
		<script src="../page_locale.js"></script>
		<link rel="stylesheet" href="../theme.css" />
		<link rel="stylesheet" href="style.css" />
		<script src="../i18n.js"></script>
		<script src="../host_bridge.js"></script>
	</head>
	<body>
		<header class="topbar">
			<hgroup class="title">
				<h1 data-i18n="hs_config.window_title"></h1>
				<p class="hint" data-i18n="hs_config.hint"></p>
			</hgroup>
			<menu class="actions">
				<li>
					<button class="btn" onclick="setAllGrey()" data-i18n="hs_config.btn_all_grey"></button>
				</li>
				<li>
					<button
						class="btn btn-danger"
						onclick="resetAll()"
						data-i18n="hs_config.btn_reset_all"
					></button>
				</li>
				<li><button class="btn" onclick="closeWindow()" data-i18n="common.close"></button></li>
			</menu>
		</header>

		<search class="group-bar" aria-labelledby="group-select-label">
			<label id="group-select-label" for="group-select" data-i18n="hs_config.label_group"></label>
			<select id="group-select" onchange="onGroupChange()"></select>
		</search>

		<main id="content"></main>

		<template id="tpl-category">
			<section class="cat">
				<header class="cat-head">
					<!-- The caret and the title are one disclosure button: the
					     heading names the category and folds its sections. -->
					<h2 class="cat-title"><button class="caret" data-role="toggle"></button></h2>
					<ul class="row">
						<li class="field field-delay" data-level="file" data-field="delay">
							<label data-i18n-key="hs_config.label_delay"></label>
							<p class="ctrl">
								<input type="number" min="0" step="50" />
								<button class="reset" data-i18n-title-key="hs_config.btn_reset_default">↺</button>
							</p>
						</li>
						<li class="field field-color" data-level="file" data-field="color">
							<label data-i18n-key="hs_config.label_color"></label>
							<p class="ctrl">
								<svg class="swatch" aria-hidden="true" focusable="false"></svg>
								<select></select>
								<button class="reset" data-i18n-title-key="hs_config.btn_reset_default">↺</button>
							</p>
						</li>
						<li class="field field-priority" data-level="file" data-field="priority">
							<label data-i18n-key="hs_config.label_priority"></label>
							<p class="ctrl">
								<input type="number" min="0" max="100" step="1" />
								<button class="reset" data-i18n-title-key="hs_config.btn_reset_default">↺</button>
							</p>
						</li>
						<li class="field field-tooltip" data-level="file" data-field="tooltip">
							<label data-i18n-key="hs_config.label_tooltip"></label>
							<p class="ctrl">
								<input type="checkbox" class="chk-tooltip" />
								<button class="reset" data-i18n-title-key="hs_config.btn_reset_default">↺</button>
							</p>
						</li>
					</ul>
				</header>
				<ul class="sections"></ul>
			</section>
		</template>

		<template id="tpl-section">
			<li class="sec">
				<h3 class="sec-title"></h3>
				<ul class="row">
					<li class="field field-delay" data-level="section" data-field="delay">
						<label data-i18n-key="hs_config.label_delay"></label>
						<p class="ctrl">
							<input type="number" min="0" step="50" />
							<button class="reset" data-i18n-title-key="hs_config.btn_reset_default">↺</button>
						</p>
					</li>
					<li class="field field-color" data-level="section" data-field="color">
						<label data-i18n-key="hs_config.label_color"></label>
						<p class="ctrl">
							<svg class="swatch" aria-hidden="true" focusable="false"></svg>
							<select></select>
							<button class="reset" data-i18n-title-key="hs_config.btn_reset_default">↺</button>
						</p>
					</li>
					<li class="field field-priority" data-level="section" data-field="priority">
						<label data-i18n-key="hs_config.label_priority"></label>
						<p class="ctrl">
							<input type="number" min="0" max="100" step="1" />
							<button class="reset" data-i18n-title-key="hs_config.btn_reset_default">↺</button>
						</p>
					</li>
					<li class="field field-tooltip" data-level="section" data-field="tooltip">
						<label data-i18n-key="hs_config.label_tooltip"></label>
						<p class="ctrl">
							<input type="checkbox" class="chk-tooltip" />
							<button class="reset" data-i18n-title-key="hs_config.btn_reset_default">↺</button>
						</p>
					</li>
				</ul>
			</li>
		</template>

		<script src="../value_check.js"></script>
		<script src="script.js"></script>
	</body>
</html>
