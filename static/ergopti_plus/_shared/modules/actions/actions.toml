# --- Raccourcis modificateur + touche ---
# La matrice exhaustive est déclarée une seule fois dans
# modifier_chords.json. Chaque driver génère toutes les combinaisons non vides
# de ses modificateurs natifs et les expose sous des libellés non traduits comme
# « Ctrl + A ». Les identifiants internes ne doivent jamais être affichés.

