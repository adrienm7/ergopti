[sections.llm.display]
description_key = "menu.llm.display"
platforms = ["ahk", "hs"]

[sections.llm.generation]
# Linux joined on 2026-08-06, when the two settings below gained a control. It
# read both from the shared canonical defaults and had no way to change either,
# so they were constants wearing the shape of settings — and declaring a
# capability with no control is what ADR-008 removed a notifier for.
