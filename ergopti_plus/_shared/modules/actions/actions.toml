# _shared/modules/actions/actions.toml
#
# The single source of truth for every bindable action (gestures, keyboard
# slots, tap-holds). No driver reads this file at runtime:
# tools/codegen/codegen-action-catalogue.cjs turns it into one generated
# catalogue per driver (macos/_generated/action_catalogue.lua,
# linux/_generated/action_catalogue.lua,
# windows/_generated/action_catalogue.ahk), already filtered to that driver's
# platform, with the picker order, heading levels and i18n keys resolved. Run
# `npm run codegen:action-catalogue` (or `npm run gen`) after editing it.
#
# The generator validates every field strictly: an unknown field, platform
# token, parameter kind or requirement token stops generation instead of being
# dropped, because a dropped field is a promise the picker silently breaks.
#
# FIELDS OF [sg_actions.<id>] (single-fire) AND [ax_actions.<id>] (axis):
#   platform  "all", one of "hs" / "ahk" / "linux", or a comma-separated list
#             such as "hs,ahk". It decides which pickers list the action, so it
#             must be true: each driver's suite compares its generated catalogue
#             with the set of actions it can actually run, in both directions.
#   emit_*    Per-OS keystrokes (see the three codegen-gesture-emit-actions
#             generators). The rows are per-OS on purpose: 13 of the 24
#             keystrokes both desktop drivers share genuinely differ.
#   parameter A per-binding value the user types when binding the action:
#             "url", "search_url" (a URL template with exactly one %s),
#             "wrap_pair" (a symbol of _shared/modules/wrap_symbols/wrap_symbols.json
#             or a custom left|right pair; rule pinned by
#             _shared/tests/corpus/action_parameters/wrap_pair_vectors.json), or
#             "text", "key" and "shortcut" (a text to type, a key, modifiers
#             plus a key; vocabulary send_keys.json, rule pinned by
#             _shared/tests/corpus/action_parameters/send_input_vectors.json),
#             or "llm_prompt" (a prompt profile id, optionally followed by
#             |count; rule pinned by
#             _shared/tests/corpus/action_parameters/llm_prompt_vectors.json),
#             or "llm_vision" (a vision backend, "local" or an API provider,
#             optionally followed by |model; rule pinned by
#             _shared/tests/corpus/llm/vision_vectors.json), or "llm_language"
#             ("ui" for the interface language, or a locale code of
#             _shared/data/locale_names.json; rule pinned by
#             _shared/tests/corpus/llm/translate_vectors.json), or "app" (an
#             application as the OS launches one, picked in a native chooser;
#             rule pinned by _shared/tests/corpus/action_parameters/app_vectors.json),
#             or "program" (versioned JSON containing an absolute executable
#             and literal ordered arguments; rule pinned independently by
#             _shared/tests/corpus/action_parameters/program_vectors.json).
#   confirm   true for a destructive action that must ask before it runs. Each
#             driver's dispatcher asks, off the input thread, and runs the
#             action only on the explicit answer: macOS execute_single
#             (modules/gestures/action_confirm.lua), Windows GestureInvokeAction
#             (modules/gestures/config.ahk), Linux a zenity/kdialog question
#             chained to the command (modules/gestures/system_actions.lua),
#             which is why Linux refuses to load a confirm action that is not
#             one of those commands.
#   requires_linux / requires_hs / requires_ahk
#             Capabilities the action needs on that OS. The picker greys a row
#             whose requirement the driver proves absent, with the reason as a
#             hint, instead of offering a binding that would do nothing. Linux
#             understands "tool:<binary>" (on PATH), "session:x11" and
#             "session:workspaces" (a session whose workspaces another process
#             can read and pick: X11, KDE Plasma, sway or Hyprland); macOS
#             and Windows declare no probe yet, so the generator refuses a
#             token for them rather than emitting one nothing checks.
#   scalable  (axis only) whether the axis repeats with the swipe distance.
#
# [sg_order] / [ax_order] give the picker order. "#name" is a level-1 heading,
# "##name" a level-2 one; both resolve through the locale key
# sg_actions.sg_order.header.<name>. A heading left with no action for a driver
# is dropped from that driver's catalogue. "--" is a visual break in this file
# only: the pickers group by heading, so separators are not emitted.


# ==============================================================================
# Gesture slot key-space (single source of truth for the slot names)
# ==============================================================================
#
# Both drivers (Linux modules/gestures/manager.lua and macOS
# modules/gestures/init.lua) must build SINGLE_SLOTS / AXIS_SLOTS and the
# DEFAULT_GESTURES key-space from these lists. The DEFAULT_GESTURES key-space is
# exactly the union of single and axis. The default action VALUES stay
# platform-specific and are intentionally not listed here.

[slots]
single = [
	"tap_2", "tap_3", "tap_4", "tap_5",
	"swipe_2_left", "swipe_2_right", "swipe_2_up", "swipe_2_down",
	"swipe_2_left_up", "swipe_2_right_up", "swipe_2_left_down", "swipe_2_right_down",
	"swipe_3_left", "swipe_3_right", "swipe_3_up", "swipe_3_down",
	"swipe_3_left_up", "swipe_3_right_up", "swipe_3_left_down", "swipe_3_right_down",
	"swipe_4_left", "swipe_4_right", "swipe_4_up", "swipe_4_down",
	"swipe_4_left_up", "swipe_4_right_up", "swipe_4_left_down", "swipe_4_right_down",
	"swipe_5_left", "swipe_5_right", "swipe_5_up", "swipe_5_down",
	"swipe_5_left_up", "swipe_5_right_up", "swipe_5_left_down", "swipe_5_right_down",
]
axis = [
	"swipe_3_horiz",
	"swipe_4_horiz",
	"swipe_5_horiz",
]


# ==============================================================================
# Axis actions (continuous, optionally scalable swipes)
# ==============================================================================
#
# Only macOS dispatches an axis (modules/gestures/engine.lua). Windows receives
# its gestures as ten Precision Touchpad hotkeys and Linux as finished
# direction swipes, so neither has an axis to feed. These were declared "all",
# which promised Windows and Linux fifteen bindings neither could run; the
# Windows-only "desktops" axis was declared and never wired at all.

[ax_actions]

[ax_actions.tabs]
platform = "hs"
scalable = true

[ax_actions.char]
platform = "hs"
scalable = true

[ax_actions.char_sel]
platform = "hs"
scalable = true

[ax_actions.line_arrow]
platform = "hs"
scalable = true

[ax_actions.line_sel]
platform = "hs"
scalable = true

[ax_actions.words]
platform = "hs"
scalable = true

[ax_actions.words_sel]
platform = "hs"
scalable = true

[ax_actions.windows]
platform = "hs"
scalable = false

[ax_actions.spaces]
platform = "hs"
scalable = false

[ax_actions.volume]
platform = "hs"
scalable = true

[ax_actions.brightness]
platform = "hs"
scalable = true

[ax_actions.tracks]
platform = "hs"
scalable = false

[ax_actions.lines]
platform = "hs"
scalable = true

[ax_actions.line_bounds]
platform = "hs"
scalable = false

[ax_actions.paragraphs]
platform = "hs"
scalable = true

[ax_actions.document]
platform = "hs"
scalable = false


# ==============================================================================
# Axis picker order
# ==============================================================================

[ax_order]
items = [
    "tabs",
    "char",
    "char_sel",
    "line_arrow",
    "line_sel",
    "words",
    "words_sel",
    "windows",
    "spaces",
    "volume",
    "brightness",
    "tracks",
    "lines",
    "line_bounds",
    "paragraphs",
    "document",
]


# ==============================================================================
# Actions ponctuelles (single-fire)
# ==============================================================================

[sg_actions]

[sg_actions.none]
platform = "all"

# --- Souris ---

[sg_actions.left_click_toggle]
platform = "all"
# Linux holds the button through xdotool, which only reaches an X11 session.
requires_linux = ["session:x11", "tool:xdotool"]

[sg_actions.right_click_toggle]
platform = "all"
requires_linux = ["session:x11", "tool:xdotool"]

[sg_actions.lookup]
platform = "hs"

# --- Navigation applications ---

# The operating system's switcher. macOS explicitly presses and releases Command,
# observes each tagged edge, and requires independent combined-session release.
# Historical v5-to-v6 migration remains unchanged; macOS uses a distinct ID.
[sg_actions.app_switcher]
platform = "ahk,linux"
emit_ahk_key = "Tab"
emit_ahk_mods = ["alt"]
emit_linux = "alt+Tab"

# The distinct macOS native product keeps the retired v5 identifier absent.
# Its observed private Command/Tab edges and retirement are separate from focus.
[sg_actions.system_app_switcher]
platform = "hs"

# The two previous-application scopes: every screen, and only the screen under
# the cursor. macOS activates the application directly
# (macos/modules/gestures/app_switch.lua): a posted Cmd+Tab never switched.
[sg_actions.app_previous]
platform = "hs"

[sg_actions.app_previous_screen]
platform = "hs"

[sg_actions.app_window_previous]
# Linux runs it through its emit row (Alt+Escape: the next window, with no
# switcher). On macOS it posted Cmd+` like win_next did, so both became
# win_app_next there (config migration step v5_to_v6).
platform = "linux"
emit_linux = "alt+Escape"

# --- Editing (Windows and Linux; macOS uses Cmd+C/V/X in cmd_*) ---

[sg_actions.copy]
platform = "ahk,linux"
emit_ahk_key = "c"
emit_ahk_mods = ["ctrl"]
emit_linux = "ctrl+c"

[sg_actions.paste]
platform = "ahk,linux"
emit_ahk_key = "v"
emit_ahk_mods = ["ctrl"]
emit_linux = "ctrl+v"

[sg_actions.cut]
platform = "ahk,linux"
emit_ahk_key = "x"
emit_ahk_mods = ["ctrl"]
emit_linux = "ctrl+x"

[sg_actions.undo]
platform = "ahk,linux"
emit_ahk_key = "z"
emit_ahk_mods = ["ctrl"]
emit_linux = "ctrl+z"

# Ctrl+Shift+Z on Linux: it is the redo of GNOME, KDE and the browsers there,
# while only some applications also accept Ctrl+Y.
[sg_actions.redo]
platform = "ahk,linux"
emit_ahk_key = "y"
emit_ahk_mods = ["ctrl"]
emit_linux = "ctrl+shift+z"

[sg_actions.select_all]
platform = "ahk,linux"
emit_ahk_key = "a"
emit_ahk_mods = ["ctrl"]
emit_linux = "ctrl+a"

[sg_actions.find]
platform = "ahk,linux"
emit_ahk_key = "f"
emit_ahk_mods = ["ctrl"]
emit_linux = "ctrl+f"

# --- Touches ---

[sg_actions.enter]
platform = "all"
emit_ahk_key = "Enter"
emit_ahk_mods = []
emit_hs_key = "return"
emit_hs_mods = []
emit_linux = "Return"

[sg_actions.tab]
platform = "all"
emit_hs_key = "tab"
emit_hs_mods = []
emit_linux = "Tab"

[sg_actions.escape]
platform = "all"
emit_ahk_key = "Escape"
emit_ahk_mods = []
emit_hs_key = "escape"
emit_hs_mods = []
emit_linux = "Escape"

[sg_actions.backspace]
platform = "all"
emit_ahk_key = "BackSpace"
emit_ahk_mods = []
emit_hs_key = "delete"
emit_hs_mods = []
emit_linux = "BackSpace"

[sg_actions.delete]
platform = "all"
emit_ahk_key = "Delete"
emit_ahk_mods = []
emit_hs_key = "forwarddelete"
emit_hs_mods = []
emit_linux = "Delete"

# The binding's own text, key or shortcut, typed or pressed through each
# driver's synthetic-input choke point. The vocabulary (named keys, modifiers
# with the portable "primary", the text limit) is send_keys.json; the grammar is
# pinned by _shared/tests/corpus/action_parameters/send_input_vectors.json.
[sg_actions.send_text]
platform = "all"
parameter = "text"

[sg_actions.send_key]
platform = "all"
parameter = "key"

[sg_actions.send_shortcut]
platform = "all"
parameter = "shortcut"

# --- Onglets ---

[sg_actions.tab_new]
platform = "all"
emit_ahk_key = "t"
emit_ahk_mods = ["ctrl"]
emit_hs_key = "t"
emit_hs_mods = ["cmd"]
emit_linux = "ctrl+t"

[sg_actions.tab_close]
platform = "all"
emit_ahk_key = "w"
emit_ahk_mods = ["ctrl"]
emit_hs_key = "w"
emit_hs_mods = ["cmd"]
emit_linux = "ctrl+w"

[sg_actions.tab_prev]
platform = "all"
emit_hs_key = "tab"
emit_hs_mods = ["ctrl", "shift"]
emit_linux = "ctrl+shift+Tab"

[sg_actions.tab_next]
platform = "all"
emit_hs_key = "tab"
emit_hs_mods = ["ctrl"]
emit_linux = "ctrl+Tab"

# --- Navigation navigateur ---

[sg_actions.nav_back]
platform = "ahk"

[sg_actions.nav_forward]
platform = "ahk"

# --- Fenêtres ---

# Every window of every application, in turn. macOS cycled the active
# application's windows under these ids, which is what win_app_prev and
# win_app_next name on Windows, so it offers those instead (config migration
# step v5_to_v6 maps a stored one).
[sg_actions.win_prev]
platform = "ahk,linux"
emit_linux = "alt+shift+Tab"

[sg_actions.win_next]
platform = "ahk,linux"
emit_linux = "alt+Tab"

# The windows of the active application, in turn. macOS focuses them directly
# (macos/modules/gestures/app_switch.lua), since a posted Cmd+` depends on a
# layout carrying a backquote.
[sg_actions.win_app_prev]
platform = "ahk,hs"

[sg_actions.win_app_next]
platform = "ahk,hs"

[sg_actions.close_window]
platform = "all"
emit_ahk_key = "F4"
emit_ahk_mods = ["alt"]
emit_hs_key = "w"
emit_hs_mods = ["cmd"]
emit_linux = "alt+F4"

[sg_actions.fullscreen]
platform = "all"
emit_ahk_key = "F11"
emit_ahk_mods = []
emit_hs_key = "f"
emit_hs_mods = ["cmd", "ctrl"]
emit_linux = "F11"

[sg_actions.snap_left]
platform = "all"
emit_ahk_key = "Left"
emit_ahk_mods = ["super"]
emit_linux = "super+Left"

[sg_actions.snap_right]
platform = "all"
emit_ahk_key = "Right"
emit_ahk_mods = ["super"]
emit_linux = "super+Right"

[sg_actions.maximize]
platform = "all"
emit_ahk_key = "Up"
emit_ahk_mods = ["super"]
emit_linux = "super+Up"

# --- Espaces / bureaux virtuels ---

# One Space left or right, as Ctrl+Arrow does: stops at the first and last.
[sg_actions.space_prev]
platform = "hs"

[sg_actions.space_next]
platform = "hs"

# The same step, wrapping at the edges: from the last Space of the focused
# screen to its first, and from the first to its last.
[sg_actions.space_prev_wrap]
platform = "hs"

[sg_actions.space_next_wrap]
platform = "hs"

[sg_actions.mission_control]
platform = "hs"

[sg_actions.app_expose]
platform = "hs"

[sg_actions.desktop_prev]
# One desktop left or right, stopping at the first and the last. Linux drives
# the session's own interface (wmctrl, KWin, sway, Hyprland) and presses the
# desktop's Ctrl+Alt+Arrow where there is none, so no session is left out.
platform = "ahk,linux"
emit_ahk_key = "Left"
emit_ahk_mods = ["ctrl", "super"]

[sg_actions.desktop_next]
platform = "ahk,linux"
emit_ahk_key = "Right"
emit_ahk_mods = ["ctrl", "super"]

# The same step, wrapping at the edges: from the last desktop to the first and
# from the first to the last. Windows reads the position from the registry
# Explorer keeps and presses Ctrl+Win+Arrow once per desktop; Linux needs a
# session that tells where the edge is (GNOME under Wayland does not).
[sg_actions.desktop_prev_wrap]
platform = "ahk,linux"
requires_linux = ["session:workspaces"]

[sg_actions.desktop_next_wrap]
platform = "ahk,linux"
requires_linux = ["session:workspaces"]

[sg_actions.desktop_new]
platform = "ahk"
emit_ahk_key = "d"
emit_ahk_mods = ["ctrl", "super"]

[sg_actions.desktop_close]
platform = "ahk"
emit_ahk_key = "F4"
emit_ahk_mods = ["ctrl", "super"]

[sg_actions.task_view]
platform = "ahk"
emit_ahk_key = "Tab"
emit_ahk_mods = ["super"]

[sg_actions.minimize_all]
# Windows minimizes with Win+M (Win+D is show_desktop, which toggles back);
# macOS minimizes every window of every visible app through System Events.
# Linux is not implemented, not impossible: EWMH has no "minimize all" request,
# so it needs a per-window pass (xdotool on X11; nothing on Wayland).
platform = "ahk,hs"
emit_ahk_key = "m"
emit_ahk_mods = ["super"]

