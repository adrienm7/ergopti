# The model button of Windows and Linux: (Windows: the cached health dot,) the
# backend's emoji and the model; it opens the model selector page. macOS draws
# the same caption natively on its dynamic llm_model row.
[[menu.llm_model_selector_commands]]
type = "command"
id = "llm_model_selector"
i18n = "menu.llm.model_selector_caption"
caption_getters = ["llm_model_selector_caption"]
disabled_when = ["llm_model_selector_ready"]
platforms = ["ahk", "linux"]
unavailable = "hide"

