# ===========================
# ======= 3. Features =======
# ===========================
# ===========================




# ======================
# ===== 3.1 script =====
# ======================

[[features.script]]
id = "locale"
default = "fr"
type = "string"
description_key = "menu.script.locale"

[[features.script]]
id = "log_level"
default = "INFO"
type = "enum"
enum_values = ["DEBUG", "TRACE", "DONE", "INFO", "START", "SUCCESS", "WARNING", "ERROR"]
description_key = "menu.script.log_level"

[[features.script]]
id = "alt_gr_is_kana_remap"
default = "auto"
type = "enum"
enum_values = ["auto", true, false]
description_key = "menu.script.alt_gr_is_kana_remap"
platforms = ["ahk"]
# Première raison écrite (2026-08-03), et elle sert de modèle : elle dit ce que
# la plateforme ne peut pas faire, pas ce qui n'a pas été codé. Le réglage
# compense les dispositions Windows personnalisées (KbdEdit/MSKLC) qui
# réassignent AltGr à une autre touche virtuelle — une notion de pilote clavier
# Windows (HKL, MapVirtualKeyExW, VK_RMENU) sans équivalent ailleurs.
reason_key = "platform_reason.alt_gr_is_kana_remap"



# ==========================
# ===== 3.2 hotstrings =====
# ==========================

[[features.hotstrings]]
id = "trigger_char"
default = "★"
type = "string"
description_key = "menu.hotstrings.trigger_char"

# Unrestricted since 2026-08-05. The ["ahk"] restriction was already false when
# it was written: macOS ships the engine (modules/keymap/expander.lua
# try_repeat_feature) AND the toggle, and has for as long as that file has
# existed. It recorded who implemented the feature first, not what the platforms
# can do — the same mistake already corrected for hotstring_extensions and
# magic_key_config. Nothing here touches an OS API: it is "if the character just
# typed is the magic key and nothing matched, replace it with the one before it",
# which is as portable as the buffer it reads.
# Linux gained it in modules/hotstrings/repeat_key.lua.
[[features.hotstrings]]
id = "repeat_key_enabled"
default = true
type = "boolean"
description_key = "menu.hotstrings.repeat_key_enabled"

[[features.hotstrings]]
id = "expansion_delay"
platforms = ["hs"]
default = 0.75
type = "number"
description_key = "menu.hotstrings.expansion_delay"

[[features.hotstrings]]
id = "preview_ai_enabled"
platforms = ["hs", "linux"]
default = true
type = "boolean"
description_key = "menu.hotstrings.preview_ai_enabled"

[[features.hotstrings]]
id = "preview_autocorrect_enabled"
platforms = ["hs", "linux"]
default = true
type = "boolean"
description_key = "menu.hotstrings.preview_autocorrect_enabled"

[[features.hotstrings]]
id = "preview_colored_tooltips"
platforms = ["hs", "linux"]
default = true
type = "boolean"
description_key = "menu.hotstrings.preview_colored_tooltips"

[[features.hotstrings]]
id = "preview_star_enabled"
default = true
type = "boolean"
description_key = "menu.hotstrings.preview_star_enabled"
platforms = ["hs", "linux"]



