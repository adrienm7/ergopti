# _shared/features/shortcuts.toml
# Companion manifest defining keyboard shortcut bindings for each driver.
# Single source of truth for shortcut ids, i18n keys and default key chords.
#
# Consumed by `scripts/codegen-shortcuts.cjs` which generates:
#   static/ergopti_plus/windows/_generated/shortcuts_bindings.ahk
#   static/ergopti_plus/macos/_generated/shortcuts_bindings.lua
#
# Fields:
#   id               Unique shortcut identifier (matches bindings.lua / ErgoptiPlus.ahk).
#   label_key        i18n key for the user-facing label.
#   description_key  i18n key for the longer description / tooltip.
#   default_key_ahk  Default trigger chord in AHK v2 notation (empty string = N/A).
#   default_key_hs   Default trigger chord in Hammerspoon notation (empty string = N/A).
#   platforms        Drivers that expose this shortcut.




# ======================================
# ======================================
# ======= 1/ Script-control slots =======
# ======================================
# ======================================

[[shortcuts]]
id = "script_altgr_enter"
label_key = "sg_labels.script_altgr_enter"
description_key = "menu.ahk.shortcuts.script_control.script_altgr_enter"
default_key_ahk = "RAlt & Enter"
default_key_hs = ""
platforms = ["ahk"]

