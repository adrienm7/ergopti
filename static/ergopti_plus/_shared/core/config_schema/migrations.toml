[steps.v18_to_v19]
from = 18
to = 19
drivers = ["ahk"]
reason = "The Windows feature switches become the keyboard slots of the same chords, as on macOS since v15: a switch left on becomes its catalogue action, a switch turned off becomes none, and an action the user chose for the slot wins."
# A saved slot is already under its neutral id (v18), so it keeps its value over
# the switch of the same chord. Win+G and Win+S recommended open_url and
# search_web, which read a per-binding parameter the switch never wrote, while
# the switch ran the ChatGPT link and the selection opener. A file restored to
# the recommendations holds both, so those two values become what the chord
# actually ran. A URL on the slot and then the switch's link go to the setting
# open_chatgpt reads, the first one present winning. The search and note fields
# other than the switch stay where they are: they are now settings.
