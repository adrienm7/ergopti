# _shared/modules/menu/menu.toml
# Single source of truth for the cross-driver tray menu.
#
# Every row of every tray submenu is declared here: its type, label key, order,
# platforms, checkmark and greying conditions, and the command it runs. The
# generator tools/build/build-menu-manifest.js (``npm run build:menu``) emits
# menu_manifest.json beside this file, and the three drivers read that JSON at
# runtime. A driver supplies only the DATA of a named ``list`` provider and the
# handlers of the declared commands; adding, removing or renaming a row happens
# here, never in a driver. See README.md beside this file for the row types.
#
# These tables lived in _shared/modules/features/manifest.toml until
# 2026-10-31, interleaved with the feature tables; that file now holds features
# only, and test-menu-manifest refuses a [menu] table there.



# ================================================
# ================================================
# ======= 1. Tray menu structure (codegen) =======
# ================================================
# ================================================

# Source of truth for the cross-driver tray-menu tree. Hand-edited here; the
# codegen tools/build/build-menu-manifest.js emits _shared/modules/menu/
# menu_manifest.json from these [menu.*] tables, and a drift gate keeps the two
# in sync. Both drivers read the generated JSON at runtime (unchanged). Item
# types: toggle / feature / action / group / section_header / list / check /
# command / letter_picker / choice / "---" separator. platforms =
# ["ahk"|"hs"|"linux"] gates per driver.
#
# There is no `dynamic` type any more (retired 2026-10-31). It handed the row id
# back to platform code, which then decided what to draw there, so a row could be
# added, renamed or reshaped per OS without this file changing. The six last
# ones (llm_model, llm_profile, llm_generation, agent_system1, agent_system2,
# agent_disabled_apps) are `list` rows: the driver supplies the row DATA of the
# named provider and the shared renderer draws it. The generator refuses a
# `dynamic` row, and test-menu-manifest fails on one.
#
# A `choice` is one enum feature (`path`) drawn as ONE row titled by `i18n`,
# with one row per value beneath it and the current value ticked. The values are
# the feature's `enum_values`, projected into the row by build-menu-manifest.js
# with the label keys `<i18n>.<value>`; a driver registers the command under the
# row id (called with the value chosen) and a state getter under the path.
#
# A `toggle` is a category's master switch and the FIRST row of its submenu: a
# checkbox labelled by one `i18n` key, ticked from `checked_when`, running the
# command each driver registers under its id. A driver that shows the row and
# registers no command is a defect the renderers report, never a way of saying
# "this tray toggles from the parent row" — no tray can: AppKit never sends the
# action of an item that opens a submenu, and neither appindicator nor Win32
# binds a click on one.

