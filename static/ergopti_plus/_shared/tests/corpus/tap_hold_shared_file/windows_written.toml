[_meta]
schema_version = 1

[tap_hold]
inherit_defaults = false
time_activation_seconds = 0.25
[tap_hold.keys.caps_lock]
hold_modifier = "ctrl"
tap_action = "backspace"
[tap_hold.keys.left_shift]
time_activation_seconds = 0.29999999999999999
hold_modifier = "shift"
tap_action = "copy"
[tap_hold.keys.tab]
hold_layer = "nav"
[tap_hold.keys.win]
hold_modifier = "ctrl+alt"
