# .github/workflows/ci-macos.yml
#
# macOS lane: Unit -> (E2E and Build side by side) -> Test build -> Verdict.
# Build packages after Unit; the test build admits both E2E and Build, so the
# verdict still proves all four stages. Native roles stay parallel inside their
# authored stage matrices.
# Lua unit and stubbed engine E2E tests run on Ubuntu. The Swift launcher tests
# share the macOS packaging host. The launch matrix installs the exact uploaded
# archive over the canonical user-state profile on Apple silicon and, for a
# release, Intel. The verdict checks every expected runner/scenario and commit.
# Parent ci.yml owns concurrency; this workflow must not cancel its caller.

name: macOS

on:
  workflow_call:
    inputs:
      release:
        description: True when ci.yml's plan resolved a free release tag
        required: true
        type: boolean
      version:
        description: Release version without the leading v; empty unless release, so the build stamps 0.0.0-dev
        required: true
        type: string
      tag:
        description: Exact release tag from the canonical plan; empty unless release
        required: true
        type: string
      prerelease:
        description: Exact prerelease string from the canonical plan; empty unless release
        required: true
        type: string
      channel:
        description: Sparkle update channel stamped into the app and the appcast, main or dev
        required: true
        type: string
    secrets:
      SPARKLE_PUBLIC_KEY:
        description: Sparkle EdDSA public key embedded as SUPublicEDKey; absent for fork pull requests
        required: false
      SPARKLE_ED_PRIVATE_KEY:
        description: Sparkle EdDSA private key that signs the declared release archives; passed on release runs only
        required: false
      MACOS_SIGNING_CERTIFICATE_BASE64:
        description: Self-signed code-signing .p12, base64; passed on release runs only
        required: false
      MACOS_SIGNING_CERTIFICATE_PASSWORD:
        description: Password of the code-signing .p12; passed on release runs only
        required: false

permissions:
  contents: read

env:
  ERGOPTI_DEV_RELEASE_RELEASE: ${{ inputs.release }}
  ERGOPTI_DEV_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
  ERGOPTI_DEV_RELEASE_CHANNEL: ${{ inputs.channel }}
  ERGOPTI_DEV_RELEASE_TAG: ${{ inputs.tag }}
  ERGOPTI_DEV_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  # One row per domain group of static/ergopti_plus/macos/tests/support/
  # module_groups.lua (run.lua --module=<group>); the groups partition the
  # suite, so the rows together run every test module exactly once. The list
  # below must equal those groups, in order (test-macos-stage-roles.cjs).
  test-hs:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        lot: [meta, core, modules, menu_llm, menu_input, ui, other]
    env:
      MACOS_STAGE_LOT: ${{ matrix.lot }}
    outputs:
      e2e_matrix: ${{ steps.stage-plan.outputs.e2e_matrix }}
      e2e_metadata: ${{ steps.stage-plan.outputs.e2e_metadata }}
    steps:
      # Enough history for test_no_coauthor_in_commits.lua, which scans
      # HEAD~20..HEAD. The default checkout is a depth-1 clone, so that range does
      # not exist and the test fails — correctly, and saying so: it refuses to
      # report a clean history it could not read. Giving it the commits is the fix;
      # letting it pass on an empty range would make the whole check ornamental.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 25

      - name: Admit the authored unit lot
        id: stage-selection
        run: node tools/ci/macos-stage-roles.cjs select unit

      - name: Install Lua 5.4 + luarocks
        run: |
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y lua5.4 liblua5.4-dev luarocks lua-luv
          lua5.4 -e 'local uv = require("luv"); local a = uv.hrtime(); local b = uv.hrtime(); assert(type(a) == "number" and a >= 0 and b >= a, "native Lua wall clock is mandatory")'

      - name: Install luafilesystem
        # lfs is required by tests/run.lua for recursive test discovery;
        # --lua-version 5.4 ensures luarocks links the correct runtime.
        run: sudo luarocks --lua-version 5.4 install luafilesystem

      # The lint scans the whole tree, whatever the lot, and never fails the
      # job, so seven identical copies only delayed the slowest Unit lot, which
      # gates E2E. The catch-all lot runs almost no tests and carries it alone.
      - name: Install luacheck
        if: matrix.lot == 'other'
        run: sudo luarocks --lua-version 5.4 install luacheck

      - name: Run luacheck (non-blocking)
        if: matrix.lot == 'other'
        # Surface warnings without failing — pre-existing style issues
        # must not block the test step.
        run: |
          luacheck static/ergopti_plus/macos/tests static/ergopti_plus/macos/infra \
            static/ergopti_plus/macos/modules || true

      - name: Run unit + meta tests
        working-directory: static/ergopti_plus/macos
        # The focused-runner regression tests spawn child interpreters; pin
        # the same binary as this job so runner-image defaults (which may
        # resolve bare `lua` to an interpreter without package.searchpath)
        # cannot change semantics under us.
        env:
          LUA: lua5.4
          MACOS_UNIT_GROUP: ${{ fromJSON(steps.stage-selection.outputs.cell).scenario }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-macos-stubbed-unit.json"
          mkdir -p "$(dirname "$receipt")"
          node ../../../tools/ci/dev-release-qualification.cjs --scope macos-stubbed-unit --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope macos-stubbed-unit --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] macos-stubbed-unit: qualified=false; original command not executed."
          elif [ "$mode" = full ]; then
              node ../../../tools/test/report.cjs --name macos-lua --json "${{ runner.temp }}/macos-lua.json" -- lua5.4 tests/run.lua --module="$MACOS_UNIT_GROUP"
          else
              echo "Invalid command qualification disposition" >&2
              exit 1
          fi

      # Timing JSON is best-effort diagnostics; deferred or interrupted runs may have no file.
      - name: Retain macOS Lua timing diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lua-timings-macos-unit-${{ fromJSON(steps.stage-selection.outputs.cell).role }}-${{ fromJSON(steps.stage-selection.outputs.cell).scenario }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-lua.json
          if-no-files-found: warn
          retention-days: 7

      - name: Retain source-bound test-hs qualification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assets-qualification-test-hs-${{ fromJSON(steps.stage-selection.outputs.cell).architecture || 'stubbed' }}-${{ fromJSON(steps.stage-selection.outputs.cell).scenario }}
          path: ${{ runner.temp }}/stable-macos-*.json
          if-no-files-found: warn

      - name: Resolve exact E2E stage roles
        id: stage-plan
        run: node tools/ci/macos-stage-roles.cjs plan e2e
      - name: Record actual stage role outcome
        if: always()
        env:
          MACOS_STAGE_CELL: ${{ steps.stage-selection.outputs.cell }}
          MACOS_STAGE_RESULT: ${{ job.status }}
        run: node tools/ci/macos-stage-roles.cjs record unit - "$RUNNER_TEMP/macos-stage-output/receipt.json"
      - name: Retain exact stage role outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-stage-unit-${{ fromJSON(steps.stage-selection.outputs.cell).role }}-${{ fromJSON(steps.stage-selection.outputs.cell).runner }}-${{ fromJSON(steps.stage-selection.outputs.cell).scenario || 'default' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-stage-output/receipt.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  e2e-hs:
    name: E2E tests
    permissions:
      contents: read
      actions: read
    needs:
      - test-hs
    runs-on: ${{ fromJSON(needs.test-hs.outputs.e2e_metadata)[matrix.lot].runner }}
    timeout-minutes: ${{ fromJSON(needs.test-hs.outputs.e2e_metadata)[matrix.lot].timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-hs.outputs.e2e_matrix) }}
    env:
      MACOS_STAGE_LOT: ${{ matrix.lot }}
      MACOS_STAGE_METADATA: ${{ needs.test-hs.outputs.e2e_metadata }}
      MACOS_STAGE_CELL: ${{ toJSON(fromJSON(needs.test-hs.outputs.e2e_metadata)[matrix.lot]) }}
      MACOS_STAGE_ROLE: ${{ fromJSON(needs.test-hs.outputs.e2e_metadata)[matrix.lot].role }}
      MACOS_STAGE_RUNNER: ${{ fromJSON(needs.test-hs.outputs.e2e_metadata)[matrix.lot].runner }}
      MACOS_STAGE_ARCHITECTURE: ${{ fromJSON(needs.test-hs.outputs.e2e_metadata)[matrix.lot].architecture }}
      MACOS_STAGE_SCENARIO: ${{ fromJSON(needs.test-hs.outputs.e2e_metadata)[matrix.lot].scenario }}
    steps:
      - uses: actions/checkout@v4
      - name: Download exact prior stage receipts
        uses: actions/download-artifact@v4
        with:
          pattern: macos-stage-unit-*-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-stage-inputs
      - name: Admit complete successful predecessor stage
        id: stage-admission
        env:
          MACOS_STAGE_NEEDS: ${{ toJSON(needs) }}
        run: node tools/ci/macos-stage-roles.cjs admit e2e "$RUNNER_TEMP/macos-stage-inputs" "$RUNNER_TEMP/macos-stage-prior.json"
      # Retained original role: e2e-hs
      - uses: actions/checkout@v4
        if: ${{ steps.stage-admission.outcome == 'success' && env.MACOS_STAGE_ROLE == 'e2e-hs' }}

      - name: Install the E2E interpreter
        if: ${{ steps.stage-admission.outcome == 'success' && env.MACOS_STAGE_ROLE == 'e2e-hs' }}
        run: |
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y lua5.4 lua-filesystem

      # Hammerspoon virtual-keyboard harness (stubbed, NOT real macOS/HS).
      # This step runs on ubuntu-latest against the same in-memory
      # tests/stubs/hs.lua fake that tests/unit uses — no real Hammerspoon
      # process, no WindowServer, no CGEventPost round-trip is ever exercised
      # here. It is a corpus-driven virtual-keyboard replay of the Registry +
      # Expander logic layer, not an OS-level end-to-end test. See
      # tests/e2e/PLAN_E2E_REAL_HS.md for what a real macOS/Hammerspoon E2E run
      # would require (a self-hosted GUI runner) and why it is not wired in
      # today. Named/commented explicitly so a green check here never implies
      # OS-level coverage it does not have (F-HIGH-30). Its fresh checkout
      # and interpreter are independent of the unit job; both must pass before
      # any installed-app launch.
      - name: Run virtual-keyboard harness (stubbed hs.* — no real Hammerspoon)
        if: ${{ steps.stage-admission.outcome == 'success' && env.MACOS_STAGE_ROLE == 'e2e-hs' }}
        # Exercises Registry + Expander via the stub layer against
        # hardcoded scenarios and all corpus vectors.
        # Exit 0 = all pass, 1 = at least one failure.
        working-directory: static/ergopti_plus/macos
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/stable-macos-stubbed-e2e.json"
          mkdir -p "$(dirname "$receipt")"
          node ../../../tools/ci/dev-release-qualification.cjs --scope macos-stubbed-e2e --receipt "$receipt"
          mode="$(node ../../../tools/ci/dev-release-qualification.cjs --scope macos-stubbed-e2e --validate-scope-receipt "$receipt")"
          if [ "$mode" = deferred ]; then
              echo "[DEFERRED] macos-stubbed-e2e: qualified=false; original command not executed."
          elif [ "$mode" = full ]; then
              lua5.4 tests/e2e/run_e2e.lua
          else
              echo "Invalid command qualification disposition" >&2
              exit 1
          fi
        timeout-minutes: 5

      - name: Retain source-bound e2e-hs qualification receipts
        if: ${{ steps.stage-admission.outcome == 'success' && env.MACOS_STAGE_ROLE == 'e2e-hs' && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: assets-qualification-e2e-hs-${{ env.MACOS_STAGE_ARCHITECTURE || 'stubbed' }}
          path: ${{ runner.temp }}/stable-macos-*.json
          if-no-files-found: warn

      # Retained original role: tooltip-canvas
      - uses: actions/checkout@v4
        if: ${{ steps.stage-admission.outcome == 'success' && env.MACOS_STAGE_ROLE == 'tooltip-canvas' }}
      - uses: actions/setup-node@v4
        if: ${{ steps.stage-admission.outcome == 'success' && env.MACOS_STAGE_ROLE == 'tooltip-canvas' }}
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-python@v5
        if: ${{ steps.stage-admission.outcome == 'success' && env.MACOS_STAGE_ROLE == 'tooltip-canvas' }}
        with:
          python-version: '3.13'
      - name: Prepare independent pixel observer
        if: ${{ steps.stage-admission.outcome == 'success' && env.MACOS_STAGE_ROLE == 'tooltip-canvas' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tooltip-provisioning"
          python3 -m pip install Pillow==11.3.0
          node tools/test/run-macos-tooltip-canvas-tests.cjs
      - name: Acquire the pinned official Hammerspoon runtime
        if: ${{ steps.stage-admission.outcome == 'success' && env.MACOS_STAGE_ROLE == 'tooltip-canvas' }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^HAMMERSPOON_VERSION="\$\{HAMMERSPOON_VERSION:-([^}]+)\}"$/\1/p' tools/build/build_macos_app.sh)
          test "$version" = 1.1.1
          url="https://github.com/Hammerspoon/hammerspoon/releases/download/$version/Hammerspoon-$version.zip"
          archive="$RUNNER_TEMP/tooltip-provisioning/Hammerspoon-$version.zip"
          printf '%s\n' "$url" > "$RUNNER_TEMP/tooltip-provisioning/origin-url.txt"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 2 --max-time 120 -o "$archive" "$url"
          # Existing qualified pin from hs274-native.yml/macos-release-launch.yml.
          printf '%s  %s\n' 11bb1c90faf5427f37c7bd4fe7eab9774ae43e1d5cb020c5b3088dac32849efa "$archive" | shasum -a 256 --check
          shasum -a 256 "$archive" > "$RUNNER_TEMP/tooltip-provisioning/archive.sha256"
          ditto -x -k "$archive" "$RUNNER_TEMP/tooltip-hammerspoon"
          app="$RUNNER_TEMP/tooltip-hammerspoon/Hammerspoon.app"
          codesign --verify --strict --deep "$app" > "$RUNNER_TEMP/tooltip-provisioning/codesign-verify.stdout" 2> "$RUNNER_TEMP/tooltip-provisioning/codesign-verify.stderr"
          codesign --display --verbose=4 "$app" > "$RUNNER_TEMP/tooltip-provisioning/codesign-signer.stdout" 2> "$RUNNER_TEMP/tooltip-provisioning/codesign-signer.stderr"
          # Actual Gatekeeper policy refusal fails. This records its assessment,
          # while the independently pinned official archive binds selected bytes.
          spctl --assess --type execute --verbose=4 "$app" > "$RUNNER_TEMP/tooltip-provisioning/gatekeeper.stdout" 2> "$RUNNER_TEMP/tooltip-provisioning/gatekeeper.stderr"
      - name: Observe actual production canvas pixels and retire its native owner
        if: ${{ steps.stage-admission.outcome == 'success' && env.MACOS_STAGE_ROLE == 'tooltip-canvas' }}
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/tooltip-provisioning/tested-sha.txt"
          python3 tools/diagnostics/macos_tooltip_canvas.py \
            --repo "$PWD" \
            --app "$RUNNER_TEMP/tooltip-hammerspoon/Hammerspoon.app" \
            --output "$RUNNER_TEMP/tooltip-canvas-evidence"
      - name: Retain native captures, source, provisioning and retirement receipts
        if: ${{ steps.stage-admission.outcome == 'success' && env.MACOS_STAGE_ROLE == 'tooltip-canvas' && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-tooltip-canvas-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/tooltip-provisioning
            ${{ runner.temp }}/tooltip-canvas-evidence

      # ─────────────────────────────────────────────────
      # 3) Swift launcher tests, then the app built once
      # ─────────────────────────────────────────────────
      # Unit suites never start the packaged app, and a pristine runner hides every
      # failure that depends on what a user already has on disk (a symlinked config
      # folder, a legacy paths.toml, logs left by a source run). Build the complete
      # package once and launch it over those states on every push/PR. On a release
      # run this is also the release build: launch judges the very archive that
      # Release attaches. Signing writes a separate .sig and never changes the zip.
      #
      # The native launcher is compiled and its process-level XCTest run first, on
      # this same runner, so the lane needs one macOS runner before the launch
      # legs instead of two. They build in their own scratch path, the only
      # SwiftPM tree the cache restores: the app build below still resolves and
      # compiles its launcher in a clean .build, as it did on a runner of its own,
      # never in a tree restored from an earlier run.
      #
      # On Intel the role runs as two cells. Its XCTest cohorts took about nine
      # minutes ahead of the model receiving, which waits for the parallel clean
      # build anyway, so they run beside it: the "xctest" cell skips every step
      # marked != 'xctest' and the "runtime" cell every step marked
      # != 'runtime'. The Apple-silicon cell has no scenario and runs both.
      # Steps that run in both Intel cells name their uploads by scenario.
      # Retained original role: managed-ollama-native
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        env:
          GOTOOLCHAIN: 'local'
          ERGOPTI_RELEASE: "${{ inputs.release && 'true' || 'false' }}"
          ERGOPTI_RELEASE_TAG: '${{ inputs.tag }}'
          ERGOPTI_RELEASE_VERSION: '${{ inputs.version }}'
          ERGOPTI_RELEASE_CHANNEL: '${{ inputs.channel }}'
          ERGOPTI_OLLAMA_EXPECTED_ARCHITECTURE: '${{ env.MACOS_STAGE_ARCHITECTURE }}'
        if: ${{ steps.stage-admission.outcome == 'success' && env.MACOS_STAGE_ROLE == 'managed-ollama-native' }}
      - uses: actions/setup-node@v4
        env:
          GOTOOLCHAIN: 'local'
          ERGOPTI_RELEASE: "${{ inputs.release && 'true' || 'false' }}"
          ERGOPTI_RELEASE_TAG: '${{ inputs.tag }}'
          ERGOPTI_RELEASE_VERSION: '${{ inputs.version }}'
          ERGOPTI_RELEASE_CHANNEL: '${{ inputs.channel }}'
          ERGOPTI_OLLAMA_EXPECTED_ARCHITECTURE: '${{ env.MACOS_STAGE_ARCHITECTURE }}'
        if: ${{ steps.stage-admission.outcome == 'success' && env.MACOS_STAGE_ROLE == 'managed-ollama-native' }}
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-python@v5
        env:
          GOTOOLCHAIN: 'local'
          ERGOPTI_RELEASE: "${{ inputs.release && 'true' || 'false' }}"
          ERGOPTI_RELEASE_TAG: '${{ inputs.tag }}'
          ERGOPTI_RELEASE_VERSION: '${{ inputs.version }}'
          ERGOPTI_RELEASE_CHANNEL: '${{ inputs.channel }}'
          ERGOPTI_OLLAMA_EXPECTED_ARCHITECTURE: '${{ env.MACOS_STAGE_ARCHITECTURE }}'
        if: ${{ steps.stage-admission.outcome == 'success' && env.MACOS_STAGE_ROLE == 'managed-ollama-native' }}
        with:
          python-version: '3.13'
      # This independent Darwin job executes the frozen portable corpus through
      # the original native guardian even when another archive/PAC step fails.
      - name: Receive selected-release shell corpus and native guardian cancellation
        env:
          GOTOOLCHAIN: 'local'
          ERGOPTI_RELEASE: "${{ inputs.release && 'true' || 'false' }}"
          ERGOPTI_RELEASE_TAG: '${{ inputs.tag }}'
          ERGOPTI_RELEASE_VERSION: '${{ inputs.version }}'
          ERGOPTI_RELEASE_CHANNEL: '${{ inputs.channel }}'
          ERGOPTI_OLLAMA_EXPECTED_ARCHITECTURE: '${{ env.MACOS_STAGE_ARCHITECTURE }}'
        if: ${{ steps.stage-admission.outcome == 'success' && env.MACOS_STAGE_ROLE == 'managed-ollama-native' && (env.MACOS_STAGE_SCENARIO != 'xctest') }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/diagnostics/macos_release_stage_native_receiving.cjs \
            --output "$RUNNER_TEMP/native-selected-release-$ERGOPTI_OLLAMA_EXPECTED_ARCHITECTURE"

      - name: Retain selected-release native ownership receiving
        env:
          GOTOOLCHAIN: 'local'
          ERGOPTI_RELEASE: "${{ inputs.release && 'true' || 'false' }}"
          ERGOPTI_RELEASE_TAG: '${{ inputs.tag }}'
          ERGOPTI_RELEASE_VERSION: '${{ inputs.version }}'
          ERGOPTI_RELEASE_CHANNEL: '${{ inputs.channel }}'
          ERGOPTI_OLLAMA_EXPECTED_ARCHITECTURE: '${{ env.MACOS_STAGE_ARCHITECTURE }}'
        if: ${{ steps.stage-admission.outcome == 'success' && env.MACOS_STAGE_ROLE == 'managed-ollama-native' && (always() && env.MACOS_STAGE_SCENARIO != 'xctest') }}
        uses: actions/upload-artifact@v4
        with:
          name: selected-release-native-ownership-${{ env.MACOS_STAGE_ARCHITECTURE }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/native-selected-release-${{ env.MACOS_STAGE_ARCHITECTURE }}

      - name: Admit the canonical native toolchain and public inputs
        env:
          GOTOOLCHAIN: 'local'
          ERGOPTI_RELEASE: "${{ inputs.release && 'true' || 'false' }}"
          ERGOPTI_RELEASE_TAG: '${{ inputs.tag }}'
          ERGOPTI_RELEASE_VERSION: '${{ inputs.version }}'
          ERGOPTI_RELEASE_CHANNEL: '${{ inputs.channel }}'
          ERGOPTI_OLLAMA_EXPECTED_ARCHITECTURE: '${{ env.MACOS_STAGE_ARCHITECTURE }}'
        if: ${{ steps.stage-admission.outcome == 'success' && env.MACOS_STAGE_ROLE == 'managed-ollama-native' }}
        id: ollama-toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import platform
          import re
          import tempfile
          from pathlib import Path
          contract = json.loads(Path('static/ergopti_plus/_shared/modules/llm/managed_ollama_runtime.json').read_text())
          official = json.loads(Path('static/ergopti_plus/_shared/modules/llm/ollama_release.json').read_text())
          architecture = {'arm64': 'arm64', 'x86_64': 'amd64'}[platform.machine()]
          assert platform.system() == 'Darwin'
          assert architecture == os.environ['ERGOPTI_OLLAMA_EXPECTED_ARCHITECTURE']
          assert official['version'] == contract['version']
          assert set(contract['assets']) == {'macos-arm64', 'macos-amd64'}
          identity = official['assets'][contract['official_asset_key']]
          version = contract['go_version']
          assert re.fullmatch(r'go[0-9]+\.[0-9]+\.[0-9]+', version)
          root = Path(tempfile.mkdtemp(prefix='managed-ollama-native-', dir=os.environ['RUNNER_TEMP']))
          values = {
              'ERGOPTI_OLLAMA_BUILD_ROOT': str(root),
              'ERGOPTI_OLLAMA_SOURCE': str(root / 'source'),
              'ERGOPTI_OLLAMA_SOURCE_COMMIT': contract['source_commit'],
              'ERGOPTI_OLLAMA_OFFICIAL_ARCHIVE': str(root / identity['filename']),
              'ERGOPTI_OLLAMA_OFFICIAL_URL': 'https://github.com/ollama/ollama/releases/download/v' + official['version'] + '/' + identity['filename'],
              'ERGOPTI_OLLAMA_ASSET': str(root / 'assets' / contract['assets']['macos-' + architecture]['filename']),
              'ERGOPTI_OLLAMA_CATALOGUE': str(root / 'staged/_shared/modules/llm/managed_ollama_release.json'),
          }
          with (root / 'public-inputs.json').open('x', encoding='utf-8') as stream:
              json.dump({'contract': contract, 'official_identity': identity, 'architecture': architecture, 'tested_sha': os.environ['GITHUB_SHA'], 'inputs': values}, stream, sort_keys=True)
              stream.write('\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('version=' + version[2:] + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              for key, value in values.items():
                  assert '\n' not in value and '\r' not in value
                  stream.write(key + '=' + value + '\n')
          PY
      - name: Build the actual launcher native transport roles
        env:
          GOTOOLCHAIN: 'local'
          ERGOPTI_RELEASE: "${{ inputs.release && 'true' || 'false' }}"
          ERGOPTI_RELEASE_TAG: '${{ inputs.tag }}'
          ERGOPTI_RELEASE_VERSION: '${{ inputs.version }}'
          ERGOPTI_RELEASE_CHANNEL: '${{ inputs.channel }}'
