          mkdir -p "$(dirname "$receipt")"
          node tools/ci/dev-release-qualification.cjs --scope macos-native-http --receipt "$receipt"
          mode="$(node tools/ci/dev-release-qualification.cjs --scope macos-native-http --validate-scope-receipt "$receipt")"
          profile="$(node tools/ci/dev-release-qualification.cjs --scope macos-native-http --validate-scope-receipt-profile "$receipt")"
          if [ "$mode" = deferred ] && [ "$profile" = stable-v1-20261009-macos-native-deferred ]; then
              echo "[DEFERRED] macos-native-http: legacy cohort not executed; qualified=false."
              exit 0
          fi
          status=0
          if [ "$mode" = deferred ]; then
              test "$profile" = stable-v1-0-2-20261017-six-macos-native-scopes || test "$profile" = stable-v1-0-3-20261018-macos-native-scopes
              "$ERGOPTI_NATIVE_HTTP_PYTHON" tools/diagnostics/macos_owned_process_native_test.py || status=1
