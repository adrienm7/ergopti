[sg_actions.llm_tone_more_formal]
# Rewrites the SELECTION one register more formal on the tone ladder
# (_shared/lua/llm/tone.lua: familiar, neutral, formal, very formal) and
# replaces it at once, keeping the rewrite selected so the next step applies
# to it. Each step rewrites the original text, so going back and forth never
# drifts. It stops at the most formal register; the _cycle variants wrap
# around to the opposite end. Nothing selected: nothing happens. It refuses
# like llm_generate_prediction (paused, AI off, backend not ready).
