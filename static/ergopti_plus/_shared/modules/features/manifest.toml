# _shared/modules/features/manifest.toml
# Single source of truth for every Ergopti+ feature toggle and its default value.
#
# Consumers:
#   1. The first-boot config generator: each driver renders the appropriate
#      subset of this manifest into ``config/ergopti_plus/<driver>/config.toml``.
#   2. The tray-menu renderer: each driver walks this manifest to build the
#      hierarchical menu tree (labels via ``description_key`` resolved against
#      ``static/locales/<locale>.json``).
#   3. The Svelte docs site (future): can generate a feature-matrix table from
#      this manifest at build time.
#
# Format:
#
#   [sections.<path>]           Section metadata (description, platforms, order).
#       description_key         Required. i18n key for the menu label.
#       platforms               Optional. ["ahk","hs"] by default. Filters which
#                               drivers see the section.
#       subsections             Optional. Ordered list of child section names;
#                               drives the menu render order.
#
#   [[features.<path>]]         Feature entry inside section <path>. Order
#                               within the array is preserved in the menu AND
#                               in the generated config.toml.
#       id                      Required. Last segment of the feature key.
#       default                 Required (unless default_per_platform is set).
#                               Primitive (bool/number/string/array) OR table
#                               (e.g. { enabled = true, ... }).
#                               - Primitive default → emit ``id = value`` inside
#                                 the parent section [<path>].
#                               - Table default     → emit a sub-section
#                                 [<path>.<id>] containing each key=value.
#       default_per_platform    Optional. Inline table like { ahk = X, hs = Y }.
#                               Overrides ``default`` for the current platform.
#                               Use only when defaults legitimately differ
#                               between drivers (e.g. LLM model choice).
#       type                    Optional. Hints for UI rendering: "boolean",
#                               "enum", "string", "number", "action", "feature".
#       enum_values             Required if type = "enum".
#       description_key         Required. i18n key for the menu label.
#       platforms               Optional. Defaults to the parent section's
#                               ``platforms`` value if absent.
#
# Examples:
#   [[features.script]]
#   id = "locale"
#   default = "fr"
#   type = "string"
#   description_key = "menu.script.locale"
#   → generates: ``[script] locale = "fr"`` in config.toml
#
#   [[features.hotstrings.autocorrection]]
#   id = "accents"
#   default = { enabled = true, time_activation_seconds = 0.5 }
#   type = "feature"
#   description_key = "menu.hotstrings.autocorrection.accents"
#   → generates: ``[hotstrings.autocorrection.accents] enabled = true; time_activation_seconds = 0.5``



# ================================
# ================================
# ======= 1. Manifest meta =======
# ================================
# ================================

[manifest]
version = "2.0.0"
config_schema = "https://ergopti.com/schema/config.schema.json"



# ===========================
# ===========================
# ======= 2. Sections =======
# ===========================
# ===========================

[sections]
order = ["script", "hotstrings", "llm", "metrics", "shortcuts", "gestures", "layout", "category_enabled"]



# ======================
# ===== 2.1 script =====
# ======================

[sections.script]
description_key = "menu.script"
platforms = ["ahk", "hs"]



