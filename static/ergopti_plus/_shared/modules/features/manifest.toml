# own scope owner in the [scopes.global] order, all or nothing, after one
# confirmation. AI and metrics consent are never granted by it.
[[menu.configuration_menu]]
type = "command"
id = "restore_recommended"
i18n = "common.restore_recommended"

# Lists the config.toml keys the driver does not use and offers to remove them
# after a backup. Each driver applies its own reader's rule: Windows the boot
# loader's unknown-key check against the manifest, macOS and Linux the keys
# their config readers never consume (the shared config_unused_keys engine).
[[menu.configuration_menu]]
type = "command"
id = "clean_unused_keys"
i18n = "menu.global.clean_unused_keys"

