# .github/workflows/ci-macos.yml
#
# macOS lane: unit tests -> E2E tests -> package -> install and launch -> verdict.
# Lua unit and stubbed engine E2E tests run on Ubuntu. The Swift launcher tests
# share the macOS packaging host. The launch matrix installs the exact uploaded
# archive over the canonical user-state profile on Apple silicon and, for a
# release, Intel. The verdict checks every expected runner/scenario and commit.
# Parent ci.yml owns concurrency; this workflow must not cancel its caller.

name: macOS

on:
  workflow_call:
    inputs:
      release:
        description: True when ci.yml's plan resolved a free release tag
        required: true
        type: boolean
      version:
        description: Release version without the leading v; empty unless release, so the build stamps 0.0.0-dev
        required: true
        type: string
      channel:
        description: Sparkle update channel stamped into the app and the appcast, main or dev
        required: true
        type: string
    secrets:
      SPARKLE_PUBLIC_KEY:
        description: Sparkle EdDSA public key embedded as SUPublicEDKey; absent for fork pull requests
        required: false
      SPARKLE_ED_PRIVATE_KEY:
        description: Sparkle EdDSA private key that signs the declared release archives; passed on release runs only
        required: false
      MACOS_SIGNING_CERTIFICATE_BASE64:
        description: Self-signed code-signing .p12, base64; passed on release runs only
        required: false
      MACOS_SIGNING_CERTIFICATE_PASSWORD:
        description: Password of the code-signing .p12; passed on release runs only
        required: false

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────
  # 1) Hammerspoon unit and contract tests
  # ─────────────────────────────────────────────────
  # The lane's entry job. Its name says "stubbed" because it is the check a
  # reviewer reads: this Ubuntu entry uses the Hammerspoon stub. The packaged
  # clean launch additionally qualifies the real native delayed-timer API.
  test-hs:
    name: 'Unit tests (stubbed)'
    runs-on: ubuntu-latest

    steps:
      # Enough history for test_no_coauthor_in_commits.lua, which scans
      # HEAD~20..HEAD. The default checkout is a depth-1 clone, so that range does
      # not exist and the test fails — correctly, and saying so: it refuses to
      # report a clean history it could not read. Giving it the commits is the fix;
      # letting it pass on an empty range would make the whole check ornamental.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 25

      - name: Install Lua 5.4 + luarocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev luarocks

      - name: Install luacheck + luafilesystem
        # lfs is required by tests/run.lua for recursive test discovery;
        # --lua-version 5.4 ensures luarocks links the correct runtime.
        run: |
          sudo luarocks --lua-version 5.4 install luacheck
          sudo luarocks --lua-version 5.4 install luafilesystem

      - name: Run luacheck (non-blocking)
        # Surface warnings without failing — pre-existing style issues
        # must not block the test step.
        run: |
          luacheck static/ergopti_plus/macos/tests static/ergopti_plus/macos/infra \
            static/ergopti_plus/macos/modules || true

      - name: Run unit + meta tests
        working-directory: static/ergopti_plus/macos
        # The focused-runner regression tests spawn child interpreters; pin
        # the same binary as this job so runner-image defaults (which may
        # resolve bare `lua` to an interpreter without package.searchpath)
        # cannot change semantics under us.
        env:
          LUA: lua5.4
        run: node ../../../tools/test/report.cjs --name macos-lua --json "${{ runner.temp }}/macos-lua.json" -- lua5.4 tests/run.lua

  e2e-hs:
    name: 'E2E tests (stubbed)'
    needs: test-hs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the E2E interpreter
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 lua-filesystem

      # Hammerspoon virtual-keyboard harness (stubbed, NOT real macOS/HS).
      # This step runs on ubuntu-latest against the same in-memory
      # tests/stubs/hs.lua fake that tests/unit uses — no real Hammerspoon
      # process, no WindowServer, no CGEventPost round-trip is ever exercised
      # here. It is a corpus-driven virtual-keyboard replay of the Registry +
      # Expander logic layer, not an OS-level end-to-end test. See
      # tests/e2e/PLAN_E2E_REAL_HS.md for what a real macOS/Hammerspoon E2E run
      # would require (a self-hosted GUI runner) and why it is not wired in
      # today. Named/commented explicitly so a green check here never implies
      # OS-level coverage it does not have (F-HIGH-30). It runs only after the
      # unit step passed, as the former separate job did.
      - name: Run virtual-keyboard harness (stubbed hs.* — no real Hammerspoon)
        # Exercises Registry + Expander via the stub layer against
        # hardcoded scenarios and all corpus vectors.
        # Exit 0 = all pass, 1 = at least one failure.
        working-directory: static/ergopti_plus/macos
        run: lua5.4 tests/e2e/run_e2e.lua
        timeout-minutes: 5

  # ─────────────────────────────────────────────────
  # 3) Swift launcher tests, then the app built once
  # ─────────────────────────────────────────────────
  # Unit suites never start the packaged app, and a pristine runner hides every
  # failure that depends on what a user already has on disk (a symlinked config
  # folder, a legacy paths.toml, logs left by a source run). Build the complete
  # package once and launch it over those states on every push/PR. On a release
  # run this is also the release build: launch judges the very archive that
  # Release attaches. Signing writes a separate .sig and never changes the zip.
  #
  # The native launcher is compiled and its process-level XCTest run first, on
  # this same runner, so the lane needs one macOS runner before the launch
  # legs instead of two. They build in their own scratch path, the only
  # SwiftPM tree the cache restores: the app build below still resolves and
  # compiles its launcher in a clean .build, as it did on a runner of its own,
  # never in a tree restored from an earlier run.
  package-macos:
    name: 'Package'
    needs: e2e-hs
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      scenarios: ${{ steps.profile.outputs.scenarios }}

    steps:
      # A depth-1 clone: the build reads tracked files and HEAD, never history.
      - uses: actions/checkout@v4

      - name: Prepare Node for native policy fixtures and XCTest evidence
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Run reporter lifecycle self-tests
        run: node tools/test/test-report.cjs

      - name: Run owned program XCTest notice constructed-policy controls
        run: node tools/test/test-owned-program-xctest-notice.cjs

      # CPython intentionally omitted Darwin os.waitid until Python 3.13.
      - name: Prepare Python for native nonreaping waits
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Admit native nonreaping Python prerequisites
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          names = ("waitid", "P_PID", "WEXITED", "WNOHANG", "WNOWAIT", "CLD_EXITED", "CLD_KILLED", "CLD_DUMPED")
          if sys.platform != "darwin" or sys.version_info < (3, 13):
              raise RuntimeError("Native nonreaping fixtures require macOS CPython >= 3.13")
          missing = [name for name in names if not hasattr(os, name)]
          if missing:
              raise RuntimeError("Missing native nonreaping APIs: " + ", ".join(missing))
          print(json.dumps({"python": sys.executable, "version": list(sys.version_info[:3]), "nonreaping_apis": list(names)}, sort_keys=True))
          PY

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/swift-launcher-ci/artifacts
            ${{ runner.temp }}/swift-launcher-ci/checkouts
            ${{ runner.temp }}/swift-launcher-ci/repositories
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('static/ergopti_plus/macos/launcher/Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Report Swift toolchain
        run: swift --version

      - name: Lint remap guardian LaunchAgent
        run: plutil -lint static/ergopti_plus/macos/launcher/com.ergoptiplus.remap-guardian.plist

      - name: Build release launcher
        run: swift build -c release --product ErgoptiPlus --package-path static/ergopti_plus/macos/launcher --scratch-path "$RUNNER_TEMP/swift-launcher-ci"
        timeout-minutes: 10

      # The native archive fixture uses disposable file keys on every run.
      - name: Install Sparkle signing tool
        shell: bash
        env:
          SPARKLE_VERSION: '2.9.2'
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/Sparkle.tar.xz \
              "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p /tmp/sparkle-dist
          tar -xJf /tmp/Sparkle.tar.xz -C /tmp/sparkle-dist
          echo "SIGN_UPDATE=/tmp/sparkle-dist/bin/sign_update" >> "$GITHUB_ENV"

      # Keep XCTest serial: the lease tests install process-wide signal handlers
      # and fork/reap real children, so parallel workers would race each other.
      - name: Run Swift launcher tests
        id: swift-launcher-tests
        env:
          SWIFT_BACKTRACE: enable=yes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/swift-launcher-evidence"
          xctest_log="$(mktemp "$RUNNER_TEMP/swift-launcher-evidence/xctest.log.XXXXXX")"
          export ERGOPTI_ARCHIVE_EVIDENCE_DIR="$(mktemp -d "$RUNNER_TEMP/swift-launcher-evidence/archive-session.XXXXXX")"
          echo "archive_session_dir=$ERGOPTI_ARCHIVE_EVIDENCE_DIR" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["ERGOPTI_ARCHIVE_EVIDENCE_DIR"])
          owner = root / "workflow"
          owner.mkdir(mode=0o700)
          temporary = owner / ".workflow-stage"
          descriptor = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(descriptor, "w", encoding="utf-8") as stream:
              json.dump({"schema": 1, "owner": "workflow", "phase": "candidate.begin", "scope": "swift-not-started", "ownership_closed": False, "status": "pending", "elapsed_seconds": 0, "history_omitted": 0}, stream, sort_keys=True)
              stream.flush()
              os.fsync(stream.fileno())
          os.link(temporary, owner / "checkpoint.json", follow_symlinks=False)
          temporary.unlink()
          PY
          export ERGOPTI_TIS_EVIDENCE_DIR="$(mktemp -d "$RUNNER_TEMP/swift-launcher-evidence/tis-session.XXXXXX")"
          echo "tis_session_dir=$ERGOPTI_TIS_EVIDENCE_DIR" >> "$GITHUB_OUTPUT"
          export ERGOPTI_TIS_EVIDENCE_SESSION="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          set +e
          script -q /dev/null swift test --package-path static/ergopti_plus/macos/launcher --scratch-path "$RUNNER_TEMP/swift-launcher-ci" 2>&1 | tee "$xctest_log"
          swift_pipeline_status=("${PIPESTATUS[@]}")
          node tools/diagnostics/swift_xctest_evidence.cjs "$xctest_log" "${swift_pipeline_status[0]}" "${swift_pipeline_status[1]}" "$RUNNER_TEMP/swift-launcher-evidence/verdict.json"
          xctest_evidence_status=$?
          node tools/diagnostics/owned_program_xctest_notice.cjs "$RUNNER_TEMP/swift-launcher-evidence/verdict.json" "$xctest_log" "$(git rev-parse HEAD)"
          owned_program_evidence_status=$?
          node tools/diagnostics/tis_evidence_transport.cjs "$ERGOPTI_TIS_EVIDENCE_DIR" "$ERGOPTI_TIS_EVIDENCE_SESSION"
          tis_evidence_status=$?
          set -e
          if [ "$xctest_evidence_status" -ne 0 ]; then exit "$xctest_evidence_status"; fi
          if [ "$tis_evidence_status" -ne 0 ]; then exit "$tis_evidence_status"; fi
          if [ "$owned_program_evidence_status" -ne 0 ]; then exit "$owned_program_evidence_status"; fi
          if ! grep -Fq "Test Suite 'All tests' passed" "$xctest_log"; then
              echo "::error::the XCTest process ended without its successful suite summary"
              exit 1
          fi
        timeout-minutes: 10

      - name: Upload Swift launcher failure transcript
        if: ${{ failure() && steps.swift-launcher-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: swift-launcher-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swift-launcher-evidence
          if-no-files-found: error

      # Export only constructed bounded JSON from this step's owned archive session.
      # Its availability is independent of TIS setup and native ownership closure.
      - name: Retain archive diagnostic session
        if: ${{ always() && steps.swift-launcher-tests.outputs.archive_session_dir != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: swift-archive-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.swift-launcher-tests.outputs.archive_session_dir }}/*/*.json
            ${{ steps.swift-launcher-tests.outputs.archive_session_dir }}/*/helper/*.json
          if-no-files-found: error

      # Preserve only the fresh session acquired by this exact Swift step.
      - name: Retain closed TIS diagnostic session
        if: ${{ always() && steps.swift-launcher-tests.outcome != 'skipped' && steps.swift-launcher-tests.outputs.tis_session_dir != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: swift-tis-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.swift-launcher-tests.outputs.tis_session_dir }}/start.json
            ${{ steps.swift-launcher-tests.outputs.tis_session_dir }}/manifest.json
            ${{ steps.swift-launcher-tests.outputs.tis_session_dir }}/record-*.dat
            ${{ steps.swift-launcher-tests.outputs.tis_session_dir }}/refusal.json
          if-no-files-found: error

      # Native inventory remains observable even when the separate XCTest suite fails.
      - name: Run signed Hammerspoon program provider inventory
        if: ${{ always() }}
        run: |
          python3 -m unittest discover -s tools/diagnostics/native_hs_program_providers -p test_receipt.py -v
          python3 tools/diagnostics/native_hs_program_providers/run_native.py \
            --source-root "$GITHUB_WORKSPACE" \
            --source-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/native-hs-program-providers" \
            --download
        timeout-minutes: 5

      - name: Retain native Hammerspoon provider inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-hs-program-providers-${{ github.run_id }}-${{ github.run_attempt }}
          # Retain closed evidence only; fixture paths intentionally include newlines.
          path: |
            ${{ runner.temp }}/native-hs-program-providers/summary.json
            ${{ runner.temp }}/native-hs-program-providers/*/receipt.json
            ${{ runner.temp }}/native-hs-program-providers/*/physical-group.json
            ${{ runner.temp }}/native-hs-program-providers/*/diagnostic-facts.json
          if-no-files-found: error

      # Observe the native structured API without invoking or importing automations.
      - name: Observe native Apple Shortcuts discovery
        if: ${{ always() }}
        run: |
          python3 -m unittest discover -s tools/diagnostics/apple_shortcuts_probe -p test_probe.py -v
          python3 tools/diagnostics/apple_shortcuts_probe/run_probe.py \
            --source-root "$GITHUB_WORKSPACE" \
            --source-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/group3-apple-shortcuts-probe"
        timeout-minutes: 2

      - name: Retain native Apple Shortcuts observation
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-apple-shortcuts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/group3-apple-shortcuts-probe
          if-no-files-found: error

      # LauncherLogTests append to the real launcher log,
      # ~/Library/Logs/ergopti_plus/launcher.log, and the release smoke below
      # refuses to judge a launch over a launcher log it did not start fresh.
      # On a runner of its own that log never existed; here the tests leave it
      # behind, so it goes before the app is built.
      - name: Remove the launcher log the Swift tests wrote
        run: rm -rf -- "$HOME/Library/Logs/ergopti_plus"

      # Once per run instead of once per launch leg: the verdict and the
      # scenario profiles are plain Python, identical on every runner.
      - name: Self-test the launch verdict
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          brew install lua@5.4 luajit
          diagnostic_lua54="$(brew --prefix lua@5.4)/bin/lua"
          diagnostic_luajit="$(brew --prefix luajit)/bin/luajit"
          test -x "$diagnostic_lua54"
          test -x "$diagnostic_luajit"
          ERGOPTI_DIAGNOSTIC_LUA54="$diagnostic_lua54" ERGOPTI_DIAGNOSTIC_LUAJIT="$diagnostic_luajit" python3 tools/diagnostics/macos_launch_gate_test.py

      # The build no longer downloads Karabiner-Elements: onboarding fetches the
      # pinned DMG on a user's first run. Validating the pin here makes a bad
      # bump fail CI instead of that first install.
      - name: Validate the Karabiner-Elements pin onboarding downloads
        run: python3 -m unittest discover -s tools/build -p 'karabiner_manifest_test.py'

      # The only list of launch scenarios lives in macos_launch_gate.py; the
      # launch matrix below reads it from this output.
      - name: Resolve the launch-gate scenario profile
        id: profile
        env:
          PROFILE: ${{ inputs.release && 'release' || 'ci' }}
        run: python3 tools/diagnostics/macos_launch_gate.py --print-matrix "$PROFILE" >> "$GITHUB_OUTPUT"

      # The public EdDSA key must be embedded: without SUPublicEDKey, Sparkle
      # opens an updater error at launch, and the launcher then never observes
      # its child's logger readiness or exit, so every launch verdict is void.
      # Pull requests from forks receive no secrets. A package that is never
      # published or offered as an update gets a throwaway key of the right
      # shape, which keeps the launch gate meaningful for outside contributors
      # instead of failing them for a secret they cannot have. A release build
      # refuses that fallback first: a throwaway SUPublicEDKey matches no
      # private key, so Sparkle would reject every later update of the
      # installed copies.
      #
      # The code-signing certificate reaches this step on a release run only.
      # With it every build keeps one code identity, so the TCC and Login Items
      # grants survive an update; without it the build signs ad hoc and every
      # update costs users each permission. A release still builds without it
      # until the secrets exist, but says so with a warning on the run.
      - name: Build ErgoptiPlus.app
        shell: bash
        env:
          ERGOPTI_BUILD_COMMIT: ${{ github.sha }}
          ERGOPTI_VERSION: ${{ inputs.version }}
          ERGOPTI_BUILD: ${{ inputs.release && github.run_number || '' }}
          ERGOPTI_CHANNEL: ${{ inputs.channel }}
          ERGOPTI_RELEASE: ${{ inputs.release }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [ "$ERGOPTI_RELEASE" = true ] && [ -z "$MACOS_SIGNING_CERTIFICATE_BASE64" ]; then
              echo "::warning title=Ad hoc signature::This release is signed ad hoc: no MACOS_SIGNING_CERTIFICATE_BASE64 secret. macOS will not carry the Accessibility, Screen Recording, Automation and Login Items grants over to it. Create the secrets with tools/build/create_macos_signing_identity.sh."
          fi
          if [ -z "$SPARKLE_PUBLIC_KEY" ]; then
              if [ "$ERGOPTI_RELEASE" = true ]; then
                  echo "::error::a release build needs the SPARKLE_PUBLIC_KEY secret; a throwaway key would orphan every installed copy from later updates."
                  exit 1
              fi
              echo "::notice title=Sparkle key::No SPARKLE_PUBLIC_KEY secret (pull request from a fork). Using a throwaway key: this package only feeds the launch gate and is never published."
              SPARKLE_PUBLIC_KEY="$(head -c 32 /dev/urandom | base64)"
              export SPARKLE_PUBLIC_KEY
          fi
          bash tools/build/build_macos_app.sh

      - name: Record signed CI archive source
        shell: bash
        run: >
          node tools/build/macos-release-archives.cjs --ci-receipt
          "$PWD/build/macos/ErgoptiPlus.app" "$PWD/build/macos"

      # The only launch on macos-latest (macOS 26): every launch leg runs on
      # macos-15 or macos-15-intel.
      - name: Smoke test built ErgoptiPlus.app (crash-on-launch guard)
        # Test the extracted release archive through the same Launch Services
        # path as an installation. Early log creation is not startup readiness.
        if: inputs.release
        shell: bash
        timeout-minutes: 3
        run: |
          python3 tools/diagnostics/macos_release_launch_test.py
          test ! -e /Applications/ErgoptiPlus.app
          node tools/build/macos-release-archives.cjs --ci-install "$PWD/build/macos" /Applications \
              > "$RUNNER_TEMP/release-install.json"
          python3 tools/diagnostics/macos-release-launch.py /Applications/ErgoptiPlus.app "$RUNNER_TEMP/release-launch"

      - name: Retain packaged application startup evidence
        if: always() && inputs.release
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: macos-package-startup-${{ github.run_id }}
          path: ${{ runner.temp }}/release-launch
          if-no-files-found: warn

      # A release fails here rather than skipping the signature: without it no
      # appcast is written, and Release would otherwise have nothing to feed
      # Sparkle. This is the only step that sees the private key.
      - name: Sign declared archives with Sparkle EdDSA key
        if: inputs.release
        shell: bash
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
              echo "::error::a release build needs the SPARKLE_ED_PRIVATE_KEY secret: without a signature there is no appcast and no update for installed copies."
              exit 1
          fi
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > /tmp/sparkle_priv.key
          trap 'rm -f /tmp/sparkle_priv.key' EXIT
          node tools/build/macos-release-publication.cjs sign \
              build/macos "$SIGN_UPDATE" /tmp/sparkle_priv.key
          echo "Declared Sparkle archive signatures and exact publication receipt written."

      - name: Generate Sparkle appcast
        if: inputs.release
        shell: bash
        env:
          ERGOPTI_VERSION: ${{ inputs.version }}
          ERGOPTI_BUILD: ${{ github.run_number }}
          ERGOPTI_CHANNEL: ${{ inputs.channel }}
          ARCHIVE_DIR: build/macos
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          OUTPUT_PATH: build/macos/appcast-${{ inputs.channel }}.xml
        run: bash tools/build/generate_appcast.sh

      - name: Package latest keylayout bundle
        if: inputs.release
        shell: bash
        # Released as Ergopti_macOS.zip — keyboard layout only, no app.
        run: |
          set -euo pipefail
          latest=$(ls -d static/ergopti/macos/bundles/*.bundle | sort -V | tail -1)
          bundle_name=$(basename "$latest")
          (cd static/ergopti/macos/bundles && zip -r "../../../../build/macos/Ergopti_macOS.zip" "$bundle_name")
          echo "Packaged keylayout: $bundle_name → Ergopti_macOS.zip"

      - name: Upload the independent CI archive source
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ci-macos-archive-source
          retention-days: ${{ inputs.release && 7 || 1 }}
          if-no-files-found: error
          path: build/macos/ErgoptiPlus.app.ci-receipt.json

      # CI installs the first declared available format from the independently
      # signed source receipt. Public consumers validate their own archive/signature publication
      # receipt. Keep release artifacts for seven days so
      # a next-day retry can find the archive this job gated.
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: assets-macos
          retention-days: ${{ inputs.release && 7 || 1 }}
          if-no-files-found: error
          path: |
            build/macos/ErgoptiPlus.app.zip
            build/macos/ErgoptiPlus.app.tar.xz
            build/macos/Ergopti_macOS.zip
            build/macos/_*.sig
            build/macos/macos-publication.json
            build/macos/appcast-*.xml

  # ─────────────────────────────────────────────────
  # 4) Packaged application launch over real user states
  # ─────────────────────────────────────────────────
  # Launches the archive package-macos uploaded over one user state per leg.
  # See tools/diagnostics/macos_launch_gate.py for the scenarios, the two
  # profiles and each scenario verdict. The final aggregate checks completeness.
  launch:
    name: 'Install and launch · ${{ matrix.scenario }} · ${{ matrix.runner }}'
    needs: package-macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.release && '["macos-15","macos-15-intel"]' || '["macos-15"]') }}
        scenario: ${{ fromJSON(needs.package-macos.outputs.scenarios) }}
    env:
      # Older release whose shipped personal files seed upgraded states.
      SEED_TAG: v0.0.0-dev.24

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the older release whose files seed the user state
        run: git fetch --no-tags --depth=1 origin "+refs/tags/$SEED_TAG:refs/tags/$SEED_TAG"

      - name: Download the package built by this run
        uses: actions/download-artifact@v4
        with:
          name: assets-macos
          path: ${{ runner.temp }}/package

      - name: Download the independent CI archive source
        uses: actions/download-artifact@v4
        with:
          name: ci-macos-archive-source
          path: ${{ runner.temp }}/package

      # Reproduce a browser download: the archive and everything unpacked from
      # it carry com.apple.quarantine until the user runs the documented xattr
      # command from the release notes.
      - name: Install the package the way a user does
        run: |
          set -euo pipefail
          test ! -e /Applications/ErgoptiPlus.app
          stamp="0083;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)"
          node tools/build/macos-release-archives.cjs --ci-install "$RUNNER_TEMP/package" /Applications "$stamp" \
              > "$RUNNER_TEMP/package-install.json"
          node - "$RUNNER_TEMP/package-install.json" >> "$GITHUB_ENV" <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (typeof receipt.archive !== 'string' || /[\r\n]/.test(receipt.archive)) throw Error('Invalid installed archive path');
          process.stdout.write('MACOS_INSTALL_ARCHIVE=' + receipt.archive + '\n');
          NODE
          xattr -r -w com.apple.quarantine "$stamp" /Applications/ErgoptiPlus.app
          xattr -dr com.apple.quarantine /Applications/ErgoptiPlus.app
          if xattr -r /Applications/ErgoptiPlus.app | grep -q com.apple.quarantine; then
              echo "::error::the documented quarantine removal left an attribute behind"
              exit 1
          fi
          lipo -archs /Applications/ErgoptiPlus.app/Contents/MacOS/ErgoptiPlus
          echo "runner machine: $(uname -m)"

      - name: Launch over the user state and judge it
        run: >
          python3 tools/diagnostics/macos_launch_gate.py /Applications/ErgoptiPlus.app
          "$RUNNER_TEMP/launch-gate" "${{ matrix.scenario }}" --seed-tag "$SEED_TAG"

      - name: Record mandatory launch evidence
        env:
          MATRIX_RUNNER: ${{ matrix.runner }}
        run: >
          node tools/test/desktop-ci-evidence.cjs record-macos
          "$RUNNER_TEMP/launch-gate/result.json"
          "$MACOS_INSTALL_ARCHIVE"
          "$RUNNER_TEMP/launch-gate/evidence.json"

      - name: Retain launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-gate-${{ inputs.release && 'release' || 'ci' }}-${{ matrix.runner }}-${{ matrix.scenario }}
          overwrite: true
          path: ${{ runner.temp }}/launch-gate
          if-no-files-found: warn

  macos-ok:
    name: 'Verdict'
    needs: [test-hs, e2e-hs, package-macos, launch]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Download launch evidence
        uses: actions/download-artifact@v4
        with:
          pattern: launch-gate-${{ inputs.release && 'release' || 'ci' }}-*
          path: ${{ runner.temp }}/launch-evidence

      - name: Verify mandatory jobs and launch scenarios
        env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE: ${{ inputs.release }}
        run: node tools/test/desktop-ci-evidence.cjs verify macos "$RUNNER_TEMP/launch-evidence"
