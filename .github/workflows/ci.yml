# .github/workflows/ci.yml
#
# Unified CI pipeline — one run per push to main or dev, per pull request into
# them, and per manual dispatch.
#
# Architecture:
#
#   validate ──┐        ┌── macOS   (ci-macos.yml)   ──┐
#              ├──>─────┼── Windows (ci-windows.yml) ──┼──> release
#   plan ──────┘        └── Linux   (ci-linux.yml)   ──┘
#
#   validate   Every repository-wide gate: hotstring TOML format, fast-check
#              properties, Stryker on main, and the npm run test:js umbrella
#              (domain drift, parity, port compliance, translations, strict
#              convention lint, ...).
#   plan       Resolves the release metadata once, from git refs alone: whether
#              this run publishes, and its tag, version, title and update
#              channel. Only a push to main or dev of a commit that no tag of
#              its series contains yet, and whose next tag is still free,
#              publishes; every other run takes the CI profile.
#   macOS      One reusable workflow per OS, each drawn as one group box. A box
#   Windows    runs its tests and builds its package on every run. On a release
#   Linux      run it builds the release artifact once, gates those exact bytes,
#              and uploads them as assets-<os>. A box's own result is its
#              aggregate gate: it fails as soon as any of its jobs fails.
#   release    Publishes. It needs all three boxes to succeed, downloads every
#              assets-* artifact of the run, creates the tag and the release,
#              and pushes the Sparkle channel feed.
#
# Only with: and secrets: cross a call. The boxes read plan's outputs as inputs,
# and each signing secret is passed explicitly, never with `inherit`, and only
# on a release run.
#
# bench.yml — perf benchmark (main only, independent cadence)

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ========================================================
# ========================================================
# ======= 1/ Validation and release plan — t=0 ==========
# ========================================================
# ========================================================

jobs:
  # ─────────────────────────────────────────────────
  # 1.1) Repository-wide validation
  # ─────────────────────────────────────────────────
  # One job for what used to be four validate jobs: the domain pipeline and the
  # translation audit already run inside npm run test:js, as do the port
  # compliance, priority parity and strict convention lint steps. Each check
  # after the setup runs under !cancelled(): the checks used to be separate
  # jobs, and one failing check must still not hide the others. Any failure
  # still fails the job.
  validate:
    name: 'Validate'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - run: npm ci

      - name: Install native validation tools
        # test-shared-root-resolvers.cjs EXECUTES each driver's lib/paths.lua
        # rather than reading it — a resolver that returns nil is invisible to
        # static inspection, which is how the language menu came to offer 2
        # locales of 21. The gate fails rather than skips when no interpreter is
        # present, so this job needs one. The Sparkle appcast fixture is parsed
        # with xmllint so malformed release metadata cannot pass by string shape.
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 libxml2-utils

      - name: Check hotstring TOML files are sorted and formatted
        if: ${{ !cancelled() }}
        run: python tools/format_toml.py --hotstrings --all --check

      - name: Property-based tests (fast-check, 27 × 1000 runs)
        if: ${{ !cancelled() }}
        run: npm run test:properties

      - name: Mutation tests — domain layer (Stryker, break=25)
        # Guards the shared domain spec files (Registry, HotstringMatcher).
        # Stryker only mutates the JS domain specs, yet it's the most expensive
        # step and validate is a `needs` of every OS box — so it gated the
        # whole graph on every push. Run it on main only (TT-4); PRs/branches still
        # get every other validate check, including the full test:js umbrella.
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        run: npm run test:mutation

      - name: JS validation suite (umbrella — every run-js-suite check)
        # Gates the full run-js-suite (drift, parity, single-source ratchets,
        # bridge wiring, diagnostic-UI / focus / no-fallback §5.9 regressions, …).
        # Previously these ran only via the local `test:js` and never in CI (TT-3).
        if: ${{ !cancelled() }}
        run: npm run test:js

  # ─────────────────────────────────────────────────
  # 1.2) Release plan: tag, version, title and channel
  # ─────────────────────────────────────────────────
  # Runs at t=0, beside validate, because its inputs are git refs only: the
  # tag list, the commit subjects since the last stable tag and the remote
  # tags. Nothing here depends on a test result, so the boxes can build the
  # release artifact in their first pass instead of a second release column.
  # "Publish only when all three OS are green" is release's job, through its
  # needs. Kept apart from validate because it needs full history, and several
  # test:js gates shell out to git: a deeper clone there would change what
  # they see.
  #
  # channel is the one copy of the prerelease-to-channel rule: every consumer
  # (the macOS bundle and appcast, the Windows stamp, the published feed) reads
  # it from here.
  plan:
    name: 'Release · plan'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.meta.outputs.release }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      title: ${{ steps.meta.outputs.title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      channel: ${{ steps.meta.outputs.channel }}
      linux_bundle: ${{ steps.contract.outputs.linux_bundle }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The Linux box names its tarball with it and release writes it into the
      # notes, so it is resolved and validated once, on every run. A malformed
      # name fails plan and therefore stops every box, macOS and Windows
      # included, on purpose: it can only come from a checked-in bug in
      # defaults.json, and failing fast at t=0 names it before any runner time
      # is spent on a run that could never publish.
      - name: Load the Linux release artifact contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          asset_name=$(node -p "require('./static/ergopti_plus/_shared/modules/updater/defaults.json').release_assets.linux_bundle")
          if [[ ! "$asset_name" =~ ^[A-Za-z0-9._+-]+\.tar\.gz$ ]]; then
              echo "::error::unsafe Linux bundle asset name: $asset_name"
              exit 1
          fi
          echo "linux_bundle=$asset_name" >> "$GITHUB_OUTPUT"

      - name: Compute tag and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          # Only a push to main or dev publishes. A pull request or a manual
          # dispatch takes the CI profile: every box still runs its tests and
          # builds its package, and release is skipped. dev is the channel the
          # CI packages have always been stamped with.
          if [ "$GITHUB_EVENT_NAME" != "push" ] ||
             { [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$GITHUB_REF" != "refs/heads/dev" ]; }; then
              echo "Not a push to main or dev: CI profile, no release."
              emit release false
              emit channel dev
              exit 0
          fi

          branch="${GITHUB_REF_NAME}"

          if [ "$branch" = "main" ]; then
              series_glob='v[0-9]*.[0-9]*.[0-9]*'
              series_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
              last_stable=$(git tag --list "$series_glob" --sort=-v:refname \
                  | grep -E "$series_re" | head -1 || true)
              if [ -z "$last_stable" ]; then
                  last_stable="v0.0.0"
                  range="HEAD"
              else
                  range="${last_stable}..HEAD"
              fi
              IFS='.' read -r maj min pat <<< "${last_stable#v}"
              bump="patch"
              # --format=%s ends every subject with a newline. --pretty=format:
              # left the last one, the oldest commit of the range, unterminated,
              # so read dropped it: a range whose only feat was its oldest commit
              # was bumped as a patch.
              while IFS= read -r subject; do
                  [ -z "$subject" ] && continue
                  if echo "$subject" | grep -qE '(BREAKING|!):'; then
                      bump="major"; break
                  elif echo "$subject" | grep -qE '^feat(\([^)]+\))?!?:'; then
                      [ "$bump" != "major" ] && bump="minor"
                  fi
              done < <(git log "$range" --no-merges --format=%s)
              case "$bump" in
                  major) maj=$((maj+1)); min=0; pat=0 ;;
                  minor) min=$((min+1)); pat=0 ;;
                  patch) pat=$((pat+1)) ;;
              esac
              tag="v${maj}.${min}.${pat}"
              prerelease="false"
              title="Ergopti ${tag}"
          else
              # dev branch — v0.0.0-dev.N series
              series_glob='v0.0.0-dev.*'
              series_re='^v0\.0\.0-dev\.[0-9]+$'
              # Filtered like the stable series: a tag such as v0.0.0-dev.4-hotfix
              # matches the glob, and its number is not an integer.
              last_dev=$(git tag --list "$series_glob" --sort=-v:refname \
                  | grep -E "$series_re" | head -1 || true)
              if [ -z "$last_dev" ]; then
                  next_n=1
              else
                  last_n="${last_dev##*.}"
                  next_n=$((last_n + 1))
              fi
              tag="v0.0.0-dev.${next_n}"
              prerelease="true"

              # The sidebar of the repository home truncates long titles, and the
              # version is what a reader needs from it.
              title="Ergopti ${tag}"
          fi

          # A commit that a tag of its series already contains was published
          # by an earlier run, as that tag or inside it. The number above only
          # counts tags, so "Re-run all jobs" on an older run would otherwise
          # publish that older code under the next number, and the updaters,
          # which order tags by version, would offer it as the newest release.
          # Every tag of the series is tested, not only the newest: after a
          # force push the newest tag no longer descends from the old commits.
          # The listing is captured first, so a failing git fails the step
          # rather than reading as "never released".
          listed=$(git tag --list "$series_glob" --contains HEAD --sort=v:refname)
          covered=()
          while IFS= read -r listed_tag; do
              if [[ "$listed_tag" =~ $series_re ]]; then covered+=("$listed_tag"); fi
          done <<< "$listed"
          if [ "${#covered[@]}" -gt 0 ]; then
              later=""
              [ "${#covered[@]}" -gt 1 ] && later=" and $(( ${#covered[@]} - 1 )) later tag(s)"
              echo "::notice::This commit is already part of ${covered[0]}${later}, which an earlier run published: CI profile, no release. A half-published release of it is finished with 'Re-run failed jobs' on the run that created that tag, before any 'Re-run all jobs' there, or by hand: delete an orphan tag, or write a published release's notes with gh release edit. The next push supersedes it either way."
              emit release false
              emit channel dev
              exit 0
          fi

          # Skip if the tag already exists (duplicate push guard). The listing is
          # captured before it is tested: piped into grep under pipefail, a
          # failing ls-remote read as "tag free" and planned a release.
          taken=$(git ls-remote --tags origin "refs/tags/$tag")
          if [ -n "$taken" ]; then
              echo "::notice::Tag '$tag' already exists: CI profile, no release."
              emit release false
              emit channel dev
              exit 0
          fi

          version="${tag#v}"
          if [ "$prerelease" = "true" ]; then channel="dev"; else channel="main"; fi
          emit release true
          emit tag "$tag"
          emit version "$version"
          emit title "$title"
          emit prerelease "$prerelease"
          emit channel "$channel"
          echo "Resolved: tag=$tag version=$version prerelease=$prerelease channel=$channel"
          echo "Title: $title"

  # ========================================================
  # ========================================================
  # ======= 2/ One box per OS — tests, package, gate =======
  # ========================================================
  # ========================================================

  # A called workflow gets no caller env and no secrets beyond those listed
  # here. version is empty outside a release, which keeps the CI build stamps.
  # The private signing secrets are passed only on a release run, so no pull
  # request or dispatch run, even from a branch of this repository, can read
  # them; SPARKLE_PUBLIC_KEY is public and keeps every CI package launchable.

  # ─────────────────────────────────────────────────
  # 2.1) macOS — Hammerspoon, Swift launcher, ErgoptiPlus.app + launch gate
  # ─────────────────────────────────────────────────
  macos:
    name: 'macOS'
    needs: [validate, plan]
    uses: ./.github/workflows/ci-macos.yml
    with:
      release: ${{ needs.plan.outputs.release == 'true' }}
      version: ${{ needs.plan.outputs.version }}
      channel: ${{ needs.plan.outputs.channel }}
    secrets:
      SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
      SPARKLE_ED_PRIVATE_KEY: ${{ needs.plan.outputs.release == 'true' && secrets.SPARKLE_ED_PRIVATE_KEY || '' }}

  # ─────────────────────────────────────────────────
  # 2.2) Windows — AHK unit + E2E, release exe
  # ─────────────────────────────────────────────────
  windows:
    name: 'Windows'
    needs: [validate, plan]
    uses: ./.github/workflows/ci-windows.yml
    with:
      release: ${{ needs.plan.outputs.release == 'true' }}
      version: ${{ needs.plan.outputs.version }}
      tag: ${{ needs.plan.outputs.tag }}
      prerelease: ${{ needs.plan.outputs.prerelease }}
      channel: ${{ needs.plan.outputs.channel }}
    secrets:
      WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ needs.plan.outputs.release == 'true' && secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 || '' }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ needs.plan.outputs.release == 'true' && secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD || '' }}
      WINDOWS_SIGNER_SUBJECT: ${{ needs.plan.outputs.release == 'true' && secrets.WINDOWS_SIGNER_SUBJECT || '' }}

  # ─────────────────────────────────────────────────
  # 2.3) Linux — driver tests, distro installs, packages + evidence gate
  # ─────────────────────────────────────────────────
  linux:
    name: 'Linux'
    needs: [validate, plan]
    uses: ./.github/workflows/ci-linux.yml
    with:
      release: ${{ needs.plan.outputs.release == 'true' }}
      version: ${{ needs.plan.outputs.version }}
      linux_bundle: ${{ needs.plan.outputs.linux_bundle }}

  # ============================================================
  # ============================================================
  # ======= 3/ Publish the release — tag, assets, feed =========
  # ============================================================
  # ============================================================

  # No status function in the if: the implicit success() over needs is the
  # "all three OS are green" gate, and a box's result is failure as soon as
  # any of its jobs failed. The event test repeats plan's rule on purpose: a
  # regression in plan's script alone must not publish from a pull request or
  # a dispatch run, where PAT_ERGOPTI is readable.
  release:
    name: 'Release · publish'
    needs: [plan, macos, windows, linux]
    if: github.event_name == 'push' && needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LINUX_BUNDLE_ASSET: ${{ needs.plan.outputs.linux_bundle }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT required: GITHUB_TOKEN is blocked by the repo tag
          # creation rule; only a PAT with admin bypass can push tags.
          token: ${{ secrets.PAT_ERGOPTI }}

      - name: Download all build artifacts
        # Restricted to assets-*: the boxes also upload evidence (launch-gate-*,
        # linux-ci-evidence-*, the AHK execution manifest, the packaged startup
        # logs). Without the filter those files would land here too and be
        # attached to the release as stray assets nothing in the notes describes.
        uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          path: release-assets
          merge-multiple: true

      # upload-artifact stores each file below the deepest directory common to
      # the paths its step lists, so ErgoptiPlus.exe arrives as
      # ergopti_plus/windows/ErgoptiPlus.exe and Ergopti_xkb.zip as
      # xkb/Ergopti_xkb.zip. A release names each asset by its file name alone,
      # so every file is brought to the top here, and two files with one name
      # stop the release: GitHub would keep only one of them.
      - name: Bring every downloaded asset to the top of release-assets
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
              name=${file##*/}
              if [ -e "release-assets/$name" ]; then
                  echo "::error::two downloaded assets are named $name (one is ${file#release-assets/}); the release would attach only one of them."
                  exit 1
              fi
              mv -- "$file" "release-assets/$name"
          done < <(find release-assets -mindepth 2 -type f -print0)
          find release-assets -mindepth 1 -type d -empty -delete
          leftover=$(find release-assets -mindepth 1 -type d)
          if [ -n "$leftover" ]; then
              echo "::error::release-assets still holds directories after bringing every file up: $leftover"
              exit 1
          fi

      # Before the first side effect. The asset half is the real guard: the
      # release attaches whatever the boxes uploaded, so a box that skipped a
      # file would publish, tag and all, a release whose notes link to nothing,
      # or one without the Sparkle signature and appcast the feed step needs.
      # The list is every file the notes below link to, plus the signature,
      # the appcast and the checksum the Linux updater verifies the bundle
      # against. tools/test/test-release-notes-assets-are-uploaded.cjs fails
      # when the notes link a file this list does not require.
      #
      # The tag half decides where this attempt starts. "Re-run failed jobs"
      # reuses plan's outputs from the first attempt, so the tag may exist:
      # - on another commit: another run took that number. There is nothing
      #   to publish, and the step fails; when that commit is an ancestor of
      #   this one, "Re-run all jobs" publishes this commit under a new number.
      # - on this commit: an earlier attempt of this run created it, then
      #   stopped. With no release yet, this attempt skips "Create git tag".
      #   With a published release, it also skips "Create release", and
      #   resumes at the Sparkle feed, the changelog and the notes: the
      #   release and its assets are immutable, its notes stay editable. A
      #   draft left by an interrupted upload must be deleted by hand first,
      #   because resuming over it would publish whatever it holds.
      # A newer tag of the channel, published by a later run, stops any
      # publication of this older one; a release already published only has
      # its feed skipped (skip_feed), so the newer feed stays.
      # Anything the step cannot read, the tag listing or the release, fails
      # it rather than being taken as "free".
      - name: Refuse to publish an incomplete or already-taken release
        id: preflight
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          missing=0
          for asset in \
              ErgoptiPlus.exe \
              Ergopti_windows.exe \
              ErgoptiPlus.app.zip \
              Ergopti_macOS.zip \
              _ErgoptiPlus.app.zip.sig \
              "appcast-${CHANNEL}.xml" \
              Ergopti_xkb.zip \
              ErgoptiPlus-linux-amd64.deb \
              ErgoptiPlus-linux-noarch.rpm \
              ErgoptiPlus-linux-x86_64.AppImage \
              ErgoptiPlus-linux-x86_64.flatpak \
              "$LINUX_BUNDLE_ASSET" \
              "$LINUX_BUNDLE_ASSET.sha256"; do
              if [ ! -s "release-assets/$asset" ]; then
                  echo "::error::release-assets/$asset is missing or empty: the box that builds it did not upload it as an assets-* artifact."
                  missing=$((missing + 1))
              fi
          done
          if [ "$missing" -gt 0 ]; then
              echo "::error::$missing release asset(s) missing; nothing was published."
              exit 1
          fi
          # A network error fails the assignment under set -e; it never reads
          # as "tag free". The ^{} pattern lists the commit an annotated tag
          # peels to; a lightweight tag has only its own line.
          taken=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          create_tag=true
          create_release=true
          if [ -n "$taken" ]; then
              tagged=$(printf '%s\n' "$taken" | awk -v ref="refs/tags/$TAG" '
                  $2 == (ref "^{}") { peeled = $1 }
                  $2 == ref { plain = $1 }
                  END { print (peeled != "" ? peeled : plain) }')
              if [ "$tagged" = "$GITHUB_SHA" ]; then
                  create_tag=false
                  view_err="$RUNNER_TEMP/release-view.err"
                  rc=0
                  draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> "$view_err") || rc=$?
                  if [ "$rc" -ne 0 ]; then
                      if [ "$rc" -eq 1 ] && grep -qx 'release not found' "$view_err"; then
                          echo "::notice::$TAG already points at this commit and has no release: an earlier attempt created the tag and stopped. Resuming at the release."
                      else
                          cat "$view_err" >&2
                          echo "::error::could not read the release of $TAG (gh exit $rc); refusing to guess whether it exists."
                          exit 1
                      fi
                  elif [ "$draft" = "false" ]; then
                      echo "::notice::$TAG is already released from this commit: an earlier attempt stopped after publishing it. Resuming at the Sparkle feed, the changelog and the notes."
                      create_release=false
                  elif [ "$draft" = "true" ]; then
                      echo "::error::$TAG has a draft release, left by an attempt that stopped while uploading. Delete that draft (keep the tag), then use 'Re-run failed jobs'."
                      exit 1
                  else
                      echo "::error::gh reported isDraft='$draft' for $TAG; expected true or false."
                      exit 1
                  fi
              elif [ -n "$tagged" ] && git merge-base --is-ancestor "$tagged" "$GITHUB_SHA" 2> /dev/null; then
                  echo "::error::$TAG already exists on $tagged, an older commit than this run's $GITHUB_SHA: another run took the number this run planned. There is nothing to publish from this attempt. 'Re-run all jobs' publishes this commit under the next number; plan skips any commit a tag already contains, so that is safe."
                  exit 1
              else
                  echo "::error::$TAG already exists on ${tagged:-an unknown commit}, not on $GITHUB_SHA: a newer run superseded this one and published that tag. There is nothing to publish; do not re-run this run."
                  exit 1
              fi
          fi

          # A newer tag of this channel on origin means a later run published
          # after this one planned $TAG. Creating $TAG now would publish older
          # code after it, and a stable release would become GitHub's latest,
          # which the Windows and Linux updaters install; its feed would move
          # every macOS user back to it. Only the notes of an already published
          # $TAG may still be finished, without its feed.
          case "$CHANNEL" in
              dev) series='refs/tags/v0.0.0-dev.*'; series_re='^v0\.0\.0-dev\.[0-9]+$' ;;
              main) series='refs/tags/v*'; series_re='^v[0-9]+\.[0-9]+\.[0-9]+$' ;;
              *) echo "::error::plan's channel is '$CHANNEL', expected dev or main."; exit 1 ;;
          esac
          published=$(git ls-remote --tags --refs origin "$series")
          names=("$TAG")
          while read -r _ ref; do
              if [[ "${ref#refs/tags/}" =~ $series_re ]]; then names+=("${ref#refs/tags/}"); fi
          done <<< "$published"
          newest=$(printf '%s\n' "${names[@]}" | sort -V | tail -n 1)
          skip_feed=false
          if [ "$newest" != "$TAG" ]; then
              if [ "$create_release" = false ]; then
                  echo "::notice::$newest was published after this run planned $TAG. Finishing the changelog and the notes of $TAG only: its feed would replace the newer one."
                  skip_feed=true
              else
                  echo "::error::$newest was published after this run planned $TAG: publishing $TAG now would put older code after it. There is nothing to publish; do not re-run this run. An orphan $TAG tag left by an earlier attempt can be deleted by hand."
                  exit 1
              fi
          fi
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"
          echo "create_release=$create_release" >> "$GITHUB_OUTPUT"
          echo "skip_feed=$skip_feed" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG: every release asset is present; create tag: $create_tag, create release: $create_release, skip feed: $skip_feed."

      # Skipped only when the preflight found this commit's tag from an earlier
      # attempt of this run.
      - name: Create git tag
        if: steps.preflight.outputs.create_tag == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT_ERGOPTI }}
        run: |
          set -euo pipefail
          tag="${{ needs.plan.outputs.tag }}"
          sha="${{ github.sha }}"
          gh api repos/${{ github.repository }}/git/refs \
              --method POST \
              --field ref="refs/tags/${tag}" \
              --field sha="${sha}"
          echo "Tag '$tag' created via API."

      - name: Create release and upload all assets atomically
        # The release is created here — after all three build jobs have
        # succeeded — so it is never in a half-baked state. Skipped only when
        # an earlier attempt of this run already published it; the steps below
        # still run, so a re-run finishes the feed and the notes.
        if: steps.preflight.outputs.create_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          TITLE: ${{ needs.plan.outputs.title }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f)
          echo "Assets to attach (${#assets[@]}):"
          printf '  %s\n' "${assets[@]}"

          # A dev build must stay a prerelease: GitHub makes every other
          # published release the latest one, and the Windows and Linux stable
          # updaters install /releases/latest.
          flags=()
          case "$PRERELEASE" in
              true) flags+=("--prerelease") ;;
              false) ;;
              *) echo "::error::plan's prerelease output is '$PRERELEASE', expected true or false."; exit 1 ;;
          esac

          gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              "${flags[@]}" \
              "${assets[@]}"

      # Skipped only when the preflight found a newer release of this channel:
      # this older feed would replace the one that points at it.
      - name: Publish channel feed for Sparkle
        if: steps.preflight.outputs.skip_feed != 'true'
        shell: bash
        env:
          ERGOPTI_CHANNEL: ${{ needs.plan.outputs.channel }}
          TAG: ${{ needs.plan.outputs.tag }}
          RESUMED: ${{ steps.preflight.outputs.create_release == 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          feed="release-assets/appcast-${ERGOPTI_CHANNEL}.xml"
          branch="sparkle-appcasts"
          worktree="$RUNNER_TEMP/sparkle-appcasts"
          # The appcast carries the size and the EdDSA signature of one exact
          # zip. When an earlier attempt already published the release, that
          # zip is the release's, so its own appcast is published, never this
          # attempt's artifact, which a rebuilt package would no longer match.
          if [ "$RESUMED" = true ]; then
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                  --pattern "appcast-${ERGOPTI_CHANNEL}.xml" --output "$feed" --clobber
          fi
          test -s "$feed"

          # Published releases are immutable, so a permanent release asset
          # cannot be refreshed for the next channel version. Keep the signed
          # appcasts on a dedicated mutable branch instead; the release assets
          # they reference remain immutable and version-scoped.
          if git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"; then
              git worktree add --detach "$worktree" "refs/remotes/origin/${branch}"
          else
              git worktree add --detach "$worktree" "$GITHUB_SHA"
              git -C "$worktree" checkout --orphan "$branch"
              git -C "$worktree" rm -rf --ignore-unmatch .
          fi

          cp "$feed" "$worktree/appcast-${ERGOPTI_CHANNEL}.xml"
          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree" add -- "appcast-${ERGOPTI_CHANNEL}.xml"
          if ! git -C "$worktree" diff --cached --quiet; then
              git -C "$worktree" commit -m "chore(release): update ${ERGOPTI_CHANNEL} appcast"
              git -C "$worktree" push origin "HEAD:refs/heads/${branch}"
          fi

          published="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${branch}/appcast-${ERGOPTI_CHANNEL}.xml?release=${GITHUB_SHA}"
          # The git ref becomes visible before raw.githubusercontent.com's edge
          # cache necessarily observes a newly-created branch. Retry every HTTP
          # failure for a bounded minute so that transient post-push 404s do not
          # turn a successfully published feed into a red release job.
          curl --fail --silent --show-error --location \
              --retry 12 --retry-delay 5 --retry-max-time 90 --retry-all-errors \
              "$published" \
              > "$RUNNER_TEMP/published-appcast.xml"
          cmp --silent "$feed" "$RUNNER_TEMP/published-appcast.xml"
          echo "Published and verified $published"

      - name: Build changelog section
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          # Fetch tags so git-describe can resolve the previous release tag.
          # The tag for the current release was just created via the API and
          # is not yet present in the shallow clone.
          git fetch --tags --quiet
          python3 tools/build/build_changelog.py > "$RUNNER_TEMP/changelog.md"
          echo "Changelog written ($(wc -l < "$RUNNER_TEMP/changelog.md") lines)."

      - name: Write release body with platform sections
        # Body order is deliberate: a jump link to the downloads, then the
        # changelog as high as possible (it is what returning users read),
        # and only then the per-platform download tables and install guides.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          # The downloads come first and the changelog last, folded. A "skip to
          # downloads" link could not work: the releases list page truncates long
          # notes (the anchor after the changelog was not there), and from the
          # list GitHub opens a release page client-side without scrolling to a
          # fragment, so the first click always landed at the top.
          cat >> "$body_file" << EOF
          ## Ergopti $VERSION

          **Ergopti — keyboard layout:** install the ergonomic layout without running an application.

          **Ergopti Plus — advanced typing tools:** the companion application adds remapping, shortcuts and text expansion.
          EOF

          cat >> "$body_file" << EOF

          ## Downloads

          ### Ergopti — keyboard layout only

          No Ergopti Plus application is required for these keyboard layouts.

          | Platform | Download | Installation |
          |---|---|---|
          | Windows | [Ergopti_windows.exe](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Ergopti_windows.exe) | Run as Administrator, log out and back in, then select the layout in Settings → Time & Language → Language & region. |
          | macOS | [Ergopti_macOS.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Ergopti_macOS.zip) | Unzip, copy the \`.bundle\` folder to \`/Library/Keyboard Layouts/\`, log out and back in, then add it in System Settings → Keyboard → Input Sources. |
          | Linux | [Ergopti_xkb.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Ergopti_xkb.zip) | Follow the [XKB installation guide](https://github.com/${GITHUB_REPOSITORY}/tree/main/static/ergopti/linux/xkb_installation). Includes standard, ANSI, plus and plus-ANSI variants. |

          ### Ergopti Plus — application with advanced typing tools

          Select your platform and download the corresponding file.

          #### Windows — Ergopti Plus

          | Asset | Description |
          |---|---|
          | [ErgoptiPlus.exe](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ErgoptiPlus.exe) | Compiled AutoHotkey executable (AHK v2 runtime bundled) |

          **Installation — app:**
          1. Download \`ErgoptiPlus.exe\`.
          2. Double-click to run. On first launch, resources are extracted to \`%LOCALAPPDATA%\Ergopti\`.
          3. Your personal configuration is stored in \`%USERPROFILE%\.config\ergopti_plus\`. If this folder does not exist yet (first launch), the setup wizard will open automatically.

          ---

          #### macOS — Ergopti Plus

          | Asset | Description |
          |---|---|
          | [ErgoptiPlus.app.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ErgoptiPlus.app.zip) | macOS application (Hammerspoon + Karabiner-Elements bundled) |

          **Installation — app:**
          1. Unzip \`ErgoptiPlus.app.zip\` and move \`ErgoptiPlus.app\` to \`/Applications\`.
          2. Remove the quarantine flag (the app is not yet Apple-notarised):
          \`\`\`bash
          xattr -dr com.apple.quarantine /Applications/ErgoptiPlus.app
          \`\`\`
          3. Launch the app. On first run, Karabiner-Elements will request a System Extension approval — required for key remapping.
          4. Your personal configuration is stored in \`~/.config/ergopti_plus/\`. If this folder does not exist yet (first launch), the setup wizard will open automatically.

          ---

          #### Linux — Ergopti Plus

          | Asset | Description |
          |---|---|
          | [ErgoptiPlus-linux-amd64.deb](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ErgoptiPlus-linux-amd64.deb) | Driver package for Debian, Ubuntu and Mint |
          | [ErgoptiPlus-linux-noarch.rpm](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ErgoptiPlus-linux-noarch.rpm) | Driver package for Fedora, RHEL and openSUSE |
          | [ErgoptiPlus-linux-x86_64.AppImage](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ErgoptiPlus-linux-x86_64.AppImage) | Portable driver — any distribution, no root required |
          | [ErgoptiPlus-linux-x86_64.flatpak](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ErgoptiPlus-linux-x86_64.flatpak) | Sandboxed driver, for a distribution-agnostic install |
          | [$LINUX_BUNDLE_ASSET](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$LINUX_BUNDLE_ASSET) | Driver bundle with \`install.sh\`, installs under your home directory |

          **Which file for your distribution:**
          - Debian, Ubuntu, Mint, Pop!_OS, elementary → \`ErgoptiPlus-linux-amd64.deb\`
          - Fedora, RHEL, CentOS, openSUSE, Mageia → \`ErgoptiPlus-linux-noarch.rpm\`
          - Arch, Manjaro, EndeavourOS → build it from \`tools/build/PKGBUILD\` in the repository; no Arch package is attached to this release
          - Flatpak → \`ErgoptiPlus-linux-x86_64.flatpak\`, installed with \`flatpak install --bundle\`. It requests \`--device=all\`, which is the only permission that reaches \`/dev/input\` and \`/dev/uinput\`; the sandbox still cannot grant access your user does not have on the host, so the udev rule in step 2 is required either way
          - Any other distribution, an immutable one, or no root access → \`ErgoptiPlus-linux-x86_64.AppImage\` or \`$LINUX_BUNDLE_ASSET\`

          > **Alpha.** The Linux driver has never been validated on real hardware. Every asset above is installed and launched in CI, and the installed layout is checked from inside it — but a runner has no keyboard to grab, no /dev/uinput to write and no display, so capture, injection, the tray and the settings windows are all unproven.

          **Installation — app:**
          1. Install the package for your distribution:
          \`\`\`bash
          sudo apt install ./ErgoptiPlus-linux-amd64.deb       # Debian, Ubuntu, Mint
          sudo dnf install ./ErgoptiPlus-linux-noarch.rpm      # Fedora, RHEL, openSUSE
          flatpak install --bundle ./ErgoptiPlus-linux-x86_64.flatpak   # sandboxed
          chmod +x ErgoptiPlus-linux-x86_64.AppImage           # anywhere else, then run it
          \`\`\`
          2. Give the daemon access to the keyboard. It reads \`/dev/input/event*\` and writes \`/dev/uinput\`, and a normal user is refused both until a udev rule and the \`input\` and \`uinput\` group memberships exist. Unpack \`$LINUX_BUNDLE_ASSET\` and run:
          \`\`\`bash
          bash install.sh --setup-perms
          \`\`\`
          3. Log out and back in so the new group memberships take effect. Skip this and the daemon starts, logs one line and captures nothing — the most common first experience.
          4. Start it with \`systemctl --user start ergopti-hotstrings.service\` (\`.deb\` and \`.rpm\`), or by running the AppImage directly.
          EOF

          # The changelog is folded so the downloads above stay in view; its own
          # "## Changelog" heading becomes the summary of the fold.
          if [ -s "$RUNNER_TEMP/changelog.md" ]; then
              {
                echo ""
                echo "<details>"
                echo "<summary><b>Changelog</b> (click to expand)</summary>"
                echo ""
                echo "> Timestamps are in **Paris time** (Europe/Paris, CET/CEST)."
                echo ""
                sed '/^## Changelog[[:space:]]*$/d' "$RUNNER_TEMP/changelog.md"
                echo ""
                echo "</details>"
              } >> "$body_file"
          fi

          cat >> "$body_file" << EOF

          ---
          _Generated by [CI](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_
          EOF
          gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --notes-file "$body_file"
          echo "Release notes updated for $TAG"
