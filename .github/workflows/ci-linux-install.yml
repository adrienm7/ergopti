# .github/workflows/ci-linux-install.yml
#
# Linux install-and-launch stage: installs the packages and the driver on
# every distribution lot and launches what each installed.
# Called by ci-linux.yml as its install-linux stage.

name: 'Linux install and launch'

on:
  workflow_call:
    inputs:
      release:
        description: True when this run publishes a release; only sets artifact retention
        required: true
        type: boolean
      version:
        description: Release version stamped into the Linux tree, empty outside a release
        required: true
        type: string
      tag:
        description: Exact release tag from the validated release plan
        required: true
        type: string
      prerelease:
        description: Exact prerelease string from the validated release plan
        required: true
        type: string
      channel:
        description: Exact update channel from the validated release plan
        required: true
        type: string
      install_matrix:
        description: install_matrix output of package-linux, the stage this one follows
        required: true
        type: string
      install_metadata:
        description: install_metadata output of package-linux, the stage this one follows
        required: true
        type: string
      predecessors:
        description: The lane's needs context for this stage (package-linux), as JSON
        required: true
        type: string
    outputs:
      ci_predecessors:
        description: install-linux's ci_predecessors output, read by the lane's later stages
        value: ${{ jobs.install-linux.outputs.ci_predecessors }}
      ci_source_sha:
        description: install-linux's ci_source_sha output, read by the lane's later stages
        value: ${{ jobs.install-linux.outputs.ci_source_sha }}
      ci_run_id:
        description: install-linux's ci_run_id output, read by the lane's later stages
        value: ${{ jobs.install-linux.outputs.ci_run_id }}
      ci_attempt:
        description: install-linux's ci_attempt output, read by the lane's later stages
        value: ${{ jobs.install-linux.outputs.ci_attempt }}

permissions:
  contents: read

env:
  ERGOPTI_DEV_RELEASE_RELEASE: ${{ inputs.release }}
  ERGOPTI_DEV_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
  ERGOPTI_DEV_RELEASE_CHANNEL: ${{ inputs.channel }}
  ERGOPTI_DEV_RELEASE_TAG: ${{ inputs.tag }}
  ERGOPTI_DEV_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  install-linux:
    name: '${{ matrix.lot }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.install_matrix) }}
    container: ${{ fromJSON(inputs.install_metadata)[matrix.lot].container }}
    env:
      INSTALL_ID: ${{ fromJSON(inputs.install_metadata)[matrix.lot].id }}
      INSTALL_KIND: ${{ fromJSON(inputs.install_metadata)[matrix.lot].kind }}
      INSTALL_DISTRO: ${{ fromJSON(inputs.install_metadata)[matrix.lot].distro }}
      INSTALL_IMAGE: ${{ fromJSON(inputs.install_metadata)[matrix.lot].image }}
      INSTALL_PREP: ${{ fromJSON(inputs.install_metadata)[matrix.lot].prep }}
      INSTALL_KNOWN: ${{ fromJSON(inputs.install_metadata)[matrix.lot].known }}
    outputs:
      ci_predecessors: ${{ inputs.predecessors }}
      ci_source_sha: ${{ github.sha }}
      ci_run_id: ${{ github.run_id }}
      ci_attempt: ${{ github.run_attempt }}

    steps:
      - name: Require a declared installation lot
        shell: sh
        run: |
          set -eu
          test -n "$INSTALL_ID"
          case "$INSTALL_KIND" in
            install|first|deb|rpm|appimage) ;;
            *) exit 1 ;;
          esac

      - name: Prepare the container
        if: env.INSTALL_KIND == 'install'
        shell: sh
        run: ${{ env.INSTALL_PREP }}

      - name: Tools the job itself needs (rpm)
        if: env.INSTALL_KIND == 'rpm'
        # Deliberately NOT luajit: the .rpm declares `Requires: luajit >= 2.1`,
        # so letting dnf resolve it from the package is what proves that
        # declaration is right. Pre-installing it would hide a wrong Requires.
        # git is for actions/checkout, findutils for the `find` below.
        shell: bash
        run: dnf install -y git findutils

      - uses: actions/checkout@v4

      - name: Verify source compiler and checkout
        if: env.INSTALL_KIND == 'install'
        shell: bash
        run: |
          set -euo pipefail
          # Checkout's temporary HOME does not carry ownership admission into this step.
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          source static/ergopti_plus/linux/install/native_source_build.sh
          native_source_compile_probe "$GITHUB_WORKSPACE/static/ergopti_plus/linux/native/archive_output"

      - name: Create the installation user
        if: env.INSTALL_KIND == 'install'
        shell: bash
        run: |
          set -euo pipefail
          if command -v useradd >/dev/null 2>&1; then
            useradd -m -d /tmp/ergopti-home -s /bin/bash ergopti-ci
          else
            adduser -D -h /tmp/ergopti-home -s /bin/bash ergopti-ci
          fi
          test "$(id -u ergopti-ci)" -ge 1000
          install -d -m 0750 /etc/sudoers.d
          printf '%s\n' 'ergopti-ci ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/ergopti-ci
          chmod 0440 /etc/sudoers.d/ergopti-ci

      - name: Install as an ordinary user without runtime dependencies
        if: env.INSTALL_KIND == 'install'
        working-directory: static/ergopti_plus/linux
        # The installer owns user files; only its real permission helper gets
        # sudo. There is no user session bus, so startup must use XDG autostart.
        # Running as root with a different HOME is not an ordinary user install.
        shell: bash
        run: |
          set -euo pipefail
          # Model a login, not a nested sudo invocation whose SUDO_UID is root.
          sudo -H -u ergopti-ci env -u SUDO_UID -u SUDO_GID -u SUDO_USER bash install.sh --no-deps

      - name: The installed tree is the one the daemon expects
        if: env.INSTALL_KIND == 'install'
        shell: bash
        run: |
          export HOME=/tmp/ergopti-home
          FAIL=0
          # The wrapper is what a user types. Without it nothing else matters.
          if [ ! -x "$HOME/.local/bin/ergopti-hotstrings" ]; then
            echo "::error::no executable at ~/.local/bin/ergopti-hotstrings"
            FAIL=1
          fi
          # The driver root and the shared tree must be SIBLINGS: infra/paths.lua
          # resolves _shared as ../_shared from the driver root and probes it, so a
          # layout that nests them differently boots to "shared tree not found".
          for path in "$HOME/.local/lib/ergopti/linux/ergopti_hotstrings.lua" \
                      "$HOME/.local/lib/ergopti/_shared/data/locales/en.json"; do
            if [ ! -f "$path" ]; then
              echo "::error::missing $path"
              FAIL=1
            fi
          done
          # A hotstring pack, because an install with no hotstrings is an install
          # that runs and does nothing.
          if ! ls "$HOME/.local/lib/ergopti/_shared/modules/hotstrings/"*.toml >/dev/null 2>&1; then
            echo "::error::no hotstring packs were installed"
            FAIL=1
          fi
          exit $FAIL
        timeout-minutes: 5

      # The whole unit suite, on THIS distribution's own LuaJIT.
      #
      # Everything else in this workflow runs on Ubuntu's build, so a difference
      # that belongs to the interpreter or the C library is invisible to it —
      # and those are the differences that actually bite here. Alpine is musl
      # rather than glibc; Arch ships whatever LuaJIT released last; several
      # distributions patch it. The suite also measures actual native filesystem,
      # timers and supervised Python/curl children. Build pinned luv/lfs against
      # the native interpreter and retain the ordinary UID and writable source.
      # The earlier no-dependencies installation contract remains unchanged.
      #
      # LuaJIT is the production interpreter. A distribution lane without it is
      # not evidence about the driver and therefore cannot satisfy this gate.
      - name: The unit suite on this distribution's LuaJIT
        if: env.INSTALL_KIND == 'install'
        working-directory: static/ergopti_plus/linux
        shell: bash
        run: |
          set -euo pipefail
          # Retain the suite's real supervised-curl prerequisite. The incoming
          # pinned native helper owns Python and ABI-compatible luv/lfs builds.
          case "${{ env.INSTALL_DISTRO }}" in
            debian)   apt-get install -y --no-install-recommends curl ;;
            fedora)   dnf install -y curl ;;
            arch)     pacman -Sy --noconfirm curl ;;
            alpine)   apk add --no-cache curl ;;
            opensuse) zypper --non-interactive install curl ;;
            *) echo "::error::unknown archive unit distribution"; exit 1 ;;
          esac
          command -v curl

          # Root bypasses the suite's real unreadable-file permission premise.
          # Keep the checkout untouched and give the installation user a private
          # writable source tree, including every original test and shared file.
          test "$(id -u ergopti-ci)" -ge 1000
          unit_root="$(mktemp -d)"
          readonly unit_root
          trap 'rm -rf -- "$unit_root"' EXIT
          cp -a "$GITHUB_WORKSPACE/." "$unit_root/"
          chown -R ergopti-ci:ergopti-ci "$unit_root"
          unit_log_dir="$RUNNER_TEMP/linux-distro-unit-logs"
          mkdir -p "$unit_log_dir"
          unit_log="$unit_log_dir/${{ env.INSTALL_DISTRO }}.log"
          set +e
          (cd "$unit_root/static/ergopti_plus/linux" &&
            bash "$GITHUB_WORKSPACE/tools/test/prepare-linux-distro-unit.sh" "${{ env.INSTALL_DISTRO }}") \
            2>&1 | tee "$unit_log"
          unit_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          native_status="${unit_pipeline_status[0]}"
          set +e
          python3 - "$unit_log" "$unit_root/static/ergopti_plus/linux/tests/run.lua" \
            '${{ env.INSTALL_DISTRO }}' "$native_status" <<'PYTHON'
          import pathlib
          import re
          import sys

          log_path, runner_path, distro, native_status = sys.argv[1:]
          text = pathlib.Path(log_path).read_text(encoding="utf-8", errors="replace")
          runner = pathlib.Path(runner_path).read_text(encoding="utf-8")
          groups_path = pathlib.Path(runner_path).parent / "support" / "module_groups.lua"
          groups = re.findall(r'\{ name = "([a-z_]+)"', groups_path.read_text(encoding="utf-8"))
          separator = "=" * 40
          template = r"\n" + separator + r"\nOVERALL RESULTS:\nTotal modules: %d\nPassed tests:  %d\nFailed tests:  %d\n" + separator

          def annotation(kind, message):
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::" + kind + " title=Linux distro unit suite::" + message)

          if native_status != "0":
              for line in text.splitlines():
                  if line.startswith("tests/run.lua: ") or line.startswith("luajit: "):
                      annotation("error", distro + ": " + line)

          # Couple only to the existing runner's exact format string, not a second tally.
          if runner.count('"' + template + '"') != 1:
              annotation("error", distro + ": native runner summary format is unavailable; inspect the raw artifact")
              raise SystemExit(2)
          # The helper runs every module group at once and prints each log whole
          # under its header, in the order tests/support/module_groups.lua declares.
          parts = re.split(r"(?m)^distro-unit-group ([a-z_]+)\n", text)
          names = parts[1::2]
          if not groups or names != groups:
              annotation("error", distro + ": native exit " + native_status + "; expected the groups " + ", ".join(groups) + ", received " + ", ".join(names) + "; inspect the raw artifact")
              raise SystemExit(2)
          pattern = re.compile(r"(?m)^" + separator + r"\nOVERALL RESULTS:\nTotal modules: ([0-9]+)\nPassed tests:  ([0-9]+)\nFailed tests:  ([0-9]+)\n" + separator + r"(?:\n|$)")
          totals = [0, 0, 0]
          for name, body in zip(names, parts[2::2]):
              frames = list(pattern.finditer(body))
              if len(frames) != 1 or len(re.findall(r"(?m)^OVERALL RESULTS:$", body)) != 1:
                  annotation("error", distro + " " + name + ": native exit " + native_status + "; expected one complete summary, received " + str(len(frames)) + "; inspect the raw artifact")
                  raise SystemExit(2)
              frame = frames[0]
              modules, passed, failed = map(int, frame.groups())
              if modules <= 0 or passed + failed <= 0 or (native_status == "0" and failed != 0):
                  annotation("error", distro + " " + name + ": native exit/summary contradiction; inspect the raw artifact")
                  raise SystemExit(2)
              totals = [totals[0] + modules, totals[1] + passed, totals[2] + failed]
              # Emit the actual runner's failure and module-load first lines without deriving
              # expected results. Full traceback/replay bytes remain in the uploaded raw log.
              if native_status != "0":
                  for line in body[:frame.start()].splitlines():
                      if line.startswith("  ! load error in "):
                          annotation("error", distro + " " + name + ": " + line.strip())
                  for line in body[frame.end():].splitlines():
                      if line.startswith("  - ") or line.startswith("    replay: "):
                          annotation("error", distro + " " + name + ": " + line.strip())
          summary = distro + ": native exit " + native_status + "; groups=" + str(len(names)) + ", modules=" + str(totals[0]) + ", passed=" + str(totals[1]) + ", failed=" + str(totals[2])
          annotation("notice" if native_status == "0" else "error", summary)
          PYTHON
          diagnostic_status=$?
          set -e
          # Diagnostics and tee must never turn a refused native run green.
          if [[ "$native_status" -ne 0 ]]; then exit "$native_status"; fi
          if [[ "${unit_pipeline_status[1]}" -ne 0 ]]; then exit "${unit_pipeline_status[1]}"; fi
          exit "$diagnostic_status"
        timeout-minutes: 10

      - name: Upload the native distro unit log
        if: ${{ !cancelled() && env.INSTALL_KIND == 'install' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-distro-unit-log-${{ env.INSTALL_DISTRO }}
          retention-days: 7
          path: ${{ runner.temp }}/linux-distro-unit-logs/${{ env.INSTALL_DISTRO }}.log
          if-no-files-found: warn

      - name: Record mandatory distro evidence
        if: env.INSTALL_KIND == 'install'
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/linux-ci-evidence"
          mkdir -p "$evidence_dir"
          printf '%s\n' \
            '{' \
            '  "schema_version": 1,' \
            '  "job": "install-linux",' \
            "  \"sha\": \"$GITHUB_SHA\"," \
            "  \"architecture\": \"$RUNNER_ARCH\"," \
            '  "distro": "${{ env.INSTALL_DISTRO }}",' \
            '  "session": "container",' \
            '  "interpreter": "LuaJIT",' \
            '  "subjects": { "distro-${{ env.INSTALL_DISTRO }}": 1 }' \
            '}' > "$evidence_dir/${{ env.INSTALL_DISTRO }}.json"

      - name: Upload mandatory distro evidence
        if: env.INSTALL_KIND == 'install'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-ci-evidence-distro-${{ env.INSTALL_DISTRO }}
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/${{ env.INSTALL_DISTRO }}.json
          if-no-files-found: error

      - name: Install on ${{ env.INSTALL_IMAGE }} and verify the first run
        if: env.INSTALL_KIND == 'first'
        timeout-minutes: 25
        shell: bash
        env:
          ERGOPTI_E2E_PREP: ${{ env.INSTALL_PREP || '' }}
        run: |
          set -euo pipefail
          export ERGOPTI_E2E_DOCKER_ARGS="-e ERGOPTI_E2E_PREP -e ERGOPTI_E2E_KNOWN_LIMITATIONS=${{ env.INSTALL_KNOWN || '' }}"
          bash static/ergopti_plus/linux/tests/distro/run_in_docker.sh '${{ env.INSTALL_IMAGE }}' \
            | tee "$RUNNER_TEMP/first-install.log"

      - name: Record mandatory first-install evidence
        if: env.INSTALL_KIND == 'first'
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/linux-ci-evidence"
          mkdir -p "$evidence_dir"
          printf '%s\n' \
            '{' \
            '  "schema_version": 1,' \
            '  "job": "install-linux",' \
            "  \"sha\": \"$GITHUB_SHA\"," \
            "  \"architecture\": \"$RUNNER_ARCH\"," \
            '  "distro": "${{ env.INSTALL_DISTRO }}",' \
            '  "session": "container-first-install",' \
            '  "interpreter": "LuaJIT",' \
            '  "subjects": { "first-install-${{ env.INSTALL_DISTRO }}": 1 }' \
            '}' > "$evidence_dir/first-install-${{ env.INSTALL_DISTRO }}.json"

      - name: Upload mandatory first-install evidence
        if: env.INSTALL_KIND == 'first'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-ci-evidence-first-install-${{ env.INSTALL_DISTRO }}
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/first-install-${{ env.INSTALL_DISTRO }}.json
          if-no-files-found: error

      - name: Download the .deb built above (deb)
        if: env.INSTALL_KIND == 'deb'
        # assets-linux holds every Linux file of this run under its release
        # name; the find below picks its one .deb.
        uses: actions/download-artifact@v4
        with:
          name: assets-linux
          path: pkg

      - name: Install it the way a user would (deb)
        if: env.INSTALL_KIND == 'deb'
        # --no-install-recommends deliberately: the Recommends list names
        # libayatana-appindicator3-1 among others, which are optional at
        # runtime and not all in the Ubuntu archive. What is under test is that
        # the Depends resolve and that DEBIAN/postinst — never once executed
        # before this job existed — runs to completion, since apt fails the
        # install when it exits non-zero.
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find pkg -name '*.deb' -type f | head -1)
          if [ -z "$deb" ]; then
              echo "::error::the assets-linux artifact contains no .deb."
              exit 1
          fi
          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends "./$deb"
          dpkg -s ergopti

      - name: The package installed the files the daemon reads (deb)
        if: env.INSTALL_KIND == 'deb'
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for f in /usr/bin/ergopti \
                   /usr/lib/ergopti/ergopti_hotstrings.lua \
                   /usr/lib/ergopti/infra/paths.lua \
                   /usr/lib/ergopti/_shared/lua/logger/shim.lua \
                   /usr/lib/ergopti/_shared/data/locales/en.json \
                   /usr/lib/systemd/user/ergopti-hotstrings.service; do
              if [ ! -e "$f" ]; then
                  echo "::error::the package did not install $f"
                  fail=1
              fi
          done
          exit $fail

      - name: Launch the installed binary (deb)
        if: env.INSTALL_KIND == 'deb'
        # --help returns early, but only AFTER every file-scope require in the
        # daemon has run — so this is a real check of the require graph against
        # the INSTALLED layout, which the unit suite (run from the checkout)
        # cannot see. A missing module or a wrapper with the wrong LUA_PATH
        # fails here instead of on the user's machine.
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/ergopti --help

      - name: The installed shared data tree resolves and opens (deb)
        if: env.INSTALL_KIND == 'deb'
        # --help returns before doing any work, so it proves the require graph
        # and nothing about the DATA tree — which is where the defect that
        # motivated this whole job actually lived. The check is a tracked file
        # rather than a heredoc because five formats run it.
        #
        # LUA_PATH is replayed from the INSTALLED wrapper rather than re-typed,
        # so this cannot pass against a path the wrapper does not set.
        shell: bash
        run: |
          set -euo pipefail
          eval "$(grep -E '^(DRIVER_ROOT|SHARED_LUA)=|^export LUA_PATH=' /usr/bin/ergopti)"
          if [ -z "${LUA_PATH:-}" ]; then
              echo "::error::/usr/bin/ergopti no longer exports LUA_PATH — this check read nothing."
              exit 1
          fi
          echo "LUA_PATH from the installed wrapper: $LUA_PATH"
          luajit static/ergopti_plus/linux/tests/hardware/installed_layout_check.lua \
              /usr/lib/ergopti/_shared

      - name: Record mandatory .deb smoke evidence (deb)
        if: env.INSTALL_KIND == 'deb'
        shell: bash
        run: |
          node tools/test/linux-ci-evidence.cjs record \
              --job install-linux --output "$RUNNER_TEMP/linux-ci-evidence/smoke-deb-install.json" \
              --sha "$GITHUB_SHA" --architecture "$RUNNER_ARCH" --distro ubuntu \
              --session installed-package --interpreter "$(luajit -v 2>&1 | head -1)" \
              --subject smoke-deb-install=1

      - name: Upload mandatory .deb smoke evidence (deb)
        if: env.INSTALL_KIND == 'deb'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-ci-evidence-smoke-deb-install
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/smoke-deb-install.json
          if-no-files-found: error

      - name: Download the .rpm built above (rpm)
        if: env.INSTALL_KIND == 'rpm'
        # assets-linux holds every Linux file of this run under its release
        # name; the find below picks its one .rpm.
        uses: actions/download-artifact@v4
        with:
          name: assets-linux
          path: pkg

      - name: Install it the way a user would (rpm)
        if: env.INSTALL_KIND == 'rpm'
        shell: bash
        run: |
          set -euo pipefail
          rpm=$(find pkg -name '*.rpm' -type f | head -1)
          if [ -z "$rpm" ]; then
              echo "::error::the assets-linux artifact contains no .rpm."
              exit 1
          fi
          dnf install -y "./$rpm"
          rpm -q ergopti

      - name: Launch the installed binary (rpm)
        if: env.INSTALL_KIND == 'rpm'
        shell: bash
        run: |
          set -euo pipefail
          account="$(id -un)"
          if [ -z "$account" ]; then
              echo '::error::Native account identity was unavailable for installed RPM launch.' >&2
              exit 1
          fi
          USER="$account" LOGNAME="$account" /usr/bin/ergopti --help

      - name: The installed shared data tree resolves and opens (rpm)
        if: env.INSTALL_KIND == 'rpm'
        shell: bash
        run: |
          set -euo pipefail
          eval "$(grep -E '^(DRIVER_ROOT|SHARED_LUA)=|^export LUA_PATH=' /usr/bin/ergopti)"
          if [ -z "${LUA_PATH:-}" ]; then
              echo "::error::/usr/bin/ergopti no longer exports LUA_PATH — this check read nothing."
              exit 1
          fi
          luajit static/ergopti_plus/linux/tests/hardware/installed_layout_check.lua \
              /usr/lib/ergopti/_shared

      - name: Record mandatory .rpm smoke evidence (rpm)
        if: env.INSTALL_KIND == 'rpm'
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/linux-ci-evidence"
          mkdir -p "$evidence_dir"
          printf '%s\n' \
            '{' \
            '  "schema_version": 1,' \
            '  "job": "install-linux",' \
            "  \"sha\": \"$GITHUB_SHA\"," \
            "  \"architecture\": \"$RUNNER_ARCH\"," \
            '  "distro": "fedora",' \
            '  "session": "installed-package",' \
            '  "interpreter": "LuaJIT",' \
            '  "subjects": { "smoke-rpm-install": 1 }' \
            '}' > "$evidence_dir/smoke-rpm-install.json"

      - name: Upload mandatory .rpm smoke evidence (rpm)
        if: env.INSTALL_KIND == 'rpm'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-ci-evidence-smoke-rpm-install
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/smoke-rpm-install.json
          if-no-files-found: error

      - name: Download the AppImage built above
        if: env.INSTALL_KIND == 'appimage'
        # assets-linux holds every Linux file of this run under its release
        # name; the find below picks its one .AppImage.
        uses: actions/download-artifact@v4
        with:
          name: assets-linux
          path: pkg

      - name: Unpack it (no FUSE on this runner)
        if: env.INSTALL_KIND == 'appimage'
        shell: bash
        run: |
          set -euo pipefail
          img=$(find pkg -name '*.AppImage' -type f | head -1)
          if [ -z "$img" ]; then
              echo "::error::the assets-linux artifact contains no .AppImage."
              exit 1
          fi
          chmod +x "$img"
          "./$img" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun

      - name: Launch it
        if: env.INSTALL_KIND == 'appimage'
        # Explicitly --help: AppRun appends --tray when given no arguments, and
        # there is no display here for a tray to appear in.
        shell: bash
        run: ./squashfs-root/AppRun --help

      - name: Every bundled ELF file loads on the oldest supported LTS
        if: env.INSTALL_KIND == 'appimage'
        # The AppImage catalogue runs it on Ubuntu 22.04; one file needing a
        # newer GLIBC_ version kills the launch before any icon appears.
        shell: bash
        run: node tools/build/check-elf-glibc-ceiling.cjs squashfs-root pkg

      - name: It shows its tray icon on Ubuntu 22.04, offline
        if: env.INSTALL_KIND == 'appimage'
        # What the AppImage catalogue does with firejail: no network, a desktop
        # launch by a user outside the input group, and a pass only when a
        # window or a tray icon appears.
        shell: bash
        run: bash tools/build/appimage-oldest-lts.sh smoke "$(find pkg -name '*.AppImage' -type f | head -1)"

      - name: The bundled shared data tree resolves and opens
        if: env.INSTALL_KIND == 'appimage'
        # The AppImage is relocatable, so its root is wherever it was unpacked —
        # which is the point of checking it here rather than assuming a prefix.
        #
        # Run through the image's OWN luajit, not the runner's. There is no
        # luajit on this runner at all, which is the situation an AppImage
        # exists for: if the bundled interpreter is missing or unusable, that is
        # a defect in the package and this step is where it should surface.
        shell: bash
        run: |
          set -euo pipefail
          root="$(pwd)/squashfs-root/usr/lib/ergopti"
          luajit_bin="$(pwd)/squashfs-root/usr/bin/luajit"
          if [ ! -x "$luajit_bin" ]; then
              echo "::error::the AppImage bundles no runnable luajit at usr/bin/luajit — it would depend on the target having one."
              exit 1
          fi
          export LUA_PATH="$root/?.lua;$root/?/init.lua;$root/_shared/lua/?.lua;$root/_shared/lua/?/init.lua;;"
          "$luajit_bin" static/ergopti_plus/linux/tests/hardware/installed_layout_check.lua \
              "$root/_shared"

      - name: Record mandatory AppImage smoke evidence
        if: env.INSTALL_KIND == 'appimage'
        shell: bash
        run: |
          node tools/test/linux-ci-evidence.cjs record \
              --job install-linux --output "$RUNNER_TEMP/linux-ci-evidence/smoke-appimage-run.json" \
              --sha "$GITHUB_SHA" --architecture "$RUNNER_ARCH" --distro ubuntu \
              --session unpacked-appimage --interpreter "$(./squashfs-root/usr/bin/luajit -v 2>&1 | head -1)" \
              --subject smoke-appimage-run=1

      - name: Upload mandatory AppImage smoke evidence
        if: env.INSTALL_KIND == 'appimage'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: linux-ci-evidence-smoke-appimage-run
          retention-days: 7
          path: ${{ runner.temp }}/linux-ci-evidence/smoke-appimage-run.json
          if-no-files-found: error
