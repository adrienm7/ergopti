[sg_actions.llm_generate_prediction]
# Asks the AI for a prediction now, from the text typed so far: Windows
# LLM_Menu_TriggerPrediction, macOS the keymap bridge's
# request_manual_prediction, Linux the prediction engine's trigger_now (a
# daemon-injected handler). Each driver logs every refusal (paused, AI off,
# backend not ready, nothing typed) at INFO and shows it, so a binding that
# cannot predict never looks broken.
