            ${{ runner.temp }}/swift-launcher-ci/checkouts
            ${{ runner.temp }}/swift-launcher-ci/repositories
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('static/ergopti_plus/macos/launcher/Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Install scoped Sparkle signing tool
        if: ${{ steps.stage-admission.outcome == 'success' && env.MACOS_STAGE_ROLE == 'item36-native' && (github.event_name == 'workflow_dispatch' && !inputs.release) }}
        shell: bash
