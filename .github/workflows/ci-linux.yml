          sudo python3 "$GITHUB_WORKSPACE/tools/ci/ubuntu_apt.py" -y --no-install-recommends luajit lua-luv python3 xvfb openbox xdotool wmctrl x11-utils x11-xserver-utils coreutils xfonts-base
          else
              exit 1
          fi
        timeout-minutes: 20

      - name: Qualify actual cursor-display window switching
        if: ${{ !cancelled() && matrix.shard == 'input-display' }}
        env:
          ERGOPTI_DEV_RELEASE_RELEASE: ${{ inputs.release }}
          ERGOPTI_DEV_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          ERGOPTI_DEV_RELEASE_CHANNEL: ${{ inputs.channel }}
          ERGOPTI_DEV_RELEASE_TAG: ${{ inputs.tag }}
          ERGOPTI_DEV_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
