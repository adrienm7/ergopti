<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<title data-i18n="editor.hotstrings.window_title"></title>
		<script src="../a11y_prefs.js"></script>
		<script src="../page_locale.js"></script>
		<link rel="stylesheet" href="../theme.css" />
		<script src="../theme_tokens.js"></script>
		<link rel="stylesheet" href="style.css?v=10" />
		<script src="../i18n.js"></script>
		<script src="../host_bridge.js"></script>
		<script src="../dom_utils.js"></script>
	</head>
	<body>
		<!-- The spinner is drawn before the words; both say the page is loading. -->
		<p id="loading" role="status" data-i18n="common.loading"></p>

		<main id="app" style="display: none">
			<header id="hdr">
				<h1 data-i18n="editor.hotstrings.page_title"></h1>
				<button id="compact-btn" class="btn btn-sm btn-s" onclick="toggleCompact()"></button>
				<button
					class="btn btn-sm btn-p"
					onclick="showAddSec()"
					data-i18n="editor.hotstrings.btn_add_section"
				></button>
			</header>
			<search id="search-bar" aria-labelledby="search-label">
				<label
					id="search-label"
					class="theme-sr-only"
					for="search-input"
					data-i18n="editor.hotstrings.search_placeholder"
				></label>
				<input
					id="search-input"
					class="search-input"
					type="text"
					autocomplete="off"
					spellcheck="false"
					data-i18n-placeholder="editor.hotstrings.search_placeholder"
					oninput="onSearch(this.value)"
				/>
				<button
					id="search-clear"
					class="search-clear"
					type="button"
					data-i18n-title="editor.hotstrings.search_clear"
					onclick="clearSearch()"
					style="display: none"
				></button>
			</search>
			<div id="content">
				<!-- The sections in their order, which the user changes. -->
				<ol id="secs-container"></ol>
				<p
					id="empty"
					class="empty"
					style="display: none"
					data-i18n="editor.hotstrings.empty_hint"
				></p>
				<p
					id="no-results"
					class="empty"
					style="display: none"
					data-i18n="editor.hotstrings.no_results"
				></p>
			</div>
			<!-- Says where a section moved by the keyboard now stands. -->
			<p id="move-status" class="theme-sr-only" role="status"></p>
		</main>

		<aside id="bulk-bar" aria-labelledby="bulk-cnt">
			<output id="bulk-cnt" class="bulk-cnt" aria-live="polite"></output>
			<hr class="bulk-sep" />
			<select
				id="bulk-sec-sel"
				class="btn btn-s"
				style="margin: 0; font-weight: normal"
				onchange="if(this.value!=='') bulkMove()"
			>
				<option value="" data-i18n="editor.hotstrings.bulk_move_placeholder"></option>
			</select>
			<button
				class="btn btn-sm btn-bulk-del"
				onclick="bulkDel()"
				data-i18n="common.delete"
			></button>
			<hr class="bulk-sep" />
			<button
				class="btn btn-sm btn-s"
				style="background: transparent; padding: 4px 8px"
				onclick="clearBulk()"
				data-i18n="common.cancel"
			></button>
		</aside>

		<output id="save-toast" data-i18n="common.saved"></output>
		<!-- The suggestions for the token being typed in the output. -->
		<ul id="ac-popup" role="listbox" aria-labelledby="e-out-label"></ul>

		<div class="overlay" id="msg-modal">
			<section class="modal" role="alertdialog" aria-modal="true" aria-describedby="msg-text">
				<p id="msg-text"></p>
				<footer class="modal-foot" style="justify-content: flex-end">
					<button
						class="btn btn-p"
						onclick="closeModal('msg-modal')"
						data-i18n="common.ok"
					></button>
				</footer>
			</section>
		</div>
		<div class="overlay" id="confirm-modal">
			<section
				class="modal"
				role="alertdialog"
				aria-modal="true"
				aria-labelledby="confirm-title"
				aria-describedby="confirm-text"
			>
				<h2 id="confirm-title" class="confirm-title" hidden></h2>
				<p id="confirm-text" class="confirm-text"></p>
				<footer class="modal-foot">
					<button class="btn btn-s" id="confirm-cancel" data-i18n="common.cancel"></button>
					<button class="btn btn-p" id="confirm-ok" data-i18n="common.ok"></button>
				</footer>
			</section>
		</div>
		<div class="overlay" id="sec-modal">
			<section class="modal" role="dialog" aria-modal="true" aria-labelledby="sec-modal-title">
				<h2 id="sec-modal-title" data-i18n="editor.hotstrings.sec_modal_title_new"></h2>
				<p class="fg">
					<label for="sec-id">
						<span data-i18n="editor.hotstrings.sec_id_label"></span>
						<small class="hint" data-i18n="editor.hotstrings.sec_id_hint"></small>
					</label>
					<input
						id="sec-id"
						type="text"
						data-i18n-placeholder="editor.hotstrings.sec_id_placeholder"
						autocomplete="off"
						spellcheck="false"
					/>
					<output class="field-error-msg" id="sec-id-err" for="sec-id"></output>
				</p>
				<p class="fg">
					<label for="sec-desc">
						<span data-i18n="editor.hotstrings.sec_desc_label"></span>
						<small class="hint" data-i18n="editor.hotstrings.sec_desc_hint"></small>
					</label>
					<input
						id="sec-desc"
						type="text"
						data-i18n-placeholder="editor.hotstrings.sec_desc_placeholder"
					/>
				</p>
				<footer class="modal-foot">
					<menu class="foot-btns">
						<li>
							<button
								class="btn btn-s"
								onclick="closeModal('sec-modal')"
								data-i18n="common.cancel"
							></button>
						</li>
						<li>
							<button class="btn btn-p" onclick="saveSec()" data-i18n="common.save"></button>
						</li>
					</menu>
				</footer>
			</section>
		</div>
		<div class="overlay" id="entry-modal">
			<section class="modal" role="dialog" aria-modal="true" aria-labelledby="entry-modal-title">
				<h2 id="entry-modal-title" data-i18n="editor.hotstrings.entry_modal_title_new"></h2>
				<div class="fg">
					<label id="e-trig-label"><span data-i18n="editor.hotstrings.trigger_label"></span></label>
					<div class="trig-row">
						<div
							id="e-trig"
							class="trig-editor"
							contenteditable="true"
							role="textbox"
							aria-labelledby="e-trig-label"
							spellcheck="false"
							data-i18n-placeholder="editor.hotstrings.trigger_placeholder"
						></div>
						<button class="magic-btn" id="magic-btn" onclick="insertMagicKey()"></button>
					</div>
					<output class="field-error-msg" id="trig-err" for="e-trig"></output>
				</div>
				<div class="fg">
					<label id="e-out-label" data-i18n="editor.hotstrings.replacement_label"></label>
					<div class="editor-wrap">
						<p
							id="e-out-ph"
							class="ph-overlay"
							data-i18n="editor.hotstrings.replacement_placeholder"
						></p>
						<!-- The rich editors are not form fields: a role and their label
						     name them for assistive technology (WCAG 1.3.1, 4.1.2). -->
						<div
							id="e-out"
							class="output-editor"
							contenteditable="true"
							spellcheck="false"
							role="textbox"
							aria-multiline="true"
							aria-labelledby="e-out-label"
							aria-controls="ac-popup"
							aria-autocomplete="list"
						></div>
					</div>
					<output class="field-error-msg" id="out-err" for="e-out"></output>
				</div>
				<details class="cmd-help" id="cmd-help">
					<summary data-i18n="editor.hotstrings.special_cmds_summary"></summary>
					<section class="cmd-block" id="cmd-block"></section>
				</details>
				<ul class="cbs">
					<li>
						<label class="cb-item">
							<span class="cb-row"
								><input type="checkbox" id="cb-word" onchange="updateCbDescs()" /><span
									class="cb-label"
									data-i18n="editor.hotstrings.cb_word"
								></span
							></span>
							<small class="cb-desc" id="desc-word"></small>
						</label>
					</li>
					<li>
						<label class="cb-item">
							<span class="cb-row"
								><input type="checkbox" id="cb-auto" onchange="updateCbDescs()" /><span
									class="cb-label"
									data-i18n="editor.hotstrings.cb_auto"
								></span
							></span>
							<small class="cb-desc" id="desc-auto"></small>
						</label>
					</li>
					<li>
						<label class="cb-item">
							<span class="cb-row"
								><input type="checkbox" id="cb-case" onchange="updateCbDescs()" /><span
									class="cb-label"
									data-i18n="editor.hotstrings.cb_case"
								></span
							></span>
							<small class="cb-desc" id="desc-case"></small>
						</label>
					</li>
					<li>
						<label class="cb-item">
							<span class="cb-row"
								><input type="checkbox" id="cb-final" onchange="updateCbDescs()" /><span
									class="cb-label"
									data-i18n="editor.hotstrings.cb_final"
								></span
							></span>
							<small class="cb-desc" id="desc-final"></small>
						</label>
					</li>
				</ul>
				<p class="fg fg-prio">
					<label for="e-prio"
						><span data-i18n="editor.hotstrings.priority_label"></span>
						<small class="hint" data-i18n="editor.hotstrings.priority_hint"></small
					></label>
					<input
						id="e-prio"
						type="number"
						min="0"
						max="100"
						step="1"
						inputmode="numeric"
						autocomplete="off"
					/>
				</p>
				<footer class="modal-foot">
					<p class="foot-kbd" data-i18n="editor.hotstrings.kbd_help"></p>
					<menu class="foot-btns">
						<li>
							<button
								class="btn btn-s"
								onclick="closeModal('entry-modal')"
								data-i18n="common.cancel"
							></button>
						</li>
						<li>
							<button class="btn btn-p" onclick="saveEntry(false)" data-i18n="common.save"></button>
						</li>
					</menu>
				</footer>
			</section>
		</div>

		<script src="script.js?v=3"></script>
	</body>
</html>
