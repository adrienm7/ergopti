# ==============================================================================
# Alias : identifiants Karabiner d'actions déjà présentes sous un autre nom
# ==============================================================================
#
# Mesuré le 2026-08-03 en fusionnant les deux espaces de noms : quatre des
# trente-six actions « manquantes » du catalogue Karabiner ne manquaient pas.
# Elles produisent EXACTEMENT la frappe d'une action déjà déclarée ici :
#
#   return            ≡ enter          (return)
#   delete_fwd        ≡ delete         (forwarddelete)
#   cmd_tab           ≡ app_previous   (cmd+tab)
#   alt_tab_apps_list ≡ app_previous   (cmd+tab — Karabiner déclare lui-même
#                                       deux ids pour un « karabiner_to »
#                                       identique)
#
# Deux autres depuis que macOS bascule sans raccourci (étape de migration
# v5_to_v6) : la même action, atteinte par F17 depuis une touche remappée.
#
#   alt_tab_apps         ≡ app_previous  (alt+F17)
#   cycle_windows_in_app ≡ win_app_next  (F17)
#
# Les déclarer comme lignes aurait mis quatre doublons dans le picker de
# gestes : « ⌦ Suppr. avant » deux fois, à deux endroits, pour la même touche.
# Un espace de noms qui porte deux noms pour une même chose n'en est pas un.
#
# L'alias sert au picker du REMAP, qui est indexé sur les identifiants
# Karabiner : il résout son libellé vers celui de l'action partagée, si bien
# que les deux vocabulaires affichent le même texte sans dupliquer une chaîne
# dans vingt-et-un fichiers de locale.
#
# Ce n'est pas un fourre-tout : test-action-aliases-are-real-duplicates.cjs
# exige que la cible existe, que l'alias ne soit pas lui-même une ligne, et que
# deux lignes n'émettent jamais la même frappe macOS.

[karabiner_aliases]
return = "enter"
delete_fwd = "delete"
