# .github/workflows/release.yml
#
# Builds Ergopti.app (macOS) and ErgoptiPlus.exe (Windows) and attaches both
# to a GitHub Release. Three trigger paths:
#   1. push to dev          — auto-creates a pre-release "dev-{date}-{sha7}".
#   2. release: published   — fired by release-please after main is updated.
#   3. workflow_dispatch    — manual, takes an explicit tag.
#
# The "prepare-release" job is the single source of truth for the tag and
# release: every build job depends on it and reads its outputs.
name: Release Build

on:
    push:
        branches: [dev]
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to build (e.g. v0.1.0)"
                required: true
                default: "v0.1.0"

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false




# ============================================================
# ============================================================
# ======= 1/ Prepare release =================================
# ============================================================
# ============================================================

jobs:
    prepare-release:
        runs-on: ubuntu-latest
        outputs:
            tag:        ${{ steps.meta.outputs.tag }}
            version:    ${{ steps.meta.outputs.version }}
            prerelease: ${{ steps.meta.outputs.prerelease }}
            ref:        ${{ steps.meta.outputs.ref }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Resolve tag / version / channel
              id: meta
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  event="${{ github.event_name }}"
                  prerelease="false"
                  case "$event" in
                      push)
                          # Auto-tag for dev pushes: dev-YYYYMMDD-<short_sha>
                          date_part="$(date -u +%Y%m%d-%H%M%S)"
                          sha="${GITHUB_SHA:0:7}"
                          tag="dev-${date_part}-${sha}"
                          prerelease="true"
                          ref="${GITHUB_SHA}"
                          ;;
                      release)
                          tag="${GITHUB_REF_NAME}"
                          ref="$tag"
                          ;;
                      workflow_dispatch)
                          tag="${{ github.event.inputs.tag }}"
                          ref="$tag"
                          # Anything that does not look like vX.Y.Z is treated as pre-release
                          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                              prerelease="true"
                          fi
                          ;;
                  esac
                  version="${tag#v}"
                  echo "tag=$tag"               >> "$GITHUB_OUTPUT"
                  echo "version=$version"       >> "$GITHUB_OUTPUT"
                  echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
                  echo "ref=$ref"               >> "$GITHUB_OUTPUT"
                  echo "Resolved tag=$tag version=$version prerelease=$prerelease ref=$ref"

            - name: Ensure release exists
              if: ${{ github.event_name != 'release' }}
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  tag="${{ steps.meta.outputs.tag }}"
                  prerelease="${{ steps.meta.outputs.prerelease }}"
                  ref="${{ steps.meta.outputs.ref }}"
                  if gh release view "$tag" >/dev/null 2>&1; then
                      echo "Release '$tag' already exists — skipping creation."
                      exit 0
                  fi
                  echo "Creating release '$tag' (prerelease=$prerelease)…"
                  flags=()
                  [ "$prerelease" = "true" ] && flags+=("--prerelease")
                  gh release create "$tag" \
                      --target "$ref" \
                      --title "Ergopti $tag" \
                      --notes "Build in progress — assets will appear in a few minutes." \
                      "${flags[@]}"




# ============================================================
# ============================================================
# ======= 2/ macOS — Ergopti.app + Sparkle appcast ===========
# ============================================================
# ============================================================

    build-macos:
        needs: prepare-release
        runs-on: macos-latest
        env:
            SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}

        steps:
            - name: Checkout at build ref
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.prepare-release.outputs.ref }}
                  fetch-depth: 0

            - name: Build Ergopti.app
              shell: bash
              env:
                  ERGOPTI_VERSION:    ${{ needs.prepare-release.outputs.version }}
                  ERGOPTI_BUILD:      ${{ github.run_number }}
                  ERGOPTI_CHANNEL:    main
                  SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
                  GH_OWNER:           ${{ github.repository_owner }}
                  GH_REPO:            ${{ github.event.repository.name }}
              run: bash tools/build_macos_app.sh

            - name: Install Sparkle signing tool
              if: ${{ env.SPARKLE_ED_PRIVATE_KEY != '' }}
              shell: bash
              env:
                  SPARKLE_VERSION: "2.9.2"
              run: |
                  set -euo pipefail
                  curl -fsSLo /tmp/Sparkle.tar.xz \
                      "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
                  mkdir -p /tmp/sparkle-dist
                  tar -xJf /tmp/Sparkle.tar.xz -C /tmp/sparkle-dist
                  echo "SIGN_UPDATE=/tmp/sparkle-dist/bin/sign_update" >> "$GITHUB_ENV"

            - name: Sign zip with Sparkle EdDSA key
              if: ${{ env.SPARKLE_ED_PRIVATE_KEY != '' }}
              shell: bash
              run: |
                  set -euo pipefail
                  printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > /tmp/sparkle_priv.key
                  "$SIGN_UPDATE" -f /tmp/sparkle_priv.key build/macos/Ergopti.app.zip \
                      > build/macos/Ergopti.app.zip.sig
                  rm -f /tmp/sparkle_priv.key
                  echo "Sparkle EdDSA signature written to Ergopti.app.zip.sig"

            - name: Generate Sparkle appcast
              if: ${{ env.SPARKLE_ED_PRIVATE_KEY != '' }}
              shell: bash
              env:
                  ERGOPTI_VERSION:  ${{ needs.prepare-release.outputs.version }}
                  ERGOPTI_BUILD:    ${{ github.run_number }}
                  ERGOPTI_CHANNEL:  main
                  SPARKLE_SIG_FILE: build/macos/Ergopti.app.zip.sig
                  ZIP_PATH:         build/macos/Ergopti.app.zip
                  GH_OWNER:         ${{ github.repository_owner }}
                  GH_REPO:          ${{ github.event.repository.name }}
                  OUTPUT_PATH:      build/macos/appcast-main.xml
              run: bash tools/generate_appcast.sh

            - name: Upload macOS assets to release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  tag="${{ needs.prepare-release.outputs.tag }}"
                  assets=(build/macos/Ergopti.app.zip)
                  [ -f build/macos/Ergopti.app.zip.sig ] && assets+=(build/macos/Ergopti.app.zip.sig)
                  [ -f build/macos/appcast-main.xml    ] && assets+=(build/macos/appcast-main.xml)
                  gh release upload "$tag" "${assets[@]}" --clobber




# ============================================================
# ============================================================
# ======= 3/ Windows — ErgoptiPlus.exe =======================
# ============================================================
# ============================================================

    build-windows:
        needs: prepare-release
        runs-on: windows-latest

        steps:
            - name: Checkout at build ref
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.prepare-release.outputs.ref }}
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Regenerate hotstrings_generated.ahk
              run: python tools/compile_hotstrings.py
              shell: bash

            - name: Build static asset bundle
              run: python tools/build_static_bundle.py
              shell: bash

            - name: Stamp BUNDLE_VERSION with release tag
              shell: pwsh
              run: |
                  $version = "${{ needs.prepare-release.outputs.version }}"
                  $bundlePath = "${{ github.workspace }}\static\drivers\autohotkey\lib\bundle.ahk"
                  (Get-Content -Raw -Path $bundlePath).Replace("__BUNDLE_VERSION__", $version) `
                      | Set-Content -Path $bundlePath -Encoding UTF8 -NoNewline
                  Write-Host "BUNDLE_VERSION stamped: $version"

            - name: Download AutoHotkey v2 runtime and Ahk2Exe
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip" -OutFile "$env:TEMP\AHK.zip" -UseBasicParsing
                  Expand-Archive -Path "$env:TEMP\AHK.zip" -DestinationPath "$env:TEMP\AutoHotkey" -Force
                  gh release download --repo AutoHotkey/Ahk2Exe --pattern "*.zip" --dir "$env:TEMP\Ahk2ExeZip"
                  $z = Get-ChildItem "$env:TEMP\Ahk2ExeZip" -Filter "*.zip" | Select-Object -First 1
                  Expand-Archive -Path $z.FullName -DestinationPath "$env:TEMP\Ahk2Exe" -Force

            - name: Compile ErgoptiPlus.ahk
              shell: pwsh
              run: |
                  $ahk2exe = Get-ChildItem "$env:TEMP\Ahk2Exe" -Recurse -Filter "Ahk2Exe.exe" | Select-Object -First 1 -ExpandProperty FullName
                  $runtime = Get-ChildItem "$env:TEMP\AutoHotkey" -Filter "AutoHotkey64.exe" | Select-Object -First 1 -ExpandProperty FullName
                  $in   = "${{ github.workspace }}\static\drivers\autohotkey\ErgoptiPlus.ahk"
                  $out  = "${{ github.workspace }}\static\drivers\autohotkey\ErgoptiPlus.exe"
                  $icon = "${{ github.workspace }}\static\favicon.ico"
                  & $ahk2exe /in $in /out $out /base $runtime /icon $icon
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            - name: Upload Windows EXE to release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release upload "${{ needs.prepare-release.outputs.tag }}" \
                      static/drivers/autohotkey/ErgoptiPlus.exe \
                      --clobber




# ============================================================
# ============================================================
# ======= 4/ Finalize release notes ==========================
# ============================================================
# ============================================================

    finalize-release:
        needs: [prepare-release, build-macos, build-windows]
        runs-on: ubuntu-latest

        steps:
            - name: Write release body with platform sections
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG:      ${{ needs.prepare-release.outputs.tag }}
                  VERSION:  ${{ needs.prepare-release.outputs.version }}
              run: |
                  set -euo pipefail
                  body_file="$(mktemp)"
                  cat > "$body_file" << EOF
                  ## Ergopti $VERSION

                  Select the platform below and download the corresponding file.

                  ---

                  ### 🍎 macOS

                  | Asset | Description |
                  |---|---|
                  | \`Ergopti.app.zip\` | macOS application (Hammerspoon + Karabiner-Elements + Ollama bundled) |
                  | \`Ergopti.app.zip.sig\` | Sparkle EdDSA signature (used by the auto-updater) |
                  | \`appcast-main.xml\` | Sparkle appcast feed (used by the auto-updater) |

                  **Installation:**
                  1. Unzip \`Ergopti.app.zip\` and move \`Ergopti.app\` to \`/Applications\`.
                  2. Remove the quarantine flag (the app is not yet Apple-notarised):
                  \`\`\`bash
                  xattr -dr com.apple.quarantine /Applications/Ergopti.app
                  \`\`\`
                  3. Launch the app. On first run, Karabiner-Elements will request a System Extension approval — required for key remapping.

                  ---

                  ### 🪟 Windows

                  | Asset | Description |
                  |---|---|
                  | \`ErgoptiPlus.exe\` | Compiled AutoHotkey executable (AHK v2 runtime bundled) |

                  **Installation:**
                  1. Download \`ErgoptiPlus.exe\`.
                  2. Double-click to run. On first launch, resources are extracted to \`%LOCALAPPDATA%\Ergopti\`.

                  ---

                  ### 🐧 Linux

                  The Linux driver (XKB) is served directly from the website — no binary asset to download. See the [repository](https://github.com/${GITHUB_REPOSITORY}) for the config sources.

                  ---

                  _Generated by [release.yml](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_
                  EOF
                  gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --notes-file "$body_file"
                  echo "Release notes updated for $TAG"
