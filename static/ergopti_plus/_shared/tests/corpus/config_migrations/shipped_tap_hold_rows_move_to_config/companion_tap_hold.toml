# _shared/tests/corpus/config_migrations/shipped_tap_hold_rows_move_to_config/companion_tap_hold.toml
# What the macOS and Linux writers kept in tap_hold.toml before v22.

[_meta]
schema_version = 1

[mod_combos]
enabled = true
simultaneous_threshold_ms = 80
symmetric = true

[mod_combos.config.escape_then_tab]
combo = "copy"

[tap_hold]
enabled = true
lone_modifier_tap_max_ms = 0
sticky_timeout_ms = 1500
time_activation_seconds = 0.25

[tap_hold.keys.caps_lock]
hold_modifier = "ctrl"
tap_action = "backspace"
