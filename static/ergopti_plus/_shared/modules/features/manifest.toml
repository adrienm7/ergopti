platforms = ["ahk", "hs", "linux"]

[sections.hotstrings.personal]
description_key = "menu.hotstrings.personal"
platforms = ["ahk", "hs", "linux"]

# macOS alone persists optional per-category menu orders; this data has no toggle.
[sections.hotstrings.order_overrides]
description_key = "menu.hotstrings"
platforms = ["hs"]



# ===================
# ===== 2.3 llm =====
# ===================

[sections.llm]
description_key = "menu.llm"
platforms = ["ahk", "hs", "linux"]
