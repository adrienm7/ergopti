[project]
name = "ergopti"
version = "2.2.0"
description = "Ergopti drivers generation and configuration tool"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "colorama>=0.4.6",
    "lxml>=6.1.0",
    "pyyaml>=6.0.3",
    "toml>=0.10.2",
    "windows-curses>=2.4.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.14.3",
    "requests>=2.33.1",
]

[tool.ruff]
# Same width as .prettierrc, so every language wraps at the same column.
line-length = 100
target-version = "py313"
extend-exclude = ["**/vendor/**", "**/_generated/**", ".claude/**"]
# The plain-layout Linux package runs on the user's own interpreter, down to
# install.sh's MIN_PYTHON_MINOR (Ubuntu 20.04's 3.8). Formatting it for py313
# rewrote long `with` statements into the 3.9+ parenthesized form, which broke
# the 3.8 floor and the ubuntu-20.04/22.04 real installs.
per-file-target-version = { "static/ergopti/linux/**/*.py" = "py38" }

[tool.ruff.lint.per-file-ignores]
# Puts its sibling packages on sys.path before importing them.
"static/ergopti/macos/generate_keylayouts.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
