# .github/workflows/release.yml
#
# Builds Ergopti.app (macOS), ErgoptiPlus.exe (Windows), and packages keyboard
# layout files for all three platforms, then attaches everything to a GitHub
# Release. Three trigger paths:
#   1. push to dev          — auto-creates a pre-release "dev-{date}-{sha7}".
#   2. release: published   — fired by release-please after main is updated.
#   3. workflow_dispatch    — manual, takes an explicit tag.
#
# The "prepare-release" job is the single source of truth for the tag and
# release: every build job depends on it and reads its outputs.
name: Release Build

on:
    push:
        branches: [dev]
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to build (e.g. v0.1.0)"
                required: true
                default: "v0.1.0"

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false




# ============================================================
# ============================================================
# ======= 1/ Prepare release =================================
# ============================================================
# ============================================================

jobs:
    prepare-release:
        runs-on: ubuntu-latest
        outputs:
            tag:        ${{ steps.meta.outputs.tag }}
            version:    ${{ steps.meta.outputs.version }}
            prerelease: ${{ steps.meta.outputs.prerelease }}
            ref:        ${{ steps.meta.outputs.ref }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Resolve tag / version / channel
              id: meta
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  event="${{ github.event_name }}"
                  prerelease="false"
                  case "$event" in
                      push)
                          # Auto-tag for dev pushes. Format is intentionally
                          # human-readable (dashes between date parts, an "h"
                          # between hour and minute) so the GitHub releases
                          # page shows "Ergopti dev 2026-05-19 19h02 — fab7976"
                          # instead of the previous unintelligible
                          # "dev-20260519-190225-fab7976". Git tags cannot
                          # contain spaces, so dashes and underscores are the
                          # readable substitutes we have.
                          y="$(date -u +%Y)"
                          m="$(date -u +%m)"
                          d="$(date -u +%d)"
                          h="$(date -u +%H)"
                          n="$(date -u +%M)"
                          sha="${GITHUB_SHA:0:7}"
                          tag="dev-${y}-${m}-${d}-${h}h${n}-${sha}"
                          title="Ergopti dev ${y}-${m}-${d} ${h}h${n} — ${sha}"
                          prerelease="true"
                          ref="${GITHUB_SHA}"
                          ;;
                      release)
                          tag="${GITHUB_REF_NAME}"
                          ref="$tag"
                          title="Ergopti ${tag}"
                          ;;
                      workflow_dispatch)
                          tag="${{ github.event.inputs.tag }}"
                          ref="$tag"
                          title="Ergopti ${tag}"
                          # Anything that does not look like vX.Y.Z is treated as pre-release
                          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                              prerelease="true"
                          fi
                          ;;
                  esac
                  version="${tag#v}"
                  echo "tag=$tag"               >> "$GITHUB_OUTPUT"
                  echo "title=$title"           >> "$GITHUB_OUTPUT"
                  echo "version=$version"       >> "$GITHUB_OUTPUT"
                  echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
                  echo "ref=$ref"               >> "$GITHUB_OUTPUT"
                  echo "Resolved tag=$tag title='$title' version=$version prerelease=$prerelease ref=$ref"

            - name: Ensure release exists
              if: ${{ github.event_name != 'release' }}
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  tag="${{ steps.meta.outputs.tag }}"
                  prerelease="${{ steps.meta.outputs.prerelease }}"
                  ref="${{ steps.meta.outputs.ref }}"
                  if gh release view "$tag" >/dev/null 2>&1; then
                      echo "Release '$tag' already exists — skipping creation."
                      exit 0
                  fi
                  echo "Creating release '$tag' (prerelease=$prerelease)…"
                  flags=()
                  [ "$prerelease" = "true" ] && flags+=("--prerelease")
                  gh release create "$tag" \
                      --target "$ref" \
                      --title "${{ steps.meta.outputs.title }}" \
                      --notes "Build in progress — assets will appear in a few minutes." \
                      "${flags[@]}"




# ============================================================
# ============================================================
# ======= 2/ macOS — Ergopti.app + Sparkle appcast ===========
# ============================================================
# ============================================================

    build-macos:
        needs: prepare-release
        runs-on: macos-latest
        env:
            SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}

        steps:
            - name: Checkout at build ref
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.prepare-release.outputs.ref }}
                  fetch-depth: 0

            - name: Build Ergopti.app
              shell: bash
              env:
                  ERGOPTI_VERSION:    ${{ needs.prepare-release.outputs.version }}
                  ERGOPTI_BUILD:      ${{ github.run_number }}
                  ERGOPTI_CHANNEL:    main
                  SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
                  GH_OWNER:           ${{ github.repository_owner }}
                  GH_REPO:            ${{ github.event.repository.name }}
              run: bash tools/build_macos_app.sh

            - name: Rename macOS zip to ErgoptiPlus.app.zip
              shell: bash
              # The build script still produces ``Ergopti.app.zip`` (the
              # internal .app bundle keeps its historical name), but the user-
              # facing release asset is renamed to ``ErgoptiPlus.app.zip`` so
              # the file makes clear what the user is downloading: the full
              # ErgoptiPlus application, not just the keyboard layout. The
              # Sparkle signing and appcast steps below read from the new
              # path, so the rename has to happen here before they run.
              run: |
                  set -euo pipefail
                  mv build/macos/Ergopti.app.zip build/macos/ErgoptiPlus.app.zip

            - name: Install Sparkle signing tool
              if: ${{ env.SPARKLE_ED_PRIVATE_KEY != '' }}
              shell: bash
              env:
                  SPARKLE_VERSION: "2.9.2"
              run: |
                  set -euo pipefail
                  curl -fsSLo /tmp/Sparkle.tar.xz \
                      "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
                  mkdir -p /tmp/sparkle-dist
                  tar -xJf /tmp/Sparkle.tar.xz -C /tmp/sparkle-dist
                  echo "SIGN_UPDATE=/tmp/sparkle-dist/bin/sign_update" >> "$GITHUB_ENV"

            - name: Sign zip with Sparkle EdDSA key
              if: ${{ env.SPARKLE_ED_PRIVATE_KEY != '' }}
              shell: bash
              run: |
                  set -euo pipefail
                  printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > /tmp/sparkle_priv.key
                  "$SIGN_UPDATE" -f /tmp/sparkle_priv.key build/macos/ErgoptiPlus.app.zip \
                      > build/macos/ErgoptiPlus.app.zip.sig
                  rm -f /tmp/sparkle_priv.key
                  echo "Sparkle EdDSA signature written to ErgoptiPlus.app.zip.sig"

            - name: Generate Sparkle appcast
              if: ${{ env.SPARKLE_ED_PRIVATE_KEY != '' }}
              shell: bash
              env:
                  ERGOPTI_VERSION:  ${{ needs.prepare-release.outputs.version }}
                  ERGOPTI_BUILD:    ${{ github.run_number }}
                  ERGOPTI_CHANNEL:  main
                  SPARKLE_SIG_FILE: build/macos/ErgoptiPlus.app.zip.sig
                  ZIP_PATH:         build/macos/ErgoptiPlus.app.zip
                  GH_OWNER:         ${{ github.repository_owner }}
                  GH_REPO:          ${{ github.event.repository.name }}
                  OUTPUT_PATH:      build/macos/appcast-main.xml
              run: bash tools/generate_appcast.sh

            - name: Package latest keylayout bundle
              shell: bash
              # Released as ``Ergopti.zip`` — this asset is *just* the keyboard
              # layout (no app, no auto-replace, no macros), so its name
              # mirrors the Windows ``Ergopti.exe`` keyboard-only installer
              # for clarity: ``Ergopti`` = bare layout, ``ErgoptiPlus`` = full app.
              run: |
                  set -euo pipefail
                  latest=$(ls -d static/drivers/macos/bundles/*.bundle | sort -V | tail -1)
                  bundle_name=$(basename "$latest")
                  (cd static/drivers/macos/bundles && zip -r "../../../../build/macos/Ergopti.zip" "$bundle_name")
                  echo "Packaged keylayout: $bundle_name → Ergopti.zip"

            - name: Upload macOS assets to release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  tag="${{ needs.prepare-release.outputs.tag }}"
                  assets=(build/macos/ErgoptiPlus.app.zip)
                  [ -f build/macos/ErgoptiPlus.app.zip.sig ] && assets+=(build/macos/ErgoptiPlus.app.zip.sig)
                  [ -f build/macos/appcast-main.xml         ] && assets+=(build/macos/appcast-main.xml)
                  [ -f build/macos/Ergopti.zip              ] && assets+=(build/macos/Ergopti.zip)
                  gh release upload "$tag" "${assets[@]}" --clobber




# ============================================================
# ============================================================
# ======= 3/ Windows — ErgoptiPlus.exe + keyboard layout =====
# ============================================================
# ============================================================

    build-windows:
        needs: prepare-release
        runs-on: windows-latest

        steps:
            - name: Checkout at build ref
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.prepare-release.outputs.ref }}
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Regenerate hotstrings_generated.ahk
              run: python tools/compile_hotstrings.py
              shell: bash

            - name: Build static asset bundle
              run: python tools/build_static_bundle.py
              shell: bash

            - name: Stamp BUNDLE_VERSION with release tag
              shell: pwsh
              run: |
                  $version = "${{ needs.prepare-release.outputs.version }}"
                  $bundlePath = "${{ github.workspace }}\static\drivers\autohotkey\lib\bundle.ahk"
                  (Get-Content -Raw -Path $bundlePath).Replace("__BUNDLE_VERSION__", $version) `
                      | Set-Content -Path $bundlePath -Encoding UTF8 -NoNewline
                  Write-Host "BUNDLE_VERSION stamped: $version"

            - name: Download AutoHotkey v2 runtime and Ahk2Exe
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip" -OutFile "$env:TEMP\AHK.zip" -UseBasicParsing
                  Expand-Archive -Path "$env:TEMP\AHK.zip" -DestinationPath "$env:TEMP\AutoHotkey" -Force
                  gh release download --repo AutoHotkey/Ahk2Exe --pattern "*.zip" --dir "$env:TEMP\Ahk2ExeZip"
                  $z = Get-ChildItem "$env:TEMP\Ahk2ExeZip" -Filter "*.zip" | Select-Object -First 1
                  Expand-Archive -Path $z.FullName -DestinationPath "$env:TEMP\Ahk2Exe" -Force

            - name: Compile ErgoptiPlus.ahk
              shell: pwsh
              run: |
                  $ahk2exe = Get-ChildItem "$env:TEMP\Ahk2Exe" -Recurse -Filter "Ahk2Exe.exe" | Select-Object -First 1 -ExpandProperty FullName
                  $runtime = Get-ChildItem "$env:TEMP\AutoHotkey" -Filter "AutoHotkey64.exe" | Select-Object -First 1 -ExpandProperty FullName
                  $in   = "${{ github.workspace }}\static\drivers\autohotkey\ErgoptiPlus.ahk"
                  $out  = "${{ github.workspace }}\static\drivers\autohotkey\ErgoptiPlus.exe"
                  $icon = "${{ github.workspace }}\static\favicon.ico"
                  & $ahk2exe /in $in /out $out /base $runtime /icon $icon
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            - name: Upload Windows EXE to release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release upload "${{ needs.prepare-release.outputs.tag }}" \
                      static/drivers/autohotkey/ErgoptiPlus.exe \
                      --clobber

            - name: Upload Windows keyboard layout and Kanata config
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  tag="${{ needs.prepare-release.outputs.tag }}"
                  latest_kbd=$(ls static/drivers/windows/Ergopti_v*.exe | sort -V | tail -1)
                  # Final asset name is just ``Ergopti.exe`` — this is the
                  # bare keyboard-layout installer (no driver, no macros), so
                  # it mirrors the macOS ``Ergopti.zip`` and stays clearly
                  # distinct from the ``ErgoptiPlus.exe`` full-driver asset
                  # that lives next to it on the release page.
                  cp "$latest_kbd" static/drivers/windows/Ergopti.exe
                  gh release upload "$tag" \
                      static/drivers/windows/Ergopti.exe \
                      static/drivers/kanata/kanata.kbd \
                      --clobber




# ============================================================
# ============================================================
# ======= 4/ Linux — XKB keyboard layouts ====================
# ============================================================
# ============================================================

    build-linux:
        needs: prepare-release
        runs-on: ubuntu-latest

        steps:
            - name: Checkout at build ref
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.prepare-release.outputs.ref }}
                  fetch-depth: 0

            - name: Package latest XKB files
              shell: bash
              run: |
                  set -euo pipefail
                  latest_dir=$(ls -d static/drivers/linux/v*_* | sort -V | tail -1)
                  dir_name=$(basename "$latest_dir")
                  mkdir -p build/linux
                  (cd static/drivers/linux && zip -r "../../../build/linux/Ergopti_xkb.zip" "$dir_name")
                  echo "Packaged XKB: $dir_name → Ergopti_xkb.zip"

            - name: Upload Linux XKB to release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  gh release upload "${{ needs.prepare-release.outputs.tag }}" \
                      build/linux/Ergopti_xkb.zip \
                      --clobber




# ============================================================
# ============================================================
# ======= 5/ Finalize release notes ==========================
# ============================================================
# ============================================================

    finalize-release:
        needs: [prepare-release, build-macos, build-windows, build-linux]
        runs-on: ubuntu-latest

        steps:
            - name: Write release body with platform sections
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG:      ${{ needs.prepare-release.outputs.tag }}
                  VERSION:  ${{ needs.prepare-release.outputs.version }}
              run: |
                  set -euo pipefail
                  body_file="$(mktemp)"
                  cat > "$body_file" << EOF
                  ## Ergopti $VERSION

                  Select the platform below and download the corresponding file.

                  ---

                  ### 🍎 macOS

                  | Asset | Description |
                  |---|---|
                  | \`ErgoptiPlus.app.zip\` | macOS application (Hammerspoon + Karabiner-Elements bundled) |
                  | \`ErgoptiPlus.app.zip.sig\` | Sparkle EdDSA signature (auto-updater) |
                  | \`appcast-main.xml\` | Sparkle appcast feed (auto-updater) |
                  | \`Ergopti.zip\` | Keyboard layout bundle only — no app required |

                  **Installation — app:**
                  1. Unzip \`ErgoptiPlus.app.zip\` and move \`Ergopti.app\` to \`/Applications\`.
                  2. Remove the quarantine flag (the app is not yet Apple-notarised):
                  \`\`\`bash
                  xattr -dr com.apple.quarantine /Applications/Ergopti.app
                  \`\`\`
                  3. Launch the app. On first run, Karabiner-Elements will request a System Extension approval — required for key remapping.

                  **Installation — keyboard layout only:**
                  1. Unzip \`Ergopti.zip\`.
                  2. Copy the \`.bundle\` folder to \`/Library/Keyboard Layouts/\`.
                  3. Log out and back in, then add the layout in System Settings → Keyboard → Input Sources.

                  ---

                  ### 🪟 Windows

                  | Asset | Description |
                  |---|---|
                  | \`ErgoptiPlus.exe\` | Compiled AutoHotkey executable (AHK v2 runtime bundled) |
                  | \`Ergopti.exe\` | Windows keyboard layout installer — no app required |
                  | \`kanata.kbd\` | Kanata config file (for Kanata users) |

                  **Installation — app:**
                  1. Download \`ErgoptiPlus.exe\`.
                  2. Double-click to run. On first launch, resources are extracted to \`%LOCALAPPDATA%\Ergopti\`.

                  **Installation — keyboard layout only:**
                  1. Download \`Ergopti.exe\` and run it as Administrator.
                  2. Log out and back in, then select the layout in Settings → Time & Language → Language & region.

                  ---

                  ### 🐧 Linux

                  | Asset | Description |
                  |---|---|
                  | \`Ergopti_xkb.zip\` | XKB layout files (standard, ANSI, plus, plus-ANSI variants) |

                  **Installation:**
                  1. Unzip \`Ergopti_xkb.zip\`.
                  2. Follow the [XKB installation guide](https://github.com/${GITHUB_REPOSITORY}/tree/main/static/drivers/linux/xkb_installation) in the repository.

                  ---

                  _Generated by [release.yml](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_
                  EOF
                  gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --notes-file "$body_file"
                  echo "Release notes updated for $TAG"
