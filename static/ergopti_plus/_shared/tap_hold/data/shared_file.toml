# _shared/tap_hold/data/shared_file.toml
# The layout of the user's tap_hold.toml, the one file every driver keeps its
# tap-hold keys in; the manifest's rows live in config.toml (maintainer decision
# of 2026-11-11). SCHEMA.md beside this file is the prose specification; this
# file is the part a reader needs as data.
#
# READ AT RUNTIME BY THE macOS DRIVER through _shared/tap_hold/engine/shared_file.lua,
# which translates the file to and from the Karabiner model of
# macos/keyboard/engine/runtime/config.lua. The Linux driver reads the same file
# directly (platform/remap/tap_hold_loader.lua); the Windows driver will read
# it through its own port (windows/tap_hold/engine/loader.ahk).
#
# Key ids are the catalogue ids of [tap_hold.catalog] in defaults.toml, never a
# driver's own spelling (no `left_control`, no `spacebar`), and a key
# combination is `<first>_then_<second>` over the same ids, the pair id of
# _shared/tap_hold/engine/key_combinations.lua. A driver that has no such key
# leaves its entry untouched.





# =================================
# =================================
# ======= 1. The sections =========
# =================================
# =================================

# Every top-level section the file may hold, and who owns it. A driver writes
# only the leaves it owns and keeps every other byte of meaning, so a file
# carried from one OS to another keeps the settings of both.
[layout]
file_name = "tap_hold.toml"
# The version stamp, owned by _shared/tap_hold/data/migrations.toml.
meta_section = "_meta"
# Keys and the global delay: every driver. The Tap-Holds switch and the sticky
# and lone-tap timings are config.toml [tap_holds] rows since schema v22.
tap_hold_section = "tap_hold"
# Key combinations: a config.toml section on every driver since config.toml
# schema v22. Named here so a reader reports a copy left in tap_hold.toml.
combos_section = "mod_combos"
# « Ergopti uses Karabiner » and the runtime choice: macOS only.
karabiner_section = "karabiner"





# =================================
# =================================
# ======= 2. Hold modifiers =======
# =================================
# =================================

# A hold modifier is written as the modifiers it holds, joined with "+", in
# this order, whatever order the user typed them in. The first five are the
# hold picker's ([tap_hold.hold_picker] modifiers); `cmd` and `fn` are the two
# macOS modifiers Windows and Linux have no key for: a file carrying them keeps
# them, and those drivers warn once and hold nothing on that key.
[modifiers]
order = ["ctrl", "shift", "alt", "alt_gr", "win", "cmd", "fn"]

# The macOS action catalogue (macos/keyboard/data/actions.json) names its
# modifiers in `modifiers`; each maps to one shared name.
hs_names = { ctrl = "ctrl", shift = "shift", option = "alt", cmd = "cmd", fn = "fn" }

# macOS holds that are a modifier but carry no `modifiers` list in the action
# catalogue: their shared hold_modifier.
hs_hold_actions = { altgr = "alt_gr" }





# =================================
# =================================
# ======= 3. Thumb keys ===========
# =================================
# =================================

# A thumb-key setting follows the key at the same place under the thumb
# (maintainer decision TCL-004 of 2026-11-12, « follow the position »): each
# Mac thumb key of [tap_hold.catalog] is written under the PC key at its
# position. macOS translates on read and write; a file still holding a Mac
# thumb id is read as its positional key by every driver, and the positional
# entry wins when both are there. Keys: catalogue ids with only a macOS column;
# values: catalogue ids with no macOS column.
[thumb_positions]
left_command = "left_alt"
right_command = "alt_gr"
right_option = "right_ctrl"
