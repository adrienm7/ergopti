# .github/workflows/ci-windows.yml
#
# Windows lane: unit tests -> E2E tests -> package -> install and launch -> verdict.
# The two suites have independent runtimes and fresh checkouts. Packaging never
# consumes their generated caches. Every run compiles the application; release
# runs additionally sign it. The launch job downloads assets-windows and runs
# that exact executable on a fresh host with its normal Defender settings.
# The verdict requires all four jobs and a successful launch of this commit.
# Parent ci.yml owns concurrency; this workflow must not cancel its caller.

name: Windows

on:
  workflow_call:
    inputs:
      release:
        description: True when ci.yml's plan resolved a free release tag
        required: true
        type: boolean
      version:
        description: Release version without the leading v; empty unless release
        required: true
        type: string
      tag:
        description: Release tag; empty unless release
        required: true
        type: string
      prerelease:
        description: "'true' for a dev prerelease; empty unless release"
        required: true
        type: string
      channel:
        description: Update channel stamped into the exe, main or dev
        required: true
        type: string
    secrets:
      WINDOWS_SIGNING_CERTIFICATE_BASE64:
        description: Code-signing PFX, base64; passed on release runs only
        required: false
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD:
        description: Password of the code-signing PFX; passed on release runs only
        required: false
      WINDOWS_SIGNER_SUBJECT:
        description: Expected Authenticode subject; passed on release runs only
        required: false

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────
  # 1) AHK unit, native and contract tests
  # ─────────────────────────────────────────────────
  test-ahk:
    name: 'Unit tests'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and test native navigation event owner
        shell: pwsh
        run: ./tools/build/build_windows_nav_owner.ps1

      - name: Prepare native PAC source generator
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build and test native full-URL PAC evaluator
        id: native-pac-build
        shell: pwsh
        run: ./tools/build/build_windows_network_pac.ps1 -Publish

      - name: Retain native PAC artifact and source identity
        if: ${{ always() && steps.native-pac-build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-pac-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            static/ergopti_plus/windows/vendor/ergopti_network_pac.exe
            static/ergopti_plus/windows/vendor/ergopti_network_pac.json
            static/ergopti_plus/windows/vendor/ergopti_network_pac.LICENSE.txt
            static/ergopti_plus/windows/build/native/network_pac/artifact_receipt.json

      # The suites run on the interpreter the release exe ships with: its
      # version, archive and digest come from the one release contract, so a
      # runtime bump cannot leave the tests on the old interpreter (the hook's
      # prefix and key-up rules changed between 2.0.19 and 2.0.23).
      - name: Read AutoHotkey runtime contract
        id: ahk-contract
        shell: pwsh
        run: |
          $contractPath = "${{ github.workspace }}\static\ergopti_plus\_shared\modules\updater\windows_release_toolchain.json"
          $contract = Get-Content -LiteralPath $contractPath -Raw | ConvertFrom-Json
          "version=$($contract.runtime.version)" >> $env:GITHUB_OUTPUT
          "url=$($contract.runtime.url)" >> $env:GITHUB_OUTPUT
          "sha256=$($contract.runtime.sha256)" >> $env:GITHUB_OUTPUT

      - name: Cache AutoHotkey runtime
        id: cache-ahk
        uses: actions/cache@v4
        with:
          path: C:\AutoHotkey
          key: ahk-${{ steps.ahk-contract.outputs.version }}-${{ steps.ahk-contract.outputs.sha256 }}-windows

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Run reporter lifecycle self-tests
        shell: pwsh
        run: node tools/test/test-report.cjs

      - run: npm ci
        shell: pwsh

      - name: Build features manifest
        run: npm run build:manifest
        shell: pwsh

      - name: Manifest parity (AHK ↔ HS codegen equivalence)
        run: npm run test:manifest-parity
        shell: pwsh

      - name: Download AutoHotkey v2 runtime
        if: steps.cache-ahk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest `
              -Uri "${{ steps.ahk-contract.outputs.url }}" `
              -OutFile "$env:TEMP\AHK.zip" -UseBasicParsing
          $actual = (Get-FileHash -LiteralPath "$env:TEMP\AHK.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne "${{ steps.ahk-contract.outputs.sha256 }}") {
              throw "AutoHotkey v${{ steps.ahk-contract.outputs.version }} archive digest mismatch: $actual"
          }
          Expand-Archive -Path "$env:TEMP\AHK.zip" -DestinationPath "C:\AutoHotkey" -Force

      - name: Verify AHK source encoding (UTF-8 BOM + LF)
        # AHK v2 silently aborts mid-file on encoding drift — catch it
        # before it causes silent test failures with no error message.
        shell: pwsh
        run: |
          $ahkFiles = Get-ChildItem `
              -Path "${{ github.workspace }}\static\ergopti_plus\windows" `
              -Recurse -Filter "*.ahk" |
              Where-Object { -not $_.FullName.Contains("vendor") }
          $failures = @()
          foreach ($file in $ahkFiles) {
              $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
              if ($bytes.Length -lt 3 -or
                  $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
                  $failures += "MISSING BOM : $($file.FullName)"; continue
              }
              $content = [System.IO.File]::ReadAllText(
                  $file.FullName, [System.Text.Encoding]::UTF8)
              if ($content -match "`r") {
                  $failures += "CR BYTE : $($file.FullName)"
              }
          }
          if ($failures.Count -gt 0) {
              $failures | ForEach-Object { Write-Host "  $_" }
              Write-Error "AHK encoding violations detected."
              exit 1
          }
          Write-Host "Encoding OK — $($ahkFiles.Count) file(s) verified."

      - name: Disable Windows Defender real-time scanning for AHK tests
        shell: pwsh
        run: |
          # Defender holds intermittent exclusive scan locks on any file the AHK
          # test suite writes — including temp files in A_Temp — causing FileRead /
          # FileAppend calls to block for the full 240 s watchdog window.
          # -DisableRealtimeMonitoring requires admin; add path exclusions as a
          # belt-and-suspenders fallback that works even without that flag.
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:TEMP"           -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "AutoHotkey64.exe" -ErrorAction SilentlyContinue
          Write-Host "Defender exclusions applied."

      - name: Install the shipped Kana layout for real probes
        shell: pwsh
        timeout-minutes: 3
        run: ./tools/test/install-ci-kana-layout.ps1

      - name: Run AHK test suite
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ahk = Get-ChildItem "C:\AutoHotkey" -Filter "AutoHotkey64.exe" |
              Select-Object -First 1 -ExpandProperty FullName
          if (-not $ahk) { Write-Error "AutoHotkey64.exe not found."; exit 2 }
          node "${{ github.workspace }}\tools\test\test-ahk-suite-manifest.cjs" --ahk $ahk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runner = "${{ github.workspace }}\static\ergopti_plus\windows\tests\run_all.ahk"
          if (-not (Test-Path $runner)) {
              Write-Error "Test runner not found at $runner"; exit 2
          }
          $resultsFile = "$env:TEMP\ergopti_test_results.txt"
          $env:ERGOPTI_AHK_RESULTS_FILE = $resultsFile
          Remove-Item $resultsFile -Force -ErrorAction SilentlyContinue
          Write-Host "AHK runtime : $ahk"
          Write-Host "Test runner : $runner"
          Write-Host "------------------------------------------------------------"
          # AHK writes TAP output to test_results.txt (FileAppend to "*"/stdout
          # blocks when AHK runs without an inherited console handle, so the
          # file is the only reliable output channel in CI).
          # FileAppend owns an exclusive handle; read the transcript only after exit.
          # /ErrorStdOut routes load-time (parse / nonexistent-function / missing
          # #Include) errors to stderr and exits non-zero instead of popping a modal
          # dialog that no one can dismiss headlessly — which otherwise hangs the
          # runner until the 15 min step timeout. Must precede the script path.
          $proc = Start-Process -FilePath $ahk -ArgumentList "/ErrorStdOut `"$runner`"" -NoNewWindow -PassThru
          # Retain the native handle while the asynchronous child is alive.
          $null = $proc.Handle
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          while (-not $proc.HasExited) {
              Start-Sleep -Milliseconds 100
          }
          $proc.WaitForExit()
          $exit = $proc.ExitCode
          if ($null -eq $exit) {
              Write-Host "::error::AHK native process exit receipt is unavailable."
              exit 2
          }
          Write-Host "------------------------------------------------------------"
          Write-Host "AHK exit code: $exit"
          if (-not (Test-Path $resultsFile)) {
              Write-Error "test_results.txt not created — AHK may have crashed at startup."; exit 2
          }
          Get-Content -LiteralPath $resultsFile -Encoding utf8 | ForEach-Object { Write-Host $_ }
          $summary = Get-Content $resultsFile | Select-String "^#" | Select-Object -Last 1
          Write-Host $summary
          $manifestFile = "$env:RUNNER_TEMP\windows-ahk-execution-manifest.json"
          node "${{ github.workspace }}\tools\test\validate-ahk-suite-manifest.cjs" `
              --input $resultsFile --json $manifestFile
          $manifestExit = $LASTEXITCODE
          if ($manifestExit -ne 0) {
              Write-Error "AHK planned/executed manifest is incomplete."; exit $manifestExit
          }
          if ($exit -ne 0) {
              Write-Host "::error::AHK native process failed (exit $exit)."
              Write-Error "Test suite failed (exit $exit)."; exit $exit
          }

      # The isolated LLM suites. They cannot join run_all.ahk: each installs
      # its own global stubs (a WebView2 stand-in, a fake model index) that would
      # collide with the shared harness, which is why they were written as
      # separate runners in the first place. They were then referenced by
      # nothing, so their ten tests had never run and one of them had rotted out
      # of the code it stubs. tools/test/test-ahk-runners-are-invoked.cjs now
      # fails if a runner under tests/ is referenced by nothing at all.
      - name: Run isolated AHK LLM suites
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ahk = Get-ChildItem "C:\AutoHotkey" -Filter "AutoHotkey64.exe" |
              Select-Object -First 1 -ExpandProperty FullName
          if (-not $ahk) { Write-Error "AutoHotkey64.exe not found."; exit 2 }
          $tests = "${{ github.workspace }}\static\ergopti_plus\windows\tests"
          $failed = 0
          foreach ($name in @("run_llm_model_browser.ahk", "run_llm_model_menu_disabled.ahk", "run_llm_pointer_dismiss.ahk")) {
              $runner = Join-Path $tests $name
              if (-not (Test-Path $runner)) { Write-Error "Runner not found: $runner"; exit 2 }
              $out = "$env:TEMP\$name.out"
              $err = "$env:TEMP\$name.err"
              # Keep the main suite's TAP intact for its later annotation.
              $env:ERGOPTI_AHK_RESULTS_FILE = Join-Path $env:RUNNER_TEMP "windows-ahk-isolated-$name.txt"
              # Start-Process, not the call operator: AutoHotkey is a GUI-subsystem
              # binary, so a direct invocation returns neither the exit code nor
              # stderr (PROJECT_MEMORY, feedback_ahk_ui_syntax_validation).
              $proc = Start-Process -FilePath $ahk -ArgumentList @("/ErrorStdOut", $runner) `
                  -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
              Write-Host "--- $name (exit $($proc.ExitCode)) ---"
              if (Test-Path $out) { Get-Content $out | Write-Host }
              if (Test-Path $err) { Get-Content $err | Write-Host }
              if ($proc.ExitCode -ne 0) { $failed += 1 }
              $manifestFile = Join-Path $env:RUNNER_TEMP "windows-ahk-isolated-$name.json"
              node "${{ github.workspace }}\tools\test\validate-ahk-suite-manifest.cjs" `
                  --input $env:ERGOPTI_AHK_RESULTS_FILE --json $manifestFile
              if ($LASTEXITCODE -ne 0) { $failed += 1 }
          }
          if ($failed -gt 0) { Write-Error "$failed isolated LLM suite(s) failed."; exit 1 }

      # Emit GitHub annotations + a JSON summary from the captured TAP. Purely
      # additive (continue-on-error): the step above remains the gate, so a
      # reporter hiccup can never flip a red run green or vice-versa.
      - name: Annotate AHK results
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $resultsFile = "$env:TEMP\ergopti_test_results.txt"
          if (Test-Path $resultsFile) {
              node "${{ github.workspace }}\tools\test\report.cjs" --name windows-ahk --json "$env:RUNNER_TEMP\windows-ahk.json" -- PARSE_FILE $resultsFile
          } else {
              Write-Host "No AHK results file to annotate."
          }

      - name: Publish AHK execution manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: windows-ahk-execution-manifest
          path: |
            ${{ runner.temp }}/windows-ahk-execution-manifest.json
            ${{ runner.temp }}/windows-ahk-isolated-*.json
            ${{ runner.temp }}/ergopti-ahk-menu-lifecycle-*/**
          if-no-files-found: warn

      - name: Check for AHK compiler warnings
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ahk = Get-ChildItem "C:\AutoHotkey" -Filter "AutoHotkey64.exe" |
              Select-Object -First 1 -ExpandProperty FullName
          $runner = "${{ github.workspace }}\static\ergopti_plus\windows\tests\run_all.ahk"
          # Pass --dry-run so AHK parses all files and emits warnings, then
          # exits immediately without running any Test() callbacks. This keeps
          # the warning check fast (~seconds) regardless of corpus size.
          # /ErrorStdOut keeps a parse/load error from popping a modal dialog that
          # would hang this step headlessly; the error text is captured via 2>&1.
          $output = & cmd /c "`"$ahk`" /ErrorStdOut `"$runner`" --dry-run 2>&1"
          $warnings = $output | Where-Object { $_ -match "^Warning:" }
          $errors   = $output | Where-Object { $_ -match "^Error:" }
          if ($errors) {
              $errors | ForEach-Object { Write-Host "  $_" }
              Write-Error "$($errors.Count) AHK load-time error(s) — fix before merging."
              exit 1
          }
          if ($warnings) {
              $warnings | ForEach-Object { Write-Host "  $_" }
              Write-Error "$($warnings.Count) AHK compiler warning(s) — fix before merging."
              exit 1
          }
          Write-Host "No AHK compiler warnings."

      # hardening-a-startup-zero-error: the real ErgoptiPlus.ahk auto-execute
      # path, booted over a fresh folder, the neutral defaults and config.toml
      # files older releases wrote, must reach ready with no ERROR logged. The
      # JS suite runs on Linux, where this smoke can only skip, so it runs here.
      - name: Run the full-driver startup smoke
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ahk = Get-ChildItem "C:\AutoHotkey" -Filter "AutoHotkey64.exe" |
              Select-Object -First 1 -ExpandProperty FullName
          if (-not $ahk) { Write-Error "AutoHotkey64.exe not found."; exit 2 }
          $env:ERGOPTI_AHK_EXE = $ahk
          node tools/test/test-ahk-full-startup-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test fresh Git clone bootstrap and warm startup
        shell: pwsh
        timeout-minutes: 24
        run: |
          $ahk = Get-ChildItem "C:\AutoHotkey" -Filter "AutoHotkey64.exe" |
              Select-Object -First 1 -ExpandProperty FullName
          if (-not $ahk) { throw "AutoHotkey64.exe not found." }
          $env:ERGOPTI_AHK_EXE = $ahk
          node tools/test/test-ahk-fresh-clone-startup.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  e2e-ahk:
    name: 'E2E tests (engine)'
    needs: [test-ahk]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read E2E runtime contract
        id: ahk-contract
        shell: pwsh
        run: |
          $contractPath = "${{ github.workspace }}\static\ergopti_plus\_shared\modules\updater\windows_release_toolchain.json"
          $contract = Get-Content -LiteralPath $contractPath -Raw | ConvertFrom-Json
          "version=$($contract.runtime.version)" >> $env:GITHUB_OUTPUT
          "url=$($contract.runtime.url)" >> $env:GITHUB_OUTPUT
          "sha256=$($contract.runtime.sha256)" >> $env:GITHUB_OUTPUT

      - name: Cache E2E runtime
        id: cache-ahk
        uses: actions/cache@v4
        with:
          path: C:\AutoHotkey
          key: ahk-${{ steps.ahk-contract.outputs.version }}-${{ steps.ahk-contract.outputs.sha256 }}-windows

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - run: npm ci
        shell: pwsh

      - name: Build E2E features manifest
        run: npm run build:manifest
        shell: pwsh

      - name: Download E2E runtime
        if: steps.cache-ahk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest `
              -Uri "${{ steps.ahk-contract.outputs.url }}" `
              -OutFile "$env:TEMP\AHK.zip" -UseBasicParsing
          $actual = (Get-FileHash -LiteralPath "$env:TEMP\AHK.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne "${{ steps.ahk-contract.outputs.sha256 }}") {
              throw "AutoHotkey v${{ steps.ahk-contract.outputs.version }} archive digest mismatch: $actual"
          }
          Expand-Archive -Path "$env:TEMP\AHK.zip" -DestinationPath "C:\AutoHotkey" -Force

      - name: Run E2E suite (Strategy A — pure engine injection)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ahk = Get-ChildItem "C:\AutoHotkey" -Filter "AutoHotkey64.exe" |
              Select-Object -First 1 -ExpandProperty FullName
          if (-not $ahk) { Write-Error "AutoHotkey64.exe not found."; exit 2 }
          $runner = "${{ github.workspace }}\static\ergopti_plus\windows\tests\e2e\run_e2e.ahk"
          $resultsFile = "${{ github.workspace }}\static\ergopti_plus\windows\tests\e2e\test_results.txt"
          Remove-Item $resultsFile -Force -ErrorAction SilentlyContinue
          Write-Host "AHK runtime : $ahk"
          Write-Host "E2E runner  : $runner"
          Write-Host "------------------------------------------------------------"
          # Same approach as the unit test suite: AHK writes TAP output to
          # test_results.txt (FileAppend to "*" blocks without a console handle).
          # FileAppend owns an exclusive handle; read the transcript only after exit.
          # /ErrorStdOut: see unit-test step — fail fast on load errors instead of
          # hanging on an undismissable modal dialog in the headless runner.
          $proc = Start-Process -FilePath $ahk -ArgumentList "/ErrorStdOut `"$runner`"" -NoNewWindow -PassThru
          # Retain the native handle while the asynchronous child is alive.
          $null = $proc.Handle
          while (-not $proc.HasExited) {
              Start-Sleep -Milliseconds 100
          }
          $proc.WaitForExit()
          $exit = $proc.ExitCode
          if ($null -eq $exit) {
              Write-Host "::error::AHK native process exit receipt is unavailable."
              exit 2
          }
          Write-Host "------------------------------------------------------------"
          Write-Host "Exit code: $exit"
          if (-not (Test-Path $resultsFile)) {
              Write-Error "test_results.txt not created — AHK may have crashed at startup."; exit 2
          }
          Get-Content -LiteralPath $resultsFile -Encoding utf8 | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) {
              Write-Host "::error::AHK E2E native process failed (exit $exit)."
              Write-Error "E2E suite failed (exit $exit)."; exit $exit
          }

      - name: Validate complete native E2E corpus execution
        shell: pwsh
        run: |
          node tools/test/validate-ahk-e2e-manifest.cjs --input "$env:GITHUB_WORKSPACE/static/ergopti_plus/windows/tests/e2e/test_results.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ─────────────────────────────────────────────────
  # 3) Build the executable once; sign releases
  # ─────────────────────────────────────────────────
  # Its own job on a fresh checkout, never a tail of test-ahk: the unit and E2E
  # suites write runtime caches next to tracked sources (locale .tsv files,
  # generated_hotstrings.tsv, _generated/prefetch_*.json), and
  # build_static_bundle.py bundles those directories, so a shared workspace
  # would ship test leftovers inside the signed exe. A fresh runner also keeps
  # the launch on the image's own Defender configuration, which the test job
  # alters; nothing here disables or restores Defender.
  package-windows:
    name: 'Package'
    needs: [e2e-ahk]
    runs-on: windows-latest

    steps:
      # A shallow clone: no step of this job reads git history.
      - uses: actions/checkout@v4

      - name: Build and test native navigation event owner
        shell: pwsh
        run: ./tools/build/build_windows_nav_owner.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and test native full-URL PAC evaluator
        shell: pwsh
        run: ./tools/build/build_windows_network_pac.ps1 -Publish

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci
        shell: bash

      - name: Generate features manifest
        run: npm run build:manifest
        shell: bash

      - name: Build static asset bundle
        run: python tools/build/build_static_bundle.py
        shell: bash

      - name: Stamp BUNDLE_VERSION, BUNDLE_RELEASE_URL, BUNDLE_CHANNEL
        shell: pwsh
        run: |
          $version = "${{ inputs.version || '0.0.0-dev' }}"
          $tag     = "${{ inputs.tag }}"
          if (-not $tag) { $tag = $version }
          # ci.yml's plan owns the one prerelease-to-channel rule. The updater
          # silently treats an empty or unknown channel as dev, so a bad input
          # would put a stable exe on the dev feed without any error.
          $channel = "${{ inputs.channel }}"
          if ($channel -cne 'main' -and $channel -cne 'dev') {
              throw "inputs.channel must be 'main' or 'dev', got '$channel'."
          }
          $owner   = "${{ github.repository_owner }}"
          $repo    = "${{ github.event.repository.name }}"
          $releaseUrl = "https://github.com/$owner/$repo/releases/tag/$tag"
          $bundlePath = "${{ github.workspace }}\static\ergopti_plus\windows\infra\bundle.ahk"
          $text = Get-Content -Raw -Path $bundlePath
          $text = $text.Replace("__BUNDLE_VERSION__",     $version)
          $text = $text.Replace("__BUNDLE_RELEASE_URL__", $releaseUrl)
          $text = $text.Replace("__BUNDLE_CHANNEL__",     $channel)
          $text = $text.Replace("__BUNDLE_COMMIT__",      "${{ github.sha }}")
          [IO.File]::WriteAllText($bundlePath, $text, [Text.UTF8Encoding]::new($true))
          Write-Host "BUNDLE_COMMIT      stamped: ${{ github.sha }}"
          Write-Host "BUNDLE_VERSION     stamped: $version"
          Write-Host "BUNDLE_RELEASE_URL stamped: $releaseUrl"
          Write-Host "BUNDLE_CHANNEL     stamped: $channel"

      - name: Download the authenticated compiler toolchain
        shell: pwsh
        run: |
          $contractPath = "${{ github.workspace }}\static\ergopti_plus\_shared\modules\updater\windows_release_toolchain.json"
          $contract = Get-Content -LiteralPath $contractPath -Raw | ConvertFrom-Json
          $runtimeUrl = $contract.runtime.url
          $runtimeSha256 = $contract.runtime.sha256
          $compilerTag = $contract.compiler.tag
          $compilerAsset = $contract.compiler.asset
          $compilerUrl = $contract.compiler.url
          $compilerSha256 = $contract.compiler.sha256
          $runtimeArchive = "$env:TEMP\$($contract.runtime.asset)"
          $compilerArchive = "$env:TEMP\$compilerAsset"

          Invoke-WebRequest -Uri $runtimeUrl -OutFile $runtimeArchive -UseBasicParsing
          Invoke-WebRequest -Uri $compilerUrl -OutFile $compilerArchive -UseBasicParsing
          $runtimeActual = (Get-FileHash -LiteralPath $runtimeArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          $compilerActual = (Get-FileHash -LiteralPath $compilerArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($runtimeActual -cne $runtimeSha256) {
              throw "AutoHotkey v$($contract.runtime.version) archive digest mismatch: $runtimeActual"
          }
          if ($compilerActual -cne $compilerSha256) {
              throw "Ahk2Exe $compilerTag archive digest mismatch: $compilerActual"
          }

          Expand-Archive -LiteralPath $runtimeArchive -DestinationPath "$env:TEMP\AutoHotkey" -Force
          Expand-Archive -LiteralPath $compilerArchive -DestinationPath "$env:TEMP\Ahk2Exe" -Force
          if (-not (Test-Path -LiteralPath "$env:TEMP\AutoHotkey\AutoHotkey64.exe" -PathType Leaf)) {
              throw "The authenticated AutoHotkey archive has no expected runtime."
          }
          if (-not (Test-Path -LiteralPath "$env:TEMP\Ahk2Exe\Ahk2Exe.exe" -PathType Leaf)) {
              throw "The authenticated Ahk2Exe archive has no expected compiler."
          }
          Write-Host "Authenticated compiler toolchain: AutoHotkey v$($contract.runtime.version) + $compilerTag"

      - name: Compile ErgoptiPlus.ahk
        shell: pwsh
        # Without it, -Wait below would hold a stuck compiler until the job's
        # six-hour default timeout.
        timeout-minutes: 5
        run: |
          $ahk2exe = "$env:TEMP\Ahk2Exe\Ahk2Exe.exe"
          $runtime = "$env:TEMP\AutoHotkey\AutoHotkey64.exe"
          $in   = "${{ github.workspace }}\static\ergopti_plus\windows\ErgoptiPlus.ahk"
          $out  = "${{ github.workspace }}\static\ergopti_plus\windows\ErgoptiPlus.exe"
          $icon = "${{ github.workspace }}\static\favicon.ico"
          $stdout = "$env:RUNNER_TEMP\ahk2exe_stdout.txt"
          $stderr = "$env:RUNNER_TEMP\ahk2exe_stderr.txt"
          # /silent suppresses any Ahk2Exe GUI dialogs that would block
          # indefinitely on a headless runner and cause a silent non-zero exit.
          # Start-Process -Wait -PassThru, not the call operator: Ahk2Exe is a
          # GUI-subsystem binary, so `& $ahk2exe` returned before it finished
          # and left $LASTEXITCODE unset. The former `exit $LASTEXITCODE` guard
          # then exited 0 before the output check below, so a failed compile
          # passed. Both output streams are printed so a failure shows the
          # compiler's own message.
          $proc = Start-Process -FilePath $ahk2exe `
              -ArgumentList @("/in", "`"$in`"", "/out", "`"$out`"", "/base", "`"$runtime`"", "/icon", "`"$icon`"", "/silent") `
              -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout | Write-Host }
          if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr | Write-Host }
          if ($proc.ExitCode -ne 0) {
              Write-Error "Ahk2Exe failed with exit code $($proc.ExitCode)."
              exit 1
          }
          # Verify the EXE was actually produced — Ahk2Exe can exit 0 on a
          # compilation warning without writing the output file.
          if (-not (Test-Path -LiteralPath $out -PathType Leaf) -or (Get-Item -LiteralPath $out).Length -eq 0) {
              Write-Error "Ahk2Exe exited 0 but $out is missing or empty."
              exit 1
          }
          Write-Host "Compiled: $out ($('{0:N0}' -f (Get-Item -LiteralPath $out).Length) bytes)"

      - name: Sign and verify ErgoptiPlus.exe
        if: inputs.release
        shell: pwsh
        env:
          ERGOPTI_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNER_SUBJECT: ${{ secrets.WINDOWS_SIGNER_SUBJECT }}
        run: |
          $required = @(
              "WINDOWS_SIGNING_CERTIFICATE_BASE64",
              "WINDOWS_SIGNING_CERTIFICATE_PASSWORD",
              "WINDOWS_SIGNER_SUBJECT")
          $missing = @($required | Where-Object {
              [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })

          if ($missing.Count -eq $required.Count) {
              if ($env:ERGOPTI_RELEASE_PRERELEASE -ceq "true") {
                  Write-Warning "Publishing an unsigned Windows artifact for the dev prerelease channel."
                  exit 0
              }
              throw "Stable Windows releases require every signing secret."
          }
          if ($missing.Count -gt 0) {
              throw "Partial Windows signing configuration; missing: $($missing -join ', ')."
          }

          $exe = "${{ github.workspace }}\static\ergopti_plus\windows\ErgoptiPlus.exe"
          $pfx = "$env:RUNNER_TEMP\ergopti-windows-signing.pfx"
          $signTools = @(Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Recurse -Filter "signtool.exe" -File |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending)
          if ($signTools.Count -eq 0) {
              throw "No x64 signtool.exe was found on the Windows runner."
          }
          $signTool = $signTools[0].FullName

          try {
              [IO.File]::WriteAllBytes(
                  $pfx,
                  [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
              & $signTool sign /fd SHA256 /td SHA256 `
                  /tr "https://timestamp.digicert.com" `
                  /f $pfx /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD $exe
              if ($LASTEXITCODE -ne 0) {
                  throw "signtool failed with exit code $LASTEXITCODE."
              }
          } finally {
              Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          if ($signature.Status -ne 'Valid') {
              throw "ErgoptiPlus.exe Authenticode status is '$($signature.Status)', expected 'Valid'."
          }
          if ($null -eq $signature.SignerCertificate -or
              $signature.SignerCertificate.Subject -cne $env:WINDOWS_SIGNER_SUBJECT) {
              throw "Unexpected Authenticode publisher '$($signature.SignerCertificate.Subject)'."
          }
          Write-Host "Verified Authenticode publisher: $($signature.SignerCertificate.Subject)"

      - name: Rename the keyboard layout for upload
        shell: bash
        run: |
          set -euo pipefail
          latest_kbd=$(ls static/ergopti/windows/Ergopti_v*.exe | sort -V | tail -1)
          cp "$latest_kbd" static/ergopti/windows/Ergopti_windows.exe

      - name: Upload the application and layout
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: assets-windows
          retention-days: 7
          if-no-files-found: error
          path: |
            static/ergopti_plus/windows/ErgoptiPlus.exe
            static/ergopti/windows/Ergopti_windows.exe

  launch-windows:
    name: 'Install and launch'
    needs: [package-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Set up Python for native catalogue reads
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the compiled application
        uses: actions/download-artifact@v4
        with:
          name: assets-windows
          path: ${{ runner.temp }}/package

      - name: Test native compiled startup admission
        shell: pwsh
        timeout-minutes: 3
        run: node tools/test/test-desktop-ci-evidence.cjs

      - name: Smoke test compiled ErgoptiPlus.exe (crash-on-launch guard)
        id: compiled-startup
        # The unit test suite (test-ahk job) runs against source .ahk files with
        # A_IsCompiled == false, so it never exercises compiled-mode-only code
        # paths like Bundle_Init(). That gap let a 100%-reproducible startup
        # crash (unassigned A_LocalAppData — not a real AHK v2 built-in) ship
        # through fully-green CI. This step launches the actual compiled exe
        # and requires a nonce/PID/build-bound receipt after input/menu readiness,
        # durable error-free logs and the disposable probe's native exit code 0.
        #
        # The wait ends on process exit or a runtime error dialog. The bundle
        # marker is diagnostic only; it must never admit an incomplete boot.
        # Elapsed time is no verdict. The first launch expands about 550
        # files through Windows PowerShell while Defender scans each of them,
        # and this step took 8-19 s on the green runs 582-613, so the former
        # 20 s deadline read the slow end of a healthy extraction as a dialog
        # (run 613, green on re-run). The hang bound only stops a launch that
        # neither finishes nor raises a dialog.
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = "$env:RUNNER_TEMP\package\ergopti_plus\windows\ErgoptiPlus.exe"
          $launchRoot = Join-Path $env:RUNNER_TEMP ("ergopti-compiled-" + [guid]::NewGuid().ToString('N'))
          $env:LOCALAPPDATA = Join-Path $launchRoot 'local-app-data'
          $env:ERGOPTI_STARTUP_SMOKE_DIR = Join-Path $launchRoot 'startup'
          $env:ERGOPTI_STARTUP_SMOKE_NONCE = [guid]::NewGuid().ToString('N')
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA, $env:ERGOPTI_STARTUP_SMOKE_DIR -Force | Out-Null
          $receiptFile = Join-Path $env:ERGOPTI_STARTUP_SMOKE_DIR 'ready.json'
          $ergoptiDir = "$env:LOCALAPPDATA\Ergopti"
          $bundleDir = "$ergoptiDir\bundle"
          $markerFile = "$bundleDir\.bundle-version"
          $stdout = Join-Path $launchRoot 'stdout.txt'
          $stderr = Join-Path $launchRoot 'stderr.txt'
          # Six times the slowest green smoke measured when this bound was set.
          $hangBoundSeconds = 120

          # A failed or incomplete launch must leave fresh negative evidence;
          # diagnostic publication never changes the original native verdict.
          $startupEvidence = [ordered]@{
              schema_version = 1
              platform = 'windows'
              sha = $env:GITHUB_SHA
              runner = 'windows-latest'
              scenario = 'startup'
              package_sha256 = $null
              marker_seen = $false
              crashed_early = $null
              marker_seconds = $null
              failures = @('startup_incomplete')
              failure_phase = 'probe_setup'
              native_exit_code = $null
              elapsed_seconds = $null
              staging_seconds = $null
              dialog_seen = $null
              readiness_acknowledged = $false
              native_parent = [ordered]@{
                  pid = $null
                  expected_executable = [IO.Path]::GetFullPath($exe)
                  observed_executable = $null
                  start_utc = $null
                  identity_qualified = $false
              }
              native_descendant_observations = @()
              native_observer_status = 'not_observed'
          }
          function Save-StartupFailureEvidence {
              try {
                  $startupEvidence | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath "$env:RUNNER_TEMP/evidence.json" -Encoding utf8
              } catch {
                  # Retain the primary native exception/exit; do not copy private
                  # filesystem errors into a failure artifact or its annotation.
                  Write-Warning 'Startup failure evidence publication failed (detail omitted).' -WarningAction Continue
              }
          }
          try {
              $startupEvidence.package_sha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          } catch {
              # Unavailable remains null and cannot pass the mandatory verdict.
          }
          Save-StartupFailureEvidence

          # Compiled before the launch, so its one-off cost stays out of the timings.
          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class SmokeWindows
          {
              private delegate bool EnumWindowsProc(IntPtr window, IntPtr parameter);

              [DllImport("user32.dll")]
              private static extern bool EnumWindows(EnumWindowsProc callback, IntPtr parameter);

              [DllImport("user32.dll")]
              private static extern bool EnumChildWindows(IntPtr parent, EnumWindowsProc callback, IntPtr parameter);

              [DllImport("user32.dll")]
              private static extern uint GetWindowThreadProcessId(IntPtr window, out uint processId);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              private static extern int GetClassName(IntPtr window, StringBuilder name, int capacity);

              [DllImport("user32.dll")]
              private static extern bool IsWindowVisible(IntPtr window);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              private static extern IntPtr SendMessageTimeout(IntPtr window, uint message, IntPtr capacity,
                  StringBuilder text, uint flags, uint timeoutMs, out IntPtr result);

              private const uint WmGetText = 0x000D;
              private const uint SmtoAbortIfHung = 0x0002;
              // Every dialog-box window has this class: MsgBox and AutoHotkey's error dialog alike.
              private const string DialogClass = "#32770";

              private static string ClassOf(IntPtr window)
              {
                  var name = new StringBuilder(256);
                  GetClassName(window, name, name.Capacity);
                  return name.ToString();
              }

              // WM_GETTEXT, because GetWindowText cannot read a control of another process.
              private static string TextOf(IntPtr window)
              {
                  var text = new StringBuilder(2048);
                  IntPtr ignored;
                  SendMessageTimeout(window, WmGetText, (IntPtr)text.Capacity, text, SmtoAbortIfHung, 1000, out ignored);
                  return text.ToString();
              }

              // Hidden windows included: a process started hidden can own a hidden dialog.
              private static List<IntPtr> TopLevelWindows(int processId)
              {
                  var found = new List<IntPtr>();
                  EnumWindows((window, parameter) =>
                  {
                      uint owner;
                      GetWindowThreadProcessId(window, out owner);
                      if (owner == (uint)processId) found.Add(window);
                      return true;
                  }, IntPtr.Zero);
                  return found;
              }

              public static bool HasDialog(int processId)
              {
                  foreach (var window in TopLevelWindows(processId))
                      if (ClassOf(window) == DialogClass) return true;
                  return false;
              }

              public static List<string> Describe(int processId)
              {
                  var lines = new List<string>();
                  foreach (var window in TopLevelWindows(processId))
                  {
                      var windowClass = ClassOf(window);
                      lines.Add(string.Format("window class={0} visible={1} title='{2}'",
                          windowClass, IsWindowVisible(window), TextOf(window)));
                      if (windowClass != DialogClass) continue;
                      EnumChildWindows(window, (child, parameter) =>
                      {
                          var text = TextOf(child);
                          if (text.Length > 0)
                              lines.Add(string.Format("  control class={0} text='{1}'", ClassOf(child), text));
                          return true;
                      }, IntPtr.Zero);
                  }
                  return lines;
              }
          }
          '@

          # Evidence only: observations never authorize a handoff or replace the
          # original crash/marker/dialog verdict. Process argv is never printed.
          function Format-StartupEvidenceText([string]$Text, [int]$Limit = 2048) {
              if ($Text.Length -le $Limit) { return $Text }
              return $Text.Substring(0, $Limit) + " [truncated]"
          }

          function Write-StartupOwnershipEvidence([System.Diagnostics.Process]$Process) {
              Write-Host "---- native startup identity; observations are not handoff/readiness acknowledgements ----"
              Write-Host ($launchOwner | ConvertTo-Json -Compress)
              try {
                  $rows = @(Get-CimInstance Win32_Process -Property ProcessId, ParentProcessId, CreationDate, ExecutablePath -OperationTimeoutSec 2 -ErrorAction Stop)
                  $parentExitUtc = if ($Process.HasExited) { $Process.ExitTime.ToUniversalTime() } else { [DateTime]::UtcNow }
                  $frontier = @([pscustomobject]@{ Id = $Process.Id; Created = $launchOwner.start_utc; Until = $parentExitUtc; Qualified = $launchOwner.identity_qualified })
                  $seen = [System.Collections.Generic.HashSet[int]]::new()
                  $null = $seen.Add($Process.Id)
                  $observed = 0
                  $truncated = $false
                  for ($depth = 0; $depth -lt 4 -and $frontier.Count -gt 0; $depth++) {
                      $next = @()
                      foreach ($parent in $frontier) {
                          foreach ($row in $rows) {
                              if ($row.ParentProcessId -ne $parent.Id -or $seen.Contains([int]$row.ProcessId)) { continue }
                              if ($observed -ge 16) { $truncated = $true; continue }
                              $null = $seen.Add([int]$row.ProcessId)
                              $observed++
                              $created = if ($null -ne $row.CreationDate) { $row.CreationDate.ToUniversalTime() } else { $null }
                              $qualified = $parent.Qualified -and $null -ne $parent.Created -and $null -ne $created -and $created -ge $parent.Created -and $created -le $parent.Until
                              $observedPath = Format-StartupEvidenceText ([string]$row.ExecutablePath)
                              $sameExecutable = $null -ne $row.ExecutablePath -and [string]::Equals($row.ExecutablePath, $launchOwner.expected_executable, [StringComparison]::OrdinalIgnoreCase)
                              $receipt = [ordered]@{ pid = [int]$row.ProcessId; parent_pid = [int]$row.ParentProcessId; created_utc = $created; executable = $observedPath; lineage_qualified = [bool]$qualified; same_executable = [bool]$sameExecutable; depth = $depth + 1 }
                              Write-Host ($receipt | ConvertTo-Json -Compress)
                              # Closed observations are not native handoff or
                              # readiness acknowledgements; omit foreign paths.
                              $startupEvidence.native_descendant_observations += [ordered]@{
                                  pid = $receipt.pid
                                  parent_pid = $receipt.parent_pid
                                  created_utc = $receipt.created_utc
                                  lineage_qualified = $receipt.lineage_qualified
                                  same_executable = $receipt.same_executable
                                  depth = $receipt.depth
                              }
                              $next += [pscustomobject]@{ Id = [int]$row.ProcessId; Created = $created; Until = [DateTime]::UtcNow; Qualified = $qualified }
                          }
                      }
                      $frontier = $next
                  }
                  if ($frontier.Count -gt 0) { $truncated = $true }
                  $startupEvidence.native_observer_status = 'observed'
                  Write-Host (@{ descendant_observations = $observed; truncated = $truncated; status = 'observed' } | ConvertTo-Json -Compress)
              } catch {
                  $startupEvidence.native_observer_status = 'unavailable'
                  Write-Host (@{ status = 'unavailable'; cause = (Format-StartupEvidenceText $_.Exception.Message) } | ConvertTo-Json -Compress)
              }
              Write-Host "---- native startup log bytes; bounded tails never prove readiness ----"
              try {
                  # Resolve the same shared catalogue as the production logger.
                  $catalogJson = & python -c 'import json,pathlib,sys,tomllib; c=tomllib.loads(pathlib.Path(sys.argv[1]).read_text()); w=c["logs"]["windows"]; f=c["logs"]["files"]; print(json.dumps({"base":w["base"],"segments":[v.replace("{app}",c["app"]["folder_name"]) for v in w["segments"]],"prefix":f["unified_prefix"],"extension":f["extension"]}))' "$env:GITHUB_WORKSPACE\static\ergopti_plus\_shared\modules\paths\app_dirs.toml"
                  if ($LASTEXITCODE -ne 0) { throw "The native log catalogue could not be read (python exit $LASTEXITCODE)." }
                  $catalog = $catalogJson | ConvertFrom-Json -ErrorAction Stop
                  $logsDir = if (-not [string]::IsNullOrEmpty($env:ERGOPTI_STARTUP_SMOKE_DIR)) {
                      $env:ERGOPTI_STARTUP_SMOKE_DIR
                  } else {
                      [Environment]::GetEnvironmentVariable($catalog.base)
                  }
                  if ([string]::IsNullOrEmpty($logsDir)) { throw "The native log base environment is unavailable." }
                  foreach ($segment in $catalog.segments) { $logsDir = Join-Path $logsDir $segment }
                  $logNames = @('bootstrap.log', ($catalog.prefix + (Get-Date -Format 'yyyy-MM-dd') + $catalog.extension))
                  foreach ($name in $logNames) {
                      $logPath = Join-Path $logsDir $name
                      $stream = $null
                      try {
                          $stream = [IO.File]::Open($logPath, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::ReadWrite)
                          $length = $stream.Length
                          $count = [int][Math]::Min(4096, $length)
                          $null = $stream.Seek(-$count, [IO.SeekOrigin]::End)
                          $bytes = [byte[]]::new($count)
                          $read = $stream.Read($bytes, 0, $count)
                          $tail = [Text.Encoding]::UTF8.GetString($bytes, 0, $read)
                          $modified = [IO.File]::GetLastWriteTimeUtc($logPath)
                          Write-Host ([ordered]@{ log = $name; status = 'observed'; size_bytes = $length; read_bytes = $read; truncated = ($length -gt $read); modified_utc = $modified; modified_since_launch = ($null -ne $launchOwner.start_utc -and $modified -ge $launchOwner.start_utc); tail = $tail } | ConvertTo-Json -Compress)
                      } catch {
                          Write-Host (@{ log = $name; status = 'unavailable'; cause = (Format-StartupEvidenceText $_.Exception.Message) } | ConvertTo-Json -Compress)
                      } finally {
                          if ($null -ne $stream) { $stream.Dispose() }
                      }
                  }
              } catch {
                  Write-Host (@{ status = 'unavailable'; cause = (Format-StartupEvidenceText $_.Exception.Message) } | ConvertTo-Json -Compress)
              }
          }

          # Reads the live process, so it runs before the process is stopped.
          function Write-LaunchDiagnostics([System.Diagnostics.Process]$Process, [double]$Seconds, $StagingSeconds) {
              Write-Host "---- launch diagnostics, $([math]::Round($Seconds, 1)) s after launch ----"
              Write-StartupOwnershipEvidence $Process
              if ($null -eq $StagingSeconds) {
                  Write-Host "Staging directory: not observed during the wait"
              } else {
                  Write-Host "Staging directory: first observed $([math]::Round($StagingSeconds, 1)) s after launch"
              }
              if ($Process.HasExited) {
                  Write-Host "Process: exited with code $($Process.ExitCode)"
              } else {
                  Write-Host "Process: running as PID $($Process.Id); its top-level windows:"
                  try {
                      [SmokeWindows]::Describe($Process.Id) | ForEach-Object { Write-Host "  $_" }
                  } catch {
                      Write-Host "  unavailable: $($_.Exception.Message)"
                  }
              }
              Write-Host "Bundle tree under ${ergoptiDir}:"
              try {
                  Get-ChildItem -LiteralPath $ergoptiDir -Force | ForEach-Object {
                      if ($_.PSIsContainer) {
                          $files = @(Get-ChildItem -LiteralPath $_.FullName -Recurse -File -Force).Count
                          $marker = Join-Path $_.FullName '.bundle-version'
                          $version = '(no marker)'
                          if (Test-Path -LiteralPath $marker) { $version = "$(Get-Content -LiteralPath $marker -Raw)".Trim() }
                          Write-Host "  $($_.Name)\ files=$files marker=$version"
                      } else {
                          Write-Host "  $($_.Name) bytes=$($_.Length)"
                      }
                  }
              } catch {
                  Write-Host "  unavailable: $($_.Exception.Message)"
              }
              Write-Host "Embedded bundle archives left in ${env:TEMP}:"
              try {
                  $archives = @(Get-ChildItem -LiteralPath $env:TEMP -Filter 'ergopti_bundle_*.zip' -Force)
                  if ($archives.Count -eq 0) { Write-Host "  (none)" }
                  $archives | ForEach-Object { Write-Host "  $($_.Name) bytes=$($_.Length)" }
              } catch {
                  Write-Host "  unavailable: $($_.Exception.Message)"
              }
              try {
                  Write-Host "Defender real-time protection: $((Get-MpComputerStatus).RealTimeProtectionEnabled)"
              } catch {
                  Write-Host "Defender real-time protection: unavailable: $($_.Exception.Message)"
              }
              Write-Host "---- stdout ----"; Get-Content $stdout -ErrorAction SilentlyContinue
              Write-Host "---- stderr ----"; Get-Content $stderr -ErrorAction SilentlyContinue
          }

          # This is a resident tray app with a keyboard hook: never leave it
          # running on the runner, whatever the outcome.
          function Stop-LaunchedApp([System.Diagnostics.Process]$Process) {
              if (-not $Process.HasExited) {
                  Stop-Process -Id $Process.Id -Force -ErrorAction SilentlyContinue
              }
          }

          # /ErrorStdOut only routes LOAD-time errors (parse / missing include)
          # to stderr; a RUNTIME error like the one this step guards against
          # may raise a blocking dialog. Require the native ready receipt AND a
          # clean exit after boot; a bundle marker is only extraction diagnostics.
          $clock = [System.Diagnostics.Stopwatch]::StartNew()
          $launchedDigest = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $proc = Start-Process -FilePath $exe -ArgumentList "/ErrorStdOut" -WindowStyle Hidden -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          # Holding the handle keeps ExitCode readable once the process has exited.
          $null = $proc.Handle
          $launchOwner = [ordered]@{ pid = $proc.Id; expected_executable = [IO.Path]::GetFullPath($exe); observed_executable = $null; start_utc = $null; identity_qualified = $false; identity_error = $null }
          try {
              $launchOwner.start_utc = $proc.StartTime.ToUniversalTime()
              $actualLaunchPath = $proc.MainModule.FileName
              $launchOwner.observed_executable = Format-StartupEvidenceText $actualLaunchPath
              $launchOwner.identity_qualified = [string]::Equals($actualLaunchPath, $launchOwner.expected_executable, [StringComparison]::OrdinalIgnoreCase)
          } catch {
              $launchOwner.identity_error = Format-StartupEvidenceText $_.Exception.Message
          }

          $startupEvidence.failure_phase = 'wait'
          $startupEvidence.native_parent.pid = $launchOwner.pid
          $startupEvidence.native_parent.start_utc = $launchOwner.start_utc
          $startupEvidence.native_parent.identity_qualified = $launchOwner.identity_qualified
          if ($launchOwner.identity_qualified) {
              $startupEvidence.native_parent.observed_executable = $launchOwner.expected_executable
          }
          Save-StartupFailureEvidence

          $markerSeen = $false
          $dialogSeen = $false
          $stagingSeconds = $null
          try {
          while ($clock.Elapsed.TotalSeconds -lt $hangBoundSeconds) {
              # The moment Bundle_Init creates its staging directory splits the
              # launch time into interpreter start-up and the extraction itself.
              if ($null -eq $stagingSeconds -and (Test-Path -Path "${bundleDir}.staging-*")) {
                  $stagingSeconds = $clock.Elapsed.TotalSeconds
              }
              if ($proc.HasExited) { break }
              if (Test-Path -LiteralPath $markerFile) { $markerSeen = $true }
              if ([SmokeWindows]::HasDialog($proc.Id)) { $dialogSeen = $true; break }
              Start-Sleep -Milliseconds 250
          }
          $seconds = $clock.Elapsed.TotalSeconds
          $exitCode = $null
          if ($proc.HasExited) { $exitCode = $proc.ExitCode }
          $markerSeen = Test-Path -LiteralPath $markerFile
          $crashedEarly = -not (Test-Path -LiteralPath $receiptFile) -or $exitCode -ne 0

          if (-not $proc.HasExited -or $crashedEarly -or -not $markerSeen -or $dialogSeen) {
              $startupEvidence.failure_phase = 'verdict'
              $startupEvidence.failures = @('startup_guard_failed')
              $startupEvidence.marker_seen = $markerSeen
              $startupEvidence.crashed_early = $crashedEarly
              $startupEvidence.native_exit_code = $exitCode
              $startupEvidence.elapsed_seconds = [math]::Round($seconds, 3)
              $startupEvidence.staging_seconds = $stagingSeconds
              $startupEvidence.dialog_seen = $dialogSeen
              Save-StartupFailureEvidence
              Write-LaunchDiagnostics $proc $seconds $stagingSeconds
              Stop-LaunchedApp $proc
              Save-StartupFailureEvidence
              Write-Error "ErgoptiPlus.exe did not complete native readiness (exit=$exitCode, dialog=$dialogSeen) within ${hangBoundSeconds}s — see the diagnostics above."
              throw "ErgoptiPlus.exe did not complete native readiness (exit=$exitCode, dialog=$dialogSeen) within ${hangBoundSeconds}s."
          }
          $markerSeconds = [math]::Round($seconds, 1)
          $logs = @(Get-ChildItem -LiteralPath $env:ERGOPTI_STARTUP_SMOKE_DIR -Recurse -File -Filter '*.log')
          $loggedErrors = @($logs | Select-String -Pattern '\[(ERROR|FATAL)\]|the error window for' |
              ForEach-Object { "$($_.Path): $($_.Line)" })
          $observation = @{
              marker_seen = $markerSeen
              crashed_early = $crashedEarly
              marker_seconds = $markerSeconds
              native_startup = @{
                  nonce = $env:ERGOPTI_STARTUP_SMOKE_NONCE
                  pid = $proc.Id
                  executable = [IO.Path]::GetFullPath($exe)
                  launched_sha256 = $launchedDigest
                  exit_code = $exitCode
                  log_files = $logs.Count
                  logged_errors = $loggedErrors
                  receipt = Get-Content -LiteralPath $receiptFile -Raw -Encoding utf8 | ConvertFrom-Json
              }
          }
          $observationFile = Join-Path $launchRoot 'observation.json'
          [IO.File]::WriteAllText($observationFile, ($observation | ConvertTo-Json -Depth 6) + "`n", [Text.UTF8Encoding]::new($false))
          node tools/test/desktop-ci-evidence.cjs record-windows $observationFile $exe "$env:RUNNER_TEMP/evidence.json"
          if ($LASTEXITCODE -ne 0) { throw 'The native compiled startup evidence was refused.' }
          Write-Host "OK: the exact packaged ErgoptiPlus.exe reached input/menu readiness and exited cleanly after $markerSeconds s."
          "bundle_root=$bundleDir" >> $env:GITHUB_OUTPUT
          "local_app_data=$env:LOCALAPPDATA" >> $env:GITHUB_OUTPUT
          } finally {
              Stop-LaunchedApp $proc
          }

      - name: Qualify programmable hotstrings in the actual compiled package
        if: ${{ !cancelled() }}
        shell: pwsh
        timeout-minutes: 5
        env:
          ERGOPTI_PROBE_BUNDLE_ROOT: ${{ steps.compiled-startup.outputs.bundle_root }}
          ERGOPTI_PROBE_LOCAL_APP_DATA: ${{ steps.compiled-startup.outputs.local_app_data }}
        run: |
          ./tools/test/run-compiled-user-hotstrings.ps1 `
            -Executable "$env:RUNNER_TEMP/package/ergopti_plus/windows/ErgoptiPlus.exe" `
            -Checkout "$env:GITHUB_WORKSPACE" `
            -BundleRoot "$env:ERGOPTI_PROBE_BUNDLE_ROOT" `
            -LocalAppData "$env:ERGOPTI_PROBE_LOCAL_APP_DATA" `
            -StartupEvidence "$env:RUNNER_TEMP/evidence.json" `
            -EvidenceDirectory "$env:RUNNER_TEMP/windows-user-hotstrings-package-evidence"

      - name: Upload mandatory compiled programmable package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-user-hotstrings-package-evidence
          overwrite: true
          path: ${{ runner.temp }}/windows-user-hotstrings-package-evidence
          retention-days: 7
          if-no-files-found: error

      - name: Upload mandatory launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-launch-evidence
          overwrite: true
          path: ${{ runner.temp }}/evidence.json
          retention-days: 7
          if-no-files-found: error

  windows-ok:
    name: 'Verdict'
    needs: [test-ahk, e2e-ahk, package-windows, launch-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Download launch evidence
        uses: actions/download-artifact@v4
        with:
          pattern: windows-launch-evidence
          path: ${{ runner.temp }}/launch-evidence

      - name: Verify mandatory jobs and launch scenarios
        env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE: ${{ inputs.release }}
        run: node tools/test/desktop-ci-evidence.cjs verify windows "$RUNNER_TEMP/launch-evidence"
