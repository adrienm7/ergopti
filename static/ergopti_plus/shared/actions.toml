# --- Raccourcis Cmd (macOS) / Ctrl (Windows) ---
# cmd_[a-z] et cmd_shift_[a-z] sont générés dynamiquement côté HS.
# ctrl_[a-z] et ctrl_shift_[a-z] sont générés dynamiquement côté AHK.
# Ces entrées ne sont pas listées ici car trop nombreuses (52 chacun) ;
# les deux drivers les insèrent dans le picker après chargement du TOML.

[sg_actions._cmd_placeholder]
platform = "hs"
is_header = true

[sg_actions._cmd_shift_placeholder]
platform = "hs"
is_header = true

[sg_actions._hs_ctrl_placeholder]
platform = "hs"
is_header = true

[sg_actions._hs_ctrl_shift_placeholder]
platform = "hs"
is_header = true

[sg_actions._hs_option_placeholder]
