# .github/workflows/deploy-site.yml
#
# Publish the exact production bytes tested by a completed main/dev CI run.
# Every completed source change is eligible, including domain-only changes.
# The read-only receiver must finish before publication receives write permission.

name: Deploy site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      run_id:
        description: Exact successful canonical CI run containing the tested site
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Receive tested site without write permission
    # A failed, cancelled or dispatched CI run has no site to publish; the
    # admission below still refuses anything else this lets through.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.admit.outputs.source_sha }}
      target: ${{ steps.admit.outputs.target }}
      run_id: ${{ steps.admit.outputs.run_id }}
      build_artifact_id: ${{ steps.admit.outputs.build_artifact_id }}
      testbuild_artifact_id: ${{ steps.admit.outputs.testbuild_artifact_id }}
    steps:
      - name: Checkout trusted receiver
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Admit exact completed producer
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/site-deploy-admission.cjs admit "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/site-admission.json"

      - name: Checkout exact producer source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.admit.outputs.source_sha }}
          path: producer-source
          persist-credentials: false

      - name: Receive selected build artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.admit.outputs.build_artifact_id }}
          merge-multiple: true
          run-id: ${{ steps.admit.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/received-site

      - name: Receive selected browser proof
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.admit.outputs.testbuild_artifact_id }}
          merge-multiple: true
          run-id: ${{ steps.admit.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/received-testbuild

      - name: Verify tested bytes and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/site-deploy-admission.cjs verify "$RUNNER_TEMP/site-admission.json" "$RUNNER_TEMP/received-site/site" "$RUNNER_TEMP/received-site/build.json" "$RUNNER_TEMP/received-testbuild/site-testbuild.json" "$GITHUB_WORKSPACE/producer-source"

      - name: Retain admitted producer identity
        uses: actions/upload-artifact@v4
        with:
          name: site-deployment-admission
          path: ${{ runner.temp }}/site-admission.json
          if-no-files-found: error
          overwrite: true

  deploy:
    name: Publish received site — ${{ needs.preflight.outputs.target }}
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    concurrency:
      # Both targets update the same gh-pages branch; serialize their writes.
      group: deploy-site-gh-pages
      cancel-in-progress: false
    env:
      SITE_TARGET: ${{ needs.preflight.outputs.target }}
      SITE_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
    steps:
      - name: Checkout trusted receiver
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Checkout exact publication source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          path: producer-source

      - name: Receive admitted producer identity
        uses: actions/download-artifact@v4
        with:
          name: site-deployment-admission
          path: ${{ runner.temp }}/admission

      - name: Receive selected build artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.preflight.outputs.build_artifact_id }}
          merge-multiple: true
          run-id: ${{ needs.preflight.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/received-site

      - name: Receive selected browser proof
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.preflight.outputs.testbuild_artifact_id }}
          merge-multiple: true
          run-id: ${{ needs.preflight.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/received-testbuild

      - name: Verify tested bytes and source again
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/site-deploy-admission.cjs verify "$RUNNER_TEMP/admission/site-admission.json" "$RUNNER_TEMP/received-site/site" "$RUNNER_TEMP/received-site/build.json" "$RUNNER_TEMP/received-testbuild/site-testbuild.json" "$GITHUB_WORKSPACE/producer-source"

      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: producer-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SITE_SOURCE_SHA"
          case "$SITE_TARGET" in
              main) DEPLOY_DIR=.; LABEL=ergopti.fr/ ;;
              dev) DEPLOY_DIR=dev; LABEL=ergopti.fr/dev/ ;;
              *) exit 1 ;;
          esac
          SITE="$RUNNER_TEMP/received-site/site"
          cmp -- static/CNAME "$SITE/CNAME"
          if [[ "$SITE_TARGET" == main ]]; then
              test ! -e "$SITE/dev"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          GHP="$RUNNER_TEMP/gh-pages"
          test ! -e "$GHP"
          if git ls-remote --exit-code origin gh-pages > /dev/null 2>&1; then
              git fetch --depth=1 origin gh-pages
              git worktree add -b gh-pages "$GHP" FETCH_HEAD
          else
              git worktree add --orphan -b gh-pages "$GHP"
          fi
          if [[ "$DEPLOY_DIR" == "." ]]; then
              find "$GHP" -mindepth 1 -maxdepth 1 \
                     ! -name '.git' \
                     ! -name 'dev' \
                     -exec rm -rf {} +
              cp -r "$SITE"/. "$GHP"/
          else
              rm -rf "${GHP:?}/$DEPLOY_DIR"
              mkdir -p "$GHP/$DEPLOY_DIR"
              cp -r "$SITE"/. "$GHP/$DEPLOY_DIR/"
          fi
          cmp -- static/CNAME "$GHP/$DEPLOY_DIR/CNAME"
          touch "$GHP/.nojekyll"
          git -C "$GHP" add -A
          if git -C "$GHP" diff --cached --quiet; then
              echo "No changes to deploy — gh-pages already up to date."
              exit 0
          fi
          git -C "$GHP" commit -m "deploy: ${LABEL} from ${SITE_SOURCE_SHA} (${SITE_TARGET})"
          node "$GITHUB_WORKSPACE/tools/ci/site-deploy-admission.cjs" current "$RUNNER_TEMP/admission/site-admission.json"
          git -C "$GHP" push origin gh-pages
          echo "Deployed to ${LABEL}"
